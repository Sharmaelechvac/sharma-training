<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">590.8: temp overcurrent devices</title><desc id="d">Flow diagram of the two 590.8 checks: a reused overcurrent device must be examined for proper installation, proper maintenance, and no evidence of impending failure; a temporary service on a solidly grounded wye system over 150 volts to ground, up to 1000 volts phase-to-phase, must use current-limiting overcurrent devices.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">590.8: temp overcurrent devices</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Two checks before a device goes in</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 590.8(A), 590.8(B)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="190" width="800" height="560" rx="14" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="112.5" y="212" width="675" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="250" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">GATE 1 — A REUSED DEVICE? 590.8(A)</text><rect x="200" y="300" width="500" height="92" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="358" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">USED BREAKER OR FUSE</text><line x1="450" y1="392" x2="450" y2="442" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="110" y="442" width="680" height="178" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="492" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">EXAMINE IT BEFORE IT GOES IN</text><text x="450" y="540" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Installed right · maintained right</text><text x="450" y="582" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">No evidence of impending failure:</text><text x="450" y="624" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">arcing · overheating · damage</text><rect x="110" y="648" width="680" height="62" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="690" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">FAILS? IT DOES NOT GO IN</text><rect x="50" y="800" width="800" height="600" rx="14" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="112.5" y="822" width="675" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="860" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">GATE 2 — THE TEMP SERVICE 590.8(B)</text><rect x="150" y="908" width="600" height="138" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="952" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">SOLIDLY GROUNDED WYE</text><text x="450" y="994" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">OVER 150 V TO GROUND</text><text x="450" y="1036" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">UP TO 1000 V PHASE-TO-PHASE</text><line x1="450" y1="1046" x2="450" y2="1092" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="110" y="1092" width="680" height="118" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="1144" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">OCPDs MUST BE CURRENT-LIMITING</text><text x="450" y="1190" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">277/480 V IS THE COMMON CASE</text><rect x="110" y="1236" width="680" height="62" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1278" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">120/208 V: GATE 2 DOES NOT APPLY</text><text x="450" y="1352" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">2020 rule: no fault-current threshold</text></svg>