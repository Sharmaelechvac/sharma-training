<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" width="900" height="1450" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Patient care vicinity — no IG receptacles</title><desc id="d">Plan of a patient room: the patient care vicinity extends 6 feet beyond the bed. An isolated ground receptacle inside it is prohibited; outside it, an IG receptacle is permitted when wired per 517.16(B).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1450" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Patient care vicinity — no IG receptacles</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plan view. Vicinity per 517.2; rule per 517.16.</text><line x1="30" y1="1392" x2="870" y2="1392" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1430" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 517.16, 517.13, 250.146(D)</text><rect x="60" y="200" width="780" height="700" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="150" y="270" width="600" height="610" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="12 8"/><text x="450" y="330" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PATIENT CARE VICINITY</text><rect x="330" y="450" width="240" height="250" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="345" y="465" width="210" height="60" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="620" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">BED</text><line x1="150" y1="270" x2="150" y2="257" stroke="#1a2f61" stroke-width="2"/><line x1="330" y1="270" x2="330" y2="257" stroke="#1a2f61" stroke-width="2"/><line x1="150" y1="245" x2="330" y2="245" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="240.0" y="233" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft</text><text x="240.0" y="233" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft</text><circle cx="450" cy="880" r="26" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><line x1="434" y1="864" x2="466" y2="896" stroke="#c0392b" stroke-width="5"/><line x1="466" y1="864" x2="434" y2="896" stroke="#c0392b" stroke-width="5"/><text x="450" y="850" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">IG</text><circle cx="60" cy="575" r="26" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="60" y="585" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">IG</text><path d="M-0,0" stroke="#2e7d32" stroke-width="1" fill="none"/><text x="95" y="545" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="start">OK</text><circle cx="450" cy="880" r="40" fill="none" stroke="#c0392b" stroke-width="0"/><circle cx="505" cy="845" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="505" y="856" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="115" cy="610" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="115" y="621" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="60" y="1000" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  IG receptacle inside the vicinity:</text><text x="60" y="1046" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">    prohibited — 517.16(A).</text><text x="60" y="1092" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  IG receptacle outside the vicinity:</text><text x="60" y="1138" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">    permitted, wired per 517.16(B).</text><text x="60" y="1184" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  IG ground: green with yellow stripe(s).</text><text x="60" y="1230" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4  Box ground: green, no stripes — 517.13(B).</text></svg>