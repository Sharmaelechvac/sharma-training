<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1540" width="900" height="1540" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Garage Classification Map</title><desc id="d">Section through a major repair garage bay showing the 18 inch ceiling band for lighter-than-air fuels, the 18 inch floor band, and a pit below floor level, with numbered markers explained in a legend. Every classified answer turns on whether the ventilation 511.3 specifies is provided.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1540" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Mapa de clasificación del garaje</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Una bahía de reparación mayor, en corte</text><line x1="30" y1="1482" x2="870" y2="1482" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1520" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 511.3(A)-(D)</text><text x="870" y="1520" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="30" y1="262" x2="870" y2="262" stroke="#1a2f61" stroke-width="6"/><text x="30" y="240" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">TECHO</text><rect x="30" y="262" width="840" height="120" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="56" y="335" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">BANDA DEL TECHO</text><circle cx="745" cy="322" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="745" y="335" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="56" y="470" font-size="34" font-weight="700" fill="#5b6478" text-anchor="start">BAHÍA - ORDINARIA SOBRE LA BANDA DEL PISO</text><rect x="30" y="758" width="840" height="120" rx="0" fill="url(#hatchred)" stroke="#c0392b" stroke-width="3"/><text x="600" y="745" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">BANDA PISO</text><circle cx="620" cy="818" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="620" y="831" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="30" y1="878" x2="870" y2="878" stroke="#1a2f61" stroke-width="6"/><text x="30" y="922" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">PISO</text><rect x="600" y="878" width="220" height="150" rx="0" fill="url(#hatchred)" stroke="#c0392b" stroke-width="4"/><text x="710" y="945" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">FOSO</text><circle cx="710" cy="985" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="710" y="998" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="120" y="700" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">VEHÍCULO EN LA BAHÍA</text><path d="M120,830 L150,762 L255,735 L425,735 L475,782 L560,792 L560,830 Z" stroke="#1f2937" stroke-width="4" fill="#ffffff"/><circle cx="200" cy="850" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="4"/><circle cx="480" cy="850" r="28" fill="#ffffff" stroke="#1f2937" stroke-width="4"/><line x1="870" y1="262" x2="840" y2="262" stroke="#1a2f61" stroke-width="2"/><line x1="870" y1="382" x2="840" y2="382" stroke="#1a2f61" stroke-width="2"/><line x1="852" y1="262" x2="852" y2="382" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(840,322.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">18 in</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">18 in</text></g><line x1="870" y1="758" x2="840" y2="758" stroke="#1a2f61" stroke-width="2"/><line x1="870" y1="878" x2="840" y2="878" stroke="#1a2f61" stroke-width="2"/><line x1="852" y1="758" x2="852" y2="878" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(840,818.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">18 in</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">18 in</text></g><text x="30" y="1130" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">QUÉ SIGNIFICAN LAS MARCAS</text><text x="30" y="1196" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Piso: Div 2 sin ventilación; abierto a 4 ACH</text><text x="30" y="1248" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Foso: Div 1 sin ventilación; Div 2 a 6 ACH</text><text x="30" y="1300" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  Techo: Div 2 sin ventilación (gases combustibles)</text><text x="30" y="1352" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">La ventilación es parte de la clasificación.</text><text x="30" y="1404" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Estacionamiento / almacén: no clasificados.</text></svg>