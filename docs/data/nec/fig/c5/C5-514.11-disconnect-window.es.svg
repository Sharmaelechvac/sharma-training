<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The 20–100 ft window</title><desc id="d">Plan view of a fuel dispensing site: dispensers on an island inside a dashed classified area, an underground tank with a remote pump, and the emergency disconnect on the store wall within the 20 ft minimum to 100 ft maximum window.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La ventana de 20–100 ft</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta — una estación de combustible</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 514.11(A)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="56" y="276" width="400" height="320" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="3" stroke-dasharray="12 8"/><rect x="90" y="320" width="320" height="200" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="130" y="360" width="90" height="120" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><rect x="280" y="360" width="90" height="120" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="256" y="568" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">ÁREA CLASIFICADA</text><rect x="620" y="300" width="230" height="510" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="5"/><text x="735" y="352" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TIENDA</text><rect x="596" y="470" width="64" height="90" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><line x1="596" y1="515" x2="414" y2="424" stroke="#1a2f61" stroke-width="3" stroke-dasharray="8 6"/><line x1="596" y1="530" x2="394" y2="742" stroke="#1a2f61" stroke-width="3" stroke-dasharray="8 6"/><rect x="90" y="700" width="300" height="110" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="240" y="748" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">TANQUE SUBTERRÁNEO</text><text x="240" y="790" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">+ BOMBA REMOTA</text><line x1="410" y1="560" x2="410" y2="680" stroke="#1a2f61" stroke-width="2"/><line x1="596" y1="560" x2="596" y2="680" stroke="#1a2f61" stroke-width="2"/><line x1="410" y1="668" x2="596" y2="668" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="503.0" y="656" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">20 ft min – 100 ft max</text><text x="503.0" y="656" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">20 ft min – 100 ft max</text><text x="560" y="720" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">DESCONEXIÓN EMERG.</text><circle cx="250" cy="296" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="250" y="308" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="66" cy="812" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="66" y="824" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="88" cy="296" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="88" y="308" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="628" cy="438" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="628" y="450" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="60" y="902" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">UNA SOLA OPERACIÓN DEBE CORTAR</text><text x="60" y="954" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  Dispositivos dispensadores</text><text x="60" y="1002" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  Bombas remotas que los sirven</text><text x="60" y="1050" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  Área clasificada (rojo discontinuo)</text><text x="60" y="1098" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4  Desconexión de emergencia, identificada</text><text x="60" y="1170" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Abre todos los conductores del circuito a la vez —</text><text x="60" y="1216" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">incluido el conductor puesto a tierra (neutro).</text><rect x="60" y="1252" width="810" height="64" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1293" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Muy cerca también falla — rearme manual solo</text><text x="450" y="1396" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Varias desconexiones deben interconectarse.</text></svg>