<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 517 — two ground paths</title><desc id="d">A branch circuit in a patient care space has two independent equipment grounding paths: the metal raceway itself, which qualifies as an equipment grounding conductor, and an insulated copper equipment grounding conductor inside it. Both land on the grounding terminal of a hospital-grade receptacle, identified by a green dot.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 517 — two ground paths</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Patient care space branch circuit (517.13)</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 517.13, 517.18(B)</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="330" width="220" height="270" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><text x="160" y="405" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><text x="160" y="500" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">GROUND BUS</text><line x1="74" y1="545" x2="246" y2="545" stroke="#2e7d32" stroke-width="8"/><rect x="270" y="420" width="320" height="130" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="6"/><line x1="270" y1="455" x2="590" y2="455" stroke="#1f2937" stroke-width="5"/><line x1="270" y1="485" x2="590" y2="485" stroke="#5b6478" stroke-width="5"/><line x1="270" y1="515" x2="590" y2="515" stroke="#2e7d32" stroke-width="6"/><line x1="430" y1="409" x2="430" y2="420" stroke="#1a2f61" stroke-width="3"/><circle cx="430" cy="385" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="430" y="397" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="430" y1="550" x2="430" y2="576" stroke="#1a2f61" stroke-width="3"/><circle cx="430" cy="600" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="430" y="612" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="590" y="350" width="260" height="260" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="5"/><circle cx="695" cy="440" r="34" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="695" cy="540" r="34" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="682" y1="428" x2="682" y2="452" stroke="#1a2f61" stroke-width="5"/><line x1="708" y1="428" x2="708" y2="452" stroke="#1a2f61" stroke-width="5"/><line x1="682" y1="528" x2="682" y2="552" stroke="#1a2f61" stroke-width="5"/><line x1="708" y1="528" x2="708" y2="552" stroke="#1a2f61" stroke-width="5"/><circle cx="800" cy="385" r="14" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="720" y="678" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">HOSPITAL GRADE</text><text x="720" y="722" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">GREEN DOT ON FACE</text><rect x="60" y="800" width="780" height="120" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="852" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NM CABLE ALONE = NO QUALIFYING</text><text x="450" y="900" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">GROUND PATH IN A PATIENT CARE SPACE</text><text x="60" y="1010" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">1 — The metal raceway itself is path one,</text><text x="60" y="1049" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">an equipment grounding conductor (250.118).</text><text x="60" y="1088" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">2 — An insulated copper EGC inside it is</text><text x="60" y="1127" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">path two, sized by Table 250.122.</text><text x="60" y="1166" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">Both land on the receptacle ground screw.</text></svg>