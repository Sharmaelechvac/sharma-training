width="4"/><text x="75" y="782" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">EJEMPLO RESUELTO</text><text x="75" y="850" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">180,000 VA de escenario conectados</text><text x="75" y="898" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">50,000 x 100%  =  50,000 VA</text><text x="75" y="946" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">50,000 x 75%    =  37,500 VA</text><text x="75" y="994" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">80,000 x 60%    =  48,000 VA</text><line x1="75" y1="1038" x2="825" y2="1038" stroke="#F0A846" stroke-width="3"/><text x="75" y="1076" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Demanda del alimentador = 135,500 VA</text><text x="50" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Al 100% se sobredimensiona el alimentador —</text><text x="50" y="1204" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">la tabla es la regla, no un favor.</text></svg>