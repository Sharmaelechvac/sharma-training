ke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 555.3</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="40" y1="420" x2="860" y2="420" stroke="#F0A846" stroke-width="6" stroke-dasharray="16 10"/><text x="100" y="400" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PLANO DE REFERENCIA</text><rect x="120" y="640" width="620" height="40" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="180" y="680" width="90" height="60" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><rect x="655" y="680" width="80" height="60" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="380" y="630" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">CUBIERTA FLOTANTE</text><rect x="40" y="800" width="820" height="190" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="960" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">NIVEL DEL AGUA</text><line x1="40" y1="800" x2="860" y2="800" stroke="#264387" stroke-width="4"/><rect x="560" y="470" width="110" height="170" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="615" cy="555" r="34" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="615" y="567" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">R</text><text x="545" y="500" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="end">✓ POR ENCIMA</text><text x="545" y="545" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="end">DEL PLANO</text><rect x="300" y="700" width="80" height="70" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="400" y="725" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">✗ BAJO EL PLANO</text><text x="400" y="770" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">NO PERMITIDO</text><line x1="70" y1="420" x2="70" y2="800" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(58,610.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">30 in sobre el agua</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">30 in sobre el agua</text></g><line x1="790" y1="420" x2="790" y2="640" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(778,530.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 in mín. sobre cubierta</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">12 in mín. sobre cubierta</text></g><text x="60" y="1090" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Nada de lo restringido va bajo la línea.</text><text x="60" y="1129" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Reverifique si cambian las alturas de cubierta.</text></svg>