<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" width="900" height="1450" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 510 — the gateway</title><desc id="d">Flow chart: a named occupancy sends you to its own article, which pre-decides the classification; Articles 500 through 503 then supply the wiring and equipment rules inside the classified areas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1450" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 510 — the gateway</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The occupancy article first, then Articles 500–503.</text><line x1="30" y1="1392" x2="870" y2="1392" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1430" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 510; Articles 500–503, 511–516</text><rect x="90" y="190" width="720" height="100" rx="14" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="255" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">IS THE JOB A NAMED OCCUPANCY?</text><line x1="450" y1="290" x2="450" y2="330" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="10" y="345" width="168" height="155" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="94" y="402" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">511</text><text x="94" y="448" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Garages</text><rect x="186" y="345" width="168" height="155" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="270" y="402" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">513</text><text x="270" y="448" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Hangars</text><rect x="362" y="345" width="168" height="155" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="446" y="402" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">514</text><text x="446" y="448" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Fuel</text><text x="446" y="486" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">dispensing</text><rect x="538" y="345" width="168" height="155" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="622" y="402" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">515</text><text x="622" y="448" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Bulk</text><text x="622" y="486" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">plants</text><rect x="714" y="345" width="168" height="155" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="798" y="402" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">516</text><text x="798" y="448" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Spray</text><text x="798" y="486" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">work</text><line x1="450" y1="500" x2="450" y2="540" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="555" width="720" height="110" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="600" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">THE OCCUPANCY ARTICLE PRE-DECIDES</text><text x="450" y="645" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">WHERE THE CLASSIFIED AREAS ARE</text><line x1="450" y1="665" x2="450" y2="705" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="720" width="720" height="110" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="765" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">THEN ARTICLES 500–503 SUPPLY</text><text x="450" y="810" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">WIRING, SEALS AND EQUIPMENT RULES</text><rect x="90" y="880" width="720" height="190" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="935" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">NEC 2023 CHANGE — NOT A 2020 RULE</text><text x="450" y="990" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">New Article 512: cannabis oil equipment</text><text x="450" y="1036" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">and systems using flammable materials.</text><text x="450" y="1170" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Health care (517) and assembly (518) follow</text><text x="450" y="1214" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">in the chapter — they are not 510 gateways.</text></svg>