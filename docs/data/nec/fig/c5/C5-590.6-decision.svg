<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">GFCI or the Grounding Program</title><desc id="d">Decision chart for temporary power receptacles under 590.6: a receptacle on the 590.6(A) list gets GFCI protection for personnel; a receptacle outside the list gets GFCI protection or a written assured equipment grounding conductor program with tests at intervals not exceeding 3 months and records available to the AHJ.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">GFCI or the Grounding Program</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Receptacles used for temporary power</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 590.6 - OSHA 29 CFR 1926.404(b)(1)(iii)</text><rect x="110" y="210" width="680" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="268" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">RECEPTACLE USED FOR</text><text x="450" y="318" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TEMPORARY POWER</text><line x1="450" y1="340" x2="450" y2="395" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="110" y="400" width="680" height="265" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="462" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">ON THE 590.6(A) LIST?</text><text x="450" y="522" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">125 V, 15/20/30 A - not permanent wiring</text><text x="450" y="566" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">any rating used for temp power, incl.</text><text x="450" y="610" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">the building's own receptacles</text><text x="450" y="654" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">generator outlets - 15 kW or less</text><line x1="450" y1="665" x2="235" y2="665" stroke="#1a2f61" stroke-width="4"/><line x1="235" y1="665" x2="235" y2="720" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="450" y1="665" x2="665" y2="665" stroke="#1a2f61" stroke-width="4"/><line x1="665" y1="665" x2="665" y2="720" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="150" y="678" width="81" height="50" rx="25" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="190.5" y="714" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">YES</text><rect x="580" y="678" width="63" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="611.5" y="714" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">NO</text><rect x="40" y="730" width="390" height="280" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="235" y="800" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="middle">GFCI PROTECTION</text><text x="235" y="868" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">for personnel -</text><text x="235" y="912" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">required, with no</text><text x="235" y="956" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">program alternative</text><rect x="470" y="730" width="390" height="280" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="665" y="795" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">GFCI - OR THE</text><text x="665" y="847" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">PROGRAM</text><text x="665" y="905" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">written assured</text><text x="665" y="947" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">grounding program</text><text x="665" y="989" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">- 590.6(B)</text><rect x="110" y="1070" width="680" height="230" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="1135" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">THE PROGRAM MEANS PAPERWORK</text><text x="450" y="1195" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">tests before first use, after damage</text><text x="450" y="1239" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">or repair, and every 3 months or less</text><text x="450" y="1283" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">records kept for the AHJ</text><rect x="40" y="1360" width="820" height="180" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1430" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">NO PAPERWORK = NO PROGRAM</text><text x="450" y="1490" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">OSHA adds tagging / color coding; the</text><text x="450" y="1534" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">6-month interval is OSHA's, fixed cords only</text></svg>