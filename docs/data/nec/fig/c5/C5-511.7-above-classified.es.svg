<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">511.7 — Sobre el área clasificada</title><desc id="d">Elevación de bahía de taller: área clasificada en el piso, línea discontinua de 12 ft, luminaria arriba de ella, motor con arco cerrado dentro de 12 ft, elevador subiendo un vehículo hacia una luminaria de pared baja.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">511.7 — Sobre el área clasificada</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Bahía de taller comercial, corte.</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 511.7</text><text x="870" y="1460" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Manual de Campo Sharma</text><rect x="60" y="1010" width="780" height="140" rx="0" fill="url(#hatchred)" stroke="#c0392b" stroke-width="3"/><text x="415" y="1098" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">ÁREA CLASIFICADA EN EL PISO (511.3)</text><line x1="30" y1="1150" x2="870" y2="1150" stroke="#1f2937" stroke-width="6"/><rect x="30" y="1150" width="840" height="55" rx="0" fill="url(#earth)" stroke="none" stroke-width="0"/><line x1="60" y1="470" x2="840" y2="470" stroke="#F0A846" stroke-width="5" stroke-dasharray="14 10"/><text x="830" y="456" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="end">LÍNEA DE 12 FT</text><line x1="40" y1="470" x2="40" y2="1150" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(72,810.0) rotate(-90)"><text x="0" y="0" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 ft</text><text x="0" y="0" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">12 ft</text></g><line x1="450" y1="300" x2="450" y2="380" stroke="#1f2937" stroke-width="4"/><rect x="380" y="380" width="140" height="60" rx="8" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="362" y="422" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="end">LUMINARIA</text><circle cx="562" cy="410" r="24" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="562" y="422" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="middle">✓</text><text x="300" y="668" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">equipo con arco a 12 ft:</text><text x="300" y="710" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">cerrado o protegido</text><rect x="110" y="760" width="180" height="140" rx="8" fill="#eef2f9" stroke="#F0A846" stroke-width="6"/><text x="200" y="845" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">MOTOR</text><rect x="765" y="700" width="26" height="450" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="540" y="830" width="225" height="45" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="752" y="812" font-size="30" font-weight="700" fill="#5b6478" text-anchor="end">el elevador sube vehículos</text><line x1="855" y1="300" x2="855" y2="1150" stroke="#1f2937" stroke-width="5"/><rect x="793" y="620" width="62" height="60" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><line x1="793" y1="620" x2="855" y2="680" stroke="#c0392b" stroke-width="4"/><line x1="855" y1="620" x2="793" y2="680" stroke="#c0392b" stroke-width="4"/><text x="850" y="596" font-size="30" font-weight="800" fill="#c0392b" text-anchor="end">luminaria en zona del elevador</text><text x="40" y="1285" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Arriba: canaleta metálica, AC, MC</text><text x="40" y="1337" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Chispas y partículas fuera de la zona</text><text x="40" y="1389" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Alturas medidas desde el piso</text></svg>