<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">500.8: Read the whole nameplate</title><desc id="d">Generic equipment nameplate with numbered callouts for class, division, group and temperature code, a T1 to T6 temperature ladder, and a pass/fail check against a gas that ignites at 180 degrees C.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">500.8: Lea toda la placa de datos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Placa genérica. Código T = temp. máx. de superficie.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 500.8, Tabla 500.8(C)</text><rect x="50" y="210" width="520" height="380" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="75" y="268" font-size="34" font-weight="800" fill="#264387" text-anchor="start">PLACA DE DATOS</text><text x="75" y="340" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">CLASE</text><text x="310" y="340" font-size="38" font-weight="800" fill="#1f2937" text-anchor="start">I</text><circle cx="600" cy="328" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="600" y="338" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><line x1="75" y1="362" x2="545" y2="362" stroke="#c9d2e3" stroke-width="2"/><text x="75" y="410" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">DIVISIÓN</text><text x="310" y="410" font-size="38" font-weight="800" fill="#1f2937" text-anchor="start">1</text><circle cx="600" cy="398" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="600" y="408" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><line x1="75" y1="432" x2="545" y2="432" stroke="#c9d2e3" stroke-width="2"/><text x="75" y="480" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">GRUPO</text><text x="310" y="480" font-size="38" font-weight="800" fill="#1f2937" text-anchor="start">D</text><circle cx="600" cy="468" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="600" y="478" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><line x1="75" y1="502" x2="545" y2="502" stroke="#c9d2e3" stroke-width="2"/><text x="75" y="550" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">CÓDIGO TEMP.</text><text x="310" y="550" font-size="38" font-weight="800" fill="#1f2937" text-anchor="start">T4 — 135°C</text><circle cx="600" cy="538" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="600" y="548" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="750" y="200" font-size="34" font-weight="800" fill="#264387" text-anchor="middle">CÓDIGOS T</text><rect x="640" y="230" width="220" height="60" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="750" y="270" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">T1 · 450°C</text><rect x="640" y="290" width="220" height="60" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="750" y="330" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">T2 · 300°C</text><rect x="640" y="350" width="220" height="60" rx="0" fill="#fdf3e0" stroke="#1a2f61" stroke-width="3"/><text x="750" y="390" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">T3 · 200°C</text><rect x="640" y="410" width="220" height="60" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="750" y="450" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">T4 · 135°C</text><rect x="640" y="470" width="220" height="60" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="750" y="510" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">T5 · 100°C</text><rect x="640" y="530" width="220" height="60" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="750" y="570" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">T6 · 85°C</text><text x="750" y="640" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">caliente → frío</text><text x="50" y="720" font-size="32" font-weight="800" fill="#264387" text-anchor="start">EN LA PLACA</text><circle cx="72" cy="765" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="72" y="775" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="110" y="775" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Clase — tipo de material en el aire</text><circle cx="72" cy="820" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="72" y="830" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="110" y="830" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">División — con qué frecuencia está presente</text><circle cx="72" cy="875" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="72" y="885" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="110" y="885" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Grupo — el gas, vapor o polvo exacto</text><circle cx="72" cy="930" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="72" y="940" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="110" y="940" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Código T — superficie más caliente del equipo</text><text x="50" y="1010" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">EL ERROR QUE REPRUEBA EL TRABAJO</text><rect x="50" y="1040" width="800" height="150" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="80" y="1095" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">El gas se enciende a 180°C</text><text x="80" y="1148" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">Equipo T3 — superficie a 200°C  →  NO PASA</text><rect x="50" y="1220" width="800" height="150" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="80" y="1275" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">El gas se enciende a 180°C</text><text x="80" y="1328" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">Equipo T4 — máx. de superficie 135°C  →  OK</text></svg>