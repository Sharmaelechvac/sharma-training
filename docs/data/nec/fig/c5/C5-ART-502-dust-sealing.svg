<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1620" width="900" height="1620" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Art. 502 — keep the dust out</title><desc id="d">Section showing a dust-ignitionproof starter enclosure with a dust layer on top, and the three 502.15 ways to keep dust out of it: a permanent effective seal, a horizontal raceway at least 10 ft long, or a vertical raceway at least 5 ft long extending downward.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1620" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Art. 502 — keep the dust out</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Section — three ways to protect one box</text><line x1="30" y1="1562" x2="870" y2="1562" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 502.15, 502.10</text><text x="870" y="1600" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="200" width="820" height="26" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="320" y="186" width="260" height="14" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="2"/><circle cx="345" cy="193" r="3" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="385" cy="193" r="3" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="425" cy="193" r="3" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="465" cy="193" r="3" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="505" cy="193" r="3" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="545" cy="193" r="3" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="308" y="198" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="end">DUST LAYER</text><rect x="330" y="226" width="240" height="150" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="312" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">STARTER</text><text x="450" y="418" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">dust-ignitionproof enclosure</text><rect x="60" y="511" width="171" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="145.5" y="547" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OPTION 1</text><text x="265" y="545" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Permanent, effective seal</text><line x1="120" y1="640" x2="780" y2="640" stroke="#1f2937" stroke-width="8"/><rect x="420" y="613" width="54" height="54" rx="0" fill="#F0A846" stroke="#264387" stroke-width="3"/><text x="450" y="600" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">SEAL</text><text x="120" y="725" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Sealing fitting or putty — stays accessible</text><rect x="60" y="846" width="171" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="145.5" y="882" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OPTION 2</text><text x="265" y="880" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Horizontal raceway</text><line x1="120" y1="975" x2="780" y2="975" stroke="#1f2937" stroke-width="8"/><line x1="120" y1="1055" x2="780" y2="1055" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="1095" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft min</text><text x="450.0" y="1095" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">10 ft min</text><rect x="60" y="1181" width="171" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="145.5" y="1217" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OPTION 3</text><text x="265" y="1215" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Vertical raceway, downward</text><line x1="220" y1="1300" x2="220" y2="1470" stroke="#1f2937" stroke-width="8"/><rect x="193" y="1273" width="54" height="54" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="310" y1="1300" x2="310" y2="1470" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(298,1385.0) rotate(-90)"><text x="0" y="0" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">5 ft min</text><text x="0" y="0" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">5 ft min</text></g><text x="370" y="1400" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Extends downward from the box</text></svg>