<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">551.71: the RV site pedestal</title><desc id="d">Elevation of an RV site pedestal with a 50-ampere 125/250-volt receptacle, a 30-ampere TT-30 receptacle and a 20-ampere 125-volt receptacle, its own disconnect and overcurrent protection, and the park receptacle mix: at least 70 percent of sites with 30 amperes and at least 40 percent of new sites with 50 amperes.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">551.71: the RV site pedestal</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Site supply equipment — repeated at every site</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 551.71, 551.73, Table 551.73(A)</text><rect x="90" y="230" width="380" height="700" rx="16" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="280" y="292" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">SITE PEDESTAL</text><circle cx="185" cy="400" r="52" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="280" y="412" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">50 A  125/250 V</text><circle cx="185" cy="590" r="52" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="280" y="602" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">30 A  TT-30</text><circle cx="185" cy="780" r="52" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="280" y="792" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">20 A  125 V</text><line x1="90" y1="880" x2="470" y2="880" stroke="#c9d2e3" stroke-width="3"/><text x="280" y="922" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle"></text><rect x="255" y="930" width="50" height="120" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="60" y1="1050" x2="500" y2="1050" stroke="#1f2937" stroke-width="5"/><text x="50" y="1140" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">1  Disconnect + overcurrent at the site</text><text x="50" y="1186" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">2  Every 50 A site also carries a 30 A</text><text x="50" y="1232" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">3  Ground-fault protection as required</text><text x="50" y="1278" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">4  Listed equipment — not a plain post</text><rect x="50" y="1360" width="800" height="190" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="75" y="1422" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">THE PARK MIX (551.71)</text><text x="75" y="1482" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">70% of sites or more: 30 A receptacle</text><text x="75" y="1528" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">40% of new sites or more: 50 A receptacle</text></svg>