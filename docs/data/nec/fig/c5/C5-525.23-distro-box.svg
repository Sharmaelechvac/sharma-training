t-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">125 V</text><text x="450" y="512" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">GFCI</text><text x="450" y="550" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">PROTECTED</text><circle cx="110" cy="360" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="110" y="372" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="590" y="360" width="200" height="210" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="5"/><text x="690" y="420" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">EGRESS</text><text x="690" y="464" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">LIGHTING</text><text x="690" y="512" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">NO GFCI</text><text x="690" y="550" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">(C)</text><circle cx="590" cy="360" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="590" y="372" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="450" y="660" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">TEST EVERY GFCI AT SETUP</text><line x1="70" y1="790" x2="830" y2="790" stroke="#264387" stroke-width="6"/><text x="450" y="842" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">PUBLIC STANDING ON GRADE — ASSUME WET</text><rect x="70" y="890" width="760" height="240" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><circle cx="96" cy="916" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="96" y="928" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="450" y="962" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">RIDE DISCONNECT — UP ON THE FRAME</text><text x="450" y="1014" font-size="32" font-weight="600" fill="#1f2937" text-anch