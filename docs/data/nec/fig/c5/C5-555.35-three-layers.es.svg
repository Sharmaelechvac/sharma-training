<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Marina ground-fault layers</title><desc id="d">Three stacked bands showing the 2020 marina ground-fault layers: shore power receptacle GFPE at 30 milliamperes, Class A GFCI at 4 to 6 milliamperes for other receptacles, and feeder GFPE at 100 milliamperes.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Capas de falla a tierra en la marina</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tres capas, tres funciones distintas — NEC 2020</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 555.35</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="210" width="800" height="220" rx="12" fill="#264387" stroke="#264387" stroke-width="4"/><text x="85" y="276" font-size="40" font-weight="800" fill="#ffffff" text-anchor="start">CAPA 1 — EN EL RECEPTÁCULO</text><text x="85" y="332" font-size="33" font-weight="600" fill="#ffffff" text-anchor="start">Receptáculo de energía de muelle — GFPE</text><text x="85" y="382" font-size="33" font-weight="600" fill="#ffffff" text-anchor="start">Dispara a 30 mA máx. — protege el equipo</text><rect x="50" y="470" width="800" height="220" rx="12" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="85" y="536" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CAPA 2 — PARA LAS PERSONAS</text><text x="85" y="592" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Receptáculos de 15/20 A — GFCI Clase A</text><text x="85" y="642" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Dispara a 4–6 mA — protege a las personas</text><rect x="50" y="730" width="800" height="220" rx="12" fill="#264387" stroke="#264387" stroke-width="4"/><text x="85" y="796" font-size="40" font-weight="800" fill="#ffffff" text-anchor="start">CAPA 3 — EL ALIMENTADOR</text><text x="85" y="852" font-size="33" font-weight="600" fill="#ffffff" text-anchor="start">Alimentador + circuitos ramales — GFPE</text><text x="85" y="902" font-size="33" font-weight="600" fill="#ffffff" text-anchor="start">Dispara a 100 mA máx. — protege el tramo</text><rect x="50" y="1010" width="800" height="130" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="85" y="1062" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">El GFPE NO es un GFCI. Es otro dispositivo,</text><text x="85" y="1108" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">otro nivel de disparo, otra función.</text></svg>