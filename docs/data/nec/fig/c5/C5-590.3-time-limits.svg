<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Temporary power — time limits</title><desc id="d">The four time rules of 590.3: construction work lasts for the duration of the work, holiday decorative lighting is capped at 90 days, emergencies and tests last only while the need lasts, and all temporary wiring is removed immediately when its purpose ends.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1340" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Temporary power — time limits</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Every use ends the same way: it comes out</text><line x1="30" y1="1282" x2="870" y2="1282" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1320" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 590.3(A)–(D)</text><text x="870" y="1320" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="210" width="780" height="180" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="60" y="210" width="18" height="180" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="104" y="288" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">590.3(A) — Construction work</text><text x="104" y="346" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Permitted for the duration of the work</text><rect x="60" y="420" width="780" height="180" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="60" y="420" width="18" height="180" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="104" y="498" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">590.3(B) — Holiday decorative</text><text x="104" y="556" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Hard limit: 90 days, then it comes out</text><rect x="60" y="630" width="780" height="180" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="60" y="630" width="18" height="180" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="104" y="708" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">590.3(C) — Emergencies, tests</text><text x="104" y="766" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Only for the duration of the need</text><rect x="60" y="840" width="780" height="180" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><rect x="60" y="840" width="18" height="180" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="104" y="918" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">590.3(D) — Removal</text><text x="104" y="976" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Out immediately when the purpose ends</text></svg>