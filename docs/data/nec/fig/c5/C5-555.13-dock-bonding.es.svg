<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1780" width="900" height="1780" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Marina bonding — one system</title><desc id="d">Plan of a dock: an 8 AWG solid copper bonding conductor ties the boat lift frame, boarding ladder and metal piping back to the grounding bus of the panelboard that serves the dock.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1780" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Unión en la marina — un solo sistema</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plano: metales del muelle unidos al tablero</text><line x1="30" y1="1722" x2="870" y2="1722" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1760" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 555.13, 555.3, 555.35</text><rect x="60" y="200" width="300" height="700" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="210" y="260" font-size="34" font-weight="800" fill="#5b6478" text-anchor="middle">TIERRA</text><rect x="85" y="330" width="250" height="240" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="210" y="392" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">TABLERO</text><rect x="78" y="420" width="264" height="54" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="192" y="458" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">BARRA DE TIERRA</text><circle cx="340" cy="330" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="340" y="342" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="360" y="520" width="480" height="56" rx="0" fill="#c9d2e3" stroke="#264387" stroke-width="4"/><text x="600" y="500" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">CUBIERTA DEL MUELLE</text><rect x="360" y="576" width="480" height="560" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="600" y="1110" font-size="34" font-weight="800" fill="#5b6478" text-anchor="middle">AGUA</text><rect x="560" y="640" width="200" height="150" rx="0" fill="none" stroke="#264387" stroke-width="6"/><path d="M 580 760 Q 660 700 740 760 L 730 790 L 590 790 Z" stroke="#264387" stroke-width="4" fill="#ffffff"/><text x="660" y="850" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">ELEVADOR DE BOTES</text><circle cx="560" cy="640" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="560" y="652" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><line x1="452" y1="576" x2="452" y2="900" stroke="#264387" stroke-width="5"/><line x1="488" y1="576" x2="488" y2="900" stroke="#264387" s