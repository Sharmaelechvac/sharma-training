<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">545: The two joints that matter</title><desc id="d">Two factory-built building sections joined on site, with a gold marker at the listed interconnection joint between the sections and a second marker at the service connection, plus a factory versus site inspection panel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">545: Las dos uniones que importan</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Construido en fábrica. Unido en el sitio.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 545</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><path d="M60,300 L240,232 L420,300" stroke="#264387" stroke-width="5" fill="none"/><path d="M480,300 L660,232 L840,300" stroke="#264387" stroke-width="5" fill="none"/><rect x="60" y="300" width="360" height="260" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="480" y="300" width="360" height="260" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="420" y="300" width="60" height="260" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="240" y="425" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">FÁBRICA</text><text x="240" y="472" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SECCIÓN A</text><text x="660" y="425" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">FÁBRICA</text><text x="660" y="472" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SECCIÓN B</text><line x1="40" y1="560" x2="860" y2="560" stroke="#1f2937" stroke-width="5"/><circle cx="450" cy="600" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="450" y="610" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="812" cy="522" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="812" y="532" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="50" y="700" font-size="32" font-weight="800" fill="#264387" text-anchor="start">LAS DOS UNIONES</text><circle cx="72" cy="745" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="72" y="755" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="110" y="755" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Unión de sección: sistema de conexión listado</text><text x="110" y="797" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">del fabricante y sus instrucciones</text><circle cx="72" cy="855" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="72" y="865" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="110" y="865" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Unión de acometida: reglas ordinarias de acometida y</text><text x="110" y="907" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">alimentador una vez instalado el edificio</text><rect x="50" y="980" width="395" height="150" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="247" y="1042" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">INSPECCIÓN FÁBRICA</text><text x="247" y="1092" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">programa modular estatal</text><rect x="455" y="980" width="395" height="150" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="652" y="1042" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">INSPECCIÓN EN SITIO</text><text x="652" y="1092" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">AHJ local</text><text x="450" y="1195" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">La documentación de la insignia indica cuál es cuál.</text></svg>