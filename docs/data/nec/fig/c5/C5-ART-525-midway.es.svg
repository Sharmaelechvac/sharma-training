<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">525: power for the midway</title><desc id="d">Midway plan: overhead conductors at the top with a 15 ft minimum clearance to the ride, a ride with its operator station and a fused disconnect within 6 ft of the operator, a distribution box raised 6 in. off the ground, and a food stand with GFCI protection on the public side.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">525: energía para la zona de atracciones</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta — esquemático, sin escala</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 525.5, 525.21, 525.23</text><line x1="30" y1="245" x2="870" y2="245" stroke="#1f2937" stroke-width="6"/><line x1="30" y1="275" x2="870" y2="275" stroke="#1f2937" stroke-width="3"/><text x="450" y="222" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CONDUCTORES AÉREOS</text><rect x="30" y="290" width="840" height="90" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 8"/><text x="450" y="348" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">MANTENGA LIBRES LAS ATRACCIONES</text><circle cx="280" cy="640" r="140" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="280" y="622" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">ATRACCIÓN</text><text x="280" y="674" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">estructura unida</text><line x1="855" y1="290" x2="855" y2="500" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(843,395.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">15 ft min</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">15 ft min</text></g><rect x="520" y="570" width="80" height="80" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="560" y="700" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OPERADOR</text><rect x="650" y="555" width="240" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="765" y="600" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">CON FUSIBLE</text><text x="765" y="644" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">DESCONEXIÓN</text><line x1="600" y1="520" x2="680" y2="520" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="640.0" y="508" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 6 ft</text><text x="640.0" y="508" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 6 ft</text><text x="777" y="712" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">a la vista</text><path d="M 200 1010 C 200 900, 240 820, 260 790" stroke="#5b6478" stroke-width="3" fill="none" stroke-dasharray="8 8"/><rect x="20" y="1010" width="400" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="220" y="1068" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CAJA DE DISTRIBUCIÓN</text><text x="210" y="1116" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">6 in sobre el suelo</text><rect x="510" y="1010" width="350" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="685" y="1068" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PUESTO DE COMIDA</text><rect x="520.0" y="1090" width="330" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="685.0" y="1124" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">GFCI — AL PÚBLICO</text><text x="450" y="1230" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Cables: uso extra rudo, 12 AWG o mayor (525.20)</text><text x="450" y="1282" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Verifique la tierra en cada instalación (525.32)</text><text x="450" y="1334" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Sin GFCI en la iluminación de egreso (525.23)</text></svg>