<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">506: zones for dusts &amp; fibers</title><desc id="d">Comparison panel of Zone 20, 21 and 22 for combustible dusts and ignitible fibers, from most severe to least, with the three material groups IIIA, IIIB and IIIC below.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">506: zonas para polvos y fibras</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La frecuencia de la nube inflamable define la zona</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 506.5, 506.6, 506.15</text><rect x="40" y="200" width="820" height="190" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><rect x="70" y="238" width="176" height="56" rx="28" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="158.0" y="280" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">ZONA 20</text><text x="330" y="282" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Polvo o fibras inflamables</text><text x="330" y="323" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">continuamente o mucho tiempo</text><rect x="40" y="420" width="820" height="190" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><rect x="70" y="458" width="176" height="56" rx="28" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="158.0" y="500" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">ZONA 21</text><text x="330" y="502" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Probable que esté presente en</text><text x="330" y="543" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">operación normal</text><rect x="40" y="640" width="820" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="70" y="678" width="176" height="56" rx="28" fill="#264387" stroke="#264387" stroke-width="0"/><text x="158.0" y="720" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">ZONA 22</text><text x="330" y="722" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Improbable en operación normal</text><text x="330" y="763" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">y solo brevemente si ocurre</text><text x="40" y="900" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">GRUPOS DE MATERIALES (506.6)</text><rect x="40" y="940" width="820" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="70" y="974" width="108" height="54" rx="27" fill="#264387" stroke="#264387" stroke-width="0"/><text x="124.0" y="1014" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">IIIA</text><text x="300" y="1012" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">fibras y partículas inflamables</text><rect x="40" y="1075" width="820" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="70" y="1109" width="108" height="54" rx="27" fill="#264387" stroke="#264387" stroke-width="0"/><text x="124.0" y="1149" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">IIIB</text><text x="300" y="1147" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">polvo combustible, no metálico</text><rect x="40" y="1210" width="820" height="110" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><rect x="70" y="1244" width="108" height="54" rx="27" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="124.0" y="1284" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">IIIC</text><text x="300" y="1282" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">polvo metálico — el más estricto</text><text x="450" y="1405" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">El cableado se reduce por zona (506.15):</text><text x="450" y="1453" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Métodos de Zona 20 sirven en 21 y 22 — nunca al revés</text></svg>