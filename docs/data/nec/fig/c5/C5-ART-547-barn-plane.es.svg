" y2="1562" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 547.5, 547.9, 547.10</text><line x1="110" y1="830" x2="110" y2="330" stroke="#264387" stroke-width="6"/><line x1="790" y1="830" x2="790" y2="330" stroke="#264387" stroke-width="6"/><path d="M 80 330 L 450 190 L 820 330" stroke="#264387" stroke-width="6" fill="none"/><text x="450" y="350" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CONFINAMIENTO DE GANADO</text><rect x="130" y="380" width="250" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="255" y="428" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">DISTRIBUCIÓN</text><text x="255" y="470" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PUNTO (547.9)</text><circle cx="404" cy="380" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="404" y="392" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><line x1="380" y1="435" x2="700" y2="435" stroke="#264387" stroke-width="4"/><rect x="625" y="380" width="160" height="110" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="705" y="448" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">TABLERO</text><rect x="300" y="560" width="240" height="110" rx="18" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="516" y="576" width="62" height="62" rx="12" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="330" y1="670" x2="330" y2="822" stroke="#264387" stroke-width="6"/><line x1="380" y1="670" x2="380" y2="822" stroke="#264387" stroke-width="6"/><line x1="470" y1="670" x2="470" y2="822" stroke="#264387" stroke-width="6"/><line x1="520" y1="670" x2="520" y2="822" stroke="#264387" stroke-width="6"/><text x="420" y="540" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">GANADO</text><rect x="590" y="640" width="180" height="90" rx="0" 