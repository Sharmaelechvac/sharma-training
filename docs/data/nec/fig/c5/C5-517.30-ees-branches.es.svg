<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">517.30 — essential electrical system</title><desc id="d">Block diagram of a hospital essential electrical system. A normal utility source and a generator feed automatic transfer switches, which feed three separate branches: life safety, critical, and equipment. Life safety and critical must be restored within 10 seconds; the equipment branch transfers with a delay, in sequence.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">517.30 — sistema eléctrico esencial</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">EES Tipo 1 de hospital — tres ramales</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 517.30, Parte III</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="200" width="380" height="100" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="250" y="262" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">FUENTE NORMAL</text><rect x="460" y="200" width="380" height="100" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="650" y="262" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">GENERADOR</text><line x1="250" y1="300" x2="250" y2="350" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="650" y1="300" x2="650" y2="350" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="350" width="780" height="90" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="408" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TRANSFERENCIA AUTOMÁTICA</text><line x1="450" y1="440" x2="450" y2="500" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="520" width="780" height="170" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="84" y="582" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">RAMAL SEGURIDAD DE VIDA</text><rect x="669" y="548" width="171" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="754.5" y="584" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 10 SEG</text><text x="84" y="648" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Letreros salida · egreso · alarma incendio</text><rect x="60" y="730" width="780" height="170" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="84" y="792" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">RAMAL CRÍTICO</text><rect x="669" y="758" width="171" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="754.5" y="794" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 10 SEG</text><text x="84" y="858" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Luz tarea · receptáculos · llam. enfermería</text><rect x="60" y="940" width="780" height="170" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="84" y="1002" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">RAMAL DE EQUIPO</text><rect x="450" y="968" width="390" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="645" y="1004" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">ARRANQUE RETARDADO</text><text x="84" y="1068" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">HVAC · aire médico · vacío · elevadores</text><rect x="60" y="1180" width="780" height="180" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1242" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">CABLEADO ESENCIAL — POR SEPARADO</text><text x="450" y="1294" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">de todo el cableado normal — una sola falla</text><text x="450" y="1346" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">no debe eliminar el respaldo</text></svg>