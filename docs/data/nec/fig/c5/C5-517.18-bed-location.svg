<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1640" width="900" height="1640" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">One bed location, up close</title><desc id="d">Headwall elevation for one Category 2 patient bed location showing eight hospital-grade receptacles with green dot markings, fed by at least two branch circuits, one from the normal system and one from the emergency system, plus the green dot versus green triangle distinction.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1640" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">One bed location, up close</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Category 2 general care — per bed, not per room</text><line x1="30" y1="1582" x2="870" y2="1582" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1620" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 517.18; isolated ground: 517.16</text><rect x="60" y="300" width="780" height="330" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="90" y="262" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">HEADWALL — ONE BED LOCATION</text><rect x="118" y="400" width="124" height="150" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="180" cy="445" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="180" cy="505" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="220" cy="425" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="298" y="400" width="124" height="150" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="360" cy="445" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="360" cy="505" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="400" cy="425" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="478" y="400" width="124" height="150" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="540" cy="445" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="540" cy="505" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="580" cy="425" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="658" y="400" width="124" height="150" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="720" cy="445" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="720" cy="505" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="760" cy="425" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="450" y="610" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4 duplex = 8 receptacles (minimum)</text><line x1="240" y1="630" x2="240" y2="700" stroke="#F0A846" stroke-width="5"/><path d="M660,630 L660,832 L282,832" stroke="#264387" stroke-width="5" fill="none"/><rect x="90" y="722" width="430" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="305" y="758" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">NORMAL — 1 panelboard</text><rect x="90" y="804" width="300" height="52" rx="26" fill="#264387" stroke="#264387" stroke-width="0"/><text x="240" y="840" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">EMERGENCY</text><text x="450" y="930" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">At least 2 branch circuits per bed location</text><path d="M110,1175 L110,1035 L300,1035 L300,1105 L790,1105 L790,1175" stroke="#264387" stroke-width="5" fill="none"/><rect x="110" y="975" width="190" height="70" rx="8" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="1245" font-size="34" font-weight="800" fill="#5b6478" text-anchor="middle">PATIENT BED</text><rect x="60" y="1295" width="780" height="105" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><circle cx="110" cy="1347" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="150" y="1335" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">GREEN DOT</text><text x="150" y="1381" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">= hospital grade</text><rect x="60" y="1430" width="780" height="105" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><path d="M97,1457 L123,1507 L71,1507 Z" stroke="#c0392b" stroke-width="4" fill="none"/><text x="150" y="1465" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">GREEN TRIANGLE</text><text x="150" y="1511" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">= isolated ground — see 517.16</text></svg>