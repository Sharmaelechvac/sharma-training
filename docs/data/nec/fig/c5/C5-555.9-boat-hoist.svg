<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">555.9 — boat hoist GFCI</title><desc id="d">Elevation of a dwelling dock with a boat hoist lifting a boat out of the water. The hoist circuit is fed from a dock panel through a GFCI breaker, as 555.9 requires for boat hoists rated not more than 240 volts at dwelling docking facilities.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">555.9 — boat hoist GFCI</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dwelling dock — hoist rated not over 240 V</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 555.9</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="60" y1="560" x2="840" y2="560" stroke="#1a2f61" stroke-width="8"/><text x="90" y="540" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">DOCK DECK</text><line x1="140" y1="560" x2="140" y2="1080" stroke="#1a2f61" stroke-width="8"/><line x1="430" y1="560" x2="430" y2="1080" stroke="#1a2f61" stroke-width="8"/><line x1="700" y1="560" x2="700" y2="1080" stroke="#1a2f61" stroke-width="8"/><path d="M60 950 q 40 -22 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0" stroke="#264387" stroke-width="4" fill="none"/><path d="M60 1030 q 40 -22 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0" stroke="#264387" stroke-width="4" fill="none"/><text x="90" y="1130" font-size="34" font-weight="800" fill="#264387" text-anchor="start">WATER</text><rect x="70" y="330" width="290" height="170" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><text x="215" y="388" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DOCK PANEL</text><rect x="93.5" y="418" width="243" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="215.0" y="454" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">GFCI BREAKER</text><path d="M360 415 L 640 415 L 640 470" stroke="#1a2f61" stroke-width="4" fill="none" stroke-dasharray="10 8"/><line x1="640" y1="560" x2="640" y2="300" stroke="#1a2f61" stroke-width="8"/><line x1="790" y1="560" x2="790" y2="300" stroke="#1a2f61" stroke-width="8"/><line x1="610" y1="300" x2="820" y2="300" stroke="#1a2f61" stroke-width="8"/><rect x="665" y="330" width="100" height="60" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="715" y="290" font-size="30" font-weight="600" fill="#1f2937" text-anchor="