<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" width="900" height="1450" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Protection techniques — 500.7</title><desc id="d">Three stacked panels showing the main protection technique families: explosionproof enclosures contain an internal explosion, purged and pressurized systems keep the hazardous atmosphere out with clean air, and intrinsic safety limits circuit energy below the ignition level.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1450" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Técnicas de protección — 500.7</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tres formas en que el Código evita la ignición</text><line x1="30" y1="1392" x2="870" y2="1392" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1430" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 500.7</text><text x="870" y="1430" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="200" width="800" height="355" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="80" y="262" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">CONTÉNGALO — Antiexplosión, 500.7(A)</text><rect x="110" y="295" width="190" height="145" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="8"/><path d="M205 328 l14 22 24-6 -10 24 22 10 -24 12 4 26 -20 -14 -18 18 -8 -24 -24 4 10 -22 -22 -12 20 -10 z" stroke="#c0392b" stroke-width="4" fill="#fbe9e7"/><text x="360" y="365" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Paredes gruesas, sellado</text><text x="360" y="413" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">trayectos de llama</text><text x="560" y="380" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="80" y="518" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="820" y="498" font-size="32" font-weight="600" fill="#5b6478" text-anchor="end">La explosión ocurre dentro del envolvente.</text><text x="820" y="538" font-size="32" font-weight="600" fill="#5b6478" text-anchor="end">Los trayectos enfrían los gases al escapar.</text><rect x="50" y="595" width="800" height="355" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="80" y="657" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">FUERA — Purgado / presurizado, (D)</text><rect x="110" y="690" width="190" height="145" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="205" y="785" font-size="60" font-weight="800" fill="#2e7d32" text-anchor="middle">+</text><line x1="320" y1="735" x2="400" y2="735" stroke="#2e7d32" stroke-width="5" marker-end="url(#ah)"/><line x1="320" y1="800" x2="400" y2="800" stroke="#2e7d32" stroke-width="5" marker-end="url(#ah)"/><text x="440" y="760" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Aire limpio entra,</text><text x="440" y="808" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">presión mantenida</text><text x="560" y="775" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="80" y="913" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="820" y="893" font-size="32" font-weight="600" fill="#5b6478" text-anchor="end">El aire limpio o gas inerte se mantiene dentro.</text><text x="820" y="933" font-size="32" font-weight="600" fill="#5b6478" text-anchor="end">La presión positiva mantiene fuera el vapor.</text><rect x="50" y="990" width="800" height="355" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="80" y="1052" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">LIMÍTELO — Seg. intrínseca, 500.7(E)</text><line x1="110" y1="1157" x2="220" y2="1157" stroke="#264387" stroke-width="5"/><rect x="220" y="1097" width="90" height="120" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="265" y="1172" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">IS</text><line x1="310" y1="1157" x2="420" y2="1157" stroke="#264387" stroke-width="5"/><path d="M428 1142 l10 15 -20 0 16 18" stroke="#F0A846" stroke-width="4" fill="none"/><text x="480" y="1155" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">La barrera limita</text><text x="480" y="1203" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">la energía</text><text x="560" y="1170" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="80" y="1308" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="820" y="1288" font-size="32" font-weight="600" fill="#5b6478" text-anchor="end">Energía del circuito bajo el nivel de ignición.</text><text x="820" y="1328" font-size="32" font-weight="600" fill="#5b6478" text-anchor="end">Válido incluso en condiciones de falla.</text></svg>