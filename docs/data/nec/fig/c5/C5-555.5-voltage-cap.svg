<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Pier voltage cap — 555.5</title><desc id="d">A voltage bar from 0 to 600 volts phase to phase: ordinary pier distribution is limited to 250 volts, the band above 250 up to 600 is open only to engineered installations with qualified personnel under engineering supervision, and anything above 600 is never permitted.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Pier voltage cap — 555.5</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Phase-to-phase volts on the pier system</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 555.5</text><text x="870" y="1160" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="80" y="330" width="308" height="110" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><rect x="388" y="330" width="432" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><line x1="820" y1="330" x2="860" y2="330" stroke="#c0392b" stroke-width="5" marker-end="url(#ah)"/><text x="80" y="300" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">0</text><text x="388" y="300" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">250 V</text><text x="820" y="300" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">600 V</text><line x1="80" y1="520" x2="388" y2="520" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="234.0" y="508" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">250 V max — ordinary work</text><text x="234.0" y="508" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">250 V max — ordinary work</text><line x1="80" y1="630" x2="820" y2="630" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="618" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">600 V — absolute ceiling</text><text x="450.0" y="618" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">600 V — absolute ceiling</text><text x="80" y="830" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Green band: standard pier voltages live here.</text><text x="80" y="871" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Gold band: engineered installations only —</text><text x="80" y="912" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">qualified personnel, engineering supervision.</text><text x="80" y="1010" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">Above 600 V phase to phase: never permitted.</text></svg>