<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Zones 0, 1, 2 — gas and vapor</title><desc id="d">Concentric zone plan around a tank: Zone 0 inside the tank where the ignitible atmosphere is present continuously, Zone 1 around it where it is likely in normal operation, Zone 2 outside that where it is unlikely and brief, then unclassified space.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Zones 0, 1, 2 — gas and vapor</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plan: zones around a tank vent</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 505.5, 505.6, 505.15</text><circle cx="450" cy="590" r="330" fill="#eef2f9" stroke="#264387" stroke-width="4" stroke-dasharray="12 8"/><circle cx="450" cy="590" r="215" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><circle cx="450" cy="590" r="100" fill="#fbe9e7" stroke="#c0392b" stroke-width="5"/><text x="450" y="578" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TANK</text><text x="450" y="624" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">ZONE 0</text><text x="450" y="420" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">ZONE 1</text><text x="450" y="320" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">ZONE 2</text><text x="450" y="985" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">UNCLASSIFIED BEYOND THE ZONE 2 LINE</text><text x="60" y="1080" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">How often the cloud is there</text><text x="126" y="1136" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Zone 0: continuously, or long periods</text><text x="126" y="1184" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Zone 1: likely in normal operation</text><text x="126" y="1232" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Zone 2: unlikely, and only briefly</text><text x="126" y="1280" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Groups: IIA, IIB, IIC — IIC most severe</text><text x="126" y="1091" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start"></text></svg>