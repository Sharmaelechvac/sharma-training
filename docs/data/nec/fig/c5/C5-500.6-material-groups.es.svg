<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Material groups (500.6)</title><desc id="d">Severity panels of the material groups: Class I Groups A through D for gases and vapors and Class II Groups E through G for dusts, each with its example materials and a bar whose length grows with severity.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Grupos de materiales (500.6)</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Letras anteriores = más severo, en general</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 500.6</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="60" y="242" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">CLASE I — GASES + VAPORES</text><rect x="60" y="280" width="66" height="66" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="93" y="325" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">A</text><text x="150" y="324" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Acetileno</text><rect x="150" y="334" width="600" height="20" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><rect x="60" y="392" width="66" height="66" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="93" y="437" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">B</text><text x="150" y="436" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Hidrógeno + gases equivalentes</text><rect x="150" y="446" width="500" height="20" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><rect x="60" y="504" width="66" height="66" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="93" y="549" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">C</text><text x="150" y="548" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Vapores tipo etileno</text><rect x="150" y="558" width="400" height="20" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="60" y="616" width="66" height="66" rx="8" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="93" y="661" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">D</text><text x="150" y="660" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Gasolina, propano, gas natural</text><rect x="150" y="670" width="300" height="20" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="60" y="762" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">CLASE II — POLVOS</text><rect x="60" y="800" width="66" height="66" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="93" y="845" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">E</text><text x="150" y="844" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Polvos metálicos</text><rect x="150" y="854" width="540" height="20" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><rect x="60" y="912" width="66" height="66" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="93" y="957" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">F</text><text x="150" y="956" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Polvos carbonosos — carbón, coque</text><rect x="150" y="966" width="430" height="20" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><rect x="60" y="1024" width="66" height="66" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="93" y="1069" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">G</text><text x="150" y="1068" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Grano, harina + polvos plásticos</text><rect x="150" y="1078" width="330" height="20" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="60" y="1158" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Barra más larga = material más severo</text><rect x="60" y="1206" width="810" height="64" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1247" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">El equipo Grupo D NO cubre Grupos A, B ni C</text></svg>