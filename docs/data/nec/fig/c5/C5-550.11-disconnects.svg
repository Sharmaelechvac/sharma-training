<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">550.11 — one disconnect at the home</title><desc id="d">Site plan of a manufactured home. The service pedestal outside holds the 550.32 service disconnect, within sight of the home and within 30 feet of its exterior wall. A feeder runs from the pedestal to the home, where a single disconnect — the main breaker in the home panelboard — sits where the feeder enters, in a readily accessible location.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">550.11 — one disconnect at the home</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plus the 550.32 service disconnect outside</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 550.11, 550.32</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="360" y="260" width="480" height="500" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="6"/><text x="600" y="340" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">MANUFACTURED HOME</text><rect x="396" y="430" width="250" height="190" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="521" y="492" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">HOME PANEL</text><text x="521" y="545" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">MAIN = THE ONE</text><text x="521" y="592" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">DISCONNECT</text><text x="600" y="700" font-size="32" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">FEEDER ENTERS HERE</text><text x="600" y="700" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">FEEDER ENTERS HERE</text><rect x="50" y="430" width="240" height="190" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="5"/><text x="170" y="492" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PEDESTAL</text><text x="170" y="545" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">SERVICE</text><text x="170" y="592" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">DISCONNECT</text><line x1="290" y1="560" x2="360" y2="560" stroke="#1a2f61" stroke-width="5"/><line x1="290" y1="470" x2="360" y2="470" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 10"/><text x="325" y="415" font-size="30" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">WITHIN SIGHT</text><text x="325" y="415" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">WITHIN SIGHT</text><line x1="290" y1="640" x2="290" y2="842" stroke="#1a2f61" stroke-width="2"/><line x1="360" y1="640" x2="360" y2="842" stroke="#1a2f61" stroke-width="2"/><line x1="290" y1="830" x2="360" y2="830" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="325.0" y="818" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 30 ft</text><text x="325.0" y="818" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 30 ft</text><text x="325" y="900" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">pedestal to exterior wall</text><text x="60" y="1030" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">550.11: one disconnect where the feeder</text><text x="60" y="1071" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">enters the home — readily accessible.</text><text x="60" y="1112" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">550.32: service disconnect outside,</text><text x="60" y="1153" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">within sight and within 30 ft of the wall.</text></svg>