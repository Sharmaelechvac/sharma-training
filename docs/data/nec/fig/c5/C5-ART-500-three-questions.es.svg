<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Classified Locations: Start Here</title><desc id="d">Flow diagram: what is in the air sets the class, how often it is there sets the division, and the exact material sets the group; then Articles 501 through 516 give the working rules.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Ubicaciones clasificadas: empiece aquí</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Artículo 500 — tres preguntas previas</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 500, 500.5–500.8</text><rect x="60" y="210" width="780" height="168" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="90" y="272" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">1  ¿QUÉ HAY EN EL AIRE?</text><text x="90" y="322" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Gases + vapores Clase I · Polvos Clase II</text><text x="90" y="364" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Fibras + partículas Clase III</text><rect x="60" y="410" width="780" height="168" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="90" y="472" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">2  ¿CON QUÉ FRECUENCIA APARECE?</text><text x="90" y="522" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">División 1 — presente en operación normal</text><text x="90" y="564" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">División 2 — solo cuando algo falla</text><rect x="60" y="610" width="780" height="168" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="90" y="672" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">3  ¿CUÁL ES EL MATERIAL?</text><text x="90" y="722" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Grupos Clase I A–D · Grupos Clase II E–G</text><text x="90" y="764" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Más el límite de temperatura código T (500.8)</text><line x1="450" y1="790" x2="450" y2="845" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="855" width="780" height="150" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="922" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">LUEGO ABRA LOS ARTÍCULOS 501–516</text><text x="450" y="972" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">Las reglas de trabajo para cada tipo de ubicación</text><rect x="60" y="1055" width="780" height="170" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="1120" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">La clasificación viene de planos o de la AHJ.</text><text x="90" y="1172" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Nunca la adivine en campo (regla Sharma).</text></svg>