<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">514: zones around a dispenser</title><desc id="d">Plan view of an outdoor fuel dispenser: the enclosure interior is Class I Division 1, Division 2 extends 18 inches around the enclosure and out 20 feet horizontally up to 18 inches above grade, a tank vent is Division 1 within 3 feet and Division 2 to 5 feet, and the emergency disconnect must sit 20 to 100 feet away.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">514: zonas alrededor de un dispensador</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta — dispensador exterior</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Tabla 514.3(B)(1), 514.11</text><rect x="70" y="250" width="760" height="680" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3" stroke-dasharray="12 8"/><rect x="310" y="460" width="280" height="290" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><rect x="310" y="520" width="280" height="170" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="618" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">COMBUSTIBLE</text><text x="450" y="735" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">DISPENSADOR</text><text x="450" y="800" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">18 IN ALREDEDOR DEL GABINETE</text><line x1="515" y1="880" x2="830" y2="880" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="672.5" y="920" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">20 ft</text><text x="672.5" y="920" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">20 ft</text><circle cx="356" cy="482" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="356" y="494" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="112" cy="292" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="112" y="304" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="745" cy="345" r="17" fill="#264387" stroke="#264387" stroke-width="0"/><text x="688" y="356" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="end">VENTILACIÓN</text><circle cx="700" cy="300" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="700" y="312" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="150.5" y="969" width="599" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="1007" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DIV 2: HASTA 18 IN SOBRE EL SUELO</text><text x="60" y="1090" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1 División 1: dentro del gabinete</text><text x="60" y="1132" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2 División 2: 18 in de alto, 20 ft hacia afuera</text><text x="60" y="1174" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3 Ventilación: Div 1 hasta 3 ft, Div 2 hasta 5 ft</text><rect x="70" y="1250" width="760" height="230" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="1310" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">DESCONEXIÓN DE EMERGENCIA — 514.11</text><text x="450" y="1362" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">20 FT MÍN — 100 FT MÁX DEL DISPENSADOR</text><text x="450" y="1408" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">ABRE TODOS, INCL. EL PUESTO A TIERRA</text><text x="450" y="1452" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">LOS DE TIERRA QUEDAN CONECTADOS</text></svg>