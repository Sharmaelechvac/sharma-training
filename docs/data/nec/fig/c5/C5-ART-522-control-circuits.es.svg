<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">522: tipos de circuito de control</title><desc id="d">Diagrama de decisión para circuitos de control del Artículo 522: los circuitos de potencia limitada se alimentan de una fuente de no más de 30 voltios y 1,000 voltio-amperios con protección contra sobrecorriente de la fuente a no más del 167 por ciento; los circuitos sin límite de potencia llegan a 300 voltios con protección a no más del 125 por ciento; todo el voltaje de control está limitado a 150 voltios ca o 300 voltios cc a tierra, y los conductores son solo de cobre.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">522: tipos de circuito de control</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Control para atracciones permanentes</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 522.5, 522.10, 522.20, 522.28</text><rect x="200" y="210" width="500" height="100" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="272" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">CIRCUITO DE CONTROL</text><line x1="320" y1="310" x2="250" y2="390" stroke="#1a2f61" stroke-width="4"/><line x1="580" y1="310" x2="650" y2="390" stroke="#1a2f61" stroke-width="4"/><rect x="50" y="390" width="390" height="330" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="245" y="452" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">POTENCIA LIMITADA</text><text x="245" y="512" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Fuente: 30 V máx</text><text x="245" y="558" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">y 1,000 VA máx</text><text x="245" y="604" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">OCPD: 167% máx</text><text x="245" y="650" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">de VA / voltios</text><text x="245" y="696" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">522.10(A)</text><rect x="440" y="390" width="430" height="330" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="655" y="452" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">POTENCIA NO LIMITADA</text><text x="655" y="512" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Fuente: 300 V máx</text><text x="655" y="558" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">salida no limitada</text><text x="655" y="604" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">OCPD: 125% máx</text><text x="655" y="650" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">de VA / voltios</text><text x="655" y="696" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">522.10(B)</text><rect x="50" y="790" width="800" height="170" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="852" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">TECHO DE VOLTAJE DE CONTROL (522.5)</text><text x="450" y="916" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">150 V ca a tierra  •  300 V cc a tierra</text><text x="50" y="1040" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Solo cobre — sin aluminio (522.20)</text><text x="50" y="1086" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Si hay humedad: control 2 hilos sin tierra</text><text x="50" y="1132" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">circuitos limitados a 30 V cc (522.28)</text><text x="50" y="1178" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Solo personal calificado atiende (522.7)</text></svg>