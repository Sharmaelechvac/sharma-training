<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">522: control circuit types</title><desc id="d">Decision chart for Article 522 control circuits: power-limited circuits are supplied from a source of not more than 30 volts and 1,000 volt-amperes with source overcurrent protection at not more than 167 percent; non-power-limited circuits run to 300 volts with protection at not more than 125 percent; all control voltage is capped at 150 volts ac or 300 volts dc to ground, and conductors are copper only.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">522: control circuit types</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Control wiring for permanent attractions</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 522.5, 522.10, 522.20, 522.28</text><rect x="200" y="210" width="500" height="100" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="272" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">RIDE CONTROL CIRCUIT</text><line x1="320" y1="310" x2="250" y2="390" stroke="#1a2f61" stroke-width="4"/><line x1="580" y1="310" x2="650" y2="390" stroke="#1a2f61" stroke-width="4"/><rect x="50" y="390" width="390" height="330" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="245" y="452" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">POWER-LIMITED</text><text x="245" y="512" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Source: 30 V max</text><text x="245" y="558" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">and 1,000 VA max</text><text x="245" y="604" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">OCPD: 167% max</text><text x="245" y="650" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">of VA / volts</text><text x="245" y="696" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">522.10(A)</text><rect x="460" y="390" width="390" height="330" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="655" y="452" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">NON-POWER-LIMITED</text><text x="655" y="512" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Source: 300 V max</text><text x="655" y="558" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">output not limited</text><text x="655" y="604" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">OCPD: 125% max</text><text x="655" y="650" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">of VA / volts</text><text x="655" y="696" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">522.10(B)</text><rect x="50" y="790" width="800" height="170" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="852" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">CONTROL VOLTAGE CEILING (522.5)</text><text x="450" y="916" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">150 V ac to ground  •  300 V dc to ground</text><text x="50" y="1040" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Copper conductors only — no aluminum (522.20)</text><text x="50" y="1086" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Wet contact likely: ungrounded 2-wire control</text><text x="50" y="1132" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">circuits limited to 30 V dc (522.28)</text><text x="50" y="1178" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Qualified persons only service the ride (522.7)</text></svg>