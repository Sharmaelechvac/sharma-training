<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1660" width="900" height="1660" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">551.73 — Sites to service size</title><desc id="d">Bar charts of the per-site load basis and the Table 551.73(A) demand factors, with a worked example sizing a 200-ampere service for ten 50-ampere sites.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1660" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">551.73 — Sitios y tamaño de acometida</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Base de carga y demanda según Tabla 551.73(A)</text><line x1="30" y1="1602" x2="870" y2="1602" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1640" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 551.73, Tabla 551.73(A)</text><text x="60" y="216" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">BASE DE CARGA POR SITIO</text><text x="315" y="288" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">Sitio de 50 A</text><rect x="330" y="250" width="360" height="52" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="706" y="288" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">9,600 VA</text><text x="315" y="368" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">20 A + 30 A</text><rect x="330" y="330" width="135" height="52" rx="0" fill="#fdf3e0" stroke="#1a2f61" stroke-width="3"/><text x="481" y="368" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">3,600 VA</text><text x="315" y="448" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">Solo 20 A</text><rect x="330" y="410" width="90" height="52" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="436" y="448" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">2,400 VA</text><text x="315" y="528" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">Sitio de tienda</text><rect x="330" y="490" width="30" height="52" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="376" y="528" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">600 VA</text><text x="60" y="640" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">FACTOR DE DEMANDA — TABLA 551.73(A)</text><text x="315" y="718" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">1 sitio</text><rect x="330" y="680" width="360" height="52" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="706" y="718" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">100%</text><text x="315" y="798" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">5 sitios</text><rect x="330" y="760" width="234" height="52" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="580" y="798" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">65%</text><text x="315" y="878" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">10–12 sitios</text><rect x="330" y="840" width="180" height="52" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="526" y="878" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">50%</text><text x="315" y="958" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">36+ sitios</text><rect x="330" y="920" width="148" height="52" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="494" y="958" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">41%</text><rect x="60" y="1060" width="780" height="250" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="84" y="1120" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">EJEMPLO — 10 SITIOS, TODOS DE 50 A</text><text x="84" y="1168" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">10 × 9,600 VA = 96,000 VA conectados</text><text x="84" y="1216" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">96,000 × 50% = 48,000 VA de demanda</text><text x="84" y="1264" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">48,000 ÷ 240 V = acometida de 200 A</text><text x="70" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Las cargas de baños, lavandería y piscina se</text><text x="70" y="1442" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">suman por separado — sin factor de demanda.</text></svg>