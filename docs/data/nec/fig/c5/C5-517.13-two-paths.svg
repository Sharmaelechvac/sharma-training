<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Two Ground Paths - 517.13</title><desc id="d">One-line sketch of a patient care branch circuit from a panel through a metal raceway to a hospital-grade receptacle. Two independent ground-fault return paths are shown: the metal raceway itself, and an insulated copper equipment grounding conductor pulled inside it, sized from Table 250.122.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Two Ground Paths - 517.13</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">One patient care branch circuit</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 517.13, Table 250.122</text><rect x="40" y="330" width="220" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="150" y="405" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><text x="150" y="458" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">20 A breaker</text><rect x="260" y="330" width="350" height="140" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><line x1="260" y1="375" x2="610" y2="375" stroke="#1f2937" stroke-width="3"/><line x1="260" y1="405" x2="610" y2="405" stroke="#1f2937" stroke-width="3"/><line x1="260" y1="440" x2="610" y2="440" stroke="#2e7d32" stroke-width="6"/><rect x="610" y="330" width="260" height="140" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="680" cy="380" r="22" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="790" cy="380" r="22" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><circle cx="735" cy="432" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><line x1="830" y1="470" x2="830" y2="745" stroke="#2e7d32" stroke-width="4" stroke-dasharray="10 8"/><text x="40" y="545" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">PATH 1: THE METAL RACEWAY ITSELF</text><text x="40" y="597" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">PATH 2: INSULATED COPPER EGC</text><text x="40" y="645" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">12 AWG at 20 A - Table 250.122</text><text x="40" y="710" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">HOSPITAL-GRADE RECEPTACLE (GREEN DOT)</text><rect x="560" y="745" width="310" height="90" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="715" y="803" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FIXED EQUIPMENT</text><text x="870" y="885" font-size="32" font-weight="600" fill="#1f2937" text-anchor="end">exposed metal bonds to the EGC</text><rect x="40" y="940" width="820" height="170" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="70" y="1010" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NO: NM CABLE - IT HAS NO METAL PATH</text><text x="70" y="1070" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">NO: NON-QUALIFYING ARMOR OR SHEATH</text><text x="40" y="1200" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Both paths on every branch circuit.</text><text x="40" y="1252" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Receptacle grounds land on the insulated wire.</text><text x="40" y="1304" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">The metal path never replaces the wire.</text></svg>