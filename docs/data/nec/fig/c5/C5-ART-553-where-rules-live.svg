<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1320" width="900" height="1320" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">553 is gone — 555 Part III</title><desc id="d">Flow from the deleted Article 553 to Article 555 Part III, with service equipment and disconnect on land and a ground-fault protected feeder to the floating building.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1320" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">553 is gone — 555 Part III</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Floating buildings moved in the 2020 NEC</text><line x1="30" y1="1262" x2="870" y2="1262" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1300" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 555, Part III (555.50 and following)</text><rect x="60" y="210" width="780" height="170" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="90" y="272" font-size="40" font-weight="800" fill="#c0392b" text-anchor="start">OLD PRINT — Article 553</text><text x="90" y="322" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">Floating buildings</text><text x="90" y="362" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">DELETED in the 2020 NEC</text><line x1="450" y1="396" x2="450" y2="470" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="486" width="780" height="170" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="90" y="548" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">NEC 2020 — Article 555, Part III</text><text x="90" y="598" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Floating buildings: 555.50 and following</text><text x="90" y="638" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Same subject, new home — work from 555</text><text x="60" y="730" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">How the supply is arranged</text><rect x="60" y="770" width="270" height="300" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="195" y="822" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">LAND</text><rect x="85" y="850" width="220" height="92" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="195" y="888" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">SERVICE</text><text x="195" y="926" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">EQUIPMENT</text><rect x="85" y="962" width="220" height="92" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="195" y="1000" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middl