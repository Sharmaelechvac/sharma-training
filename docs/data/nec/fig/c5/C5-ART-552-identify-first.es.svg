<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Park trailer or not?</title><desc id="d">Identification flowchart: a unit on a single chassis on wheels is tested at 400 square feet or less of gross area in set-up mode; yes leads to a park trailer under Article 552, no leads to Articles 550 or 551, and supply follows the unit listing.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">¿Remolque de parque o no?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La definición elige el artículo</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 552</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="130" y="210" width="640" height="100" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="272" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">CHASIS ÚNICO SOBRE RUEDAS</text><line x1="450" y1="310" x2="450" y2="362" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="130" y="372" width="640" height="100" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="434" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">¿ÁREA INSTALADA ≤ 400 SQ FT?</text><line x1="300" y1="472" x2="245" y2="548" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="600" y1="472" x2="655" y2="548" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="252" y="532" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">SÍ</text><text x="648" y="532" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NO</text><rect x="60" y="560" width="390" height="176" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="255" y="598" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="middle">REMOLQUE</text><text x="255" y="646" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="middle">DE PARQUE</text><text x="255" y="694" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Artículo 552</text><rect x="480" y="560" width="390" height="176" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="675" y="598" font-size="33" font-weight="800" fill="#c0392b" text-anchor="middle">NO ES REMOLQUE</text><text x="675" y="646" font-size="33" font-weight="800" fill="#c0392b" text-anchor="middle">DE PARQUE</text><text x="675" y="694" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Verifique 550 / 551</text><rect x="60" y="760" width="810" height="240" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="90" y="824" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EL SUMINISTRO SIGUE EL LISTADO</text><text x="90" y="884" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">• Conexión por cable o alimentador permanente</text><text x="90" y="932" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">• Dimensionado a la carga de la unidad (552)</text><text x="90" y="980" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">• Desconexión + protección en el sitio</text><rect x="60" y="1060" width="810" height="70" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="1105" font-size="33" font-weight="700" fill="#ffffff" text-anchor="middle">Rige la placa de datos, no el papeleo</text><text x="450" y="1190" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Más grande / instalado permanente → otros artículos</text></svg>