anal encuentra esto primero</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 590.4(B)–(G)</text><text x="870" y="1680" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="250" width="270" height="430" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="60" y="250" width="270" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="195" y="292" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">TABLERO</text><text x="195" y="380" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">ACOMETIDA SEGÚN</text><text x="195" y="416" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">ARTÍCULO 230</text><text x="195" y="520" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">DESCONEXIÓN</text><text x="195" y="556" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">ABRE TODOS LOS</text><text x="195" y="592" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">NO ATERRIZADOS</text><circle cx="60" cy="250" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="262" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="330" y1="300" x2="840" y2="300" stroke="#264387" stroke-width="5"/><line x1="450" y1="300" x2="450" y2="348" stroke="#264387" stroke-width="4"/><circle cx="450" cy="372" r="22" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><path d="M 416 366 A 36 36 0 0 0 484 366" stroke="#264387" stroke-width="4" fill="none"/><line x1="620" y1="300" x2="620" y2="348" stroke="#264387" stroke-width="4"/><circle cx="620" cy="372" r="22" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><path d="M 586 366 A 36 36 0 0 0 654 366" stroke="#264387" stroke-width="4" fill="none"/><line x1="790" y1="300" x2="790" y2=