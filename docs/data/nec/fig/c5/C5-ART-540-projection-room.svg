" x2="870" y2="1202" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1240" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 540.10, 540.11, 540.12, 540.13</text><rect x="70" y="220" width="760" height="640" rx="4" fill="#ffffff" stroke="#264387" stroke-width="6"/><rect x="70" y="220" width="760" height="26" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="0"/><text x="450" y="200" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">AUDITORIUM</text><rect x="300" y="214" width="90" height="38" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><rect x="560" y="214" width="90" height="38" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="345" y="300" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">port — glass</text><text x="605" y="300" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">port — glass</text><rect x="270" y="380" width="150" height="210" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="345" y="470" font-size="33" font-weight="800" fill="#ffffff" text-anchor="middle">PROJ 1</text><text x="345" y="516" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">35 mm</text><rect x="530" y="380" width="150" height="210" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="605" y="470" font-size="33" font-weight="800" fill="#ffffff" text-anchor="middle">PROJ 2</text><text x="605" y="516" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">xenon</text><line x1="240" y1="380" x2="240" y2="590" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(228,485.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">30 in min</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">30 in min</text></g><line x1="270" y1="648" x2="420" y2="648" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="345.0" y="684" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">30 in min</text><text x="345.0" y="684" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">30 in min</text><rect x="90" y="745" width="320" height="95" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="110" y="790" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">RECTIFIER — guarded,</text><text x="110" y="830" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">arcs away from film</text><text x="70" y="950" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Room is NOT a classified location (540.10)</text><text x="70" y="996" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Ports completely closed — glass or approved</text><text x="70" y="1042" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Conductors to arc / xenon projectors:</text><text x="70" y="1088" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">8 AWG minimum, ampacity per rating (540.13)</text></svg>