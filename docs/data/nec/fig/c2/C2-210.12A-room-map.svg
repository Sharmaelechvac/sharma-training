<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.12(A) AFCI rooms in a dwelling</title><desc id="d">House plan with the rooms that need AFCI protection under 210.12(A) shaded gold, and the rooms not on the list left white.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.12(A) AFCI rooms in a dwelling</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Gold = on the AFCI list. White = not listed.</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.12(A)</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="200" width="250" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="175.0" y="303.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">KITCHEN</text><rect x="300" y="200" width="250" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="425.0" y="303.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DINING</text><rect x="550" y="200" width="300" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="700.0" y="303.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">FAMILY</text><rect x="50" y="380" width="250" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="175.0" y="483.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LIVING</text><rect x="300" y="380" width="250" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="425.0" y="483.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">BEDROOM</text><rect x="550" y="380" width="130" height="180" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="615.0" y="470.0" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">BATH</text><text x="615.0" y="510.0" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">not listed</text><rect x="680" y="380" width="170" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="765.0" y="483.0" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">LAUNDRY</text><rect x="50" y="560" width="500" height="140" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="300.0" y="643.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">HALLWAYS + CLOSETS</text><rect x="550" y="560" width="300" height="140" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="700.0" y="630.0" font-size="34" font-weight="800" fill="#5b6478" text-anchor="middle">GARAGE</text><text x="700.0" y="670.0" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">not listed</text><rect x="50" y="760" width="44" height="34" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="3"/><text x="115" y="788" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">On the 210.12(A) list: AFCI protection</text><rect x="50" y="820" width="44" height="34" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="115" y="848" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Not on the list (unfinished basement too)</text><text x="50" y="940" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Applies to 120V, single-phase, 15A and 20A</text><text x="50" y="988" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">branch circuits supplying outlets or devices.</text><text x="50" y="1036" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">A 240V appliance circuit is outside the range.</text><text x="50" y="1084" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">S-07: Sharma dual-function breakers cover</text><text x="50" y="1132" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">the 120V list by default.</text></svg>