<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" width="900" height="1120" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.52(C) Espaciamiento en encimeras</title><desc id="d">Elevación de una encimera de cocina de 8 ft con dos receptáculos colocados para que ningún punto esté a más de 24 in de un receptáculo, con cotas de espaciamiento de 24 in y 48 in y la altura máxima de 20 in sobre la encimera.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1120" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.52(C) Espaciamiento en encimeras</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tramo de pared de 8 ft — todo punto a 24 in o menos</text><line x1="30" y1="1062" x2="870" y2="1062" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1100" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.52(C)(1)</text><text x="870" y="1100" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><line x1="60" y1="300" x2="255" y2="300" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="157.5" y="288" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 24 in</text><text x="157.5" y="288" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 24 in</text><line x1="255" y1="300" x2="645" y2="300" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="288" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 48 in</text><text x="450.0" y="288" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 48 in</text><line x1="645" y1="300" x2="840" y2="300" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="742.5" y="288" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 24 in</text><text x="742.5" y="288" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 24 in</text><rect x="228" y="362" width="54" height="76" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="243" y1="382" x2="243" y2="418" stroke="#ffffff" stroke-width="4"/><line x1="267" y1="382" x2="267" y2="418" stroke="#ffffff" stroke-width="4"/><rect x="618" y="362" width="54" height="76" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="633" y1="382" x2="633" y2="418" stroke="#ffffff" stroke-width="4"/><line x1="657" y1="382" x2="657" y2="418" stroke="#ffffff" stroke-width="4"/><line x1="858" y1="400" x2="858" y2="560" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="844" y="492.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">20 in max</text><text x="844" y="492.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">20 in max</text><line x1="60" y1="446" x2="840" y2="446" stroke="#c9d2e3" stroke-width="3"/><rect x="60" y="560" width="780" height="64" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="60" y="624" width="780" height="190" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><line x1="450" y1="624" x2="450" y2="814" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="520" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">ENCIMERA</text><text x="450" y="905" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">Toda pieza de 12 in o más necesita su receptáculo</text><text x="450" y="962" font-size="34" font-weight="600" fill="#5b6478" text-anchor="middle">Fregaderos y estufas dividen el tramo; revíselo</text></svg>