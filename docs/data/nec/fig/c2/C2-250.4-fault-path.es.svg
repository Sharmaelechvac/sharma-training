<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">250.4 Dos trayectos de corriente de falla</title><desc id="d">Panel de comparación: un conductor de fase hace falla a un gabinete metálico. El trayecto solo por tierra tiene demasiada impedancia para disparar el interruptor, así que el gabinete queda energizado. El trayecto de tierra de equipos unido de vuelta a la fuente lleva suficiente corriente de falla para abrir el interruptor rápido.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">250.4 Dos trayectos de corriente de falla</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Misma falla, dos resultados — la vuelta decide</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.4(A)(5), 250.53(A)(2)</text><rect x="330" y="196" width="240" height="104" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="242" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">METAL</text><text x="450" y="284" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">GABINETE</text><line x1="60" y1="248" x2="330" y2="248" stroke="#c0392b" stroke-width="5"/><text x="60" y="224" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">CONDUCTOR DE</text><text x="60" y="260" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">FASE</text><circle cx="330" cy="248" r="16" fill="#F0A846" stroke="#c0392b" stroke-width="4"/><text x="450" y="342" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">FALLA: la fase toca el metal</text><rect x="30" y="356" width="840" height="330" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="60" y="416" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">TRAYECTO 1 — SOLO POR LA TIERRA</text><line x1="720" y1="356" x2="720" y2="452" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 8"/><rect x="620" y="452" width="200" height="24" rx="0" fill="#fdf3e0" stroke="#5b6478" stroke-width="3"/><line x1="720" y1="476" x2="720" y2="540" stroke="#c0392b" stroke-width="5"/><path d="M696,540 L744,540 L720,580 Z" stroke="#c0392b" stroke-width="4" fill="#fbe9e7"/><text x="720" y="622" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">varilla de tierra</text><text x="60" y="500" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Trayecto por tierra: alta impedancia</text><text x="60" y="541" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">La corriente de falla queda pequeña</text><text x="60" y="582" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">El interruptor no dispara</text><text x="60" y="656" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">RESULTADO: GABINETE QUEDA ENERGIZADO</text><rect x="30" y="726" width="840" height="330" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="60" y="786" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="start">TRAYECTO 2 — UNIDO A LA FUENTE</text><rect x="70" y="850" width="200" height="84" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="170" y="904" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">GABINETE</text><line x1="270" y1="892" x2="470" y2="892" stroke="#2e7d32" stroke-width="6" marker-end="url(#ah)"/><text x="370" y="862" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">EGC</text><rect x="425" y="850" width="250" height="84" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="550" y="904" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">INTERRUPTOR</text><line x1="630" y1="892" x2="700" y2="892" stroke="#2e7d32" stroke-width="6" marker-end="url(#ah)"/><rect x="700" y="850" width="130" height="84" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="765" y="904" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">FUENTE</text><text x="70" y="992" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Baja impedancia: fluye mucha corriente de falla</text><text x="70" y="1033" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">El interruptor abre rápido — la falla se despeja</text><rect x="30" y="1096" width="840" height="300" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="60" y="1156" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">LA TIERRA TIENE SUS PROPIOS TRABAJOS</text><text x="60" y="1224" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">• Limite rayos y sobretensiones de línea</text><text x="60" y="1265" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">• Estabilice el voltaje a tierra en uso normal</text><text x="60" y="1306" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">• Una varilla debe probar 25 ohmios o menos —</text><text x="60" y="1347" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">   o entra una segunda varilla (250.53(A)(2))</text></svg>