<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="900" height="1350" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.8(F) Salida, no un receptáculo</title><desc id="d">Un condensador sobre una base con un látigo cableado a una desconexión de pared, alimentado desde el tablero en un circuito de 40 A de dos polos, con la excepción de HVAC listado de Florida señalada.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1350" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.8(F) Salida, no un receptáculo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Condensador cableado en una casa de Florida</text><line x1="30" y1="1292" x2="870" y2="1292" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1330" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.8(F); FBC-Residential §E3408.1</text><rect x="60" y="190" width="300" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="210" y="240" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="210" y="282" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">Int. de 40 A, 2 polos</text><rect x="640" y="300" width="170" height="640" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="6"/><text x="725" y="350" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">PARED</text><rect x="640" y="590" width="140" height="130" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="710" y="645" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">DESCON.</text><text x="710" y="685" font-size="36" font-weight="900" fill="#F0A846" text-anchor="middle">1</text><path d="M360,250 L700,250 L700,590" stroke="#1a2f61" stroke-width="4" fill="none"/><text x="210" y="356" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">120 V a tierra,</text><text x="210" y="396" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">50 A o menos</text><rect x="150" y="560" width="330" height="330" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="315" cy="660" r="78" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><line x1="315" y1="582" x2="315" y2="738" stroke="#1a2f61" stroke-width="3"/><line x1="237" y1="660" x2="393" y2="660" stroke="#1a2f61" stroke-width="3"/><text x="315" y="830" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">CONDENSADOR</text><path d="M480,690 C560,690 600,700 655,690" stroke="#1f2937" stroke-width="6" fill="none"/><text x="565" y="640" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">látigo flex.</text><rect x="110" y="890" width="440" height="26" rx="0" fill="#c9d2e3" stroke="#1f2937" stroke-width="3"/><path d="M30,916 L870,916 L870,990 L30,990 Z" stroke="none" stroke-width="3" fill="url(#earth)"/><line x1="30" y1="916" x2="870" y2="916" stroke="#1f2937" stroke-width="5"/><circle cx="120" cy="1060" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="120" y="1072" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="160" y="1072" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">El punto de desconexión es la “salida” —</text><text x="160" y="1114" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">nada se enchufa, la regla igual lo alcanza.</text><rect x="60" y="1160" width="810" height="92" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="465" y="1198" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">FLORIDA 1–2 FAMILIAS: HVAC listado</text><text x="465" y="1238" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">GFCI no requerido — FBC-R §E3408.1 Ex. 2</text></svg>