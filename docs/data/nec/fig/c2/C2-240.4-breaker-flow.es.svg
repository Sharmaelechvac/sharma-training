<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1290" width="900" height="1290" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">240.4 Cómo elegir el interruptor</title><desc id="d">Diagrama de flujo de cuatro pasos para elegir la protección contra sobrecorriente: primero la ampacidad del conductor, luego el artículo del equipo o la placa, luego los límites de conductores pequeños, luego igualar el interruptor a la ampacidad con el permiso limitado del tamaño siguiente.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1290" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">240.4 Cómo elegir el interruptor</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Empiece en el conductor. El interruptor lo sigue.</text><line x1="30" y1="1232" x2="870" y2="1232" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1270" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 240.4, 240.4(B)–(D), Table 310.16</text><rect x="70" y="200" width="760" height="118" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="100" y="252" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">PASO 1 — Ampacidad del conductor</text><text x="100" y="298" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Tabla 310.16, tras corrección y ajuste</text><line x1="450" y1="318" x2="450" y2="356" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="70" y="356" width="760" height="158" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="100" y="408" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">PASO 2 — ¿Equipo o placa?</text><text x="100" y="454" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Motores, AC, soldadores, transformadores:</text><text x="100" y="496" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">su regla manda sobre esta página.</text><line x1="450" y1="514" x2="450" y2="552" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="70" y="552" width="760" height="158" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="100" y="604" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">PASO 3 — Conductores pequeños</text><text x="100" y="650" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">14, 12 o 10 AWG: los límites de 240.4(D) fijan</text><text x="100" y="692" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">el interruptor, diga lo que diga la tabla.</text><line x1="450" y1="710" x2="450" y2="748" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="70" y="748" width="760" height="158" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="100" y="800" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">PASO 4 — Iguale la ampacidad</text><text x="100" y="846" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Entre tamaños estándar: solo el siguiente</text><text x="100" y="888" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">mayor bajo 240.4(B); nunca sobre 800 A.</text><rect x="70" y="956" width="760" height="160" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="100" y="1008" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">MÁS DE 800 A — SIN REDONDEAR</text><text x="100" y="1054" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">La ampacidad debe ser al menos igual</text><text x="100" y="1096" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">el valor del dispositivo (240.4(C)).</text></svg>