<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Un edificio, un suministro</title><desc id="d">Tabla de decisión para 225.30: un edificio recibe un alimentador o circuito ramal. Un segundo suministro se permite solo bajo una excepción en 225.30(A) a (E); de lo contrario, tienda un alimentador mayor y un subtablero.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Un edificio, un suministro</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un segundo suministro necesita una excepción</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 225.30, 225.30(A)–(E)</text><rect x="170" y="205" width="560" height="100" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="268" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">El edificio ya tiene un suministro</text><line x1="450" y1="305" x2="450" y2="375" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><path d="M450,375 L690,480 L450,585 L210,480 Z" stroke="#1a2f61" stroke-width="4" fill="#fdf3e0"/><text x="450" y="468" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">¿Puede nombrar el</text><text x="450" y="512" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">excepción?</text><line x1="300" y1="530" x2="230" y2="640" stroke="#c0392b" stroke-width="4" marker-end="url(#ah)"/><text x="215" y="610" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">NO</text><line x1="600" y1="530" x2="670" y2="640" stroke="#2e7d32" stroke-width="4" marker-end="url(#ah)"/><text x="690" y="610" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">SÍ</text><rect x="40" y="645" width="390" height="170" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="65" y="705" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">✗ Sin excepción:</text><text x="65" y="744" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">un solo alimentador</text><text x="65" y="783" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">mayor y subtablero.</text><rect x="470" y="645" width="390" height="170" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="495" y="705" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">✓ Excepción (A)–(E):</text><text x="495" y="744" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">agrupe desconexiones</text><text x="495" y="783" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">quepan en placa/direct.</text><text x="40" y="905" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">Las cinco puertas — 225.30(A) a (E):</text><text x="40" y="975" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">A  Contra incendios, emergencia, reserva, paralelo</text><text x="40" y="1031" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">B  Ocupaciones especiales (permiso especial)</text><text x="40" y="1087" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">C  Capacidad sobre 2000 A a 600 V o menos</text><text x="40" y="1143" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">D  Voltaje, frecuencia o uso diferente</text><text x="40" y="1199" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">E  Conmutación documentada, una gestión</text><text x="450" y="1330" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Un circuito multiconductor cuenta como un suministro.</text></svg>