<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1330" width="900" height="1330" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.52(D) Bathroom receptacles</title><desc id="d">Plan view of a 72 inch double vanity with two basins. A receptacle centered between the basins is within 3 ft of each basin edge; a receptacle at the far end is more than 3 ft from the far basin. Below, an elevation shows a cabinet-face receptacle no more than 12 in below the countertop.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1330" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.52(D) Bathroom receptacles</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plan view: 72 in double vanity, drawn to scale.</text><line x1="30" y1="1272" x2="870" y2="1272" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.52(D), 210.11(C)(3), 210.8(A)(1)</text><rect x="110" y="196" width="680" height="26" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><text x="450" y="186" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">WALL</text><rect x="110" y="222" width="680" height="200" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><ellipse cx="290" cy="322" rx="95" ry="62" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="290" cy="268" r="13" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><ellipse cx="610" cy="322" rx="95" ry="62" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="610" cy="268" r="13" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="290" y="336" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">BASIN 1</text><text x="610" y="336" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">BASIN 2</text><rect x="433" y="205" width="34" height="34" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="5"/><path d="M439,222 l8,9 l14,-18" stroke="#2e7d32" stroke-width="5" fill="none"/><rect x="123" y="205" width="34" height="34" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="5"/><line x1="131" y1="213" x2="149" y2="231" stroke="#c0392b" stroke-width="5"/><line x1="149" y1="213" x2="131" y2="231" stroke="#c0392b" stroke-width="5"/><text x="140" y="254" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">end receptacle</text><text x="450" y="254" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">center receptacle</text><line x1="385" y1="478" x2="450" y2="478" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="417.5" y="466" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 3 ft</text><text x="417.5" y="466" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 3 ft</text><line x1="450" y1="538" x2="515" y2="538" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="482.5" y="526" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 3 ft</text><text x="482.5" y="526" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 3 ft</text><line x1="140" y1="604" x2="515" y2="604" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="327.5" y="592" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">&gt; 3 ft — too far</text><text x="327.5" y="592" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">&gt; 3 ft — too far</text><text x="110" y="668" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">One receptacle may serve both basins — only if it is</text><text x="110" y="710" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">within 3 ft of the outside edge of each one.</text><line x1="110" y1="800" x2="560" y2="800" stroke="#1f2937" stroke-width="6"/><text x="110" y="782" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">COUNTERTOP</text><line x1="150" y1="800" x2="150" y2="960" stroke="#264387" stroke-width="5"/><line x1="110" y1="960" x2="320" y2="960" stroke="#1f2937" stroke-width="4"/><rect x="128" y="856" width="44" height="56" rx="6" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="560" y1="800" x2="652" y2="800" stroke="#1a2f61" stroke-width="2"/><line x1="560" y1="912" x2="652" y2="912" stroke="#1a2f61" stroke-width="2"/><line x1="640" y1="800" x2="640" y2="912" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="654" y="867.9" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 in max</text><text x="654" y="867.9" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">12 in max</text><text x="110" y="1010" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">On the cabinet face: never more than 12 in</text><text x="110" y="1052" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">below the top of the basin or countertop.</text><text x="110" y="1120" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="start">GFCI protection: 210.8(A)(1). Circuit: the 20 A</text><text x="110" y="1162" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="start">bathroom circuit, 210.11(C)(3).</text></svg>