<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.12(D) Modified circuits</title><desc id="d">Decision flow: a modified or extended circuit in a 210.12 area needs AFCI protection unless the extension is 6 ft or less and adds nothing but splicing devices.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.12(D) Modified circuits</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The service-work decision path</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.12(D)</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="150" y="190" width="600" height="96" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="230" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">Existing circuit in a 210.12 area is</text><text x="450" y="272" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">modified, replaced or extended</text><line x1="450" y1="286" x2="450" y2="340" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="120" y="350" width="660" height="96" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="390" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Extension ≤ 6 ft AND splices only,</text><text x="450" y="432" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">nothing added?</text><line x1="280" y1="446" x2="280" y2="520" stroke="#2e7d32" stroke-width="4" marker-end="url(#ah)"/><text x="296" y="500" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="start">YES</text><rect x="60" y="530" width="430" height="96" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="275" y="570" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">Exception applies —</text><text x="275" y="612" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">no AFCI required</text><line x1="620" y1="446" x2="620" y2="520" stroke="#c0392b" stroke-width="4" marker-end="url(#ah)"/><text x="636" y="500" font-size="34" font-weight="900" fill="#c0392b" text-anchor="start">NO</text><rect x="510" y="530" width="360" height="96" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="690" y="570" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">AFCI protection</text><text x="690" y="612" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">required</text><line x1="690" y1="626" x2="690" y2="690" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="730" font-size="34" font-weight="900" fill="#264387" text-anchor="middle">Protect it one of two ways:</text><rect x="60" y="770" width="400" height="110" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="260" y="815" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">Any method in</text><text x="260" y="857" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">210.12(A)(1)–(6)</text><rect x="500" y="770" width="370" height="110" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="685" y="815" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">OBC AFCI at the FIRST</text><text x="685" y="857" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">receptacle outlet</text><text x="60" y="960" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Conductor length inside boxes and enclosures</text><text x="60" y="1002" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">does not count toward the 6 ft.</text><rect x="60" y="1050" width="810" height="84" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="465" y="1104" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Adding even one outlet kills the exception.</text></svg>