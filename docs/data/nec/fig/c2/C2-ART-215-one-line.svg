<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 215 Feeders: name the run</title><desc id="d">One-line diagram from utility to branch circuits showing where the feeder sits, and the 215.2 sizing rule with a worked example.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 215 Feeders: name the run</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Each run is judged by its own article.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Articles 215, 220, 240, 250</text><rect x="100" y="190" width="400" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="300" y="234" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">UTILITY</text><text x="300" y="270" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">service point</text><line x1="300" y1="282" x2="300" y2="316" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="100" y="316" width="400" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="300" y="360" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">METER</text><text x="300" y="396" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">230: service conductors</text><line x1="300" y1="408" x2="300" y2="442" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="100" y="442" width="400" height="92" rx="0" fill="#fdf3e0" stroke="#1a2f61" stroke-width="5"/><text x="300" y="486" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">SERVICE DISCONNECT</text><text x="300" y="522" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">main bonding jumper here</text><rect x="100" y="564" width="400" height="150" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="5"/><text x="300" y="626" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">FEEDER</text><text x="300" y="676" font-size="34" font-weight="800" fill="#F0A846" text-anchor="middle">Article 215</text><line x1="300" y1="534" x2="300" y2="564" stroke="#F0A846" stroke-width="8"/><text x="450" y="766" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Sized on the Article 220 load (215.2)</text><text x="450" y="810" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Protected per Article 240 (215.3)</text><text x="450" y="854" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">EGC from Article 250, run with it</text><rect x="100" y="884" width="400" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="300" y="928" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PANELBOARD</text><text x="300" y="964" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">neutral isolated, no bond</text><line x1="300" y1="976" x2="300" y2="1010" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="100" y="1010" width="400" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="300" y="1054" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">BRANCH CIRCUITS</text><text x="300" y="1090" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">Article 210</text><rect x="60" y="1150" width="780" height="190" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="90" y="1208" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">215.2 feeder sizing</text><text x="90" y="1262" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Ampacity: noncontinuous + 125% continuous</text><text x="90" y="1312" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">80 A + 125% x 40 A = 130 A minimum</text></svg>