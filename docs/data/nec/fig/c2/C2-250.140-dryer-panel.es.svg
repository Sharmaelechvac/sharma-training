<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">250.140: la conexión de 4 conductores</title><desc id="d">Parte trasera de una secadora de ropa cableada con un cordón de 4 conductores: la cinta de unión se retira y el conductor verde de tierra aterriza en el tornillo del marco, junto a paneles que contrastan la disposición de 3 conductores solo para existente y los tamaños mínimos del neutro.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1200" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">250.140: la conexión de 4 conductores</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Cinta fuera — verde en el tornillo del marco.</text><line x1="30" y1="1142" x2="870" y2="1142" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1180" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.140</text><text x="870" y="1180" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="60" y="230" width="380" height="640" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="90" y="292" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">TRASERA SECADORA</text><rect x="140" y="330" width="240" height="150" rx="8" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="185" cy="405" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="4"/><text x="185" y="462" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">L1</text><circle cx="260" cy="405" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="4"/><text x="260" y="462" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">N</text><circle cx="335" cy="405" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="4"/><text x="335" y="462" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">L2</text><line x1="185" y1="480" x2="185" y2="1010" stroke="#1f2937" stroke-width="5"/><line x1="335" y1="480" x2="335" y2="1010" stroke="#1f2937" stroke-width="5"/><line x1="260" y1="480" x2="260" y2="1010" stroke="#5b6478" stroke-width="5" stroke-dasharray="12 8"/><line x1="260" y1="480" x2="382" y2="540" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 8"/><line x1="318" y1="492" x2="348" y2="522" stroke="#c0392b" stroke-width="5"/><line x1="348" y1="492" x2="318" y2="522" stroke="#c0392b" stroke-width="5"/><text x="85" y="565" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">cinta de unión</text><text x="85" y="605" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">RETIRADO</text><circle cx="398" cy="556" r="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><path d="M368 1010 L368 640 L384 580" stroke="#2e7d32" stroke-width="5" fill="none"/><text x="85" y="672" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">conductor verde hacia</text><text x="85" y="712" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">tornillo del marco</text><text x="85" y="950" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">cordón de 4 conductores</text><rect x="470" y="230" width="400" height="170" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="495" y="282" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">4 CONDUCTORES</text><text x="495" y="330" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Obra nueva: el marco</text><text x="495" y="374" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">conductor de tierra.</text><rect x="470" y="430" width="400" height="200" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="495" y="482" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">3 CONDUCTORES</text><text x="495" y="530" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Existente: marco sobre</text><text x="495" y="574" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">el neutro. Solo con las</text><text x="495" y="618" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">cuatro condiciones.</text><rect x="470" y="660" width="400" height="170" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="495" y="712" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">NEUTRO MÍNIMO</text><text x="495" y="760" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">10 AWG cobre</text><text x="495" y="804" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">8 AWG aluminio</text><text x="90" y="1090" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">Nunca deje puesta la cinta en un 4 hilos.</text></svg>