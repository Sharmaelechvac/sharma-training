<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Conexión de tubería de agua</title><desc id="d">Elevación de una tubería metálica de agua que entra a un edificio por una pared. Una banda dorada marca los primeros 5 ft dentro del punto de entrada con una abrazadera de tierra dentro de la banda marcada OK, y una segunda abrazadera más allá de 5 ft marcada solo unión. Abajo, dos paneles comparan un empalme irreversible del GEC con un conector partido enterrado en una pared.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Conexión de tubería de agua</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El electrodo son los primeros 5 ft adentro</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.68, 250.64(C), 250.104</text><rect x="0" y="520" width="110" height="380" rx="0" fill="url(#earth)" stroke="none" stroke-width="0"/><text x="62" y="950" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">TIERRA</text><rect x="110" y="280" width="55" height="620" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="4"/><text x="137" y="250" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">PARED</text><rect x="165" y="330" width="340" height="520" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="10 7"/><rect x="10" y="575" width="860" height="30" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="712" y="545" font-size="34" font-weight="600" fill="#5b6478" text-anchor="middle">tubería metálica</text><line x1="165" y1="380" x2="505" y2="380" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="335.0" y="368" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">5 ft desde la entrada</text><text x="335.0" y="368" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">5 ft desde la entrada</text><rect x="285" y="560" width="52" height="60" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="3"/><path d="M311,560 L311,300 L700,300" stroke="#2e7d32" stroke-width="5" fill="none"/><text x="700" y="285" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="middle">GEC hacia el</text><text x="700" y="327" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="middle">sistema de electrodos</text><rect x="160" y="466" width="456" height="50" rx="25" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="388.0" y="502" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">ABRAZADERA AQUÍ — BIEN</text><rect x="680" y="560" width="52" height="60" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><line x1="680" y1="560" x2="732" y2="620" stroke="#c0392b" stroke-width="4"/><line x1="680" y1="620" x2="732" y2="560" stroke="#c0392b" stroke-width="4"/><text x="640" y="895" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">pasados 5 ft: solo unión,</text><text x="640" y="937" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">no la conexión del electrodo</text><rect x="40" y="1010" width="400" height="250" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="64" y="1075" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">EMPALME — BIEN</text><text x="64" y="1128" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Irreversible</text><text x="64" y="1167" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">compresión o</text><text x="64" y="1206" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">soldadura exotérmica</text><text x="64" y="1245" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">(250.64(C))</text><rect x="460" y="1010" width="400" height="250" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="484" y="1075" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">EMPALME — NO</text><text x="484" y="1128" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Conector partido en una</text><text x="484" y="1167" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">mecánico, oculto,</text><text x="484" y="1206" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">no es empalme permitido</text><text x="450" y="1330" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Accesible, sobre metal limpio, con abrazaderas listadas.</text></svg>