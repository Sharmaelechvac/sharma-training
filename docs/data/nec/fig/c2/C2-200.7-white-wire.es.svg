<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">200.7 Conductores blancos y grises</title><desc id="d">Tres paneles. Primero: un lazo de interruptor en un conjunto de cable con el conductor blanco re-identificado permanentemente en ambos extremos, marcado OK. Segundo: un conductor blanco usado como fase sin marca, marcado NO. Tercero: un conductor blanco usado como tierra de equipos, marcado NO, con la nota de que las tierras son verdes, verdes con franjas amarillas o desnudas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">200.7 Conductores blancos y grises</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El color a tierra. Tres cajas, tres respuestas.</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 200.7, 200.7(C)</text><text x="870" y="1440" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="40" y="196" width="820" height="300" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="5"/><rect x="40" y="196" width="820" height="64" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5"/><rect x="40" y="230" width="820" height="30" rx="0" fill="#e8f5e9" stroke="none" stroke-width="0"/><text x="66" y="240" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">OK — LAZO DE INTERRUPTOR, EN CAJA</text><path d="M766,216 l12,14 l24,-30" stroke="#2e7d32" stroke-width="8" fill="none"/><rect x="100" y="292" width="130" height="66" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="165" y="334" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">LUZ</text><rect x="100" y="402" width="130" height="66" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="165" y="444" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERRUPTOR</text><line x1="140" y1="358" x2="140" y2="402" stroke="#1f2937" stroke-width="6"/><line x1="195" y1="358" x2="195" y2="402" stroke="#c9d2e3" stroke-width="6"/><rect x="186" y="362" width="18" height="12" rx="0" fill="#1f2937" stroke="none" stroke-width="0"/><rect x="186" y="386" width="18" height="12" rx="0" fill="#1f2937" stroke="none" stroke-width="0"/><text x="400" y="340" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">blanco re-identificado — cinta</text><text x="400" y="382" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">rodeándolo, en la luz</text><text x="400" y="424" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">caja y en la caja del interruptor</text><rect x="40" y="556" width="820" height="300" rx="14" fill="#ffffff" stroke="#c0392b" stroke-width="5"/><rect x="40" y="556" width="820" height="64" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="5"/><rect x="40" y="590" width="820" height="30" rx="0" fill="#fbe9e7" stroke="none" stroke-width="0"/><text x="66" y="600" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">NO — BLANCO COMO FASE SIN MARCAR</text><line x1="774" y1="568" x2="802" y2="608" stroke="#c0392b" stroke-width="8"/><line x1="802" y1="568" x2="774" y2="608" stroke="#c0392b" stroke-width="8"/><rect x="100" y="652" width="170" height="90" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="185" y="708" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERRUPTOR</text><line x1="270" y1="697" x2="380" y2="697" stroke="#c9d2e3" stroke-width="7"/><text x="278" y="664" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">blanco — sin marca</text><text x="410" y="700" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">parece un neutro —</text><text x="410" y="742" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">pero tiene energía. El siguiente</text><text x="410" y="784" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">la persona confía en el color.</text><rect x="40" y="916" width="820" height="300" rx="14" fill="#ffffff" stroke="#c0392b" stroke-width="5"/><rect x="40" y="916" width="820" height="64" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="5"/><rect x="40" y="950" width="820" height="30" rx="0" fill="#fbe9e7" stroke="none" stroke-width="0"/><text x="66" y="960" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">NO — BLANCO COMO TIERRA</text><line x1="774" y1="928" x2="802" y2="968" stroke="#c0392b" stroke-width="8"/><line x1="802" y1="928" x2="774" y2="968" stroke="#c0392b" stroke-width="8"/><text x="175" y="1010" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">conductor blanco</text><line x1="175" y1="1024" x2="175" y2="1080" stroke="#c9d2e3" stroke-width="7"/><line x1="137" y1="1086" x2="213" y2="1086" stroke="#1f2937" stroke-width="5"/><line x1="150" y1="1103" x2="200" y2="1103" stroke="#1f2937" stroke-width="5"/><line x1="163" y1="1120" x2="187" y2="1120" stroke="#1f2937" stroke-width="5"/><text x="410" y="1060" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">tierras: verde, verde con</text><text x="410" y="1102" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">franjas amarillas, o desnudo —</text><text x="410" y="1144" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">nunca blanco ni gris.</text></svg>