<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.12(A) Cuartos AFCI en una vivienda</title><desc id="d">Plano de casa con los cuartos que necesitan protección AFCI bajo 210.12(A) sombreados en dorado, y los cuartos fuera de la lista en blanco.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.12(A) Cuartos AFCI en una vivienda</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dorado = en la lista AFCI. Blanco = no listado.</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.12(A)</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="50" y="200" width="250" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="175.0" y="303.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">COCINA</text><rect x="300" y="200" width="250" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="425.0" y="303.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">COMEDOR</text><rect x="550" y="200" width="300" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="700.0" y="303.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SALA FAMILIAR</text><rect x="50" y="380" width="250" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="175.0" y="483.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SALA</text><rect x="300" y="380" width="250" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="425.0" y="483.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DORMITORIO</text><rect x="550" y="380" width="130" height="180" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="615.0" y="470.0" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">BAÑO</text><text x="615.0" y="510.0" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">no listado</text><rect x="680" y="380" width="170" height="180" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="765.0" y="483.0" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">LAVAND.</text><rect x="50" y="560" width="500" height="140" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><text x="300.0" y="643.0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PASILLOS + CLÓSETS</text><rect x="550" y="560" width="300" height="140" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="700.0" y="630.0" font-size="34" font-weight="800" fill="#5b6478" text-anchor="middle">GARAJE</text><text x="700.0" y="670.0" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">no listado</text><rect x="50" y="760" width="44" height="34" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="3"/><text x="115" y="788" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">En la lista de 210.12(A): protección AFCI</text><rect x="50" y="820" width="44" height="34" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><text x="115" y="848" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">No en la lista (sótano sin terminar tampoco)</text><text x="50" y="940" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Aplica a 120V, monofásico, 15A y 20A</text><text x="50" y="988" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">circuitos ramales que alimentan salidas o aparatos.</text><text x="50" y="1036" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Un artefacto de 240V está fuera del rango.</text><text x="50" y="1084" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">S-07: los interruptores de doble función Sharma</text><text x="50" y="1132" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">cubren la lista de 120V por defecto.</text></svg>