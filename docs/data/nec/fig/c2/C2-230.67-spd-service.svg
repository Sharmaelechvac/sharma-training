<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">230.67 Surge protection at the service</title><desc id="d">A surge arrives on the service drop; the SPD beside the meter-main clamps it and shunts the energy down the grounding electrode conductor to the rod, keeping it out of the house panel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">230.67 Surge protection at the service</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A listed Type 1 or Type 2 SPD, at the service.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 230.67; SPDs: Article 242</text><line x1="96" y1="210" x2="96" y2="560" stroke="#1f2937" stroke-width="6"/><line x1="56" y1="250" x2="136" y2="250" stroke="#1f2937" stroke-width="6"/><line x1="96" y1="262" x2="292" y2="330" stroke="#1f2937" stroke-width="4"/><text x="30" y="610" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">utility pole</text><line x1="280" y1="210" x2="280" y2="1180" stroke="#1f2937" stroke-width="6"/><text x="292" y="246" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">house wall</text><rect x="280" y="320" width="240" height="340" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="400" cy="420" r="44" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="400" y="434" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">M</text><circle cx="400" cy="520" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="400" cy="576" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><path d="M400,520 A30,30 0 0 1 400,576" stroke="#1a2f61" stroke-width="5" fill="none"/><text x="400" y="640" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">METER-MAIN</text><line x1="340" y1="660" x2="340" y2="716" stroke="#1f2937" stroke-width="5"/><line x1="460" y1="660" x2="460" y2="716" stroke="#1f2937" stroke-width="5"/><rect x="280" y="716" width="240" height="170" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="400" y="768" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">SPD</text><polygon points="405,794 386,830 399,830 394,858 415,821 401,821" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><path d="M110,268 L190,282 L160,300 L268,330" stroke="#c0392b" stroke-width="5" fill="none"/><line x1="400" y1="664" x2="400" y2="712" stroke="#c0392b" stroke-width="6"/><path d="M310,886 C290,980 270,1020 262,1086" stroke="#2e7d32" stroke-width="6" fill="none"/><line x1="262" y1="716" x2="262" y2="1090" stroke="#2e7d32" stroke-width="4"/><rect x="252" y="1090" width="20" height="90" rx="0" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><rect x="0" y="1180" width="900" height="100" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1228" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">grounding electrode</text><rect x="545" y="320" width="335" height="118" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="578" cy="379" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="578" y="390" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="612" y="368" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Surge arrives on</text><text x="612" y="406" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">the service drop</text><rect x="545" y="470" width="335" height="118" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="578" cy="529" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="578" y="540" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="612" y="518" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">SPD clamps it</text><text x="612" y="556" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">at the service</text><rect x="545" y="620" width="335" height="118" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="578" cy="679" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="578" y="690" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="612" y="668" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Short, straight</text><text x="612" y="706" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">leads to the SPD</text><rect x="545" y="770" width="335" height="118" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="578" cy="829" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="578" y="840" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="612" y="818" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Energy to ground</text><text x="612" y="856" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">not into the house</text><text x="30" y="1360" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Not a lightning protection system.</text><text x="30" y="1402" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Point-of-use protection still guards sensitive gear.</text></svg>