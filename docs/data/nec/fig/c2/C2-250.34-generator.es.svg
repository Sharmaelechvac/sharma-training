<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Generador portátil: lea la etiqueta</title><desc id="d">Un generador portátil con su tablero de receptáculos, una etiqueta de placa que pregunta si el neutro está unido al marco o flotante, y el marco unido a los terminales de tierra del receptáculo. A su lado, un cordón de retroalimentación a un receptáculo de secadora está tachado en rojo. Abajo, se comparan generadores de neutro unido y de neutro flotante.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Generador portátil: lea la etiqueta</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El marco es la referencia de tierra</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.34, 250.30</text><text x="870" y="1500" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="50" y="320" width="470" height="420" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="50" y="320" width="470" height="66" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="72" y="366" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">GENERADOR PORTÁTIL</text><rect x="75" y="420" width="280" height="150" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="84" y="464" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">PLACA DE DATOS</text><text x="92" y="505" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">¿neutro unido?</text><text x="92" y="546" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">¿o flotante?</text><rect x="365" y="420" width="130" height="180" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="405" cy="480" r="24" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="455" cy="480" r="24" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="430" cy="560" r="24" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="430" y="640" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">receptáculos</text><path d="M430,600 L430,690 L110,690" stroke="#F0A846" stroke-width="6" fill="none"/><circle cx="130" cy="778" r="32" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="440" cy="778" r="32" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="50" y1="740" x2="520" y2="740" stroke="#264387" stroke-width="5"/><text x="450" y="855" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">unión dorada: del marco a los terminales de tierra</text><rect x="560" y="320" width="320" height="420" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="690" y="272" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">CORDÓN DE</text><text x="690" y="306" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">RETROALIMENTACIÓN</text><rect x="672" y="440" width="96" height="96" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><circle cx="720" cy="488" r="20" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><path d="M720,536 C695,600 750,610 728,660" stroke="#c0392b" stroke-width="4" fill="none"/><text x="720" y="705" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">recept. secadora</text><line x1="572" y1="332" x2="868" y2="728" stroke="#c0392b" stroke-width="6"/><line x1="868" y1="332" x2="572" y2="728" stroke="#c0392b" stroke-width="6"/><rect x="40" y="930" width="400" height="250" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="64" y="992" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">NEUTRO UNIDO</text><text x="64" y="1048" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">La unión vive en el</text><text x="64" y="1087" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">generador. El equipo de</text><text x="64" y="1126" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">transferencia no añade</text><text x="64" y="1165" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">una segunda unión.</text><rect x="460" y="930" width="400" height="250" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="484" y="992" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">NEUTRO FLOTANTE</text><text x="484" y="1048" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Neutro aislado de</text><text x="484" y="1087" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">el marco. La unión</text><text x="484" y="1126" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">queda en la acometida</text><text x="484" y="1165" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">con equipo estándar.</text><rect x="40" y="1230" width="820" height="130" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1268" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">¿Alimenta una casa? Entrada listada</text><text x="450" y="1308" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">+ enclavamiento o interruptor</text><text x="450" y="1348" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">de transferencia: siempre, sin excepción.</text></svg>