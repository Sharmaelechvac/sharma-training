<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1290" width="900" height="1290" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">220.83 Can the old service carry it?</title><desc id="d">A worksheet bar: existing 26 kVA plus a 6 kVA addition makes 32 kVA; the first 8 kVA counts at 100 percent and the remaining 24 kVA at 40 percent, giving 17.6 kVA, about 73 A, against a 200 A service.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1290" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">220.83 Can the old service carry it?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">220.83(A) — addition other than AC or space heat</text><line x1="30" y1="1232" x2="870" y2="1232" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1270" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 220.83(A)</text><text x="870" y="1270" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="60" y="250" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EXISTING 26 kVA + ADDED 6 kVA = 32 kVA</text><rect x="60" y="290" width="195" height="110" rx="0" fill="#F0A846" stroke="#264387" stroke-width="3"/><rect x="255" y="290" width="585" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="74" y="360" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">8 kVA</text><text x="279" y="360" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">24 kVA</text><text x="74" y="452" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">at 100%</text><text x="279" y="452" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">at 40%  →  9.6 kVA</text><text x="450" y="580" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">= 8 + 9.6 = 17.6 kVA demand</text><text x="60" y="690" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">DEMAND ≈ 73 A  vs  EXISTING SERVICE 200 A</text><rect x="60" y="730" width="284" height="110" rx="0" fill="#2e7d32" stroke="#264387" stroke-width="3"/><rect x="344" y="730" width="496" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="74" y="800" font-size="38" font-weight="800" fill="#ffffff" text-anchor="start">73 A</text><text x="826" y="800" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="end">200 A</text><text x="60" y="920" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="start">✓  FITS — no service increase required</text><text x="60" y="985" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">If the result topped 200 A, the service goes up</text><text x="60" y="1031" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">and is sized by the regular methods.</text></svg>