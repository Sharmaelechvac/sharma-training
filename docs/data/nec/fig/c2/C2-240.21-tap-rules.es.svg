<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">240.21 Reglas de derivación de 10 y 25 ft</title><desc id="d">Un alimentador de 400 A con dos derivaciones: una derivación corta de 10 ft o menos que termina en un tablero de 100 A bajo la regla de un décimo, y una derivación más larga de hasta 25 ft que termina en un solo interruptor bajo la regla de un tercio.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">240.21 Reglas de derivación de 10 y 25 ft</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Alimentador de 400 A — el largo elige la regla</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 240.21(B)(1), (B)(2)</text><rect x="50" y="210" width="800" height="84" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="268" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle">ALIMENTADOR DE 400 A</text><line x1="250" y1="294" x2="250" y2="690" stroke="#264387" stroke-width="6"/><line x1="250" y1="294" x2="153" y2="294" stroke="#1a2f61" stroke-width="2"/><line x1="250" y1="690" x2="153" y2="690" stroke="#1a2f61" stroke-width="2"/><line x1="165" y1="294" x2="165" y2="690" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(153,492.0) rotate(-90)"><text x="0" y="0" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 10 ft</text><text x="0" y="0" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 10 ft</text></g><rect x="130" y="690" width="240" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="250" y="748" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">100 A</text><text x="250" y="794" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">TABLERO</text><circle cx="420" cy="408" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="420" y="420" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="650" y1="294" x2="650" y2="940" stroke="#264387" stroke-width="6"/><line x1="650" y1="294" x2="553" y2="294" stroke="#1a2f61" stroke-width="2"/><line x1="650" y1="940" x2="553" y2="940" stroke="#1a2f61" stroke-width="2"/><line x1="565" y1="294" x2="565" y2="940" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(553,617.0) rotate(-90)"><text x="0" y="0" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 25 ft</text><text x="0" y="0" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 25 ft</text></g><rect x="530" y="940" width="240" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="650" y="998" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">SENCILLO</text><text x="650" y="1044" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">INTERRUPTOR</text><circle cx="720" cy="408" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="720" y="420" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="86" cy="1188" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="86" y="1200" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="130" y="1200" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">la derivación de 10 ft termina en su dispositivo</text><circle cx="86" cy="1266" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="86" y="1278" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="130" y="1278" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Ampacidad ≥ carga, ≥ 1/10 del OCPD</text><circle cx="86" cy="1344" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="86" y="1356" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="130" y="1356" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">la de 25 ft termina en un solo interruptor</text><circle cx="86" cy="1422" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="86" y="1434" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="130" y="1434" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">A