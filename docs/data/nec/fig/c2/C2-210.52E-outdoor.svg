<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1490" width="900" height="1490" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.52(E) Outdoor receptacles</title><desc id="d">Elevation of the back wall of a house on a sloped lot showing a receptacle 6.5 ft above the sloping grade, plus a plan of a 140 sq ft lanai with its own receptacle.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1490" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.52(E) Outdoor receptacles</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Back wall on a sloped lot</text><line x1="30" y1="1432" x2="870" y2="1432" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1470" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.52(E)(1), (E)(3)</text><text x="30" y="214" font-size="34" font-weight="900" fill="#264387" text-anchor="start">BACK WALL — SLOPED LOT</text><path d="M30,690 L870,800 L870,860 L30,860 Z" stroke="none" stroke-width="3" fill="url(#earth)"/><line x1="30" y1="690" x2="870" y2="800" stroke="#1f2937" stroke-width="5"/><rect x="120" y="300" width="480" height="390" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="6"/><path d="M100,300 L360,190 L620,300" stroke="#1f2937" stroke-width="6" fill="none"/><text x="360" y="420" font-size="36" font-weight="800" fill="#5b6478" text-anchor="middle">HOUSE</text><circle cx="560" cy="564" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="553" y1="558" x2="553" y2="570" stroke="#1a2f61" stroke-width="3"/><line x1="567" y1="558" x2="567" y2="570" stroke="#1a2f61" stroke-width="3"/><line x1="660" y1="564" x2="660" y2="759" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(648,661.5) rotate(-90)"><text x="0" y="0" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6½ ft max</text><text x="0" y="0" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6½ ft max</text></g><text x="560" y="520" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">receptacle</text><circle cx="795" cy="712" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="4"/><line x1="795" y1="727" x2="795" y2="762" stroke="#1f2937" stroke-width="4"/><line x1="795" y1="762" x2="780" y2="790" stroke="#1f2937" stroke-width="4"/><line x1="795" y1="762" x2="810" y2="790" stroke="#1f2937" stroke-width="4"/><text x="30" y="905" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Height is measured from grade at that wall.</text><text x="30" y="947" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Front of the dwelling: one more, same rule.</text><text x="30" y="1000" font-size="34" font-weight="900" fill="#264387" text-anchor="start">LANAI / DECK — 20 SQ FT OR MORE</text><rect x="120" y="1060" width="500" height="200" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="5"/><rect x="300" y="1054" width="140" height="12" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="370" y="1096" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">door from inside</text><circle cx="180" cy="1060" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="173" y1="1054" x2="173" y2="1066" stroke="#1a2f61" stroke-width="3"/><line x1="187" y1="1054" x2="187" y2="1066" stroke="#1a2f61" stroke-width="3"/><text x="370" y="1180" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LANAI  10 ft × 14 ft = 140 sq ft</text><line x1="120" y1="1260" x2="120" y2="1317" stroke="#1a2f61" stroke-width="2"/><line x1="620" y1="1260" x2="620" y2="1317" stroke="#1a2f61" stroke-width="2"/><line x1="120" y1="1305" x2="620" y2="1305" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="370.0" y="1293" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">14 ft</text><text x="370.0" y="1293" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">14 ft</text><text x="120" y="1370" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Its own receptacle within the perimeter,</text><text x="120" y="1412" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">no more than 6½ ft above the deck.</text></svg>