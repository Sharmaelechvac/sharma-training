<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1830" width="900" height="1830" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">250.50 The grounding electrode system</title><desc id="d">Section view of a slab house: concrete-encased electrode in the footing, two ground rods 6 ft apart and 8 ft long, grounding electrode conductors to each, main bonding jumper at the meter-main, interior water pipe bond.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1830" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">250.50 The grounding electrode system</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Florida slab house, 200 A service on 2/0 Cu</text><line x1="30" y1="1772" x2="870" y2="1772" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1810" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.50, .52, .53, .66, .104</text><rect x="0" y="760" width="900" height="330" rx="0" fill="url(#earth)" stroke="none" stroke-width="0"/><line x1="0" y1="760" x2="900" y2="760" stroke="#1f2937" stroke-width="5"/><text x="880" y="746" font-size="32" font-weight="800" fill="#5b6478" text-anchor="end">grade</text><rect x="40" y="720" width="340" height="40" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="3"/><rect x="380" y="260" width="80" height="500" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="3"/><text x="140" y="700" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">slab</text><text x="420" y="240" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">wall</text><rect x="340" y="760" width="160" height="130" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="4"/><circle cx="370" cy="860" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="420" cy="860" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="470" cy="860" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="370" y1="860" x2="470" y2="860" stroke="#1a2f61" stroke-width="4"/><text x="420" y="930" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">footing</text><rect x="462" y="380" width="110" height="190" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="517" cy="430" r="30" fill="#ffffff" stroke="#F0A846" stroke-width="4"/><text x="517" y="366" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">meter-main</text><path d="M482,570 L482,740 L470,740 L470,852" stroke="#F0A846" stroke-width="8" fill="none"/><rect x="633" y="760" width="14" height="272" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><rect x="837" y="760" width="14" height="272" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><path d="M552,570 L552,776 L844,776" stroke="#F0A846" stroke-width="8" fill="none"/><line x1="640" y1="1002" x2="844" y2="1002" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="742.0" y="990" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft min</text><text x="742.0" y="990" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft min</text><line x1="604" y1="760" x2="604" y2="1032" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="590" y="908.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">8 ft</text><text x="590" y="908.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">8 ft</text><rect x="60" y="560" width="260" height="18" rx="0" fill="#5b6478" stroke="#1f2937" stroke-width="2"/><text x="60" y="546" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">metal water pipe (inside)</text><path d="M300,569 L422,569 L422,500 L462,500" stroke="#1a2f61" stroke-width="5" fill="none" stroke-dasharray="12 8"/><circle cx="420" cy="806" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="420" y="818" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="535" cy="700" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="535" y="712" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="760" cy="910" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="760" y="922" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="760" cy="730" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="760" y="742" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><circle cx="517" cy="500" r="24" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="517" y="512" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">5</text><circle cx="190" cy="630" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="190" y="642" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">6</text><circle cx="46" cy="1159" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1171" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="82" y="1170" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Concrete-encased electrode (Ufer): 20 ft of</text><text x="82" y="1210" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">½ in rebar or bare 4 AWG Cu, 2 in of concrete</text><circle cx="46" cy="1255" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1267" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="82" y="1266" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">GEC to the Ufer: never has to be larger</text><text x="82" y="1306" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">than 4 AWG Cu (250.66(B))</text><circle cx="46" cy="1351" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1363" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="82" y="1362" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Rods: 8 ft in soil, 5/8 in unless listed, 6 ft</text><text x="82" y="1402" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">apart (2nd rod unless 25 ohms or less tested)</text><circle cx="46" cy="1447" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1459" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="82" y="1458" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">GEC / jumper to rods: never has to be</text><text x="82" y="1498" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">larger than 6 AWG Cu (250.66(A))</text><circle cx="46" cy="1543" r="21" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1555" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">5</text><text x="82" y="1554" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Main bonding jumper: at the service</text><text x="82" y="1594" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">disconnect only (250.24, 250.28)</text><circle cx="46" cy="1639" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1651" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">6</text><text x="82" y="1650" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Interior metal water pipe: bond it</text><text x="82" y="1690" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">(250.104(A)); size from Table 250.102(C)(1)</text></svg>