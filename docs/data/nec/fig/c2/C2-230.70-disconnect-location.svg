<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Where the service disconnect goes</title><desc id="d">Elevation of a house wall showing three service disconnect placements: outside next to the meter (permitted), the panel directly behind the meter in the Sharma back-to-back layout (permitted, inches of conductor inside), and a panel deep inside the building (not permitted without AHJ acceptance).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Where the service disconnect goes</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Outside, or inside nearest the entrance</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 230.70(A)(1); Sharma S-09</text><line x1="300" y1="240" x2="300" y2="920" stroke="#264387" stroke-width="6"/><text x="150" y="300" font-size="34" font-weight="800" fill="#5b6478" text-anchor="middle">OUTSIDE</text><text x="560" y="300" font-size="34" font-weight="800" fill="#5b6478" text-anchor="middle">INSIDE</text><line x1="40" y1="920" x2="860" y2="920" stroke="#1f2937" stroke-width="5"/><circle cx="170" cy="470" r="58" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="170" y="484" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">METER</text><text x="320" y="352" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">Service enters here</text><line x1="300" y1="362" x2="300" y2="430" stroke="#1a2f61" stroke-width="3"/><rect x="105" y="620" width="130" height="110" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="170" y="688" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DISC</text><text x="40" y="800" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">1  Disconnect outside ✓</text><rect x="330" y="400" width="150" height="190" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="405" y="508" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">PANEL</text><text x="330" y="652" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">2  Behind the meter (S-09) ✓</text><rect x="660" y="400" width="150" height="190" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="735" y="508" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">PANEL</text><path d="M480,545 L660,545" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="10 8"/><text x="570" y="528" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">unfused run</text><text x="870" y="700" font-size="32" font-weight="800" fill="#c0392b" text-anchor="end">3  Deep inside the house ✗</text><line x1="300" y1="1000" x2="405" y2="1000" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="352.5" y="988" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">inches, not feet</text><text x="352.5" y="988" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">inches, not feet</text><text x="40" y="1120" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Readily accessible: no locked room,</text><text x="40" y="1174" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">no stored junk blocking the way.</text><text x="40" y="1228" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Every occupant needs access to the</text><text x="40" y="1282" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">disconnect for their own space.</text></svg>