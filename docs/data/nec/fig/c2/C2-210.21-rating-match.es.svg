<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.21: iguale el dispositivo al circuito</title><desc id="d">Dos tablas dibujadas como gráficos: los valores de receptáculo permitidos en cada tamaño de circuito donde se alimentan dos o más receptáculos, lo máximo que puede tomar una carga de cordón y enchufe, y la advertencia de que un receptáculo sencillo en un circuito individual debe tener un valor al menos igual al del circuito.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.21: iguale el dispositivo al circuito</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Receptáculos en un circuito multisalida.</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.21, Tablas 210.21(B)(2) y (B)(3)</text><rect x="30" y="196" width="840" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="60" y="240" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">CIRCUITO</text><text x="330" y="240" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">RECEPTÁCULO PERMITIDO</text><rect x="30" y="272" width="840" height="78" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><text x="60" y="324" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">15 A</text><text x="255" y="324" font-size="38" font-weight="700" fill="#5b6478" text-anchor="start">→</text><text x="330" y="324" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">no más de 15 A</text><rect x="30" y="360" width="840" height="78" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><text x="60" y="412" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">20 A</text><text x="255" y="412" font-size="38" font-weight="700" fill="#5b6478" text-anchor="start">→</text><text x="330" y="412" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">15 A o 20 A</text><rect x="30" y="448" width="840" height="78" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><text x="60" y="500" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">30 A</text><text x="255" y="500" font-size="38" font-weight="700" fill="#5b6478" text-anchor="start">→</text><text x="330" y="500" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">30 A</text><rect x="30" y="536" width="840" height="78" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><text x="60" y="588" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">40 A</text><text x="255" y="588" font-size="38" font-weight="700" fill="#5b6478" text-anchor="start">→</text><text x="330" y="588" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">40 A o 50 A</text><rect x="30" y="624" width="840" height="78" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><text x="60" y="676" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">50 A</text><text x="255" y="676" font-size="38" font-weight="700" fill="#5b6478" text-anchor="start">→</text><text x="330" y="676" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">50 A</text><rect x="30" y="756" width="840" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="60" y="800" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">UNA CARGA DE ENCHUFE MÁX. — (B)(2)</text><rect x="30" y="832" width="840" height="68" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><text x="60" y="878" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">15 A</text><text x="255" y="878" font-size="38" font-weight="700" fill="#5b6478" text-anchor="start">→</text><text x="330" y="878" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">12 A</text><rect x="30" y="910" width="840" height="68" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><text x="60" y="956" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">20 A</text><text x="255" y="956" font-size="38" font-weight="700" fill="#5b6478" text-anchor="start">→</text><text x="330" y="956" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">16 A</text><rect x="30" y="988" width="840" height="68" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><text x="60" y="1034" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">30 A</text><text x="255" y="1034" font-size="38" font-weight="700" fill="#5b6478" text-anchor="start">→</text><text x="330" y="1034" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">24 A</text><rect x="30" y="1090" width="840" height="158" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="55" y="1142" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">Receptáculo sencillo, circuito individual:</text><text x="55" y="1188" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">su valor debe ser al menos el valor del circuito.</text><text x="55" y="1232" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Un dúplex de 15 A en un circuito de 20 A falla.</text></svg>