<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 230: one service assembly</title><desc id="d">Flow diagram of a dwelling service assembly: utility service point, service conductors by drop or lateral, meter, outdoor Siemens meter-main holding the service disconnect, and the indoor panel directly behind the meter; a panel below lists what lands at the meter-main: emergency disconnect, surge protection, main bonding jumper and the grounding electrode system.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 230: one service assembly</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plan every piece at rough-in.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 230; 230.67, 230.85; Article 250</text><rect x="110" y="196" width="680" height="104" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="244" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">UTILITY SERVICE POINT</text><text x="450.0" y="284" font-size="32" font-weight="600" fill="#F0A846" text-anchor="middle">utility conductors end</text><line x1="450" y1="300" x2="450" y2="352" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="352" width="680" height="104" rx="12" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="400" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">SERVICE CONDUCTORS</text><text x="450.0" y="440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">drop or underground lateral</text><line x1="450" y1="456" x2="450" y2="508" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="508" width="680" height="104" rx="12" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="556" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">METER</text><text x="450.0" y="596" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">utility metering</text><line x1="450" y1="612" x2="450" y2="664" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="664" width="680" height="104" rx="12" fill="#fdf3e0" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="712" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">METER-MAIN (S-02)</text><text x="450.0" y="752" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Siemens — service disconnect here</text><line x1="450" y1="768" x2="450" y2="820" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="820" width="680" height="104" rx="12" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="868" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">INDOOR PANEL</text><text x="450.0" y="908" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">behind the meter (S-09)</text><rect x="60" y="960" width="780" height="252" rx="12" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="90" y="1012" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">ALL LAND AT THE METER-MAIN:</text><text x="90" y="1064" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">• Emergency disconnect — 230.85</text><text x="90" y="1108" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">• Surge protection (SPD) — 230.67</text><text x="90" y="1152" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">• Main bonding jumper — 250.28</text><text x="90" y="1196" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">• Grounding electrode system — Article 250</text><text x="60" y="1288" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Article 230 ends at the service disconnect.</text><text x="60" y="1334" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Everything past it is a feeder or a branch circuit.</text></svg>