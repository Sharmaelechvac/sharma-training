ght="272" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><path d="M552,570 L552,776 L844,776" stroke="#F0A846" stroke-width="8" fill="none"/><line x1="640" y1="1002" x2="844" y2="1002" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="742.0" y="990" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft min</text><text x="742.0" y="990" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft min</text><line x1="604" y1="760" x2="604" y2="1032" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="590" y="908.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">8 ft</text><text x="590" y="908.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">8 ft</text><rect x="60" y="560" width="260" height="18" rx="0" fill="#5b6478" stroke="#1f2937" stroke-width="2"/><text x="60" y="546" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">tubería metálica de agua</text><path d="M300,569 L422,569 L422,500 L462,500" stroke="#1a2f61" stroke-width="5" fill="none" stroke-dasharray="12 8"/><circle cx="420" cy="806" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="420" y="818" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="535" cy="700" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="535" y="712" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="760" cy="910" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="760" y="922" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="760" cy="730" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="760" y="742" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><circle cx="517" cy="500" r="24" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="517" y="512" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">5</text><circle cx="190" cy="630" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="190" y="642" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">6</text><circle cx="46" cy="1159" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1171" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="82" y="1170" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Electrodo embebido en concreto (Ufer): 20 ft de</text><text x="82" y="1210" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">varilla de ½ in o 4 AWG Cu desnudo, 2 in de concreto</text><circle cx="46" cy="1255" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1267" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="82" y="1266" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">GEC al Ufer: nunca tiene que ser mayor</text><text x="82" y="1306" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">que 4 AWG Cu (250.66(B))</text><circle cx="46" cy="1351" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1363" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="82" y="1362" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Varillas: 8 ft en el suelo, 5/8 in salvo listadas, 6 ft</text><text x="82" y="1402" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">de separación (2.ª varilla salvo prueba de 25 ohmios)</text><circle cx="46" cy="1447" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1459" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="82" y="1458" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">GEC / puente a varillas: nunca tiene que ser</text><text x="82" y="1498" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">mayor que 6 AWG Cu (250.66(A))</text><circle cx="46" cy="1543" r="21" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1555" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">5</text><text x="82" y="1554" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Puente principal de unión: en la acometida</text><text x="82" y="1594" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">solo desconexión (250.24, 250.28)</text><circle cx="46" cy="1639" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1651" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">6</text><text x="82" y="1650" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Tubería metálica interior de agua: únala</text><text x="82" y="1690" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">(250.104(A)); tamaño de la Tabla 250.102(C)(1)</text></svg>