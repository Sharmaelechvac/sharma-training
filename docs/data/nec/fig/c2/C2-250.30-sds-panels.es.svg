<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">250.30 ¿Es derivado por separado?</title><desc id="d">Dos paneles unifilares: un generador cuyo neutro no se conmuta en el interruptor de transferencia no es derivado por separado y el neutro queda unido solo en la acometida; un generador con neutro conmutado es derivado por separado y recibe su puente de unión del sistema en el generador y un conductor del electrodo de tierra al sistema de electrodos del edificio.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">250.30 ¿Es derivado por separado?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El interruptor de transferencia decide: ¿se conmuta?</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.30(A)(1), (A)(4); 250.34</text><rect x="40" y="196" width="400" height="690" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="40" y="196" width="400" height="74" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="40" y="240" width="400" height="30" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="240" y="246" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">NEUTRO NO CONMUTADO</text><rect x="110" y="310" width="260" height="96" rx="10" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="240" y="370" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">GENERADOR</text><line x1="240" y1="406" x2="240" y2="452" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="458" width="320" height="96" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="240" y="500" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">TRANSFERENCIA</text><text x="240" y="538" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">3 polos, N sólido</text><line x1="240" y1="554" x2="240" y2="600" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="110" y="606" width="260" height="96" rx="10" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="240" y="666" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="64" y="748" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">No derivado por separado</text><text x="64" y="792" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">El neutro queda unido</text><text x="64" y="836" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">SOLO en la acometida</text><text x="64" y="880" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="start">✓ Generador sin unión</text><rect x="460" y="196" width="400" height="690" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="460" y="196" width="400" height="74" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="460" y="240" width="400" height="30" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="660" y="246" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">NEUTRO CONMUTADO</text><rect x="530" y="310" width="260" height="96" rx="10" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="660" y="370" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">GENERADOR</text><line x1="660" y1="406" x2="660" y2="452" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="500" y="458" width="320" height="96" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="660" y="500" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">TRANSFERENCIA</text><text x="660" y="538" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">4 polos, N conmutado</text><line x1="660" y1="554" x2="660" y2="600" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="530" y="606" width="260" height="96" rx="10" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="660" y="666" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="484" y="748" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">Un sistema separado</text><text x="484" y="792" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">Unión en el generador</text><text x="484" y="836" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">o primera desconexión</text><text x="484" y="880" font-size="30" font-weight="800" fill="#F0A846" text-anchor="start">GEC a los electrodos</text><rect x="40" y="930" width="820" height="180" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="990" font-size="33" font-weight="900" fill="#c0392b" text-anchor="middle">Una varilla sola en el generador es decoración,</text><text x="450" y="1036" font-size="33" font-weight="900" fill="#c0392b" text-anchor="middle">no es tierra. Dos uniones de neutro ponen el neutro</text><text x="450" y="1082" font-size="33" font-weight="900" fill="#c0392b" text-anchor="middle">corriente en el trayecto de tierra.</text><text x="40" y="1180" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Puente de unión: en la fuente o en la primera</text><text x="40" y="1219" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">desconexión — UN punto (250.30(A)(1)).</text></svg>