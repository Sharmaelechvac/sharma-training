<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Feeder clearances: 10 / 12 / 18 ft</title><desc id="d">Profile of an overhead feeder from a house mast to a pole crossing lawn, a driveway and a street, with dashed clearance lines and dimension lines showing 10 ft over pedestrian lawn, 12 ft over the driveway and 18 ft over the street. Notes under the title give the voltage conditions for the 10 ft and 12 ft clearances and the 15 ft case.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Feeder clearances: 10 / 12 / 18 ft</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">One span at final sag — highest zone wins</text><text x="30" y="202" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">10 ft — pedestrians only, ≤ 150 V to ground</text><text x="30" y="248" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">12 ft — ≤ 300 V to ground · 15 ft — over 300 V</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 225.18; roofs: 225.19(A)</text><rect x="0" y="1150" width="900" height="212" rx="0" fill="url(#earth)" stroke="none" stroke-width="0"/><line x1="0" y1="1150" x2="900" y2="1150" stroke="#1f2937" stroke-width="5"/><line x1="400" y1="1150" x2="400" y2="1210" stroke="#5b6478" stroke-width="3" stroke-dasharray="6 6"/><line x1="620" y1="1150" x2="620" y2="1210" stroke="#5b6478" stroke-width="3" stroke-dasharray="6 6"/><text x="285" y="1212" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LAWN</text><text x="285" y="1254" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">pedestrians</text><text x="510" y="1212" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DRIVEWAY</text><text x="510" y="1254" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">residential</text><text x="700" y="1212" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">STREET</text><text x="700" y="1254" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">trucks</text><text x="845" y="1212" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">POLE</text><rect x="30" y="830" width="130" height="320" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><path d="M20,830 L95,760 L170,830" stroke="#264387" stroke-width="5" fill="none"/><line x1="150" y1="760" x2="150" y2="470" stroke="#264387" stroke-width="6"/><text x="95" y="1212" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">HOUSE</text><line x1="845" y1="430" x2="845" y2="1150" stroke="#264387" stroke-width="7"/><line x1="790" y1="470" x2="890" y2="470" stroke="#264387" stroke-width="5"/><line x1="170" y1="850" x2="400" y2="850" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/><line x1="400" y1="790" x2="620" y2="790" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/><line x1="620" y1="610" x2="845" y2="610" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/><path d="M150,470 Q497,690 845,470" stroke="#1f2937" stroke-width="5" fill="none"/><text x="497" y="300" font-size="34" font-weight="600" fill="#5b6478" text-anchor="middle">conductor at final sag</text><line x1="310" y1="850" x2="310" y2="1150" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="324" y="1012.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft min</text><text x="324" y="1012.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">10 ft min</text><line x1="520" y1="790" x2="520" y2="1150" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="534" y="982.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 ft min</text><text x="534" y="982.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">12 ft min</text><line x1="700" y1="610" x2="700" y2="1150" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="714" y="892.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">18 ft min</text><text x="714" y="892.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">18 ft min</text></svg>