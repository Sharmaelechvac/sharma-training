<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Artículo 200 Identificación del neutro</title><desc id="d">Detalle de tablero que muestra conductores blancos a tierra en una barra de neutro aislada, tierras de equipo verdes y desnudas en una barra de tierra, una fase negra en un interruptor, y un conductor blanco re-identificado con cinta negra para un lazo de interruptor.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1600" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Artículo 200 Identificación del neutro</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Detalle del tablero: el blanco a la barra de neutro</text><line x1="30" y1="1542" x2="870" y2="1542" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1580" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 200.6, 200.7</text><text x="870" y="1580" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="180" y="210" width="540" height="690" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="6"/><text x="450" y="268" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO DE ALIMENTADOR</text><rect x="228" y="320" width="54" height="470" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="255" y="838" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">NEUTRO</text><rect x="618" y="320" width="54" height="470" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="645" y="838" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">TIERRA</text><rect x="400" y="320" width="100" height="150" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="405" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">20 A</text><path d="M360,900 L360,560 L262,560" stroke="#c9d2e3" stroke-width="10" fill="none"/><path d="M392,900 L392,560 L262,560" stroke="#c9d2e3" stroke-width="10" fill="none"/><path d="M424,900 L424,560 L262,560" stroke="#c9d2e3" stroke-width="10" fill="none"/><path d="M450,470 L450,900" stroke="#1f2937" stroke-width="10" fill="none"/><path d="M540,900 L540,600 L638,600" stroke="#2e7d32" stroke-width="8" fill="none"/><path d="M572,900 L572,600 L638,600" stroke="#2e7d32" stroke-width="8" fill="none"/><text x="60" y="985" font-size="34" font-weight="900" fill="#264387" text-anchor="start">QUIÉN ES QUIÉN</text><rect x="60" y="1012" width="44" height="30" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="124" y="1040" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">A tierra (neutro): blanco o gris (200.6)</text><rect x="60" y="1072" width="44" height="30" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="124" y="1100" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Tierra de equipos: verde/amarillo o desnudo</text><rect x="60" y="1132" width="44" height="30" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="3"/><text x="124" y="1160" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Sin tierra (fase): negro, aterriza en el interruptor</text><rect x="120" y="1230" width="660" height="130" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><line x1="150" y1="1295" x2="630" y2="1295" stroke="#c9d2e3" stroke-width="12"/><rect x="560" y="1278" width="90" height="34" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><text x="150" y="1425" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Blanco re-identificado como fase (lazo):</text><text x="150" y="1475" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">póngale cinta de fase en cada caja (200.7).</text></svg>