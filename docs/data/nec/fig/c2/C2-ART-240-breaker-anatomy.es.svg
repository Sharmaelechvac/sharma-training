<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Artículo 240 Anatomía de un interruptor</title><desc id="d">Un centro de carga con un interruptor retirado y dibujado ampliado a su lado. Marcadores numerados identifican el valor en amperios que protege el conductor, el listado para ese tablero específico, y la marca del valor de interrupción. Un conductor de cobre 12 AWG sale del tablero protegido a 20 A bajo el límite de conductores pequeños.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Artículo 240 Anatomía de un interruptor</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un interruptor, sacado: lo que prometen sus marcas.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículo 240; 240.4(D), 240.24</text><rect x="120" y="230" width="330" height="720" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="285" y="200" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">CENTRO DE CARGA</text><rect x="150" y="270" width="270" height="56" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="285" y="308" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">— —</text><rect x="150" y="350" width="270" height="56" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 8"/><text x="285" y="388" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">interruptor fuera</text><rect x="150" y="430" width="270" height="56" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="285" y="468" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">— —</text><rect x="150" y="510" width="270" height="56" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="285" y="548" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">— —</text><rect x="150" y="590" width="270" height="56" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="285" y="628" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">— —</text><rect x="150" y="670" width="270" height="56" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="285" y="708" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">— —</text><rect x="150" y="750" width="270" height="56" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="285" y="788" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">— —</text><line x1="285" y1="950" x2="285" y2="1060" stroke="#1f2937" stroke-width="6"/><rect x="165" y="1060" width="240" height="84" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="285" y="1114" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">A LA CARGA</text><text x="450" y="1200" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">12 AWG Cu en un interruptor de 20 A</text><text x="450" y="1242" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">el límite de 240.4(D) — no el valor de tabla de 25 A</text><rect x="560" y="270" width="280" height="330" rx="16" fill="#ffffff" stroke="#1a2f61" stroke-width="6"/><rect x="640" y="330" width="120" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="700" y="408" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">20 A</text><text x="700" y="530" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">palanca</text><text x="700" y="300" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><circle cx="560" cy="330" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="560" y="341" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="700" cy="600" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="700" y="611" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="840" cy="460" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="840" y="471" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><line x1="585" y1="330" x2="636" y2="360" stroke="#1a2f61" stroke-width="3"/><line x1="700" y1="575" x2="700" y2="600" stroke="#1a2f61" stroke-width="3"/><line x1="815" y1="460" x2="700" y2="470" stroke="#1a2f61" stroke-width="3"/><text x="90" y="1330" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">1  Valor en amperios — dimensionado al conductor</text><text x="90" y="1374" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">2  Listado para tablero — la marca no basta (S-03)</text><text x="90" y="1418" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">3  Valor de interrupción — marcado en el equipo</text></svg>