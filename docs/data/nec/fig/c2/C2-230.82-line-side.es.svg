<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">230.82 Lado de línea: lista cerrada</title><desc id="d">Diagrama unifilar de una acometida: compañía, base del medidor, una zona dorada del lado de línea con un SPD Tipo 1, una derivación de gestión de carga y una derivación FV del lado de suministro, luego la desconexión de acometida y el tablero del lado de carga. Un circuito ramal derivado antes del principal está tachado en rojo, y la lista completa de 230.82 se imprime abajo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">230.82 Lado de línea: lista cerrada</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Solo la lista de 230.82 aterriza antes del principal.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 230.82 · SPD 230.67 · Art. 705 Parte VII</text><circle cx="300" cy="220" r="28" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="300" cy="282" r="28" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="345" y="262" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">compañía eléctrica</text><line x1="300" y1="310" x2="300" y2="345" stroke="#1f2937" stroke-width="5"/><rect x="215" y="345" width="170" height="100" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="300" cy="395" r="30" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="300" y="407" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">M</text><text x="400" y="407" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">base del medidor</text><line x1="300" y1="445" x2="300" y2="470" stroke="#1f2937" stroke-width="5"/><rect x="175" y="470" width="250" height="290" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="300" y="514" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">LADO DE LÍNEA</text><line x1="300" y1="470" x2="300" y2="540" stroke="#1f2937" stroke-width="5"/><rect x="215" y="540" width="170" height="52" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="300" y="575" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">SPD Tipo 1</text><line x1="300" y1="592" x2="300" y2="618" stroke="#1f2937" stroke-width="5"/><rect x="190" y="618" width="220" height="52" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="300" y="653" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">derivación de gestión de carga</text><line x1="300" y1="670" x2="300" y2="696" stroke="#1f2937" stroke-width="5"/><rect x="195" y="696" width="210" height="52" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="300" y="731" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">derivación de suministro FV</text><line x1="300" y1="748" x2="300" y2="760" stroke="#1f2937" stroke-width="5"/><line x1="300" y1="605" x2="550" y2="605" stroke="#c0392b" stroke-width="4"/><rect x="550" y="562" width="320" height="86" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><line x1="550" y1="562" x2="870" y2="648" stroke="#c0392b" stroke-width="5"/><line x1="550" y1="648" x2="870" y2="562" stroke="#c0392b" stroke-width="5"/><text x="710" y="616" font-size="30" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">deriv. ramal</text><text x="710" y="616" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">deriv. ramal</text><text x="710" y="690" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">NO está en la lista</text><line x1="300" y1="760" x2="300" y2="795" stroke="#1f2937" stroke-width="5"/><circle cx="300" cy="795" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="300" cy="851" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="300" y1="851" x2="326" y2="803" stroke="#1a2f61" stroke-width="5"/><text x="385" y="820" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">ACOMETIDA</text><text x="385" y="862" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">DESCONEXIÓN</text><line x1="300" y1="851" x2="300" y2="890" stroke="#1f2937" stroke-width="5"/><rect x="210" y="890" width="180" height="105" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="300" y="955" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="405" y="950" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">lado de carga</text><text x="40" y="1075" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">EN LA LISTA — 230.82</text><circle cx="57" cy="1120" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="57" y="1131" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><text x="90" y="1130" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Limitadores de cable, limitadores de corriente</text><circle cx="57" cy="1166" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="57" y="1177" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><text x="90" y="1176" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Gabinetes de medidor, desconexiones de medidor</text><circle cx="57" cy="1212" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="57" y="1223" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><text x="90" y="1222" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Gabinetes de transformadores de corriente</text><circle cx="57" cy="1258" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="57" y="1269" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">4</text><text x="90" y="1268" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">SPD Tipo 1 y supresores de sobretensión</text><circle cx="57" cy="1304" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="57" y="1315" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">5</text><text x="90" y="1314" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Derivaciones para gestión de carga</text><circle cx="57" cy="1350" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="57" y="1361" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">6</text><text x="90" y="1360" font-size="32" font-weight="700" fill="#