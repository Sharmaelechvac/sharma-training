<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">One building, one supply</title><desc id="d">Decision chart for 225.30: a building gets one feeder or branch circuit. A second supply is allowed only under an exception in 225.30(A) through (E); otherwise run one larger feeder and a subpanel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">One building, one supply</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A second supply needs a named exception</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 225.30, 225.30(A)–(E)</text><rect x="170" y="205" width="560" height="100" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="268" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Building already has one supply</text><line x1="450" y1="305" x2="450" y2="375" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><path d="M450,375 L690,480 L450,585 L210,480 Z" stroke="#1a2f61" stroke-width="4" fill="#fdf3e0"/><text x="450" y="468" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Can you name the</text><text x="450" y="512" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">exception?</text><line x1="300" y1="530" x2="230" y2="640" stroke="#c0392b" stroke-width="4" marker-end="url(#ah)"/><text x="215" y="610" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">NO</text><line x1="600" y1="530" x2="670" y2="640" stroke="#2e7d32" stroke-width="4" marker-end="url(#ah)"/><text x="690" y="610" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">YES</text><rect x="40" y="645" width="390" height="170" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="65" y="705" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">✗ No exception named:</text><text x="65" y="744" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">run ONE larger feeder</text><text x="65" y="783" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">and a subpanel instead.</text><rect x="470" y="645" width="390" height="170" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="495" y="705" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">✓ Exception (A)–(E):</text><text x="495" y="744" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">group the disconnects,</text><text x="495" y="783" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">fit the plaque/directory.</text><text x="40" y="905" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">The five doors — 225.30(A) to (E):</text><text x="40" y="975" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">A  Fire pumps, emergency, standby, parallel</text><text x="40" y="1031" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">B  Special occupancies (special permission)</text><text x="40" y="1087" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">C  Capacity over 2000 A at 600 V or less</text><text x="40" y="1143" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">D  Different voltage, frequency or use</text><text x="40" y="1199" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">E  Documented switching, one management</text><text x="450" y="1330" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">A multiwire circuit counts as one supply.</text></svg>