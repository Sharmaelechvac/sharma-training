<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" width="900" height="1150" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">220.55 Placa vs. demanda</title><desc id="d">Gráfico de barras dibujado a escala: una estufa de 12 kW a su placa de 12,000 VA contra la demanda de 8,000 VA de la Columna C de la Tabla 220.55, y una estufa de 16 kW a su placa de 16,000 VA contra 9,600 VA de demanda tras el aumento de la Nota 1 del 5 por ciento por kW sobre 12.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1150" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">220.55 Placa vs. demanda</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Método estándar. Barras dibujadas a escala.</text><line x1="30" y1="1092" x2="870" y2="1092" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1130" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Tabla 220.55 · Notas 1, 3, 4</text><text x="40" y="215" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">UNA ESTUFA DE 12 kW</text><rect x="40" y="240" width="600" height="56" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="56" y="277" font-size="32" font-weight="800" fill="#ffffff" text-anchor="start">placa 12,000 VA</text><rect x="40" y="312" width="400" height="56" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="56" y="349" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">Demanda Tabla 220.55</text><text x="456" y="349" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">8,000 VA</text><text x="40" y="425" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">UNA ESTUFA DE 16 kW (NOTA 1)</text><rect x="40" y="450" width="800" height="56" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="56" y="487" font-size="32" font-weight="800" fill="#ffffff" text-anchor="start">placa 16,000 VA</text><rect x="40" y="522" width="480" height="56" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="56" y="559" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">8,000 + 4 × 400 VA</text><text x="536" y="559" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">= 9,600 VA</text><rect x="40" y="640" width="820" height="150" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="64" y="690" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Columna C — estufas de no más de 12 kW:</text><text x="64" y="734" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1 estufa 8 kW · 2 estufas 11 kW</text><text x="64" y="778" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">3 estufas 14 kW · 4 estufas 17 kW</text><text x="40" y="862" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">Método opcional (220.82(B)): la estufa entra</text><text x="40" y="902" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">a placa — nunca mezcle los dos métodos.</text></svg>