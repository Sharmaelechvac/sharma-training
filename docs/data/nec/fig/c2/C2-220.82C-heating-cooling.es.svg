<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">220.82(C): sume solo el mayor</title><desc id="d">Las seis selecciones de calefacción y refrigeración de 220.82(C) con sus factores de demanda, más un ejemplo resuelto de bomba de calor de Florida donde la selección (3) vence a la selección (1).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">220.82(C): sume solo el mayor</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Seis selecciones en kVA — solo una va al total.</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 220.82(C)(1)–(6)</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="30" y="196" width="840" height="104" rx="10" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><circle cx="80" cy="248" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="80" y="261" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="135" y="241" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Aire acondicionado y refrigeración</text><text x="135" y="284" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">100% de la placa</text><rect x="30" y="312" width="840" height="104" rx="10" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><circle cx="80" cy="364" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="80" y="377" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="135" y="357" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Bomba de calor, sin calor suplementario</text><text x="135" y="400" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">100% de la placa</text><rect x="30" y="428" width="840" height="104" rx="10" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><circle cx="80" cy="480" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="80" y="493" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="135" y="473" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Bomba de calor + calor suplementario</text><text x="135" y="516" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">Compresor 100% + tiras 65%</text><rect x="30" y="544" width="840" height="104" rx="10" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><circle cx="80" cy="596" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="80" y="609" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="135" y="589" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Calefacción eléctrica, &lt; 4 unidades</text><text x="135" y="632" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">65% de la placa</text><rect x="30" y="660" width="840" height="104" rx="10" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><circle cx="80" cy="712" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="80" y="725" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">5</text><text x="135" y="705" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Calefacción eléctrica, 4 unidades o más</text><text x="135" y="748" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">40% de la placa</text><rect x="30" y="776" width="840" height="104" rx="10" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><circle cx="80" cy="828" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="80" y="841" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">6</text><text x="135" y="821" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Almacenamiento térmico, calor continuo</text><text x="135" y="864" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">100% de la placa</text><text x="30" y="940" font-size="38" font-weight="800" fill="#264387" text-anchor="start">Ejemplo resuelto — casa con bomba de calor</text><text x="30" y="992" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">(1) Refrigeración</text><rect x="330" y="958" width="292" height="40" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="638" y="992" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">12.0 kVA</text><text x="10" y="1062" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">(3) Bomba de calor</text><rect x="330" y="1028" width="450" height="40" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="796" y="1062" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">19.75</text><rect x="30" y="1100" width="840" height="108" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="55" y="1148" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Lleve 19.75 kVA al total — el mayor.</text><text x="55" y="1192" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Nunca sume (1) y (3) juntos.</text></svg>