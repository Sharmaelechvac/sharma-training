<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1900" width="900" height="1900" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">230.85 Desconexión de emergencia</title><desc id="d">Dos diagramas unifilares. Opción 1: el medidor-principal exterior es a la vez desconexión de acometida y desconexión de emergencia, alimentando un tablero interior con neutro y tierra separados. Opción 3: medidor, desconexión de emergencia exterior marcada como no equipo de acometida, luego el tablero de acometida interior más cercano al punto de entrada.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1900" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">230.85 Desconexión de emergencia</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Una y dos familias. Dos disposiciones comunes.</text><line x1="30" y1="1842" x2="870" y2="1842" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1880" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 230.70, 230.85; NEC 2023 230.85</text><rect x="25" y="180" width="400" height="110" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="225" y="226" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">OPCIÓN 1</text><text x="225" y="270" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">Medidor-principal exterior</text><rect x="475" y="180" width="400" height="110" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="675" y="226" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">OPCIÓN 3</text><text x="675" y="270" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">Interruptor exterior + tablero</text><rect x="0" y="1114" width="900" height="12" rx="0" fill="url(#hatch)" stroke="#1f2937" stroke-width="2"/><text x="20" y="1100" font-size="30" font-weight="900" fill="#5b6478" text-anchor="start">AFUERA ▲</text><text x="20" y="1164" font-size="30" font-weight="900" fill="#5b6478" text-anchor="start">ADENTRO ▼</text><circle cx="225" cy="350" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="225" cy="390" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="281" y="384" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">compañía eléctrica</text><line x1="225" y1="424" x2="225" y2="500" stroke="#1f2937" stroke-width="5"/><rect x="135" y="500" width="180" height="330" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="225" y="488" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><circle cx="225" cy="570" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="225" y="582" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">M</text><line x1="225" y1="604" x2="225" y2="672" stroke="#1f2937" stroke-width="5"/><circle cx="225" cy="672" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="225" cy="728" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><path d="M225,672 A30,30 0 0 1 225,728" stroke="#1a2f61" stroke-width="5" fill="none"/><line x1="225" y1="728" x2="225" y2="756" stroke="#1f2937" stroke-width="5"/><text x="225" y="790" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">MBJ + GEC</text><rect x="0" y="850" width="450" height="112" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="225" y="876" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">DESCONEXIÓN DE</text><text x="225" y="910" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">EMERGENCIA,</text><text x="225" y="944" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">DESCONEXIÓN ACOMETIDA</text><line x1="225" y1="962" x2="225" y2="1300" stroke="#1f2937" stroke-width="5"/><text x="241" y="1060" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">alimentador 4 conductores</text><text x="241" y="1100" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">(N y EGC separados)</text><rect x="135" y="1300" width="180" height="190" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="225" y="1350" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">tablero</text><text x="225" y="1394" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">N ≠ G</text><text x="225" y="1438" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">sin MBJ</text><circle cx="675" cy="350" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="675" cy="390" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="731" y="384" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">compañía</text><text x="731" y="424" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">eléctrica</text><line x1="675" y1="424" x2="675" y2="500" stroke="#1f2937" stroke-width="5"/><circle cx="675" cy="540" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="675" y="552" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">M</text><line x1="675" y1="574" x2="675" y2="640" stroke="#1f2937" stroke-width="5"/><rect x="585" y="640" width="180" height="160" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="675" cy="692" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="675" cy="748" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="675" y1="748" x2="701" y2="696" stroke="#1a2f61" stroke-width="5"/><line x1="675" y1="692" x2="675" y2="670" stroke="#1f2937" stroke-width="5"/><line x1="675" y1="748" x2="675" y2="800" stroke="#1f2937" stroke-width="5"/><rect x="450" y="840" width="450" height="148" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="675" y="868" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">DESCONEXIÓN DE</text><text x="675" y="900" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">EMERGENCIA,</text><text x="675" y="932" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">NO ES ACOMETIDA</text><text x="675" y="964" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">EQUIPO</text><line x1="675" y1="988" x2="675" y2="1300" stroke="#1f2937" stroke-width="5"/><text x="691" y="1060" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">acometida</text><text x="691" y="1100" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">conductores</text><rect x="555" y="1300" width="240" height="190" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="675" y="1350" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">tablero</text><text x="675" y="1394" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">MBJ aquí</text><text x="675" y="1438" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">cerca del punto de entrada</text><text x="40" y="1560" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Ambos: fácilmente accesibles, afuera, agrupados si</text><text x="40" y="1602" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">más de una (230.85). Opción 2 = desconexión</text><text x="40" y="1644" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">del medidor de la compañía, marcada DESCONEXIÓN.</text><text x="40" y="1702" font-size="33" font-weight="900" fill="#c0392b" text-anchor="start">NEC 2023: etiqueta roja, letras blancas de ½ in;</text><text x="40" y="1744" font-size="33" font-weight="900" fill="#c0392b" text-anchor="start">el reemplazo de la acometida lo activa (230.85(C)).</text></svg>