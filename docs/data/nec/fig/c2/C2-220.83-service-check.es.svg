<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1290" width="900" height="1290" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">220.83 ¿Aguanta la acometida vieja?</title><desc id="d">Una barra de hoja de cálculo: 26 kVA existentes más una adición de 6 kVA hacen 32 kVA; los primeros 8 kVA cuentan al 100 por ciento y los 24 kVA restantes al 40 por ciento, dando 17.6 kVA, unos 73 A, contra una acometida de 200 A.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1290" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">220.83 ¿Aguanta la acometida vieja?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">220.83(A) — adición distinta de AC o calefacción</text><line x1="30" y1="1232" x2="870" y2="1232" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1270" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 220.83(A)</text><text x="870" y="1270" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><text x="60" y="250" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EXISTENTE 26 kVA + AÑADIDO 6 kVA = 32 kVA</text><rect x="60" y="290" width="195" height="110" rx="0" fill="#F0A846" stroke="#264387" stroke-width="3"/><rect x="255" y="290" width="585" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="74" y="360" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">8 kVA</text><text x="279" y="360" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">24 kVA</text><text x="74" y="452" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">al 100%</text><text x="279" y="452" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">a 40%  →  9.6 kVA</text><text x="450" y="580" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">= 8 + 9.6 = 17.6 kVA de demanda</text><text x="60" y="690" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">DEMANDA ≈ 73 A vs ACOMETIDA 200 A</text><rect x="60" y="730" width="284" height="110" rx="0" fill="#2e7d32" stroke="#264387" stroke-width="3"/><rect x="344" y="730" width="496" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="74" y="800" font-size="38" font-weight="800" fill="#ffffff" text-anchor="start">73 A</text><text x="826" y="800" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="end">200 A</text><text x="60" y="920" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="start">✓ CABE — no hay que aumentar la acometida</text><text x="60" y="985" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Si el resultado supera 200 A, la acometida sube</text><text x="60" y="1031" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">y se dimensiona por los métodos regulares.</text></svg>