<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">230.54 Weatherhead and drip loop</title><desc id="d">Elevation detail of the top of an overhead service: utility drop to the point of attachment, weatherhead above it, drip loops below the head, raindrop falling from a loop.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">230.54 Weatherhead and drip loop</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Head above the attachment, loop below it.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 230.54(C), (E), (F); splices 230.46</text><rect x="30" y="280" width="120" height="640" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><text x="90" y="332" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">wall</text><rect x="226" y="254" width="8" height="626" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><rect x="194" y="196" width="72" height="60" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><rect x="852" y="210" width="26" height="560" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="4"/><line x1="806" y1="246" x2="894" y2="246" stroke="#1f2937" stroke-width="5"/><path d="M852,262 Q560,430 248,490" stroke="#1f2937" stroke-width="4" fill="none"/><circle cx="230" cy="500" r="15" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><path d="M208,256 C150,440 156,676 206,692 C256,676 244,566 233,515" stroke="#1f2937" stroke-width="4" fill="none"/><path d="M252,256 C310,440 304,676 254,692 C204,676 216,566 229,515" stroke="#1f2937" stroke-width="4" fill="none"/><path d="M230,748 C244,774 248,788 230,800 C212,788 216,774 230,748 Z" stroke="#264387" stroke-width="3" fill="#264387"/><circle cx="316" cy="500" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="316" y="512" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="316" cy="226" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="316" y="238" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="316" cy="690" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="316" y="702" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="56" cy="938" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="56" y="950" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="104" y="950" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Attachment point — located so the</text><text x="104" y="992" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">230.24 / 230.9 clearances can be met</text><circle cx="56" cy="1048" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="56" y="1060" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="104" y="1060" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Service head at or above the</text><text x="104" y="1102" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">point of attachment</text><circle cx="56" cy="1158" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="56" y="1170" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="104" y="1170" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Drip loop below the head — rain</text><text x="104" y="1212" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">drips off the bottom of the loop</text><rect x="40" y="1258" width="820" height="132" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1312" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">EXCEPTION: head below the attachment only</text><text x="450" y="1356" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">where impracticable — within 24 in. max</text></svg>