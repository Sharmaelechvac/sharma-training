<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.52(C) Island count by area</title><desc id="d">Plan view of a 10 ft by 3 ft kitchen island, 30 sq ft, divided into the first 9 sq ft block, an 18 sq ft block and a 3 sq ft block, one receptacle per block.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.52(C) Island count by area</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Island 10 ft × 3 ft = 30 sq ft — drawn to scale</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.52(C)</text><text x="870" y="1160" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="70" y1="268" x2="286" y2="268" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="178.0" y="256" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">3 ft</text><text x="178.0" y="256" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3 ft</text><line x1="286" y1="268" x2="718" y2="268" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="502.0" y="256" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft</text><text x="502.0" y="256" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft</text><line x1="718" y1="268" x2="790" y2="268" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="754.0" y="256" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">1 ft</text><text x="754.0" y="256" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1 ft</text><rect x="70" y="330" width="720" height="216" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="5"/><line x1="286" y1="330" x2="286" y2="546" stroke="#264387" stroke-width="3" stroke-dasharray="10 7"/><line x1="718" y1="330" x2="718" y2="546" stroke="#264387" stroke-width="3" stroke-dasharray="10 7"/><circle cx="178" cy="420" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="178" y="433" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="178" y="512" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">9 sq ft</text><circle cx="502" cy="420" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="502" y="433" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="502" y="512" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">18 sq ft</text><circle cx="754" cy="420" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="754" y="433" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="754" y="590" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">3 sq ft</text><text x="450" y="385" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><line x1="70" y1="610" x2="790" y2="610" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="430.0" y="650" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft</text><text x="430.0" y="650" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">10 ft</text><text x="450" y="730" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">One receptacle per block → 3 total</text><rect x="40" y="790" width="820" height="120" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="845" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">2023 ONLY: island receptacles not required</text><text x="450" y="892" font-size="32" font-weight="600" fill="#c0392b" text-anchor="middle">if fitted, above or in the counter — see box</text><text x="450" y="990" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">Peninsula: one within 2 ft of the outer end</text><text x="450" y="1045" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">measured from the connecting wall (C)(2)</text></svg>