<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.52(C) Encimeras: la regla de 24 in</title><desc id="d">Plano de encimera de cocina que muestra receptáculos a no más de 48 pulgadas entre sí y dentro de 24 pulgadas de cada extremo de la encimera, una pieza de encimera de 12 pulgadas, una península y una isla con el conteo de 2020 y la regla opcional de 2023.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.52(C) Encimeras: la regla de 24 in</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta; cada tramo se revisa solo</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.52(C) + nota 2023</text><text x="30" y="214" font-size="34" font-weight="900" fill="#264387" text-anchor="start">MOSTRADORES DE PARED</text><rect x="60" y="330" width="320" height="80" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="480.0" y="330" width="120.0" height="80" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="700" y="330" width="50.0" height="80" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="380" y="330" width="100.0" height="80" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><rect x="388.0" y="338" width="84.0" height="60.0" rx="8" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="430.0" y="450" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">fregadero</text><rect x="600.0" y="330" width="100.0" height="80" rx="0" fill="#5b6478" stroke="#1f2937" stroke-width="2"/><text x="650.0" y="382" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">estufa</text><circle cx="140" cy="328" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="133" y1="322" x2="133" y2="334" stroke="#1a2f61" stroke-width="3"/><line x1="147" y1="322" x2="147" y2="334" stroke="#1a2f61" stroke-width="3"/><circle cx="300" cy="328" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="293" y1="322" x2="293" y2="334" stroke="#1a2f61" stroke-width="3"/><line x1="307" y1="322" x2="307" y2="334" stroke="#1a2f61" stroke-width="3"/><circle cx="540" cy="328" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="533" y1="322" x2="533" y2="334" stroke="#1a2f61" stroke-width="3"/><line x1="547" y1="322" x2="547" y2="334" stroke="#1a2f61" stroke-width="3"/><circle cx="724.0" cy="328" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="717.0" y1="322" x2="717.0" y2="334" stroke="#1a2f61" stroke-width="3"/><line x1="731.0" y1="322" x2="731.0" y2="334" stroke="#1a2f61" stroke-width="3"/><line x1="60" y1="310" x2="60" y2="286" stroke="#1a2f61" stroke-width="2"/><line x1="140" y1="310" x2="140" y2="286" stroke="#1a2f61" stroke-width="2"/><line x1="60" y1="274" x2="140" y2="274" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="100.0" y="262" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">24 in</text><text x="100.0" y="262" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">24 in</text><line x1="140" y1="310" x2="140" y2="286" stroke="#1a2f61" stroke-width="2"/><line x1="300" y1="310" x2="300" y2="286" stroke="#1a2f61" stroke-width="2"/><line x1="140" y1="274" x2="300" y2="274" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="220.0" y="262" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">48 in</text><text x="220.0" y="262" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">48 in</text><line x1="300" y1="310" x2="300" y2="286" stroke="#1a2f61" stroke-width="2"/><line x1="380" y1="310" x2="380" y2="286" stroke="#1a2f61" stroke-width="2"/><line x1="300" y1="274" x2="380" y2="274" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="340.0" y="262" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">24 in</text><text x="340.0" y="262" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">24 in</text><text x="724.0" y="450" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">15 in</text><text x="540" y="450" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3 ft</text><text x="40" y="500" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Cada punto de la línea de pared dentro de 24 in</text><text x="40" y="542" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">de un receptáculo → 48 in máx. entre sí,</text><text x="40" y="584" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">24 in máx. desde cada extremo.</text><text x="40" y="650" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="start">Estufa, cocina, fregadero o refrigerador dividen el</text><text x="40" y="692" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="start">encimera: cada pieza es su propio tramo.</text><text x="40" y="734" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="start">Una pieza de 12 in o más ancha necesita uno; una</text><text x="40" y="776" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="start">pieza bajo 12 in no necesita ninguna.</text><text x="30" y="860" font-size="34" font-weight="900" fill="#264387" text-anchor="start">PENÍNSULA E ISLA (2020)</text><rect x="60" y="890" width="30" height="300" rx="0" fill="url(#hatch)" stroke="#1f2937" stroke-width="3"/><rect x="90" y="980" width="240" height="80" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="300" cy="1020" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="293" y1="1014" x2="293" y2="1026" stroke="#1a2f61" stroke-width="3"/><line x1="307" y1="1014" x2="307" y2="1026" stroke="#1a2f61" stroke-width="3"/><line x1="250" y1="960" x2="330" y2="960" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="290.0" y="948" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 2 ft</text><text x="290.0" y="948" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 2 ft</text><text x="210" y="1104" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">península</text><text x="210" y="1144" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">desde el extremo exterior</text><rect x="470" y="920" width="300.0" height="160" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><line x1="560.0" y1="920" x2="560.0" y2="1080" stroke="#1a2f61" stroke-width="3" stroke-dasharray="8 6"/><line x1="740.0" y1="920" x2="740.0" y2="1080" stroke="#1a2f61" stroke-width="3" stroke-dasharray="8 6"/><text x="514.8" y="1012.0" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">9</text><text x="650.0" y="1012.0" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">18</text><text x="754.8" y="1012.0" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="514.8" cy="1056" r="15" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="507.79999999999995" y1="1050" x2="507.79999999999995" y2="1062" stroke="#1a2f61" stroke-width="3"/><line x1="521.8" y1="1050" x2="521.8" y2="1062" stroke="#1a2f61" stroke-width="3"/><circle cx="650.0" cy="1056" r="15" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="643.0" y1="1050" x2="643.0" y2="1062" stroke="#1a2f61" stroke-width="3"/><line x1="657.0" y1="1050" x2="657.0" y2="1062" stroke="#1a2f61" stroke-width="3"/><circle cx="754.8" cy="1056" r="15" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="747.8" y1="1050" x2="747.8" y2="1062" stroke="#1a2f61" stroke-width="3"/><line x1="761.8" y1="1050" x2="761.8" y2="1062" stroke="#1a2f61" stroke-width="3"/><text x="620.0" y="1124" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">isla 7½ × 4 ft = 30 sq ft</text><text x="620.0" y="1164" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">= 3 receptáculos (9 + 18 + 3)</text><rect x="40" y="1300" width="820" height="300" rx="14" fill="#ffffff" stroke="#F0A846" stroke-width="4"/><text x="64" y="1350" font-size="33" font-weight="800" fill="#1f2937" text-anchor="start">Altura: no más de 20 in sobre la encimera.</text><text x="64" y="1400" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">2020: el de isla/península también puede</text><text x="64" y="1442" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">suba hasta 12 in bajo el tope (aplican límites).</text><text x="64" y="1500" font-size="33" font-weight="900" fill="#c0392b" text-anchor="start">CAMBIO NEC 2023: receptáculo de isla/península</text><text x="64" y="1542" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">opcional; si se instala, sobre o encima del tope,</text><text x="64" y="1584" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">nunca debajo. ¿Ninguno? Deje provisión futura.</text></svg>