<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.8(D) The appliance test</title><desc id="d">Decision flow: is the appliance on the 422.5(A) list, and is it rated 150 volts or less to ground and 60 amps or less? Yes to both means GFCI protection in any occupancy.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.8(D) The appliance test</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The room does not decide. The appliance does.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.8(D), 422.5(A)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="196" width="780" height="84" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="252" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">STEP 1 — On the 422.5(A) list?</text><rect x="60" y="306" width="780" height="352" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="92" y="332" width="16" height="16" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="126" y="356" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Dishwashers</text><rect x="92" y="376" width="16" height="16" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="126" y="400" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Sump pumps</text><rect x="92" y="420" width="16" height="16" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="126" y="444" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Vending machines</text><rect x="92" y="464" width="16" height="16" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="126" y="488" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Drinking water coolers + bottle fillers</text><rect x="92" y="508" width="16" height="16" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="126" y="532" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Tire inflation machines</text><rect x="92" y="552" width="16" height="16" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="126" y="576" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Automotive vacuum machines</text><rect x="92" y="596" width="16" height="16" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="126" y="620" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Spray washers (cord-and-plug)</text><line x1="450" y1="658" x2="450" y2="706" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="712" width="780" height="128" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="766" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">STEP 2 — Rated 150 V or less to ground,</text><text x="450" y="812" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">and 60 A or less?</text><line x1="450" y1="840" x2="450" y2="888" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="894" width="780" height="158" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="950" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="middle">YES to both:</text><text x="450" y="998" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">GFCI protection required —</text><text x="450" y="1042" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">any occupancy, any room</text><rect x="60" y="1086" width="780" height="118" rx="12" fill="#ffffff" stroke="#5b6478" stroke-width="3"/><text x="450" y="1140" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">NO to either → not under (D):</text><text x="450" y="1186" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">check the 210.8(A) location list</text><rect x="60" y="1240" width="780" height="150" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1296" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">2023 ONLY — the list grows:</text><text x="450" y="1342" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">ranges, wall ovens, counter cooktops,</text><text x="450" y="1384" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">clothes dryers, microwave ovens</text></svg>