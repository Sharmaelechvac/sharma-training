<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">250.66 Tamaño del GEC en 3 pasos</title><desc id="d">Diagrama de flujo: encuentre el conductor de entrada de acometida mayor, lea la Tabla 250.66, luego aplique el límite de 6 AWG para varillas y el límite de 4 AWG para un electrodo embebido en concreto.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">250.66 Tamaño del GEC en 3 pasos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dimensione por los conductores de acometida</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.66, Tabla 250.66</text><rect x="40" y="190" width="820" height="190" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="64" y="240" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">1  Conductor de acometida mayor</text><text x="64" y="288" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Casa de 200 A: 2/0 Cu (o 4/0 Al)</text><text x="64" y="330" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Juegos en paralelo: sume las áreas</text><line x1="450" y1="380" x2="450" y2="432" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="40" y="440" width="820" height="190" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="64" y="490" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">2  Lea la Tabla 250.66</text><text x="64" y="538" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">2/0 o 3/0 Cu  →  GEC 4 AWG Cu</text><text x="64" y="580" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">100 A con 4 AWG Cu  →  GEC 8 AWG Cu</text><line x1="450" y1="630" x2="450" y2="682" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><text x="40" y="730" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">3  Aplique el límite según dónde aterrice</text><rect x="40" y="760" width="260" height="230" rx="16" fill="#ffffff" stroke="#F0A846" stroke-width="5"/><text x="170" y="806" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">Varilla, tubo,</text><text x="170" y="844" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">o placa</text><text x="170" y="906" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">6 AWG Cu</text><text x="170" y="950" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">máx. necesario</text><rect x="320" y="760" width="260" height="230" rx="16" fill="#ffffff" stroke="#F0A846" stroke-width="5"/><text x="450" y="806" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">Concreto-</text><text x="450" y="844" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">embebido</text><text x="450" y="906" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">4 AWG Cu</text><text x="450" y="950" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">máx. necesario</text><rect x="600" y="760" width="260" height="230" rx="16" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="730" y="806" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">Tubería de agua,</text><text x="730" y="844" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">acero del edificio</text><text x="730" y="906" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">Tamaño tabla</text><text x="730" y="950" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">sin límite</text><rect x="40" y="1030" width="820" height="230" rx="16" fill="#264387" stroke="#264387" stroke-width="0"/><text x="64" y="1084" font-size="36" font-weight="900" fill="#F0A846" text-anchor="start">Respuesta 200 A (acometida 2/0 Cu):</text><text x="64" y="1136" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">Ufer 4 AWG Cu · varillas 6 AWG Cu</text><text x="64" y="1186" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">electrodo de tubería de agua 4 AWG Cu</text><text x="64" y="1236" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">Anillo: no mayor que su conductor</text><text x="40" y="1320" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">GEC expuesto: 6 AWG puede ir sobre la superficie</text><text x="40" y="1362" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">si no está sujeto a daño; 8 AWG necesita RMC,</text><text x="40" y="1404" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">IMC, PVC Sch 80, EMT o armadura (250.64(B)).</text><text x="40" y="1460" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">Puente principal de unión: Tabla 250.102(C)(1).</text></svg>