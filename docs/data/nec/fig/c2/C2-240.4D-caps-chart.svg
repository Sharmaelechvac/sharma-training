<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">240.4(D) The caps decide the breaker</title><desc id="d">Chart of the 240.4(D) small-conductor overcurrent caps: 14 AWG copper 15 A with no 2020 aluminum or CCA entry, 12 AWG copper 20 A and aluminum/CCA 15 A, 10 AWG copper 30 A and aluminum/CCA 25 A, plus a red 2023-only row: 14 AWG CCA at 10 A maximum, 8 A continuous, with an overcurrent device listed and marked for it.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">240.4(D) The caps decide the breaker</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Small conductors, NEC 2020 caps.</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 240.4(D); NEC 2023 240.4(D)(3)</text><rect x="50" y="210" width="800" height="92" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="150.0" y="268" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">SIZE</text><line x1="250" y1="210" x2="250" y2="302" stroke="#1a2f61" stroke-width="3"/><text x="360.0" y="268" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">COPPER</text><line x1="470" y1="210" x2="470" y2="302" stroke="#1a2f61" stroke-width="3"/><text x="660.0" y="268" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">AL / CCA</text><rect x="50" y="302" width="800" height="92" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="150.0" y="360" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">14 AWG</text><line x1="250" y1="302" x2="250" y2="394" stroke="#1a2f61" stroke-width="3"/><text x="360.0" y="360" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">15 A</text><line x1="470" y1="302" x2="470" y2="394" stroke="#1a2f61" stroke-width="3"/><text x="660.0" y="360" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">— not listed (2020)</text><rect x="50" y="394" width="800" height="92" rx="0" fill="#fdf3e0" stroke="#1a2f61" stroke-width="3"/><text x="150.0" y="452" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">12 AWG</text><line x1="250" y1="394" x2="250" y2="486" stroke="#1a2f61" stroke-width="3"/><text x="360.0" y="452" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">20 A</text><line x1="470" y1="394" x2="470" y2="486" stroke="#1a2f61" stroke-width="3"/><text x="660.0" y="452" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">15 A</text><rect x="50" y="486" width="800" height="92" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="150.0" y="544" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">10 AWG</text><line x1="250" y1="486" x2="250" y2="578" stroke="#1a2f61" stroke-width="3"/><text x="360.0" y="544" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">30 A</text><line x1="470" y1="486" x2="470" y2="578" stroke="#1a2f61" stroke-width="3"/><text x="660.0" y="544" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">25 A</text><rect x="50" y="614" width="800" height="150" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450.0" y="666" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">2023 ONLY — 14 AWG CCA</text><text x="450.0" y="714" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">10 A max · 8 A continuous · OCPD listed + marked</text><text x="450.0" y="752" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">240.4(D)(3) — not a 2020 permit rule</text><text x="50" y="854" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">On a CCA job the breaker decides the roll:</text><text x="50" y="900" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">15 A circuit = 12 AWG CCA.</text><text x="50" y="946" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">20 A circuit = 10 AWG CCA.</text><text x="50" y="992" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Check the roll before it is pulled.</text><text x="50" y="1074" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">12 AWG copper on a 25 A breaker fails, even</text><text x="50" y="1120" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">when a table column seems to allow it.</text></svg>