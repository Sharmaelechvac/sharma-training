<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">200.4 Un circuito, un neutro</title><desc id="d">El circuito A va con su propio neutro. El circuito B toma prestado el neutro del circuito A, que queda con energía con la corriente de B cuando el interruptor A está apagado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">200.4 Un circuito, un neutro</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dos circuitos salen de un tablero</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 200.4; 210.4; 215.4</text><text x="50" y="215" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">CIRCUITO A — BIEN</text><text x="850" y="215" font-size="32" font-weight="800" fill="#c0392b" text-anchor="end">CIRCUITO B — PRESTADO</text><rect x="290" y="245" width="320" height="100" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="307" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">TABLERO</text><line x1="330" y1="345" x2="330" y2="640" stroke="#264387" stroke-width="4"/><line x1="390" y1="345" x2="390" y2="640" stroke="#F0A846" stroke-width="5"/><line x1="570" y1="345" x2="570" y2="640" stroke="#264387" stroke-width="4"/><path d="M660,640 L660,480 L398,480 L398,545" stroke="#c0392b" stroke-width="4" fill="none" stroke-dasharray="12 8" marker-end="url(#ah)"/><text x="529" y="462" font-size="54" font-weight="800" fill="#c0392b" text-anchor="middle">✕</text><text x="322" y="600" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="end">HOT</text><text x="398" y="600" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="start">NEUTRO</text><rect x="230" y="640" width="260" height="90" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="360" y="697" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">CARGA A</text><rect x="470" y="640" width="260" height="90" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="600" y="697" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">CARGA B</text><text x="170" y="700" font-size="48" font-weight="800" fill="#2e7d32" text-anchor="middle">✓</text><text x="772" y="700" font-size="48" font-weight="800" fill="#c0392b" text-anchor="middle">✕</text><rect x="50" y="790" width="800" height="160" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="80" y="842" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">Interruptor A apagado ≠ neutro seguro.</text><text x="80" y="886" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">El neutro prestado aún lleva</text><text x="80" y="926" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">La corriente de retorno del circuito B.</text><text x="50" y="1030" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Hechos para compartir, con todas sus reglas:</text><text x="50" y="1074" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Circuito ramal multiconductor (210.4)</text><text x="50" y="1116" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Neutro común del alimentador (215.4)</text></svg>