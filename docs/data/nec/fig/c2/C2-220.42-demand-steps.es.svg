<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Tabla 220.42 Pasos de demanda</title><desc id="d">Tres pasos de demanda de la Tabla 220.42 con el ejemplo resuelto de 18,000 VA: primeros 3,000 VA al 100 por ciento, los siguientes 15,000 VA al 35 por ciento, dando 8,250 VA demandados.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1080" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Tabla 220.42 Pasos de demanda</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo resuelto: carga general de 18,000 VA</text><line x1="30" y1="1022" x2="870" y2="1022" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1060" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Tabla 220.42</text><text x="870" y="1060" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="90" y="250" width="720" height="84" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="250" width="720" height="84" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="90" y="234" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Primeros 3,000 VA — al 100%</text><text x="810" y="306" font-size="36" font-weight="800" fill="#ffffff" text-anchor="end">3,000 VA</text><rect x="90" y="420" width="720" height="84" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="420" width="251" height="84" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="90" y="404" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Siguientes 15,000 VA — al 35%</text><text x="810" y="476" font-size="36" font-weight="800" fill="#1f2937" text-anchor="end">5,250 VA</text><rect x="90" y="590" width="720" height="84" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="590" width="180" height="84" rx="0" fill="#c9d2e3" stroke="#c9d2e3" stroke-width="0"/><text x="90" y="574" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Más de 120,000 VA — al 25%</text><text x="810" y="646" font-size="36" font-weight="800" fill="#1f2937" text-anchor="end">25%</text><rect x="90" y="740" width="720" height="100" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="802" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">Demandado = 3,000 + 5,250 = 8,250 VA</text><text x="90" y="910" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Las demandas de secadora, estufa y artefactos</text><text x="90" y="952" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">se calculan en sus secciones, sumadas tras esto.</text><text x="90" y="994" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Barras no a escala — lo que importa son los pasos.</text></svg>