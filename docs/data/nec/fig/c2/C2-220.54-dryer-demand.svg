<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">220.54 Dryer demand</title><desc id="d">Bar chart of Table 220.54 demand factors: 100 percent for one to four dryers, then 85, 75, 65, 60, 55, 50 and 47 percent for five through eleven dryers.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1250" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">220.54 Dryer demand</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The table starts to bite at the fifth dryer</text><line x1="30" y1="1192" x2="870" y2="1192" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1230" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 220.54, Table 220.54</text><rect x="60" y="180" width="810" height="88" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="465" y="216" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">Each dryer first: 5,000 VA or nameplate,</text><text x="465" y="258" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">whichever is LARGER</text><text x="230" y="372" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">1–4 dryers</text><rect x="250" y="330" width="470" height="52" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="250" y="330" width="470" height="52" rx="0" fill="#264387" stroke="none" stroke-width="0"/><text x="740" y="372" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">100%</text><text x="230" y="450" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">5 dryers</text><rect x="250" y="408" width="470" height="52" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="250" y="408" width="399" height="52" rx="0" fill="#F0A846" stroke="none" stroke-width="0"/><text x="740" y="450" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">85%</text><text x="230" y="528" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">6 dryers</text><rect x="250" y="486" width="470" height="52" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="250" y="486" width="352" height="52" rx="0" fill="#F0A846" stroke="none" stroke-width="0"/><text x="740" y="528" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">75%</text><text x="230" y="606" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">7 dryers</text><rect x="250" y="564" width="470" height="52" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="250" y="564" width="305" height="52" rx="0" fill="#F0A846" stroke="none" stroke-width="0"/><text x="740" y="606" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">65%</text><text x="230" y="684" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">8 dryers</text><rect x="250" y="642" width="470" height="52" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="250" y="642" width="282" height="52" rx="0" fill="#F0A846" stroke="none" stroke-width="0"/><text x="740" y="684" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">60%</text><text x="230" y="762" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">9 dryers</text><rect x="250" y="720" width="470" height="52" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="250" y="720" width="258" height="52" rx="0" fill="#F0A846" stroke="none" stroke-width="0"/><text x="740" y="762" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">55%</text><text x="230" y="840" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">10 dryers</text><rect x="250" y="798" width="470" height="52" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="250" y="798" width="235" height="52" rx="0" fill="#F0A846" stroke="none" stroke-width="0"/><text x="740" y="840" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">50%</text><text x="230" y="918" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">11 dryers</text><rect x="250" y="876" width="470" height="52" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="250" y="876" width="220" height="52" rx="0" fill="#F0A846" stroke="none" stroke-width="0"/><text x="740" y="918" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">47%</text><text x="60" y="984" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Table keeps falling past 11 dryers —</text><text x="60" y="1026" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">the multifamily and laundromat case.</text></svg>