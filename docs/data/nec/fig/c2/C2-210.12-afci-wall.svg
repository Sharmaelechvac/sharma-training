<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.12 Arc-fault protection</title><desc id="d">Cutaway wall with a nail through a cable and an arc at the damage point, a panel with an AFCI breaker, and the rooms on and off the 210.12(A) list.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.12 Arc-fault protection</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The arc a standard breaker cannot see</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.12(A)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="30" y="214" font-size="34" font-weight="900" fill="#264387" text-anchor="start">INSIDE THE WALL</text><rect x="110" y="250" width="26" height="300" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><rect x="440" y="250" width="26" height="300" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><rect x="770" y="250" width="26" height="300" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><line x1="60" y1="380" x2="840" y2="380" stroke="#1f2937" stroke-width="4"/><line x1="60" y1="404" x2="840" y2="404" stroke="#1f2937" stroke-width="4"/><rect x="293" y="250" width="14" height="140" rx="0" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><path d="M293,390 L307,390 L300,414 z" stroke="#5b6478" stroke-width="0" fill="#5b6478"/><circle cx="300" cy="392" r="27" fill="none" stroke="#c0392b" stroke-width="4"/><line x1="300" y1="392" x2="262" y2="372" stroke="#c0392b" stroke-width="3"/><line x1="300" y1="392" x2="338" y2="372" stroke="#c0392b" stroke-width="3"/><line x1="300" y1="392" x2="258" y2="400" stroke="#c0392b" stroke-width="3"/><line x1="300" y1="392" x2="342" y2="400" stroke="#c0392b" stroke-width="3"/><line x1="300" y1="392" x2="300" y2="348" stroke="#c0392b" stroke-width="3"/><text x="318" y="288" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">nail</text><text x="330" y="330" font-size="32" font-weight="900" fill="#c0392b" text-anchor="start">arc</text><text x="60" y="610" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">A nail through the cable or a loose</text><text x="60" y="654" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">terminal arcs — hot enough to ignite,</text><text x="60" y="698" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">at less current than the load draws.</text><text x="30" y="790" font-size="34" font-weight="900" fill="#264387" text-anchor="start">AT THE PANEL</text><rect x="60" y="820" width="300" height="230" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="85" y="845" width="250" height="48" rx="0" fill="#ffffff" stroke="#5b6478" stroke-width="3"/><text x="210" y="878" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">standard</text><rect x="85" y="915" width="250" height="48" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="210" y="948" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">AFCI</text><rect x="85" y="985" width="250" height="48" rx="0" fill="#ffffff" stroke="#5b6478" stroke-width="3"/><text x="210" y="1018" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">standard</text><text x="390" y="880" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">AFCI / dual-function breaker</text><text x="390" y="924" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">recognizes the arcing</text><text x="390" y="968" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">signature and opens the circuit</text><text x="30" y="1130" font-size="34" font-weight="900" fill="#264387" text-anchor="start">THE ROOM LIST — 210.12(A)</text><rect x="60" y="1160" width="390" height="250" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="80" y="1205" font-size="32" font-weight="900" fill="#2e7d32" text-anchor="start">ON THE LIST ✔</text><text x="80" y="1252" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Bedrooms · kitchens</text><text x="80" y="1294" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Living · dining rooms</text><text x="80" y="1336" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Hallways · closets</text><text x="80" y="1378" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Laundry areas · dens</text><rect x="450" y="1160" width="390" height="250" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="470" y="1205" font-size="32" font-weight="900" fill="#c0392b" text-anchor="start">NOT ON THE LIST ✘</text><text x="470" y="1252" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Bathrooms</text><text x="470" y="1294" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Garages</text><text x="470" y="1336" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Unfinished basements</text><text x="470" y="1378" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">240 V circuits</text></svg>