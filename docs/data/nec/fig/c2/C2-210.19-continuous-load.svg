<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" width="900" height="1280" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Continuous load: multiply by 1.25</title><desc id="d">Flow chart with two worked examples. A 16 A continuous load times 1.25 gives a 20 A conductor and a 20 A breaker. A 24 A continuous EV charging load times 1.25 gives a 30 A conductor and a 30 A breaker. A red trap panel shows a 24 A load on a 25 A breaker with no 125 percent factor.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1280" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Continuous load: multiply by 1.25</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Conductor and breaker both step up</text><line x1="30" y1="1222" x2="870" y2="1222" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1260" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.19; Sharma S-01</text><rect x="20" y="230" width="200" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="120" y="288" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">16 A</text><text x="120" y="332" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">continuous</text><line x1="224" y1="295" x2="241" y2="295" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="245" y="230" width="200" height="130" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="345" y="288" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">× 1.25</text><text x="345" y="332" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">factor</text><line x1="449" y1="295" x2="466" y2="295" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="470" y="230" width="200" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="570" y="288" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">20 A</text><text x="570" y="332" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">conductor</text><line x1="674" y1="295" x2="691" y2="295" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="695" y="230" width="200" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="795" y="288" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">20 A</text><text x="795" y="332" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">breaker</text><rect x="20" y="450" width="200" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="120" y="508" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">24 A</text><text x="120" y="552" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">EV charger</text><line x1="224" y1="515" x2="241" y2="515" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="245" y="450" width="200" height="130" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="345" y="508" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">× 1.25</text><text x="345" y="552" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">factor</text><line x1="449" y1="515" x2="466" y2="515" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="470" y="450" width="200" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="570" y="508" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">30 A</text><text x="570" y="552" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">conductor</text><line x1="674" y1="515" x2="691" y2="515" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="695" y="450" width="200" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="795" y="508" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">30 A</text><text x="795" y="552" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">breaker</text><rect x="30" y="660" width="840" height="120" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="712" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Load counts 125% — runs at 80% of rating.</text><text x="450" y="756" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Headroom saves insulation and terminals.</text><rect x="30" y="830" width="840" height="170" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="892" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">THE TRAP</text><text x="450" y="940" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">24 A continuous on a 25 A breaker: “it fits.”</text><text x="450" y="984" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">It does not — the load counts 30 A.</text><text x="450" y="1090" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Continuous = maximum current for 3 hours or more.</text></svg>