<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">240.4(B) Rounding up, with fences</title><desc id="d">Decision flow: a 187A feeder ampacity passes the three conditions of 240.4(B) and lands on a 200A breaker; past 800A there is no round-up.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1340" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">240.4(B) Rounding up, with fences</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Feeder example: 187A ampacity, 200A next size up</text><line x1="30" y1="1282" x2="870" y2="1282" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1320" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 240.4(B), 240.4(C)</text><text x="870" y="1320" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="70" y="200" width="760" height="110" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="248" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">Ampacity lands between standard sizes</text><text x="450" y="292" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">Worked example: 187A after derating</text><line x1="450" y1="310" x2="450" y2="344" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="350" width="760" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="398" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">(1) Not a multi-outlet</text><text x="450" y="440" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">receptacle branch circuit</text><text x="795" y="418" font-size="44" font-weight="800" fill="#2e7d32" text-anchor="middle">✓</text><line x1="450" y1="480" x2="450" y2="514" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="520" width="760" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="568" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">(2) Ampacity does not match</text><text x="450" y="610" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">a standard rating</text><text x="795" y="588" font-size="44" font-weight="800" fill="#2e7d32" text-anchor="middle">✓</text><line x1="450" y1="650" x2="450" y2="684" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="690" width="760" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="738" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">(3) Next size up does not</text><text x="450" y="780" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">exceed 800A</text><text x="795" y="758" font-size="44" font-weight="800" fill="#2e7d32" text-anchor="middle">✓</text><line x1="450" y1="820" x2="450" y2="854" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="860" width="760" height="110" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="908" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">Next standard size up: 200A breaker</text><text x="450" y="950" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">protects the 187A conductors</text><rect x="70" y="1020" width="760" height="120" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1072" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Past 800A there is no rounding up.</text><text x="450" y="1116" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">240.4(C): ampacity ≥ device rating.</text><text x="450" y="1200" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">State all three conditions on the calc sheet.</text></svg>