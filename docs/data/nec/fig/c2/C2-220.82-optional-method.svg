<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1330" width="900" height="1330" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">220.82 Optional method: two blocks</title><desc id="d">Flow diagram of the optional method: the general-loads block totals 33,500 VA at nameplate and demand-factors to 19,400 VA; the heating-and-cooling block adds only the largest selection, the 5,760 VA air conditioner; the total is 25,160 VA, about 105 A at 240 V, above the 100 A floor.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1330" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">220.82 Optional method: two blocks</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked example: the 1,800 sq ft house.</text><line x1="30" y1="1272" x2="870" y2="1272" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 220.82, 220.82(B), 220.82(C)</text><rect x="40" y="190" width="820" height="270" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="64" y="242" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">GENERAL LOADS — 220.82(B)</text><text x="64" y="302" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Loads at nameplate: 33,500 VA</text><text x="64" y="348" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">First 10,000 VA at 100% · remainder at 40%</text><text x="64" y="394" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">23,500 × 40% = 9,400 → block = 19,400 VA</text><line x1="450" y1="460" x2="450" y2="505" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="520" width="820" height="190" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="64" y="572" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">HEATING AND COOLING — 220.82(C)</text><text x="64" y="632" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Six selections — add only the largest</text><text x="64" y="678" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Largest here: air conditioning, 5,760 VA</text><line x1="450" y1="710" x2="450" y2="755" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="770" width="820" height="170" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="838" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">TOTAL = 19,400 + 5,760 = 25,160 VA</text><text x="450" y="888" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">25,160 VA ÷ 240 V ≈ 105 A</text><rect x="27.0" y="976" width="846" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="1014" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Service at or above 105 A — 100 A floor met</text></svg>