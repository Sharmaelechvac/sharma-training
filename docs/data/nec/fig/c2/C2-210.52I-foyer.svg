<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.52(I) Foyer receptacles</title><desc id="d">Plan of a 72 sq ft foyer showing receptacles on each wall space 3 ft or wider, the front door interrupting one wall, and a 2 ft stub that needs none.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.52(I) Foyer receptacles</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Example: 8 ft x 9 ft = 72 sq ft, not part of a hallway.</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.52(I), 210.52(H)</text><rect x="150" y="230" width="560" height="630" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="6"/><rect x="360" y="225" width="210" height="12" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="465" y="274" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">to hall</text><rect x="300" y="855" width="140" height="12" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><line x1="300" y1="860" x2="300" y2="720" stroke="#1f2937" stroke-width="4"/><path d="M 300 720 A 140 140 0 0 1 440 860" stroke="#1f2937" stroke-width="3" fill="none" stroke-dasharray="10 8"/><text x="370" y="904" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">FRONT DOOR</text><rect x="705" y="300" width="12" height="110" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="734" y="362" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">closet</text><rect x="574" y="238" width="132" height="16" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="640" y="298" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">2 ft stub</text><circle cx="174" cy="545" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="174" y="556" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">R</text><circle cx="686" cy="640" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="686" y="651" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">R</text><circle cx="580" cy="836" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="580" y="847" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">R</text><line x1="150" y1="230" x2="150" y2="212" stroke="#1a2f61" stroke-width="2"/><line x1="710" y1="230" x2="710" y2="212" stroke="#1a2f61" stroke-width="2"/><line x1="150" y1="200" x2="710" y2="200" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="430.0" y="188" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">8 ft</text><text x="430.0" y="188" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">8 ft</text><line x1="150" y1="230" x2="93" y2="230" stroke="#1a2f61" stroke-width="2"/><line x1="150" y1="860" x2="93" y2="860" stroke="#1a2f61" stroke-width="2"/><line x1="105" y1="230" x2="105" y2="860" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="91" y="557.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">9 ft</text><text x="91" y="557.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">9 ft</text><line x1="440" y1="860" x2="440" y2="932" stroke="#1a2f61" stroke-width="2"/><line x1="710" y1="860" x2="710" y2="932" stroke="#1a2f61" stroke-width="2"/><line x1="440" y1="920" x2="710" y2="920" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="575.0" y="958" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">3 ft min wall space</text><text x="575.0" y="958" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3 ft min wall space</text><text x="450" y="512" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">72 sq ft</text><text x="450" y="560" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">over the 60 sq ft limit</text><text x="450" y="608" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">210.52(I) applies</text><text x="70" y="1010" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Receptacle in every wall space 3 ft or wider.</text><text x="70" y="1056" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Walls interrupted by door openings do not</text><text x="70" y="1102" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">create a wall space; a stub under 3 ft needs none.</text></svg>