f61" text-anchor="middle">CASA</text><line x1="845" y1="430" x2="845" y2="1150" stroke="#264387" stroke-width="7"/><line x1="790" y1="470" x2="890" y2="470" stroke="#264387" stroke-width="5"/><line x1="170" y1="850" x2="400" y2="850" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/><line x1="400" y1="790" x2="620" y2="790" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/><line x1="620" y1="610" x2="845" y2="610" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/><path d="M150,470 Q497,690 845,470" stroke="#1f2937" stroke-width="5" fill="none"/><text x="497" y="300" font-size="34" font-weight="600" fill="#5b6478" text-anchor="middle">conductor con flecha final</text><line x1="310" y1="850" x2="310" y2="1150" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="324" y="1012.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft mín</text><text x="324" y="1012.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">10 ft mín</text><line x1="520" y1="790" x2="520" y2="1150" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="534" y="982.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 ft mín</text><text x="534" y="982.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">12 ft mín</text><line x1="700" y1="610" x2="700" y2="1150" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="714" y="892.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">18 ft mín</text><text x="714" y="892.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">18 ft mín</text></svg>