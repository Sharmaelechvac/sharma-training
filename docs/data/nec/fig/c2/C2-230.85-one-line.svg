<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1900" width="900" height="1900" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">230.85 Emergency disconnect: one-lines</title><desc id="d">Two one-line diagrams. Option 1: outdoor meter-main is both service disconnect and emergency disconnect, feeding an indoor panel with neutral and ground separated. Option 3: meter, outdoor emergency disconnect marked not service equipment, then the indoor service panel nearest the point of entrance.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1900" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">230.85 Emergency disconnect: one-lines</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">One- and two-family dwellings. Two common layouts.</text><line x1="30" y1="1842" x2="870" y2="1842" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1880" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 230.70, 230.85; NEC 2023 230.85</text><rect x="25" y="180" width="400" height="110" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="225" y="226" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">OPTION 1</text><text x="225" y="270" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">Outdoor meter-main</text><rect x="475" y="180" width="400" height="110" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="675" y="226" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">OPTION 3</text><text x="675" y="270" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">Outdoor switch + inside panel</text><rect x="0" y="1114" width="900" height="12" rx="0" fill="url(#hatch)" stroke="#1f2937" stroke-width="2"/><text x="20" y="1100" font-size="30" font-weight="900" fill="#5b6478" text-anchor="start">OUTSIDE ▲</text><text x="20" y="1164" font-size="30" font-weight="900" fill="#5b6478" text-anchor="start">INSIDE ▼</text><circle cx="225" cy="350" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="225" cy="390" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="281" y="384" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">utility</text><line x1="225" y1="424" x2="225" y2="500" stroke="#1f2937" stroke-width="5"/><rect x="135" y="500" width="180" height="330" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="225" y="488" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><circle cx="225" cy="570" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="225" y="582" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">M</text><line x1="225" y1="604" x2="225" y2="672" stroke="#1f2937" stroke-width="5"/><circle cx="225" cy="672" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="225" cy="728" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><path d="M225,672 A30,30 0 0 1 225,728" stroke="#1a2f61" stroke-width="5" fill="none"/><line x1="225" y1="728" x2="225" y2="756" stroke="#1f2937" stroke-width="5"/><text x="225" y="790" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">MBJ + GEC</text><rect x="25" y="850" width="400" height="100" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="225" y="890" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">EMERGENCY DISCONNECT,</text><text x="225" y="928" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">SERVICE DISCONNECT</text><line x1="225" y1="950" x2="225" y2="1300" stroke="#1f2937" stroke-width="5"/><text x="241" y="1060" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">4-wire feeder</text><text x="241" y="1100" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">(N and EGC apart)</text><rect x="135" y="1300" width="180" height="190" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="225" y="1350" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">panel</text><text x="225" y="1394" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">N ≠ G</text><text x="225" y="1438" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">no MBJ</text><circle cx="675" cy="350" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="675" cy="390" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="731" y="384" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">utility</text><line x1="675" y1="424" x2="675" y2="500" stroke="#1f2937" stroke-width="5"/><circle cx="675" cy="540" r="34" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="675" y="552" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">M</text><line x1="675" y1="574" x2="675" y2="640" stroke="#1f2937" stroke-width="5"/><rect x="585" y="640" width="180" height="160" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="675" cy="692" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="675" cy="748" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="675" y1="748" x2="701" y2="696" stroke="#1a2f61" stroke-width="5"/><line x1="675" y1="692" x2="675" y2="670" stroke="#1f2937" stroke-width="5"/><line x1="675" y1="748" x2="675" y2="800" stroke="#1f2937" stroke-width="5"/><rect x="475" y="840" width="400" height="140" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="675" y="884" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">EMERGENCY DISCONNECT,</text><text x="675" y="922" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">NOT SERVICE</text><text x="675" y="960" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">EQUIPMENT</text><line x1="675" y1="980" x2="675" y2="1300" stroke="#1f2937" stroke-width="5"/><text x="691" y="1060" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">service</text><text x="691" y="1100" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">conductors</text><rect x="555" y="1300" width="240" height="190" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="675" y="1350" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">service panel</text><text x="675" y="1394" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">MBJ here</text><text x="675" y="1438" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">near entry point</text><text x="40" y="1560" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Both: readily accessible, outdoors, grouped if</text><text x="40" y="1602" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">more than one (230.85). Option 2 = utility</text><text x="40" y="1644" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">meter disconnect, marked METER DISCONNECT.</text><text x="40" y="1702" font-size="33" font-weight="900" fill="#c0392b" text-anchor="start">NEC 2023: red label, white letters ½ in high;</text><text x="40" y="1744" font-size="33" font-weight="900" fill="#c0392b" text-anchor="start">service replacement triggers it (230.85(C)).</text></svg>