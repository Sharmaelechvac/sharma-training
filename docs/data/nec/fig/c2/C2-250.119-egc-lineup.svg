<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Naming the equipment ground</title><desc id="d">A lineup of conductors. Green, green with a yellow stripe, and bare conductors are marked OK as equipment grounding conductors. A black 12 AWG conductor with green tape is crossed out as not permitted for 6 AWG and smaller. A 4/0 conductor with green marking at the termination is marked OK under 250.119(A).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Naming the equipment ground</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Green, green/yellow or bare —</text><text x="30" y="196" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">tape is only for 4 AWG and larger</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.119, 250.119(A), 250.119(B)</text><circle cx="445" cy="272" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><path d="M432,272 l9,10 l18,-20" stroke="#ffffff" stroke-width="5" fill="none"/><text x="493" y="264" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">GREEN — OK</text><rect x="50" y="250" width="350" height="44" rx="22" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><circle cx="445" cy="422" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><path d="M432,422 l9,10 l18,-20" stroke="#ffffff" stroke-width="5" fill="none"/><text x="493" y="414" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">GREEN/YELLOW — OK</text><rect x="50" y="400" width="350" height="44" rx="22" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><line x1="75" y1="404" x2="101" y2="440" stroke="#F0A846" stroke-width="8"/><line x1="137" y1="404" x2="163" y2="440" stroke="#F0A846" stroke-width="8"/><line x1="199" y1="404" x2="225" y2="440" stroke="#F0A846" stroke-width="8"/><line x1="261" y1="404" x2="287" y2="440" stroke="#F0A846" stroke-width="8"/><line x1="323" y1="404" x2="349" y2="440" stroke="#F0A846" stroke-width="8"/><line x1="385" y1="404" x2="411" y2="440" stroke="#F0A846" stroke-width="8"/><circle cx="445" cy="572" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><path d="M432,572 l9,10 l18,-20" stroke="#ffffff" stroke-width="5" fill="none"/><text x="493" y="564" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">BARE — OK</text><rect x="50" y="550" width="350" height="44" rx="22" fill="#ffffff" stroke="#5b6478" stroke-width="4"/><line x1="70" y1="572" x2="380" y2="572" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 8"/><circle cx="445" cy="722" r="26" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><line x1="433" y1="710" x2="457" y2="734" stroke="#ffffff" stroke-width="5"/><line x1="433" y1="734" x2="457" y2="710" stroke="#ffffff" stroke-width="5"/><text x="493" y="714" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">BLACK + TAPE — NO</text><text x="493" y="753" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">no tape on small wire</text><rect x="50" y="700" width="350" height="44" rx="22" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><rect x="85" y="696" width="32" height="52" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="333" y="696" width="32" height="52" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><circle cx="445" cy="892" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><path d="M432,892 l9,10 l18,-20" stroke="#ffffff" stroke-width="5" fill="none"/><text x="493" y="884" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">4/0 MARKED GREEN — OK</text><text x="493" y="923" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">4 AWG and larger (A)</text><rect x="50" y="862" width="350" height="60" rx="26" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><rect x="322" y="856" width="40" height="72" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="40" y="1030" width="820" height="170" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1092" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">The reservation runs both ways:</text><text x="450" y="1136" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">white/gray is never a ground;</text><text x="450" y="1180" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">green is never a hot.</text></svg>