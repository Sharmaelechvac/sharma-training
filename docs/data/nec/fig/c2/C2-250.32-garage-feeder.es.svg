<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Un edificio separado con alimentador</title><desc id="d">Acometida de casa que alimenta un garaje separado por un alimentador de 4 conductores. El garaje tiene su propia desconexión, una barra de neutro aislada, una barra de tierra unida y dos varillas de tierra separadas 6 ft. El neutro no se une de nuevo en el garaje.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Un edificio separado con alimentador</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Alimentador de 4 conductores; unión en la casa</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.32(A), 250.32(B)(1), 250.53(A)</text><rect x="20" y="230" width="380" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="45" y="300" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CASA</text><text x="45" y="362" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Equipo de acometida</text><text x="45" y="408" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Puente principal de unión</text><text x="45" y="454" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">está AQUÍ — solo aquí</text><rect x="500" y="230" width="380" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="520" y="298" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">GARAJE SEPARADO</text><text x="525" y="362" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Desconexión (225.31)</text><text x="525" y="408" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Neutro: AISLADO</text><text x="525" y="454" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Barra de tierra: unida</text><text x="525" y="500" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Electrodos abajo</text><line x1="400" y1="330" x2="500" y2="330" stroke="#1f2937" stroke-width="5"/><text x="450" y="320" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">L1</text><line x1="400" y1="385" x2="500" y2="385" stroke="#1f2937" stroke-width="5"/><text x="450" y="375" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">L2</text><line x1="400" y1="440" x2="500" y2="440" stroke="#5b6478" stroke-width="5"/><text x="450" y="430" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">N</text><line x1="400" y1="495" x2="500" y2="495" stroke="#2e7d32" stroke-width="5"/><text x="450" y="485" font-size="30" font-weight="700" fill="#2e7d32" text-anchor="middle">EGC</text><text x="450" y="585" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Alimentador con un EGC, dimensionado según 250.122</text><rect x="500" y="610" width="380" height="84" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="690" y="664" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Sin re-unión aquí</text><line x1="690" y1="694" x2="690" y2="1050" stroke="#2e7d32" stroke-width="5"/><line x1="600" y1="1050" x2="780" y2="1050" stroke="#2e7d32" stroke-width="5"/><text x="706" y="880" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">GEC</text><rect x="591" y="1050" width="18" height="250" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="771" y="1050" width="18" height="250" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="600" y1="1000" x2="780" y2="1000" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="690.0" y="988" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft mín. de separación</text><text x="690.0" y="988" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft mín. de separación</text><line x1="836" y1="1050" x2="836" y2="1300" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(824,1150.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">varilla de 8 ft</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">varilla de 8 ft</text></g><rect x="20" y="1300" width="860" height="90" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="2"/><text 