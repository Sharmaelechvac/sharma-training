<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.8(A)(10) GFCI de lavandería</title><desc id="d">Elevación de un clóset de lavandería con lavadora y secadora, un receptáculo de lavadora de 120 voltios y un receptáculo de secadora de 250 voltios, ambos cableados de vuelta a un tablero donde el interruptor de la secadora es un GFCI de 30 amperios y 2 polos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.8(A)(10) GFCI de lavandería</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Lavadora y secadora: ambos protegidos</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.8(A), 210.8(A)(10)</text><rect x="60" y="210" width="780" height="560" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><rect x="100" y="420" width="240" height="300" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="220" cy="540" r="78" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="220" y="396" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">LAVADORA</text><rect x="430" y="420" width="240" height="300" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="462" y="452" width="176" height="200" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="550" y="396" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">SECADORA</text><circle cx="385" cy="470" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="378" y1="464" x2="378" y2="476" stroke="#1a2f61" stroke-width="3"/><line x1="392" y1="464" x2="392" y2="476" stroke="#1a2f61" stroke-width="3"/><text x="385" y="645" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">120 V</text><circle cx="715" cy="470" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="708" y1="464" x2="708" y2="476" stroke="#1a2f61" stroke-width="3"/><line x1="722" y1="464" x2="722" y2="476" stroke="#1a2f61" stroke-width="3"/><text x="715" y="645" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">250 V</text><text x="360" y="300" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">recept. lavadora</text><text x="828" y="300" font-size="32" font-weight="700" fill="#1f2937" text-anchor="end">recept. secadora</text><text x="715" y="262" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">GFCI</text><text x="385" y="262" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">GFCI</text><path d="M385,720 L385,860 L330,860 L330,905" stroke="#1a2f61" stroke-width="4" fill="none"/><path d="M715,720 L715,860 L570,860 L570,905" stroke="#1a2f61" stroke-width="4" fill="none"/><rect x="250" y="905" width="400" height="190" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="5"/><text x="450" y="955" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><rect x="285" y="985" width="130" height="80" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="350" y="1035" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">GFCI</text><rect x="485" y="985" width="130" height="80" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="550" y="1037" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Q230GF</text><text x="325" y="1140" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">lavadora</text><text x="575" y="1140" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">secadora 30 A 2 polos</text><text x="60" y="1200" font-size="34" font-weight="700" fill="#5b6478" text-anchor="start">Área de lavandería = ítem (10) en 210.8(A).</text></svg>