<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" width="900" height="1260" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">225.32: desconexión en la entrada</title><desc id="d">Plano de un garaje separado: el alimentador entra por la pared inferior y la desconexión queda justo en la entrada, mientras un tramo rojo punteado cruza el edificio hasta un tablero lejano, la ubicación que la sección rechaza.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1260" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">225.32: desconexión en la entrada</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta: entra por la pared inferior.</text><line x1="30" y1="1202" x2="870" y2="1202" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1240" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 225.32; véase también 225.30, 230.6</text><rect x="110" y="250" width="680" height="620" rx="0" fill="#ffffff" stroke="#264387" stroke-width="6"/><text x="140" y="310" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">GARAJE SEPARADO</text><line x1="110" y1="870" x2="268" y2="870" stroke="#264387" stroke-width="6"/><line x1="362" y1="870" x2="790" y2="870" stroke="#264387" stroke-width="6"/><line x1="315" y1="1015" x2="315" y2="878" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><text x="340" y="1000" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">alimentador desde la casa</text><rect x="255" y="758" width="120" height="82" rx="6" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="255" cy="758" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="255" y="770" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="398" y="795" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">DESCONEXIÓN</text><text x="398" y="838" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">en el punto de entrada</text><path d="M315 758 L185 758 L185 340 L640 340" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="12 9"/><rect x="640" y="300" width="115" height="72" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/><circle cx="640" cy="300" r="24" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="640" y="312" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><line x1="652" y1="312" x2="743" y2="360" stroke="#c0392b" stroke-width="4"/><line x1="743" y1="312" x2="652" y2="360" stroke="#c0392b" stroke-width="4"/><text x="215" y="398" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">tramo largo sin protección</text><circle cx=