" cy="408" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="360" y="420" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="615" cy="356" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="615" y="368" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="360" cy="668" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="360" y="680" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="56" cy="908" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="56" y="920" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="104" y="920" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Unión de tubería de agua en una acometida —</text><text x="104" y="962" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Tabla 250.102(C)(1)</text><circle cx="56" cy="1018" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="56" y="1030" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="104" y="1030" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Puente llevado a través del medidor</text><text x="104" y="1072" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">para que el trayecto quede continuo</text><circle cx="56" cy="1128" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="56" y="1140" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="104" y="1140" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Unión de tubería de gas — Tabla 250.122,</text><text x="104" y="1182" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">por el circuito que lo energiza</text><text x="450" y="1330" font-size="33" font-weight="800" fill="#c0392b" text-anchor="middle">Tubería de gas CSST: vea la nota de Florida.