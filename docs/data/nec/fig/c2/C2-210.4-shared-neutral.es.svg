 fill="#5b6478" text-anchor="middle">Neutro compartido</text><rect x="50" y="530" width="810" height="96" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="455" y="588" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">✓ Fases opuestas: neutro = 16 − 16 = 0 A</text><rect x="50" y="840" width="360" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="75" y="902" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">TABLERO</text><rect x="70" y="932" width="320" height="66" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="230" y="976" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Int. A — Fase A</text><rect x="70" y="1018" width="320" height="66" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="230" y="1062" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Int. B — Fase A</text><rect x="560" y="870" width="300" height="100" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="710" y="932" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Carga A — 16 A</text><rect x="560" y="1020" width="300" height="100" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="710" y="1082" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Carga B — 16 A</text><line x1="410" y1="965" x2="560" y2="920" stroke="#1f2937" stroke-width="4"/><line x1="410" y1="1051" x2="560" y2="1070" stroke="#264387" stroke-width="4"/><line x1="410" y1="1125" x2="880" y2="1125" stroke="#c0392b" stroke-width="4"/><line x1="650" y1="970" x2="650" y2="1125" stroke="#c0392b" stroke-width="3"/><line x1="790" y1="1120" x2="790" y2="1125" stroke="#c0392b" stroke-width="3"/><text x="455" y="1108" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">Neutro compartido</text><text x="455" y="1108" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Neutro compartido</text><rect x="50" y="1170" width="810" height="96" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="455" y="1228" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Misma fase: neutro = 16 + 16 = 32 A</text><text x="450" y="1360" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Ningún interruptor vigila el neutro. Solo se calienta.</text></svg>