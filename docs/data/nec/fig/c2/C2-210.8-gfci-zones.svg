<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.8 GFCI: judged by location</title><desc id="d">Floor plan of a Florida slab home with GFCI locations in gold: kitchen counter, bathroom, laundry, garage and outdoors; a 6 ft zone is drawn from the kitchen sink and from the tub; the living room receptacle is grey, not GFCI by location.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.8 GFCI: judged by location</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Florida slab home. Gold = GFCI location.</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.8, 210.8(A)</text><text x="870" y="1500" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="190" width="370" height="320" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="235.0" y="470" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">KITCHEN</text><rect x="420" y="190" width="180" height="320" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="510.0" y="470" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">HALL</text><rect x="600" y="190" width="250" height="320" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="725.0" y="470" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">BATH</text><rect x="50" y="510" width="370" height="300" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="235.0" y="770" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">LIVING</text><rect x="420" y="510" width="180" height="300" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="510.0" y="770" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">LAUNDRY</text><rect x="600" y="510" width="250" height="300" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><text x="725.0" y="770" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">GARAGE</text><rect x="54" y="194" width="362" height="44" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="120" y="200" width="70" height="32" rx="8" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="155" y="300" font-size="30" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">sink</text><text x="155" y="300" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">sink</text><clipPath id="kit"><rect x="50" y="190" width="370" height="320"/></clipPath><g clip-path="url(#kit)"><circle cx="155" cy="216" r="180" fill="#F0A846" fill-opacity="0.22" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/></g><line x1="155" y1="216" x2="282" y2="343" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)"/><text x="300" y="330" font-size="30" font-weight="900" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft</text><text x="300" y="330" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="start">6 ft</text><rect x="700" y="194" width="146" height="60" rx="14" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="773" y="300" font-size="30" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">tub</text><text x="773" y="300" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">tub</text><clipPath id="bath"><rect x="600" y="190" width="250" height="320"/></clipPath><g clip-path="url(#bath)"><circle cx="773" cy="224" r="180" fill="#F0A846" fill-opacity="0.22" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/></g><rect x="436" y="526" width="56" height="56" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="3"/><text x="464" y="566" font-size="30" font-weight="900" fill="#1f2937" text-anchor="middle">W</text><rect x="500" y="526" width="56" height="56" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="3"/><text x="528" y="566" font-size="30" font-weight="900" fill="#1f2937" text-anchor="middle">D</text><circle cx="330" cy="216" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="330" y="226" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">G</text><circle cx="640" cy="300" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="640" y="310" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">G</text><circle cx="464" cy="640" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="464" y="650" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">G</text><circle cx="700" cy="640" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="700" y="650" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">G</text><circle cx="120" cy="880" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="120" y="890" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">G</text><circle cx="200" cy="640" r="20" fill="#ffffff" stroke="#5b6478" stroke-width="4"/><text x="200" y="650" font-size="30" font-weight="900" fill="#5b6478" text-anchor="middle">–</text><text x="160" y="892" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">OUTDOORS — patio / lanai receptacle</text><text x="50" y="960" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Living room receptacle: no GFCI by location.</text><circle cx="70" cy="1020" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="70" y="1030" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">G</text><text x="110" y="1032" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">GFCI required by location (210.8(A))</text><circle cx="70" cy="1094" r="20" fill="#ffffff" stroke="#5b6478" stroke-width="4"/><text x="70" y="1104" font-size="30" font-weight="900" fill="#5b6478" text-anchor="middle">–</text><text x="110" y="1106" font-size="36" font-weight="800" fill="#5b6478" text-anchor="start">Not required by location</text><rect x="48" y="1148" width="44" height="28" rx="0" fill="#F0A846" fill-opacity="0.3" stroke="#F0A846" stroke-width="3" stroke-dasharray="8 6"/><text x="110" y="1170" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">6 ft zone: from the top inside edge of the</text><text x="110" y="1214" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">sink bowl, and the outside edge of the tub.</text><text x="50" y="1280" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">Measure the way a cord travels — never</text><text x="50" y="1324" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">through a wall, a door or a window.</text><text x="50" y="1368" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">Protection may be at the breaker (S-07),</text><text x="50" y="1412" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">at the receptacle, or feed-through.</text></svg>