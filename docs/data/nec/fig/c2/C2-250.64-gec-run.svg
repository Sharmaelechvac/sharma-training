<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1750" width="900" height="1750" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">250.64 Run the GEC in one piece</title><desc id="d">A grounding electrode conductor runs in one unbroken gold line from a service panel, through a steel sleeve bonded at both ends, down to a ground rod in the earth, with numbered callouts for the one-length rule, the bonded sleeve, and the electrode connection.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1750" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">250.64 Run the GEC in one piece</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Continuous, protected, sleeves bonded</text><line x1="30" y1="1692" x2="870" y2="1692" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1730" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.64(A)–(F)</text><text x="870" y="1730" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="0" y="1080" width="900" height="190" rx="0" fill="url(#earth)" stroke="none" stroke-width="0"/><line x1="0" y1="1080" x2="900" y2="1080" stroke="#1f2937" stroke-width="5"/><text x="880" y="1064" font-size="32" font-weight="800" fill="#5b6478" text-anchor="end">grade</text><rect x="60" y="200" width="250" height="230" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="185" y="262" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">SERVICE</text><text x="185" y="306" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">PANEL</text><circle cx="185" cy="372" r="26" fill="#ffffff" stroke="#F0A846" stroke-width="4"/><path d="M310,330 L668,330 L668,1010" stroke="#F0A846" stroke-width="9" fill="none"/><rect x="646" y="560" width="46" height="190" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><line x1="646" y1="596" x2="668" y2="596" stroke="#1a2f61" stroke-width="5"/><line x1="646" y1="714" x2="668" y2="714" stroke="#1a2f61" stroke-width="5"/><text x="620" y="530" font-size="32" font-weight="800" fill="#5b6478" text-anchor="end">steel sleeve</text><rect x="660" y="1010" width="16" height="250" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="700" y="1180" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">ground rod</text><circle cx="360" cy="330" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="360" y="342" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="620" cy="655" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="620" y="667" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="668" cy="960" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="668" y="972" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="64" cy="1318" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="64" y="1330" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="100" y="1330" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">One unbroken length — splices only by</text><text x="100" y="1370" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">irreversible compression or exothermic weld</text><circle cx="64" cy="1410" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="64" y="1422" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="100" y="1422" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Ferrous sleeve bonded to the GEC</text><text x="100" y="1462" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">at BOTH ends, or it chokes the fault path</text><circle cx="64" cy="1502" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="64" y="1514" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="100" y="1514" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Lands on the electrode system — sized</text><text x="100" y="1554" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">from Table 250.66 (see the 250.66 page)</text></svg>