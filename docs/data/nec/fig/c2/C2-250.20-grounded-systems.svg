<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">250.20 Grounded systems</title><desc id="d">Three service diagrams side by side: 120/240 volt single-phase, 208Y/120 volt wye and 480Y/277 volt wye. In each, the neutral conductor is drawn in gold from the source to the panel, with a gold ring at the single grounding point and a ground symbol.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">250.20 Grounded systems</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The grounded conductor bonds to earth at one point</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.20, 250.26</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="175" y="218" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">120/240V</text><text x="175" y="262" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">single-phase</text><rect x="95" y="300" width="160" height="90" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="175" y="357" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">SOURCE</text><line x1="125" y1="390" x2="125" y2="640" stroke="#1f2937" stroke-width="4"/><line x1="175" y1="390" x2="175" y2="640" stroke="#F0A846" stroke-width="7"/><line x1="225" y1="390" x2="225" y2="640" stroke="#1f2937" stroke-width="4"/><line x1="175" y1="520" x2="253" y2="520" stroke="#1f2937" stroke-width="4"/><line x1="253" y1="520" x2="253" y2="548" stroke="#1f2937" stroke-width="4"/><line x1="230" y1="548" x2="276" y2="548" stroke="#1f2937" stroke-width="4"/><line x1="238" y1="562" x2="268" y2="562" stroke="#1f2937" stroke-width="4"/><line x1="246" y1="576" x2="260" y2="576" stroke="#1f2937" stroke-width="4"/><circle cx="175" cy="520" r="16" fill="#ffffff" stroke="#F0A846" stroke-width="6"/><rect x="85" y="640" width="180" height="110" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="175" y="707" font-size="32" font-weight="800" fill="#264387" text-anchor="middle">PANEL</text><text x="175" y="812" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">120 V to ground</text><text x="450" y="218" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">208Y/120V</text><text x="450" y="262" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">wye, 3-phase</text><rect x="370" y="300" width="160" height="90" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="357" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">SOURCE</text><line x1="390" y1="390" x2="390" y2="640" stroke="#1f2937" stroke-width="4"/><line x1="430" y1="390" x2="430" y2="640" stroke="#F0A846" stroke-width="7"/><line x1="470" y1="390" x2="470" y2="640" stroke="#1f2937" stroke-width="4"/><line x1="510" y1="390" x2="510" y2="640" stroke="#1f2937" stroke-width="4"/><line x1="430" y1="520" x2="508" y2="520" stroke="#1f2937" stroke-width="4"/><line x1="508" y1="520" x2="508" y2="548" stroke="#1f2937" stroke-width="4"/><line x1="485" y1="548" x2="531" y2="548" stroke="#1f2937" stroke-width="4"/><line x1="493" y1="562" x2="523" y2="562" stroke="#1f2937" stroke-width="4"/><line x1="501" y1="576" x2="515" y2="576" stroke="#1f2937" stroke-width="4"/><circle cx="430" cy="520" r="16" fill="#ffffff" stroke="#F0A846" stroke-width="6"/><rect x="360" y="640" width="180" height="110" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="707" font-size="32" font-weight="800" fill="#264387" text-anchor="middle">PANEL</text><text x="450" y="812" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">120 V to ground</text><text x="725" y="218" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">480Y/277V</text><text x="725" y="262" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">wye, 3-phase</text><rect x="645" y="300" width="160" height="90" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="725" y="357" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">SOURCE</text><line x1="665" y1="390" x2="665" y2="640" stroke="#1f2937" stroke-width="4"/><line x1="705" y1="390" x2="705" y2="640" stroke="#F0A846" stroke-width="7"/><line x1="745" y1="390" x2="745" y2="640" stroke="#1f2937" stroke-width="4"/><line x1="785" y1="390" x2="785" y2="640" stroke="#1f2937" stroke-width="4"/><line x1="705" y1="520" x2="783" y2="520" stroke="#1f2937" stroke-width="4"/><line x1="783" y1="520" x2="783" y2="548" stroke="#1f2937" stroke-width="4"/><line x1="760" y1="548" x2="806" y2="548" stroke="#1f2937" stroke-width="4"/><line x1="768" y1="562" x2="798" y2="562" stroke="#1f2937" stroke-width="4"/><line x1="776" y1="576" x2="790" y2="576" stroke="#1f2937" stroke-width="4"/><circle cx="705" cy="520" r="16" fill="#ffffff" stroke="#F0A846" stroke-width="6"/><rect x="635" y="640" width="180" height="110" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="725" y="707" font-size="32" font-weight="800" fill="#264387" text-anchor="middle">PANEL</text><text x="725" y="812" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">277 V to ground</text><line x1="60" y1="895" x2="120" y2="895" stroke="#F0A846" stroke-width="7"/><text x="135" y="908" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Gold = grounded conductor (neutral)</text><rect x="50" y="960" width="800" height="190" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="80" y="1022" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">277 V to ground is over the 150 V test —</text><text x="80" y="1070" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">the 480Y/277 is grounded because its</text><text x="80" y="1118" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">neutral is used as a circuit conductor.</text><text x="450" y="1235" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">A delta system: grounding is set by 250.20</text><text x="450" y="1281" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">and 250.26 — never by field preference.</text></svg>