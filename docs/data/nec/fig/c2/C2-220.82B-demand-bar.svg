<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Optional method: the 10 kVA step</title><desc id="d">Bar chart of the 220.82(B) general loads for a 2,000 square foot house: blocks total 17,100 VA; the first 10,000 VA is taken at 100 percent and the remaining 7,100 VA at 40 percent, giving a general demand of 12,840 VA.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Optional method: the 10 kVA step</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked example: 2,000 sq ft house</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 220.82(B)</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="110" y="250" width="228.0" height="84" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><rect x="338.0" y="250" width="114.0" height="84" rx="0" fill="#F0A846" stroke="#ffffff" stroke-width="2"/><rect x="452.0" y="250" width="57.0" height="84" rx="0" fill="#1a2f61" stroke="#ffffff" stroke-width="2"/><rect x="509.0" y="250" width="45.6" height="84" rx="0" fill="#F0A846" stroke="#ffffff" stroke-width="2"/><rect x="554.6" y="250" width="34.199999999999996" height="84" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><rect x="588.8000000000001" y="250" width="171.0" height="84" rx="0" fill="#fdf3e0" stroke="#ffffff" stroke-width="2"/><line x1="110" y1="215" x2="490.0" y2="215" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="300.0" y="203" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">first 10 kVA at 100%</text><text x="300.0" y="203" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">first 10 kVA at 100%</text><text x="759.8000000000001" y="382" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="end">Total = 17,100 VA</text><text x="40" y="448" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">What is in the bar:</text><text x="40" y="506" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  Floor area 2,000 × 3 VA = 6,000 VA</text><text x="40" y="556" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  Small-appliance 2 × 1,500 = 3,000 VA</text><text x="40" y="606" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  Laundry circuit = 1,500 VA</text><text x="40" y="656" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4  Dishwasher 1,200 + disposal 900 VA</text><text x="40" y="706" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">5  Water heater nameplate = 4,500 VA</text><text x="40" y="800" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">After the demand step:</text><rect x="110" y="838" width="380.0" height="84" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><rect x="490.0" y="838" width="107.92" height="84" rx="0" fill="#F0A846" stroke="#ffffff" stroke-width="2"/><text x="110" y="978" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">10,000 VA at 100%</text><text x="650" y="978" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">7,100 × 40% = 2,840 VA</text><rect x="174.0" y="1052" width="552" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="1092" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">General demand = 12,840 VA</text><text x="450" y="1185" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Heat and AC are added later, in 220.82(C).</text></svg>