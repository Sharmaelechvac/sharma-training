<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.11(C) Los circuitos nombrados</title><desc id="d">Un cuadro de tablero Siemens con seis tramos directos etiquetados: dos circuitos de pequeños artefactos de 20 A a la cocina, un circuito de lavandería de 20 A marcado sin otras salidas, un circuito de receptáculos de baño de 20 A, un circuito de garaje de 20 A, y el microondas en su propio circuito de 20 A según la regla Sharma S-06.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.11(C) Los circuitos nombrados</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Cada tramo directo tiene un trabajo de código</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.11(C)(1)–(4); Sharma S-06</text><rect x="40" y="196" width="820" height="104" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="70" y="262" font-size="38" font-weight="800" fill="#ffffff" text-anchor="start">TABLERO SIEMENS — TRAMOS DIRECTOS</text><circle cx="96" cy="400" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="96" y="412" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="126" y1="400" x2="196" y2="400" stroke="#1a2f61" stroke-width="4"/><rect x="196" y="336" width="664" height="136" rx="8" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="220" y="384" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">PEQ. ELECTRODOMÉSTICOS 1</text><text x="220" y="426" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Receptáculos de cocina — 20 A</text><text x="220" y="458" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">SIN OTRAS SALIDAS</text><circle cx="96" cy="560" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="96" y="572" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><line x1="126" y1="560" x2="196" y2="560" stroke="#1a2f61" stroke-width="4"/><rect x="196" y="496" width="664" height="136" rx="8" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="220" y="544" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">PEQ. ELECTRODOMÉSTICOS 2</text><text x="220" y="586" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Cocina, comedor, despensa — 20 A</text><text x="220" y="618" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">SIN OTRAS SALIDAS</text><circle cx="96" cy="720" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="96" y="732" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><line x1="126" y1="720" x2="196" y2="720" stroke="#1a2f61" stroke-width="4"/><rect x="196" y="656" width="664" height="136" rx="8" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="220" y="704" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">LAVANDERÍA</text><text x="220" y="746" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Solo receptáculos de lavandería — 20 A</text><text x="220" y="778" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">SIN OTRAS SALIDAS</text><circle cx="96" cy="880" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="96" y="892" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><line x1="126" y1="880" x2="196" y2="880" stroke="#1a2f61" stroke-width="4"/><rect x="196" y="816" width="664" height="136" rx="8" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="220" y="864" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">BAÑO</text><text x="220" y="906" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Receptáculos del baño — 20 A</text><circle cx="96" cy="1040" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="96" y="1052" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">5</text><line x1="126" y1="1040" x2="196" y2="1040" stroke="#1a2f61" stroke-width="4"/><rect x="196" y="976" width="664" height="136" rx="8" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="220" y="1024" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">GARAJE</text><text x="220" y="1066" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Receptáculos del garaje — 20 A</text><circle cx="96" cy="1200" r="30" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="96" y="1212" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6</text><line x1="126" y1="1200" x2="196" y2="1200" stroke="#1a2f61" stroke-width="4" stroke-dasharray="8 6"/><rect x="196" y="1136" width="664" height="136" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="220" y="1184" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">MICROONDAS (S-06)</text><text x="220" y="1226" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Su propio circuito — 20 A</text><text x="220" y="1258" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">REGLA SHARMA S-06</text><text x="40" y="1326" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Un circuito de baño puede llevar lo de ese baño</text><text x="40" y="1368" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">otras salidas — nunca dos baños.</text></svg>