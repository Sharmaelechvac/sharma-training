b" text-anchor="start">Añadido por NEC 2023 (salidas de cocina)</text><circle cx="60" cy="1298" r="22" fill="#ffffff" stroke="#5b6478" stroke-width="4"/><text x="100" y="1310" font-size="36" font-weight="800" fill="#5b6478" text-anchor="start">Sin GFCI por ubicación en ninguna edición</text><rect x="38" y="1350" width="44" height="30" rx="0" fill="#F0A846" fill-opacity="0.3" stroke="#F0A846" stroke-width="3" stroke-dasharray="8 6"/><text x="100" y="1376" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Zona de 6 ft: fregadero = borde interior superior</text><text x="100" y="1420" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">bañera/ducha = borde exterior. Mida el</text><text x="100" y="1464" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">trayecto del cordón: no por paredes ni puertas.</text><text x="100" y="1520" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Todo receptáculo de 125–250 V cuenta (8).</text></svg>