8" x2="341" y2="640" stroke="#1a2f61" stroke-width="3"/><text x="238.0" y="454.0" font-size="34" font-weight="800" fill="#5b6478" text-anchor="middle">SALA</text><text x="470" y="250" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Mida a lo largo de la línea</text><text x="470" y="292" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">por las esquinas, como</text><text x="470" y="334" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">un cordón pasaría.</text><text x="470" y="376" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start"></text><text x="470" y="418" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">Aberturas de puerta rompen</text><text x="470" y="460" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">la línea. Las esquinas no.</text><text x="470" y="502" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start"></text><text x="470" y="544" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">Ningún punto de la pared</text><text x="470" y="586" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">que 6 ft de un receptáculo</text><text x="470" y="628" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">= 12 ft máx. entre ellos.</text><text x="30" y="740" font-size="34" font-weight="900" fill="#264387" text-anchor="start">MISMA PARED, DESENROLLADA (57 ft)</text><rect x="50" y="790" width="798" height="40" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="3"/><text x="85.0" y="820" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">5</text><line x1="120" y1="776" x2="120" y2="844" stroke="#1f2937" stroke-width="3" stroke-dasharray="6 5"/><text x="232.0" y="820" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">16</text><line x1="344" y1="776" x2="344" y2="844" stroke="#1f2937" stroke-width="3" stroke-dasharray="6 5"/><text x="442.0" y="820" font-size="30" fo