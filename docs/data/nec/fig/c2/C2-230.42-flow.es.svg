<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">230.42 Dimensione desde el cálculo</title><desc id="d">Diagrama de flujo para dimensionar una acometida: empiece con el cálculo del Artículo 220 (ejemplo resuelto 25,160 VA, unos 105 A a 240 V), dimensione la ampacidad del conductor al menos a la carga con la Tabla 310.12 disponible para acometidas de vivienda de carga total, fije el valor de la desconexión a o sobre la carga calculada y nunca bajo el mínimo de 230.79, y solo entonces sigue el valor del tablero. Empezar por el tamaño del tablero está marcado como incorrecto.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">230.42 Dimensione desde el cálculo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El último paso: la etiqueta del tablero</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 230.42, 230.79(C), Tabla 310.12</text><rect x="60" y="200" width="640" height="140" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="84" y="250" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">PASO 1 — EL CÁLCULO</text><text x="84" y="294" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Ejemplo resuelto del Artículo 220 (220.82):</text><text x="84" y="332" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">25,160 VA ≈ 105 A a 240 V</text><line x1="380" y1="340" x2="380" y2="380" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="380" width="640" height="140" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="84" y="430" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">PASO 2 — LOS CONDUCTORES</text><text x="84" y="474" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Ampacidad ≥ la carga calculada</text><text x="84" y="512" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Carga total: Tabla 310.12 (83%)</text><line x1="380" y1="520" x2="380" y2="560" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="560" width="640" height="140" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="84" y="610" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">PASO 3 — LA DESCONEXIÓN</text><text x="84" y="654" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Valor al menos igual a la carga calculada</text><text x="84" y="692" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Mínimo: 100 A para una casa (230.79(C))</text><line x1="380" y1="700" x2="380" y2="740" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="740" width="640" height="140" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="84" y="790" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">PASO 4 — EL TABLERO</text><text x="84" y="834" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Tablero 200 A, conductores de 100 A:</text><text x="84" y="872" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">NO es una acometida de 200 A</text><rect x="724" y="200" width="150" height="660" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><g transform="translate(806,530) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">✗ EMPIECE POR EL TAMAÑO DEL TABLERO</text></g></svg>