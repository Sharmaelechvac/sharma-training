<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">220.61 Los pasos de demanda del neutro</title><desc id="d">Barra que muestra una carga de neutro desbalanceada de 300 A dividida en 200 A: los primeros 200 A cuentan al 100 por ciento, los siguientes 100 A al 70 por ciento, dando una carga de neutro de 270 A, con notas rojas para los dos casos donde no se permite reducción.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">220.61 Los pasos de demanda del neutro</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo resuelto: neutro desbalanceado de 300 A</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 220.61(B)(2), 220.61(C)</text><text x="60" y="222" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">carga desbalanceada de 300 A</text><rect x="60" y="246" width="520" height="130" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><rect x="580" y="246" width="260" height="130" rx="0" fill="#fdf3e0" stroke="#1a2f61" stroke-width="4"/><text x="320" y="322" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">200 A</text><text x="710" y="322" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">100 A</text><text x="320" y="424" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">cuenta al 100%</text><text x="710" y="424" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">cuenta al 70%</text><line x1="450" y1="452" x2="450" y2="506" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="90" y="516" width="720" height="108" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="584" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">200 A + 70 A = neutro de 270 A</text><rect x="40" y="668" width="820" height="84" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="722" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="middle">Porciones de estufa + secadora: 70% OK</text><rect x="40" y="788" width="820" height="190" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="846" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">SIN reducción permitida:</text><text x="450" y="900" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">cargas no lineales en una estrella de 4 hilos (C)(2)</text><text x="450" y="944" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Circuito de 3 hilos desde una estrella de 4 (C)(1)</text><text x="40" y="1052" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">El neutro lleva solo la carga desbalanceada:</text><text x="40" y="1091" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">la carga mayor del neutro a cualquier fase.</text></svg>