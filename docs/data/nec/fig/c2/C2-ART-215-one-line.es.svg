xt x="450" y="854" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">EGC del Artículo 250, tendido con él</text><rect x="100" y="884" width="400" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="300" y="928" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="300" y="964" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">neutro aislado, sin unión</text><line x1="300" y1="976" x2="300" y2="1010" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="100" y="1010" width="400" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="300" y="1054" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CIRCUITOS RAMALES</text><text x="300" y="1090" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">Artículo 210</text><rect x="60" y="1150" width="780" height="190" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="90" y="1208" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">215.2 tamaño del alimentador</text><text x="90" y="1262" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Ampacidad: no continuo + 125% continuo</text><text x="90" y="1312" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">80 A + 125% x 40 A = 130 A mínimo</text></svg>