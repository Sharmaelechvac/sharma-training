<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.11 Named circuits go in first</title><desc id="d">Panel schedule graphic: the four named dwelling circuits of 210.11(C) highlighted in gold at the top - two 20 A small-appliance, one 20 A laundry, one 20 A bathroom and one 20 A garage circuit - above general circuits, appliance circuits and spares.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.11 Named circuits go in first</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Named circuits, then general, then spares.</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.11, 210.11(C)</text><text x="870" y="1680" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="200" width="780" height="74" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="84" y="250" font-size="38" font-weight="800" fill="#ffffff" text-anchor="start">SIEMENS PANEL — SCHEDULE</text><rect x="60" y="274" width="780" height="116" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="84" y="326" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">1–2</text><text x="190" y="326" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Small-appliance ×2 — 20 A</text><text x="190" y="370" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">KITCHEN / DINING RECEPTACLES ONLY</text><rect x="60" y="390" width="780" height="116" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="84" y="442" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">3</text><text x="190" y="442" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Laundry — 20 A</text><text x="190" y="486" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">LAUNDRY AREA ONLY</text><rect x="60" y="506" width="780" height="116" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="84" y="558" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">4</text><text x="190" y="558" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Bathroom — 20 A</text><text x="190" y="602" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">BATHROOM RECEPTACLES</text><rect x="60" y="622" width="780" height="116" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="84" y="674" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">5</text><text x="190" y="674" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Garage — 20 A</text><text x="190" y="718" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">GARAGE RECEPTACLES</text><rect x="60" y="738" width="780" height="116" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="84" y="790" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">6–9</text><text x="190" y="790" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">General lighting + receptacles</text><text x="190" y="834" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">LOAD SPREAD EVENLY AMONG CIRCUITS</text><rect x="60" y="854" width="780" height="116" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="84" y="906" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">10+</text><text x="190" y="906" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Appliance / HVAC circuits</text><text x="190" y="950" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">SIZED BY THEIR OWN ARTICLES</text><rect x="60" y="970" width="780" height="116" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="84" y="1022" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">—</text><text x="190" y="1022" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Spares</text><text x="190" y="1066" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">NOT A SUBSTITUTE FOR A CIRCUIT</text><rect x="60" y="1112" width="44" height="34" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="124" y="1140" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Gold rows: the named circuits, 210.11(C).</text><text x="60" y="1220" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">At least two small-appliance circuits, and at</text><text x="60" y="1266" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">least one each for laundry, bathroom, garage.</text><text x="60" y="1312" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">A named circuit feeding lights or another room</text><text x="60" y="1358" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">is a rough-in error — not a labeling fix.</text><text x="60" y="1456" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Count spaces last. This section is answered by</text><text x="60" y="1502" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">which circuits exist and what they serve.</text></svg>