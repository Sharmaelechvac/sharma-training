<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Valores rectos vs. con barra</title><desc id="d">Comparación de un interruptor de valor recto de 240V, aprobado para la fase alta de un sistema delta, con un interruptor de valor con barra de 120/240V, que no lo es, porque la fase alta queda a 208V a tierra.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Valores rectos vs. con barra</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La marca decide dónde puede ir.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 240.83, 240.85</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="30" y="190" width="840" height="400" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="70" y="250" width="240" height="280" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="190" y="355" font-size="44" font-weight="800" fill="#1a2f61" text-anchor="middle">240V</text><text x="190" y="420" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">RECTO</text><text x="190" y="464" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">VALOR NOMINAL</text><text x="350" y="300" font-size="44" font-weight="800" fill="#2e7d32" text-anchor="start">✓</text><text x="410" y="300" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="start">Bien en la fase alta</text><text x="410" y="385" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Ningún par sobre 240V:</text><text x="410" y="431" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">es la única prueba.</text><text x="410" y="477" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">208V a tierra está bien.</text><rect x="30" y="640" width="840" height="400" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><rect x="70" y="700" width="240" height="280" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><line x1="70" y1="700" x2="310" y2="980" stroke="#c0392b" stroke-width="5"/><line x1="310" y1="700" x2="70" y2="980" stroke="#c0392b" stroke-width="5"/><text x="190" y="805" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">120/240V</text><text x="190" y="870" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">BARRA</text><text x="190" y="914" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">VALOR NOMINAL</text><text x="350" y="750" font-size="44" font-weight="800" fill="#c0392b" text-anchor="start">✗</text><text x="410" y="750" font-size="40" font-weight="800" fill="#c0392b" text-anchor="start">NO en la fase alta</text><text x="410" y="835" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Fase alta: 208V a tierra —</text><text x="410" y="881" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">sobre el inferior de 120V</text><text x="410" y="927" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">número del valor nominal.</text><rect x="30" y="1090" width="840" height="200" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="55" y="1148" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">TAMBIÉN EN LA ETIQUETA</text><text x="55" y="1198" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">SWD — conmuta alumbrado fluorescente / HID</text><text x="55" y="1238" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">HACR — equipo de calefacción, A/C, refrigeración</text><text x="55" y="1278" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Valor de interrupción: marcado cuando no es 5,000A</text></svg>