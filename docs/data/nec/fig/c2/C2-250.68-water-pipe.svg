<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Water pipe connection: the first 5 ft</title><desc id="d">Elevation of a metal water pipe entering a building through a wall. A gold band marks the first 5 ft inside the entry point with a grounding clamp inside the band marked OK, and a second clamp beyond 5 ft marked bonding only. Below, two panels compare an irreversible GEC splice with a split bolt buried in a wall.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Water pipe connection: the first 5 ft</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The electrode path is the first 5 ft inside</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.68, 250.64(C), 250.104</text><rect x="0" y="520" width="110" height="380" rx="0" fill="url(#earth)" stroke="none" stroke-width="0"/><text x="55" y="950" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">EARTH</text><rect x="110" y="280" width="55" height="620" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="4"/><text x="137" y="250" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">WALL</text><rect x="165" y="330" width="340" height="520" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="10 7"/><rect x="10" y="575" width="860" height="30" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="712" y="545" font-size="34" font-weight="600" fill="#5b6478" text-anchor="middle">metal water pipe</text><line x1="165" y1="380" x2="505" y2="380" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="335.0" y="368" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">5 ft from entry</text><text x="335.0" y="368" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">5 ft from entry</text><rect x="285" y="560" width="52" height="60" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="3"/><path d="M311,560 L311,300 L700,300" stroke="#2e7d32" stroke-width="5" fill="none"/><text x="700" y="285" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="middle">GEC to the</text><text x="700" y="327" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="middle">electrode system</text><rect x="240" y="466" width="296" height="50" rx="25" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="388.0" y="502" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">CLAMP HERE — OK</text><rect x="680" y="560" width="52" height="60" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><line x1="680" y1="560" x2="732" y2="620" stroke="#c0392b" stroke-width="4"/><line x1="680" y1="620" x2="732" y2="560" stroke="#c0392b" stroke-width="4"/><text x="640" y="895" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">past 5 ft: bonding only,</text><text x="640" y="937" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">not the electrode connection</text><rect x="40" y="1010" width="400" height="250" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="64" y="1075" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">SPLICE — OK</text><text x="64" y="1128" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Irreversible</text><text x="64" y="1167" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">compression or</text><text x="64" y="1206" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">exothermic weld</text><text x="64" y="1245" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">(250.64(C))</text><rect x="460" y="1010" width="400" height="250" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="484" y="1075" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">SPLICE — NOT OK</text><text x="484" y="1128" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Split bolt in a wall:</text><text x="484" y="1167" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">mechanical, hidden,</text><text x="484" y="1206" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">not an allowed splice</text><text x="450" y="1330" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Accessible, on clean metal, with listed clamps.</text></svg>