<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">200.6 Marcado del conductor a tierra</title><desc id="d">A 6 AWG o menor un conductor con aislamiento blanco pasa y un conductor negro con cinta falla; mayor que 6 AWG un conductor de alimentador negro con cinta blanca rodeándolo en las terminaciones pasa; una escala de tamaños marca el corte en 6 AWG.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">200.6 Marcado del conductor a tierra</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El método cambia con el tamaño del conductor</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 200.6(A), 200.6(B)</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><text x="30" y="214" font-size="34" font-weight="900" fill="#264387" text-anchor="start">6 AWG O MENOR — SOLO ACABADO DE FÁBRICA</text><rect x="60" y="260" width="780" height="54" rx="27" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="60" y="362" font-size="33" font-weight="800" fill="#2e7d32" text-anchor="start">✔ aislamiento blanco o gris — todo el tramo</text><rect x="60" y="420" width="780" height="54" rx="27" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><rect x="96" y="420" width="36" height="54" rx="0" fill="#ffffff" stroke="#264387" stroke-width="2"/><rect x="708" y="420" width="36" height="54" rx="0" fill="#ffffff" stroke="#264387" stroke-width="2"/><text x="60" y="522" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">✘ conductor negro + cinta en los extremos</text><text x="30" y="640" font-size="34" font-weight="900" fill="#264387" text-anchor="start">MAYOR QUE 6 AWG — MARCA DE TERMINACIÓN</text><rect x="60" y="700" width="780" height="64" rx="32" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><rect x="100" y="692" width="44" height="80" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="716" y="692" width="44" height="80" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="60" y="830" font-size="33" font-weight="800" fill="#2e7d32" text-anchor="start">✔ la marca blanco/gris rodea el conductor</text><text x="60" y="875" font-size="33" font-weight="800" fill="#2e7d32" text-anchor="start">en sus terminaciones, aplicado en la instalación</text><text x="30" y="990" font-size="34" font-weight="900" fill="#264387" text-anchor="start">EL PUNTO DE CORTE</text><line x1="80" y1="1090" x2="820" y2="1090" stroke="#1a2f61" stroke-width="3"/><line x1="110" y1="1078" x2="110" y2="1102" stroke="#1a2f61" stroke-width="3"/><text x="110" y="1062" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">12</text><line x1="210" y1="1078" x2="210" y2="1102" stroke="#1a2f61" stroke-width="3"/><text x="210" y="1062" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">10</text><line x1="310" y1="1078" x2="310" y2="1102" stroke="#1a2f61" stroke-width="3"/><text x="310" y="1062" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">8</text><line x1="410" y1="1078" x2="410" y2="1102" stroke="#1a2f61" stroke-width="3"/><text x="410" y="1062" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">6</text><line x1="510" y1="1078" x2="510" y2="1102" stroke="#1a2f61" stroke-width="3"/><text x="510" y="1062" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">4</text><line x1="610" y1="1078" x2="610" y2="1102" stroke="#1a2f61" stroke-width="3"/><text x="610" y="1062" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">2</text><line x1="710" y1="1078" x2="710" y2="1102" stroke="#1a2f61" stroke-width="3"/><text x="710" y="1062" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">1/0</text><text x="802" y="1062" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">AWG</text><line x1="460" y1="1010" x2="460" y2="1170" stroke="#c0392b" stroke-width="4"/><text x="255" y="1225" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">solo acabado de fábrica</text><text x="640" y="1225" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">marca de terminación OK</text><text x="460" y="1270" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">▲ el punto de corte es 6 AWG</text></svg>