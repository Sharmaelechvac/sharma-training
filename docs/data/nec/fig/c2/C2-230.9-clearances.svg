<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">230.9 Clearances at the building</title><desc id="d">Elevation of a house wall with a window that opens and a deck platform. The service drop passes above the window with a 3 ft minimum dimension, a dashed red conductor passes too close to the window, and a 10 ft vertical dimension rises from the deck platform to the conductor.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">230.9 Clearances at the building</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">One drop, two clearances. Drawing not to scale.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 230.9 · vertical clearances: 230.24</text><rect x="40" y="215" width="300" height="985" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><line x1="15" y1="215" x2="365" y2="215" stroke="#1f2937" stroke-width="6"/><rect x="90" y="460" width="180" height="230" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="180" y1="460" x2="180" y2="690" stroke="#264387" stroke-width="3"/><line x1="90" y1="575" x2="270" y2="575" stroke="#264387" stroke-width="3"/><text x="190" y="735" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">window that opens</text><line x1="838" y1="170" x2="838" y2="1200" stroke="#1f2937" stroke-width="6"/><line x1="790" y1="205" x2="886" y2="205" stroke="#1f2937" stroke-width="5"/><path d="M838,215 Q560,490 300,545" stroke="#c0392b" stroke-width="4" fill="none" stroke-dasharray="12 9"/><text x="420" y="595" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">too close — violation</text><path d="M838,215 Q600,320 345,355" stroke="#1f2937" stroke-width="5" fill="none"/><rect x="330" y="340" width="24" height="50" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="350" y1="305" x2="482" y2="305" stroke="#1a2f61" stroke-width="2"/><line x1="350" y1="460" x2="482" y2="460" stroke="#1a2f61" stroke-width="2"/><line x1="470" y1="305" x2="470" y2="460" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="484" y="395.1" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">3 ft min</text><text x="484" y="395.1" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">3 ft min</text><rect x="340" y="1064" width="360" height="16" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="400" y1="1080" x2="400" y2="1200" stroke="#264387" stroke-width="4"/><line x1="640" y1="1080" x2="640" y2="1200" stroke="#264387" stroke-width="4"/><text x="520" y="1040" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">deck platform</text><line x1="700" y1="232" x2="737" y2="232" stroke="#1a2f61" stroke-width="2"/><line x1="700" y1="1064" x2="737" y2="1064" stroke="#1a2f61" stroke-width="2"/><line x1="725" y1="232" x2="725" y2="1064" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="711" y="659.9" font-size="34" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft min</text><text x="711" y="659.9" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">10 ft min</text><line x1="0" y1="1200" x2="900" y2="1200" stroke="#1f2937" stroke-width="5"/><text x="30" y="1250" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">Beneath openings used to move materials:</text><text x="30" y="1288" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">not permitted — 230.9(C)</text></svg>