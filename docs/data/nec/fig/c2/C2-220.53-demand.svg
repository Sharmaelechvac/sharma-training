<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">220.53 The 75 percent demand</title><desc id="d">Four appliance nameplates add to 7,600 VA, take the 75 percent demand factor, and land as 5,700 VA in the service total.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">220.53 The 75 percent demand</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Four fixed appliances, standard method, NEC 2020</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 220.53</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="200" width="780" height="96" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="260" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Dishwasher</text><text x="810" y="260" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="end">1,200 VA</text><rect x="60" y="314" width="780" height="96" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="374" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Disposal</text><text x="810" y="374" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="end">900 VA</text><rect x="60" y="428" width="780" height="96" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="488" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Water heater</text><text x="810" y="488" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="end">4,500 VA</text><rect x="60" y="542" width="780" height="96" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="602" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">Trash compactor</text><text x="810" y="602" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="end">1,000 VA</text><rect x="60" y="672" width="780" height="80" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="726" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">Nameplate total: 7,600 VA</text><line x1="450" y1="756" x2="450" y2="788" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="792" width="780" height="80" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="846" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">× 75 percent demand factor</text><line x1="450" y1="876" x2="450" y2="908" stroke="#