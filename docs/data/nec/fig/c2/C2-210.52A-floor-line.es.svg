<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.52(A) Mida por la línea del piso</title><desc id="d">Un tramo de pared desenrollado de 34 ft con una puerta a 21 a 24 ft. Los receptáculos están a 6, 18, 27 y 33 ft. Las cotas muestran 6 ft máximo desde el inicio hasta el primer receptáculo, 12 ft máximo entre receptáculos, el conteo reiniciando en la jamba de la puerta, y una pieza de pared de 2 ft junto al clóset que aún cuenta como espacio de pared.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.52(A) Mida por la línea del piso</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un tramo desenrollado de 34 ft, con una puerta</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.52(A)(1)–(3)</text><text x="870" y="1360" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de campo Sharma</text><rect x="60.0" y="300" width="481.7647058823529" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="610.5882352941177" y="300" width="229.41176470588232" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="840.0" y1="300" x2="840.0" y2="420" stroke="#264387" stroke-width="5"/><text x="834.0" y="276" font-size="32" font-weight="600" fill="#5b6478" text-anchor="end">esquina: el tramo continúa</text><text x="576.1764705882354" y="464" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">PUERTA</text><rect x="180.64705882352942" y="330" width="34" height="60" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="190.64705882352942" y1="348" x2="190.64705882352942" y2="372" stroke="#ffffff" stroke-width="4"/><line x1="204.64705882352942" y1="348" x2="204.64705882352942" y2="372" stroke="#ffffff" stroke-width="4"/><rect x="455.94117647058823" y="330" width="34" height="60" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="465.94117647058823" y1="348" x2="465.94117647058823" y2="372" stroke="#ffffff" stroke-width="4"/><line x1="479.94117647058823" y1="348" x2="479.94117647058823" y2="372" stroke="#ffffff" stroke-width="4"/><rect x="662.4117647058823" y="330" width="34" height="60" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="672.4117647058823" y1="348" x2="672.4117647058823" y2="372" stroke="#ffffff" stroke-width="4"/><line x1="686.4117647058823" y1="348" x2="686.4117647058823" y2="372" stroke="#ffffff" stroke-width="4"/><rect x="800.0588235294117" y="330" width="34" height="60" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="810.0588235294117" y1="348" x2="810.0588235294117" y2="372" stroke="#ffffff" stroke-width="4"/><line x1="824.0588235294117" y1="348" x2="824.0588235294117" y2="372" stroke="#ffffff" stroke-width="4"/><line x1="60.0" y1="420" x2="60.0" y2="572" stroke="#1a2f61" stroke-width="2"/><line x1="197.64705882352942" y1="420" x2="197.64705882352942" y2="572" stroke="#1a2f61" stroke-width="2"/><line x1="60.0" y1="560" x2="197.64705882352942" y2="560" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="128.8235294117647" y="548" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft max</text><text x="128.8235294117647" y="548" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft max</text><line x1="197.64705882352942" y1="420" x2="197.64705882352942" y2="572" stroke="#1a2f61" stroke-width="2"/><line x1="472.94117647058823" y1="420" x2="472.94117647058823" y2="572" stroke="#1a2f61" stroke-width="2"/><line x1="197.64705882352942" y1="560" x2="472.94117647058823" y2="560" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="335.29411764705884" y="548" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 ft max</text><text x="335.29411764705884" y="548" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">12 ft max</text><line x1="610.5882352941177" y1="420" x2="610.5882352941177" y2="702" stroke="#1a2f61" stroke-width="2"/><line x1="679.4117647058823" y1="420" x2="679.4117647058823" y2="702" stroke="#1a2f61" stroke-width="2"/><line x1="610.5882352941177" y1="690" x2="679.4117647058823" y2="690" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="645.0" y="678" font-size="36" fon