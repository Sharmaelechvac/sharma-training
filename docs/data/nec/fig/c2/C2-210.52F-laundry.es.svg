<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.52(F) El receptáculo de lavandería</title><desc id="d">Plano de una lavandería con lavadora y secadora, el receptáculo requerido detrás de la lavadora dentro de 6 ft, un diagrama unifilar del circuito dedicado de lavandería de 20 A, y un receptáculo de pasillo marcado como que no cuenta.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.52(F) El receptáculo de lavandería</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta — lavandería junto al garaje</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.52(F), 210.11(C)(2), 210.50(C)</text><text x="30" y="214" font-size="34" font-weight="900" fill="#264387" text-anchor="start">PLANTA</text><rect x="60" y="240" width="540" height="400" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="6"/><rect x="90" y="270" width="200" height="180" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="190" y="368" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LAVADORA</text><rect x="320" y="270" width="200" height="180" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="420" y="368" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SECADORA</text><circle cx="190" cy="240" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="183" y1="234" x2="183" y2="246" stroke="#1a2f61" stroke-width="3"/><line x1="197" y1="234" x2="197" y2="246" stroke="#1a2f61" stroke-width="3"/><circle cx="420" cy="240" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="4"/><line x1="413" y1="234" x2="413" y2="246" stroke="#1f2937" stroke-width="3"/><line x1="427" y1="234" x2="427" y2="246" stroke="#1f2937" stroke-width="3"/><rect x="480" y="634" width="80" height="12" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><path d="M480,640 A80,80 0 0 0 560,560" stroke="#1a2f61" stroke-width="3" fill="none" stroke-dasharray="8 6"/><line x1="560" y1="640" x2="560" y2="560" stroke="#1a2f61" stroke-width="4"/><line x1="190" y1="470" x2="190" y2="602" stroke="#1a2f61" stroke-width="2"/><line x1="484" y1="470" x2="484" y2="602" stroke="#1a2f61" stroke-width="2"/><line x1="190" y1="590" x2="484" y2="590" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="337.0" y="578" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 6 ft al artefacto</text><text x="337.0" y="578" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 6 ft al artefacto</text><circle cx="660" cy="560" r="17" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><line x1="653" y1="554" x2="653" y2="566" stroke="#c0392b" stroke-width="3"/><line x1="667" y1="554" x2="667" y2="566" stroke="#c0392b" stroke-width="3"/><text x="660" y="622" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">receptáculo de pasillo ✗</text><text x="660" y="658" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">cuarto y circuito equivocados</text><text x="60" y="706" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Receptáculo detrás de la lavadora;</text><text x="60" y="742" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">salida de secadora junto a él.</text><text x="30" y="800" font-size="34" font-weight="900" fill="#264387" text-anchor="start">EL CIRCUITO — 210.11(C)(2)</text><rect x="60" y="840" width="260" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="190" y="888" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="190" y="928" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">interruptor de 20 A</text><line x1="320" y1="895" x2="460" y2="895" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="460" y="840" width="400" height="110" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="660" y="888" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Receptáculos de lavandería</text><text x="660" y="928" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">SOLO — sin otras salidas</text><line x1="190" y1="950" x2="190" y2="1030" stroke="#c0392b" stroke-width="3"/><line x1="190" y1="1030" x2="460" y2="1030" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="975" width="340" height="110" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="630" y="1022" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">✗ pasillo, garaje</text><text x="630" y="1062" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">o salidas exteriores</text><text x="30" y="1180" font-size="34" font-weight="900" fill="#264387" text-anchor="start">TAMBIÉN EN LA LAVANDERÍA</text><text x="40" y="1235" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• GFCI — las lavanderías están listadas (210.8(A))</text><text x="40" y="1280" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• AFCI — las lavanderías están listadas (210.12(A))</text><text x="40" y="1325" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• S-07: un interruptor de doble función cubre ambos</text></svg>