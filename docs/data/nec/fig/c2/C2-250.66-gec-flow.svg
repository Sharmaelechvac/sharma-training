<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" width="900" height="1260" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">250.66 Table first, then the cap</title><desc id="d">Flowchart for sizing the grounding electrode conductor: start from the largest service-entrance conductor, read Table 250.66, then apply the cap for the electrode: 6 AWG copper for rods, 4 AWG for a concrete-encased electrode, ring size for a ground ring.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1260" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">250.66 Table first, then the cap</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">GEC size follows the service conductors</text><line x1="30" y1="1202" x2="870" y2="1202" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1240" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Table 250.66; 250.66(A)–(C)</text><rect x="90" y="190" width="720" height="120" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="248" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">STEP 1 — LARGEST SERVICE CONDUCTOR</text><text x="450" y="292" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">not the breaker size</text><line x1="450" y1="310" x2="450" y2="360" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="365" width="720" height="185" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="420" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">STEP 2 — READ TABLE 250.66</text><text x="450" y="478" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">4 AWG Cu service → 8 AWG Cu GEC</text><text x="450" y="524" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">2/0 Cu service → 4 AWG Cu GEC</text><line x1="450" y1="550" x2="450" y2="600" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="605" width="720" height="105" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="672" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">STEP 3 — CAP IT FOR THE ELECTRODE</text><rect x="40" y="760" width="263" height="215" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="171" y="812" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">ROD · PIPE</text><text x="171" y="849" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">PLATE</text><text x="171" y="905" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">6 AWG Cu</text><text x="171" y="950" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">max — (A)</text><rect x="323" y="760" width="263" height="215" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="454" y="812" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">CONCRETE-</text><text x="454" y="849" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">ENCASED</text><text x="454" y="905" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">4 AWG Cu</text><text x="454" y="950" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">max — (B)</text><rect x="606" y="760" width="263" height="215" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="737" y="812" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">GROUND</text><text x="737" y="849" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">RING</text><text x="737" y="905" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">ring size</text><text x="737" y="950" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">max — (C)</text><text x="450" y="1060" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">No cap on a metal water pipe — full table size</text><text x="450" y="1115" font-size="34" font-weight="600" fill="#5b6478" text-anchor="middle">One run for the whole system: the table governs</text></svg>