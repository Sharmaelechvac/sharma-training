<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">What counts as the EGC</title><desc id="d">Four panels: a wire-type equipment grounding conductor, EMT as the path, Type AC armor with bonding strip, and flexible conduit within its 6 ft limit.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">What counts as the EGC</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Four recognized ground paths.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 250.118</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="190" width="405" height="570" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="50" y="242" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">1 · WIRE-TYPE EGC</text><rect x="55" y="300" width="355" height="90" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="70" y1="322" x2="395" y2="322" stroke="#1f2937" stroke-width="5"/><line x1="70" y1="348" x2="395" y2="348" stroke="#1f2937" stroke-width="5"/><line x1="70" y1="374" x2="395" y2="374" stroke="#2e7d32" stroke-width="7"/><text x="55" y="440" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="start">GREEN = THE EGC</text><text x="50" y="640" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Run with the circuit</text><text x="50" y="682" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">conductors. Copper,</text><text x="50" y="724" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">aluminum or CCA.</text><rect x="465" y="190" width="405" height="570" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="485" y="242" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">2 · EMT / RMC / IMC</text><rect x="490" y="300" width="355" height="70" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="638" y="288" width="58" height="94" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="667" cy="312" r="6" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="667" cy="358" r="6" fill="#264387" stroke="#264387" stroke-width="0"/><text x="490" y="440" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">COUPLING: LISTED + TIGHT</text><text x="485" y="640" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">The raceway is the</text><text x="485" y="682" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">path. Fittings listed,</text><text x="485" y="724" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">made up tight.</text><rect x="30" y="800" width="405" height="570" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="50" y="852" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">3 · TYPE AC ARMOR</text><rect x="55" y="910" width="355" height="64" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="75" y1="910" x2="89" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="107" y1="910" x2="121" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="139" y1="910" x2="153" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="171" y1="910" x2="185" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="203" y1="910" x2="217" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="235" y1="910" x2="249" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="267" y1="910" x2="281" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="299" y1="910" x2="313" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="331" y1="910" x2="345" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="363" y1="910" x2="377" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="395" y1="910" x2="409" y2="974" stroke="#c9d2e3" stroke-width="4"/><line x1="70" y1="942" x2="395" y2="942" stroke="#F0A846" stroke-width="6"/><text x="55" y="1050" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">GOLD = BONDING STRIP</text><text x="50" y="1250" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Armor plus its</text><text x="50" y="1292" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">internal bonding strip</text><text x="50" y="1334" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">carries the fault.</text><rect x="465" y="800" width="405" height="570" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="485" y="852" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">4 · FLEX (FMC / LFMC)</text><path d="M500 940 C 560 900, 620 990, 690 945" stroke="#1f2937" stroke-width="5" fill="none"/><path d="M500 962 C 560 922, 620 1012, 690 967" stroke="#2e7d32" stroke-width="5" fill="none"/><line x1="520" y1="918" x2="530" y2="968" stroke="#c9d2e3" stroke-width="4"/><line x1="550" y1="926" x2="560" y2="976" stroke="#c9d2e3" stroke-width="4"/><line x1="580" y1="918" x2="590" y2="968" stroke="#c9d2e3" stroke-width="4"/><line x1="610" y1="926" x2="620" y2="976" stroke="#c9d2e3" stroke-width="4"/><line x1="640" y1="918" x2="650" y2="968" stroke="#c9d2e3" stroke-width="4"/><line x1="670" y1="926" x2="680" y2="976" stroke="#c9d2e3" stroke-width="4"/><rect x="690" y="895" width="140" height="115" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="760" y="945" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">MOTOR</text><text x="760" y="985" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">BOX</text><rect x="490" y="1058" width="313" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="646.5" y="1092" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">6 FT MAX COMBINED</text><text x="485" y="1250" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Counts only within its</text><text x="485" y="1292" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">limits. Past them, pull</text><text x="485" y="1334" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">a wire-type EGC.</text></svg>