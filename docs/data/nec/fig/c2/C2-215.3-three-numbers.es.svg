<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" width="900" height="1450" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">215.3 Proteja los conductores</title><desc id="d">Diagrama de flujo para protección de alimentadores: primero la ampacidad del conductor, el dispositivo de sobrecorriente no sobre esa ampacidad, luego la verificación de carga continua del 125 por ciento, con un ejemplo resuelto que aterriza en 70 A.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1450" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">215.3 Proteja los conductores</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El interruptor responde primero al conductor.</text><line x1="30" y1="1392" x2="870" y2="1392" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1430" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 215.3; Parte I del Artículo 240</text><rect x="130" y="210" width="640" height="120" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="258" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">PASO 1 — Conductores de alimentador</text><text x="450" y="302" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Empiece con su ampacidad</text><line x1="450" y1="330" x2="450" y2="386" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="130" y="400" width="640" height="120" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="448" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">PASO 2 — Fije el OCPD</text><text x="450" y="492" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Sin superar esa ampacidad</text><line x1="450" y1="520" x2="450" y2="576" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="130" y="590" width="640" height="120" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="638" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Solo los permisos del Artículo 240:</text><text x="450" y="682" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">tamaño siguiente, reglas de derivación</text><line x1="450" y1="710" x2="450" y2="766" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="130" y="780" width="640" height="120" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="828" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">PASO 3 — Cargas continuas</text><text x="450" y="872" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">No continuo + 125% del continuo</text><rect x="130" y="960" width="640" height="150" rx="12" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="450" y="1010" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">COMPROBACIÓN RESUELTA</text><text x="450" y="1058" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">20 A no continuo + 40 A continuo</text><text x="450" y="1100" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">= 20 + 50 → OCPD mínimo de 70 A</text><rect x="130" y="1160" width="640" height="130" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1214" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">Dimensionar al bus es la trampa.</text><text x="450" y="1258" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Los conductores fijan el límite.</text></svg>