<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1290" width="900" height="1290" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">240.4 Picking the breaker</title><desc id="d">Four-step flow chart for choosing overcurrent protection: conductor ampacity first, then the equipment article or nameplate, then the small-conductor caps, then matching the breaker to the ampacity with the limited next-size-up allowance.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1290" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">240.4 Picking the breaker</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Start at the conductor. The breaker follows it.</text><line x1="30" y1="1232" x2="870" y2="1232" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1270" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 240.4, 240.4(B)–(D), Table 310.16</text><rect x="70" y="200" width="760" height="118" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="100" y="252" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">STEP 1 — Conductor ampacity</text><text x="100" y="298" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Table 310.16, after correction and adjustment</text><line x1="450" y1="318" x2="450" y2="356" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="70" y="356" width="760" height="158" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="100" y="408" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">STEP 2 — Equipment or nameplate?</text><text x="100" y="454" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Motors, AC, welders, transformers: their rule</text><text x="100" y="496" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">sets the protection. It wins over this page.</text><line x1="450" y1="514" x2="450" y2="552" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="70" y="552" width="760" height="158" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="100" y="604" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">STEP 3 — Small conductors</text><text x="100" y="650" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">14, 12 or 10 AWG: the caps of 240.4(D) set</text><text x="100" y="692" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">the breaker, whatever the table says.</text><line x1="450" y1="710" x2="450" y2="748" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="70" y="748" width="760" height="158" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="100" y="800" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">STEP 4 — Match the ampacity</text><text x="100" y="846" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Between standard sizes: next size up only</text><text x="100" y="888" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">under 240.4(B), and never past 800 A.</text><rect x="70" y="956" width="760" height="160" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="100" y="1008" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">OVER 800 A — NO ROUNDING UP</text><text x="100" y="1054" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">The ampacity must at least equal</text><text x="100" y="1096" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">the device rating (240.4(C)).</text></svg>