<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">210.70 Nunca cruce una escalera oscura</title><desc id="d">Vista en sección de una escalera con un interruptor de pared en el descanso inferior y un interruptor de pared en el descanso superior, una luz sobre la escalera controlada desde ambos, y las cajas de interruptores dimensionadas 48 pulgadas al centro sobre el piso del descanso según la regla Sharma S-05.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">210.70 Nunca cruce una escalera oscura</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Escalera: un interruptor en cada descanso.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.70(A)(2); Sharma S-05</text><line x1="40" y1="1010" x2="430" y2="1010" stroke="#1f2937" stroke-width="6"/><line x1="560" y1="590" x2="860" y2="590" stroke="#1f2937" stroke-width="6"/><path d="M 400 1010 L 427 1010 L 427 940 L 454 940 L 454 870 L 481 870 L 481 800 L 508 800 L 508 730 L 535 730 L 535 660 L 562 660 L 562 590 L 560 590" stroke="#1f2937" stroke-width="5" fill="none"/><text x="165" y="986" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">DESCANSO INFERIOR</text><text x="850" y="566" font-size="32" font-weight="800" fill="#5b6478" text-anchor="end">DESCANSO SUPERIOR</text><circle cx="480" cy="300" r="34" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="480" y="313" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">L</text><line x1="448.1" y1="283.5" x2="422" y2="270" stroke="#F0A846" stroke-width="4"/><line x1="511.9" y1="283.5" x2="538" y2="270" stroke="#F0A846" stroke-width="4"/><line x1="480.0" y1="263.7" x2="480" y2="234" stroke="#F0A846" stroke-width="4"/><line x1="448.1" y1="316.5" x2="422" y2="330" stroke="#F0A846" stroke-width="4"/><line x1="511.9" y1="316.5" x2="538" y2="330" stroke="#F0A846" stroke-width="4"/><text x="480" y="220" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">luz sobre la escalera</text><text x="480" y="220" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">luz sobre la escalera</text><rect x="76" y="734" width="32" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><circle cx="92" cy="760" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="130" y="720" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">interruptor —</text><text x="130" y="760" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">descanso inferior</text><line x1="150" y1="760" x2="150" y2="1010" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="164" y="896.2" font-size="32" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">48 in al centro (S-05)</text><text x="164" y="896.2" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">48 in al centro (S-05)</text><rect x="784" y="314" width="32" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><circle cx="800" cy="340" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="762" y="300" font-size="32" font-weight="800" fill="#c0392b" text-anchor="end">interruptor —</text><text x="762" y="340" font-size="32" font-weight="800" fill="#c0392b" text-anchor="end">descanso superior</text><line x1="688" y1="340" x2="688" y2="590" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="674" y="476.2" font-size="32" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">48 in al centro (S-05)</text><text x="674" y="476.2" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">48 in al centro (S-05)</text><text x="40" y="1100" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Los interruptores de arriba y abajo controlan la</text><text x="40" y="1146" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">conmutación de tres vías, para que la escalera</text><text x="40" y="1192" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">se ilumine antes del escalón, de cualquier extremo.</text><text x="40" y="1260" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Mismo recorrido en la puerta principal, el pasillo y el</text><text x="40" y="1306" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">garaje: un interruptor donde usted entra, siempre.</text></svg>