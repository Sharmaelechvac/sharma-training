<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The fill method — 4 steps</title><desc id="d">Four-step flow strip for conduit fill worked with seven 12 AWG THHN conductors totaling 0.0931 square inches in 1/2 inch EMT, plus the CCA upsize case.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The fill method — 4 steps</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked: three 20 A circuits in one EMT</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Ch. 9 Tables 1, 4, 5</text><rect x="40" y="210" width="820" height="250" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="294" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">1 · LIST every conductor</text><text x="70" y="362" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">6× 12 AWG THHN circuit conductors</text><text x="70" y="414" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">+ 1× 12 AWG THHN ground = 7 total</text><line x1="450" y1="460" x2="450" y2="490" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="490" width="820" height="250" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="574" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">2 · ADD the areas — Table 5</text><text x="70" y="642" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">7 × 0.0133 sq in each</text><text x="70" y="694" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">= 0.0931 sq in total</text><line x1="450" y1="740" x2="450" y2="770" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="770" width="820" height="250" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="854" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">3 · PICK the percent — Table 1</text><text x="70" y="922" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">7 conductors → 40%</text><text x="70" y="974" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">(1: 53% · 2: 31% · nipple: 60%)</text><line x1="450" y1="1020" x2="450" y2="1050" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="1050" width="820" height="250" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="1134" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">4 · COMPARE — Table 4</text><text x="70" y="1202" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">1/2 in EMT allows 0.122 sq in</text><text x="70" y="1254" font-size="33" font-weight="900" fill="#2e7d32" text-anchor="start">0.0931 ≤ 0.122 — FITS</text><rect x="40" y="1340" width="820" height="210" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="64" y="1402" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">CCA one size up (S-10)?</text><text x="64" y="1456" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">7 × 0.0211 = 0.1477 sq in — over 0.122,</text><text x="64" y="1508" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">so the raceway goes to 3/4 in EMT (0.213).</text></svg>