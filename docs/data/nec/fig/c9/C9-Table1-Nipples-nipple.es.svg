<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1330" width="900" height="1330" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">El niple del 60 por ciento</title><desc id="d">Vista de dos gabinetes de tablero unidos por un niple de canalización dimensionado a 24 pulgadas máximo, ocupado al 60 por ciento; el tramo largo que sale del segundo tablero sigue limitado a los porcentajes de la Tabla 1.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1330" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">El niple del 60 por ciento</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tramo corto entre gabinetes — EMT de 1/2 in</text><line x1="30" y1="1272" x2="870" y2="1272" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Cap. 9, Tabla 1 Nota 4; Tabla 4</text><rect x="60" y="300" width="200" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="160" y="462" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><rect x="620" y="300" width="190" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="715" y="462" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><rect x="260" y="415" width="360" height="70" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="440" y="360" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">NIPLE</text><line x1="260" y1="490" x2="260" y2="572" stroke="#1a2f61" stroke-width="2"/><line x1="620" y1="490" x2="620" y2="572" stroke="#1a2f61" stroke-width="2"/><line x1="260" y1="560" x2="620" y2="560" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="440.0" y="548" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">24 in máx.</text><text x="440.0" y="548" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">24 in máx.</text><rect x="810" y="415" width="60" height="70" rx="0" fill="white" stroke="#264387" stroke-width="4"/><text x="856" y="360" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">tramo</text><rect x="227.0" y="664" width="446" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="702" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">60% de ocupación — 0.182 sq in</text><text x="450" y="790" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Los tramos largos quedan en 53 / 31 / 40%</text><rect x="40" y="850" width="820" height="110" rx="0" fill="white" stroke="#264387" stroke-width="3"/><text x="450" y="918" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">0.182 ÷ 0.0133 = 13.68  →  13 × 12 AWG THHN</text><rect x="40" y="990" width="820" height="110" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1038" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="middle">Nota 4: sin factores de ajuste 310.15(C)(1)</text><text x="450" y="1077" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="middle">para conductores en un niple de 24 in o menos</text></svg>