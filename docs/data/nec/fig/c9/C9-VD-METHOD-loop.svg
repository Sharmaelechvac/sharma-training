<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Voltage drop The loop out and back</title><desc id="d">A single-phase circuit drawn as a loop from panel to load and back, with the one-way length dimensioned, the round-trip factor marked, and the formula VD equals 2 times L times R times I divided by 1000 worked for the case shown.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Voltage drop The loop out and back</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">120V · 12A load · 100 ft one way · 12 AWG</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Ch. 9, Table 8; 210.19(A) Informational Note</text><line x1="155" y1="238" x2="745" y2="238" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="226" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">L = 100 ft, one way</text><text x="450.0" y="226" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">L = 100 ft, one way</text><rect x="50" y="300" width="210" height="150" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="155" y="362" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">PANEL</text><text x="155" y="412" font-size="34" font-weight="900" fill="#F0A846" text-anchor="middle">120V</text><rect x="640" y="300" width="210" height="150" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="745" y="362" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">LOAD</text><text x="745" y="412" font-size="34" font-weight="900" fill="#F0A846" text-anchor="middle">12 A</text><line x1="260" y1="330" x2="640" y2="330" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="312" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">OUT</text><line x1="640" y1="420" x2="260" y2="420" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="478" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">BACK — the same 100 ft again (that is the 2)</text><rect x="40" y="540" width="820" height="168" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="612" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle">VD = 2 × L × R × I ÷ 1000</text><text x="450" y="668" font-size="33" font-weight="800" fill="#F0A846" text-anchor="middle">R = 1.98 ohms/1000 ft — 12 AWG Cu, Table 8</text><rect x="40" y="748" width="820" height="150" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="806" font-size="35" font-weight="900" fill="#1a2f61" text-anchor="start">12 AWG: 2 × 100 × 1.98 × 12 ÷ 1000 = 4.75V</text><text x="64" y="856" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">= 3.96% of 120V — over the 3% recommendation</text><rect x="40" y="924" width="820" height="150" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="64" y="982" font-size="35" font-weight="900" fill="#1a2f61" text-anchor="start">10 AWG (R = 1.24): drop is 2.98V = 2.48%</text><text x="64" y="1032" font-size="33" font-weight="800" fill="#2e7d32" text-anchor="start">Same run, same load — only the wire changed</text></svg>