<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1620" width="900" height="1620" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">La Tabla 8 no tiene columna CCA</title><desc id="d">La Tabla 8 impresa, con las columnas de cobre y aluminio marcadas como listadas y una tercera columna punteada para el aluminio revestido de cobre marcada como no listada, bajo una franja roja de sin verificar. Abajo, los tres pasos que necesita un valor de caída de tensión CCA: datos del fabricante a 75 grados C, la fuente escrita en el cálculo y luego la fórmula. No aparece ningún valor de resistencia en el dibujo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1620" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La Tabla 8 no tiene columna CCA</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Solo cobre y aluminio — el CCA no está listado</text><line x1="30" y1="1562" x2="870" y2="1562" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Cap. 9, Tabla 8 · Sharma S-10</text><rect x="40" y="190" width="820" height="84" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="246" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">SIN VERIFICAR — REVISE EL IMPRESO</text><rect x="40" y="330" width="260" height="300" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="40" y="330" width="260" height="76" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="170" y="382" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">COBRE</text><text x="170" y="470" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Sin recubrir</text><text x="170" y="514" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Recubierto</text><text x="170" y="590" font-size="32" font-weight="900" fill="#2e7d32" text-anchor="middle">EN LA TABLA 8</text><rect x="320" y="330" width="260" height="300" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="320" y="330" width="260" height="76" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="382" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">ALUMINIO</text><text x="450" y="470" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Listado en</text><text x="450" y="514" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">la Tabla 8</text><text x="450" y="590" font-size="32" font-weight="900" fill="#2e7d32" text-anchor="middle">EN LA TABLA 8</text><rect x="600" y="330" width="260" height="300" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><rect x="600" y="330" width="260" height="76" rx="12" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="730" y="382" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">CCA</text><text x="730" y="470" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Sin fila</text><text x="730" y="514" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Sin columna</text><text x="730" y="590" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">NO LISTADO</text><text x="40" y="716" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Un valor de caída de tensión CCA necesita:</text><rect x="40" y="750" width="820" height="168" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="92" cy="802" r="30" fill="#264387" stroke="#264387" stroke-width="0"/><text x="92" y="815" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><text x="140" y="814" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">DATOS DEL FABRICANTE</text><text x="140" y="862" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">La resistencia en CC del</text><text x="140" y="902" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">producto real, a 75 °C</text><line x1="450" y1="918" x2="450" y2="946" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="950" width="820" height="168" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="92" cy="1002" r="30" fill="#264387" stroke="#264387" stroke-width="0"/><text x="92" y="1015" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><text x="140" y="1014" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">FUENTE EN EL CÁLCULO</text><text x="140" y="1062" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Escriba de dónde salió</text><text x="140" y="1102" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">el valor</text><line x1="450" y1="1118" x2="450" y2="1146" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="1150" width="820" height="168" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="92" cy="1202" r="30" fill="#264387" stroke="#264387" stroke-width="0"/><text x="92" y="1215" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><text x="140" y="1214" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">LUEGO LA FÓRMULA</text><text x="140" y="1262" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Solo ahora calcule la caída</text><rect x="40" y="1334" width="820" height="130" rx="16" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1386" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">No tome prestada la columna de aluminio</text><text x="450" y="1430" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">ni la reporte como caída CCA.</text></svg>