<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Dos caminos, una respuesta</title><desc id="d">Dos métodos, uno sobre otro: dividir el área útil de la canalización entre el área de un conductor, y leer la cantidad en el Anexo C. Ambos llegan a nueve conductores. Un panel rojo muestra la tirada de calibres mixtos que el Anexo C no puede resolver.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Dos caminos, una respuesta</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Mismo calibre: 12 AWG THHN en EMT de 1/2 in</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Cap. 9, Tablas 1, 4, 5; Anexo C</text><rect x="40" y="210" width="820" height="310" rx="0" fill="white" stroke="#264387" stroke-width="3"/><text x="450" y="272" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CAMINO 1 — DIVIDA (Tablas 4 y 5)</text><text x="70" y="345" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Área útil: 0.122 sq in</text><text x="70" y="386" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Un conductor: 0.0133 sq in</text><text x="70" y="427" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">0.122 ÷ 0.0133 = 9.17 → 9 conductores</text><rect x="40" y="550" width="820" height="310" rx="0" fill="white" stroke="#264387" stroke-width="3"/><text x="450" y="612" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CAMINO 2 — BUSQUE EN EL ANEXO C</text><text x="70" y="685" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Busque la tabla de la canalización</text><text x="70" y="726" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">y el tipo de aislamiento</text><text x="70" y="767" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Lea la cantidad máxima: 9 conductores</text><rect x="40" y="890" width="820" height="130" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="942" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Los dos caminos deben coincidir.</text><text x="450" y="981" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Si no coinciden, un dato era distinto.</text><rect x="40" y="1050" width="820" height="250" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1112" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">AQUÍ NO HAY ATAJO</text><text x="450" y="1172" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Calibres mixtos, otro tipo de aislamiento,</text><text x="450" y="1211" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">o una tierra desnuda: el Anexo C no tiene fila.</text><text x="450" y="1250" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Sume las áreas y haga la división.</text></svg>