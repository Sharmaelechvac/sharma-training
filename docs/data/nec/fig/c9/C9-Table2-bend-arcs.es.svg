/text><circle cx="82" cy="1108" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="82" y="1119" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="116" y="1120" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">De un tiro / zapata completa: 9½ in mín.</text><circle cx="82" cy="1160" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="82" y="1171" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="116" y="1172" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Otras curvas (con calor): 12 in mín.</text><circle cx="82" cy="1212" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="82" y="1223" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="116" y="1224" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">El radio se mide al eje central</text></svg>