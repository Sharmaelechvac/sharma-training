<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Power-limited, in numbers</title><desc id="d">Two panels comparing inherently limited sources, which need no overcurrent protection, with sources that are not inherently limited and must be paired with overcurrent protection sized from the table, under a 100 volt-ampere nameplate ceiling.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1250" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Power-limited, in numbers</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tables 11(A) ac, 11(B) dc — check the source</text><line x1="30" y1="1192" x2="870" y2="1192" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1230" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Ch. 9, Tables 11(A) and 11(B); 725.121</text><rect x="40" y="210" width="390" height="400" rx="0" fill="white" stroke="#2e7d32" stroke-width="4"/><text x="235" y="262" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">INHERENTLY</text><text x="235" y="306" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">LIMITED</text><text x="70" y="380" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Construction holds the</text><text x="70" y="419" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">limits under any load</text><text x="70" y="458" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">or fault</text><text x="70" y="497" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="70" y="536" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">No overcurrent</text><text x="70" y="575" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">protection required</text><rect x="470" y="210" width="390" height="400" rx="0" fill="white" stroke="#264387" stroke-width="4"/><text x="665" y="262" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">NOT INHERENTLY</text><text x="665" y="306" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LIMITED</text><text x="500" y="380" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">The source alone can</text><text x="500" y="419" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">pass the limits</text><text x="500" y="458" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="500" y="497" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Source + overcurrent</text><text x="500" y="536" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">protection sized from</text><text x="500" y="575" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">the table holds them</text><rect x="40" y="650" width="820" height="100" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="714" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Nameplate max: 100 VA — Class 2 and Class 3</text><rect x="40" y="780" width="820" height="190" rx="0" fill="white" stroke="#264387" stroke-width="3"/><text x="70" y="845" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Class 2 over 30 V: current capped at 0.005 A</text><text x="70" y="886" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Class 2 at 20 V: up to 5.0 A on the nameplate</text><text x="70" y="927" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Higher voltage, lower current — read the row</text><rect x="40" y="1000" width="820" height="110" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1048" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">No table match, no Class 2 treatment —</text><text x="450" y="1087" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">the circuit is wired like power</text></svg>