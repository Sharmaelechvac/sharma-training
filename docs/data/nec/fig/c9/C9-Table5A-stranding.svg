<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Same AWG, two strandings</title><desc id="d">Two conductor cross-sections at the same AWG: standard concentric stranding with voids between round strands, and compact stranding with the strands compressed together into a smaller circle.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Same AWG, two strandings</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Schematic cross-sections — not to scale</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Ch. 9, Tables 5 and 5A</text><rect x="20" y="200" width="410" height="600" rx="0" fill="white" stroke="#264387" stroke-width="3"/><text x="225" y="258" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">STANDARD STRAND</text><text x="225" y="302" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">areas from Table 5</text><circle cx="225" cy="500" r="160" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="225" cy="500" r="50" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="325.0" cy="500.0" r="50" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="275.0" cy="586.6025403784439" r="50" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="175.00000000000003" cy="586.6025403784439" r="50" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="125.0" cy="500.0" r="50" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="174.99999999999994" cy="413.39745962155615" r="50" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="275.0" cy="413.39745962155615" r="50" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="225" y="730" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Round strands,</text><text x="225" y="770" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">voids between them</text><rect x="470" y="200" width="410" height="600" rx="0" fill="white" stroke="#264387" stroke-width="3"/><text x="675" y="258" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">COMPACT STRAND</text><text x="675" y="302" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">areas from Table 5A</text><circle cx="675" cy="500" r="145" fill="#fdf3e0" stroke="#264387" stroke-width="5"/><circle cx="675" cy="500" r="48" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="752.9422863405995" cy="545.0" r="48" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="675.0" cy="590.0" r="48" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="597.0577136594005" cy="545.0" r="48" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="597.0577136594005" cy="455.0" r="48" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="675.0" cy="410.0" r="48" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="752.9422863405995" cy="454.99999999999994" r="48" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="675" y="730" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Strands compressed,</text><text x="675" y="770" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">voids squeezed out</text><rect x="40" y="830" width="820" height="92" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="888" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Fill uses the conductor actually in the raceway</text><rect x="40" y="952" width="820" height="130" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1002" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Standard conductor figured from Table 5A:</text><text x="450" y="1041" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">understated area — an overfill and a violation</text></svg>