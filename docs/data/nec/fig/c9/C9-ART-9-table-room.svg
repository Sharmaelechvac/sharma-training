<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Chapter 9 Start here, in order</title><desc id="d">Four wide table cards stacked in the order a fill calculation uses them: Table 1 percent fill, Table 4 raceway area, Table 5 conductor area, Table 8 resistance for voltage drop. Below them, the chapter's other tables and a gold strip marking the annexes as informative only.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1600" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Chapter 9 Start here, in order</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Percent, raceway, conductor, resistance</text><line x1="30" y1="1542" x2="870" y2="1542" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1580" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Ch. 9, Tables 1, 4, 5, 8; 90.5(C)</text><rect x="40" y="210" width="820" height="148" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="40" y="210" width="205" height="148" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="231" y="210" width="14" height="148" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="142" y="300" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">Table 1</text><text x="275" y="274" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Percent fill</text><text x="275" y="324" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">53 · 31 · 40 — by conductor count</text><line x1="450" y1="358" x2="450" y2="400" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="40" y="400" width="820" height="148" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="40" y="400" width="205" height="148" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="231" y="400" width="14" height="148" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="142" y="490" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">Table 4</text><text x="275" y="464" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Raceway area</text><text x="275" y="514" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Inside area, by raceway type</text><line x1="450" y1="548" x2="450" y2="590" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="40" y="590" width="820" height="148" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="40" y="590" width="205" height="148" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="231" y="590" width="14" height="148" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="142" y="680" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">Table 5</text><text x="275" y="654" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Conductor area</text><text x="275" y="704" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">By size and insulation type</text><line x1="450" y1="738" x2="450" y2="780" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="40" y="780" width="820" height="148" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="40" y="780" width="205" height="148" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="231" y="780" width="14" height="148" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="142" y="870" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">Table 8</text><text x="275" y="844" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Resistance — ohms/1000 ft</text><text x="275" y="894" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">The voltage-drop input</text><rect x="40" y="990" width="820" height="216" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="64" y="1046" font-size="34" font-weight="800" fill="#5b6478" text-anchor="start">Also in the chapter:</text><text x="64" y="1096" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Table 2 — minimum bend radius</text><text x="64" y="1136" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Table 9 — AC resistance and reactance</text><text x="64" y="1176" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Tables 11(A)/(B) — Class 2 / 3 power</text><rect x="40" y="1246" width="820" height="270" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="64" y="1304" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">Annexes B · C · D · I — informative</text><text x="64" y="1360" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Worked examples and shortcuts.</text><text x="64" y="1401" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">They explain and illustrate —</text><text x="64" y="1442" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">they do not add requirements.</text></svg>