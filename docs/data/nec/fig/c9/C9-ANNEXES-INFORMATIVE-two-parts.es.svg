<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Anexos: informativos, no ley</title><desc id="d">Dos bloques, uno sobre otro: los capítulos obligatorios 1 a 9 en azul marino sólido y, tras un divisor dorado, los anexos informativos A a J en un bloque claro, con casillas de veredicto y una leyenda de tres puntos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Anexos: informativos, no ley</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El libro en dos partes — solo una se puede citar</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Cap. 9, Anexos informativos</text><rect x="60" y="200" width="780" height="280" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="285" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">CAPÍTULOS 1–9 — OBLIGATORIOS</text><text x="450" y="360" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">Secciones y tablas numeradas</text><text x="450" y="412" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">Exigibles tal como están escritos</text><rect x="60" y="520" width="780" height="64" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="562" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">INFORMATIVO — EXPLICA, NO EXIGE</text><rect x="60" y="624" width="780" height="280" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="450" y="709" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">ANEXOS A–J — INFORMATIVOS</text><text x="450" y="784" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Ejemplos, explicaciones, datos</text><text x="450" y="836" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Buena práctica — no es una cita</text><rect x="60" y="950" width="380" height="84" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="250" y="1003" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">Cita: sección numerada</text><rect x="460" y="950" width="380" height="84" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="650" y="1003" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">Un anexo solo: no sirve</text><circle cx="82" cy="1118" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="82" y="1129" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="116" y="1130" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Anexo adoptado por ordenanza = ley allí</text><circle cx="82" cy="1170" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="82" y="1181" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="116" y="1182" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Los ejemplos del Anexo D enseñan el cálculo</text><circle cx="82" cy="1222" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="82" y="1233" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="116" y="1234" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Anexo I: par de apriete UL 486A-B</text></svg>