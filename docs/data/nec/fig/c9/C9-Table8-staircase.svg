<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Table 8 — resistance drops fast</title><desc id="d">Bar chart of Table 8 stranded copper resistance: 14 AWG 3.14, 12 AWG 1.98 highlighted in gold, 10 AWG 1.24, 8 AWG 0.778 and 6 AWG 0.491 ohms per thousand feet, showing how sharply resistance falls as conductor size rises.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Table 8 — resistance drops fast</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Stranded uncoated copper, DC at 75 °C, Ω per 1000 ft</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Ch. 9, Table 8</text><text x="870" y="1360" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="55" y="367.69999999999993" width="128" height="612.3000000000001" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="119" y="349.69999999999993" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">3.14</text><text x="119" y="1028" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">14 AWG</text><rect x="213" y="593.9" width="128" height="386.1" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="277" y="575.9" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1.98</text><text x="277" y="1028" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">12 AWG</text><rect x="371" y="738.2" width="128" height="241.8" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="435" y="720.2" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1.24</text><text x="435" y="1028" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">10 AWG</text><rect x="529" y="828.29" width="128" height="151.71" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="593" y="810.29" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">0.778</text><text x="593" y="1028" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">8 AWG</text><rect x="687" y="884.255" width="128" height="95.745" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="751" y="866.255" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">0.491</text><text x="751" y="1028" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">6 AWG</text><line x1="40" y1="980" x2="860" y2="980" stroke="#1f2937" stroke-width="4"/><rect x="40" y="1090" width="820" height="140" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="1148" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">Each step up in size cuts resistance —</text><text x="450" y="1194" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">that is why upsizing cures voltage drop.</text></svg>