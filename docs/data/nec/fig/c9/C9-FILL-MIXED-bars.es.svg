<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Calibres mixtos: sume las áreas</title><desc id="d">Gráficos de barras apiladas para dos tiradas de calibres mixtos. El ejemplo uno suma 0.1225 pulgadas cuadradas frente a las 0.122 permitidas en EMT de 1/2 pulgada y las 0.213 en 3/4 de pulgada. El ejemplo dos suma 0.6072 frente a 0.598 en EMT de 1-1/4 pulgada y 0.814 en 1-1/2 pulgada.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1340" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Calibres mixtos: sume las áreas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dos tiradas desarrolladas — pasarse es pasarse</text><line x1="30" y1="1282" x2="870" y2="1282" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1320" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Cap. 9, Tablas 1, 4 y 5</text><text x="40" y="218" font-size="37" font-weight="900" fill="#1a2f61" text-anchor="start">Ejemplo 1 — total: 0.1225 sq in</text><text x="40" y="264" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">6 AWG + 6 AWG + 10 AWG, todos THHN</text><rect x="40" y="288" width="126.75" height="62" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><rect x="166.75" y="288" width="126.75" height="62" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><rect x="293.5" y="288" width="52.75" height="62" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><text x="40" y="406" font-size="33" font-weight="900" fill="#c0392b" text-anchor="start">EMT de 1/2 in permite 0.122 — SE PASA por 0.0005</text><rect x="40" y="422" width="305.0" height="50" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="40" y="538" font-size="33" font-weight="900" fill="#2e7d32" text-anchor="start">EMT de 3/4 in permite 0.213 — sí cabe</text><rect x="40" y="554" width="532.5" height="50" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="40" y="700" font-size="37" font-weight="900" fill="#1a2f61" text-anchor="start">Ejemplo 2 — total: 0.6072 sq in</text><text x="40" y="746" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">1/0 + 1/0 + 1/0 THHN + tierra 6 AWG THHN</text><rect x="40" y="770" width="176.225" height="62" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><rect x="216.225" y="770" width="176.225" height="62" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><rect x="392.45" y="770" width="176.225" height="62" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><rect x="568.675" y="770" width="48.165" height="62" rx="0" fill="#264387" stroke="#ffffff" stroke-width="2"/><text x="40" y="888" font-size="33" font-weight="900" fill="#c0392b" text-anchor="start">EMT de 1-1/4 in permite 0.598 — muy pequeño</text><rect x="40" y="904" width="568.1" height="50" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="40" y="1020" font-size="33" font-weight="900" fill="#2e7d32" text-anchor="start">EMT de 1-1/2 in permite 0.814 — sí cabe</text><rect x="40" y="1036" width="773.3" height="50" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="40" y="1130" width="820" height="130" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="64" y="1184" font-size="37" font-weight="900" fill="#1a2f61" text-anchor="start">Sin redondear el total mixto hacia abajo.</text><text x="64" y="1232" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Pasarse es pasarse — suba un tamaño comercial.</text></svg>