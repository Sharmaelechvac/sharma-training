><text x="272" y="916" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">EMT</text><rect x="292" y="872" width="488" height="56" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="796" y="916" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">0.122</text><text x="272" y="1000" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">PVC Sch 40</text><rect x="292" y="956" width="456" height="56" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="764" y="1000" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">0.114</text><text x="272" y="1084" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">PVC Sch 80</text><rect x="292" y="1040" width="348" height="56" rx="0" fill="#c0392b" stroke="#1a2f61" stroke-width="2"/><text x="656" y="1084" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">0.087</text><text x="272" y="1168" font-size="34" font-weight="700" fill="#1f2937" text-anchor="end">FMC</text><rect x="292" y="1124" width="508" height="56" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="788" y="1168" font-size="36" font-weight="800" fill="#ffffff" text-anchor="end">0.127</text><text x="60" y="1236" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">Sch 80: mismo nombre, hueco menor.</text></svg>