<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Annex D — the pattern, worked</title><desc id="d">Flowchart of the Annex D method: build the load list, apply only the demand factors the articles allow, arrive at a service or feeder size. A gold panel points back to Chapter 2 and 220.82, and a worked Sharma example shows the 220.82(B) general-load demand step for a 2,000 square foot house landing at 10,200 VA.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Annex D — the pattern, worked</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Examples illustrate Chapter 2 — they are not answers</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Annex D (informative), 220.82</text><rect x="40" y="210" width="820" height="140" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="272" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">LOAD LIST</text><text x="70" y="318" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Add the loads the articles name</text><line x1="450" y1="350" x2="450" y2="382" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="386" width="820" height="140" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="448" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">DEMAND FACTORS</text><text x="70" y="494" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Only the factors the articles allow</text><line x1="450" y1="526" x2="450" y2="558" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="562" width="820" height="140" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="624" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">SERVICE / FEEDER SIZE</text><text x="70" y="670" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">The size the calculation lands on</text><rect x="40" y="716" width="820" height="130" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="70" y="768" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">THE RULES LIVE IN CHAPTER 2</text><text x="70" y="814" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">The real work is Article 220.</text><rect x="40" y="862" width="820" height="380" rx="16" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="70" y="916" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">SHARMA EXAMPLE — GENERAL LOADS</text><text x="70" y="968" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">2,000 sq ft house — 220.82(B):</text><text x="70" y="1010" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Floor area 2,000 × 3 VA = 6,000 VA</text><text x="70" y="1052" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Small-appliance 2 × 1,500 = 3,000 VA</text><text x="70" y="1094" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Laundry circuit = 1,500 VA</text><text x="70" y="1136" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Total before demand = 10,500 VA</text><text x="70" y="1178" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">10,000 at 100% + 500 at 40%</text><text x="70" y="1220" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">= 10,200 VA general-load demand</text><text x="70" y="1278" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">Heating and cooling: 220.82(C), largest only.</text></svg>