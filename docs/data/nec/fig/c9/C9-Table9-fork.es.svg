<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1220" width="900" height="1220" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Tabla 9 — ¿qué camino?</title><desc id="d">Una bifurcación: los ramales cortos toman el camino de la resistencia en CC de la Tabla 8; los tramos largos, grandes, trifásicos o en canalización de acero toman el camino de la Tabla 9, con la Z efectiva a factor de potencia 0.85, y abajo el ejemplo desarrollado del alimentador 2 AWG.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1220" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Tabla 9 — ¿qué camino?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tramo corto: Tabla 8. Largo o grande: Tabla 9</text><line x1="30" y1="1162" x2="870" y2="1162" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1200" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Cap. 9, Tabla 9</text><text x="870" y="1200" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="200" y="190" width="500" height="92" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="248" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">¿CAÍDA DE TENSIÓN?</text><line x1="350" y1="282" x2="250" y2="372" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="550" y1="282" x2="650" y2="372" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="380" width="410" height="250" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="245" y="440" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">RAMAL CORTO</text><text x="245" y="505" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Tabla 8: solo ohms de CC</text><text x="245" y="555" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Suficiente aquí</text><text x="245" y="605" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Lejos de un límite</text><rect x="450" y="380" width="410" height="250" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="655" y="440" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">LARGO, TRIFÁSICO</text><text x="655" y="505" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Tabla 9: R y XL</text><text x="655" y="555" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Z con FP 0.85</text><text x="655" y="605" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Use la tabla impresa</text><rect x="40" y="690" width="820" height="240" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="750" font-size="36" font-weight="900" fill="#F0A846" text-anchor="middle">DESARROLLADO CON LA TABLA 9</text><text x="450" y="812" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">2 AWG Cu en PVC — Z = 0.19 Ω/kft</text><text x="450" y="864" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">208 V · 100 A · 200 ft de ida</text><text x="450" y="906" font-size="34" font-weight="800" fill="#F0A846" text-anchor="middle">VD = 6.58 V ≈ 3.2% — sobre la guía del 3%</text><text x="450" y="990" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">El 3% / 5% son recomendaciones, no límites</text></svg>