xt-anchor="middle">1.732</text><text x="479" y="540" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">BALANCED 3-PHASE</text><text x="450" y="758" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">The square root of 3, not the round trip</text><rect x="60" y="830" width="780" height="120" rx="16" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="908" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">VD = 1.732 × L × R × I ÷ 1000</text><rect x="60" y="990" width="780" height="130" rx="16" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="84" y="1048" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">40 A · 150 ft · 6 AWG Cu (0.491)</text><text x="84" y="1098" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="start">= 5.10 V ≈ 2.45% of 208 V</text><rect x="60" y="1160" width="780" height="110" rx="16" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1232" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">APPROXIMATION — see Table 9</text></svg>