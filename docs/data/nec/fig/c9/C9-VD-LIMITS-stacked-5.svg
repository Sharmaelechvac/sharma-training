<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">3% and 5% — recommended</title><desc id="d">Stacked bar: feeder 2 percent plus branch 3 percent equals 5 percent total, tagged recommended not required, with a Florida commercial enforceability strip.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">3% and 5% — recommended</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Informational Notes to 210.19(A) and 215.2(A)</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 210.19(A), 215.2(A) Informational Notes</text><rect x="60" y="250" width="312" height="120" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="372" y="250" width="468" height="120" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="216" y="326" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">FEEDER 2%</text><text x="606" y="326" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">BRANCH 3%</text><line x1="840" y1="216" x2="840" y2="404" stroke="#1a2f61" stroke-width="3" stroke-dasharray="10 8"/><text x="840" y="200" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="end">5% TOTAL</text><text x="60" y="436" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Feeder + branch, figured together</text><rect x="60" y="486" width="780" height="164" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="84" y="552" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">RECOMMENDED — Informational Note</text><text x="84" y="606" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Not an NEC requirement.</text><text x="60" y="726" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">A house circuit over 3%?</text><text x="60" y="782" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Over the recommendation — not a</text><text x="60" y="828" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">violation. Fix the run, not the label.</text><rect x="60" y="884" width="780" height="186" rx="16" fill="#264387" stroke="#264387" stroke-width="0"/><text x="84" y="942" font-size="34" font-weight="900" fill="#F0A846" text-anchor="start">FL COMMERCIAL — different story</text><text x="84" y="998" font-size="33" font-weight="700" fill="#ffffff" text-anchor="start">5% combined IS enforceable —</text><text x="84" y="1044" font-size="33" font-weight="700" fill="#ffffff" text-anchor="start">FBC Energy Conservation §C405.5.3</text></svg>