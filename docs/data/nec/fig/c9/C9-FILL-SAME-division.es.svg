<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Una división y redondeo hacia abajo</title><desc id="d">Una ficha de trabajo que desarrolla la división 0.122 entre 0.0133 igual a 9.17, con respuesta de 9 conductores; abajo, la excepción de redondeo hacia arriba del 0.8 en un segundo ejemplo y la advertencia de que los calibres mixtos nunca se dividen.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Una división y redondeo hacia abajo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Todos los conductores del mismo calibre y tipo</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Cap. 9, Tablas 4 y 5</text><rect x="60" y="210" width="780" height="470" rx="0" fill="white" stroke="#264387" stroke-width="4"/><text x="450" y="278" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">FICHA — EMT de 1/2 in, 12 AWG THHN</text><text x="100" y="360" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">Área útil al 40%:  0.122 sq in</text><text x="100" y="403" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">Un conductor:           0.0133 sq in</text><text x="100" y="446" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">0.122 ÷ 0.0133  =  9.17</text><circle cx="130" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="192" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="254" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="316" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="378" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="440" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="502" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="564" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><circle cx="626" cy="560" r="24" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><line x1="775" y1="540" x2="825" y2="590" stroke="#c0392b" stroke-width="4"/><line x1="775" y1="590" x2="825" y2="540" stroke="#c0392b" stroke-width="4"/><text x="762" y="575" font-size="34" font-weight="800" fill="#c0392b" text-anchor="end">.17</text><text x="450" y="648" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="middle">Respuesta: 9 — un décimo no existe</text><rect x="40" y="720" width="820" height="150" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="778" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">EXCEPCIÓN DEL 0.8 — SOLO MISMO CALIBRE</text><text x="450" y="838" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">0.213 ÷ 0.0366 = 5.82  →  6  (8 AWG THHN, 3/4 in EMT)</text><rect x="40" y="900" width="820" height="130" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="952" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Calibres mixtos: no divida ni redondee hacia arriba.</text><text x="450" y="991" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Sume el área de cada conductor.</text></svg>