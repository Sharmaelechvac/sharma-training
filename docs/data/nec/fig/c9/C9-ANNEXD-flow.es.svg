<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Anexo D — el método, desarrollado</title><desc id="d">Diagrama de flujo del método del Anexo D: arme la lista de cargas, aplique solo los factores de demanda que permiten los artículos y llegue al calibre de la acometida o del alimentador. Un panel dorado remite al Capítulo 2 y a 220.82, y un ejemplo desarrollado de Sharma muestra el paso de demanda de carga general de 220.82(B) para una casa de 2,000 pies cuadrados, que llega a 10,200 VA.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Anexo D — el método, desarrollado</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplos del Capítulo 2 — no son respuestas</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Anexo D (informativo), 220.82</text><rect x="40" y="210" width="820" height="140" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="272" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">LISTA DE CARGAS</text><text x="70" y="318" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Sume las cargas que nombran los artículos</text><line x1="450" y1="350" x2="450" y2="382" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="386" width="820" height="140" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="448" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">FACTORES DE DEMANDA</text><text x="70" y="494" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Solo los factores que permiten los artículos</text><line x1="450" y1="526" x2="450" y2="558" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="562" width="820" height="140" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="70" y="624" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">CALIBRE DE ACOMETIDA / ALIMENTADOR</text><text x="70" y="670" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">El calibre que resulta del cálculo</text><rect x="40" y="716" width="820" height="130" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="70" y="768" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">LAS REGLAS ESTÁN EN EL CAPÍTULO 2</text><text x="70" y="814" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">El trabajo real es el Artículo 220.</text><rect x="40" y="862" width="820" height="380" rx="16" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="70" y="916" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">EJEMPLO SHARMA — CARGAS GENERALES</text><text x="70" y="968" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Casa de 2,000 sq ft — 220.82(B):</text><text x="70" y="1010" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Área de piso 2,000 × 3 VA = 6,000 VA</text><text x="70" y="1052" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Artefactos pequeños 2 × 1,500 = 3,000 VA</text><text x="70" y="1094" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Circuito de lavandería = 1,500 VA</text><text x="70" y="1136" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Total antes de la demanda = 10,500 VA</text><text x="70" y="1178" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">10,000 al 100% + 500 al 40%</text><text x="70" y="1220" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">= 10,200 VA de demanda general</text><text x="70" y="1278" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">Calefacción y refrigeración: 220.82(C), solo la mayor.</text></svg>