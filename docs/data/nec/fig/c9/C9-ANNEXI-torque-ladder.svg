<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Annex I — the torque fallback</title><desc id="d">Decision ladder for tightening torque: first the equipment marking, second the manufacturer instructions, third the Annex I tables I.1, I.2 and I.3 as a fallback only. A red panel bars torque values from memory or tightening by feel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Annex I — the torque fallback</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The annex tables are the last stop, not the first</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.14(D), Informative Annex I</text><rect x="40" y="210" width="820" height="180" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="92" cy="264" r="30" fill="#264387" stroke="#264387" stroke-width="0"/><text x="92" y="277" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><text x="140" y="276" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">EQUIPMENT MARKING</text><text x="140" y="328" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">The torque on the label is the rule.</text><text x="140" y="370" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Set it with a torque tool.</text><line x1="450" y1="390" x2="450" y2="426" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="430" width="820" height="180" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="92" cy="484" r="30" fill="#264387" stroke="#264387" stroke-width="0"/><text x="92" y="497" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><text x="140" y="496" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">MANUFACTURER INSTRUCTIONS</text><text x="140" y="548" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">No marking? The maker's sheet</text><text x="140" y="590" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">gives the value for that lug.</text><line x1="450" y1="610" x2="450" y2="646" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="650" width="820" height="300" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><circle cx="92" cy="704" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="92" y="717" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><text x="140" y="716" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">ANNEX I TABLES — FALLBACK</text><text x="140" y="768" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">I.1 · Screws No. 10 and larger,</text><text x="140" y="810" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">split-bolt and other connectors</text><text x="140" y="852" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">I.2 · Slotted head, under No. 10,</text><text x="140" y="894" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">conductors 8 AWG and smaller</text><text x="140" y="936" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">I.3 · Recessed Allen or square drives</text><rect x="40" y="990" width="820" height="130" rx="16" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1042" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">NEVER: a value from memory</text><text x="450" y="1088" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">and never tight by feel.</text></svg>