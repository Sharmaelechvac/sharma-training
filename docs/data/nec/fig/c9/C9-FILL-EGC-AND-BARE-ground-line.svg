<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The ground gets its own line</title><desc id="d">A fill list with three 12 AWG THHN conductors and the equipment ground on its own highlighted line, showing an insulated ground taking its Table 5 area of 0.0133 square inches and a bare ground taking its Table 8 diameter area of about 0.0051 square inches.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The ground gets its own line</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Three 12 THHN + one 12 AWG ground</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Ch. 9, Table 1 notes, Tables 5 and 8</text><rect x="40" y="200" width="820" height="330" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="64" y="262" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">12 AWG THHN — hot</text><text x="836" y="262" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="end">0.0133</text><text x="64" y="324" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">12 AWG THHN — neutral</text><text x="836" y="324" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="end">0.0133</text><text x="64" y="386" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">12 AWG THHN — hot</text><text x="836" y="386" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="end">0.0133</text><rect x="52" y="404" width="796" height="66" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="64" y="450" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">12 AWG GROUND — count it</text><text x="836" y="450" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="end">below</text><text x="64" y="506" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">Areas in sq in:</text><rect x="40" y="620" width="400" height="270" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="64" y="678" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">INSULATED ground</text><text x="64" y="736" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Table 5, THHN row</text><text x="64" y="836" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="start">0.0133 sq in</text><rect x="460" y="620" width="400" height="270" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="484" y="678" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">BARE ground</text><text x="484" y="736" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Table 8, dia 0.081 in</text><text x="484" y="836" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="start">0.0051 sq in</text><rect x="40" y="950" width="820" height="190" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="64" y="1014" font-size="37" font-weight="900" fill="#ffffff" text-anchor="start">List total with the bare ground: 0.0450 sq in</text><text x="64" y="1072" font-size="33" font-weight="800" fill="#F0A846" text-anchor="start">1/2 in EMT at 40% allows 0.122 — it fits, counted.</text><text x="64" y="1210" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">Leave the ground off and the same list 'passes'</text><text x="64" y="1256" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">at 0.0399 — on paper only.</text></svg>