<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Tabla 1: ¿cuánto puede ocupar?</title><desc id="d">Tres círculos de canalización dibujados al mismo tamaño. Un conductor ocupa el 53 por ciento del área, dos conductores el 31 por ciento, tres o más el 40 por ciento; los círculos de los conductores están dimensionados por área para comparar los porcentajes a simple vista.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1000" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Tabla 1: ¿cuánto puede ocupar?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La misma canalización, tres cantidades</text><line x1="30" y1="942" x2="870" y2="942" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="980" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Cap. 9, Tabla 1 y Tabla 4</text><text x="160" y="300" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">1 conductor</text><circle cx="160" cy="470" r="140" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="160" cy="470" r="102" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="712" font-size="62" font-weight="900" fill="#1a2f61" text-anchor="middle">53%</text><text x="160" y="762" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">ocupación máx.</text><text x="450" y="300" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">2 conductores</text><circle cx="450" cy="470" r="140" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="395" cy="470" r="55" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="505" cy="470" r="55" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="712" font-size="62" font-weight="900" fill="#1a2f61" text-anchor="middle">31%</text><text x="450" y="762" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">ocupación máx.</text><text x="740" y="300" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">3 o más</text><circle cx="740" cy="470" r="140" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="740" cy="411" r="51" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="689" cy="500" r="51" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="791" cy="500" r="51" fill="#264387" stroke="#264387" stroke-width="0"/><text x="740" y="712" font-size="62" font-weight="900" fill="#1a2f61" text-anchor="middle">40%</text><text x="740" y="762" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">ocupación máx.</text><rect x="40" y="806" width="820" height="108" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="856" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Dos conductores tienen menos espacio:</text><text x="450" y="898" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">dos círculos desperdician más del círculo.</text></svg>