 y="356" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗</text><text x="532" y="356" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Feeding a fixed</text><text x="532" y="392" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">outlet box</text><text x="484" y="494" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗</text><text x="532" y="494" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">A permanent</text><text x="532" y="530" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">load</text><text x="484" y="632" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗</text><text x="532" y="632" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Through walls</text><text x="532" y="668" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">or ceilings</text><text x="484" y="770" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗</text><text x="532" y="770" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Through</text><text x="532" y="806" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">doorways</text><text x="40" y="990" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Can't name a 400.10 use?</text><text x="40" y="1031" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Stop — run conduit or cable.</text></svg>