<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">422.10: one line per appliance</title><desc id="d">A takeoff worksheet with four labeled rows - appliance, rating, circuit, disconnect - worked for a 4,500 watt storage water heater: 18.75 amps nameplate, sized at 125 percent to 23.4 amps, built as a 30 amp circuit on 10 AWG copper with a lockable disconnect in sight.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">422.10: one line per appliance</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The takeoff strip, worked on a water heater.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 422.10, 422.11(E), 422.13, 422.31</text><rect x="40" y="230" width="240" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="307.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">APPLIANCE</text><rect x="280" y="230" width="590" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="305" y="288" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Storage water heater,</text><text x="305" y="334" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">120 gal or less</text><rect x="40" y="356" width="240" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="433.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">RATING</text><rect x="280" y="356" width="590" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="305" y="414" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">4,500 W ÷ 240 V</text><text x="305" y="460" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">= 18.75 A on the nameplate</text><rect x="40" y="482" width="240" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="559.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">CIRCUIT</text><rect x="280" y="482" width="590" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="305" y="540" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">125% of nameplate = 23.4 A min</text><text x="305" y="586" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Built: 30 A, 10 AWG Cu — 422.13</text><rect x="40" y="628" width="240" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="705.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DISCONNECT</text><rect x="280" y="628" width="590" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="305" y="686" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Lockable, within sight</text><text x="305" y="732" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">of the appliance — 422.31</text><rect x="40" y="790" width="830" height="180" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="65" y="848" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">No maximum OCPD on the nameplate?</text><text x="65" y="902" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Over 13.3 A: up to 150% of rating.</text><text x="65" y="948" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">13.3 A or less: 20 A max. — 422.11(E)</text><rect x="40" y="1000" width="830" height="150" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="65" y="1058" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Nameplate and circuit disagree?</text><text x="65" y="1112" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Fix the circuit — never derate by hope.</text><rect x="40" y="1180" width="830" height="130" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="450" y="1238" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Appliance on the plan, no circuit home?</text><text x="450" y="1286" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Open question on the packet — not a field surprise.</text></svg>