<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">409.110 Read the panel label</title><desc id="d">A sample industrial control panel label with its four 409.110 markings, the SCCR line highlighted, and a comparison: at 22 kA available fault current, a 10 kA SCCR panel may not be set while a 65 kA SCCR panel may.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">409.110 Read the panel label</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The SCCR line decides if the panel can live here.</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 409.110, 408.6</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="200" width="720" height="470" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="90" y="200" width="720" height="78" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="254" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">INDUSTRIAL CONTROL PANEL</text><circle cx="140" cy="336" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="140" y="348" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="190" y="348" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">MANUFACTURER'S NAME</text><circle cx="140" cy="410" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="140" y="422" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="190" y="422" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">INPUT VOLTAGE + PHASES</text><circle cx="140" cy="484" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="140" y="496" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="190" y="496" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">FULL-LOAD CURRENT</text><rect x="112" y="518" width="676" height="84" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><circle cx="140" cy="558" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="140" y="570" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="190" y="570" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">SCCR: 65 kA</text><text x="90" y="748" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1  Name — whose listing applies</text><text x="90" y="787" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2  Voltage + phases — match the supply</text><text x="90" y="826" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3  Full-load current — sizes the feeder</text><text x="90" y="865" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">4  SCCR — the ceiling for fault current</text><text x="90" y="940" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">AVAILABLE FAULT CURRENT: 22 kA</text><rect x="90" y="980" width="720" height="110" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="120" y="1028" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">PANEL MARKED SCCR 10 kA</text><text x="120" y="1072" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">DO NOT SET — exceeds the rating</text><rect x="90" y="1120" width="720" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="120" y="1168" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">PANEL MARKED SCCR 65 kA</text><text x="120" y="1212" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">OK — rating clears the fault current</text></svg>