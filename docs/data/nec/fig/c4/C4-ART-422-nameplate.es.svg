<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">La placa de datos decide</title><desc id="d">Un calentador de agua de almacenamiento con placa de datos de 4,500 W y 240 V, el cálculo 18.75 A por 1.25 igual a 23.4 A que lleva a un interruptor de 30 A en cobre 10 AWG, y el medio de desconexión del aparato al alcance de quien da servicio.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La placa de datos decide</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo de calentador de agua: 4,500 W a 240 V.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículo 422</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="80" y="330" width="250" height="630" rx="30" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="140" y1="270" x2="140" y2="330" stroke="#264387" stroke-width="5"/><line x1="270" y1="270" x2="270" y2="330" stroke="#264387" stroke-width="5"/><rect x="105" y="390" width="200" height="180" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="120" y="435" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">PLACA DE DATOS</text><text x="120" y="490" font-size="38" font-weight="800" fill="#1f2937" text-anchor="start">4,500 W</text><text x="120" y="545" font-size="38" font-weight="800" fill="#1f2937" text-anchor="start">240 V</text><text x="205" y="1015" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Calentador de agua de almacenamiento</text><rect x="400" y="330" width="470" height="140" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="425" y="390" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">4,500 W ÷ 240 V</text><text x="425" y="434" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">= consumo de 18.75 A</text><line x1="635" y1="470" x2="635" y2="530" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="530" width="470" height="140" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="425" y="590" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">18.75 A × 1.25</text><text x="425" y="634" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">= 23.4 A mínimo</text><line x1="635" y1="670" x2="635" y2="730" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="730" width="470" height="140" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="425" y="790" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Interruptor de 30 A</text><text x="425" y="834" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Cobre 10 AWG</text><rect x="400" y="950" width="180" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="445" y1="990" x2="520" y2="1040" stroke="#1a2f61" stroke-width="5"/><text x="490" y="1125" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">DESCONEXIÓN</text><circle cx="335" cy="410" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="335" y="421" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="395" cy="600" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="395" y="611" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="605" cy="1015" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="605" y="1026" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="81" cy="1180" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="81" y="1191" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="118" y="1191" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">La capacidad nominal sale de la placa de datos (422.10)</text><circle cx="81" cy="1232" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="81" y="1243" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="118" y="1243" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Calentadores de agua de almacenamiento: 125% (422.13)</text><circle cx="81" cy="1284" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="81" y="1295" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="118" y="1295" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Un medio de desconexión al alcance del técnico de servicio (422.31)</text></svg>