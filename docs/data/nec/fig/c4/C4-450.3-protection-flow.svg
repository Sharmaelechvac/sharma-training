<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1620" width="900" height="1620" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">450.3(B) Pick the case first</title><desc id="d">Decision flow for transformer overcurrent protection: a 45 kVA transformer with about 54 A primary current. At 9 A or more, primary-only protection is 125 percent, giving a 70 A device; or protect both sides, primary up to 250 percent and secondary not over 125 percent. Under 9 A primary-only may go to 167 percent; under 2 A, to 300 percent.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1620" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">450.3(B) Pick the case first</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dry-type work at 1000 V and below</text><line x1="30" y1="1562" x2="870" y2="1562" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 450.3(B), Table 450.3(B)</text><rect x="140" y="200" width="620" height="160" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="252" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">WORKED EXAMPLE</text><text x="450" y="300" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">45 kVA, 480 to 208/120 V</text><text x="450" y="344" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">primary current ≈ 54 A</text><line x1="450" y1="360" x2="450" y2="396" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="90" y="406" width="720" height="130" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="458" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Primary and secondary currents</text><text x="450" y="506" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">of 9 A or more?</text><line x1="240" y1="536" x2="240" y2="566" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><line x1="660" y1="536" x2="660" y2="566" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="40" y="576" width="400" height="300" rx="16" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="240" y="632" font-size="36" font-weight="900" fill="#F0A846" text-anchor="middle">PRIMARY ONLY</text><text x="240" y="692" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">125% of primary current</text><text x="240" y="748" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">54 × 1.25 = 67.5 A</text><text x="240" y="822" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">Pick: 70 A device</text><rect x="460" y="576" width="400" height="300" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="660" y="632" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">BOTH SIDES</text><text x="660" y="692" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">Primary up to 250%</text><text x="660" y="748" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">Secondary not over</text><text x="660" y="800" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">125 percent</text><text x="450" y="950" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Smaller primary currents, primary-only protection:</text><rect x="40" y="990" width="400" height="170" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="240" y="1052" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Primary under 9 A</text><text x="240" y="1112" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">up to 167 percent</text><rect x="460" y="990" width="400" height="170" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="660" y="1052" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Primary under 2 A</text><text x="660" y="1112" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">up to 300 percent</text><rect x="40" y="1210" width="820" height="120" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1262" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">Never carry one remembered percentage</text><text x="450" y="1310" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">to a different case — work the table.</text><text x="40" y="1400" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Where the percentage lands between standard</text><text x="40" y="1448" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">ratings, the table notes permit the next higher</text><text x="40" y="1496" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">standard rating in the cases they cover.</text></svg>