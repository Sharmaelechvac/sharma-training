<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">408.41 One neutral, one terminal</title><desc id="d">Comparison of neutral terminations in a panelboard: at the top each grounded conductor lands on its own terminal screw; at the bottom two neutrals share one screw, so loosening that screw opens the neutral of a live circuit.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">408.41 One neutral, one terminal</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">One bar, landed right — and landed wrong</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 408.41</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="70" y="225" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="start">RIGHT</text><rect x="90" y="300" width="720" height="56" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="180" cy="328" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="170" y1="328" x2="190" y2="328" stroke="#1a2f61" stroke-width="3"/><circle cx="320" cy="328" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="310" y1="328" x2="330" y2="328" stroke="#1a2f61" stroke-width="3"/><circle cx="460" cy="328" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="450" y1="328" x2="470" y2="328" stroke="#1a2f61" stroke-width="3"/><circle cx="600" cy="328" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="590" y1="328" x2="610" y2="328" stroke="#1a2f61" stroke-width="3"/><circle cx="740" cy="328" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="730" y1="328" x2="750" y2="328" stroke="#1a2f61" stroke-width="3"/><line x1="180" y1="222" x2="180" y2="300" stroke="#1f2937" stroke-width="4"/><line x1="320" y1="222" x2="320" y2="300" stroke="#1f2937" stroke-width="4"/><line x1="460" y1="222" x2="460" y2="300" stroke="#1f2937" stroke-width="4"/><line x1="600" y1="222" x2="600" y2="300" stroke="#1f2937" stroke-width="4"/><text x="450" y="405" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">Each neutral on its own screw</text><text x="70" y="640" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">WRONG</text><rect x="90" y="715" width="720" height="56" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="180" cy="743" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="170" y1="743" x2="190" y2="743" stroke="#1a2f61" stroke-width="3"/><circle cx="320" cy="743" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="310" y1="743" x2="330" y2="743" stroke="#1a2f61" stroke-width="3"/><circle cx="460" cy="743" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="450" y1="743" x2="470" y2="743" stroke="#1a2f61" stroke-width="3"/><circle cx="600" cy="743" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="590" y1="743" x2="610" y2="743" stroke="#1a2f61" stroke-width="3"/><circle cx="740" cy="743" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><line x1="730" y1="743" x2="750" y2="743" stroke="#1a2f61" stroke-width="3"/><line x1="300" y1="637" x2="318" y2="715" stroke="#1f2937" stroke-width="4"/><line x1="345" y1="637" x2="322" y2="715" stroke="#1f2937" stroke-width="4"/><line x1="600" y1="637" x2="600" y2="715" stroke="#1f2937" stroke-width="4"/><line x1="740" y1="637" x2="740" y2="715" stroke="#1f2937" stroke-width="4"/><text x="450" y="820" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Two neutrals trapped under one screw</text><line x1="320" y1="900" x2="120" y2="985" stroke="#1a2f61" stroke-width="3"/><circle cx="320" cy="900" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="120" y="944" width="626.95" height="138" rx="10" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="134" y="987" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Loosen this one screw to work</text><text x="134" y="1027" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">on a circuit — and the neutral of</text><text x="134" y="1067" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">a live circuit sharing it opens.</text><rect x="60" y="1130" width="780" height="120" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="90" y="1180" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">An opened shared neutral leaves a live circuit</text><text x="90" y="1221" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">with no return path. One to a screw.</text></svg>