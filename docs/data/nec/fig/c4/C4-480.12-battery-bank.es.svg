1" text-anchor="middle">2</text><circle cx="760" cy="690" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="760" y="702" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="664" cy="760" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="664" y="772" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="60" y="960" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1  Conectores entre celdas: piezas del fabricante</text><text x="60" y="1012" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">2  Apriete al torque del fabricante — regístrelo</text><text x="60" y="1064" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">3  Recorridos protegidos contra daños y electrolito</text><text x="60" y="1116" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">4  Medio de desconexión con valor nominal DC a la vista (480.7)</text><rect x="50" y="1210" width="800" height="130" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="75" y="1262" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Un banco entrega enorme corriente de falla a muy</text><text x="75" y="1308" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">baja impedancia. La unión es el punto débil.</text><text x="60" y="1430" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Las interconexiones se dimensionan para el máximo</text><text x="60" y="1476" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">corriente que el banco puede entregar.</text></svg>