<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">404.9 Puesta a tierra de un interruptor de acción rápida</title><desc id="d">Dos cajas de interruptores. A la izquierda, una caja metálica: el conductor de puesta a tierra del equipo une la caja y los tornillos de montaje del interruptor unen el yugo. A la derecha, una caja no metálica: el conductor de puesta a tierra del equipo llega directamente al terminal verde de puesta a tierra del interruptor.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">404.9 Puesta a tierra de un interruptor de acción rápida</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Caja metálica: los tornillos. Caja plástica: el tornillo verde.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 404.9(A), 404.9(B), 250.109</text><rect x="35" y="185" width="397" height="68" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="233" y="230" font-size="31" font-weight="900" fill="#1a2f61" text-anchor="middle">CAJA METÁLICA (B)(1)</text><rect x="35" y="253" width="397" height="700" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><rect x="468" y="185" width="397" height="68" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="666" y="230" font-size="31" font-weight="900" fill="#1a2f61" text-anchor="middle">CAJA DE PLÁSTICO (B)(2)</text><rect x="468" y="253" width="397" height="700" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><rect x="110" y="330" width="250" height="450" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="160" y="405" width="150" height="300" rx="0" fill="none" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 8"/><rect x="185" y="430" width="100" height="250" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><rect x="225" y="520" width="20" height="62" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="200" cy="455" r="10" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="270" cy="655" r="10" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="200" y1="860" x2="200" y2="780" stroke="#1f2937" stroke-width="5"/><line x1="270" y1="860" x2="270" y2="780" stroke="#1f2937" stroke-width="5"/><line x1="200" y1="860" x2="140" y2="745" stroke="#2e7d32" stroke-width="5"/><circle cx="140" cy="740" r="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><circle cx="140" cy="740" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="140" y="752" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="200" cy="455" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="200" y="467" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="235" y="905" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">cable con EGC</text><rect x="545" y="330" width="250" height="450" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="5"/><rect x="595" y="405" width="150" height="300" rx="0" fill="none" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 8"/><rect x="620" y="430" width="100" height="250" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><rect x="660" y="520" width="20" height="62" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="635" cy="455" r="10" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="705" cy="655" r="10" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="640" y1="860" x2="640" y2="780" stroke="#1f2937" stroke-width="5"/><line x1="720" y1="860" x2="720" y2="780" stroke="#1f2937" stroke-width="5"/><path d="M640,860 C 640,790 700,720 728,652" stroke="#2e7d32" stroke-width="5" fill="none"/><circle cx="733" cy="642" r="11" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><circle cx="733" cy="642" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="733" y="654" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="670" cy="420" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="670" y="432" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="670" y="905" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">cable con EGC</text><circle cx="60" cy="1041" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="1053" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="98" y="1052" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">El EGC une equipotencialmente la caja metálica</text><circle cx="60" cy="1087" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="1099" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="98" y="1098" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Los tornillos de montaje hacen la unión equipotencial de la horquilla</text><circle cx="60" cy="1133" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="1145" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="98" y="1144" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">El EGC llega al terminal verde</text><circle cx="60" cy="1179" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="1191" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="98" y="1190" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">La placa metálica comparte la misma unión equipotencial</text><text x="40" y="1285" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">¿Sin EGC en la caja? Solo reemplazo —</text><text x="40" y="1331" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">placa no metálica o GFCI (404.9(B) Ex. 1).</text></svg>