<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Cable calefactor en un tramo de tubería</title><desc id="d">Elevación de una tubería con cable calefactor bajo el aislamiento, alimentada desde un tablero a través de un interruptor GFPE y un controlador con su sensor fijado a la tubería, con letreros de precaución dimensionados a 20 ft máx. de distancia entre sí.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1200" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Cable calefactor en un tramo de tubería</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elevación — un tramo calefactado y su protección</text><line x1="30" y1="1142" x2="870" y2="1142" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1180" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Art. 427 — 427.4, 427.13, 427.22</text><rect x="40" y="210" width="320" height="120" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="65" y="262" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">TABLERO</text><text x="65" y="306" font-size="30" font-weight="600" fill="#ffffff" text-anchor="start">20 A interruptor GFPE</text><circle cx="66" cy="184" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="66" y="196" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="560" y="210" width="300" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="585" y="262" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">CONTROLADOR</text><text x="585" y="306" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">sensor en la tubería</text><circle cx="586" cy="184" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="586" y="196" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><line x1="360" y1="270" x2="560" y2="270" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><text x="460" y="248" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">circuito derivado</text><rect x="170" y="452" width="130" height="46" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="235" y="486" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">PRECAUCIÓN</text><rect x="630" y="452" width="130" height="46" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="695" y="486" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">PRECAUCIÓN</text><circle cx="130" cy="475" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="130" y="487" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">5</text><line x1="235" y1="428" x2="695" y2="428" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="465.0" y="416" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">20 ft máx. entre letreros</text><text x="465.0" y="416" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">20 ft máx. entre letreros</text><rect x="40" y="540" width="820" height="26" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="2"/><rect x="40" y="654" width="820" height="26" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="2"/><text x="450" y="530" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">aislamiento sobre el cable</text><rect x="40" y="566" width="820" height="88" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="52" y1="622" x2="848" y2="622" stroke="#F0A846" stroke-width="7"/><circle cx="200" cy="622" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="200" y="634" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="560" cy="622" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="560" y="634" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="450" y="606" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">tubería de agua</text><rect x="784" y="588" width="26" height="26" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><line x1="797" y1="588" x2="797" y2="330" stroke="#1a2f61" stroke-width="3"/><circle cx="797" cy="588" r="6" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="70" y="800" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  interruptor GFPE — 427.22</text><text x="70" y="846" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Controlador — sensor sujeto a la tubería</tex