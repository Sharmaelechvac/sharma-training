<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1140" width="900" height="1140" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">440.22(A) — El rango del MOCP</title><desc id="d">Barra de escala para un compresor con carga nominal de 20 A: por debajo de 25 A está bajo el piso del 125 por ciento, de 25 a 35 A es el rango normal, de 35 a 45 A se permite solo cuando el 175 por ciento no arranca el compresor, y sobre 45 A nunca se permite.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1140" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">440.22(A) — El rango del MOCP</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Caso calculado: corriente de carga nominal de 20 A</text><line x1="30" y1="1082" x2="870" y2="1082" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1120" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 440.22(A), 440.22(B)</text><rect x="70" y="470" width="380" height="75" rx="0" fill="#fbe9e7" stroke="none" stroke-width="0"/><rect x="450" y="470" width="152" height="75" rx="0" fill="#e8f5e9" stroke="none" stroke-width="0"/><rect x="602" y="470" width="152" height="75" rx="0" fill="#fdf3e0" stroke="none" stroke-width="0"/><rect x="754" y="470" width="76" height="75" rx="0" fill="#fbe9e7" stroke="none" stroke-width="0"/><rect x="70" y="470" width="760" height="75" rx="0" fill="none" stroke="#264387" stroke-width="4"/><line x1="450" y1="452" x2="450" y2="545" stroke="#264387" stroke-width="3"/><line x1="602" y1="452" x2="602" y2="545" stroke="#264387" stroke-width="3"/><line x1="754" y1="452" x2="754" y2="545" stroke="#264387" stroke-width="3"/><text x="450" y="340" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">mínimo de 125%</text><text x="450" y="385" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">25 A</text><text x="602" y="295" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">175% máx. estándar</text><line x1="602" y1="310" x2="602" y2="452" stroke="#5b6478" stroke-width="2"/><text x="602" y="385" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">35 A</text><text x="754" y="340" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">225% límite máximo</text><text x="754" y="385" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">45 A</text><text x="70" y="592" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">0 A</text><text x="830" y="592" font-size="30" font-weight="600" fill="#5b6478" text-anchor="end">50 A</text><rect x="60" y="665" width="26" height="26" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="105" y="690" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Por debajo de 25 A — bajo el piso del 125%</text><rect x="60" y="711" width="26" height="26" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="105" y="736" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">25–35 A — el rango normal</text><rect x="60" y="757" width="26" height="26" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="105" y="782" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">35–45 A — solo si 175% no lo arranca</text><rect x="60" y="803" width="26" height="26" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="105" y="828" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Más de 45 A — más allá del límite del 225%: nunca</text><rect x="30" y="890" width="840" height="120" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="945" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">En equipos listados, el MOCP de la placa de datos</text><text x="450" y="989" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">ya hizo este cálculo — la placa manda.</text></svg>