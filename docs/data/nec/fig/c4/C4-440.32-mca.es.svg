<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" width="900" height="1280" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">440.32: Dimensione el cable desde el MCA</title><desc id="d">Flujo: una corriente de carga nominal del compresor de 20 A por 125 por ciento da una ampacidad mínima del conductor de 25 A; en equipo listado ese número se imprime como el MCA. El MOCP es protección, no calibre del cable.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1280" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">440.32: Dimensione el cable desde el MCA</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un solo motocompresor — la placa ya hizo el cálculo</text><line x1="30" y1="1222" x2="870" y2="1222" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1260" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 440.32, 440.22</text><text x="870" y="1260" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="140" y="200" width="620" height="220" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="256" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">PLACA DE DATOS DEL COMPRESOR</text><text x="450" y="306" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">Corriente de carga nominal: 20 A</text><text x="450" y="350" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">o corriente de selección del circuito derivado,</text><text x="450" y="392" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">el que sea mayor</text><line x1="450" y1="420" x2="450" y2="460" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="255.5" y="496" width="389" height="56" rx="28" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="538" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">× 125%  —  440.32</text><line x1="450" y1="556" x2="450" y2="596" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="140" y="606" width="620" height="130" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="450" y="664" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">25 A MÍNIMO</text><text x="450" y="706" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">ampacidad del conductor</text><line x1="450" y1="736" x2="450" y2="776" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="786" width="720" height="150" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="842" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="middle">¿UNIDAD LISTADA? LEA EL MCA</text><text x="450" y="886" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">la placa ya aplicó el 125%</text><rect x="90" y="986" width="720" height="150" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1042" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">NO ES EL MOCP, NO ES EL TONELAJE</text><text x="450" y="1086" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">El MOCP es solo protección — 440.22</text></svg>