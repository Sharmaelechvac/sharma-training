<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">455 Diagrama unifilar del convertidor de fase</title><desc id="d">Diagrama unifilar. Un tablero monofásico alimenta un medio de desconexión, luego un convertidor de fase rotativo, luego un tablero trifásico y un motor. Las notas muestran el dimensionamiento: conductores de alimentación de al menos 125 por ciento de la entrada de placa de datos de 40 A, un dispositivo de sobrecorriente máximo de 50 A, un medio de desconexión de al menos 115 por ciento, o sea un interruptor de 60 A, y la pata de fase fabricada en dorado marcada como identificada, sin cargas monofásicas en ella.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">455 Diagrama unifilar del convertidor de fase</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo resuelto: entrada de 40 A según placa de datos.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 455.6, 455.7, 455.8, 455.9</text><rect x="90" y="196" width="420" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="300" y="248" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Tablero monofásico</text><text x="300" y="290" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">240 V acometida</text><line x1="300" y1="306" x2="300" y2="380" stroke="#1f2937" stroke-width="5"/><text x="324" y="352" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">conductores ≥ 125% de 40 A</text><text x="324" y="394" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">= 50 A ampacidad (8 AWG Cu)</text><rect x="90" y="430" width="420" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="300" y="482" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">medio de desconexión</text><text x="300" y="524" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">≥ 115% → interruptor de 60 A</text><line x1="300" y1="540" x2="300" y2="614" stroke="#1f2937" stroke-width="5"/><text x="324" y="586" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">OCPD ≤ 125% → 50 A máx.</text><rect x="90" y="650" width="420" height="130" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="300" y="702" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">CONVERTIDOR ROTATIVO</text><text x="300" y="744" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">entrada de placa de datos 40 A</text><line x1="210" y1="780" x2="210" y2="856" stroke="#1f2937" stroke-width="6"/><text x="200" y="824" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="end">L1</text><line x1="300" y1="780" x2="300" y2="856" stroke="#1f2937" stroke-width="6"/><text x="290" y="824" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="end">L2</text><line x1="390" y1="780" x2="390" y2="856" stroke="#F0A846" stroke-width="6" stroke-dasharray="12 8"/><text x="380" y="824" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="end">L3</text><text x="470" y="812" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="start">L3 = fase fabricada:</text><text x="470" y="854" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">marcado, sin cargas monofásicas</text><rect x="90" y="880" width="420" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="300" y="932" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Tablero trifásico</text><line x1="300" y1="990" x2="300" y2="1064" stroke="#1f2937" stroke-width="5"/><circle cx="300" cy="1140" r="62" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="300" y="1154" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">M</text><text x="300" y="1252" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">carga de motor trifásico</text></svg>