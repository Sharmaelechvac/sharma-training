<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">450.9 Deje respirar al transformador</title><desc id="d">Elevación frontal de un transformador tipo seco: aberturas de ventilación bajas y altas en la cara, flechas de aire fresco entrando por las aberturas inferiores, una zona de mantener despejada punteada sobre la superficie superior con cajas de almacenamiento tachadas en rojo, y una cota que muestra 12 in mínimo a una pared combustible con estructura de madera.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">450.9 Deje respirar al transformador</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elevación frontal — caso a escala: unidad de 75 kVA</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 450.9, 450.21</text><text x="870" y="1460" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="230" y="195" width="390" height="125" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="12 8"/><rect x="255" y="245" width="145" height="73" rx="0" fill="url(#hatchred)" stroke="#c0392b" stroke-width="4"/><rect x="412" y="262" width="120" height="56" rx="0" fill="url(#hatchred)" stroke="#c0392b" stroke-width="4"/><line x1="255" y1="245" x2="400" y2="318" stroke="#c0392b" stroke-width="5"/><line x1="255" y1="318" x2="400" y2="245" stroke="#c0392b" stroke-width="5"/><line x1="412" y1="262" x2="532" y2="318" stroke="#c0392b" stroke-width="5"/><line x1="412" y1="318" x2="532" y2="262" stroke="#c0392b" stroke-width="5"/><path d="M560,312 C 550,285 570,262 560,232" stroke="#F0A846" stroke-width="5" fill="none"/><path d="M592,312 C 582,285 602,262 592,232" stroke="#F0A846" stroke-width="5" fill="none"/><rect x="230" y="320" width="390" height="690" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="230" y1="320" x2="620" y2="320" stroke="#1a2f61" stroke-width="8"/><line x1="275" y1="395" x2="575" y2="383" stroke="#264387" stroke-width="6"/><line x1="275" y1="435" x2="575" y2="423" stroke="#264387" stroke-width="6"/><line x1="275" y1="475" x2="575" y2="463" stroke="#264387" stroke-width="6"/><line x1="275" y1="845" x2="575" y2="833" stroke="#264387" stroke-width="6"/><line x1="275" y1="885" x2="575" y2="873" stroke="#264387" stroke-width="6"/><line x1="275" y1="925" x2="575" y2="913" stroke="#264387" stroke-width="6"/><text x="425" y="640" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">TIPO SECO</text><text x="425" y="690" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">TRANSFORMADOR</text><text x="425" y="740" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">75 kVA</text><line x1="60" y1="880" x2="215" y2="880" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><line x1="60" y1="940" x2="215" y2="940" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><text x="30" y="835" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">entrada de aire frío</text><rect x="720" y="320" width="44" height="690" rx="0" fill="url(#hatch)" stroke="#1f2937" stroke-width="3"/><text x="742" y="292" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">pared combustible</text><line x1="120" y1="1010" x2="860" y2="1010" stroke="#1f2937" stroke-width="5"/><line x1="620" y1="1010" x2="620" y2="1097" stroke="#1a2f61" stroke-width="2"/><line x1="720" y1="1010" x2="720" y2="1097" stroke="#1a2f61" stroke-width="2"/><line x1="620" y1="1085" x2="720" y2="1085" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="670.0" y="1073" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 in mín. (450.21)</text><text x="670.0" y="1073" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">12 in mín. (450.21)</text><circle cx="648" cy="435" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="648" y="447" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="205" cy="258" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="205" y="270" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="670" cy="1010" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="670" y="1022" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="60" cy="1189" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="1201" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="98" y="1200" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Aberturas de ventilación — manténgalas despejadas</text><circle cx="60" cy="1235" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="1247" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="98" y="1246" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">La parte superior está marcada: sin almacenamiento</text><circle cx="60" cy="1281" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="1293" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="98" y="1292" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">12 in mín. desde combustible (450.21)</text></svg>