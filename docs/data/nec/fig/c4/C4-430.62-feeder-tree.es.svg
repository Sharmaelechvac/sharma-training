<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">430.62 Protección del alimentador, varios motores</title><desc id="d">Árbol de alimentador con tres derivaciones de motor que se unen a un alimentador. El límite máximo del dispositivo del alimentador es el dispositivo derivado mayor, 40 A, más las corrientes a plena carga de los demás motores, 60 A. Los conductores del alimentador se dimensionan por separado según 430.24, con 37.5 A de ampacidad mínima.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">430.62 Protección del alimentador, varios motores</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo calculado: FLC de tabla de 14 A, 10 A y 10 A</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.62(A) · 430.24</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="195" width="250" height="100" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="185" y="238" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">ALIMENTADOR</text><text x="185" y="280" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">DISPOSITIVO</text><line x1="310" y1="245" x2="835" y2="245" stroke="#264387" stroke-width="6"/><line x1="430" y1="245" x2="430" y2="395" stroke="#264387" stroke-width="5"/><rect x="350" y="395" width="160" height="104" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="430" y="440" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">MOTOR</text><text x="430" y="476" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">14 A FLC</text><text x="430" y="545" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Dispositivo derivado de 40 A — el mayor</text><line x1="610" y1="245" x2="610" y2="395" stroke="#264387" stroke-width="5"/><rect x="530" y="395" width="160" height="104" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="610" y="440" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">MOTOR</text><text x="610" y="476" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">10 A FLC</text><line x1="790" y1="245" x2="790" y2="395" stroke="#264387" stroke-width="5"/><rect x="710" y="395" width="160" height="104" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="790" y="440" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">MOTOR</text><text x="790" y="476" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">10 A FLC</text><text x="60" y="620" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">DOS FÓRMULAS — NO LAS INTERCAMBIE</text><rect x="60" y="650" width="780" height="168" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="90" y="702" font-size="35" font-weight="700" fill="#1f2937" text-anchor="start">LÍMITE MÁXIMO DEL DISPOSITIVO DEL ALIMENTADOR — 430.62(A)</text><text x="90" y="748" font-size="35" font-weight="700" fill="#1f2937" text-anchor="start">Dispositivo derivado mayor + FLC de los demás motores</text><text x="90" y="794" font-size="35" font-weight="700" fill="#1f2937" text-anchor="start">40 + 10 + 10  =  60 A máx.</text><rect x="60" y="850" width="780" height="168" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="902" font-size="35" font-weight="700" fill="#1f2937" text-anchor="start">CONDUCTORES DEL ALIMENTADOR — 430.24</text><text x="90" y="948" font-size="35" font-weight="700" fill="#1f2937" text-anchor="start">Motor más grande × 125% + el resto al 100%</text><text x="90" y="994" font-size="35" font-weight="700" fill="#1f2937" text-anchor="start">14 × 1.25 + 10 + 10  =  37.5 A ampacidad mín.</text><text x="60" y="1085" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Un límite máximo, no un objetivo — menor está bien.</text></svg>