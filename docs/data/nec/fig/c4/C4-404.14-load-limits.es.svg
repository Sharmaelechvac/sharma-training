<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">404.14 Qué puede llevar un interruptor de 15 A</title><desc id="d">Gráfico de barras para un interruptor de acción rápida de uso general de 15 A: resistivo 15 A, inductivo 15 A en interruptor AC pero 7.5 A en interruptor AC/DC, motor 12 A, tungsteno 15 A a 120 V en interruptor AC.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">404.14 Qué puede llevar un interruptor de 15 A</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El tipo de carga define el límite</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 404.14</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="60" y="230" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Carga resistiva</text><rect x="60" y="246" width="680.0" height="56" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="758.0" y="288" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">15 A</text><text x="60" y="342" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Capacidad nominal marcada completa, cualquier tipo de interruptor</text><text x="60" y="440" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Carga inductiva — interruptor de CA</text><rect x="60" y="456" width="680.0" height="56" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="758.0" y="498" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">15 A</text><text x="60" y="552" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Balastos y transformadores: valor nominal completo</text><text x="60" y="650" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Carga inductiva — interruptor AC/DC</text><rect x="60" y="666" width="340.0" height="56" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="418.0" y="708" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">7.5 A</text><text x="60" y="762" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Solo el 50 por ciento de la capacidad nominal</text><text x="60" y="860" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Carga de motor — interruptor AC</text><rect x="60" y="876" width="544.0" height="56" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="622.0" y="918" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">12 A</text><text x="60" y="972" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">80 por ciento del valor nominal, o el valor nominal en hp marcado</text><text x="60" y="1070" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Lámparas de tungsteno a 120 V — interruptor AC</text><rect x="60" y="1086" width="680.0" height="56" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="758.0" y="1128" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">15 A</text><text x="60" y="1182" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Valor nominal completo según 404.14(A)</text><rect x="60" y="1250" width="780" height="100" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1292" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">Interruptor AC/DC en lámparas de tungsteno:</text><text x="450" y="1338" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">solo si lleva clasificación T — 404.14(B)</text></svg>