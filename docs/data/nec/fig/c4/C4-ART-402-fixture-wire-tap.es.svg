<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1360" width="900" height="1360" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">402 Cable de luminaria: una derivación, nunca un tramo</title><desc id="d">Arriba: un interruptor de 20 A alimenta una caja de empalmes con cable de circuito derivado 12 AWG. Desde la caja, cable de luminaria 18 AWG baja a una luminaria; el tramo está dimensionado a 50 ft máximo. Abajo, en rojo: el cable de luminaria tendido de luminaria a luminaria está tachado, porque entre luminarias es cableado derivado, no una derivación.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1360" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">402 Cable de luminaria: una derivación, nunca un tramo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Látigo para luminaria alta en un circuito de 20 A.</text><line x1="30" y1="1302" x2="870" y2="1302" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1340" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 402.10, 402.12, 240.5(B)(2), Tabla 402.5</text><rect x="50" y="210" width="210" height="110" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="155" y="258" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">20 A</text><text x="155" y="298" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">interruptor</text><line x1="260" y1="265" x2="350" y2="265" stroke="#1f2937" stroke-width="5"/><text x="305" y="196" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">12 AWG</text><rect x="350" y="210" width="210" height="110" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="455" y="258" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">empalme</text><text x="455" y="298" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">caja</text><line x1="455" y1="320" x2="455" y2="640" stroke="#F0A846" stroke-width="7"/><text x="478" y="420" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">18 AWG cable de luminaria</text><text x="478" y="462" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">una derivación, una luminaria</text><line x1="415" y1="320" x2="415" y2="640" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="401" y="492.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">tramo ≤ 50 ft</text><text x="401" y="492.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">tramo ≤ 50 ft</text><path d="M365,640 L545,640 L505,706 L405,706 Z" stroke="#264387" stroke-width="3" fill="#eef2f9"/><line x1="405" y1="726" x2="391" y2="776" stroke="#F0A846" stroke-width="5"/><line x1="455" y1="726" x2="441" y2="776" stroke="#F0A846" stroke-width="5"/><line x1="505" y1="726" x2="491" y2="776" stroke="#F0A846" stroke-width="5"/><text x="455" y="830" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">luminaria</text><rect x="50" y="920" width="800" height="240" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><path d="M120,968 L250,968 L228,1016 L142,1016 Z" stroke="#c0392b" stroke-width="3" fill="#ffffff"/><line x1="250" y1="992" x2="610" y2="992" stroke="#c0392b" stroke-width="6"/><path d="M610,968 L740,968 L718,1016 L632,1016 Z" stroke="#c0392b" stroke-width="3" fill="#ffffff"/><circle cx="450" cy="992" r="30" fill="#ffffff" stroke="#c0392b" stroke-width="5"/><text x="450" y="1006" font-size="40" font-weight="900" fill="#c0392b" text-anchor="middle">✗</text><text x="450" y="1082" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">De luminaria a luminaria con cable de luminaria es</text><text x="450" y="1122" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">cableado derivado, no una conexión derivada</text></svg>