<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" width="900" height="1280" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">400.10 Qué puede hacer un cordón</title><desc id="d">Panel comparativo. En la lista de 400.10: luminarias colgantes, equipo portátil, aparatos movidos para limpieza o servicio y usos que necesitan flexibilidad. Fuera de la lista: alimentar una caja de salida fija, una carga permanente o cordones por paredes, techos o puertas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1280" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">400.10 Qué puede hacer un cordón</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El equipo se mueve — el edificio no</text><line x1="30" y1="1222" x2="870" y2="1222" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1260" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 400.10, 400.12</text><text x="870" y="1260" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="210" width="400" height="690" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><rect x="460" y="210" width="400" height="690" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="240" y="272" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="middle">EN LA LISTA</text><text x="660" y="272" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">FUERA DE LA LISTA</text><text x="64" y="356" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="start">✓</text><text x="112" y="356" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Colgante (suspendida)</text><text x="112" y="392" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">luminarias</text><text x="64" y="494" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="start">✓</text><text x="112" y="494" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Portátil</text><text x="112" y="530" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">equipo</text><text x="64" y="632" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="start">✓</text><text x="112" y="632" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Electrodomésticos movidos</text><text x="112" y="668" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">para limpieza / servicio</text><text x="64" y="770" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="start">✓</text><text x="112" y="770" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Usos que necesitan</text><text x="112" y="806" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">flexibilidad</text><text x="484" y="356" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗</text><text x="532" y="356" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Alimentar una caja fija</text><text x="532" y="392" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">caja de salida</text><text x="484" y="494" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗</text><text x="532" y="494" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Una permanente</text><text x="532" y="530" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">carga</text><text x="484" y="632" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗</text><text x="532" y="632" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">A través de paredes</text><text x="532" y="668" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">o techos</text><text x="484" y="770" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗</text><text x="532" y="770" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">A través de</text><text x="532" y="806" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">vanos de puerta</text><text x="40" y="990" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">¿No puede nombrar un uso de 400.10?</text><text x="40" y="1031" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Deténgase — pase tubo conduit o cable.</text></svg>