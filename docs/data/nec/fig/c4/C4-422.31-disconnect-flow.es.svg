<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">422.31 ¿Qué medio de desconexión cuenta?</title><desc id="d">Tabla de decisión para medios de desconexión de aparatos: los aparatos con motor sobre 1/8 hp necesitan un medio de desconexión a la vista o un interruptor de unidad 422.34; otros aparatos sobre 300 VA o 1/8 hp usan un interruptor o interruptor automático a la vista o bloqueable en abierto; los aparatos menores pueden usar el interruptor o interruptor automático del circuito derivado a la vista o bloqueable.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">422.31 ¿Qué medio de desconexión cuenta?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Aparatos conectados permanentemente</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 422.31 · 110.25 · Art. 100 A la vista</text><rect x="70" y="180" width="760" height="88" rx="12" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="236" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">APARATO CONECTADO PERMANENTEMENTE</text><line x1="450" y1="268" x2="450" y2="306" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="310" width="760" height="96" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="370" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">¿Accionado por motor, más de 1/8 hp?  —  422.31(C)</text><line x1="450" y1="406" x2="450" y2="448" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="472" y="438" font-size="32" font-weight="800" fill="#F0A846" text-anchor="start">SÍ</text><rect x="70" y="452" width="760" height="108" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="496" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">Medio de desconexión a la vista del aparato,</text><text x="450" y="540" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">o un interruptor de la unidad según 422.34</text><line x1="450" y1="560" x2="450" y2="606" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="472" y="594" font-size="32" font-weight="800" fill="#F0A846" text-anchor="start">NO</text><rect x="70" y="610" width="760" height="96" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="670" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">¿Capacidad sobre 300 VA o 1/8 hp?  —  422.31(B)</text><line x1="450" y1="706" x2="450" y2="748" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="472" y="738" font-size="32" font-weight="800" fill="#F0A846" text-anchor="start">SÍ</text><rect x="70" y="752" width="760" height="108" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="796" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">Interruptor o interruptor automático a la vista,</text><text x="450" y="840" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">o bloqueable abierto según 110.25</text><line x1="450" y1="860" x2="450" y2="906" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="472" y="894" font-size="32" font-weight="800" fill="#F0A846" text-anchor="start">NO</text><rect x="70" y="910" width="760" height="96" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="970" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">No más de 300 VA o 1/8 hp  —  422.31(A)</text><rect x="70" y="1022" width="760" height="108" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1066" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">El interruptor o disyuntor del circuito derivado</text><text x="450" y="1110" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">puede servir — a la vista o bloqueable</text><text x="70" y="1196" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">A LA VISTA — Artículo 100</text><text x="105" y="1250" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">APARATO</text><text x="795" y="1250" font-size="30" font-weight="700" fill="#5b6478" text-anchor="end">DESCONEXIÓN</text><circle cx="120" cy="1280" r="12" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="780" cy="1280" r="12" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="120" y1="1312" x2="780" y2="1312" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="1300" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">visible, no más de 50 ft</text><text x="450.0" y="1300" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">visible, no más de 50 ft</text><text x="70" y="1396" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">El herraje de bloqueo permanece en su lugar —</text><text x="70" y="1438" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">con o sin el candado puesto (110.25).</text></svg>