<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">424.4(B) Calefacción de espacios al 125%</title><desc id="d">Ejemplo resuelto de barras apiladas: un calentador de 10 kW a 41.7 A más un motor de soplador de 6 A suman 47.7 A conectados; por 125 por ciento es 59.6 A mínimo, cubierto por cobre 6 AWG a 65 A en un interruptor de 60 A.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">424.4(B) Calefacción de espacios al 125%</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Calefactor + motor primero, luego 125%</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 424.4(B)</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="40" y="262" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">Carga conectada: calefactor de 10 kW + motor del soplador</text><rect x="60" y="292" width="458" height="92" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="80" y="350" font-size="32" font-weight="800" fill="#ffffff" text-anchor="start">calentador 41.7 A</text><rect x="518" y="292" width="66" height="92" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="600" y="350" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">motor 6 A</text><text x="60" y="440" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">total conectado: 47.7 A</text><rect x="60" y="502" width="148" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="134.0" y="542" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">× 1.25</text><rect x="60" y="580" width="655" height="92" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="80" y="638" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">59.6 A mínimo</text><line x1="720" y1="560" x2="720" y2="700" stroke="#2e7d32" stroke-width="4" stroke-dasharray="12 9"/><text x="720" y="730" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">Interruptor de 60 A</text><line x1="775" y1="560" x2="775" y2="700" stroke="#1a2f61" stroke-width="4" stroke-dasharray="12 9"/><text x="775" y="730" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle"></text><text x="870" y="640" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="end">6 AWG Cu</text><text x="870" y="682" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="end">65 A</text><rect x="60" y="794" width="637" height="52" rx="26" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="378.5" y="832" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">✓ cobre 6 AWG en un interruptor de 60 A</text><rect x="40" y="900" width="820" height="160" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="962" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">✗ Solo el calefactor, motor olvidado: el cálculo</text><text x="64" y="1001" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">dice 52.1 A para un circuito que lleva más.</text><text x="40" y="1160" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Conductores e interruptor quedan ambos en 125%</text><text x="40" y="1199" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">(210.19(A)(1), 210.20(A)).</text></svg>