<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1640" width="900" height="1640" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">445 is the machine, Ch. 7 the system</title><desc id="d">One-line diagram of a dwelling standby generator: the listed generator on its pad outside the house, an outdoor shutdown device, feeder conductors sized at 115 percent of nameplate current, a transfer switch, and the house panel, with a worked conductor calculation.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1640" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">445 is the machine, Ch. 7 the system</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Whole-house standby unit, one-line view.</text><line x1="30" y1="1582" x2="870" y2="1582" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1620" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 445.6, 445.12, 445.13, 445.18(D)</text><rect x="50" y="300" width="300" height="210" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="200" y="385" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERATOR</text><text x="200" y="432" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">listed — 445.6</text><text x="200" y="472" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">22 kW · 240 V</text><line x1="40" y1="510" x2="360" y2="510" stroke="#264387" stroke-width="6"/><rect x="50" y="620" width="300" height="120" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="200" y="668" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">OUTDOOR</text><text x="200" y="712" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">SHUTDOWN</text><text x="200" y="782" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">outside the dwelling</text><line x1="320" y1="510" x2="320" y2="620" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 8"/><line x1="350" y1="370" x2="520" y2="370" stroke="#264387" stroke-width="5"/><line x1="350" y1="430" x2="520" y2="430" stroke="#264387" stroke-width="5"/><circle cx="435" cy="340" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="435" y="352" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="520" y="300" width="300" height="210" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="670" y="385" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TRANSFER</text><text x="670" y="432" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">SWITCH</text><text x="670" y="472" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">sized in Chapter 7</text><rect x="700" y="560" width="160" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="780" y="615" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">HOUSE</text><text x="780" y="655" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><line x1="780" y1="510" x2="780" y2="560" stroke="#264387" stroke-width="5"/><circle cx="86" cy="264" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="86" y="276" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="386" cy="680" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="386" y="692" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="50" y="860" width="810" height="190" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="80" y="922" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Feeder conductors — 445.13</text><text x="80" y="978" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Nameplate 92 A × 115% = 105.8 A</text><text x="80" y="1028" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Conductors rated at least 106 A</text><text x="50" y="1160" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Three checks on the machine itself</text><circle cx="76" cy="1218" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="76" y="1230" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="120" y="1230" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Listed stationary generator — 445.6</text><circle cx="76" cy="1296" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="76" y="1308" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="120" y="1308" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Conductors at 115% of nameplate — 445.13</text><circle cx="76" cy="1374" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="76" y="1386" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="120" y="1386" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Outdoor shutdown at a dwelling — 445.18(D)</text><rect x="50" y="1400" width="810" height="110" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="1448" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">Overload protection for the machine: 445.12.</text><text x="450" y="1492" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">What it may feed: Articles 700, 701, 702.</text></svg>