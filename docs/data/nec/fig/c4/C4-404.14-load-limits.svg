<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">404.14 What a 15 A switch may carry</title><desc id="d">Bar chart for a 15 ampere general-use snap switch: resistive 15 A, inductive 15 A on an AC switch but 7.5 A on an AC/DC switch, motor 12 A, tungsten 15 A at 120 volts on an AC switch.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">404.14 What a 15 A switch may carry</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The load type sets the limit</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 404.14</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="60" y="230" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Resistive load</text><rect x="60" y="246" width="680.0" height="56" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="758.0" y="288" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">15 A</text><text x="60" y="342" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Full marked rating, either switch type</text><text x="60" y="440" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Inductive load — AC switch</text><rect x="60" y="456" width="680.0" height="56" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="758.0" y="498" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">15 A</text><text x="60" y="552" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Ballasts and transformers: full rating</text><text x="60" y="650" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Inductive load — AC/DC switch</text><rect x="60" y="666" width="340.0" height="56" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="418.0" y="708" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">7.5 A</text><text x="60" y="762" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Only 50 percent of the rating</text><text x="60" y="860" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Motor load — AC switch</text><rect x="60" y="876" width="544.0" height="56" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="622.0" y="918" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">12 A</text><text x="60" y="972" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">80 percent of rating, or the marked hp rating</text><text x="60" y="1070" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Tungsten lamps at 120 V — AC switch</text><rect x="60" y="1086" width="680.0" height="56" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="758.0" y="1128" font-size="36" font-weight="900" fill="#1f2937" text-anchor="start">15 A</text><text x="60" y="1182" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Full rating under 404.14(A)</text><rect x="60" y="1250" width="780" height="100" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1292" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">AC/DC switch on tungsten lamps:</text><text x="450" y="1338" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">only if it carries a T rating — 404.14(B)</text></svg>