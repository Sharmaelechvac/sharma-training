<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">408.36 Protect the panelboard</title><desc id="d">Three one-line comparisons: a 100 A panel behind a 200 A breaker fails; the same panel behind a 100 A breaker is protected ahead of the board; a 100 A main breaker inside the panel also protects it.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">408.36 Protect the panelboard</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The breaker may not beat the bus — in or ahead of it</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 408.36</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="210" width="210" height="120" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="5"/><text x="145" y="268" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">200 A</text><text x="145" y="308" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">breaker</text><line x1="250" y1="270" x2="420" y2="270" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="428" y="210" width="300" height="120" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="578" y="262" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">100 A PANEL</text><text x="578" y="302" font-size="32" font-weight="800" fill="#F0A846" text-anchor="middle">main-lug only</text><rect x="760" y="240" width="123" height="52" rx="26" fill="#fbe9e7" stroke="#fbe9e7" stroke-width="0"/><text x="821.5" y="278" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">FAILS</text><text x="40" y="378" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Bus can see 200 A — the panel is the weak link.</text><rect x="40" y="520" width="210" height="120" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="5"/><text x="145" y="578" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">100 A</text><text x="145" y="618" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">breaker</text><line x1="250" y1="580" x2="420" y2="580" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="428" y="520" width="300" height="120" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="578" y="572" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">100 A PANEL</text><text x="578" y="612" font-size="32" font-weight="800" fill="#F0A846" text-anchor="middle">main-lug only</text><rect x="760" y="550" width="66" height="52" rx="26" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="793.0" y="588" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><text x="40" y="688" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Protected ahead of the board — the normal fix.</text><rect x="40" y="830" width="210" height="120" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="5"/><text x="145" y="888" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">200 A</text><text x="145" y="928" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">breaker</text><line x1="250" y1="890" x2="420" y2="890" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="428" y="830" width="300" height="120" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="578" y="882" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">100 A PANEL</text><text x="578" y="922" font-size="32" font-weight="800" fill="#F0A846" text-anchor="middle">100 A main inside</text><rect x="760" y="860" width="66" height="52" rx="26" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="793.0" y="898" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><text x="40" y="998" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Protected in the board — the main enforces 100 A.</text><text x="40" y="1180" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Narrow exceptions: split-bus services (230.71),</text><text x="40" y="1226" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">two mains with a combined rating, and existing</text><text x="40" y="1272" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">residential service panelboards.</text></svg>