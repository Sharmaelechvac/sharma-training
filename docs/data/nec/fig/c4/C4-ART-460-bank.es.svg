<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Banco de capacitores: dimensiónelo, descárguelo</title><desc id="d">Diagrama unifilar de un alimentador que suministra un banco de capacitores a través de un medio de desconexión, con conductores y medio de desconexión con capacidad nominal de al menos 135 por ciento, un medio de descarga en el banco, y un gráfico de barras que muestra el voltaje en terminales bajando de 480 V a 50 V o menos en 1 minuto.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Banco de capacitores: dimensiónelo, descárguelo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Diagrama unifilar arriba; el reloj de descarga de 460.6 abajo</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 460.6, 460.8(A), 460.12</text><rect x="40" y="250" width="190" height="110" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="135" y="296" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">ALIMENTADOR</text><text x="135" y="338" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">480 V</text><rect x="310" y="250" width="240" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="430" y="296" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">DESCONEXIÓN</text><text x="430" y="338" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">capacidad nominal ≥ 135%</text><circle cx="336" cy="224" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="336" y="236" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="660" y="230" width="200" height="150" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="760" y="296" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">CAPACITOR</text><text x="760" y="340" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">BANCO</text><circle cx="686" cy="204" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="686" y="216" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><line x1="230" y1="305" x2="310" y2="305" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><line x1="550" y1="305" x2="660" y2="305" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><text x="605" y="258" font-size="30" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≥ 135%</text><text x="605" y="258" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">≥ 135%</text><path d="M745,380 L745,420 L725,436 L765,452 L725,468 L765,484 L745,500 L745,530" stroke="#264387" stroke-width="4" fill="none"/><rect x="600" y="530" width="290" height="58" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="745" y="570" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">MEDIO DE DESCARGA</text><circle cx="570" cy="559" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="570" y="571" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="40" y="690" font-size="36" font-weight="800" fill="#264387" text-anchor="start">DESPUÉS DE QUE ABRE EL MEDIO DE DESCONEXIÓN</text><text x="40" y="762" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">En la abertura</text><rect x="270" y="722" width="440" height="58" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="726" y="762" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">480 V</text><text x="40" y="872" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Dentro de 1 min</text><rect x="270" y="832" width="46" height="58" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="332" y="872" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">≤ 50 V — 460.6</text><line x1="316" y1="706" x2="316" y2="910" stroke="#F0A846" stroke-width="4" stroke-dasharray="10 8"/><text x="316" y="945" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Límite de 50 V</text><rect x="40" y="956" width="565" height="50" rx="25" fill="#fdf3e0" stroke="#fdf3e0" stroke-width="0"/><text x="322.5" y="992" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Sobre 1000 V: 5 minutos hasta 50 V</text><rect x="650" y="824" width="180" height="70" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="740" y="872" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">MEDIDOR</text><circle cx="618" cy="859" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="618" y="871" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="70" y="1100" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Medio de desconexión — capacidad nominal ≥ 135% de la corriente nominal</text><text x="70" y="1146" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Banco — kvar y voltios de placa de datos (460.12)</text><text x="70" y="1192" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  Medio de descarga — disipa la carga almacenada</text><text x="70" y="1238" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">4  Verifique con un medidor antes de tocar</text></svg>