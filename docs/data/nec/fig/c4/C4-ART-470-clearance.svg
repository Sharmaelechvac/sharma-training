<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" width="900" height="1280" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Resistor bank: keep the heat zone clear</title><desc id="d">Elevation of a resistor bank on a wall with a 12 in heat zone beside it, stored boxes kept at least 12 in away or separated by a thermal barrier, dimensioned 12 in min.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1280" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Resistor bank: keep the heat zone clear</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elevation — bank on a wall, storage to the right</text><line x1="30" y1="1222" x2="870" y2="1222" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1260" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 470.2, 470.3</text><text x="870" y="1260" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="120" y1="210" x2="120" y2="770" stroke="#264387" stroke-width="6"/><line x1="60" y1="770" x2="860" y2="770" stroke="#264387" stroke-width="6"/><rect x="140" y="330" width="300" height="280" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><path d="M170,390 l30,-22 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-22" stroke="#c0392b" stroke-width="4" fill="none"/><path d="M170,470 l30,-22 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-22" stroke="#c0392b" stroke-width="4" fill="none"/><path d="M170,550 l30,-22 l30,44 l30,-44 l30,44 l30,-44 l30,44 l30,-22" stroke="#c0392b" stroke-width="4" fill="none"/><text x="315" y="306" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">RESISTOR BANK</text><circle cx="166" cy="304" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="166" y="316" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="440" y="330" width="180" height="280" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="12 8"/><text x="530" y="380" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">HEAT ZONE</text><circle cx="466" cy="584" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="466" y="596" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="620" y="470" width="220" height="140" rx="0" fill="#ffffff" stroke="#5b6478" stroke-width="4"/><line x1="620" y1="540" x2="840" y2="540" stroke="#5b6478" stroke-width="3"/><line x1="730" y1="470" x2="730" y2="610" stroke="#5b6478" stroke-width="3"/><text x="730" y="660" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">stored boxes</text><circle cx="646" cy="444" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="646" y="456" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><line x1="440" y1="640" x2="440" y2="732" stroke="#1a2f61" stroke-width="2"/><line x1="620" y1="640" x2="620" y2="732" stroke="#1a2f61" stroke-width="2"/><line x1="440" y1="720" x2="620" y2="720" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="530.0" y="708" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 in min</text><text x="530.0" y="708" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">12 in min</text><text x="530" y="800" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">or a thermal barrier in between</text><rect x="90" y="860" width="720" height="66" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="903" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">FAIL: storage inside 12 in, no barrier — 470.3</text><text x="70" y="1010" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Resistor bank — makes heat by design</text><text x="70" y="1056" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Heat zone — keep it empty</text><text x="70" y="1102" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  Combustibles — 12 in away or a barrier</text></svg>