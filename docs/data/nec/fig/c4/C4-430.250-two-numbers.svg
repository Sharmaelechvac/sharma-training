<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">One motor, two numbers</title><desc id="d">Flow diagram: the table full-load current sizes conductors, disconnect and fault protection, while the nameplate current sets only the overload protection.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1100" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">One motor, two numbers</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked case: 5 hp at 230 V, single-phase</text><line x1="30" y1="1042" x2="870" y2="1042" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1080" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.6, Tables 430.248 / 430.250</text><rect x="235" y="205" width="430" height="125" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="258" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">MOTOR</text><text x="450" y="302" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">5 hp · 230 V · 1-phase</text><line x1="360" y1="330" x2="250" y2="428" stroke="#264387" stroke-width="3" marker-end="url(#ah)"/><line x1="540" y1="330" x2="650" y2="428" stroke="#264387" stroke-width="3" marker-end="url(#ah)"/><rect x="55" y="440" width="296" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="203.0" y="474" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLE FLC — 28 A</text><rect x="582" y="440" width="263" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="713.5" y="474" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">NAMEPLATE AMPS</text><rect x="30" y="510" width="405" height="92" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="55" y="550" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Conductors (430.22)</text><text x="55" y="588" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">125% × 28 A = 35 A</text><rect x="30" y="622" width="405" height="92" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="55" y="662" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Disconnect switch</text><text x="55" y="700" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">from the table value</text><rect x="30" y="734" width="405" height="92" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="55" y="774" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Fault protection</text><text x="55" y="812" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Table 430.52 percentages</text><rect x="465" y="510" width="405" height="92" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="490" y="550" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Overload protection</text><text x="490" y="588" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">430.32 settings</text><rect x="465" y="622" width="405" height="92" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="490" y="662" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Same-hp replacement:</text><text x="490" y="700" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">same table FLC</text><rect x="465" y="734" width="405" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="490" y="774" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Nameplate NOT used for</text><text x="490" y="812" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">wire or fault sizing</text><rect x="30" y="872" width="840" height="100" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="914" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Swap the two and the job is wrong:</text><text x="450" y="956" font-size="32" font-weight="600" fill="#c0392b" text-anchor="middle">nameplate-sized wire is undersized wire.</text></svg>