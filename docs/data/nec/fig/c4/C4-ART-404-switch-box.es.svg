 y="0" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">48 in al centro (S-05)</text></g><line x1="800" y1="232" x2="800" y2="1180" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(788,706.0) rotate(-90)"><text x="0" y="0" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft 7 in máx. (404.8(A))</text><text x="0" y="0" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft 7 in máx. (404.8(A))</text></g><circle cx="560" cy="604" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="560" y="616" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="340" cy="604" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="340" y="616" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="46" cy="1289" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1301" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="82" y="1300" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Neutro en la caja — controles electrónicos</text><text x="82" y="1340" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">pueden alimentarse solos (404.2(C))</text><circle cx="46" cy="1381" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1393" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="82" y="1392" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">El interruptor interrumpe el conductor caliente,</text><text x="82" y="1432" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">nunca el neutro solo (404.2(A))</text></svg>