<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1330" width="900" height="1330" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">406.9(C) La zona de bañera y ducha</title><desc id="d">Elevación de baño. Una bañera a la izquierda con una zona sombreada en rojo sobre ella y a su lado: la zona se extiende 3 ft horizontalmente desde la bañera y 8 ft verticalmente desde el borde de la bañera. No se permiten receptáculos en la zona. Un tocador con lavabo está fuera de la zona, con un receptáculo encima marcado con una marca de verificación verde.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1330" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">406.9(C) La zona de bañera y ducha</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elevación. Zona medida desde la parte superior del borde de la bañera.</text><line x1="30" y1="1272" x2="870" y2="1272" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 406.9(C), 210.52(D)</text><rect x="60" y="429" width="640" height="496" rx="0" fill="url(#hatchred)" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 7"/><text x="380" y="487" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">SIN RECEPTÁCULOS</text><text x="380" y="533" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">en la zona</text><rect x="60" y="925" width="380" height="155" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="84" y1="959" x2="416" y2="959" stroke="#c9d2e3" stroke-width="3"/><text x="250" y="1030" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">bañera</text><line x1="40" y1="1080" x2="860" y2="1080" stroke="#1f2937" stroke-width="6"/><line x1="440" y1="388" x2="700" y2="388" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="570.0" y="376" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">Zona de 3 ft</text><text x="570.0" y="376" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Zona de 3 ft</text><line x1="668" y1="925" x2="668" y2="429" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="654" y="689.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">Zona de 8 ft</text><text x="654" y="689.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">Zona de 8 ft</text><rect x="716" y="972" width="144" height="108" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><path d="M736,972 q52,34 104,0" stroke="#264387" stroke-width="4" fill="none"/><text x="788" y="1128" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">lavabo</text><rect x="762" y="742" width="52" height="84" rx="8" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="776" y1="766" x2="776" y2="786" stroke="#1a2f61" stroke-width="4"/><line x1="800" y1="766" x2="800" y2="786" stroke="#1a2f61" stroke-width="4"/><line x1="776" y1="792" x2="776" y2="812" stroke="#1a2f61" stroke-width="4"/><line x1="800" y1="792" x2="800" y2="812" stroke="#1a2f61" stroke-width="4"/><text x="838" y="800" font-size="44" font-weight="900" fill="#2e7d32" text-anchor="middle">✓</text><text x="788" y="706" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">receptáculo</text><text x="788" y="668" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">fuera de la zona</text><text x="60" y="1210" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">¿Baño pequeño? La excepción pone el requerido</text><text x="60" y="1252" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">receptáculo en la pared más lejana, frente a la bañera.</text></svg>