<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">408.6 SCCR must cover the fault current</title><desc id="d">Bar chart comparing the available fault current of 22,000 A with three panelboard short-circuit current ratings: 10,000 A fails, 22,000 A passes, 65,000 A passes.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">408.6 SCCR must cover the fault current</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked example — 22,000 A at the service</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 408.6 · 110.9 · 110.24</text><line x1="322.57142857142856" y1="205" x2="322.57142857142856" y2="985" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 8"/><text x="90" y="250" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">AVAILABLE FAULT CURRENT</text><rect x="90" y="266" width="232.57142857142858" height="62" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="338.57142857142856" y="310" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">22,000 A</text><text x="90" y="445" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PANEL A — SCCR 10,000 A</text><rect x="90" y="461" width="105.71428571428572" height="62" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="211.71428571428572" y="505" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">10,000 A</text><text x="90" y="567" font-size="33" font-weight="700" fill="#c0392b" text-anchor="start">FAILS — rating below the fault current</text><text x="90" y="640" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PANEL B — SCCR 22,000 A</text><rect x="90" y="656" width="232.57142857142858" height="62" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="308.57142857142856" y="700" font-size="36" font-weight="800" fill="#ffffff" text-anchor="end">22,000 A</text><text x="90" y="762" font-size="33" font-weight="700" fill="#2e7d32" text-anchor="start">OK — rating covers the fault current</text><text x="90" y="835" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PANEL C — SCCR 65,000 A</text><rect x="90" y="851" width="687.1428571428572" height="62" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="763.1428571428572" y="895" font-size="36" font-weight="800" fill="#ffffff" text-anchor="end">65,000 A</text><text x="90" y="957" font-size="33" font-weight="700" fill="#2e7d32" text-anchor="start">OK — rating covers it with room to spare</text><rect x="60" y="1030" width="780" height="130" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="90" y="1082" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Matching volts and amps is not enough.</text><text x="90" y="1123" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Compare both numbers before ordering.</text></svg>