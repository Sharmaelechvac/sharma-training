<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" width="900" height="1280" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Generador de reserva: el listado es el requisito</title><desc id="d">Flujo de cuatro pasos: obtenga el modelo exacto al cotizar, confirme la etiqueta de listado en la unidad, ponga el manual de instalación en el expediente del trabajo y luego instale la base; un recuadro rojo de alto advierte que sin listado debe detenerse.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1280" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Generador de reserva: el listado es el requisito</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Revíselo en la cotización — antes de vaciar la base</text><line x1="30" y1="1222" x2="870" y2="1222" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1260" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 445.6, 110.3(B), 445.18</text><rect x="170" y="210" width="560" height="110" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="258" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">MODELO EXACTO</text><text x="450" y="302" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Obtenga el número de modelo al cotizar</text><circle cx="196" cy="242" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="196" y="254" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="450" y1="320" x2="450" y2="385" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="170" y="385" width="560" height="110" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="433" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">LISTADO EN LA UNIDAD</text><text x="450" y="477" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Listado es el requisito del código — 445.6</text><circle cx="196" cy="417" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="196" y="429" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><line x1="450" y1="495" x2="450" y2="560" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="170" y="560" width="560" height="110" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="608" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">MANUAL EN EL ARCHIVO DEL TRABAJO</text><text x="450" y="652" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">110.3(B) lo hace exigible</text><circle cx="196" cy="592" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="196" y="604" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><line x1="450" y1="670" x2="450" y2="735" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="170" y="735" width="560" height="110" rx="12" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="450" y="783" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">LUEGO COLOQUE LA BASE</text><text x="450" y="827" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Distancias libres y apagado</text><circle cx="196" cy="767" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="196" y="779" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><rect x="110" y="920" width="680" height="120" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="972" font-size="40" font-weight="800" fill="#c0392b" text-anchor="middle">SIN LISTADO = DETÉNGASE</text><text x="450" y="1018" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Una unidad de mercado gris no es un descuento.</text><text x="450" y="1110" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">2020: listado requerido a 600 V o menos</text><text x="450" y="1154" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">2023: listado a cualquier voltaje — vea la nota de edición</text></svg>