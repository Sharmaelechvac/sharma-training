<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1760" width="900" height="1760" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">406.4(D) Reemplazo de un receptáculo</title><desc id="d">Diagrama de decisión para reemplazo de receptáculos: con tierra de equipo en la caja, use un receptáculo tipo puesta a tierra; sin tierra, las tres vías permitidas de 406.4(D)(2), cada una con su marcado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1760" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">406.4(D) Reemplazo de un receptáculo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Primera pregunta: ¿hay tierra en la caja?</text><line x1="30" y1="1702" x2="870" y2="1702" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1740" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 406.4(D), 250.130(C)</text><rect x="120" y="200" width="660" height="100" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="244" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">REEMPLAZO DE RECEPTÁCULO</text><text x="450" y="282" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">Pruebe la caja en busca de tierra del equipo</text><line x1="450" y1="300" x2="450" y2="342" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="350" width="820" height="220" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="70" y="408" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">SÍ — EGC EN LA CAJA</text><text x="70" y="472" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Receptáculo con puesta a tierra — conecte el</text><text x="70" y="511" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">terminal de tierra al EGC.  406.4(D)(1)</text><rect x="40" y="600" width="820" height="550" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="70" y="658" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">SIN EGC — LAS TRES VÍAS DE (D)(2)</text><rect x="70" y="690" width="760" height="120" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="94" y="742" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">(a) Receptáculo sin puesta a tierra</text><text x="94" y="786" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Sin marcado requerido</text><rect x="70" y="830" width="760" height="120" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="94" y="882" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">(b) Receptáculo tipo GFCI</text><text x="94" y="926" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">Marca: SIN PUESTA A TIERRA DEL EQUIPO</text><rect x="70" y="970" width="760" height="150" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="94" y="1022" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">(c) Tipo con puesta a tierra, a través de un GFCI</text><text x="94" y="1066" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">Marque: PROTEGIDO POR GFCI</text><text x="94" y="1100" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">+ SIN PUESTA A TIERRA DEL EQUIPO</text><rect x="40" y="1180" width="820" height="250" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="1238" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NUNCA UNA RUTA PERMITIDA</text><text x="70" y="1288" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Un receptáculo estándar con puesta a tierra en un</text><text x="70" y="1328" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">circuito sin puesta a tierra, dejado sin marcar.</text><text x="70" y="1368" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Tierra falsa: neutro puenteado a</text><text x="70" y="1408" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">el tornillo de tierra.</text><rect x="40" y="1470" width="820" height="190" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="1528" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">¿GFCI / AFCI / TR / WR REQUERIDOS HOY?</text><text x="70" y="1580" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">El reemplazo debe proporcionarlo —</text><text x="70" y="1624" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">406.4(D)(3) a (D)(6).</text></svg>