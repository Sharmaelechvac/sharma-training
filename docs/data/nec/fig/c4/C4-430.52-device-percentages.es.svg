<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1270" width="900" height="1270" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Límites de protección contra fallas</title><desc id="d">Gráfico de barras de los porcentajes máximos de la Tabla 430.52 por tipo de dispositivo, con el ejemplo resuelto de un motor de 5 hp 230 V con FLC de tabla de 28 A que lleva un interruptor de tiempo inverso de 70 A.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1270" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Límites de protección contra fallas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Valor nominal máx., % del FLC de tabla</text><line x1="30" y1="1212" x2="870" y2="1212" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1250" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Tabla 430.52, 430.52(C)(1), (C)(3)</text><text x="40" y="238" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Interruptor de tiempo inverso — 250%</text><rect x="40" y="250" width="250" height="54" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="40" y="356" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Fusible de doble elemento (con retardo) — 175%</text><rect x="40" y="368" width="175" height="54" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="40" y="474" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Fusible sin retardo — 300%</text><rect x="40" y="486" width="300" height="54" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="40" y="592" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Interruptor de disparo instantáneo — 800%</text><rect x="40" y="604" width="800" height="54" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="30" y="716" width="840" height="272" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="60" y="770" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Ejemplo resuelto — motor de 5 hp, 230 V</text><text x="60" y="824" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Tabla FLC: 28 A</text><text x="60" y="868" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Interruptor de tiempo inverso: 28 × 250% = 70 A máx.</text><text x="60" y="912" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Conductores: 28 × 125% = 35 A (430.22)</text><text x="60" y="956" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Sobrecarga: desde la placa de datos (430.32)</text><rect x="30" y="1030" width="840" height="92" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1088" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Sobre el techo, sin excepción = observación</text></svg>