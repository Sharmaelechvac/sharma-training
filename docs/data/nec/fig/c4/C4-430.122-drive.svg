<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1360" width="900" height="1360" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">430.122: Two sides of the drive, two rules</title><desc id="d">Two lanes: supply conductors sized at 125 percent of the drive rated input current (nameplate INPUT 460 V 21 A gives 26.25 A minimum) feed the drive; output conductors to the motor are sized at 125 percent of motor full-load current per 430.6. A fail strip warns against sizing the input from the motor horsepower table.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1360" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">430.122: Two sides of the drive, two rules</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Input from the drive plate — output from the motor</text><line x1="30" y1="1302" x2="870" y2="1302" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1340" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.122(A), 430.122(B), 430.6</text><text x="60" y="210" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">SUPPLY SIDE — 430.122(A)</text><rect x="60" y="240" width="190" height="120" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="155" y="312" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><line x1="250" y1="300" x2="330" y2="300" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="340" y="240" width="230" height="120" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="455" y="292" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">125% OF</text><text x="455" y="332" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">INPUT AMPS</text><line x1="570" y1="300" x2="650" y2="300" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="660" y="210" width="200" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="760" y="262" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">DRIVE</text><text x="760" y="306" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">INPUT</text><text x="760" y="342" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">460 V — 21 A</text><text x="760" y="380" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">(nameplate)</text><text x="450" y="440" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">21 A × 1.25 = 26.25 A min conductor ampacity</text><text x="60" y="540" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">OUTPUT SIDE — 430.122(B)</text><rect x="60" y="570" width="200" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="160" y="642" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">DRIVE</text><line x1="260" y1="630" x2="340" y2="630" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="350" y="570" width="260" height="120" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="480" y="622" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">125% OF MOTOR</text><text x="480" y="660" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">FLC — 430.6</text><line x1="610" y1="630" x2="690" y2="630" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="700" y="570" width="160" height="120" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="780" y="642" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">MOTOR</text><rect x="60" y="760" width="780" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="808" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DRIVE HAS A BYPASS?</text><text x="450" y="846" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">size for the larger demand — 430.122(C)</text><rect x="60" y="920" width="780" height="130" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="972" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">FAIL: INPUT WIRE SIZED FROM</text><text x="450" y="1014" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">the motor horsepower table</text><rect x="60" y="1100" width="780" height="130" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="1152" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">RETROFIT RULE: PHOTOGRAPH THE</text><text x="450" y="1194" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">drive input rating before ordering wire</text></svg>