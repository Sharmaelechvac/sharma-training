<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1330" width="900" height="1330" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">406.9(C) The tub and shower zone</title><desc id="d">Bathroom elevation. A bathtub at the left with a red hatched zone over it and beside it: the zone runs 3 ft horizontally out from the tub and 8 ft vertically up from the tub rim. No receptacles are allowed in the zone. A vanity with a basin stands outside the zone, with a receptacle above it marked with a green check.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1330" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">406.9(C) The tub and shower zone</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elevation. Zone measured from the top of the tub rim.</text><line x1="30" y1="1272" x2="870" y2="1272" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 406.9(C), 210.52(D)</text><rect x="60" y="429" width="640" height="496" rx="0" fill="url(#hatchred)" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 7"/><text x="380" y="487" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">NO RECEPTACLES</text><text x="380" y="533" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">in the zone</text><rect x="60" y="925" width="380" height="155" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="84" y1="959" x2="416" y2="959" stroke="#c9d2e3" stroke-width="3"/><text x="250" y="1030" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">tub</text><line x1="40" y1="1080" x2="860" y2="1080" stroke="#1f2937" stroke-width="6"/><line x1="440" y1="388" x2="700" y2="388" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="570.0" y="376" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">3 ft zone</text><text x="570.0" y="376" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3 ft zone</text><line x1="668" y1="925" x2="668" y2="429" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="654" y="689.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">8 ft zone</text><text x="654" y="689.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">8 ft zone</text><rect x="716" y="972" width="144" height="108" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><path d="M736,972 q52,34 104,0" stroke="#264387" stroke-width="4" fill="none"/><text x="788" y="1128" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">basin</text><rect x="762" y="742" width="52" height="84" rx="8" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="776" y1="766" x2="776" y2="786" stroke="#1a2f61" stroke-width="4"/><line x1="800" y1="766" x2="800" y2="786" stroke="#1a2f61" stroke-width="4"/><line x1="776" y1="792" x2="776" y2="812" stroke="#1a2f61" stroke-width="4"/><line x1="800" y1="792" x2="800" y2="812" stroke="#1a2f61" stroke-width="4"/><text x="838" y="800" font-size="44" font-weight="900" fill="#2e7d32" text-anchor="middle">✓</text><text x="788" y="706" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">receptacle</text><text x="788" y="668" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">outside zone</text><text x="60" y="1210" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Small bath? The exception puts the required</text><text x="60" y="1252" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">receptacle on the farthest wall opposite the tub.</text></svg>