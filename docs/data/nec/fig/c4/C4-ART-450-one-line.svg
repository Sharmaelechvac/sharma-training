<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">450.3 Protection: worked example</title><desc id="d">One-line diagram of the 45 kVA worked example: 480 V primary at about 54 A, a 70 A primary breaker at 125 percent, the transformer, and the 208Y/120 V secondary panel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1250" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">450.3 Protection: worked example</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">45 kVA dry-type, 480 V to 208Y/120 V, primary-only</text><line x1="30" y1="1192" x2="870" y2="1192" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1230" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Table 450.3(B)</text><text x="870" y="1230" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="230" width="190" height="120" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="135" y="282" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">480 V</text><text x="135" y="326" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">primary</text><line x1="230" y1="290" x2="300" y2="290" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="308" y="230" width="170" height="120" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="393" y="282" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">70 A</text><text x="393" y="326" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">breaker</text><line x1="478" y1="290" x2="512" y2="290" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><circle cx="560" cy="290" r="52" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="610" cy="290" r="52" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="585" y="392" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">45 kVA dry-type</text><line x1="662" y1="290" x2="706" y2="290" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="714" y="230" width="146" height="120" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="787" y="282" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">PANEL</text><text x="787" y="326" font-size="30" font-weight="800" fill="#F0A846" text-anchor="middle">208Y/120</text><text x="450" y="452" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">Secondary conductors protected per 240.21(C)</text><rect x="40" y="540" width="820" height="130" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="100" cy="605" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="100" y="617" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="150" y="598" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Rated primary current</text><text x="150" y="644" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">45 kVA at 480 V, 3-phase ≈ 54 A</text><rect x="40" y="700" width="820" height="130" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="100" cy="765" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="100" y="777" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="150" y="758" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Pick the table row</text><text x="150" y="804" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Primary only, 9 A or more: 125%</text><rect x="40" y="860" width="820" height="130" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="100" cy="925" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="100" y="937" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="150" y="918" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Do the math</text><text x="150" y="964" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">54 x 1.25 = 67.5 — next standard: 70 A</text></svg>