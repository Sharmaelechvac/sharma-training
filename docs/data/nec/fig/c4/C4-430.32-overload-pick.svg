<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">430.32 Picking the overload</title><desc id="d">Flow diagram for selecting a motor overload: read the nameplate, pick 125 or 115 percent by the service factor and rise markings, step up only to the 430.32(C) ceiling, with a worked 19 ampere example.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">430.32 Picking the overload</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Nameplate FLA sets the overload</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.32(A)(1), 430.32(C)</text><rect x="110" y="195" width="680" height="120" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="245" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">READ THE NAMEPLATE</text><text x="450" y="292" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">FLA · service factor · temp rise</text><line x1="450" y1="320" x2="450" y2="355" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="360" width="410" height="230" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="235" y="415" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">SF 1.15 OR MORE</text><text x="235" y="455" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">or rise 40 °C or less</text><text x="235" y="540" font-size="48" font-weight="900" fill="#1a2f61" text-anchor="middle">125%</text><text x="235" y="578" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">of nameplate FLA</text><rect x="460" y="360" width="410" height="230" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="665" y="415" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">ALL OTHER MOTORS</text><text x="665" y="455" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">no qualifying marks</text><text x="665" y="540" font-size="48" font-weight="900" fill="#1a2f61" text-anchor="middle">115%</text><text x="665" y="578" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">of nameplate FLA</text><line x1="450" y1="595" x2="450" y2="630" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="635" width="820" height="120" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="685" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">WON'T START OR CARRY THE LOAD?</text><text x="450" y="728" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">Step up max 140% / 130% — 430.32(C)</text><rect x="40" y="785" width="820" height="150" rx="12" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="70" y="838" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">WORKED EXAMPLE — 3 hp, 230 V POOL PUMP</text><text x="70" y="885" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Nameplate 15.2 A × 125% = 19.0 A</text><text x="70" y="927" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Set the overload at 19 A</text><rect x="40" y="965" width="820" height="110" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="1015" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">TRIPPING? FIND THE CAUSE</text><text x="70" y="1057" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Never cure trips by oversizing the overload</text></svg>