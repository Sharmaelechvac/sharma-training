ver cualquiera</text><text x="75" y="1056" font-size="32" font-weight="600" fill="#c0392b" text-anchor="start">no es un sistema del Artículo 411</text><circle cx="63" cy="1175" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="63" y="1186" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="102" y="1186" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">La fuente de alimentación listada inicia el sistema</text><circle cx="63" cy="1235" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="63" y="1246" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="102" y="1246" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Salida secundaria limitada a 25 A</text><circle cx="63" cy="1295" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="63" y="1306" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="102" y="1306" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Solo luminarias y cable listados</text><circle cx="63" cy="1355" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="63" y="1366" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="102" y="1366" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Mantenga 10 ft del agua de la piscina — 411.5</text></svg>