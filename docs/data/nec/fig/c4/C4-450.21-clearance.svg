<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Where a dry-type may sit</title><desc id="d">Plan view of a dry-type transformer rated 112.5 kVA or less with a dimensioned 12 inch minimum clearance to a combustible wall, and a second panel showing a unit over 112.5 kVA in a 1-hour fire-resistant transformer room with the Exception No. 1 alternatives.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Where a dry-type may sit</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plan view: units of 112½ kVA or less</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 450.21(A), (B) · 450.9</text><rect x="40" y="200" width="820" height="510" rx="14" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><rect x="70" y="230" width="760" height="46" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="4"/><text x="90" y="264" font-size="32" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">COMBUSTIBLE WALL</text><text x="90" y="264" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">COMBUSTIBLE WALL</text><rect x="70" y="282" width="760" height="178" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="10 8"/><text x="450" y="384" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CLEAR ZONE</text><rect x="300" y="460" width="300" height="170" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="530" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">DRY-TYPE</text><text x="450" y="574" font-size="34" font-weight="800" fill="#F0A846" text-anchor="middle">≤ 112½ kVA</text><line x1="796" y1="282" x2="796" y2="460" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="782" y="383.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 in min</text><text x="782" y="383.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">12 in min</text><text x="450" y="682" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Or a fire-resistant, heat-insulating barrier</text><text x="40" y="790" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">OVER 112½ kVA — THE ROOM RULE</text><rect x="40" y="820" width="470" height="420" rx="6" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="275" y="878" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">TRANSFORMER ROOM</text><text x="275" y="920" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Fire-resistant construction</text><text x="275" y="962" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">1-hour rating minimum</text><rect x="160" y="1010" width="230" height="150" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="275" y="1072" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DRY-TYPE</text><text x="275" y="1112" font-size="32" font-weight="800" fill="#F0A846" text-anchor="middle">&gt; 112½ kVA</text><text x="540" y="878" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Exception No. 1:</text><text x="540" y="924" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Class 155 or higher</text><text x="540" y="968" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">insulation, with:</text><text x="540" y="1012" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• a fire-resistant barrier, or</text><text x="540" y="1056" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• 6 ft horizontal and</text><text x="540" y="1100" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  12 ft vertical from</text><text x="540" y="1144" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  combustible material</text></svg>