<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1760" width="900" height="1760" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">430.109: qué puede desconectarlo</title><desc id="d">Tabla de decisión para medios de desconexión de motores: motores estacionarios de 1/8 hp o menos pueden usar el dispositivo de sobrecorriente del circuito derivado; motores estacionarios de 2 hp o menos a 300 voltios o menos pueden usar un interruptor de uso general con capacidad nominal de al menos el doble de la corriente a plena carga, calculado para un motor de 1/2 hp, 115 voltios, a 9.8 amperios; todos los demás motores necesitan un dispositivo con capacidad nominal en hp según 430.109(A).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1760" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">430.109: qué puede desconectarlo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elija la ruta según el motor que tiene enfrente.</text><line x1="30" y1="1702" x2="870" y2="1702" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1740" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.109, 430.110, 430.102</text><rect x="300" y="210" width="300" height="100" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="272" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">EL MOTOR</text><line x1="450" y1="310" x2="450" y2="360" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="400" width="800" height="200" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="85" y="458" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">1/8 HP O MENOS, ESTACIONARIO</text><text x="85" y="512" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">El dispositivo de sobrecorriente del circuito derivado</text><text x="85" y="556" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">puede servir como medio de desconexión — 430.109(B)</text><rect x="60" y="640" width="800" height="250" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="85" y="698" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">2 HP O MENOS Y 300 V O MENOS</text><text x="85" y="752" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Interruptor de uso general con capacidad de al menos</text><text x="85" y="796" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">el doble de la corriente a plena carga del motor —</text><text x="85" y="840" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">430.109(C)(1), o un interruptor de acción rápida de CA</text><text x="85" y="884" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">con el motor al 80% o menos — (C)(2)</text><rect x="60" y="1010" width="800" height="250" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="85" y="1068" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">TODOS LOS DEMÁS MOTORES</text><text x="85" y="1122" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Un dispositivo 430.109(A): con capacidad nominal en hp</text><text x="85" y="1166" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">interruptor, interruptor listado de caja moldeada o</text><text x="85" y="1210" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">interruptor, o un controlador adicionalmente</text><text x="85" y="1254" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">marcado “Apto como medio de desconexión de motor”</text><rect x="60" y="910" width="800" height="90" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="968" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">1/2 hp, 115 V: 9.8 A × 2 = 19.6 A mín.</text><rect x="60" y="1300" width="800" height="130" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1358" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Los amperios solos no califican un interruptor.</text><text x="450" y="1406" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Capacidad en caballos de fuerza — o la ruta del motor pequeño.</text><rect x="60" y="1470" width="800" height="130" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="1528" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Dimensiónelo al 115% del FLC de tabla — 430.110.</text><text x="450" y="1576" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Manténgalo a la vista — 430.102.</text></svg>