<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">408.4(A) El directorio de circuitos</title><desc id="d">Un tablero con su tarjeta de directorio de circuitos: entradas específicas como receptáculos del dormitorio NE y calentador de agua aprueban, las reservas se marcan como reservas, y entradas genéricas como enchufes, luces y BR no aprueban.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">408.4(A) El directorio de circuitos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Específico, en el sitio y actualizado.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 408.4(A)</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="200" width="780" height="800" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="90" y="240" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="190" y="240" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="312" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="190" y="312" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="384" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="190" y="384" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="456" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="190" y="456" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="528" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="190" y="528" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="600" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="190" y="600" width="80" height="52" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="300" y="240" width="510" height="560" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="555" y="292" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">DIRECTORIO DE CIRCUITOS</text><line x1="324" y1="312" x2="786" y2="312" stroke="#c9d2e3" stroke-width="3"/><text x="324" y="366" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">1  receptáculos de dormitorio NE</text><text x="786" y="366" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="end">OK</text><text x="324" y="422" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">3  Calentador de agua</text><text x="786" y="422" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="end">OK</text><text x="324" y="478" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">5  GFCI de encimera de cocina</text><text x="786" y="478" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="end">OK</text><text x="324" y="534" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">7  Reserva</text><text x="786" y="534" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="end">OK</text><line x1="324" y1="564" x2="786" y2="564" stroke="#c9d2e3" stroke-width="3"/><text x="324" y="604" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">9  Enchufes</text><text x="786" y="604" font-size="30" font-weight="800" fill="#c0392b" text-anchor="end">NO</text><text x="324" y="660" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">11  Luces</text><text x="786" y="660" font-size="30" font-weight="800" fill="#c0392b" text-anchor="end">NO</text><text x="324" y="716" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">13  BR</text><text x="786" y="716" font-size="30" font-weight="800" fill="#c0392b" text-anchor="end">NO</text><text x="120" y="1080" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Diga el propósito o uso — en este edificio.</text><text x="120" y="1121" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Los repuestos se marcan como repuestos.</text><text x="120" y="1162" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Actualícelo cuando cambien los circuitos.</text></svg>