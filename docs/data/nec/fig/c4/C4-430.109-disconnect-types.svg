<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1760" width="900" height="1760" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">430.109: what may disconnect it</title><desc id="d">Decision chart for motor disconnecting means: stationary motors of 1/8 horsepower or less may use the branch-circuit overcurrent device; stationary motors of 2 horsepower or less at 300 volts or less may use a general-use switch rated at least twice the full-load current, worked for a 1/2 horsepower 115 volt motor at 9.8 amps; all other motors need a horsepower-rated device from 430.109(A).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1760" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">430.109: what may disconnect it</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Pick the path by the motor in front of you.</text><line x1="30" y1="1702" x2="870" y2="1702" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1740" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.109, 430.110, 430.102</text><rect x="300" y="210" width="300" height="100" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="272" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">THE MOTOR</text><line x1="450" y1="310" x2="450" y2="360" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="400" width="800" height="200" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="85" y="458" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">1/8 HP OR LESS, STATIONARY</text><text x="85" y="512" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">The branch-circuit overcurrent device</text><text x="85" y="556" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">may serve as the disconnect — 430.109(B)</text><rect x="60" y="640" width="800" height="250" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="85" y="698" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">2 HP OR LESS AND 300 V OR LESS</text><text x="85" y="752" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">General-use switch rated at least</text><text x="85" y="796" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">twice the motor full-load current —</text><text x="85" y="840" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">430.109(C)(1), or an AC snap switch</text><text x="85" y="884" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">with the motor at 80% or less — (C)(2)</text><rect x="60" y="1010" width="800" height="250" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="85" y="1068" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EVERY OTHER MOTOR</text><text x="85" y="1122" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">A 430.109(A) device: horsepower-rated</text><text x="85" y="1166" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">switch, listed molded case breaker or</text><text x="85" y="1210" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">switch, or a controller additionally</text><text x="85" y="1254" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">marked “Suitable as Motor Disconnect”</text><rect x="60" y="910" width="800" height="90" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="968" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">1/2 hp, 115 V: 9.8 A × 2 = 19.6 A min</text><rect x="60" y="1300" width="800" height="130" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1358" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Amps alone do not qualify a switch.</text><text x="450" y="1406" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Horsepower rating — or the small-motor path.</text><rect x="60" y="1470" width="800" height="130" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="1528" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Size it at 115% of table FLC — 430.110.</text><text x="450" y="1576" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Keep it within sight — 430.102.</text></svg>