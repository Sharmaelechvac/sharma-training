<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">425 El calor de proceso no es calor ambiental de 424</title><desc id="d">Dos paneles. Izquierda: calefacción de confort bajo el Artículo 424, un calentador de zócalo que calienta una habitación para personas. Derecha: calefacción de proceso bajo el Artículo 425, un tanque de proceso calefaccionado y un horno, calentando un producto. Una banda inferior dice: mismo alimentador, artículo diferente; el uso decide.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">425 El calor de proceso no es calor ambiental de 424</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El uso decide el artículo.</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículos 424, 425</text><text x="870" y="1160" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="200" width="390" height="600" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="40" y="200" width="390" height="84" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="235" y="256" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">CONFORT — ART. 424</text><rect x="470" y="200" width="390" height="600" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="470" y="200" width="390" height="84" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="665" y="256" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">PROCESO — ART. 425</text><rect x="85" y="600" width="300" height="70" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="115" y1="612" x2="115" y2="658" stroke="#264387" stroke-width="3"/><line x1="151" y1="612" x2="151" y2="658" stroke="#264387" stroke-width="3"/><line x1="187" y1="612" x2="187" y2="658" stroke="#264387" stroke-width="3"/><line x1="223" y1="612" x2="223" y2="658" stroke="#264387" stroke-width="3"/><line x1="259" y1="612" x2="259" y2="658" stroke="#264387" stroke-width="3"/><line x1="295" y1="612" x2="295" y2="658" stroke="#264387" stroke-width="3"/><line x1="331" y1="612" x2="331" y2="658" stroke="#264387" stroke-width="3"/><line x1="367" y1="612" x2="367" y2="658" stroke="#264387" stroke-width="3"/><path d="M135,560 q14,-22 0,-44 q-14,-22 0,-44" stroke="#F0A846" stroke-width="5" fill="none"/><path d="M215,560 q14,-22 0,-44 q-14,-22 0,-44" stroke="#F0A846" stroke-width="5" fill="none"/><path d="M295,560 q14,-22 0,-44 q-14,-22 0,-44" stroke="#F0A846" stroke-width="5" fill="none"/><text x="235" y="440" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">calor para personas</text><text x="70" y="720" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">• calentadores de zócalo</text><text x="70" y="754" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">• resistencias de calefacción en ducto</text><text x="70" y="788" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">• calefactores de pared</text><rect x="515" y="420" width="190" height="220" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="515" y1="480" x2="705" y2="480" stroke="#264387" stroke-width="3"/><path d="M535,600 q20,-26 40,0 q20,26 40,0 q20,-26 40,0 q20,26 40,0" stroke="#c0392b" stroke-width="5" fill="none"/><text x="610" y="678" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">tanque de proceso</text><rect x="735" y="470" width="100" height="130" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><rect x="753" y="495" width="64" height="60" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="785" y="640" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">horno</text><text x="665" y="356" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">calor para el producto</text><text x="500" y="720" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">• tanques de proceso</text><text x="500" y="754" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">• hornos</text><text x="500" y="788" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">• líneas de proceso</text><rect x="40" y="850" width="820" height="170" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="912" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">Mismo alimentador, distinto artículo.</text><text x="450" y="966" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Nombre el uso primero, luego trabaje ese artículo</text><text x="450" y="1006" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">con el listado del equipo.</text></svg>