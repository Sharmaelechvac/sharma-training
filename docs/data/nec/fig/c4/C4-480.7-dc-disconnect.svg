788" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">in sight: visible, not over 50 ft</text><text x="60" y="862" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Readily accessible and within sight — 480.7(A)</text><rect x="60" y="920" width="660" height="240" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="85" y="978" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">Label at the disconnect — 480.7(D):</text><text x="85" y="1032" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• nominal voltage</text><text x="85" y="1080" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• available short-circuit current</text><text x="85" y="1128" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• date the current was calculated</text><rect x="60" y="1220" width="390" height="330" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="255" y="1285" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">AC-ONLY SWITCH</text><text x="255" y="1345" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Amps look fine.</text><text x="255" y="1393" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">No DC rating —</text><text x="255" y="1441" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">the arc never gets</text><text x="255" y="1489" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">a zero crossing.</text><text x="255" y="1522" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">NOT PERMITTED.</text><rect x="470" y="1220" width="390" height="330" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="665" y="1285" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">DC-RATED SWITCH</text><text x="665" y="1345" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Rated for the DC</text><text x="665" y="1393" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">voltage and current</text><text x="665" y="1441" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">it has to break,</text><text x="665" y="1489" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">polarity followed.</text><text x="665" y="1522" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">THE RIGHT DEVICE.</text><text x="60" y="1612" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Over 60 V DC triggers 480.7(A).</text></svg>