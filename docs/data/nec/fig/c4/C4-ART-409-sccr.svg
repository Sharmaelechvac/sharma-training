<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1580" width="900" height="1580" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">409.110 SCCR is the panel's ceiling</title><desc id="d">An industrial control panel with its maker's label called out — SCCR 65 kA, 480 V, 3-phase — over a bar comparison at one supply: available fault current 22 kA, a panel marked 10 kA SCCR that must not be installed, and a panel marked 65 kA SCCR that clears it.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1580" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">409.110 SCCR is the panel's ceiling</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">SCCR must exceed the available fault current</text><line x1="30" y1="1522" x2="870" y2="1522" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1560" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 409.110, 110.9, 110.10</text><rect x="80" y="210" width="440" height="490" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="105" y="235" width="390" height="440" rx="0" fill="none" stroke="#c9d2e3" stroke-width="3"/><rect x="300" y="300" width="170" height="130" rx="0" fill="#ffffff" stroke="#F0A846" stroke-width="4"/><rect x="322" y="332" width="126" height="9" rx="0" fill="#c9d2e3" stroke="none" stroke-width="0"/><rect x="322" y="366" width="126" height="9" rx="0" fill="#c9d2e3" stroke="none" stroke-width="0"/><rect x="322" y="400" width="126" height="9" rx="0" fill="#c9d2e3" stroke="none" stroke-width="0"/><line x1="140" y1="600" x2="260" y2="592" stroke="#264387" stroke-width="5"/><line x1="140" y1="628" x2="260" y2="620" stroke="#264387" stroke-width="5"/><line x1="140" y1="656" x2="260" y2="648" stroke="#264387" stroke-width="5"/><circle cx="492" cy="296" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="492" y="308" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="300" y="748" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">industrial control panel</text><line x1="516" y1="296" x2="585" y2="320" stroke="#1a2f61" stroke-width="3"/><rect x="570" y="240" width="300" height="320" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="595" y="305" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">MAKER'S LABEL</text><text x="595" y="375" font-size="38" font-weight="800" fill="#1f2937" text-anchor="start">SCCR 65 kA</text><text x="595" y="435" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">480 V, 3-phase</text><text x="595" y="495" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">FLA on nameplate</text><text x="40" y="862" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">AT THIS SUPPLY</text><text x="40" y="905" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Available fault current</text><rect x="40" y="920" width="216" height="55" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="270" y="960" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">22 kA</text><text x="40" y="1018" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Panel marked 10 kA SCCR</text><rect x="40" y="1033" width="98" height="55" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="152" y="1073" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">10 kA</text><text x="320" y="1073" font-size="34" font-weight="900" fill="#c0392b" text-anchor="start">EXCEEDS — DO NOT SET</text><text x="40" y="1131" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Panel marked 65 kA SCCR</text><rect x="40" y="1146" width="637" height="55" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="691" y="1186" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">65 kA — OK</text><text x="40" y="1300" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Breaker AIC is not the SCCR — the</text><text x="40" y="1346" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">assembly's marked rating is the ceiling.</text><text x="40" y="1420" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="start">1  Read the SCCR on the maker's label first.</text></svg>