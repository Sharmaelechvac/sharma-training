<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" width="900" height="1150" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">440.62 Room A/C circuit caps</title><desc id="d">Bar chart on a 20 A circuit: a room air conditioner alone on a dedicated circuit is capped at 80 percent (16 A); on a circuit shared with lighting or other receptacles the cap is 50 percent (10 A). An example 12 A unit fits the dedicated circuit and fails the shared one.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1150" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">440.62 Room A/C circuit caps</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Caps on a 20 A circuit — bars to scale</text><line x1="30" y1="1092" x2="870" y2="1092" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1130" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 440.62, 440.65</text><text x="870" y="1130" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="480" y="228" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Example unit: 12 A</text><line x1="480" y1="244" x2="480" y2="560" stroke="#F0A846" stroke-width="5" stroke-dasharray="10 8"/><rect x="60" y="268" width="560" height="70" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="620" y="268" width="140" height="70" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="76" y="314" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">Dedicated — cap 16 A</text><rect x="60" y="448" width="350" height="70" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="410" y="448" width="350" height="70" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="76" y="494" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">Shared — cap 10 A</text><text x="790" y="314" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">20 A</text><text x="790" y="494" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">20 A</text><path d="M68,648 L79,660 L102,634" stroke="#2e7d32" stroke-width="7" fill="none"/><text x="130" y="660" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="start">12 A fits the dedicated circuit (≤ 16 A)</text><line x1="74" y1="694" x2="110" y2="730" stroke="#c0392b" stroke-width="7"/><line x1="74" y1="730" x2="110" y2="694" stroke="#c0392b" stroke-width="7"/><text x="130" y="724" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">12 A fails the shared circuit (&gt; 10 A)</text><rect x="60" y="800" width="780" height="120" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="852" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">440.65: LCDI or AFCI in the plug or cord</text><text x="450" y="896" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Factory HDCI is also permitted</text></svg>