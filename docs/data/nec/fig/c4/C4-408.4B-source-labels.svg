<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">408.4(B) Name the source of supply</title><desc id="d">A main panel in the garage feeding a pool-house sub-panel. The feeder breaker is labeled at the main, the source is labeled at the sub-panel, and the two labels agree.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">408.4(B) Name the source of supply</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Feeder-fed panel: both labels agree.</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 408.4(A), 408.4(B)</text><text x="870" y="1360" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="250" width="330" height="330" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="50" y="250" width="330" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="70" y="296" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">MAIN PANEL</text><text x="70" y="356" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">GARAGE</text><rect x="70" y="372" width="290" height="40" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><rect x="70" y="424" width="290" height="40" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="84" y="454" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">FEEDER</text><rect x="70" y="476" width="290" height="40" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><rect x="70" y="528" width="290" height="40" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><line x1="380" y1="415" x2="520" y2="415" stroke="#264387" stroke-width="6" marker-end="url(#ah)"/><text x="450" y="392" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">FEEDER</text><rect x="520" y="250" width="330" height="330" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="520" y="250" width="330" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="540" y="294" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">POOL-HOUSE PANEL</text><rect x="540" y="336" width="290" height="118" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="556" y="376" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">FED FROM</text><text x="556" y="414" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">MAIN PANEL,</text><text x="556" y="452" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">GARAGE</text><rect x="540" y="478" width="290" height="44" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><rect x="540" y="534" width="290" height="44" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><circle cx="556" cy="336" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="556" y="348" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="336" cy="446" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="336" y="458" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><rect x="50" y="650" width="800" height="118" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="75" y="700" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">AT THE SUB-PANEL — 408.4(B):</text><text x="75" y="746" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">“Fed from Main Panel, Garage”</text><rect x="50" y="800" width="800" height="118" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="75" y="850" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">AT THE MAIN PANEL:</text><text x="75" y="896" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">“Feeder — Pool-House Panel”</text><circle cx="74" cy="1006" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="74" y="1018" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="114" y="1018" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Labels name each other — and agree.</text><text x="50" y="1090" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Generator or second service? Label that too.</text></svg>