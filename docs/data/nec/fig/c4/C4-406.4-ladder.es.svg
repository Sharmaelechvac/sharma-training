<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">La escalera de reemplazo</title><desc id="d">Diagrama de flujo para reemplazo de receptáculos: con un conductor de puesta a tierra de equipo en la caja, el reemplazo es un receptáculo tipo puesta a tierra; sin tierra hay tres vías permitidas según 406.4(D)(2), cada una con su marcado requerido.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La escalera de reemplazo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">¿Hay una puesta a tierra en la caja?</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 406.4(D)(1), (D)(2)</text><rect x="90" y="200" width="720" height="118" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="252" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">REEMPLAZO DE RECEPTÁCULO</text><text x="450" y="296" font-size="32" font-weight="700" fill="#F0A846" text-anchor="middle">Pruebe la caja en busca de tierra del equipo</text><line x1="450" y1="318" x2="450" y2="352" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="356" width="720" height="128" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="120" y="408" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">SÍ — EGC EN LA CAJA</text><text x="120" y="452" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Receptáculo tipo con puesta a tierra. 406.4(D)(1)</text><rect x="90" y="512" width="720" height="500" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="120" y="564" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">SIN EGC — LAS TRES VÍAS DE (D)(2)</text><rect x="120" y="596" width="660" height="100" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="140" y="640" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">(a) Receptáculo sin puesta a tierra</text><text x="140" y="680" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">Sin marcado requerido</text><rect x="120" y="708" width="660" height="100" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="140" y="752" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">(b) Receptáculo tipo GFCI</text><text x="140" y="792" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">Marca: SIN PUESTA A TIERRA DEL EQUIPO</text><rect x="120" y="820" width="660" height="140" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="140" y="864" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">(c) Tipo con puesta a tierra, a través de un GFCI</text><text x="140" y="904" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">Marque: PROTEGIDO POR GFCI</text><text x="140" y="942" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">+ SIN PUESTA A TIERRA DEL EQUIPO</text><rect x="90" y="1040" width="720" height="140" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="120" y="1092" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NUNCA UNA RUTA PERMITIDA</text><text x="120" y="1136" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Un receptáculo con puesta a tierra en un circuito de dos hilos</text><text x="120" y="1174" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">circuito, sin marcar — una tierra que no está.</text><text x="450" y="1252" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Las marcas son parte de la regla,</text><text x="450" y="1298" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">no papeleo.</text></svg>