<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">426 Deshielo: circuito y losa</title><desc id="d">Diagrama unifilar de un circuito de derretimiento de nieve: tablero con interruptor GFPE, medio de desconexión bloqueable, controlador y luego una sección de pavimento con cable calefactor empotrado en la losa bajo la nieve.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">426 Deshielo: circuito y losa</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Paso calefaccionado — diagrama unifilar y vista en sección</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 426.4, 426.13, 426.28, 426.50</text><rect x="40" y="210" width="250" height="170" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="165" y="272" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">TABLERO</text><text x="165" y="322" font-size="32" font-weight="800" fill="#F0A846" text-anchor="middle">Interruptor GFPE</text><line x1="290" y1="295" x2="358" y2="295" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="366" y="230" width="224" height="130" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="478" y="282" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">DESCONEXIÓN</text><text x="478" y="326" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">se bloquea en abierto</text><line x1="590" y1="295" x2="654" y2="295" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="662" y="230" width="198" height="130" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="761" y="282" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">CONTROL</text><text x="761" y="326" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">termostato</text><line x1="761" y1="360" x2="761" y2="470" stroke="#1a2f61" stroke-width="5"/><line x1="761" y1="470" x2="700" y2="470" stroke="#1a2f61" stroke-width="5"/><line x1="700" y1="470" x2="700" y2="512" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="40" y="512" width="820" height="46" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="836" y="548" font-size="30" font-weight="800" fill="#5b6478" text-anchor="end">nieve</text><rect x="40" y="558" width="820" height="190" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><path d="M80,690 L80,640 L120,640 L120,690 L160,690 L160,640 L200,640 L200,690 L240,690 L240,640 L280,640 L280,690 L320,690 L320,640 L360,640 L360,690 L400,690 L400,640 L440,640 L440,690 L480,690 L480,640 L520,640 L520,690 L560,690 L560,640 L600,640 L600,690 L640,690 L640,640 L680,640 L680,690 L720,690 L720,640 L760,640 L760,690 L800,690" stroke="#F0A846" stroke-width="7" fill="none"/><text x="60" y="606" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">cable calefactor en losa</text><line x1="40" y1="748" x2="860" y2="748" stroke="#1f2937" stroke-width="5"/><text x="836" y="786" font-size="30" font-weight="800" fill="#5b6478" text-anchor="end">pavimento</text><circle cx="165" cy="430" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="165" y="442" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="478" cy="430" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="478" y="442" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="622" cy="245" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="622" y="257" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="700" cy="690" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="700" y="702" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><circle cx="46" cy="889" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="901" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="82" y="900" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Interruptor GFPE — protección contra falla a tierra</text><text x="82" y="940" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">del equipo en el circuito (426.28)</text><circle cx="46" cy="981" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="993" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="82" y="992" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Carga continua — los conductores y el</text><text x="82" y="1032" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">interruptor dimensionado al 125% de la carga (426.4)</text><circle cx="46" cy="1073" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1085" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="82" y="1084" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Medio de desconexión — abre todos los no puestos a tierra</text><text x="82" y="1124" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">conductores, puede bloquearse abierto (426.50)</text><circle cx="46" cy="1165" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1177" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="82" y="1176" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Identificación — la losa calefactada es</text><text x="82" y="1216" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">marcado en el tablero y los planos (426.13)</text><rect x="40" y="1290" width="820" height="120" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="64" y="1342" font-size="32" font-weight="900" fill="#c0392b" text-anchor="start">FLORIDA: Sharma no instala trabajo 426.</text><text x="64" y="1388" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">En un plano de Florida es un copiado — márquelo.</text></svg>