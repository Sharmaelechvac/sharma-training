<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">440.14 El medio de desconexión de HVAC</title><desc id="d">Vista en planta de la pared de una casa con un condensador sobre una base y un medio de desconexión en la pared, una línea de visión punteada entre ambos, una cota que muestra no más de 50 ft, un tablero rojo que rechaza el interruptor interior por sí solo y una franja roja que marca el cambio de 2023 sobre el espacio de trabajo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">440.14 El medio de desconexión de HVAC</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A la vista: visible, 50 ft máx.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 440.14, Art. 100 A la vista</text><rect x="40" y="190" width="820" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="64" y="248" font-size="34" font-weight="800" fill="#5b6478" text-anchor="start">PARED DE LA CASA</text><rect x="560" y="300" width="250" height="230" rx="8" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="685" y1="330" x2="685" y2="440" stroke="#1a2f61" stroke-width="6"/><circle cx="685" cy="330" r="12" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="685" y="492" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">DESCONEXIÓN</text><rect x="70" y="430" width="320" height="240" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="5"/><circle cx="230" cy="520" r="56" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="230" cy="520" r="22" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="230" y="645" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">CONDENSADOR</text><rect x="50" y="670" width="360" height="26" rx="0" fill="#c9d2e3" stroke="#c9d2e3" stroke-width="0"/><text x="230" y="736" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">sobre la base</text><line x1="392" y1="462" x2="556" y2="400" stroke="#F0A846" stroke-width="5" stroke-dasharray="14 10"/><text x="400" y="380" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">línea de visión</text><text x="420" y="600" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">✓ visible desde la unidad</text><text x="420" y="648" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">✓ alcáncelo, sin trepar</text><line x1="70" y1="810" x2="690" y2="810" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="380.0" y="798" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 50 ft desde el equipo</text><text x="380.0" y="798" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 50 ft desde el equipo</text><rect x="40" y="890" width="820" height="176" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="952" font-size="34" font-weight="900" fill="#c0392b" text-anchor="start">✗ El interruptor dentro del tablero de la casa</text><text x="64" y="1006" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">No es visible desde la unidad, así que no</text><text x="64" y="1045" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">no cuenta por sí solo (440.14).</text><rect x="40" y="1106" width="820" height="150" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="64" y="1168" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">SOLO 2023: el medio de desconexión también necesita</text><text x="64" y="1207" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">110.26(A) espacio de trabajo (2023)</text><text x="40" y="1336" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">En la unidad o junto a ella — pero nunca en el</text><text x="40" y="1375" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">panel de acceso, nunca sobre la placa de datos.</text></svg>