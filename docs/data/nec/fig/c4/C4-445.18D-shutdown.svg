e="#1f2937" stroke-width="5"/><path d="M342,600 C450,520 560,540 640,610" stroke="#1a2f61" stroke-width="4" fill="none" stroke-dasharray="10 8"/><text x="490" y="505" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">stops the prime mover</text><rect x="60" y="880" width="780" height="120" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="932" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">Stops the prime mover.</text><text x="450" y="978" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Nobody enters the house to kill it.</text><text x="60" y="1085" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1  Shutdown: outside, labeled, reachable</text><text x="60" y="1135" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2  Generator outdoors at the dwelling</text><text x="60" y="1185" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Test it at start-up; note the location.</text></svg>