<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">400.10 / 400.12 The cord line</title><desc id="d">Two panels: cord is fine for pendants, portable lamps and appliances, elevator cables and parts of listed equipment; hardwire it when a cord would run through a wall, through a doorway, substitute for fixed wiring, or hide above a ceiling.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">400.10 / 400.12 The cord line</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A cord serves equipment that moves</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 400.10, 400.12</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="210" width="390" height="760" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><rect x="470" y="210" width="390" height="760" rx="16" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="235" y="272" font-size="38" font-weight="900" fill="#2e7d32" text-anchor="middle">CORD IS FINE</text><text x="665" y="272" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">HARDWIRE IT</text><path d="M62,346 L73,358 L96,332" stroke="#2e7d32" stroke-width="6" fill="none"/><text x="108" y="356" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Pendant fixtures</text><path d="M62,450 L73,462 L96,436" stroke="#2e7d32" stroke-width="6" fill="none"/><text x="108" y="460" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Portable lamps</text><path d="M62,554 L73,566 L96,540" stroke="#2e7d32" stroke-width="6" fill="none"/><text x="108" y="564" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Portable appliances</text><path d="M62,658 L73,670 L96,644" stroke="#2e7d32" stroke-width="6" fill="none"/><text x="108" y="668" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Elevator and</text><text x="108" y="706" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">hoist cables</text><path d="M62,786 L73,798 L96,772" stroke="#2e7d32" stroke-width="6" fill="none"/><text x="108" y="796" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Parts of listed</text><text x="108" y="834" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">equipment</text><path d="M492,334 L514,356 M514,334 L492,356" stroke="#c0392b" stroke-width="5" fill="none"/><text x="530" y="354" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">Through holes in</text><text x="530" y="390" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">walls or floors</text><path d="M492,438 L514,460 M514,438 L492,460" stroke="#c0392b" stroke-width="5" fill="none"/><text x="530" y="458" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">Through doorways</text><text x="530" y="494" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">or windows</text><path d="M492,542 L514,564 M514,542 L492,564" stroke="#c0392b" stroke-width="5" fill="none"/><text x="530" y="562" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">Substitute for the</text><text x="530" y="598" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">fixed wiring</text><path d="M492,646 L514,668 M514,646 L492,668" stroke="#c0392b" stroke-width="5" fill="none"/><text x="530" y="666" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">Concealed in walls</text><text x="530" y="702" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">or above ceilings</text><path d="M492,750 L514,772 M514,750 L492,772" stroke="#c0392b" stroke-width="5" fill="none"/><text x="530" y="770" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">Attached to a</text><text x="530" y="806" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">building surface</text><path d="M492,854 L514,876 M514,854 L492,876" stroke="#c0392b" stroke-width="5" fill="none"/><text x="530" y="874" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">Where subject to</text><text x="530" y="910" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">physical damage</text><rect x="40" y="1030" width="820" height="150" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="1092" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">If a cord is doing a cable's job</text><text x="450" y="1140" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">permanently, it is the wrong wiring method.</text><text x="40" y="1250" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">Exceptions on the attach rule: 368.56(B), 590.4.</text><text x="40" y="1300" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Cord in a raceway: only where the Code</text><text x="40" y="1348" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">otherwise permits it — 400.12(6).</text><text x="40" y="1410" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">2017 numbers: permitted 400.7, not permitted 400.8.</text></svg>