<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">400.12 — the cord stop list</title><desc id="d">The seven uses 400.12 does not permit for flexible cords, shown under the permitted uses of 400.10 and the 590.4 temporary-wiring exception to the attachment rule.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1200" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">400.12 — the cord stop list</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">If a cord does any of these, it fails</text><line x1="30" y1="1142" x2="870" y2="1142" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1180" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 400.12, 400.10, 590.4</text><rect x="40" y="190" width="820" height="155" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="70" y="240" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">PERMITTED — 400.10</text><text x="70" y="282" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Pendants and portable equipment</text><text x="70" y="324" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Appliances moved for cleaning or service</text><line x1="450" y1="360" x2="450" y2="400" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="415" width="820" height="480" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="468" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NOT PERMITTED — 400.12</text><circle cx="95" cy="524" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="95" y="535" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="140" y="535" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Substitute for fixed wiring</text><circle cx="95" cy="576" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="95" y="587" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="140" y="587" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Through walls, ceilings, floors</text><circle cx="95" cy="628" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="95" y="639" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="140" y="639" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Through doorways or windows</text><circle cx="95" cy="680" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="95" y="691" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="140" y="691" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Attached to building surfaces</text><circle cx="95" cy="732" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="95" y="743" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">5</text><text x="140" y="743" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Concealed or above dropped ceilings</text><circle cx="95" cy="784" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="95" y="795" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">6</text><text x="140" y="795" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">In raceways — 400.17 industry only</text><circle cx="95" cy="836" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="95" y="847" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">7</text><text x="140" y="847" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Subject to physical damage</text><rect x="40" y="925" width="820" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="70" y="972" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">EXCEPTION — 400.12(4)</text><text x="70" y="1014" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Temporary wiring under 590.4 may be attached</text></svg>