<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">406.12 Where TR is required</title><desc id="d">Wall elevation of a dwelling room: a tamper-resistant receptacle at normal device height with a green check, a receptacle more than 5 ft 6 in above the floor marked as an exception, and a refrigerator with a dedicated receptacle behind it marked as an exception.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">406.12 Where TR is required</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dwelling wall, drawn to scale: 1 ft = 89 units</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 406.12</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="190" width="840" height="590" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="4"/><line x1="20" y1="780" x2="880" y2="780" stroke="#1f2937" stroke-width="6"/><text x="880" y="824" font-size="32" font-weight="800" fill="#5b6478" text-anchor="end">floor</text><rect x="120" y="612" width="64" height="76" rx="6" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="138" y1="632" x2="138" y2="652" stroke="#1a2f61" stroke-width="4"/><line x1="166" y1="632" x2="166" y2="652" stroke="#1a2f61" stroke-width="4"/><line x1="138" y1="662" x2="138" y2="676" stroke="#1a2f61" stroke-width="4"/><line x1="166" y1="662" x2="166" y2="676" stroke="#1a2f61" stroke-width="4"/><path d="M214,640 L225,652 L248,626" stroke="#2e7d32" stroke-width="6" fill="none"/><text x="152" y="596" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">TR</text><circle cx="152" cy="520" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="152" y="532" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><rect x="688" y="256" width="64" height="76" rx="6" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="706" y1="276" x2="706" y2="296" stroke="#1a2f61" stroke-width="4"/><line x1="734" y1="276" x2="734" y2="296" stroke="#1a2f61" stroke-width="4"/><line x1="706" y1="306" x2="706" y2="320" stroke="#1a2f61" stroke-width="4"/><line x1="734" y1="306" x2="734" y2="320" stroke="#1a2f61" stroke-width="4"/><circle cx="720" cy="200" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="720" y="212" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><line x1="838" y1="290" x2="838" y2="780" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="824" y="546.9" font-size="34" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">5 ft 6 in min</text><text x="824" y="546.9" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">5 ft 6 in min</text><rect x="340" y="420" width="210" height="360" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="340" y1="500" x2="550" y2="500" stroke="#264387" stroke-width="3"/><text x="445" y="474" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">FRIDGE</text><rect x="560" y="560" width="52" height="64" rx="6" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><line x1="576" y1="578" x2="576" y2="596" stroke="#1a2f61" stroke-width="4"/><line x1="596" y1="578" x2="596" y2="596" stroke="#1a2f61" stroke-width="4"/><path d="M586,624 L586,700 L470,700" stroke="#F0A846" stroke-width="5" fill="none" stroke-dasharray="10 8"/><circle cx="586" cy="500" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="586" y="512" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><rect x="330" y="210" width="140" height="34" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="400" y="262" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">luminaire</text><circle cx="400" cy="312" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="400" y="324" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><circle cx="46" cy="889" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="901" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="82" y="900" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Normal device height in a dwelling:</text><text x="82" y="940" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">TR required — shutters block a key or clip</text><circle cx="46" cy="985" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="997" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="82" y="996" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">More than 5-1/2 ft above the floor:</text><text x="82" y="1036" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">exception — TR not required</text><circle cx="46" cy="1081" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1093" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="82" y="1092" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Dedicated space for one appliance that</text><text x="82" y="1132" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">is not easily moved: exception</text><circle cx="46" cy="1177" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="46" y="1189" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="82" y="1188" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">Part of a luminaire or an appliance:</text><text x="82" y="1228" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">exception — TR not required</text><rect x="30" y="1300" width="840" height="120" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="1350" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">When in doubt, the TR device</text><text x="450" y="1398" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">is the answer.</text></svg>