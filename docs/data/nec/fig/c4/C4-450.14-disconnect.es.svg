<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">450.14 Medio de desconexión del transformador</title><desc id="d">Dos ubicaciones permitidas para un medio de desconexión de transformador: a la vista del transformador (visible, 50 ft máx.), o remoto si es bloqueable según 110.25 con su ubicación marcada en campo en el transformador.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">450.14 Medio de desconexión del transformador</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A la vista, o remoto + bloqueable + marcado.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 450.14, 110.25</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="200" width="820" height="330" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="70" y="258" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">CASO A — A LA VISTA</text><rect x="80" y="320" width="300" height="120" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="230.0" y="374.0" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">TRANSFORMADOR</text><text x="230.0" y="418.0" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">45 kVA tipo seco</text><rect x="540" y="320" width="280" height="120" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="680.0" y="392.24" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">DESCONEXIÓN</text><line x1="380" y1="486" x2="540" y2="486" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="460.0" y="474" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">visible — 50 ft máx.</text><text x="460.0" y="474" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">visible — 50 ft máx.</text><rect x="40" y="580" width="820" height="560" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="70" y="638" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">CASO B — UBICACIÓN REMOTA</text><rect x="80" y="700" width="300" height="120" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="230.0" y="772.24" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">TRANSFORMADOR</text><line x1="470" y1="680" x2="470" y2="900" stroke="#5b6478" stroke-width="5" stroke-dasharray="14 10"/><text x="486" y="668" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">otra habitación</text><rect x="560" y="700" width="260" height="120" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="690.0" y="754.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">TABLERO MDP</text><text x="690.0" y="798.0" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">interruptor primario</text><path d="M 670 856 v -16 a 20 20 0 0 1 40 0 v 16" stroke="#1a2f61" stroke-width="5" fill="none"/><rect x="652" y="856" width="76" height="56" rx="8" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="690" y="950" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">BLOQUEABLE — 110.25</text><rect x="80" y="980" width="740" height="130" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="104" y="1036" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">MARCA DE CAMPO EN EL TRANSFORMADOR:</text><text x="104" y="1084" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">“Medio de desconexión principal: Tablero MDP, Cuarto Eléct.”</text><rect x="40" y="1180" width="820" height="110" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1250" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Remoto sin el bloqueo o la marca = NO PASA</text></svg>