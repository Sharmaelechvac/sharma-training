<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">424.19: One switch kills the heater</title><desc id="d">One-line flow: panel and lockable breaker feed a disconnect within sight of an air handler; the disconnect opens the heat strips, blower, controller and supplementary fuses together. A fail panel shows a switch that kills only the strips.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">424.19: One switch kills the heater</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Air handler: 10 kW strips + blower</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 424.19, 110.25</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="250" y="190" width="400" height="100" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="232" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><text x="450" y="272" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">branch circuit</text><line x1="450" y1="290" x2="450" y2="330" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="190" y="340" width="520" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="384" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">BREAKER OR SWITCH</text><text x="450" y="424" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">lockable open — 110.25</text><line x1="450" y1="450" x2="450" y2="490" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="190" y="500" width="520" height="120" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="450" y="548" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><text x="450" y="592" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">rated ≥ 125% of total load</text><line x1="450" y1="620" x2="450" y2="700" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="710" y1="500" x2="802" y2="500" stroke="#1a2f61" stroke-width="2"/><line x1="710" y1="1080" x2="802" y2="1080" stroke="#1a2f61" stroke-width="2"/><line x1="790" y1="500" x2="790" y2="1080" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(778,790.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">within sight: visible, 50 ft max</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">within sight: visible, 50 ft max</text></g><rect x="90" y="710" width="620" height="370" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="400" y="762" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">AIR HANDLER — ONE EQUIPMENT</text><rect x="120" y="790" width="270" height="120" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="255" y="838" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">HEAT STRIPS</text><text x="255" y="878" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">10 kW</text><rect x="410" y="790" width="270" height="120" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="545" y="838" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">BLOWER</text><text x="545" y="878" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">blower motor</text><rect x="120" y="930" width="560" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="400" y="976" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SUPPLEMENTARY FUSES</text><text x="400" y="1016" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">disconnect in sight of these</text><rect x="60" y="1130" width="780" height="120" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="1180" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">ONE OPERATION OPENS ALL OF IT</text><text x="450" y="1222" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">heater, controller and fuses — together</text><rect x="60" y="1290" width="780" height="130" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1342" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">FAIL: switch kills the strips only</text><text x="450" y="1384" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">blower and controls still live — not a disconnect</text></svg>