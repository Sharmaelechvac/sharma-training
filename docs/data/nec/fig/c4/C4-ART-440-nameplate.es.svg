<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">440: lea la placa de datos</title><desc id="d">Una unidad condensadora y su placa de datos: el MCA 25 A dimensiona los conductores y el MOCP 35 A limita el interruptor, calculado desde un compresor con carga nominal de 20 A, con el medio de desconexión a la vista del equipo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1340" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">440: lea la placa de datos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La placa dimensiona el circuito, no las tablas de hp</text><line x1="30" y1="1282" x2="870" y2="1282" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1320" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Art. 440 · 440.14, 440.22(A), 440.32</text><rect x="60" y="250" width="300" height="300" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="210" cy="370" r="78" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="210" y1="292" x2="210" y2="448" stroke="#264387" stroke-width="4"/><line x1="132" y1="370" x2="288" y2="370" stroke="#264387" stroke-width="4"/><line x1="155" y1="315" x2="265" y2="425" stroke="#264387" stroke-width="4"/><line x1="265" y1="315" x2="155" y2="425" stroke="#264387" stroke-width="4"/><text x="210" y="512" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">UNIDAD CONDENSADORA</text><rect x="430" y="250" width="410" height="300" rx="10" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="635" y="306" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PLACA DE DATOS</text><rect x="455" y="330" width="360" height="62" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="635" y="372" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">MCA — 25 A</text><rect x="455" y="406" width="360" height="62" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="635" y="448" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">MOCP — 35 A</text><text x="635" y="516" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">RLA del compresor — 20 A</text><line x1="280" y1="550" x2="280" y2="606" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="635" y1="550" x2="635" y2="606" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="610" width="400" height="170" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="260" y="664" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">CONDUCTORES</text><text x="260" y="710" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Ampacidad al menos igual al MCA</text><text x="260" y="752" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">25 A (440.32)</text><rect x="500" y="610" width="360" height="170" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="680" y="664" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">INTERRUPTOR</text><text x="680" y="710" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Nunca sobre el MOCP</text><text x="680" y="752" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">35 A (440.22(A))</text><rect x="60" y="830" width="800" height="170" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="884" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">MEDIO DE DESCONEXIÓN — EN EL EQUIPO</text><text x="90" y="930" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">A la vista: visible, no más de 50 ft (440.14)</text><text x="90" y="972" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Fácilmente accesible — nunca sobre la placa de datos</text><rect x="60" y="1040" width="800" height="110" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1086" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">¿El 430 y el 440 no concuerdan en un compresor?</text><text x="450" y="1130" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Rige el Artículo 440.</text></svg>