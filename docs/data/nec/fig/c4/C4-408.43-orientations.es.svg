th="110" height="32" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="3"/><line x1="640" y1="290" x2="820" y2="500" stroke="#c0392b" stroke-width="6"/><line x1="820" y1="290" x2="640" y2="500" stroke="#c0392b" stroke-width="6"/><text x="170" y="745" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">EN UNA PARED</text><text x="450" y="745" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">HACIA ARRIBA</text><text x="730" y="745" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">BOCA ABAJO</text><rect x="137.0" y="776" width="66" height="52" rx="26" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="170.0" y="814" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><rect x="350.5" y="776" width="199" height="52" rx="26" fill="#fbe9e7" stroke="#fbe9e7" stroke-width="0"/><text x="450.0" y="814" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NO — 2020</text><rect x="630.5" y="776" width="199" height="52" rx="26" fill="#fbe9e7" stroke="#fbe9e7" stroke-width="0"/><text x="730.0" y="814" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NO — 2023</text><text x="450" y="920" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Los interruptores deben operar y leerse según su listado.</text><text x="450" y="966" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Hacia arriba también acumula escombros y agua.</text></svg>