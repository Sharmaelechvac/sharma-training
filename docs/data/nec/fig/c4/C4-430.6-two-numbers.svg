<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">430.6 Two numbers, two jobs</title><desc id="d">Flowchart: one motor splits into two sizing bases. Conductors, disconnects, controllers and short-circuit protection use the table full-load current, 28 A for a 5 hp 230 V single-phase motor. Overload protection uses the nameplate current of the motor actually installed.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">430.6 Two numbers, two jobs</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Example motor: 5 hp, 230 V, single-phase</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.6, Tables 430.248, 430.250</text><rect x="190" y="200" width="520" height="130" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="256" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">ONE MOTOR</text><text x="450" y="304" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">5 hp · 230 V · single-phase</text><line x1="320" y1="330" x2="320" y2="420" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><line x1="580" y1="330" x2="580" y2="420" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="40" y="430" width="400" height="430" rx="16" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="240" y="486" font-size="30" font-weight="900" fill="#F0A846" text-anchor="middle">SIZE FROM THE TABLE</text><text x="240" y="548" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">Conductors</text><text x="240" y="594" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">Disconnects</text><text x="240" y="640" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">Controllers</text><text x="240" y="686" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">Short-circuit and</text><text x="240" y="732" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">ground-fault protection</text><text x="240" y="806" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">Table FLC: 28 A</text><text x="240" y="846" font-size="30" font-weight="700" fill="#F0A846" text-anchor="middle">Table 430.248</text><rect x="460" y="430" width="400" height="430" rx="16" fill="#ffffff" stroke="#F0A846" stroke-width="5"/><text x="660" y="486" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">SIZE FROM NAMEPLATE</text><text x="660" y="548" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">Overload protection</text><text x="660" y="594" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">only — it protects</text><text x="660" y="640" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">the machine that is</text><text x="660" y="686" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">actually installed</text><text x="660" y="806" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">Nameplate FLA</text><text x="660" y="846" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">read this motor</text><rect x="40" y="920" width="820" height="130" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="978" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">The next replacement motor may differ.</text><text x="450" y="1026" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">That is why sizing follows the table.</text><text x="40" y="1130" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">Label both numbers on the worksheet:</text><text x="40" y="1184" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">"Table FLC" and "Nameplate FLA."</text><text x="40" y="1250" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Other table values crews use: 1 hp 230 V — 8 A;</text><text x="40" y="1300" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">3 hp 230 V — 17 A; 10 hp 208 V 3-phase — 30.8 A.</text></svg>