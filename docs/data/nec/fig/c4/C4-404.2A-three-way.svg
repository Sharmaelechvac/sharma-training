<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">404.2(A) Switch the hot only</title><desc id="d">One-line of a multi-way switching run: panel hot lands on the first 3-way switch's common, two gold travelers carry it through a 4-way switch to the second 3-way, and the switched leg leaves its common for the lamp, while the neutral runs unbroken from the panel straight to the lamp's screw shell.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">404.2(A) Switch the hot only</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The neutral is never switched</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 404.2(A)</text><text x="870" y="1500" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="380" width="100" height="100" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="80" y="445" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">PANEL</text><line x1="130" y1="430" x2="180" y2="430" stroke="#1f2937" stroke-width="5"/><rect x="180" y="350" width="120" height="210" rx="8" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="240" y="605" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3-WAY</text><rect x="410" y="350" width="120" height="210" rx="8" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="470" y="605" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4-WAY</text><rect x="640" y="350" width="120" height="210" rx="8" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="700" y="605" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3-WAY</text><circle cx="180" cy="430" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="300" cy="390" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="300" cy="470" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="410" cy="390" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="410" cy="470" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="530" cy="390" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="530" cy="470" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="640" cy="390" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="640" cy="470" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="760" cy="430" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="300" y1="390" x2="410" y2="390" stroke="#F0A846" stroke-width="5"/><line x1="530" y1="390" x2="640" y2="390" stroke="#F0A846" stroke-width="5"/><line x1="300" y1="470" x2="410" y2="470" stroke="#F0A846" stroke-width="5"/><line x1="530" y1="470" x2="640" y2="470" stroke="#F0A846" stroke-width="5"/><line x1="760" y1="430" x2="817" y2="430" stroke="#1f2937" stroke-width="5"/><circle cx="845" cy="430" r="28" fill="#fdf3e0" stroke="#1a2f61" stroke-width="4"/><path d="M833,418 L857,442 M857,418 L833,442" stroke="#1a2f61" stroke-width="3" fill="none"/><line x1="80" y1="480" x2="80" y2="640" stroke="#5b6478" stroke-width="4"/><line x1="80" y1="640" x2="845" y2="640" stroke="#5b6478" stroke-width="4"/><line x1="845" y1="640" x2="845" y2="462" stroke="#5b6478" stroke-width="4"/><text x="460" y="692" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">neutral — straight to the screw shell</text><circle cx="180" cy="430" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="180" y="442" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="365" cy="390" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="365" y="402" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="760" cy="430" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="760" y="442" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="460" cy="640" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="460" y="652" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><circle cx="60" cy="811" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="823" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="98" y="822" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Common — the hot comes in here</text><circle cx="60" cy="857" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="869" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="98" y="868" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Travelers — the hot crosses over</text><circle cx="60" cy="903" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="915" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="98" y="914" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Common — switched leg to the load</text><circle cx="60" cy="949" r="20" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="961" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="98" y="960" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Neutral — unbroken, to the shell</text><rect x="40" y="1060" width="820" height="240" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="70" y="1122" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">BANNED SINCE 1923 — CARTER SYSTEM</text><text x="70" y="1178" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Hot and neutral both landed on the travelers.</text><text x="70" y="1224" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">In some positions the shell stays hot with</text><text x="70" y="1270" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">the light off. If you find it, rewire it.</text></svg>