<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1760" width="900" height="1760" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">406.4(D) Replacing a receptacle</title><desc id="d">Decision chart for receptacle replacement: with an equipment ground in the box, use a grounding-type receptacle; with no ground, the three permitted paths of 406.4(D)(2), each with its marking.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1760" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">406.4(D) Replacing a receptacle</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">First question: is there a ground in the box?</text><line x1="30" y1="1702" x2="870" y2="1702" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1740" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 406.4(D), 250.130(C)</text><rect x="120" y="200" width="660" height="100" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="244" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">RECEPTACLE REPLACEMENT</text><text x="450" y="282" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">Test the box for an equipment ground</text><line x1="450" y1="300" x2="450" y2="342" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="350" width="820" height="220" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="70" y="408" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">YES — EGC IN BOX</text><text x="70" y="472" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Grounding-type receptacle — connect the</text><text x="70" y="511" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">ground terminal to the EGC.  406.4(D)(1)</text><rect x="40" y="600" width="820" height="550" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="70" y="658" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">NO EGC — THE THREE PATHS OF (D)(2)</text><rect x="70" y="690" width="760" height="120" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="94" y="742" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">(a) Non-grounding-type receptacle</text><text x="94" y="786" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">No marking required</text><rect x="70" y="830" width="760" height="120" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="94" y="882" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">(b) GFCI-type receptacle</text><text x="94" y="926" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">Mark: NO EQUIPMENT GROUND</text><rect x="70" y="970" width="760" height="150" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="94" y="1022" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">(c) Grounding type, through a GFCI</text><text x="94" y="1066" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">Mark: GFCI PROTECTED</text><text x="94" y="1100" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">+ NO EQUIPMENT GROUND</text><rect x="40" y="1180" width="820" height="250" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="1238" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NEVER A PERMITTED PATH</text><text x="70" y="1288" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">A standard grounding receptacle on an</text><text x="70" y="1328" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">ungrounded circuit, left unmarked.</text><text x="70" y="1368" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Bootleg ground: neutral jumpered to</text><text x="70" y="1408" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">the ground screw.</text><rect x="40" y="1470" width="820" height="190" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="1528" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">GFCI / AFCI / TR / WR REQUIRED TODAY?</text><text x="70" y="1580" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">The replacement must provide it —</text><text x="70" y="1624" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">406.4(D)(3) through (D)(6).</text></svg>