<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Marcados de terminales del interruptor</title><desc id="d">Tres paneles que comparan marcados de terminales de interruptores: un interruptor de acción rápida de 15 o 20 A sin marcar acepta solo cobre y aluminio revestido de cobre; un interruptor marcado CO/ALR también acepta aluminio; un interruptor de 30 A o más es solo cobre a menos que esté marcado AL/CU.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Marcados de terminales del interruptor</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Lo que puede conectarse está impreso en el dispositivo</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 404.15(C) · 406.3(C)</text><rect x="40" y="200" width="820" height="330" rx="14" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="70" y="258" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">INTERRUPTOR SNAP DE 15 A / 20 A</text><rect x="70" y="284" width="360" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="250.0" y="320" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">MARCA DEL DISPOSITIVO: NINGUNA</text><text x="70" y="378" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Cobre</text><rect x="787" y="342" width="63" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="818.5" y="378" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><text x="70" y="430" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Aluminio revestido de cobre (CCA)</text><rect x="787" y="394" width="63" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="818.5" y="430" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><text x="70" y="482" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Aluminio simple</text><rect x="787" y="446" width="63" height="50" rx="25" fill="#fbe9e7" stroke="#fbe9e7" stroke-width="0"/><text x="818.5" y="482" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">NO</text><rect x="40" y="560" width="820" height="330" rx="14" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="70" y="618" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">INTERRUPTOR SNAP DE 15 A / 20 A</text><rect x="70" y="644" width="400" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="270.0" y="680" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">MARCA DEL DISPOSITIVO: CO/ALR</text><text x="70" y="738" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Cobre</text><rect x="787" y="702" width="63" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="818.5" y="738" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><text x="70" y="790" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Aluminio revestido de cobre (CCA)</text><rect x="787" y="754" width="63" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="818.5" y="790" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><text x="70" y="842" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Aluminio simple</text><rect x="787" y="806" width="63" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="818.5" y="842" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><rect x="40" y="920" width="820" height="330" rx="14" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="70" y="978" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">30 A Y MÁS</text><rect x="70" y="1004" width="540" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="340.0" y="1040" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">MARCA DEL DISPOSITIVO: NINGUNA o AL/CU</text><text x="70" y="1098" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Cobre</text><rect x="787" y="1062" width="63" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="818.5" y="1098" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><text x="70" y="1150" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Aluminio simple — sin marca AL/CU</text><rect x="