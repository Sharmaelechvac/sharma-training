<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Capacidad del medio de desconexión</title><desc id="d">Diagrama de tarjeta de valores nominales: la corriente de carga nominal de placa de datos de 28 A por 1.15 da un valor nominal mínimo de desconexión de 32.2 A; un medio de desconexión de 30 A no cumple y el estándar de 60 A es la elección.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Capacidad del medio de desconexión</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo resuelto: placa de datos 28 A.</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 440.12</text><text x="870" y="1160" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="220" width="720" height="140" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="275" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CORRIENTE DE CARGA NOMINAL DE PLACA DE DATOS</text><text x="450" y="335" font-size="44" font-weight="800" fill="#1f2937" text-anchor="middle">28 A</text><line x1="450" y1="360" x2="450" y2="430" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)"/><text x="470" y="408" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">× 1.15</text><rect x="90" y="430" width="720" height="140" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="450" y="485" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CAPACIDAD MÍNIMA DE DESCONEXIÓN</text><text x="450" y="545" font-size="44" font-weight="800" fill="#1f2937" text-anchor="middle">32.2 A</text><rect x="60" y="640" width="380" height="190" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="250" y="715" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">DESCONEXIÓN DE 30 A</text><text x="250" y="775" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">✗ NO PASA 440.12</text><rect x="460" y="640" width="380" height="190" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="650" y="715" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">DESCONEXIÓN DE 60 A</text><text x="650" y="775" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">✓ SELECCIÓN ESTÁNDAR</text><text x="450" y="920" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">El tamaño del interruptor es otra cuestión (440.22).</text></svg>