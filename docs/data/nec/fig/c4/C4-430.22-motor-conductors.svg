<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" width="900" height="1050" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">430.22 Single-motor conductors</title><desc id="d">Flow chart: table full-load current 28 A for a 5 hp 230 V single-phase motor, times 125 percent equals 35 A minimum conductor ampacity; 12 AWG copper at 25 A is too small, 10 AWG copper at 35 A is the smallest that covers it.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1050" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">430.22 Single-motor conductors</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Example: 5 hp, 230 V, single-phase</text><line x1="30" y1="992" x2="870" y2="992" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1030" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.22, Table 430.248, Table 310.16</text><rect x="110" y="205" width="680" height="112" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="252" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Table FLC — Table 430.248</text><text x="450" y="296" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">5 hp, 230 V, 1-phase = 28 A</text><line x1="450" y1="317" x2="450" y2="365" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="110" y="375" width="680" height="112" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="422" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">× 125 percent — 430.22</text><text x="450" y="466" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">28 A × 1.25 = 35 A minimum ampacity</text><line x1="450" y1="487" x2="450" y2="535" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="545" width="780" height="100" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><line x1="86" y1="577" x2="122" y2="613" stroke="#c0392b" stroke-width="7"/><line x1="86" y1="613" x2="122" y2="577" stroke="#c0392b" stroke-width="7"/><text x="140" y="607" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">12 AWG Cu, 75 °C: 25 A — too small</text><rect x="60" y="665" width="780" height="100" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><path d="M80,708 L91,720 L114,694" stroke="#2e7d32" stroke-width="7" fill="none"/><text x="140" y="727" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">10 AWG Cu, 75 °C: 35 A — covers it</text><text x="450" y="838" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Nameplate amps set the overloads —</text><text x="450" y="880" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">conductors come from the table FLC</text></svg>