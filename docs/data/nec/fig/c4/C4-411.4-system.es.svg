<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">411.4 Sistema de baja tensión listado</title><desc id="d">Diagrama unifilar de un sistema listado del Artículo 411: circuito derivado a fuente de alimentación listada a luminarias, con los límites secundarios de 30 V y 25 A y la distancia a la piscina de 10 ft marcados.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">411.4 Sistema de baja tensión listado</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Una familia listada, de principio a fin</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 411.1, 411.4, 411.5</text><rect x="40" y="210" width="220" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="150.0" y="272" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DERIVADO</text><text x="150.0" y="316" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">CIRCUITO</text><rect x="310" y="210" width="280" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450.0" y="272" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">POTENCIA LISTADA</text><text x="450.0" y="316" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">SUMINISTRO</text><rect x="640" y="210" width="220" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="750.0" y="272" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LUMINARIAS</text><text x="750.0" y="316" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Cinta LED</text><line x1="265" y1="285" x2="305" y2="285" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="595" y1="285" x2="635" y2="285" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="310" y="395" width="550" height="120" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="585" y="445" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">LADO SECUNDARIO</text><text x="585" y="490" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">≤ 30 V AC / 60 V DC · ≤ 25 A</text><rect x="40" y="550" width="820" height="215" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="602" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">NO ES UN SISTEMA DEL ARTÍCULO 411</text><text x="70" y="652" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Driver suelto de internet + cinta no listada</text><text x="70" y="698" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Conductores desnudos ocultos dentro de una pared</text><text x="70" y="744" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Controlador enterrado, sin acceso para servicio</text><text x="40" y="845" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">DISTANCIA LIBRE A LA PISCINA — 411.5</text><circle cx="120" cy="930" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="120" y="990" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">luminaria</text><rect x="560" y="860" width="300" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="710" y="940" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PISCINA</text><line x1="120" y1="905" x2="560" y2="905" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="340.0" y="893" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft mín.</text><text x="340.0" y="893" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">10 ft mín.</text></svg>