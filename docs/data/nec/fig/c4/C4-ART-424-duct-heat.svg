<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">424 Heat strips: continuous load</title><desc id="d">Air handler with heat strips and blower, lockable disconnect, and the 125 percent sizing chain.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">424 Heat strips: continuous load</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Scale case: 10 kW strips, 240 V air handler</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 424.4(B), 424.19</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="210" width="380" height="550" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="280" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">AIR HANDLER</text><rect x="120" y="290" width="320" height="170" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><path d="M140,344 L160,316 L180,344 L200,316 L220,344 L240,316 L260,344 L280,316 L300,344 L320,316 L340,344 L360,316 L380,344 L400,316" stroke="#F0A846" stroke-width="4" fill="none"/><path d="M140,389 L160,361 L180,389 L200,361 L220,389 L240,361 L260,389 L280,361 L300,389 L320,361 L340,389 L360,361 L380,389 L400,361" stroke="#F0A846" stroke-width="4" fill="none"/><path d="M140,434 L160,406 L180,434 L200,406 L220,434 L240,406 L260,434 L280,406 L300,434 L320,406 L340,434 L360,406 L380,434 L400,406" stroke="#F0A846" stroke-width="4" fill="none"/><text x="280" y="500" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">HEAT STRIPS — 10 kW</text><rect x="150" y="530" width="120" height="60" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="210" y="570" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">FUSES</text><circle cx="360" cy="640" r="62" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="360" cy="640" r="14" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="360" y1="640" x2="360" y2="596" stroke="#264387" stroke-width="5"/><line x1="360" y1="640" x2="398" y2="662" stroke="#264387" stroke-width="5"/><line x1="360" y1="640" x2="322" y2="662" stroke="#264387" stroke-width="5"/><text x="360" y="745" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">BLOWER</text><circle cx="500" cy="330" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="500" y="343" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="470" y1="400" x2="610" y2="400" stroke="#264387" stroke-width="5"/><text x="540" y="385" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">FEED</text><rect x="610" y="300" width="210" height="210" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="715" y="352" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><line x1="715" y1="470" x2="660" y2="385" stroke="#c0392b" stroke-width="6"/><circle cx="715" cy="470" r="12" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="715" y="552" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">LOCKABLE OPEN</text><circle cx="845" cy="330" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="845" y="343" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="60" y="830" width="780" height="130" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="885" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">10 kW ÷ 240 V = 41.7 A nameplate</text><text x="450" y="935" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">41.7 × 1.25 = 52.1 A → 60 A breaker</text><circle cx="60" cy="795" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="808" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="60" y="1055" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1  Heat strips — the nameplate sets the load</text><text x="60" y="1105" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2  One switch kills strips + blower + fuses</text><text x="60" y="1155" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3  Size it continuous: 125% (424.4(B))</text></svg>