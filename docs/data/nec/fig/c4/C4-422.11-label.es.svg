<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" width="900" height="1120" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">422.11 Sobrecorriente de electrodomésticos</title><desc id="d">Una placa de datos de un aparato marcada MAX BREAKER 30 A, con un interruptor de 30 A que coincide con la etiqueta y un interruptor de 50 A mostrado como infracción, más las reglas de 422.11(E) para aparatos sin marca.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1120" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">422.11 Sobrecorriente de electrodomésticos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Rige el máximo marcado</text><line x1="30" y1="1062" x2="870" y2="1062" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1100" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 422.11(E), 422.11(F), 240.6(A)</text><rect x="90" y="205" width="720" height="300" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="262" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">PLACA DE DATOS DEL APARATO</text><line x1="150" y1="286" x2="750" y2="286" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="348" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">NOMINAL 16 A · 240 V</text><rect x="215" y="378" width="470" height="92" rx="10" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="438" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERRUPTOR MÁX.: 30 A</text><line x1="450" y1="505" x2="450" y2="560" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="478" y="545" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">Interruptor: 30 A máx.</text><rect x="60" y="585" width="780" height="96" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><path d="M80,626 L91,638 L114,612" stroke="#2e7d32" stroke-width="7" fill="none"/><text x="140" y="645" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">interruptor de 30 A — coincide con la etiqueta</text><rect x="60" y="701" width="780" height="96" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><line x1="86" y1="731" x2="122" y2="767" stroke="#c0392b" stroke-width="7"/><line x1="86" y1="767" x2="122" y2="731" stroke="#c0392b" stroke-width="7"/><text x="140" y="761" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">interruptor de 50 A — sobre el máx. marcado</text><rect x="60" y="837" width="780" height="120" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="889" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">¿Sin marca? 13.3 A o menos → 20 A máx.</text><text x="450" y="933" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Más de 13.3 A → 150% máx. — 422.11(E)</text></svg>