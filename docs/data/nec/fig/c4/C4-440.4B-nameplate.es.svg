<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">440.4(B) La placa de datos es el cálculo</title><desc id="d">Una placa de datos del condensador marcada MCA 24.5 A y MOCP 40 A, con la verificación del cable — cobre 10 AWG a 35 A cubre el MCA — y la verificación del interruptor — 40 A en el MOCP, nunca por encima.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">440.4(B) La placa de datos es el cálculo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Placa de datos del motocompresor hermético</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 440.4(B), 440.32, 440.22</text><rect x="90" y="195" width="720" height="445" rx="14" fill="#fdf3e0" stroke="#1a2f61" stroke-width="4"/><text x="450" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PLACA DE DATOS DEL CONDENSADOR</text><line x1="130" y1="290" x2="770" y2="290" stroke="#c9d2e3" stroke-width="3"/><text x="130" y="375" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="start">MCA</text><text x="130" y="418" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">ampacidad mínima del circuito</text><text x="770" y="380" font-size="44" font-weight="900" fill="#1f2937" text-anchor="end">24.5 A</text><line x1="130" y1="450" x2="770" y2="450" stroke="#c9d2e3" stroke-width="3"/><text x="130" y="535" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="start">MOCP</text><text x="130" y="578" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">dispositivo máximo de sobrecorriente</text><text x="770" y="540" font-size="44" font-weight="900" fill="#1f2937" text-anchor="end">40 A</text><rect x="40" y="680" width="395" height="230" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="70" y="735" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">CABLE</text><text x="70" y="792" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">Cobre 10 AWG</text><text x="70" y="840" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">35 A a 75 °C</text><text x="70" y="882" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">≥ MCA 24.5 A</text><rect x="465" y="680" width="395" height="230" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="495" y="735" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">INTERRUPTOR</text><text x="495" y="792" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">40 A de 2 polos</text><text x="495" y="840" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">en el MOCP</text><text x="495" y="882" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">nunca por encima de él</text><rect x="40" y="945" width="820" height="150" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="1000" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">TRAMPA DE REEMPLAZO — MISMAS TONELADAS, PLACA NUEVA</text><text x="70" y="1045" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Placa nueva: MCA 17.5 / MOCP 30</text><text x="70" y="1088" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Ese es un circuito diferente</text></svg>