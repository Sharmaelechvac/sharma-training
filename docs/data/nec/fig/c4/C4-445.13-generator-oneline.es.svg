<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">445.13 Conductores del generador</title><desc id="d">Diagrama unifilar: un generador de 22 kW con placa de datos de 92 A alimenta conductores de cobre 2 AWG hasta el primer dispositivo de distribución; una franja de cálculo muestra 92 A por 1.15 igual a 105.8 A, así que conductores de al menos 106 A, y el cobre 2 AWG a 75 grados da 115 A.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1200" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">445.13 Conductores del generador</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">115% de la placa de datos, hasta el primer dispositivo</text><line x1="30" y1="1142" x2="870" y2="1142" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1180" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 445.13</text><text x="870" y="1180" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="280" width="290" height="210" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="5"/><text x="195" y="348" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">GENERADOR</text><text x="195" y="394" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">22 kW · 240 V</text><text x="195" y="440" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">placa: 92 A</text><line x1="340" y1="385" x2="560" y2="385" stroke="#1f2937" stroke-width="6"/><text x="450" y="348" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">conductores</text><rect x="560" y="280" width="300" height="210" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="710" y="362" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">PRIMERO</text><text x="710" y="406" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">DISTRIBUCIÓN</text><text x="710" y="450" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">DISPOSITIVO</text><rect x="40" y="580" width="820" height="300" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="668" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">92 A × 1.15 = 105.8 A</text><text x="450" y="736" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">ampacidad mínima del conductor ≈ 106 A</text><text x="450" y="784" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">2 AWG cobre a 75°C da 115 A ✓</text><text x="40" y="990" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Dimensione desde la placa de datos de la máquina —</text><text x="40" y="1029" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">no solo del valor nominal en kW.</text></svg>