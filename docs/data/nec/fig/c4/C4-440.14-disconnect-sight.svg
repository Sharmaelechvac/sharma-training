<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">440.14 The HVAC disconnect</title><desc id="d">Plan-style view of a house wall with a condenser on a pad and a disconnect on the wall, a dashed line of sight between them, a dimension showing not over 50 ft, a red panel rejecting the indoor breaker by itself, and a red strip marking the 2023 working-space change.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">440.14 The HVAC disconnect</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Within sight: visible, 50 ft max</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 440.14, Art. 100 Within Sight</text><rect x="40" y="190" width="820" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="64" y="248" font-size="34" font-weight="800" fill="#5b6478" text-anchor="start">HOUSE WALL</text><rect x="560" y="300" width="250" height="230" rx="8" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="685" y1="330" x2="685" y2="440" stroke="#1a2f61" stroke-width="6"/><circle cx="685" cy="330" r="12" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="685" y="492" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><rect x="70" y="430" width="320" height="240" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="5"/><circle cx="230" cy="520" r="56" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="230" cy="520" r="22" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="230" y="645" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">CONDENSER</text><rect x="50" y="670" width="360" height="26" rx="0" fill="#c9d2e3" stroke="#c9d2e3" stroke-width="0"/><text x="230" y="736" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">on the pad</text><line x1="392" y1="462" x2="556" y2="400" stroke="#F0A846" stroke-width="5" stroke-dasharray="14 10"/><text x="400" y="380" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">line of sight</text><text x="420" y="600" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">✓ visible from the unit</text><text x="420" y="648" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">✓ reach it, no climbing</text><line x1="70" y1="810" x2="690" y2="810" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="380.0" y="798" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 50 ft from the equipment</text><text x="380.0" y="798" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 50 ft from the equipment</text><rect x="40" y="890" width="820" height="176" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="952" font-size="34" font-weight="900" fill="#c0392b" text-anchor="start">✗ The breaker inside the house panel</text><text x="64" y="1006" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">It is not visible from the unit, so it does</text><text x="64" y="1045" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">not count by itself (440.14).</text><rect x="40" y="1106" width="820" height="150" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="64" y="1168" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">2023 ONLY: the disconnect also needs</text><text x="64" y="1207" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">110.26(A) working space (2023)</text><text x="40" y="1336" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">On the unit or beside it — but never on the</text><text x="40" y="1375" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">access panel, never over the nameplate.</text></svg>