<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">422.13 Storage water heaters</title><desc id="d">Bar chart of two worked examples. A 4,500 W heater draws 18.75 A, its 125 percent minimum is 23.4 A, and it lands on a 30 A breaker. A 5,500 W heater draws 22.9 A, its minimum is 28.6 A, and it also lands on a 30 A breaker with 10 AWG copper.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">422.13 Storage water heaters</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sized at 125% of the nameplate rating</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 422.13</text><text x="870" y="1360" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="770" y1="210" x2="770" y2="1090" stroke="#2e7d32" stroke-width="4" stroke-dasharray="12 9"/><text x="770" y="190" font-size="32" font-weight="900" fill="#2e7d32" text-anchor="middle">30 A</text><text x="40" y="268" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">4,500 W at 240 V</text><text x="40" y="344" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Nameplate draw</text><rect x="320" y="300" width="281" height="64" rx="6" fill="#264387" stroke="#264387" stroke-width="0"/><text x="587" y="344" font-size="32" font-weight="800" fill="#ffffff" text-anchor="end">18.75 A</text><text x="40" y="440" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">125% minimum</text><rect x="320" y="396" width="351" height="64" rx="6" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="657" y="440" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">23.4 A</text><text x="40" y="540" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">→ 30 A breaker on 10 AWG copper</text><text x="40" y="660" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">5,500 W at 240 V</text><text x="40" y="736" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Nameplate draw</text><rect x="320" y="692" width="343" height="64" rx="6" fill="#264387" stroke="#264387" stroke-width="0"/><text x="649" y="736" font-size="32" font-weight="800" fill="#ffffff" text-anchor="end">22.9 A</text><text x="40" y="832" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">125% minimum</text><rect x="320" y="788" width="429" height="64" rx="6" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="735" y="832" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">28.6 A</text><text x="40" y="932" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">→ 30 A breaker on 10 AWG copper</text><text x="40" y="1120" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Scope: fixed storage heaters,</text><text x="40" y="1159" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">120 gal or less (422.13).</text></svg>