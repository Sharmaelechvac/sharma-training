<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">445.12: Proteja la máquina</title><desc id="d">Tarjeta de placa de datos del generador que muestra una corriente nominal de 92 A y protección incorporada, con dos notas: los amperios nominales dimensionan los conductores al 115 por ciento (106 A mínimo, 445.13) y la protección incorporada es la verificación de sobrecarga de 445.12; el diagrama unifilar inferior va del generador al interruptor de transferencia y al tablero.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">445.12: Proteja la máquina</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Una placa de datos, dos verificaciones — 22 kW, 240 V</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 445.12, 445.13</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="190" y="200" width="520" height="240" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="256" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">PLACA DE DATOS DEL GENERADOR</text><text x="450" y="306" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">22 kW — 240 V, monofásico</text><text x="450" y="350" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Corriente nominal: 92 A</text><text x="450" y="394" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Interruptor incorporado: instalado</text><circle cx="168" cy="350" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="168" y="361" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="168" cy="394" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="168" y="405" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="60" y="520" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Los amperios nominales dimensionan el cable:</text><text x="60" y="561" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">    92 A × 115% = 106 A mín. (445.13)</text><text x="60" y="602" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  La protección integrada es la</text><text x="60" y="643" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">    445.12 verificación de sobrecarga</text><rect x="50" y="800" width="220" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="160" y="866" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERADOR</text><line x1="270" y1="855" x2="330" y2="855" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="340" y="800" width="200" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="440" y="850" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">SU PROPIO</text><text x="440" y="886" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERRUPTOR</text><line x1="540" y1="855" x2="610" y2="855" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="620" y="800" width="220" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="730" y="850" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">TRANSFERENCIA</text><text x="730" y="886" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERRUPTOR</text><line x1="450" y1="1010" x2="450" y2="1060" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="240" y="1070" width="420" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="1136" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO — CARGAS</text><rect x="60" y="1240" width="780" height="120" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1290" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">FALLA: SIN PROTECCIÓN EN LA MÁQUINA</text><text x="450" y="1330" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">un interruptor del tablero no es la protección del generador</text></svg>