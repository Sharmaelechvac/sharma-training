<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">422.10: una línea por aparato</title><desc id="d">Una hoja de cómputo con cuatro filas rotuladas - electrodoméstico, capacidad nominal, circuito, desconexión - resuelta para un calentador de agua de acumulación de 4,500 W: 18.75 A de placa de datos, dimensionado al 125 por ciento a 23.4 A, construido como circuito de 30 A en cobre 10 AWG con medio de desconexión bloqueable a la vista.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">422.10: una línea por aparato</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La franja de metrado, resuelta en un calentador de agua.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 422.10, 422.11(E), 422.13, 422.31</text><rect x="40" y="230" width="240" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="307.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">APARATO</text><rect x="280" y="230" width="590" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="305" y="288" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Calentador de agua de acumulación,</text><text x="305" y="334" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">120 gal o menos</text><rect x="40" y="356" width="240" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="433.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">CAPACIDAD NOMINAL</text><rect x="280" y="356" width="590" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="305" y="414" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">4,500 W ÷ 240 V</text><text x="305" y="460" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">= 18.75 A en la placa de datos</text><rect x="40" y="482" width="240" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="559.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">CIRCUITO</text><rect x="280" y="482" width="590" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="305" y="540" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">125% de placa de datos = 23.4 A mín.</text><text x="305" y="586" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Construido: 30 A, 10 AWG Cu — 422.13</text><rect x="40" y="628" width="240" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="160" y="705.0" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DESCONEXIÓN</text><rect x="280" y="628" width="590" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="305" y="686" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Bloqueable, a la vista</text><text x="305" y="732" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">del aparato — 422.31</text><rect x="40" y="790" width="830" height="180" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="65" y="848" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">¿Sin OCPD máximo en la placa de datos?</text><text x="65" y="902" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Más de 13.3 A: hasta 150% de la capacidad nominal.</text><text x="65" y="948" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">13.3 A o menos: 20 A máx. — 422.11(E)</text><rect x="40" y="1000" width="830" height="150" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="65" y="1058" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">¿La placa de datos y el circuito no coinciden?</text><text x="65" y="1112" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Corrija el circuito — nunca reduzca la capacidad por esperanza.</text><rect x="40" y="1180" width="830" height="130" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="450" y="1238" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">¿Aparato en el plano, sin circuito asignado?</text><text x="450" y="1286" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Pregunta abierta en el paquete — no una sorpresa en campo.</text></svg>