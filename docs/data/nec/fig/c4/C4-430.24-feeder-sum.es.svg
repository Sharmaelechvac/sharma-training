<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1280" width="900" height="1280" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">430.24 Alimentador para varios motores</title><desc id="d">Barra apilada que muestra el cálculo del alimentador 430.24: el motor de 5 hp a 28 A cuenta 35 A al 125 por ciento, el de 3 hp a 17 A y el de 2 hp a 12 A cuentan al 100 por ciento, para una ampacidad mínima del conductor de 64 A, cumplida con cobre 6 AWG a 75 grados C con capacidad nominal de 65 A.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1280" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">430.24 Alimentador para varios motores</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo resuelto: tres motores monofásicos de 230 V</text><line x1="30" y1="1222" x2="870" y2="1222" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1260" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 430.24 · Tabla 430.248 · Tabla 310.16</text><rect x="90" y="268" width="385.0" height="108" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="282.5" y="338" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">35 A</text><rect x="475.0" y="268" width="187.0" height="108" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="568.5" y="338" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">17 A</text><rect x="662.0" y="268" width="132.0" height="108" rx="0" fill="#eef2f9" stroke="#eef2f9" stroke-width="0"/><text x="728.0" y="338" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">12 A</text><rect x="90" y="268" width="704.0" height="108" rx="0" fill="none" stroke="#264387" stroke-width="3"/><text x="90" y="240" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">QUÉ APORTA CADA MOTOR</text><text x="90" y="440" font-size="35" font-weight="600" fill="#1f2937" text-anchor="start">•  5 hp — 28 A FLC × 125%  =  35 A   (motor más grande)</text><text x="90" y="488" font-size="35" font-weight="600" fill="#1f2937" text-anchor="start">•  3 hp — 17 A FLC × 100%  =  17 A</text><text x="90" y="536" font-size="35" font-weight="600" fill="#1f2937" text-anchor="start">•  2 hp — 12 A FLC × 100%  =  12 A</text><text x="90" y="620" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">TOTAL — ampacidad mínima del conductor: 64 A</text><line x1="90" y1="660" x2="810" y2="660" stroke="#c9d2e3" stroke-width="3"/><text x="90" y="720" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">cobre 6 AWG, columna de 75°C = 65 A — alcanza</text><text x="90" y="772" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">(Tabla 310.16; aumente el calibre si aplican ajustes.)</text><rect x="60" y="850" width="780" height="120" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="90" y="900" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Solo el motor más grande recibe el 125%.</text><text x="90" y="941" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Todo otro motor va al 100%.</text></svg>