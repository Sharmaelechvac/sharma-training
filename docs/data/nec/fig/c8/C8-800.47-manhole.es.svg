<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Un registro, dos sistemas</title><desc id="d">Sección transversal de un registro subterráneo. Los conductores de potencia ocupan el lado izquierdo, los comunicaciones de comunicaciones el derecho, y una barrera adecuada y permanente se interpone entre ellos. Una franja roja debajo indica que sin barrera hay una violación.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Un registro, dos sistemas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sección de un registro: la barrera es la regla</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.47</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="40" y1="300" x2="860" y2="300" stroke="#1f2937" stroke-width="6"/><text x="450" y="262" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">NIVEL DEL SUELO</text><rect x="110" y="300" width="680" height="640" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="6"/><rect x="110" y="300" width="680" height="70" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="348" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">REGISTRO</text><line x1="190" y1="470" x2="190" y2="860" stroke="#c0392b" stroke-width="8"/><line x1="245" y1="470" x2="245" y2="860" stroke="#c0392b" stroke-width="8"/><text x="218" y="440" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">POTENCIA</text><text x="218" y="992" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">conductores de potencia</text><text x="218" y="1028" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">expuestos</text><rect x="415" y="400" width="70" height="510" rx="0" fill="url(#hatch)" stroke="#F0A846" stroke-width="5"/><line x1="640" y1="470" x2="640" y2="860" stroke="#264387" stroke-width="7"/><line x1="690" y1="470" x2="690" y2="860" stroke="#264387" stroke-width="7"/><text x="640" y="440" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">COMUNICACIONES</text><text x="665" y="992" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">cables de</text><text x="665" y="1028" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">comunicaciones</text><text x="450" y="1085" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">BARRERA ADECUADA — PERMANENTE, FIJA</text><rect x="90" y="1140" width="720" height="120" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1190" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Sin barrera = violación —</text><text x="450" y="1234" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">«apartados» por costumbre no es separación</text></svg>