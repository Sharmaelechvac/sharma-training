<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1330" width="900" height="1330" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Which article owns the run? — 805.1</title><desc id="d">Decision chart: a run serving the provider's communications service falls under Articles 800 and 805; a run serving power-limited control or signaling falls under Article 725.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1330" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Which article owns the run? — 805.1</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The system decides the article — not the cable jacket.</text><line x1="30" y1="1272" x2="870" y2="1272" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 805.1; 725.1; Article 800</text><rect x="150" y="205" width="600" height="130" rx="12" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="450" y="262" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">WHAT SYSTEM DOES</text><text x="450" y="308" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">THE RUN SERVE?</text><line x1="450" y1="335" x2="450" y2="375" stroke="#1a2f61" stroke-width="4"/><line x1="450" y1="375" x2="232" y2="375" stroke="#1a2f61" stroke-width="4"/><line x1="232" y1="375" x2="232" y2="425" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="450" y1="375" x2="667" y2="375" stroke="#1a2f61" stroke-width="4"/><line x1="667" y1="375" x2="667" y2="425" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="435" width="405" height="215" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="232" y="495" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Provider phone or</text><text x="232" y="540" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">data service</text><text x="232" y="610" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">ARTICLES 800 + 805</text><rect x="465" y="435" width="405" height="215" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="667" y="495" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Door access, HVAC</text><text x="667" y="540" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">controls, security</text><text x="667" y="610" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">ARTICLE 725 (Ch 7)</text><rect x="30" y="700" width="840" height="140" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="758" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">SAME CAT 6 CABLE</text><text x="450" y="808" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Phone jack → 805 · Thermostat → 725</text><rect x="30" y="885" width="840" height="150" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="60" y="943" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">TRAP: picking by jacket color</text><text x="60" y="988" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Guess the article and the separation</text><text x="60" y="1028" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">and listing rules get crossed.</text></svg>