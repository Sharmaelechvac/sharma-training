<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The 805 entrance, end to end</title><desc id="d">Flow of a communications entrance: provider network to the demarcation point, through a listed primary protector bonded per 800.100 with the sheath grounded or interrupted, then inside wiring to the one communications outlet.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The 805 entrance, end to end</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Article 805 — demarc to the dwelling outlet</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 805, 800.100</text><rect x="70" y="210" width="490" height="104" rx="10" fill="#264387" stroke="#264387" stroke-width="3"/><text x="95" y="258" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">PROVIDER NETWORK</text><text x="95" y="298" font-size="32" font-weight="600" fill="#ffffff" text-anchor="start">outside plant</text><rect x="70" y="370" width="490" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="95" y="418" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">DEMARCATION POINT</text><text x="95" y="458" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">provider meets customer</text><rect x="70" y="530" width="490" height="104" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="95" y="578" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">PRIMARY PROTECTOR</text><text x="95" y="618" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">805.90 — at the entrance</text><rect x="70" y="690" width="490" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="95" y="738" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">INSIDE WIRING</text><text x="95" y="778" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">to the equipment</text><rect x="70" y="850" width="490" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="95" y="898" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">COMMUNICATIONS OUTLET</text><text x="95" y="938" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">one per dwelling — 805.156</text><line x1="315" y1="314" x2="315" y2="366" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><line x1="315" y1="474" x2="315" y2="526" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><line x1="315" y1="634" x2="315" y2="686" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><line x1="315" y1="794" x2="315" y2="846" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><line x1="560" y1="582" x2="600" y2="582" stroke="#F0A846" stroke-width="8"/><rect x="600" y="512" width="270" height="140" rx="10" fill="#ffffff" stroke="#F0A846" stroke-width="4"/><text x="735" y="576" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">BOND</text><text x="735" y="620" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">PER 800.100</text><line x1="560" y1="742" x2="600" y2="760" stroke="#F0A846" stroke-width="8"/><rect x="600" y="690" width="270" height="150" rx="10" fill="#ffffff" stroke="#F0A846" stroke-width="4"/><text x="735" y="738" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">SHEATH: GROUND</text><text x="735" y="776" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">OR INTERRUPT</text><text x="735" y="814" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">805.93</text><rect x="30" y="1010" width="840" height="110" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1058" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NO PROTECTOR, FLOATING SHEATH,</text><text x="450" y="1102" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NO OUTLET — THE THREE 805 FAILS</text><rect x="60" y="1150" width="34" height="34" rx="6" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="77" y="1176" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="120" y="1180" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Protector listed and at the entrance</text><rect x="60" y="1208" width="34" height="34" rx="6" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="77" y="1234" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="120" y="1238" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Sheath grounded or interrupted</text><rect x="60" y="1266" width="34" height="34" rx="6" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="77" y="1292" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="120" y="1296" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">One outlet cabled to the demarc</text></svg>