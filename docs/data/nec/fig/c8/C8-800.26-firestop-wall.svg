<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Firestopping a rated wall — 800.26</title><desc id="d">Two wall sections: a cable bundle passing through a listed firestop collar marked OK, and the same bundle through an open oversized hole stuffed with scrap insulation marked fail.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Firestopping a rated wall — 800.26</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Same bundle, same wall — one passes.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.26; 300.21</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="190" width="405" height="700" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="232" y="245" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="middle">FIRESTOPPED</text><rect x="190" y="300" width="85" height="470" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><text x="232" y="815" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">rated wall</text><line x1="70" y1="430" x2="395" y2="430" stroke="#264387" stroke-width="10"/><line x1="70" y1="500" x2="395" y2="500" stroke="#264387" stroke-width="10"/><line x1="70" y1="570" x2="395" y2="570" stroke="#264387" stroke-width="10"/><text x="110" y="390" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">coax bundle</text><rect x="178" y="395" width="22" height="215" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><rect x="265" y="395" width="22" height="215" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="232" y="665" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">listed firestop</text><text x="232" y="705" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">system</text><circle cx="396" cy="255" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="396" y="268" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><rect x="465" y="190" width="405" height="700" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="667" y="245" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">OPEN HOLE</text><rect x="625" y="300" width="85" height="470" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><text x="667" y="815" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">rated wall</text><rect x="618" y="385" width="99" height="230" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 8"/><line x1="505" y1="455" x2="830" y2="455" stroke="#264387" stroke-width="10"/><line x1="505" y1="525" x2="830" y2="525" stroke="#264387" stroke-width="10"/><text x="545" y="390" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">coax bundle</text><circle cx="655" cy="420" r="20" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><circle cx="690" cy="585" r="22" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><circle cx="640" cy="590" r="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="667" y="680" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">scrap insulation</text><text x="667" y="720" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">is not firestop</text><line x1="800" y1="232" x2="848" y2="280" stroke="#c0392b" stroke-width="7"/><line x1="848" y1="232" x2="800" y2="280" stroke="#c0392b" stroke-width="7"/><rect x="30" y="930" width="840" height="150" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="60" y="988" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">OK: the rating is restored</text><text x="60" y="1033" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Putty, collars or a listed system,</text><text x="60" y="1073" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">matched to cable type and assembly.</text><rect x="30" y="1110" width="840" height="150" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="60" y="1168" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">FAIL: the rating stays broken</text><text x="60" y="1213" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Fire and smoke pass through the hole.</text><text x="60" y="1253" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">A top Florida comms write-up.</text></svg>