<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">820.100 Coax bond numbers</title><desc id="d">Elevation of a house wall: coax grounding block at the entrance, gold bond conductor down the wall dimensioned 20 ft max, landing at the ground rod; a separate rod at left with a dashed 6 AWG bond-back line; legend with the 14 AWG minimum and 6 AWG cap.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1600" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">820.100 Coax bond numbers</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dwelling case, not to scale.</text><line x1="30" y1="1542" x2="870" y2="1542" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1580" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 820.100, 820.100(D)</text><rect x="520" y="200" width="330" height="760" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><text x="685" y="250" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">HOUSE WALL</text><line x1="120" y1="240" x2="500" y2="330" stroke="#264387" stroke-width="4"/><text x="120" y="215" font-size="32" font-weight="800" fill="#1f2937" text-anchor="start">coax from outside</text><rect x="500" y="300" width="110" height="66" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="555" y="343" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">BLOCK</text><line x1="545" y1="366" x2="545" y2="960" stroke="#F0A846" stroke-width="6"/><line x1="430" y1="366" x2="430" y2="960" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="416" y="675.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">20 ft max</text><text x="416" y="675.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">20 ft max</text><text x="95" y="872" font-size="30" font-weight="800" fill="#1f2937" text-anchor="start">separate rod</text><text x="250" y="918" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">6 AWG min bond-back</text><line x1="180" y1="950" x2="545" y2="950" stroke="#F0A846" stroke-width="4" stroke-dasharray="12 8"/><rect x="0" y="960" width="900" height="80" fill="url(#earth)"/><line x1="0" y1="960" x2="900" y2="960" stroke="#1f2937" stroke-width="3"/><line x1="545" y1="930" x2="545" y2="1035" stroke="#1a2f61" stroke-width="6"/><line x1="180" y1="930" x2="180" y2="1035" stroke="#1a2f61" stroke-width="6"/><circle cx="440" cy="333" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="440" y="345" font-size="36" font-weight="900" f