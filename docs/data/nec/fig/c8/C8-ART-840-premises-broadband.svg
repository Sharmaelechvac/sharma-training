<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 840 — Premises-powered</title><desc id="d">Flow diagram of a premises-powered broadband entrance: provider fiber arrives at the entrance, feeds an optical network terminal powered from a local receptacle, and serves the house network. Side notes route metallic members to the 840.93 bond and the fiber cable itself to Article 770.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 840 — Premises-powered</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Fiber in, local power, metal gets bonded</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 840, 770, 800.100</text><rect x="80" y="200" width="480" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="320.0" y="252" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Provider fiber network</text><text x="320.0" y="294" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">glass in — no power on it</text><line x1="320" y1="310" x2="320" y2="348" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="350" width="480" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="320.0" y="402" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">The entrance</text><text x="320.0" y="444" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">the drop arrives</text><line x1="320" y1="460" x2="320" y2="498" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="500" width="480" height="110" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="320.0" y="552" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">ONT at the enclosure</text><text x="320.0" y="594" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">local receptacle power</text><line x1="320" y1="610" x2="320" y2="648" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="650" width="480" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="320.0" y="702" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">House network</text><text x="320.0" y="744" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">data only from here</text><line x1="560" y1="405" x2="618" y2="405" stroke="#F0A846" stroke-width="5" marker-end="url(#ah)"/><rect x="620" y="350" width="260" height="110" rx="10" fill="#ffffff" stroke="#F0A846" stroke-width="4"/><text x="750.0" y="402" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Metallic part?</text><text x="750.0" y="444" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">bond per 840.93</text><line x1="560" y1="555" x2="618" y2="555" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="620" y="500" width="260" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="750.0" y="552" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Fiber cable</text><text x="750.0" y="594" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Art. 770 — Ch 7</text><rect x="80" y="830" width="800" height="130" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="480" y="884" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Articles 850–890: not assigned in 2020.</text><text x="480" y="928" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Chapter 8 ends at Article 840.</text></svg>