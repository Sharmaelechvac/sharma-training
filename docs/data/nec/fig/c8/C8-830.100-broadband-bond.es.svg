ont-size="34" font-weight="700" fill="#1f2937" text-anchor="start">14 AWG mínimo</text><text x="320" y="586" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">nunca se exige más de 6 AWG</text><text x="60" y="700" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">SI EL RECORRIDO NO PUEDE SER CORTO</text><line x1="200" y1="790" x2="200" y2="1030" stroke="#1a2f61" stroke-width="6"/><path d="M182,1030 L200,1070 L218,1030" stroke="#1a2f61" stroke-width="5" fill="none"/><text x="60" y="748" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">ELECTRODO SEPARADO</text><rect x="575" y="800" width="300" height="120" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="725" y="850" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">GES DE POTENCIA</text><text x="725" y="894" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">sistema del edificio</text><line x1="212" y1="860" x2="600" y2="860" stroke="#F0A846" stroke-width="6" stroke-dasharray="12 8"/><rect x="105" y="772" width="460" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="335" y="808" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">UNIÓN VUELTA: 6 AWG MÍN.</text><rect x="0" y="1000" width="900" height="56" rx="0" fill="url(#earth)" stroke="#1f2937" stroke-width="2"/><text x="60" y="1150" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Los mismos números en 800.100 y 820.100:</text><text x="60" y="1195" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">el capítulo repite un mismo patrón.</text><rect x="40" y="1240" width="820" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1280" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">NO CUMPLE: 30 ft de 14 AWG enrollado en el ático</text><text x="450" y="1322" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle"