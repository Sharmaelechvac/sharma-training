<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Cable types — 800.179</title><desc id="d">Substitution ladder: CMP plenum at top, CMR riser, CMG and CM general purpose, CMX limited use at the bottom; substitution downward only.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Cable types — 800.179</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Fire rating decides where it runs</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.179, 800.154</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="150" y="210" width="560" height="130" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="180" y="268" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CMP — PLENUM</text><text x="180" y="312" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Air-handling spaces</text><rect x="150" y="360" width="560" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="180" y="418" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CMR — RISER</text><text x="180" y="462" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Vertical runs between floors</text><rect x="150" y="510" width="560" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="180" y="568" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CMG — GENERAL</text><text x="180" y="612" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Ordinary horizontal runs</text><rect x="150" y="660" width="560" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="180" y="718" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CM — GENERAL</text><text x="180" y="762" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Ordinary horizontal runs</text><rect x="150" y="810" width="560" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="180" y="868" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CMX — LIMITED USE</text><text x="180" y="912" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Mainly 1- &amp; 2-family dwellings</text><line x1="85" y1="275" x2="85" y2="875" stroke="#2e7d32" stroke-width="6" marker-end="url(#ah)"/><g transform="translate(52,575) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#2e7d32">MAY SUBSTITUTE DOWN</text></g><line x1="790" y1="875" x2="790" y2="275" stroke="#c0392b" stroke-width="6"/><line x1="762" y1="548" x2="818" y2="604" stroke="#c0392b" stroke-width="7"/><line x1="818" y1="548" x2="762" y2="604" stroke="#c0392b" stroke-width="7"/><g transform="translate(852,575) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#c0392b">NEVER UP</text></g><rect x="110" y="1010" width="640" height="110" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="430" y="1062" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">LETTERS = FIRE BEHAVIOR</text><text x="430" y="1102" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Category (Cat 5e, Cat 6) = performance</text><text x="30" y="1210" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Conductors are copper (coax: Article 820)</text><text x="30" y="1255" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Read the jacket before you pull</text></svg>