marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(418,690.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">20 ft máx. en una vivienda</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">20 ft máx. en una vivienda</text></g><rect x="680" y="830" width="200" height="240" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="780" y="870" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Medidor-<tspan x="780" dy="30">principal</tspan></text><rect x="696" y="912" width="168" height="84" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="780" y="966" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">IBT</text><text x="685" y="1112" font-size="30" font-weight="600" fill="#5b6478" text-anchor="end">la unión llega aquí</text><line x1="830" y1="1070" x2="830" y2="1210" stroke="#264387" stroke-width="6"/><rect x="650" y="1210" width="260" height="44" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="2"/><text x="780" y="1300" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">varilla a tierra</text><text x="50" y="1150" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Revise el cable primero:</text><circle cx="130" cy="1252" r="52" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="130" cy="1252" r="16" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="205" y="1240" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Elemento metálico</text><text x="205" y="1284" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">ÚNALO</text><path d="M 560 1232 l 16 22 l 34 -44" stroke="#2e7d32" stroke-width="6" fill="none"/><circle cx="130" cy="1362" r="52" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="130" cy="1362" r="26" fill="#eef2f9" strok