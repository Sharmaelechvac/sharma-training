<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">840.93 — Ponga a tierra el metal</title><desc id="d">Elevación de entrada de banda ancha: una acometida de fibra con un elemento de refuerzo metálico llega a una caja terminal de entrada; el elemento se une con un conductor dorado corto hasta el terminal de unión entre sistemas, junto al medidor-principal. Los recuadros comparan un elemento metálico, que sí se une, con fibra totalmente dieléctrica, que no.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">840.93 — Ponga a tierra el metal</text><text x="30" y="150" font-size="34" font-weight="60