<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">800.100(B) Landings</title><desc id="d">Decision ladder for the entrance bonding conductor: first the intersystem bonding termination, then the building grounding electrode system points such as the grounding electrode conductor or service enclosure, and last an electrode installed for the purpose, minimum 5 ft long and 1/2 in diameter, only where the building has no grounding means.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">800.100(B) Landings</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Take the first landing the building has.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.100(B), 250.94</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="100" y="210" width="700" height="150" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><rect x="130" y="230" width="229" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="244.5" y="264" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FIRST CHOICE</text><text x="130" y="314" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Intersystem bonding termination</text><text x="130" y="350" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">the IBT, if the building has one</text><line x1="450" y1="360" x2="450" y2="428" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="100" y="430" width="700" height="150" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="130" y="450" width="179" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="219.5" y="484" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">IF NO IBT</text><text x="130" y="534" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Grounding electrode system points</text><text x="130" y="570" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">GES, GEC, or service equipment enclosure</text><line x1="450" y1="580" x2="450" y2="648" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="100" y="650" width="700" height="150" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><rect x="130" y="670" width="179" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="219.5" y="704" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">LAST STEP</text><text x="130" y="754" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">A purpose-installed electrode</text><text x="130" y="790" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">only where the building has none</text><line x1="250" y1="890" x2="250" y2="1180" stroke="#1a2f61" stroke-width="6"/><path d="M232,1180 L250,1220 L268,1180" stroke="#1a2f61" stroke-width="5" fill="none"/><line x1="196" y1="890" x2="196" y2="1180" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(184,1035.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">5 ft min</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">5 ft min</text></g><text x="292" y="960" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">PURPOSE ROD</text><text x="292" y="1006" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">1/2 in diameter min</text><rect x="0" y="1180" width="900" height="60" rx="0" fill="url(#earth)" stroke="#1f2937" stroke-width="2"/><text x="60" y="1330" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Take the first landing the building has,</text><text x="60" y="1375" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">and the nearest accessible one.</text></svg>