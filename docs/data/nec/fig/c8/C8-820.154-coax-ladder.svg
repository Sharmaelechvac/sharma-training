<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The coax ladder</title><desc id="d">Ladder of the four coaxial cable types: CATVP plenum at the top, then CATVR riser, CATV general purpose, CATVX limited use, with the spaces each type may serve.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The coax ladder</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Higher types substitute down — never up</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Table 820.154, 820.179</text><rect x="150" y="230" width="600" height="130" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="185" y="288" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CATVP</text><text x="185" y="334" font-size="31" font-weight="600" fill="#1f2937" text-anchor="start">plenums + every space below</text><rect x="150" y="390" width="600" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="185" y="448" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CATVR</text><text x="185" y="494" font-size="31" font-weight="600" fill="#1f2937" text-anchor="start">risers, general, dwellings</text><rect x="150" y="550" width="600" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="185" y="608" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CATV</text><text x="185" y="654" font-size="31" font-weight="600" fill="#1f2937" text-anchor="start">general spaces, dwellings</text><rect x="150" y="710" width="600" height="130" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="185" y="768" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CATVX</text><text x="185" y="814" font-size="31" font-weight="600" fill="#1f2937" text-anchor="start">dwellings + raceway only</text><line x1="95" y1="250" x2="95" y2="820" stroke="#2e7d32" stroke-width="6" marker-end="url(#ah)"/><text x="95" y="215" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">OK</text><line x1="815" y1="820" x2="815" y2="250" stroke="#c0392b" stroke-width="6" marker-end="url(#ah)"/><line x1="775" y1="480" x2="855" y2="560" stroke="#c0392b" stroke-width="8"/><line x1="855" y1="480" x2="775" y2="560" stroke="#c0392b" stroke-width="8"/><text x="815" y="215" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">NO</text><text x="450" y="925" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Substitution runs downhill only:</text><text x="450" y="970" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">a higher type may take a lower type's place.</text><rect x="60" y="1020" width="780" height="120" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1070" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">The table decides — not the jacket color,</text><text x="450" y="1114" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">not what the supplier shipped</text><rect x="60" y="1180" width="780" height="110" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1230" font-size="33" font-weight="800" fill="#c0392b" text-anchor="middle">✗ CATV reel pulled through a return-air plenum</text><text x="450" y="1272" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">plenum space takes CATVP, or a raceway</text></svg>