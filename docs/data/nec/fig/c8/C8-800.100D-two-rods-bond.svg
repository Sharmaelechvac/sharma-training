<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">A separate rod never stands alone</title><desc id="d">Plan of a house with the meter-main and power grounding electrode on the west wall and the communications entrance with its own separate ground rod on the east wall, tied together by a gold 6 AWG bonding conductor; a red panel warns that two unbonded rods can sit thousands of volts apart in a surge.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">A separate rod never stands alone</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Entrance too far from the power ground — 800.100(D)</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.100(D); same rule: 810.21(J), 820.100(D)</text><rect x="60" y="300" width="780" height="330" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="90" y="350" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">HOUSE</text><rect x="90" y="420" width="170" height="100" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="175" y="462" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">METER-</text><text x="175" y="500" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">MAIN</text><rect x="640" y="420" width="170" height="100" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="725" y="462" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">COMM</text><text x="725" y="500" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">DEMARC</text><path d="M640,470 L420,470 L420,560 L260,560" stroke="#5b6478" stroke-width="4" fill="none" stroke-dasharray="12 9"/><text x="450" y="610" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">bonding route over 20 ft</text><line x1="60" y1="700" x2="840" y2="700" stroke="#c9d2e3" stroke-width="4"/><text x="60" y="688" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">GRADE</text><path d="M175,700 L175,830" stroke="#1a2f61" stroke-width="10" fill="none"/><text x="175" y="880" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">POWER GES ROD</text><path d="M725,700 L725,830" stroke="#1a2f61" stroke-width="10" fill="none"/><text x="725" y="878" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SEPARATE</text><text x="725" y="920" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">COMM ROD</text><line x1="175" y1="780" x2="725" y2="780" stroke="#F0A846" stroke-width="10"/><rect x="295.0" y="710" width="310" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="750" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6 AWG MIN BOND</text><rect x="60" y="950" width="780" height="190" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="84" y="1010" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">WITHOUT THE BOND:</text><text x="84" y="1051" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">a surge can put thousands of volts</text><text x="84" y="1092" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">between the two rods — across the</text><text x="84" y="1133" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">equipment inside the house.</text><rect x="60" y="1180" width="780" height="130" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="84" y="1236" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">The separate rod is permitted.</text><text x="84" y="1277" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">Standing alone is not.</text></svg>