<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Antenna bond: minimum sizes</title><desc id="d">Three permitted bonding conductor sizes drawn at relative size, the 14 AWG trap, and a straight bond run from mast through the discharge unit to ground.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Antenna bond: minimum sizes</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">810.21(H) — mast and discharge-unit bond</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 810.21(H)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="30" y="215" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">THREE WAYS TO MEET THE FLOOR</text><circle cx="170" cy="400" r="71" fill="#264387" stroke="#264387" stroke-width="3"/><text x="170" y="414" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">10 AWG</text><line x1="99" y1="300" x2="241" y2="300" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="170.0" y="288" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 AWG min</text><text x="170.0" y="288" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">10 AWG min</text><text x="170" y="520" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">COPPER</text><text x="170" y="562" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">the default run</text><circle cx="440" cy="400" r="90" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="440" y="414" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">8 AWG</text><text x="440" y="520" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">ALUMINUM</text><text x="440" y="562" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">keep off earth</text><text x="440" y="602" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">+ masonry</text><circle cx="725" cy="400" r="32" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="725" y="478" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">17 AWG</text><text x="725" y="520" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">COPPER-CLAD</text><text x="725" y="562" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">STEEL OR BRONZE</text><text x="725" y="602" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">in satellite coax</text><text x="30" y="664" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Circles drawn at relative conductor size.</text><rect x="30" y="700" width="840" height="118" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="60" y="752" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">14 AWG — TOO SMALL FOR ANTENNAS</text><text x="60" y="796" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">It is the 800.100(A) protector floor only.</text><line x1="200" y1="880" x2="200" y2="950" stroke="#1f2937" stroke-width="5"/><line x1="120" y1="900" x2="280" y2="900" stroke="#1f2937" stroke-width="4"/><line x1="145" y1="872" x2="255" y2="872" stroke="#1f2937" stroke-width="4"/><line x1="200" y1="950" x2="200" y2="1330" stroke="#F0A846" stroke-width="8"/><rect x="95" y="1058" width="210" height="84" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="200" y="1096" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">DISCHARGE</text><text x="200" y="1130" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">UNIT</text><line x1="140.0" y1="1346" x2="260.0" y2="1346" stroke="#1f2937" stroke-width="5"/><line x1="160.0" y1="1366" x2="240.0" y2="1366" stroke="#1f2937" stroke-width="5"/><line x1="180.0" y1="1386" x2="220.0" y2="1386" stroke="#1f2937" stroke-width="5"/><line x1="330" y1="900" x2="300" y2="900" stroke="#1a2f61" stroke-width="3"/><text x="345" y="912" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">MAST AND ANTENNA — 810.15</text><line x1="330" y1="1000" x2="215" y2="1000" stroke="#1a2f61" stroke-width="3"/><text x="345" y="1012" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">10 AWG COPPER MINIMUM</text><line x1="330" y1="1100" x2="313" y2="1100" stroke="#1a2f61" stroke-width="3"/><text x="345" y="1112" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">DISCHARGE UNIT — 810.20</text><line x1="330" y1="1210" x2="215" y2="1210" stroke="#1a2f61" stroke-width="3"/><text x="345" y="1222" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">RUN IT STRAIGHT — 810.21</text><line x1="330" y1="1360" x2="268" y2="1360" stroke="#1a2f61" stroke-width="3"/><text x="345" y="1372" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">TO THE GROUNDING SYSTEM</text></svg>