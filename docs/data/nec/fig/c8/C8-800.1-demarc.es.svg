<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Dónde empieza el Artículo 800</title><desc id="d">Diagrama de flujo: la red de la compañía de servicios arriba, un marcador dorado del punto de demarcación en el centro, y el lado del cliente abajo con sistemas de teléfono, CATV, banda ancha y radio/TV bajo el Artículo 800.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Dónde empieza el Artículo 800</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La demarcación separa la planta del proveedor</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.1 · 90.2(B)</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="200" width="720" height="150" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="258" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">RED DE LA COMPAÑÍA</text><text x="450" y="308" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">planta propia del proveedor — no cubierta</text><line x1="450" y1="350" x2="450" y2="420" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="190" y="428" width="520" height="62" rx="31" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="472" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PUNTO DE DEMARCACIÓN</text><text x="450" y="540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">la línea entre sus reglas y las suyas</text><line x1="450" y1="566" x2="450" y2="626" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="90" y="640" width="720" height="470" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="700" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">LADO DEL CLIENTE — ARTÍCULO 800</text><circle cx="150" cy="768" r="17" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><path d="M141 768 l7 8 l13 -16" stroke="#2e7d32" stroke-width="4" fill="none"/><text x="190" y="780" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Teléfono y datos</text><text x="770" y="780" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">Art. 805</text><circle cx="150" cy="850" r="17" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><path d="M141 850 l7 8 l13 -16" stroke="#2e7d32" stroke-width="4" fill="none"/><text x="190" y="862" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Coaxial CATV</text><text x="770" y="862" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">Art. 820</text><circle cx="150" cy="932" r="17" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><path d="M141 932 l7 8 l13 -16" stroke="#2e7d32" stroke-width="4" fill="none"/><text x="190" y="944" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Banda ancha</text><text x="770" y="944" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">Art. 830 / 840</text><circle cx="150" cy="1014" r="17" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><path d="M141 1014 l7 8 l13 -16" stroke="#2e7d32" stroke-width="4" fill="none"/><text x="190" y="1026" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Equipo de radio y TV</text><text x="770" y="1026" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="end">Art. 810</text><rect x="90" y="1160" width="720" height="130" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1212" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Planta de la compañía bajo su</text><text x="450" y="1258" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">control exclusivo = fuera del Código</text></svg>