<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">830.100 Broadband</title><desc id="d">Broadband entrance: network interface unit bonded straight to the intersystem bonding termination at the meter-main with a dimension of 20 ft maximum at a dwelling, 14 AWG minimum and never required over 6 AWG; below, the escape hatch of a separate electrode bonded back with 6 AWG minimum.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">830.100 Broadband</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">14 AWG min, 6 AWG cap, 20 ft at a house.</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 830.100, 800.100, 820.100</text><rect x="60" y="300" width="260" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="190" y="356" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">NIU</text><text x="190" y="400" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">entrance unit</text><line x1="0" y1="365" x2="60" y2="365" stroke="#1f2937" stroke-width="4"/><text x="30" y="262" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">FROM PROVIDER</text><rect x="600" y="300" width="260" height="130" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="730" y="350" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">METER-MAIN</text><text x="730" y="394" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">IBT</text><line x1="320" y1="365" x2="600" y2="365" stroke="#F0A846" stroke-width="7"/><line x1="320" y1="365" x2="320" y2="252" stroke="#1a2f61" stroke-width="2"/><line x1="600" y1="365" x2="600" y2="252" stroke="#1a2f61" stroke-width="2"/><line x1="320" y1="240" x2="600" y2="240" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="460.0" y="228" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">20 ft max at a dwelling</text><text x="460.0" y="228" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">20 ft max at a dwelling</text><rect x="320" y="444" width="332" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="486.0" y="480" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">BONDING CONDUCTOR</text><text x="320" y="540" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">14 AWG minimum</text><text x="320" y="586" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">never required over 6 AWG</text><text x="60" y="700" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">IF THE RUN CANNOT STAY SHORT</text><line x1="200" y1="790" x2="200" y2="1030" stroke="#1a2f61" stroke-width="6"/><path d="M182,1030 L200,1070 L218,1030" stroke="#1a2f61" stroke-width="5" fill="none"/><text x="60" y="748" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">SEPARATE ELECTRODE</text><rect x="600" y="800" width="260" height="120" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="730" y="850" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">POWER GES</text><text x="730" y="894" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">building system</text><line x1="212" y1="860" x2="600" y2="860" stroke="#F0A846" stroke-width="6" stroke-dasharray="12 8"/><rect x="213.0" y="772" width="386" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="406.0" y="808" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">BOND BACK: 6 AWG MIN</text><rect x="0" y="1000" width="900" height="56" rx="0" fill="url(#earth)" stroke="#1f2937" stroke-width="2"/><text x="60" y="1150" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Same numbers at 800.100 and 820.100:</text><text x="60" y="1195" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">the chapter repeats one pattern.</text><rect x="40" y="1240" width="820" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1280" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">FAIL: 30 ft of 14 AWG coiled in the attic</text><text x="450" y="1322" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">or a separate rod never bonded back</text></svg>