<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1640" width="900" height="1640" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">800.106 — Mobile home protector</title><desc id="d">Two-panel comparison. Case 1: the service pedestal is in sight and within 30 feet of the mobile home, so the primary protector grounds into the pedestal system, plus a 12 AWG copper bond to the home frame. Case 2: no grounded disconnect within 30 feet, so the protector grounds to an 800.100(B)(3) electrode, and the frame bond is still required.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1640" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">800.106 — Mobile home protector</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Two cases — the frame bond is in both</text><line x1="30" y1="1582" x2="870" y2="1582" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1620" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.106, 550.32(A)</text><text x="870" y="1620" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="216" width="780" height="56" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="80" y="256" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">CASE 1 — PEDESTAL CLOSE</text><rect x="60" y="300" width="420" height="250" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="60" y1="550" x2="480" y2="550" stroke="#264387" stroke-width="8"/><text x="270" y="400" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">MOBILE HOME</text><text x="270" y="592" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">metal frame</text><rect x="480" y="350" width="170" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="565" y="398" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Primary</text><text x="565" y="434" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">protector</text><rect x="660" y="300" width="180" height="250" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="750" y="405" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Pedestal</text><text x="750" y="449" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">disconnect</text><path d="M 565 460 L 565 700 L 750 700" stroke="#F0A846" stroke-width="7" fill="none"/><line x1="750" y1="550" x2="750" y2="700" stroke="#F0A846" stroke-width="7"/><line x1="480" y1="640" x2="660" y2="640" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="570.0" y="628" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">30 ft max, in sight</text><text x="570.0" y="628" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">30 ft max, in sight</text><text x="60" y="750" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="start">Ground lands in the pedestal system.</text><path d="M 520 460 L 270 548" stroke="#F0A846" stroke-width="7" fill="none"/><line x1="300" y1="556" x2="290" y2="648" stroke="#5b6478" stroke-width="2"/><text x="270" y="682" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">12 AWG Cu bond to frame</text><rect x="60" y="816" width="780" height="56" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="80" y="856" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">CASE 2 — NO DISCONNECT WITHIN 30 FT</text><rect x="60" y="900" width="420" height="250" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="60" y1="1150" x2="480" y2="1150" stroke="#264387" stroke-width="8"/><text x="270" y="1000" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">MOBILE HOME</text><text x="270" y="1192" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">metal frame</text><rect x="480" y="930" width="170" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="565" y="978" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Primary</text><text x="565" y="1014" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">protector</text><path d="M 565 1040 L 565 1260 L 730 1260" stroke="#F0A846" stroke-width="7" fill="none"/><line x1="730" y1="1260" x2="730" y2="1330" stroke="#264387" stroke-width="6"/><rect x="620" y="1330" width="240" height="44" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="2"/><text x="730" y="1195" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">800.100(B)(3)</text><text x="730" y="1237" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">electrode</text><path d="M 520 1040 L 270 1148" stroke="#F0A846" stroke-width="7" fill="none"/><line x1="300" y1="1156" x2="290" y2="1268" stroke="#5b6478" stroke-width="2"/><text x="270" y="1300" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">12 AWG Cu bond to frame</text><text x="60" y="1470" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">A lone rod never replaces it.</text></svg>