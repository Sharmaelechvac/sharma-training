8" text-anchor="middle">edge of hole to edge of wood</text><rect x="90" y="1160" width="720" height="250" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1222" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">NEVER THIS</text><line x1="160" y1="1300" x2="740" y2="1300" stroke="#5b6478" stroke-width="8"/><path d="M450 1300 q30 45 0 80" stroke="#264387" stroke-width="5" fill="none"/><text x="450" y="1372" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">cable zip-tied to another system</text><path d="M120 1185 L780 1330 M780 1185 L120 1330" stroke="#c0392b" stroke-width="6" fill="none"/></svg>