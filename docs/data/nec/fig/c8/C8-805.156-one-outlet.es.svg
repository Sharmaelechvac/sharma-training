<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Una salida cableada a la demarcación</title><desc id="d">Planta de una unidad de vivienda: el punto de demarcación del proveedor en la pared del garaje, un solo tendido de cable dorado hasta una única salida de comunicaciones en la sala, y dos salidas adicionales punteadas que el constructor agrega más allá del mínimo del Código.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Una salida cableada a la demarcación</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vivienda nueva, planta — mínimo de 805.156</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 805.156 (pre-2020 numbering: 800.156)</text><rect x="60" y="210" width="780" height="560" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="500" y1="210" x2="500" y2="500" stroke="#c9d2e3" stroke-width="4"/><line x1="60" y1="500" x2="500" y2="500" stroke="#c9d2e3" stroke-width="4"/><line x1="500" y1="640" x2="840" y2="640" stroke="#c9d2e3" stroke-width="4"/><text x="90" y="260" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">DORMITORIO</text><text x="530" y="260" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">DORMITORIO 2</text><text x="90" y="690" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">GARAJE</text><text x="530" y="600" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">SALA</text><rect x="35" y="540" width="225" height="90" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="147" y="578" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">PUNTO DE</text><text x="147" y="612" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DEMARCACIÓN</text><circle cx="262" cy="545" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="262" y="557" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><path d="M235,585 L300,585 L300,690 L668,690" stroke="#F0A846" stroke-width="8" fill="none"/><rect x="668" y="656" width="68" height="68" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="702" y="700" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">≡</text><circle cx="770" cy="662" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="770" y="674" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="300" y="300" width="56" height="56" rx="0" fill="#ffffff" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 8"/><text x="372" y="338" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">del constructor</text><rect x="620" y="300" width="56" height="56" rx="0" fill="#ffffff" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 8"/><circle cx="716" cy="306" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="716" y="318" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="60" y="850" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Demarcación — aquí termina el proveedor</text><text x="60" y="891" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  La única salida requerida, accesible</text><text x="60" y="932" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  Salidas extra: por el constructor, no por el Código</text><rect x="60" y="1010" width="780" height="120" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="84" y="1062" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">Mínimo del Código: UNA salida por vivienda,</text><text x="84" y="1103" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">cableada de vuelta al punto de demarcación.</text><rect x="60" y="1170" width="780" height="110" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="84" y="1220" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">No basta: una placa sin tendido de cable,</text><text x="84" y="1261" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">o la única salida dentro del garaje.</text></svg>