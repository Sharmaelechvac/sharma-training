<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">La regla de 4 in — solo en exteriores</title><desc id="d">Elevación de pared exterior con una línea de cota que muestra 4 in mínimos entre una acometida de comunicaciones sin blindaje y el cableado de potencia abierto, más dos detalles de entrada: entrada protegida con buje o canalización metálica frente a un agujero desnudo en la estructura de madera.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La regla de 4 in — solo en exteriores</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Cable de comunicaciones vs. potencia abierta</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 805.50; indoors: 800.133(A)(2)</text><rect x="60" y="230" width="780" height="470" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="205" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">PARED EXTERIOR</text><line x1="300" y1="250" x2="300" y2="680" stroke="#264387" stroke-width="6"/><text x="280" y="745" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">ACOMETIDA COM.</text><text x="300" y="788" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">sin blindaje</text><line x1="560" y1="250" x2="560" y2="680" stroke="#c0392b" stroke-width="6"/><circle cx="560" cy="300" r="14" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><circle cx="560" cy="450" r="14" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><circle cx="560" cy="600" r="14" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="625" y="745" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">POTENCIA ABIERTA</text><text x="560" y="788" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">sin canalización</text><line x1="300" y1="330" x2="560" y2="330" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="430.0" y="318" font-size="38" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">4 in mín.</text><text x="430.0" y="318" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">4 in mín.</text><text x="450" y="850" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">escala exagerada</text><rect x="60" y="880" width="380" height="300" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="250" y="935" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">ENTRADA ANTES</text><text x="250" y="978" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DEL PROTECTOR</text><text x="250" y="1035" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">buje o</text><text x="250" y="1079" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">canalización metálica</text><rect x="185" y="1116" width="130" height="50" rx="25" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="250.0" y="1152" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">CUMPLE</text><rect x="460" y="880" width="380" height="300" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="650" y="935" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">AGUJERO DESNUDO</text><text x="650" y="978" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">EN LA MADERA</text><text x="650" y="1035" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">sin buje,</text><text x="650" y="1079" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">sin canalización</text><rect x="555" y="1116" width="190" height="50" rx="25" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="650.0" y="1152" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">NO CUMPLE</text><text x="450" y="1265" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Parte (C): proteja la entrada — aplican excepciones</text><text x="450" y="1330" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">En interiores es otro número: 2 in (800.133(A)(2))</text><text x="450" y="1395" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">Los dos números no son intercambiables</text></svg>