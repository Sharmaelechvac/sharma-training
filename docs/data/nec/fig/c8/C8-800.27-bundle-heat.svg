<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Heat builds in the middle</title><desc id="d">Comparison of one fat powered cable bundle with a red overheated core against the same circuits split into two smaller bundles that run cooler, under an attic roof line.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Heat builds in the middle</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Powered bundles in a hot attic (800.27)</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.27, 800.179</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="40" y1="300" x2="450" y2="170" stroke="#264387" stroke-width="5"/><line x1="450" y1="170" x2="860" y2="300" stroke="#264387" stroke-width="5"/><text x="450" y="252" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">FLORIDA ATTIC</text><circle cx="240" cy="560" r="120" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="185" cy="505" r="34" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="290" cy="500" r="34" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="240" cy="590" r="36" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="180" cy="590" r="30" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="300" cy="585" r="30" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="240" cy="545" r="40" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="240" y="557" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">HOT</text><text x="240" y="745" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">ONE FAT BUNDLE</text><text x="240" y="790" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">core overheats</text><circle cx="585" cy="545" r="68" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><circle cx="559" cy="520" r="20" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="611" cy="520" r="20" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="585" cy="565" r="22" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="745" cy="545" r="68" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><circle cx="719" cy="520" r="20" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="771" cy="520" r="20" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="745" cy="565" r="22" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="665" y="745" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">SPLIT BUNDLES</text><text x="665" y="790" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="middle">heat escapes</text><line x1="450" y1="380" x2="450" y2="830" stroke="#c9d2e3" stroke-width="3" stroke-dasharray="10 8"/><rect x="150.5" y="884" width="599" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="922" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CABLE RATED 60°C MIN (800.179)</text><text x="450" y="1010" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">Operating temperature is what counts —</text><text x="450" y="1058" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">hot space + own load + bundle core</text><text x="450" y="1140" font-size="34" font-weight="700" fill="#c0392b" text-anchor="middle">Never bury powered cable in insulation</text><text x="450" y="1195" font-size="34" font-weight="700" fill="#c0392b" text-anchor="middle">or strap it against a heat source</text></svg>