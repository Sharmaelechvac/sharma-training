xt><line x1="120" y1="920" x2="640" y2="920" stroke="#264387" stroke-width="8"/><rect x="120" y="928" width="278" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="259.0" y="964" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">CABLE CM / CMG</text><rect x="30" y="1040" width="840" height="118" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="60" y="1092" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">LA CANALIZACIÓN NO MEJORA</text><text x="60" y="1136" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">EL CABLE DE ADENTRO — 800.182</text><rect x="30" y="1190" width="840" height="118" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="60" y="1242" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">EL LLENADO DEL CAPÍTULO 9 NO APLICA</text><text x="60" y="1286" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Excepción: banda ancha potencia media — 800.110</text></svg>