<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Coax keeps its distance</title><desc id="d">Attic cross-section: an open power run and a coax run on separate supports with a 2 inch minimum dimension between them. Below, the three prohibited arrangements and the cases where the 2 inch gap is not required.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Coax keeps its distance</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Attic section — gap drawn enlarged to read</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 820.133, 800.133</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="200" width="820" height="460" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="40" y1="610" x2="860" y2="610" stroke="#1f2937" stroke-width="6"/><line x1="140" y1="560" x2="140" y2="610" stroke="#264387" stroke-width="5"/><line x1="450" y1="560" x2="450" y2="610" stroke="#264387" stroke-width="5"/><line x1="760" y1="560" x2="760" y2="610" stroke="#264387" stroke-width="5"/><line x1="90" y1="330" x2="700" y2="330" stroke="#1a2f61" stroke-width="7"/><text x="90" y="300" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">OPEN POWER CONDUCTORS</text><line x1="90" y1="500" x2="700" y2="500" stroke="#264387" stroke-width="7"/><text x="90" y="560" font-size="34" font-weight="800" fill="#264387" text-anchor="start">COAX — OWN SUPPORTS</text><line x1="790" y1="330" x2="790" y2="500" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="776" y="427.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">2 in min</text><text x="776" y="427.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">2 in min</text><rect x="40" y="720" width="820" height="300" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="785" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NEVER</text><text x="70" y="850" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">Coax in the same raceway as power</text><text x="70" y="891" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">Coax supported from a power raceway</text><text x="70" y="932" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">Coax in the same box as power</text><rect x="40" y="1070" width="820" height="320" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="70" y="1135" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">THE 2 IN GAP IS NOT REQUIRED WHEN</text><text x="70" y="1200" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">the power conductors are in a raceway, or in</text><text x="70" y="1241" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">a sheathed cable assembly:</text><text x="70" y="1282" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">nonmetallic-sheathed • armored • UF</text></svg>