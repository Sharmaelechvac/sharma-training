<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">800.100(A) Conductor de unión</title><desc id="d">Elevación de un protector de comunicaciones en una pared, con su conductor de unión corto y recto hasta un terminal de unión entre sistemas. Notas: cobre u otro material resistente a la corrosión, listado; 14 AWG mínimo y nunca se requiere mayor de 6 AWG; 20 ft máximo en vivienda unifamiliar o bifamiliar; una canalización metálica que lleva el conductor se une en ambos extremos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">800.100(A) Conductor de unión</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Unión del protector: calibre, material, longitud</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.100(A)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="30" y1="250" x2="870" y2="250" stroke="#c9d2e3" stroke-width="4"/><text x="30" y="235" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">PARED EN LA ENTRADA DE ACOMETIDA</text><rect x="70" y="280" width="300" height="210" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="220" y="345" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">PROTECTOR</text><text x="220" y="392" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">PRIMARIO</text><text x="220" y="445" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">unión del blindaje</text><circle cx="400" cy="300" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="400" y="312" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><path d="M220,490 L220,640 L640,640" stroke="#F0A846" stroke-width="10" fill="none"/><circle cx="430" cy="640" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="430" y="652" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="160" cy="565" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="160" y="577" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><rect x="640" y="545" width="230" height="190" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="755" y="620" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">IBT</text><text x="755" y="672" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">o GES</text><line x1="755" y1="735" x2="755" y2="800" stroke="#1f2937" stroke-width="5"/><rect x="30" y="800" width="840" height="60" rx="0" fill="url(#earth)" stroke="#5b6478" stroke-width="2"/><text x="450" y="842" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">TIERRA</text><line x1="220" y1="560" x2="640" y2="560" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="430.0" y="548" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">lo más corto posible</text><text x="430.0" y="548" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">lo más corto posible</text><rect x="70" y="885" width="800" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="928" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Páselo corto y recto — en vivienda uni- o</text><text x="450" y="970" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">bifamiliar, nunca más de 20 ft.</text><rect x="70" y="1025" width="800" height="150" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="95" y="1077" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">¿Conductor en canalización metálica?</text><line x1="120" y1="1130" x2="700" y2="1130" stroke="#264387" stroke-width="14"/><line x1="120" y1="1130" x2="700" y2="1130" stroke="#F0A846" stroke-width="5"/><text x="120" y="1110" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="start">unión</text><text x="725" y="1110" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="start">unión</text><text x="410" y="1165" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">canalización unida en AMBOS extremos</text><circle cx="845" cy="1055" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="845" y="1067" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="96" y="1255" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">1  Cobre o resistente a la corrosión, listado</text><text x="96" y="1301" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">2  14 AWG mín. — nunca se requiere más de 6 AWG</text><text x="96" y="1347" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">3  Corto y recto, protegido contra daños</text><text x="96" y="1393" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">4  Canalización metálica: una ambos extremos</text><rect x="70" y="1430" width="800" height="56" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1468" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Muy chico o muy largo = falla la inspección</text></svg>