<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">El Artículo 800 es una capa</title><desc id="d">Diagrama de flujo de las capas del Capítulo 8: primero las reglas generales del Artículo 800, luego el artículo específico 805, 820, 830 u 840 donde las modifica, y después los artículos externos solo donde el Capítulo 8 los referencia.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">El Artículo 800 es una capa</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Trabaje las capas en orden — 800.3</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.3, 250.94</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="220" width="720" height="130" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="272" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">1 — ARTÍCULO 800</text><text x="450" y="318" font-size="32" font-weight="700" fill="#F0A846" text-anchor="middle">reglas generales para todo el Capítulo 8</text><line x1="450" y1="350" x2="450" y2="410" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="90" y="420" width="720" height="160" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="472" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">2 — EL ARTÍCULO ESPECÍFICO</text><text x="450" y="518" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">805 · 820 · 830 · 840</text><text x="450" y="556" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">modifican el 800 donde aplican</text><line x1="450" y1="580" x2="450" y2="640" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="90" y="650" width="720" height="160" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="702" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3 — SOLO DONDE APUNTA EL CAP. 8</text><text x="450" y="748" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">250.94 terminal de unión entre sistemas</text><text x="450" y="786" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Reglas del Cap. 1 — equipo reacondicionado</text><rect x="90" y="880" width="720" height="150" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="932" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Saltar directo al Capítulo 3</text><text x="450" y="976" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">un método de cableado del Cap. 3 no rige</text><text x="450" y="1012" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">un cable de comunicaciones por sí solo</text><text x="450" y="1120" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">Lo específico vence a lo general. Una referencia es</text><text x="450" y="1164" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">la única puerta de salida del Capítulo 8.</text></svg>