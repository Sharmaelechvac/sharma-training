<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">810.57 Transmitting</title><desc id="d">Elevation of a ham transmitting station entrance: antenna mast with lead-in to an antenna discharge unit on the wall, a 10 AWG minimum protective bond and a 14 AWG minimum operating bond, all tied to the one building ground at the meter-main intersystem bonding termination.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">810.57 Transmitting</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Discharge unit, two bonds, one ground.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 810.57, 810.58, 810.15</text><line x1="150" y1="250" x2="150" y2="780" stroke="#1a2f61" stroke-width="6"/><line x1="70" y1="262" x2="230" y2="262" stroke="#1a2f61" stroke-width="5"/><line x1="90" y1="238" x2="90" y2="286" stroke="#1a2f61" stroke-width="4"/><line x1="150" y1="238" x2="150" y2="286" stroke="#1a2f61" stroke-width="4"/><line x1="210" y1="238" x2="210" y2="286" stroke="#1a2f61" stroke-width="4"/><text x="450" y="205" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">TRANSMITTING ANTENNA</text><line x1="470" y1="210" x2="470" y2="1180" stroke="#1f2937" stroke-width="5"/><text x="486" y="246" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">HOUSE WALL</text><path d="M150,430 L150,690 L470,690" stroke="#1f2937" stroke-width="4" fill="none"/><text x="176" y="656" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">LEAD-IN</text><rect x="470" y="620" width="300" height="140" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="620" y="678" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DISCHARGE UNIT</text><text x="620" y="722" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">drains static</text><rect x="470" y="900" width="300" height="120" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="620" y="952" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">RADIO SHACK</text><text x="620" y="994" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">station equipment</text><line x1="620" y1="760" x2="620" y2="900" stroke="#1f2937" stroke-width="4"/><rect x="560" y="300" width="300" height="130" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="710" y="356" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">METER-MAIN</text><text x="710" y="400" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">IBT: one reference</text><line x1="830" y1="430" x2="830" y2="1180" stroke="#1a2f61" stroke-width="4"/><line x1="770" y1="690" x2="830" y2="690" stroke="#F0A846" stroke-width="6"/><rect x="507.0" y="532" width="296" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="655.0" y="568" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PROTECTIVE BOND</text><text x="655" y="616" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">10 AWG MIN</text><line x1="770" y1="960" x2="830" y2="960" stroke="#F0A846" stroke-width="6"/><text x="655" y="876" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OPERATING BOND</text><text x="655" y="1066" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">14 AWG MIN</text><line x1="150" y1="780" x2="150" y2="1180" stroke="#1a2f61" stroke-width="5" stroke-dasharray="12 9"/><text x="176" y="900" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">MAST BOND</text><text x="176" y="940" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">(810.15)</text><rect x="0" y="1180" width="900" height="62" rx="0" fill="url(#earth)" stroke="#1f2937" stroke-width="2"/><line x1="60" y1="1180" x2="860" y2="1180" stroke="#1a2f61" stroke-width="7"/><text x="60" y="1296" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">ONE BUILDING GROUND (GES)</text><rect x="40" y="1330" width="820" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1370" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">FAIL: station rod alone, not bonded back</text><text x="450" y="1412" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">means two potentials in the shack</text></svg>