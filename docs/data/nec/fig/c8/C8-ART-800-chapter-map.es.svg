<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Artículo 800: las reglas generales</title><desc id="d">Mapa del capítulo: el Artículo 800 en el centro con las reglas generales, con líneas hacia los Artículos 805, 820, 830 y 840, y el Artículo 810 apartado en una caja roja punteada marcada como independiente.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Artículo 800: las reglas generales</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Una sola vez en 800 — llevado a 805, 820, 830, 840</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículo 800; el Artículo 810 es independiente</text><rect x="250" y="210" width="400" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="268" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle">ARTÍCULO 800</text><text x="450" y="314" font-size="32" font-weight="700" fill="#F0A846" text-anchor="middle">reglas generales, una sola vez</text><rect x="90" y="400" width="330" height="62" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="255" y="442" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">Calidad de ejecución</text><rect x="90" y="478" width="330" height="62" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="255" y="520" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">Cable abandonado</text><rect x="90" y="556" width="330" height="62" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="255" y="598" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">Sellado cortafuego</text><rect x="90" y="634" width="330" height="62" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="255" y="676" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">Reglas de entrada</text><rect x="455" y="400" width="380" height="62" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="645" y="442" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">Unión + puesta a tierra</text><rect x="480" y="478" width="330" height="62" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="645" y="520" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">Separación</text><rect x="480" y="556" width="330" height="62" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="645" y="598" font-size="32" font-weight="700" fill="#1a2f61" 