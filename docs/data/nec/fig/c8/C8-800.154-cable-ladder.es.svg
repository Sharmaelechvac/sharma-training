<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">800.154 La escalera de cables</title><desc id="d">Una escalera de cuatro peldaños de tipos de cable de comunicaciones: CMP arriba en plenos y en todo lo de abajo; CMR en montantes y uso general; CMG y CM compartiendo un peldaño para uso general y viviendas; CMX abajo en uso limitado en viviendas. Una flecha verde muestra sustitución solo hacia abajo; una flecha roja tachada muestra que sustituir hacia arriba nunca está permitido.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">800.154 La escalera de cables</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sustitución solo hacia abajo</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.154, 800.179</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Manual de Campo Sharma</text><rect x="150" y="210" width="600" height="118" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="185" y="268" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="start">CMP</text><text x="185" y="310" font-size="31" font-weight="700" fill="#1f2937" text-anchor="start">Plenos + todo lo de abajo</text><rect x="150" y="348" width="600" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="185" y="406" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="start">CMR</text><text x="185" y="448" font-size="31" font-weight="700" fill="#1f2937" text-anchor="start">Montantes, uso general</text><rect x="150" y="486" width="600" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="185" y="544" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="start">CMG / CM</text><text x="185" y="586" font-size="31" font-weight="700" fill="#1f2937" text-anchor="start">Uso general y viviendas</text><rect x="480" y="512" width="268" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="614" y="547" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">MISMO PELDAÑO</text><text x="450" y="652" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">Un peldaño: CMG y CM pueden</text><text x="450" y="690" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">sustituirse entre sí.</text><rect x="150" y="724" width="600" height="118" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="185" y="782" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="start">CMX</text><text x="185" y="824" font-size="31" font-weight="700" fill="#1f2937" text-anchor="start">Uso limitado — viviendas</text><path d="M95,240 L95,842" stroke="#2e7d32" stroke-width="8" fill="none"/><path d="M75,807 L95,857 L115,807" stroke="#2e7d32" stroke-width="8" fill="none"/><text x="95" y="900" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">puede</text><text x="95" y="935" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">bajar</text><path d="M815,842 L815,240" stroke="#c0392b" stroke-width="8" fill="none"/><path d="M795,275 L815,225 L835,275" stroke="#c0392b" stroke-width="8" fill="none"/><line x1="770" y1="480" x2="860" y2="570" stroke="#c0392b" stroke-width="10"/><line x1="860" y1="480" x2="770" y2="570" stroke="#c0392b" stroke-width="10"/><text x="815" y="900" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">nunca</text><text x="815" y="935" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">subir</text><rect x="30" y="985" width="840" height="190" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="1040" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Verifique la leyenda de la chaqueta</text><text x="450" y="1082" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">contra el espacio, no la orden.</text><text x="450" y="1124" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">CMX se queda en su carril:</text><text x="450" y="1166" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">viviendas, canaletas, tramos cortos.</text></svg>