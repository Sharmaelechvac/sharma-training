<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Mantenga 6 ft del pararrayos</title><desc id="d">Dos paneles de pared. Izquierda: una entrada de comunicaciones a unos 2 ft de un bajante de pararrayos, marcada como demasiado cerca. Derecha: la entrada movida a la vuelta de la esquina, manteniendo 6 ft mínimos de la trayectoria del bajante.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Mantenga 6 ft del pararrayos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dos entradas: una no cumple, otra sí</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.53</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="225" y="215" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">DEMASIADO CERCA</text><text x="675" y="215" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="middle">A LA VUELTA</text><rect x="55" y="250" width="340" height="560" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="40" y1="810" x2="410" y2="810" stroke="#1f2937" stroke-width="5"/><line x1="110" y1="300" x2="110" y2="810" stroke="#1a2f61" stroke-width="7"/><path d="M92,300 L110,262 L128,300 z" stroke="#1a2f61" stroke-width="3" fill="#1a2f61"/><text x="110" y="852" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">BAJANTE</text><line x1="295" y1="250" x2="295" y2="520" stroke="#264387" stroke-width="5"/><rect x="250" y="520" width="90" height="76" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="295" y="568" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">COM.</text><line x1="110" y1="470" x2="295" y2="470" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="202.5" y="458" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≈ 2 ft</text><text x="202.5" y="458" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">≈ 2 ft</text><text x="252" y="700" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Entrada junto al</text><text x="252" y="744" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">bajante</text><rect x="505" y="250" width="185" height="560" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="690" y="250" width="180" height="560" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="690" y1="250" x2="690" y2="810" stroke="#1a2f61" stroke-width="6"/><line x1="490" y1="810" x2="885" y2="810" stroke="#1f2937" stroke-width="5"/><line x1="545" y1="300" x2="545" y2="810" stroke="#1a2f61" stroke-width="7"/><path d="M527,300 L545,262 L563,300 z" stroke="#1a2f61" stroke-width="3" fill="#1a2f61"/><text x="545" y="852" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">BAJANTE</text><line x1="800" y1="250" x2="800" y2="520" stroke="#264387" stroke-width="5"/><rect x="755" y="520" width="90" height="76" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="800" y="568" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">COM.</text><line x1="545" y1="440" x2="800" y2="440" stroke="#2e7d32" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="672.5" y="428" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft mín.</text><text x="672.5" y="428" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">6 ft mín.</text><text x="597" y="700" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">OESTE</text><text x="780" y="700" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">SUR</text><text x="60" y="950" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">• La sobretensión recorre el bajante un instante</text><text x="60" y="991" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">• Un cable paralelo la capta por inducción</text><text x="60" y="1032" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">• Mida al conductor de pararrayos más cercano</text><rect x="40" y="1120" width="820" height="230" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="70" y="1180" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">CUANDO NO SE PUEDEN LOGRAR 6 FT</text><text x="70" y="1240" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Calcule la separación con la ecuación</text><text x="70" y="1281" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">de descarga lateral, NFPA 780 — sin adivinar.</text></svg>