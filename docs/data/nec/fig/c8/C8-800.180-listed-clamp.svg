<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">800.180 Listed hardware</title><desc id="d">Comparison: top, a listed grounding clamp joins a coax shield to the bond conductor, marked OK; bottom, a hose clamp and a sheet-metal screw through the sheath, marked as failing in a red panel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">800.180 Listed hardware</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">It is the clamp that must be listed.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.180, 800.100</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="30" y="232" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="start">LISTED — PASSES</text><rect x="60" y="368" width="780" height="26" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="60" y="348" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">CABLE SHIELD</text><rect x="400" y="322" width="120" height="118" rx="10" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><line x1="460" y1="322" x2="470" y2="268" stroke="#1a2f61" stroke-width="3"/><circle cx="460" cy="322" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="470" y="230" width="292.0" height="90" rx="10" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="484" y="270" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">listed grounding</text><text x="484" y="306" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">clamp</text><line x1="460" y1="440" x2="460" y2="596" stroke="#F0A846" stroke-width="6"/><rect x="320" y="596" width="280" height="48" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="460" y="630" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">GROUND BAR</text><circle cx="770" cy="300" r="36" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="770" y="313" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">OK</text><text x="60" y="500" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Protector / NID terminal</text><text x="60" y="540" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">also satisfies — listed</text><rect x="30" y="720" width="840" height="480" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="60" y="782" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">NOT LISTED — FAILS</text><rect x="60" y="888" width="780" height="26" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><circle cx="300" cy="901" r="58" fill="none" stroke="#c0392b" stroke-width="5" stroke-dasharray="10 8"/><rect x="548" y="862" width="26" height="78" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><line x1="561" y1="940" x2="561" y2="985" stroke="#c0392b" stroke-width="5"/><text x="60" y="1075" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">Hose clamp — not a grounding device</text><text x="60" y="1119" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">Sheet-metal screw through the sheath</text><text x="30" y="1292" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">800.100 governs the conductor.</text><text x="30" y="1334" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">800.180 governs the fitting.</text></svg>