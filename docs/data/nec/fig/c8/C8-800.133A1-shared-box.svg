<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1320" width="900" height="1320" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">800.133(A)(1)</title><desc id="d">Top: a box shared by power and communications conductors separated by a listed divider, which is permitted. Bottom left: the same box with no barrier, not permitted. Bottom right: Exception No. 2 inside a communications enclosure, power feeding the communications equipment only, kept at least 1/4 in (6 mm) from the communications wiring; the gap is drawn enlarged so the dimension reads.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1320" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">800.133(A)(1)</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sharing: barrier, listed divider, Exception No. 2.</text><line x1="30" y1="1262" x2="870" y2="1262" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1300" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.133(A)(1)</text><text x="870" y="1300" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="184" width="493" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="306.5" y="220" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">SHARED BOX: LISTED DIVIDER</text><rect x="60" y="250" width="780" height="330" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="444" y="250" width="12" height="330" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="2"/><text x="90" y="312" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">LIGHT + POWER</text><text x="486" y="312" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">COMMUNICATIONS</text><line x1="90" y1="380" x2="420" y2="380" stroke="#1f2937" stroke-width="5"/><line x1="486" y1="380" x2="810" y2="380" stroke="#F0A846" stroke-width="5"/><line x1="90" y1="450" x2="420" y2="450" stroke="#1f2937" stroke-width="5"/><line x1="486" y1="450" x2="810" y2="450" stroke="#F0A846" stroke-width="5"/><line x1="90" y1="520" x2="420" y2="520" stroke="#1f2937" stroke-width="5"/><line x1="486" y1="520" x2="810" y2="520" stroke="#F0A846" stroke-width="5"/><text x="486" y="552" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="700" y="560" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="end">PERMITTED</text><rect x="60" y="634" width="207" height="50" rx="25" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="163.5" y="670" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">NO BARRIER</text><rect x="60" y="700" width="360" height="190" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><line x1="90" y1="750" x2="390" y2="750" stroke="#1f2937" stroke-width="5"/><line x1="90" y1="800" x2="390" y2="800" stroke="#F0A846" stroke-width="5"/><line x1="90" y1="850" x2="390" y2="850" stroke="#1f2937" stroke-width="5"/><path d="M90,712 L390,878 M390,712 L90,878" stroke="#c0392b" stroke-width="6" fill="none"/><text x="60" y="940" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">NOT PERMITTED</text><text x="486" y="668" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">EXCEPTION NO. 2</text><rect x="470" y="700" width="370" height="190" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="496" y="748" width="90" height="80" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="541" y="800" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">PWR</text><line x1="716" y1="742" x2="816" y2="742" stroke="#F0A846" stroke-width="5"/><line x1="716" y1="782" x2="816" y2="782" stroke="#F0A846" stroke-width="5"/><line x1="716" y1="822" x2="816" y2="822" stroke="#F0A846" stroke-width="5"/><line x1="600" y1="862" x2="702" y2="862" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="651.0" y="896" font-size="30" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">1/4 in min (6 mm)</text><text x="651.0" y="896" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1/4 in min (6 mm)</text><text x="470" y="940" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">power feeds comm gear only</text><text x="60" y="1052" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">The 1/4 in figure lives in enclosures only.</text><text x="60" y="1097" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">It is not a junction-box allowance.</text><text x="60" y="1150" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Gap drawn enlarged so the dimension reads.</text></svg>