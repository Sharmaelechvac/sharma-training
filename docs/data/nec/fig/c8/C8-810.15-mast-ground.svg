<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1620" width="900" height="1620" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Grounding the mast — 810.15</title><desc id="d">Two panels: an ordinary house whose dish mast is bonded to ground per 810.21, and an antenna sheltered inside the 150 ft rolling-sphere zone of protection of a lightning protection system, where the 810.15 bond is not required.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1620" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Grounding the mast — 810.15</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Bond the mast, unless an LPS shelters it.</text><line x1="30" y1="1562" x2="870" y2="1562" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 810.15; 810.21; 810.21(H)</text><rect x="30" y="195" width="840" height="590" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="60" y="252" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">ORDINARY HOUSE — NO LPS</text><circle cx="838" cy="240" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="838" y="253" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><line x1="90" y1="700" x2="470" y2="700" stroke="#1a2f61" stroke-width="6"/><rect x="120" y="420" width="290" height="280" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><path d="M 95 425 L 265 320 L 435 425" stroke="#1a2f61" stroke-width="6" fill="none"/><line x1="345" y1="345" x2="345" y2="235" stroke="#1a2f61" stroke-width="6"/><path d="M 345 235 Q 395 250 400 300" stroke="#1a2f61" stroke-width="5" fill="none"/><line x1="345" y1="235" x2="400" y2="300" stroke="#1a2f61" stroke-width="3"/><line x1="345" y1="348" x2="478" y2="348" stroke="#F0A846" stroke-width="7"/><line x1="478" y1="348" x2="478" y2="700" stroke="#F0A846" stroke-width="7"/><line x1="478" y1="700" x2="478" y2="745" stroke="#1a2f61" stroke-width="5"/><line x1="448" y1="745" x2="508" y2="745" stroke="#1a2f61" stroke-width="5"/><line x1="460" y1="762" x2="496" y2="762" stroke="#1a2f61" stroke-width="5"/><text x="505" y="420" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">bond per 810.21</text><text x="505" y="465" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">10 AWG Cu min</text><text x="505" y="510" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">straight run,</text><text x="505" y="555" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">protected</text><rect x="505" y="606" width="284" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x=