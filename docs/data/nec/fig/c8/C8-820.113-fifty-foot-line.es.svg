<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">La línea de 50 ft — coaxial exterior</title><desc id="d">Elevación de una casa: la acometida entra por el punto de entrada, el coaxial de planta exterior no listado puede recorrer 50 ft de cable, y el panel de distribución, a 65 ft de recorrido, debe alcanzarse con coaxial listado. Abajo, el tipo listado para cada espacio: CATVP plénum, CATVR vertical, CATV general, CATVX uso limitado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1600" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La línea de 50 ft — coaxial exterior</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elevación — dibujada a escala, 10 unidades = 1 ft</text><line x1="30" y1="1542" x2="870" y2="1542" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1580" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 820.113, 820.48, 820.179</text><rect x="60" y="240" width="780" height="400" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="40" y1="640" x2="860" y2="640" stroke="#1f2937" stroke-width="6"/><text x="450" y="300" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">CASA — RECORRIDO DEL CABLE POR EL ÁTICO</text><line x1="45" y1="470" x2="610" y2="470" stroke="#264387" stroke-width="7"/><line x1="610" y1="470" x2="760" y2="470" stroke="#F0A846" stroke-width="7"/><line x1="610" y1="380" x2="610" y2="560" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><circle cx="110" cy="470" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="110" y="482" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="155" y="545" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">ENTRADA</text><text x="575" y="350" font-size="30" font-weight="700" fill="#c0392b" text-anchor="end">LÍNEA DE 50 FT</text><rect x="724" y="420" width="72" height="100" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="760" y="590" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">PANEL</text><text x="713" y="345" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">COAXIAL LISTADO</text><text x="760" y="385" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">DESDE AQUÍ</text><line x1="110" y1="730" x2="610" y2="730" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="360.0" y="718" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">50 ft máx. — coaxial OSP no listado</text><text x="360.0" y="718" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">50 ft máx. — coaxial OSP no listado</text><line x1="610" y1="800" x2="760" y2="800" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="685.0" y="788" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">recorrido de 65 ft</text><text x="685.0" y="788" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">recorrido de 65 ft</text><text x="60" y="880" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Punto de entrada — los 50 ft son el recorrido,</text><text x="60" y="922" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">     no distancia al panel, no en línea recta</text><text x="60" y="1022" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">ESPACIO PLÉNUM</text><line x1="430" y1="1010" x2="560" y2="1010" stroke="#c9d2e3" stroke-width="3"/><rect x="580" y="974" width="128" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="644.0" y="1014" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CATVP</text><text x="60" y="1114" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">DUCTO VERTICAL</text><line x1="430" y1="1102" x2="560" y2="1102" stroke="#c9d2e3" stroke-width="3"/><rect x="580" y="1066" width="128" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="644.0" y="1106" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CATVR</text><text x="60" y="1206" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">ESPACIO GENERAL</text><line x1="430" y1="1194" x2="560" y2="1194" stroke="#c9d2e3" stroke-width="3"/><rect x="580" y="1158" width="108" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="634.0" y="1198" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CATV</text><text x="60" y="1298" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">VIVIENDA / CANALIZACIÓN</text><line x1="552" y1="1286" x2="580" y2="1286" stroke="#c9d2e3" stroke-width="3"/><rect x="600" y="1250" width="128" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="664.0" y="1290" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CATVX</text><text x="60" y="1396" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">El tipo debe coincidir con el espacio que atraviesa.</text></svg>