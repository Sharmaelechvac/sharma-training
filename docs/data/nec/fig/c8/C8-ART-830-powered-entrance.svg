<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1360" width="900" height="1360" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 830</title><desc id="d">Flow of a network-powered broadband entrance: provider network, primary protector, demarcation point, network interface unit and inside wiring, with the protector and interface unit grounded on the 800.100 recipe, and a warning to keep hands off the provider plant past the demarc.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1360" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 830</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Power arrives on the cable: protect, ground.</text><line x1="30" y1="1302" x2="870" y2="1302" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1340" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 830, 800.100, 830.100</text><rect x="40" y="300" width="230" height="140" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="155" y="358" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">PROVIDER</text><text x="155" y="402" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">power + signal</text><line x1="270" y1="370" x2="330" y2="370" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="340" y="300" width="230" height="140" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="455" y="358" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">PROTECTOR</text><text x="455" y="402" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">primary (830.90)</text><line x1="612" y1="250" x2="612" y2="560" stroke="#F0A846" stroke-width="5" stroke-dasharray="12 8"/><rect x="548.0" y="192" width="128" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="612.0" y="226" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">DEMARC</text><line x1="570" y1="370" x2="630" y2="370" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="640" y="300" width="230" height="140" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="755" y="358" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">NIU</text><text x="755" y="402" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">interface unit</text><line x1="755" y1="440" x2="755" y2="540" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="640" y="540" width="230" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="755" y="588" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">INSIDE</text><text x="755" y="630" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">WIRING</text><line x1="455" y1="440" x2="455" y2="760" stroke="#F0A846" stroke-width="6"/><path d="M640,505 L585,505 L585,760" stroke="#F0A846" stroke-width="6" fill="none"/><rect x="120" y="760" width="660" height="26" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="300" y="836" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">GROUND: 800.100 RECIPE</text><line x1="250" y1="786" x2="250" y2="900" stroke="#1a2f61" stroke-width="6"/><path d="M232,900 L250,940 L268,900" stroke="#1a2f61" stroke-width="5" fill="none"/><rect x="0" y="900" width="900" height="56" rx="0" fill="url(#earth)" stroke="#1f2937" stroke-width="2"/><rect x="40" y="1010" width="820" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1050" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">HANDS OFF: provider plant past the demarc</text><text x="450" y="1092" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">stays live even in a building outage</text><text x="60" y="1180" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Shields, protectors + NIU enclosures:</text><text x="60" y="1225" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">all grounded at the entrance.</text></svg>