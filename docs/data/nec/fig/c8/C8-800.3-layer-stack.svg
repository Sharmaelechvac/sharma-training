<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 800 is a layer</title><desc id="d">Flow diagram of the Chapter 8 layers: Article 800 general rules first, then the specific article 805, 820, 830 or 840 where it modifies them, then outside articles only where Chapter 8 references them.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 800 is a layer</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Work the layers in order — 800.3</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.3, 250.94</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="220" width="720" height="130" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="272" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">1 — ARTICLE 800</text><text x="450" y="318" font-size="32" font-weight="700" fill="#F0A846" text-anchor="middle">general rules for all of Chapter 8</text><line x1="450" y1="350" x2="450" y2="410" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="90" y="420" width="720" height="160" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="472" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">2 — THE SPECIFIC ARTICLE</text><text x="450" y="518" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">805 · 820 · 830 · 840</text><text x="450" y="556" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">modify 800 where they speak</text><line x1="450" y1="580" x2="450" y2="640" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="90" y="650" width="720" height="160" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="702" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3 — ONLY WHERE CHAPTER 8 POINTS</text><text x="450" y="748" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">250.94 intersystem bonding termination</text><text x="450" y="786" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Ch. 1 rules — reconditioned equipment</text><rect x="90" y="880" width="720" height="150" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="932" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Skipping straight to Chapter 3</text><text x="450" y="976" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">a Ch. 3 wiring method does not govern</text><text x="450" y="1012" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">a communications cable on its own</text><text x="450" y="1120" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">Specific beats general. A reference is</text><text x="450" y="1164" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">the only door out of Chapter 8.</text></svg>