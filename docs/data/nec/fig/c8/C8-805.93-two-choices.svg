<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Ground it or break it</title><desc id="d">Comparison panel: an entering communications cable whose metallic sheath is either grounded following 800.100 or interrupted by an insulating joint, in each case as near as practicable to the point of entry.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Ground it or break it</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The entering cable sheath — at the entrance, 805.93</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 805.93, 800.100</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="190" y="210" width="520" height="84" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="264" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">CABLE ENTERS BUILDING</text><line x1="450" y1="294" x2="450" y2="380" stroke="#1f2937" stroke-width="5"/><text x="478" y="344" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">metallic sheath</text><line x1="450" y1="380" x2="230" y2="470" stroke="#1a2f61" stroke-width="4"/><line x1="450" y1="380" x2="670" y2="470" stroke="#1a2f61" stroke-width="4"/><rect x="30" y="470" width="400" height="300" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="230" y="528" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">CHOICE 1: GROUND IT</text><text x="230" y="590" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">sheath bonded at</text><text x="230" y="629" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">the entrance,</text><text x="230" y="668" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">following 800.100</text><text x="230" y="726" font-size="30" font-weight="700" fill="#2e7d32" text-anchor="middle">✓ surge kept outside</text><rect x="470" y="470" width="400" height="300" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="670" y="528" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">CHOICE 2: BREAK IT</text><text x="670" y="590" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">insulating joint or</text><text x="670" y="629" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">equivalent device</text><text x="670" y="668" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">breaks continuity</text><text x="670" y="726" font-size="30" font-weight="700" fill="#2e7d32" text-anchor="middle">✓ surge path is cut</text><text x="450" y="850" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Either way: as near as practicable</text><text x="450" y="894" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">to the point of entry</text><rect x="60" y="960" width="780" height="150" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1014" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Sheath floats into the building</text><text x="450" y="1058" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">a long antenna delivering surge energy</text><text x="450" y="1094" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">deep into the living space</text><text x="450" y="1190" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">Same entrance, same idea as the coax</text><text x="450" y="1234" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">shield rule in 820.93.</text></svg>