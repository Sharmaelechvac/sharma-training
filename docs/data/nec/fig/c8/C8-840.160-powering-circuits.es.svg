<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Circuitos alimentados: señal + potencia</title><desc id="d">Una fuente de potencia listada que alimenta un cable de comunicaciones listado de 4 pares, que lleva tanto el circuito de comunicaciones como un circuito de alimentación hasta el equipo de comunicaciones listado, con la franja de excepción de 0.3 amperios y un panel rojo que muestra lo que la sección no cubre.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Circuitos alimentados: señal + potencia</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un solo cable listado hace ambos trabajos — 840.160</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 840.160 — Circuitos de alimentación</text><rect x="40" y="300" width="240" height="170" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="160" y="356" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">LISTADO</text><text x="160" y="399" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">FUENTE DE</text><text x="160" y="442" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">POTENCIA</text><text x="160" y="520" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">ej., switch PoE</text><rect x="620" y="300" width="240" height="170" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="740" y="352" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">LISTADO</text><text x="740" y="393" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">COMUNIC.</text><text x="740" y="434" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">EQUIPO</text><text x="740" y="520" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">cámara · tel. · AP</text><line x1="280" y1="350" x2="620" y2="350" stroke="#F0A846" stroke-width="8"/><line x1="280" y1="420" x2="620" y2="420" stroke="#264387" stroke-width="8"/><text x="450" y="322" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">COMUNICACIONES</text><text x="450" y="478" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">ALIMENTACIÓN</text><text x="450" y="590" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">UN CABLE LISTADO DE 4 PARES (805.179)</text><rect x="60" y="660" width="780" height="170" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="84" y="716" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">EXCEPCIÓN — no se exige 725.144:</text><text x="84" y="757" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">cable listado de 4 pares, corriente nominal</text><text x="84" y="798" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">≤ 0.3 A en cualquier conductor, 24 AWG +</text><rect x="60" y="870" width="780" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="84" y="922" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">¿Cable sustituido por Clase 2 / 3?</text><text x="84" y="963" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Entonces la instalación cumple con 725.144.</text><rect x="60" y="1040" width="780" height="190" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="84" y="1100" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">NO CUBIERTO POR 840.160:</text><text x="84" y="1141" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">un circuito ramal de 120 V conectado en</text><text x="84" y="1182" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">un cable o una caja de comunicaciones.</text></svg>