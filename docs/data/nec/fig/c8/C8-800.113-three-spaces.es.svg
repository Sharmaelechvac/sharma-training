<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">800.113 Plenum, riser, piso</title><desc id="d">Tres paneles apilados. Arriba: un espacio de cielo raso plenum con cable plenum CMP. En el medio: un ducto vertical riser entre pisos con cable riser CMR, con las alternativas de canalización metálica o un ducto a prueba de fuego con sellos cortafuego en cada piso. Abajo: un tramo de oficina en el mismo piso con cable de uso general CM o CMG. Una nota agrega que las viviendas tienen su propia lista y que ningún voltaje nominal va marcado en el cable de comunicaciones.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">800.113 Plenum, riser, piso</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Haga coincidir el cable con el espacio</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.113, 800.179</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="190" width="840" height="330" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="55" y="238" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">PLENUM — cielo raso con manejo de aire</text><text x="55" y="285" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">losetas de cielo</text><line x1="55" y1="300" x2="845" y2="300" stroke="#1f2937" stroke-width="6"/><path d="M150,322 l26,18 l-26,18" stroke="#5b6478" stroke-width="4" fill="none"/><path d="M350,322 l26,18 l-26,18" stroke="#5b6478" stroke-width="4" fill="none"/><path d="M550,322 l26,18 l-26,18" stroke="#5b6478" stroke-width="4" fill="none"/><path d="M750,322 l26,18 l-26,18" stroke="#5b6478" stroke-width="4" fill="none"/><text x="450" y="402" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">el aire pasa por este espacio</text><line x1="120" y1="455" x2="780" y2="455" stroke="#F0A846" stroke-width="9"/><circle cx="120" cy="455" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="780" cy="455" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="274.5" y="456" width="351" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="494" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CMP — tipo plenum</text><rect x="30" y="545" width="840" height="400" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="55" y="593" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">RISER — el tramo cruza un piso</text><text x="55" y="685" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">piso de arriba</text><line x1="55" y1="700" x2="845" y2="700" stroke="#1f2937" stroke-width="6"/><line x1="300" y1="665" x2="300" y2="880" stroke="#F0A846" stroke-width="9"/><rect x="134.0" y="609" width="332" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="300.0" y="647" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CMR — tipo riser</text><line x1="55" y1="880" x2="845" y2="880" stroke="#1f2937" stroke-width="6"/><text x="55" y="925" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">piso de abajo</text><text x="420" y="745" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">o el tramo va en</text><text x="420" y="785" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">canalización metálica, o un</text><text x="420" y="825" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">ducto a prueba de fuego con</text><text x="420" y="865" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">cortafuegos en cada piso</text><rect x="30" y="970" width="840" height="300" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="55" y="1018" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">MISMO PISO — tramo normal de oficina</text><line x1="120" y1="1095" x2="780" y2="1095" stroke="#F0A846" stroke-width="9"/><circle cx="120" cy="1095" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="780" cy="1095" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="227.0" y="1096" width="446" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="1134" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CM / CMG — uso general</text><text x="450" y="1225" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Sin cruzar pisos, sin manejo de aire</text><rect x="30" y="1300" width="840" height="150" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1352" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Las viviendas tienen su lista — CM o CMX</text><text x="450" y="1394" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">en una casa. El cable debe ser listado, y</text><text x="450" y="1436" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">ningún voltaje va marcado en el cable comm.</text></svg>