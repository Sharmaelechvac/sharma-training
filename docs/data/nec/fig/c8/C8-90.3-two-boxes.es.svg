<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">El Capítulo 8 se sostiene por sí solo</title><desc id="d">Dos cajas: los Capítulos 1 a 7 a la izquierda, el Capítulo 8 a la derecha. Cuatro flechas rotuladas cruzan de izquierda a derecha (250.94, 300.4(D), 300.11, 300.22) y una flecha roja tachada muestra que cualquier otra regla de los Capítulos 1–7 no cruza.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">El Capítulo 8 se sostiene por sí solo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Los Capítulos 1–7 cruzan donde el Capítulo 8 señala</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 90.3</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="210" width="380" height="300" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="230" y="285" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">CAPÍTULOS 1–7</text><text x="230" y="340" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">cableado de potencia</text><text x="230" y="386" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">que usted conoce</text><text x="230" y="452" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">se quedan de su lado</text><rect x="480" y="210" width="380" height="300" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="670" y="285" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">CAPÍTULO 8</text><text x="670" y="340" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">comunicaciones</text><text x="670" y="386" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">sistemas</text><text x="670" y="452" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">tiene reglas propias</text><line x1="70" y1="620" x2="830" y2="620" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="604" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">250.94 — terminal de unión</text><line x1="70" y1="716" x2="830" y2="716" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="700" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">300.4(D) — regla de perforación de 1¼ in</text><line x1="70" y1="812" x2="830" y2="812" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="796" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">300.11 — fijación y soporte</text><line x1="70" y1="908" x2="830" y2="908" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="892" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">300.22 — espacios de manejo de aire</text><text x="450" y="1010" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">…y solo donde una regla del Capítulo 8 lo señala</text><line x1="70" y1="1120" x2="830" y2="1120" stroke="#c0392b" stroke-width="4" marker-end="url(#ah)"/><path d="M415 1085 L485 1155 M485 1085 L415 1155" stroke="#c0392b" stroke-width="7" fill="none"/><text x="450" y="1212" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">cualquier otra regla de los Cap. 1–7</text><text x="450" y="1258" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NO cruza por sí sola</text></svg>