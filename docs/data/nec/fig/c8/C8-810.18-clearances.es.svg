<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">810.18 Distancias del cable de bajada</title><desc id="d">Esquema de elevación: un mástil de techo y su cable de bajada que entra por la pared de la casa, una línea de mayor voltaje acotada a 10 ft mín. arriba, una acometida de 120/240 con una burbuja de 2 ft mín. al cable de bajada, y un conductor bajante de pararrayos acotado a 6 ft mín. del extremo del cable a lo largo de la pared.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">810.18 Distancias del cable de bajada</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Esquema de elevación, sin escala.</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 810.18, Table 810.16</text><line x1="30" y1="238" x2="870" y2="238" stroke="#264387" stroke-width="5"/><text x="30" y="218" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="start">LÍNEA DE MÁS DE 250 V</text><line x1="330" y1="350" x2="330" y2="780" stroke="#1a2f61" stroke-width="6"/><line x1="255" y1="385" x2="405" y2="385" stroke="#1a2f61" stroke-width="4"/><line x1="285" y1="425" x2="375" y2="425" stroke="#1a2f61" stroke-width="4"/><text x="345" y="345" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">MÁSTIL</text><line x1="455" y1="238" x2="455" y2="355" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="469" y="308.4" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft mín.</text><text x="469" y="308.4" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">10 ft mín.</text><line x1="80" y1="430" x2="80" y2="780" stroke="#1a2f61" stroke-width="6"/><line x1="40" y1="462" x2="120" y2="462" stroke="#1a2f61" stroke-width="5"/><path d="M80,470 Q300,560 520,690" stroke="#264387" stroke-width="4" fill="none"/><text x="60" y="415" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">POSTE</text><line x1="330" y1="390" x2="520" y2="800" stroke="#264387" stroke-width="5"/><rect x="234.5" y="568" width="171" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="320.0" y="604" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2 ft mín.</text><text x="100" y="668" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">ACOMETIDA 120/240</text><rect x="0" y="780" width="900" height="90" fill="url(#hatch)"/><line x1="0" y1="780" x2="900" y2="780" stroke="#1f2937" stroke-width="3"/><line x1="0" y1="870" x2="900" y2="870" stroke="#1f2937" stroke-width="3"/><text x="30" y="838" font-size="30" font-weight="900" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">PARED DE LA CASA</text><text x="30" y="838" font-size="30" font-weight="900" fill="#5b6478" text-anchor="start">PARED DE LA CASA</text><rect x="500" y="788" width="44" height="74" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="520" y1="870" x2="520" y2="990" stroke="#264387" stroke-width="5"/><line x1="760" y1="540" x2="760" y2="1010" stroke="#1a2f61" stroke-width="5"/><line x1="760" y1="470" x2="760" y2="540" stroke="#1a2f61" stroke-width="5"/><circle cx="760" cy="458" r="10" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="660" y="430" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">PARARRAYOS</text><line x1="520" y1="930" x2="760" y2="930" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="640.0" y="970" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 ft mín.</text><text x="640.0" y="970" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft mín.</text><rect x="30" y="1130" width="840" height="250" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="58" y="1185" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Distancias a la posición de oscilación —</text><text x="58" y="1229" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">el viento mueve el cable de bajada, no la cinta.</text><text x="58" y="1273" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Subterráneo: 12 in mín. de la potencia.</text><text x="58" y="1317" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Interiores: 2 in mín. de la potencia.</text><rect x="30" y="1410" width="840" height="118" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1462" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Tabla 810.16: menos de 35 ft, 19 AWG Cu;</text><text x="450" y="1504" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">más de 150 ft, 12 AWG Cu.</text></svg>