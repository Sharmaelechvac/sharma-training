<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Bond the separate rod — 810.21(J)</title><desc id="d">Plan view of a house: the power grounding electrode system at one end and a separate dish ground rod at the other, tied together by a bonding conductor of 6 AWG copper minimum.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Bond the separate rod — 810.21(J)</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A separate rod is allowed — unbonded is not.</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 810.21(J); 800.100(D)</text><rect x="200" y="230" width="500" height="300" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><text x="450" y="395" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">HOUSE</text><text x="450" y="445" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">plan view</text><circle cx="700" cy="330" r="16" fill="#264387" stroke="#264387" stroke-width="0"/><text x="728" y="342" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">DISH</text><text x="200" y="585" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">power GES</text><text x="700" y="585" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">separate dish rod</text><circle cx="200" cy="650" r="20" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="200" y1="670" x2="200" y2="720" stroke="#1a2f61" stroke-width="5"/><line x1="172" y1="720" x2="228" y2="720" stroke="#1a2f61" stroke-width="5"/><line x1="182" y1="736" x2="218" y2="736" stroke="#1a2f61" stroke-width="5"/><circle cx="700" cy="650" r="20" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="700" y1="670" x2="700" y2="720" stroke="#1a2f61" stroke-width="5"/><line x1="672" y1="720" x2="728" y2="720" stroke="#1a2f61" stroke-width="5"/><line x1="682" y1="736" x2="718" y2="736" stroke="#1a2f61" stroke-width="5"/><line x1="200" y1="650" x2="700" y2="650" stroke="#F0A846" stroke-width="8"/><rect x="255.5" y="604" width="389" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="642" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">BOND — 6 AWG Cu MIN</text><rect x="30" y="790" width="840" height="160" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="60" y="848" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">UNBONDED = TWO EARTH REFERENCES</text><text x="60" y="893" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">A surge can put thousands of volts</text><text x="60" y="933" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">between them — across your equipment.</text><rect x="30" y="985" width="840" height="150" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="60" y="1043" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">ONE BUILDING, ONE EARTH REFERENCE</text><text x="60" y="1088" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">The 6 AWG bond ties both rods to the</text><text x="60" y="1128" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">power grounding electrode system.</text></svg>