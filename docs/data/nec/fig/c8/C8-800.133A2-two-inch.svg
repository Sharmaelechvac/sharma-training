<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">800.133(A)(2) 2-inch rule</title><desc id="d">A stud bay with NM power cable and Cat 6 communications cable running parallel, dimensioned 2 in minimum apart. Below, a green panel shows that the NM cable sheath itself counts as the separation, and a red panel shows communications cable laid against open power wiring, which is never accepted.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">800.133(A)(2) 2-inch rule</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Open runs beside power wiring</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.133(A)(2)</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="450" y="198" font-size="32" font-weight="800" fill="#1f2937" text-anchor="middle">Parallel open runs: keep them apart</text><rect x="180" y="210" width="90" height="560" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><rect x="630" y="210" width="90" height="560" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="5"/><text x="225" y="810" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">stud</text><text x="675" y="810" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">stud</text><line x1="60" y1="420" x2="840" y2="420" stroke="#264387" stroke-width="16"/><line x1="60" y1="420" x2="840" y2="420" stroke="#ffffff" stroke-width="4"/><text x="450" y="385" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">NM power cable</text><line x1="60" y1="620" x2="840" y2="620" stroke="#F0A846" stroke-width="12"/><text x="450" y="585" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Cat 6 communications</text><line x1="795" y1="420" x2="795" y2="620" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="781" y="532.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">2 in min</text><text x="781" y="532.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">2 in min</text><rect x="30" y="860" width="840" height="205" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="60" y="915" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="start">✓ THE SHEATH COUNTS</text><text x="60" y="962" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Power in raceway or sheathed cable</text><text x="60" y="1004" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">(NM, UF, armored) has its separation;</text><text x="60" y="1046" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">the bare 2 in of space is not demanded.</text><rect x="30" y="1090" width="840" height="205" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="60" y="1145" font-size="34" font-weight="900" fill="#c0392b" text-anchor="start">✗ NEVER ACCEPTED</text><text x="60" y="1192" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Cat 6 directly against open power</text><text x="60" y="1234" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">wiring, nothing between them — no</text><text x="60" y="1276" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">space, no sheath, no raceway.</text><text x="450" y="1355" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Cross power at right angles only</text></svg>