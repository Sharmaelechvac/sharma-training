<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1640" width="900" height="1640" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">A discharge unit per lead-in</title><desc id="d">House elevation with a roof antenna and a dish: each lead-in conductor gets its own listed discharge unit at the point of entrance, and both units are bonded to ground.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1640" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">A discharge unit per lead-in</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">810.20 — at the entrance, bonded per 810.21</text><line x1="30" y1="1582" x2="870" y2="1582" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1620" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 810.20, 810.21</text><text x="870" y="1620" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="600" y1="330" x2="600" y2="1300" stroke="#1f2937" stroke-width="5"/><path d="M420,450 L600,330 L780,450" stroke="#1f2937" stroke-width="5" fill="none"/><line x1="600" y1="330" x2="600" y2="215" stroke="#1f2937" stroke-width="5"/><line x1="520" y1="245" x2="680" y2="245" stroke="#1f2937" stroke-width="4"/><line x1="545" y1="278" x2="655" y2="278" stroke="#1f2937" stroke-width="4"/><text x="700" y="250" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">ANTENNA</text><path d="M668,560 A62,62 0 0 1 742,622" stroke="#264387" stroke-width="5" fill="none"/><line x1="706" y1="592" x2="640" y2="640" stroke="#264387" stroke-width="4"/><text x="762" y="588" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">DISH</text><line x1="600" y1="340" x2="500" y2="420" stroke="#1f2937" stroke-width="4"/><line x1="500" y1="420" x2="500" y2="890" stroke="#1f2937" stroke-width="4"/><line x1="640" y1="640" x2="770" y2="700" stroke="#1f2937" stroke-width="4"/><line x1="770" y1="700" x2="770" y2="890" stroke="#1f2937" stroke-width="4"/><rect x="405" y="890" width="190" height="92" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="500" y="928" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DISCHARGE</text><text x="500" y="964" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">UNIT</text><rect x="675" y="890" width="190" height="92" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="770" y="928" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DISCHARGE</text><text x="770" y="964" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">UNIT</text><text x="30" y="1186" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">ONE PER LEAD-IN</text><text x="30" y="1228" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">AT THE ENTRANCE</text><line x1="500" y1="982" x2="500" y2="1080" stroke="#F0A846" stroke-width="8"/><line x1="770" y1="982" x2="770" y2="1080" stroke="#F0A846" stroke-width="8"/><line x1="500" y1="1080" x2="770" y2="1080" stroke="#F0A846" stroke-width="8"/><text x="30" y="1128" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">BOND PER 810.21 — 10 AWG CU MIN</text><line x1="635" y1="1080" x2="635" y2="1300" stroke="#F0A846" stroke-width="8"/><line x1="635" y1="1300" x2="635" y2="1336" stroke="#264387" stroke-width="7"/><text x="657" y="1268" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">TO GROUND</text><line x1="30" y1="1336" x2="870" y2="1336" stroke="#1f2937" stroke-width="4"/><rect x="30" y="1336" width="840" height="34" rx="0" fill="url(#earth)" stroke="none" stroke-width="0"/><rect x="30" y="1420" width="840" height="110" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1468" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">KEEP IT AWAY FROM COMBUSTIBLES</text><text x="450" y="1512" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">AND OUT OF CLASSIFIED LOCATIONS</text></svg>