<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Banda ancha: protección 830.90</title><desc id="d">Diagrama de flujo: la planta exterior que lleva señal y potencia de red entra por un protector primario, luego la unidad de interfaz de red, luego la distribución interior, con el protector puesto a tierra por un camino corto.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Banda ancha: protección 830.90</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un protector primario en cada conductor.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 830.90; 805.90; 830.93</text><path d="M 640 215 L 595 310 L 640 310 L 590 420" stroke="#F0A846" stroke-width="7" fill="none"/><text x="715" y="285" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">rayos</text><text x="715" y="330" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">energía</text><text x="715" y="480" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">contacto con</text><text x="715" y="525" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">líneas de potencia</text><rect x="60" y="210" width="500" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="310.0" y="272" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PLANTA EXTERIOR</text><text x="310.0" y="318" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">señal + potencia de red</text><line x1="310" y1="340" x2="310" y2="415" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="425" width="500" height="150" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="310" y="487" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PROTECTOR PRIMARIO</text><text x="310" y="533" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">uno en cada conductor</text><circle cx="84" cy="449" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="84" y="460" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="310" y1="575" x2="310" y2="650" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="560" y1="560" x2="720" y2="560" stroke="#1a2f61" stroke-width="4"/><line x1="720" y1="560" x2="720" y2="940" stroke="#1a2f61" stroke-width="4"/><line x1="675" y1="940" x2="765" y2="940" stroke="#1a2f61" stroke-width="5"/><line x1="690" y1="962" x2="750" y2="962" stroke="#1a2f61" stroke-width="5"/><line x1="705" y1="984" x2="735" y2="984" stroke="#1a2f61" stroke-width="5"/><g transform="translate(765,750) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="700" text-anchor="middle" fill="#264387">camino corto a tierra</text></g><text x="720" y="1035" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">al sistema de puesta</text><text x="720" y="1077" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">a tierra del edificio</text><rect x="60" y="660" width="500" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="326" y="722" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">UNIDAD DE INTERFAZ (NIU)</text><text x="310.0" y="768" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">equipo del proveedor</text><circle cx="84" cy="684" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="84" y="695" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><line x1="310" y1="790" x2="310" y2="865" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="875" width="500" height="130" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="316" y="937" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">DISTRIBUCIÓN INTERIOR</text><text x="310.0" y="983" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">cableado interior</text><circle cx="84" cy="899" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="84" y="910" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="30" y="1140" width="840" height="154" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="60" y="1198" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">SIN PROTECTOR EN LA ENTRADA</text><text x="60" y="1243" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">La sobretensión entra directa al interior, hasta el</text><text x="60" y="1283" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">equipo y las personas que lo usan.</text></svg>