<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1620" width="900" height="1620" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Dos definiciones rigen el capítulo</title><desc id="d">Dos esquemas de entrada. Izquierda: el cable entra por la pared, punto de entrada en la penetración. Derecha: una canalización metálica puesta a tierra extiende la entrada, así que el punto de entrada queda al final de la canalización.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1620" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Dos definiciones rigen el capítulo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Punto de entrada: dos formas — esquema</text><line x1="30" y1="1562" x2="870" y2="1562" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.2, 800.25, 820.48</text><text x="230" y="215" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">POR LA PARED</text><text x="634" y="215" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CANALIZACIÓN LO EXTIENDE</text><rect x="20" y="250" width="420" height="430" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="45" y="300" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">AFUERA</text><text x="320" y="300" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">DENTRO</text><rect x="268" y="250" width="46" height="430" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="4"/><line x1="45" y1="470" x2="415" y2="470" stroke="#264387" stroke-width="6"/><rect x="345" y="432" width="70" height="76" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><circle cx="291" cy="470" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="291" y="482" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="291" y="640" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">EN LA PARED</text><rect x="460" y="250" width="420" height="430" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="485" y="300" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">AFUERA</text><text x="855" y="300" font-size="30" font-weight="700" fill="#5b6478" text-anchor="end">DENTRO</text><rect x="688" y="250" width="46" height="430" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="4"/><line x1="485" y1="470" x2="640" y2="470" stroke="#264387" stroke-width="6"/><rect x="734" y="446" width="108" height="48" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="640" y1="470" x2="842" y2="470" stroke="#264387" stroke-width="6"/><circle cx="842" cy="470" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="842" y="482" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="700" y="575" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">CANALIZACIÓN</text><text x="700" y="617" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">METÁLICA A TIERRA</text><text x="60" y="770" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Punto de entrada en la penetración</text><text x="60" y="811" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Una canalización a tierra lo mueve a su extremo</text><rect x="40" y="880" width="820" height="300" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="65" y="945" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">PUNTO DE ENTRADA</text><text x="65" y="1005" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Donde el cable entra desde afuera — pared,</text><text x="65" y="1044" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">piso, o una canalización a tierra que lo extiende.</text><text x="65" y="1083" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Protectores, unión y el límite de 50 ft se</text><text x="65" y="1122" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">miden desde este punto.</text><rect x="40" y="1210" width="820" height="300" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="65" y="1275" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">CABLE DE COMUNICACIONES ABANDONADO</text><text x="65" y="1335" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Sin terminar en equipo, y sin etiqueta</text><text x="65" y="1374" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">para uso futuro. Esta es la definición que</text><text x="65" y="1413" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">aplica la prueba de retiro de 800.25.</text></svg>