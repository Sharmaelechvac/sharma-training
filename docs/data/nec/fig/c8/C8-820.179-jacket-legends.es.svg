<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Lea la leyenda de la cubierta</title><desc id="d">Cuatro leyendas de cubierta coaxial con las letras del tipo resaltadas: CATVP plénum, CATVR vertical, CATV uso general, CATVX uso limitado, y los espacios para los que cada uno está listado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Lea la leyenda de la cubierta</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La leyenda impresa es el permiso — tipos 820.179</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 820.179, Tabla 820.179</text><rect x="60" y="220" width="780" height="96" rx="12" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><text x="90" y="282" font-size="40" font-weight="800" fill="#ffffff" text-anchor="start">TIPO CATVP</text><text x="560" y="282" font-size="36" font-weight="800" fill="#F0A846" text-anchor="start">PLÉNUM</text><text x="90" y="368" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">ductos, plénums, espacios de aire + abajo</text><rect x="60" y="435" width="780" height="96" rx="12" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><text x="90" y="497" font-size="40" font-weight="800" fill="#ffffff" text-anchor="start">TIPO CATVR</text><text x="560" y="497" font-size="36" font-weight="800" fill="#F0A846" text-anchor="start">VERTICAL</text><text x="90" y="583" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">recorridos verticales, piso a piso + abajo</text><rect x="60" y="650" width="780" height="96" rx="12" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><text x="90" y="712" font-size="40" font-weight="800" fill="#ffffff" text-anchor="start">TIPO CATV</text><text x="560" y="712" font-size="36" font-weight="800" fill="#F0A846" text-anchor="start">GENERAL</text><text x="90" y="798" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">uso general — sin verticales, sin plénums</text><rect x="60" y="865" width="780" height="96" rx="12" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><text x="90" y="927" font-size="40" font-weight="800" fill="#ffffff" text-anchor="start">TIPO CATVX</text><text x="560" y="927" font-size="36" font-weight="800" fill="#F0A846" text-anchor="start">USO LIMITADO</text><text x="90" y="1013" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">solo viviendas y canalización</text><rect x="60" y="1100" width="780" height="110" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1148" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Sin marca de tipo en la cubierta</text><text x="450" y="1192" font-size="33" font-weight="700" fill="#c0392b" text-anchor="middle">= sin permiso para instalarlo</text><rect x="60" y="1250" width="780" height="110" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1298" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">La tensión NO viene marcada en el coaxial —</text><text x="450" y="1342" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">para que nadie lo confunda con potencia</text><text x="450" y="1430" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">Revise la leyenda antes del tendido, no en la inspección.</text></svg>