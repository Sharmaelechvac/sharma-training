<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Abandoned cable: the two-part test</title><desc id="d">Ceiling sketch with three cables: one terminated at equipment, one spare with a durable future-use tag, one dead coil with no tag. Verdicts below: leave it, may stay, remove the accessible portion.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Abandoned cable: the two-part test</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Above a lay-in ceiling — three cables, three verdicts</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 800.25, 800.2</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="200" width="820" height="380" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="313" y1="200" x2="313" y2="580" stroke="#c9d2e3" stroke-width="3"/><line x1="586" y1="200" x2="586" y2="580" stroke="#c9d2e3" stroke-width="3"/><line x1="40" y1="390" x2="860" y2="390" stroke="#c9d2e3" stroke-width="3"/><text x="60" y="245" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">ABOVE THE CEILING</text><path d="M90,470 C160,420 220,500 268,452" stroke="#264387" stroke-width="6" fill="none"/><rect x="268" y="416" width="62" height="72" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="176" y="545" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">TERMINATED</text><path d="M390,470 C450,425 520,500 575,455" stroke="#264387" stroke-width="6" fill="none"/><rect x="520" y="330" width="92" height="52" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="566" y="366" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">TAG</text><line x1="560" y1="455" x2="566" y2="382" stroke="#264387" stroke-width="3"/><text x="460" y="545" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">TAGGED SPARE</text><circle cx="735" cy="460" r="52" fill="none" stroke="#c0392b" stroke-width="6"/><circle cx="735" cy="460" r="30" fill="none" stroke="#c0392b" stroke-width="5"/><text x="745" y="545" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">UNTAGGED</text><rect x="60" y="640" width="240" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="180" y="715" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">LEAVE IT</text><rect x="330" y="640" width="240" height="120" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="715" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">MAY STAY</text><rect x="600" y="640" width="240" height="120" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="720" y="690" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">REMOVE</text><text x="720" y="734" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">accessible part</text><rect x="40" y="830" width="820" height="210" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="70" y="895" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">THE TEST — 800.2 DEFINITION</text><text x="70" y="955" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Not terminated at equipment AND not tagged</text><text x="70" y="996" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">for future use = abandoned cable.</text><rect x="40" y="1090" width="400" height="210" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="65" y="1150" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">TAG MUST BE</text><text x="65" y="1210" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Durable, and suited to</text><text x="65" y="1249" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">the environment it sits in.</text><rect x="460" y="1090" width="400" height="210" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="485" y="1150" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">NOT ACCESSIBLE</text><text x="485" y="1210" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Cable inside a concealed</text><text x="485" y="1249" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">raceway is outside the</text><text x="485" y="1288" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">removal duty.</text></svg>