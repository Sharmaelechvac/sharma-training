<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Tipo AC: dentro de la armadura</title><desc id="d">Extremo ampliado de un cable Tipo AC que muestra la armadura metálica flexible, la tira de unión interna doblada hacia atrás sobre la armadura, el buje anti-corto en el extremo cortado, dos conductores aislados, y un conector listado para Tipo AC que entra en una caja.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Tipo AC: dentro de la armadura</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Extremo de cable en un conector</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículo 320; protección del ático 320.23</text><rect x="760" y="330" width="110" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="815" y="680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">caja</text><rect x="60" y="400" width="560" height="170" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="5"/><text x="200" y="375" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><line x1="620" y1="450" x2="800" y2="450" stroke="#1f2937" stroke-width="9"/><line x1="620" y1="520" x2="800" y2="520" stroke="#1f2937" stroke-width="9"/><rect x="606" y="408" width="22" height="154" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><path d="M80,428 L606,428 L640,392 L120,392" stroke="#F0A846" stroke-width="10" fill="none"/><rect x="660" y="415" width="100" height="140" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="660" y1="445" x2="760" y2="445" stroke="#264387" stroke-width="3"/><line x1="660" y1="525" x2="760" y2="525" stroke="#264387" stroke-width="3"/><circle cx="200" cy="485" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="200" y="497" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="330" cy="392" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="330" y="404" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="617" cy="600" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="617" y="612" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="710" cy="600" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="710" y="612" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="40" y="790" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EN EL PLANO</text><text x="40" y="845" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Armadura metálica flexible</text><text x="40" y="895" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Tira de unión doblada sobre la armadura</text><text x="40" y="945" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  Buje anti-cortante en el extremo cortado</text><text x="40" y="995" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">4  Conector listado para tipo AC</text><rect x="40" y="1080" width="820" height="130" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1130" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Armadura + tira de unión = la ruta de puesta a tierra.</text><text x="450" y="1180" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Sin conductor verde separado en el interior.</text></svg>