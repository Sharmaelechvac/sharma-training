<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Agujeros perforados: de borde a borde</title><desc id="d">Dos secciones transversales de montante dibujadas a escala: un agujero centrado de 7/8 de pulgada que deja 1-5/16 pulgadas hasta cada cara, que pasa, y un agujero centrado de 1-3/8 pulgadas que deja 1-1/16 pulgadas, que necesita una placa de acero de al menos 1/16 de pulgada de espesor.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Agujeros perforados: de borde a borde</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A escala — un montante de 2×4 tiene 3-1/2 in</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 300.4(A)(1)</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo de Sharma</text><text x="40" y="218" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">AGUJERO CENTRADO DE 7/8 IN — PASA</text><rect x="140" y="250" width="620" height="180" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="450" cy="340" r="78" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="450" cy="340" r="28" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="140" y1="478" x2="372" y2="478" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="256.0" y="466" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">1-5/16 in hasta la cara</text><text x="256.0" y="466" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1-5/16 in hasta la cara</text><line x1="140" y1="540" x2="760" y2="540" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="528" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">profundidad del montante 3-1/2 in (2×4)</text><text x="450.0" y="528" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">profundidad del montante 3-1/2 in (2×4)</text><circle cx="812" cy="340" r="25" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="812" y="352" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="140" y="600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Los mismos 1-5/16 in en la cara posterior.</text><text x="40" y="668" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">AGUJERO DE 1-3/8 IN — DEMASIADO CERCA</text><rect x="140" y="700" width="620" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="116" y="700" width="24" height="300" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="450" cy="850" r="122" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="450" cy="850" r="28" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="140" y1="1042" x2="328" y2="1042" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="234.0" y="1030" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">1-1/16 in</text><text x="234.0" y="1030" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">1-1/16 in</text><text x="140" y="1105" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Demasiado cerca — agregue la placa:</text><text x="140" y="1151" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">de acero de 1/16 in, para proteger el cable</text><rect x="40" y="1185" width="820" height="125" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="64" y="1237" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Mida desde el BORDE del agujero hasta</text><text x="64" y="1283" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">borde más cercano — nunca el centro</text></svg>