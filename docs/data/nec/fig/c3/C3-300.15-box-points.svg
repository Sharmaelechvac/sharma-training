f61" text-anchor="start">ON THE DRAWING</text><text x="40" y="1334" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">1  Splice point — box or conduit body</text><text x="40" y="1376" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">2  Outlet point — box</text><text x="40" y="1418" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">3  Switch point — box</text><text x="40" y="1460" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">4  Buried splice — the classic fail</text></svg>