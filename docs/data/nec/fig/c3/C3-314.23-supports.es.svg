<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Cómo se sostiene una caja</title><desc id="d">Paneles de comparación para soporte de caja: una caja de dispositivo atornillada a un montante, una caja de techo en un colgador de barra listado entre viguetas, y una caja de dispositivo colgada de un solo conduit, que falla 314.23(F).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Cómo se sostiene una caja</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tres maneras de sostener una caja — dos pasan, una no</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 314.23 · fan boxes 314.27(C)</text><rect x="40" y="200" width="390" height="460" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><rect x="95" y="285" width="80" height="195" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="175" y="330" width="120" height="100" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="200" cy="352" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="200" cy="408" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="215" y="360" width="55" height="40" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="385" cy="248" r="24" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="385" y="260" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="60" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EN MONTANTE</text><text x="60" y="525" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Atornillado o clavado</text><text x="60" y="565" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">a la estructura,</text><text x="60" y="605" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">o un refuerzo listado</text><text x="60" y="645" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">(314.23(B))</text><rect x="470" y="200" width="390" height="460" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><rect x="495" y="270" width="130" height="34" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="705" y="270" width="130" height="34" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="520" y1="330" x2="810" y2="330" stroke="#264387" stroke-width="6"/><rect x="610" y="330" width="110" height="95" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="665" cy="377" r="16" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="828" cy="248" r="24" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="828" y="260" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="490" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EN COLGANTE</text><text x="490" y="525" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Colgante de barra listado,</text><text x="490" y="565" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">entre las viguetas.</text><text x="490" y="605" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Ventilador: peso máx.</text><text x="490" y="645" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">(314.27(C))</text><rect x="40" y="720" width="820" height="430" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="782" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">CANALIZACIÓN + CAJA — NO PASA</text><rect x="120" y="830" width="150" height="120" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="165" y="860" width="60" height="60" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><line x1="195" y1="950" x2="195" y2="1090" stroke="#264387" stroke-width="7"/><line x1="150" y1="985" x2="240" y2="1075" stroke="#c0392b" stroke-width="6"/><line x1="240" y1="985" x2="150" y2="1075" stroke="#c0392b" stroke-width="6"/><text x="90" y="1104" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">un solo tubo —</text><text x="90" y="1138" font-size="30" font-weight="700" fill="#c0392b" text-anchor="start">abrazadera muy lejos</text><text x="360" y="865" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">314.23(F) requiere:</text><text x="360" y="920" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">• Dos o más conduits</text><text x="360" y="966" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">• Roscado apretado con llave</text><text x="360" y="1012" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">• Abrazaderas a menos de 18 in</text><text x="360" y="1058" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">• Caja ≤ 100 cu in</text><text x="360" y="1104" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Sin dispositivos: 3 ft (E)</text><rect x="40" y="1210" width="820" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="64" y="1262" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Caja con cordón: el accesorio quita la tensión</text><text x="64" y="1310" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">fuera de las juntas y terminales (314.23(H)(1))</text></svg>