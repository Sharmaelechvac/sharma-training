<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">399: Whose overhead line is it?</title><desc id="d">Two overhead spans compared: a utility line under exclusive control, outside the NEC, and an owner-owned premises span over 1,000 volts governed by Article 399 with engineer-designed structures and NESC clearances.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">399: Whose overhead line is it?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Over 1,000 V outdoors: who owns it?</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 399 · 399.30 · 90.2(B)(5)</text><rect x="30" y="200" width="405" height="590" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="232" y1="330" x2="232" y2="540" stroke="#1a2f61" stroke-width="7"/><line x1="162" y1="360" x2="302" y2="360" stroke="#1a2f61" stroke-width="5"/><path d="M55 360 Q 232 392 410 360" stroke="#1a2f61" stroke-width="4" fill="none"/><rect x="30" y="200" width="405" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="232" y="243" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">SERVING UTILITY</text><text x="232" y="610" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Exclusive control</text><text x="232" y="649" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Their line, their rules</text><text x="232" y="712" font-size="36" font-weight="800" fill="#5b6478" text-anchor="middle">OUTSIDE THE NEC</text><text x="232" y="758" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">90.2(B)(5)</text><rect x="465" y="200" width="405" height="590" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><line x1="667" y1="330" x2="667" y2="540" stroke="#1a2f61" stroke-width="7"/><line x1="597" y1="360" x2="737" y2="360" stroke="#1a2f61" stroke-width="5"/><path d="M490 360 Q 667 392 845 360" stroke="#1a2f61" stroke-width="4" fill="none"/><rect x="465" y="200" width="405" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="667" y="243" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">PROPERTY OWNER</text><text x="667" y="596" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Premises wiring</text><text x="667" y="637" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">over 1,000 V</text><text x="667" y="690" font-size="32" font-weight="800" fill="#264387" text-anchor="middle">Article 399 applies</text><text x="667" y="736" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">PE-designed structures</text><text x="667" y="772" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">399.30 · Clearances: NESC</text><rect x="30" y="830" width="840" height="150" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="892" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Article 399 has NO clearance table</text><text x="450" y="940" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">the NESC carries the numbers</text><rect x="30" y="1020" width="840" height="110" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1088" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">2023 ONLY: renumbered Article 395</text></svg>