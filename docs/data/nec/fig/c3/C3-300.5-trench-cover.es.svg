<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1270" width="900" height="1270" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">300.5 Cubierta por método</title><desc id="d">Sección transversal de zanja en terreno abierto: cable de enterramiento directo con 24 pulgadas de cubierta, canalización de PVC con 18 pulgadas, conduit metálico rígido con 6 pulgadas, cada uno dimensionado desde el nivel terminado; la columna de 12 pulgadas del circuito ramal con GFCI se indica por separado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1270" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">300.5 Cubierta por método</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Cubierta medida hasta el nivel terminado</text><line x1="30" y1="1212" x2="870" y2="1212" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1250" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Tabla 300.5, 300.5(G)</text><rect x="40" y="300" width="820" height="560" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="3"/><line x1="40" y1="300" x2="860" y2="300" stroke="#1a2f61" stroke-width="6"/><text x="60" y="282" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start" font-style="italic">Nivel terminado</text><line x1="142" y1="300" x2="142" y2="564" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(130,432.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">24 in cubierta</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">24 in cubierta</text></g><circle cx="200" cy="564" r="21" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="200" cy="564" r="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="200" y="908" font-size="34" font-weight="bold" fill="#1a2f61" text-anchor="middle">Entierro directo</text><text x="200" y="950" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">24 in cubierta</text><line x1="402" y1="300" x2="402" y2="498" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(390,399.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">18 in cubierta</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">18 in cubierta</text></g><circle cx="460" cy="498" r="21" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="460" cy="498" r="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="460" y="908" font-size="34" font-weight="bold" fill="#1a2f61" text-anchor="middle">Canal. PVC</text><text x="460" y="950" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">18 in cubierta</text><line x1="652" y1="300" x2="652" y2="366" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(640,333.0) rotate(-90)"><text x="0" y="0" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 in cubierta</text><text x="0" y="0" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">6 in cubierta</text></g><circle cx="710" cy="366" r="21" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="710" cy="366" r="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="710" y="908" font-size="34" font-weight="bold" fill="#1a2f61" text-anchor="middle">RMC</text><text x="710" y="950" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">6 in cubierta</text><rect x="40" y="995" width="820" height="115" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="70" y="1048" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">12 in — una sola columna: 120 V, 20 A max,</text><text x="70" y="1090" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Ramales de vivienda protegidos por GFCI</text></svg>