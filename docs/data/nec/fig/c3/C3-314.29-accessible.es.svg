<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1330" width="900" height="1330" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">314.29 La caja debe ser accesible</title><desc id="d">Dos elevaciones de pared: una caja de conexiones cuya cubierta permanece accesible junto a un panel removible, y la misma caja oculta detrás de gabinetes fijos, lo que infringe 314.29.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1330" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">314.29 La caja debe ser accesible</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La misma caja, dos acabados — uno pasa, el otro no</text><line x1="30" y1="1272" x2="870" y2="1272" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 314.29, 300.15</text><text x="870" y="1310" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo de Sharma</text><rect x="40" y="220" width="390" height="470" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="5"/><rect x="150" y="330" width="130" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="168" y="348" width="94" height="94" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="215" y="408" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">JB</text><rect x="300" y="330" width="100" height="300" rx="0" fill="#ffffff" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 7"/><text x="350" y="668" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">tablero</text><circle cx="100" cy="640" r="30" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="100" y="653" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text><text x="235" y="762" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="middle">Cubierta alcanzable</text><text x="235" y="810" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Nada que retirar</text><text x="235" y="858" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="middle">PASA</text><rect x="470" y="220" width="390" height="470" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="5"/><rect x="580" y="330" width="130" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="520" y="300" width="300" height="330" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="670" y="480" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">FIJO</text><text x="670" y="524" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">GABINETE</text><circle cx="530" cy="640" r="30" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="530" y="653" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">✗</text><text x="665" y="762" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">Gabinete sobre la cubierta</text><text x="665" y="810" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Sierra + demolición para llegar a él</text><text x="665" y="858" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">FALLA 314.29</text><rect x="40" y="950" width="820" height="190" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="70" y="1014" font-size="36" font-weight="900" fill="#F0A846" text-anchor="start">LA PRUEBA</text><text x="70" y="1066" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">Abra la cubierta con el edificio terminado.</text><text x="70" y="1118" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">Sin sierra. Sin demolición. Sin daño.</text><text x="40" y="1210" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Cajas, cuerpos de conduit, gabinetes de registro.</text></svg>