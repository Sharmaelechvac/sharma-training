<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">386 Surface metal raceway</title><desc id="d">Wall elevation of a surface metal raceway with system device boxes and an unbroken through-wall extension, plus the 386.22 derating conditions and 386.12 prohibitions.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1600" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">386 Surface metal raceway</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Wall run — one listed system, dry locations only</text><line x1="30" y1="1542" x2="870" y2="1542" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1580" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 386.10, 386.12, 386.22, 386.56</text><rect x="40" y="210" width="820" height="330" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><rect x="60" y="300" width="780" height="56" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="80" y="340" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">SURFACE METAL RACEWAY</text><rect x="706" y="210" width="54" height="330" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="733" y="580" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">wall</text><rect x="120" y="356" width="90" height="110" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="165" cy="396" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><circle cx="165" cy="432" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><rect x="330" y="356" width="90" height="110" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="375" cy="396" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><circle cx="375" cy="432" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><rect x="540" y="356" width="90" height="110" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="585" cy="396" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><circle cx="585" cy="432" r="11" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="60" y="648" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">System boxes + devices only.</text><text x="60" y="692" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Mixing ordinary boxes defeats the listing.</text><text x="60" y="736" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Through dry walls: unbroken length, access</text><text x="60" y="780" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">to conductors on both sides (386.10).</text><rect x="40" y="850" width="820" height="270" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="64" y="906" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">THE DERATING BREAK — 386.22 (all three)</text><text x="64" y="960" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Raceway cross-section over 4 in²</text><text x="64" y="1004" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Current-carrying conductors: 30 or fewer</text><text x="64" y="1048" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Conductor fill: 20% or less</text><text x="64" y="1092" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">→ 310.15(C)(1) factors do not apply</text><rect x="40" y="1160" width="820" height="218" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="1216" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">NOT PERMITTED — 386.12</text><text x="64" y="1270" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Concealed · hoistways · corrosive vapors</text><text x="64" y="1314" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Where severe physical damage can hit it</text><text x="64" y="1358" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• 300 V+ in metal thinner than 0.040 in.</text><text x="40" y="1440" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Splices: removable cover only, ≤ 75% (386.56).</text><text x="40" y="1490" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Support per the manufacturer's instructions (386.30).</text></svg>