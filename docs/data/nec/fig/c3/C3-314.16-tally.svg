<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">314.16 Box fill: the tally decides</title><desc id="d">Worksheet figure: the worked-example tally charges 22.50 cu in, which fails a 4 in square by 1-1/2 in box at 21.0 cu in and passes a 4 in square by 2-1/8 in box at 30.3 cu in.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">314.16 Box fill: the tally decides</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked example: three 12/2 NM + receptacle</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 314.16, Tables 314.16(A), 314.16(B)</text><rect x="40" y="230" width="280" height="210" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="180" y="312" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">4 in square</text><text x="180" y="354" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">x 1-1/2 in deep</text><text x="180" y="418" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">21.0 cu in</text><text x="180" y="496" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">22.50 &gt; 21.0 - FAILS</text><rect x="40" y="560" width="280" height="260" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="180" y="668" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">4 in square</text><text x="180" y="710" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">x 2-1/8 in deep</text><text x="180" y="778" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">30.3 cu in</text><text x="190" y="878" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">22.50 vs 30.3 - PASSES</text><rect x="380" y="230" width="490" height="590" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="410" y="294" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">THE TALLY - 12 AWG</text><text x="410" y="362" font-size="31" font-weight="700" fill="#1f2937" text-anchor="start">6 conductors x 2.25</text><text x="845" y="362" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="end">13.50</text><text x="410" y="416" font-size="31" font-weight="700" fill="#1f2937" text-anchor="start">grounds (count 1)</text><text x="845" y="416" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="end">2.25</text><text x="410" y="470" font-size="31" font-weight="700" fill="#1f2937" text-anchor="start">device yoke x 2</text><text x="845" y="470" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="end">4.50</text><text x="410" y="524" font-size="31" font-weight="700" fill="#1f2937" text-anchor="start">clamps (all)</text><text x="845" y="524" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="end">2.25</text><line x1="410" y1="560" x2="845" y2="560" stroke="#1a2f61" stroke-width="3"/><text x="410" y="616" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="start">TOTAL</text><text x="845" y="616" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="end">22.50 cu in</text><text x="410" y="690" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Pigtails count 0.</text><text x="410" y="736" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Each ground past four</text><text x="410" y="780" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">adds a 1/4 allowance.</text><rect x="40" y="950" width="820" height="100" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="64" y="1014" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">Count first. Then pick the box.</text></svg>