<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Artículo 312 Gabinetes</title><desc id="d">Sección de pared que muestra una base de medidor exterior montada con el espacio de aire de un cuarto de pulgada de 312.2 y un gabinete de tablero interior con el espacio para curvatura de conductores de 312.6 sombreado en su entrada superior, con los conductores de acometida pasando a través de la pared entre ambos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Artículo 312 Gabinetes</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sección de pared — acometida (S-09)</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 312.2, 312.6; espacio de trabajo 110.26</text><text x="230" y="200" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">EXTERIOR — lugar mojado</text><text x="690" y="200" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERIOR</text><rect x="470" y="220" width="40" height="880" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="490" y="1150" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">pared</text><rect x="390" y="385" width="80" height="26" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><rect x="390" y="575" width="80" height="26" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><rect x="270" y="330" width="120" height="330" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="330" cy="450" r="50" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="330" y="466" font-size="44" font-weight="800" fill="#1a2f61" text-anchor="middle">M</text><text x="330" y="590" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">MEDIDOR</text><text x="330" y="632" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">ZÓCALO</text><line x1="390" y1="700" x2="470" y2="700" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><line x1="430" y1="700" x2="300" y2="778" stroke="#1a2f61" stroke-width="2"/><text x="60" y="800" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">1/4 in min de espacio de aire</text><text x="60" y="848" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">detrás del gabinete (312.2)</text><rect x="560" y="300" width="280" height="560" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="700" y="352" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">GABINETE TABLERO</text><rect x="578" y="372" width="244" height="130" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><line x1="640" y1="372" x2="640" y2="288" stroke="#1a2f61" stroke-width="2"/><text x="700" y="268" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">curvatura — 312.6</text><text x="700" y="268" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">curvatura — 312.6</text><rect x="600" y="560" width="90" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="710" y="560" width="90" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="600" y="640" width="90" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="710" y="640" width="90" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="600" y="720" width="90" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="710" y="720" width="90" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><path d="M390,420 L660,420 L660,545" stroke="#1f2937" stroke-width="7" fill="none"/><circle cx="660" cy="545" r="9" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><text x="60" y="950" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Los conductores aterrizan aquí —</text><text x="60" y="998" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">verifique el espacio para curvatura</text><text x="60" y="1046" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">antes del jalado del 4/0.</text><rect x="40" y="1180" width="820" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1225" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">Gabinete mojado: resistente a la intemperie</text><text x="450" y="1270" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">El espacio de trabajo es 110.26, no el Art. 312.</text></svg>