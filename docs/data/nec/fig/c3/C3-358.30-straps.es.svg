<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">358.30 Soporte de EMT</title><desc id="d">Tramo de techo de EMT desde un tablero, con abrazaderas dimensionadas: primera abrazadera a menos de 3 pies de la caja, luego abrazaderas a intervalos que no excedan 10 pies, más la excepción de 5 pies para longitudes ininterrumpidas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1200" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">358.30 Soporte de EMT</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tramo de techo, abrazaderas dimensionadas</text><line x1="30" y1="1142" x2="870" y2="1142" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1180" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 358.30</text><text x="870" y="1180" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo de Sharma</text><text x="40" y="222" font-size="30" font-weight="800" fill="#5b6478" text-anchor="start">TECHO</text><line x1="40" y1="240" x2="860" y2="240" stroke="#c9d2e3" stroke-width="5"/><rect x="28" y="300" width="154" height="170" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="105" y="398" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">TABLERO</text><line x1="170" y1="385" x2="860" y2="385" stroke="#264387" stroke-width="8"/><rect x="222" y="348" width="16" height="74" rx="4" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><rect x="422" y="348" width="16" height="74" rx="4" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><rect x="622" y="348" width="16" height="74" rx="4" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><rect x="822" y="348" width="16" height="74" rx="4" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><line x1="630" y1="348" x2="630" y2="292" stroke="#1a2f61" stroke-width="3"/><text x="630" y="278" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">ABRAZADERA</text><line x1="170" y1="540" x2="230" y2="540" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="200.0" y="528" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">3 ft max</text><text x="200.0" y="528" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3 ft max</text><line x1="230" y1="630" x2="430" y2="630" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="330.0" y="618" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft max</text><text x="330.0" y="618" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">10 ft max</text><line x1="430" y1="630" x2="630" y2="630" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="530.0" y="618" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft max</text><text x="530.0" y="618" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">10 ft max</text><line x1="630" y1="630" x2="830" y2="630" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="730.0" y="618" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft max</text><text x="730.0" y="618" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">10 ft max</text><rect x="40" y="720" width="820" height="200" rx="16" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="70" y="778" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">LA EXCEPCIÓN DE 5 FT</text><text x="70" y="832" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Solo longitud ininterrumpida, sin acoples, donde</text><text x="70" y="878" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">la estructura bloquea la fijación a menos de 3 ft.</text><text x="450" y="992" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">Trabajo pescado: longitudes ininterrumpidas, sin acoples.</text></svg>