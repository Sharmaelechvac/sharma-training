<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">358.22 El llenado del EMT</title><desc id="d">Sección transversal de EMT de 1/2 in que contiene nueve conductores junto al cálculo de área 0.122 dividido por 0.0133 es igual a 9.17, y los porcentajes de llenado de la Tabla 1.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">358.22 El llenado del EMT</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo: EMT de 1/2 in con THHN de 12 AWG</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 358.22; Ch. 9 Tablas 1, 4, 5</text><text x="240" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1/2 in EMT</text><circle cx="240" cy="478" r="178" fill="#eef2f9" stroke="#264387" stroke-width="6"/><circle cx="148" cy="386" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="148" cy="478" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="148" cy="570" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="240" cy="386" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="240" cy="478" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="240" cy="570" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="332" cy="386" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="332" cy="478" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="332" cy="570" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="240" y="726" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">9 conductores</text><rect x="455" y="280" width="420" height="470" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="480" y="344" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Tabla 4 — EMT de 1/2 in</text><text x="480" y="394" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">40% de área = 0.122 sq in</text><text x="480" y="462" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Tabla 5 — 12 AWG</text><text x="480" y="512" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">THHN = 0.0133 sq in</text><text x="480" y="592" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">0.122/0.0133 = 9.17</text><text x="480" y="664" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">Caben nueve</text><text x="50" y="852" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Capítulo 9, Tabla 1 — límites de llenado</text><rect x="50" y="884" width="190" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="145" y="928" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">1 cond</text><text x="145" y="972" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">53%</text><rect x="257" y="884" width="190" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="352" y="928" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">2 cond</text><text x="352" y="972" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">31%</text><rect x="464" y="884" width="190" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="559" y="928" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">3 o más</text><text x="559" y="972" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">40%</text><rect x="671" y="884" width="190" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="766" y="928" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Niple</text><text x="766" y="972" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">60%</text><text x="50" y="1046" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Niple = 24 in o más corto. La tierra cuenta.</text></svg>