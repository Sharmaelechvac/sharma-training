<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">372 El piso es la canalización</title><desc id="d">Sección a través de un piso de concreto celular: las celdas huecas dentro de la losa llevan conductores, un ducto colector cruza la losa y alimenta las celdas, y una salida se activa desde una celda con un accesorio hecho para el sistema de piso.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1340" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">372 El piso es la canalización</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sección a través de un piso de concreto celular</text><line x1="30" y1="1282" x2="870" y2="1282" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1320" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículo 372</text><text x="870" y="1320" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo de Sharma</text><rect x="610" y="250" width="120" height="360" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="670" y="236" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">ducto colector</text><rect x="60" y="300" width="780" height="260" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="90" y="345" width="720" height="60" rx="30" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="90" y="445" width="720" height="60" rx="30" fill="#ffffff" stroke="#264387" stroke-width="3"/><line x1="105" y1="375" x2="795" y2="375" stroke="#1a2f61" stroke-width="4" stroke-dasharray="14 10"/><line x1="105" y1="475" x2="795" y2="475" stroke="#1a2f61" stroke-width="4" stroke-dasharray="14 10"/><line x1="250" y1="345" x2="250" y2="302" stroke="#1a2f61" stroke-width="3" stroke-dasharray="8 6"/><rect x="205" y="250" width="90" height="50" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="232" y1="264" x2="232" y2="286" stroke="#1a2f61" stroke-width="4"/><line x1="268" y1="264" x2="268" y2="286" stroke="#1a2f61" stroke-width="4"/><text x="250" y="640" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">losa de concreto</text><circle cx="150" cy="375" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="150" y="387" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><circle cx="670" cy="430" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="670" y="442" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><circle cx="292" cy="330" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="292" y="342" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><circle cx="338" cy="272" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="338" y="284" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">4</text><text x="60" y="700" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">CÓMO FUNCIONA</text><circle cx="85" cy="750" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="761" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><text x="130" y="762" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Celdas formadas en el piso de concreto</text><circle cx="85" cy="812" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="823" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><text x="130" y="824" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">El ducto colector alimenta las celdas</text><circle cx="85" cy="874" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="885" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><text x="130" y="886" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Salida activada desde una celda</text><circle cx="85" cy="936" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="947" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">4</text><text x="130" y="948" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Accesorio del sistema, hecho para este piso</text><text x="60" y="1035" font-size="33" font-weight="700" fill="#5b6478" text-anchor="start">Identifique el sistema antes de trabajar</text></svg>