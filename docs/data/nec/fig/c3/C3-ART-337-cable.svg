<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1360" width="900" height="1360" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">337 Type P cable</title><desc id="d">Cross-section of a Type P cable showing conductors, insulation and a rugged outer construction, with panels contrasting where the cable belongs, marine, drilling and engineered work, and where it does not, house branch circuits and ordinary commercial work.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1360" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">337 Type P cable</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">From marine and drilling work</text><line x1="30" y1="1302" x2="870" y2="1302" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1340" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 337</text><text x="870" y="1340" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><circle cx="255" cy="430" r="155" fill="#fdf3e0" stroke="#264387" stroke-width="5"/><circle cx="255" cy="430" r="108" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="215" cy="392" r="38" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="295" cy="392" r="38" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="255" cy="468" r="38" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="255" cy="283" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="255" y="295" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><circle cx="338" cy="478" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="338" y="490" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><circle cx="215" cy="392" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="215" y="404" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><rect x="455" y="225" width="415" height="300" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="480" y="285" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="start">WHERE IT BELONGS</text><text x="480" y="340" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Marine work</text><text x="480" y="388" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Drilling work</text><text x="480" y="436" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Engineered jobs</text><text x="480" y="484" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Uses in Article 337</text><rect x="455" y="555" width="415" height="300" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="480" y="615" font-size="34" font-weight="900" fill="#c0392b" text-anchor="start">WHERE IT DOES NOT</text><text x="480" y="670" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">House circuits</text><text x="480" y="718" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Ordinary commercial</text><text x="480" y="766" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Free substitution</text><text x="60" y="915" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">IN THE DRAWING</text><circle cx="85" cy="965" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="976" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><text x="130" y="977" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Rugged outer construction</text><circle cx="85" cy="1027" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="1038" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><text x="130" y="1039" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Insulation</text><circle cx="85" cy="1089" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="1100" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><text x="130" y="1101" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Conductors</text><text x="60" y="1185" font-size="33" font-weight="700" fill="#5b6478" text-anchor="start">On a drawing, it means an engineered spec.</text></svg>