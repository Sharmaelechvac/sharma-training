<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" width="900" height="1260" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">342 IMC — middle-weight steel</title><desc id="d">Three raceway cross-sections side by side: EMT with the thinnest wall, IMC in the middle, and RMC with the thickest wall.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1260" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">342 IMC — middle-weight steel</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Wall thickness compared: EMT, IMC, RMC</text><line x1="30" y1="1202" x2="870" y2="1202" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1240" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 342.30, Table 344.30(B)(2)</text><circle cx="170" cy="430" r="112" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="170" cy="430" r="96" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="170" y="616" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">EMT</text><text x="170" y="664" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Thinnest wall</text><circle cx="450" cy="430" r="112" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="450" cy="430" r="85" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="450" y="616" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">IMC</text><text x="450" y="664" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Middle wall</text><circle cx="730" cy="430" r="112" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="730" cy="430" r="68" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="730" y="616" font-size="42" font-weight="800" fill="#1a2f61" text-anchor="middle">RMC</text><text x="730" y="664" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Thickest wall</text><rect x="60" y="730" width="780" height="118" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="782" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">Same threads and fittings as RMC —</text><text x="450" y="826" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">but fill from IMC's own Table 4 row</text><rect x="60" y="890" width="780" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="945" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Fasten within 3 ft of each termination</text><text x="450" y="989" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Supports by size — Table 344.30(B)(2)</text></svg>