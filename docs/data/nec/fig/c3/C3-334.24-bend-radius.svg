ng — flat cable: 5 × widest dimension,</text><text x="64" y="1100" font-size="34" font-weight="900" fill="#c0392b" text-anchor="start">not the thin edge. Same multiplier: 5.</text><text x="40" y="1200" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Measure to the inner edge of the curve.</text></svg>