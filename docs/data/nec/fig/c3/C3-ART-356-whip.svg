<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" width="900" height="1450" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">356 LFNC: strap it, ground it</title><desc id="d">LFNC whip from a wall disconnect to a pool pump motor, fastened within 12 inches of each end, green EGC inside the plastic tube.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1450" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">356 LFNC: strap it, ground it</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Pool pump whip: fastened 12 in, supported 3 ft</text><line x1="30" y1="1392" x2="870" y2="1392" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1430" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 356.10, 356.12, 356.30</text><rect x="40" y="240" width="60" height="760" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="30" y="220" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">wall</text><rect x="100" y="300" width="190" height="190" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="195" y="380" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">DISC.</text><text x="195" y="424" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">disconnect</text><rect x="0" y="1010" width="900" height="56" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="2"/><line x1="0" y1="1010" x2="900" y2="1010" stroke="#1a2f61" stroke-width="5"/><rect x="560" y="830" width="250" height="180" rx="16" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="685" cy="920" r="52" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="685" y="1078" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">pool pump motor</text><path d="M195,490 C195,700 420,760 620,838" stroke="#5b6478" stroke-width="20" fill="none"/><path d="M195,490 C195,700 420,760 620,838" stroke="#2e7d32" stroke-width="5" fill="none" stroke-dasharray="18 12"/><rect x="178" y="520" width="36" height="26" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><rect x="520" y="762" width="36" height="26" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="150" cy="600" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="150" y="612" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="60" y="700" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">fastened ≤ 12 in</text><text x="60" y="744" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">of each termination</text><line x1="180" y1="640" x2="190" y2="540" stroke="#1a2f61" stroke-width="3"/><circle cx="470" cy="690" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="470" y="702" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="505" y="660" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">supports ≤ 3 ft apart</text><text x="505" y="704" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">strap the whip (356.30)</text><circle cx="330" cy="800" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="330" y="812" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="60" y="880" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="start">green EGC inside —</text><text x="60" y="924" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">the plastic tube grounds nothing</text><line x1="320" y1="790" x2="300" y2="730" stroke="#2e7d32" stroke-width="3"/><rect x="40" y="1150" width="820" height="110" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="1196" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">✗ LFNC where it can be damaged</text><text x="64" y="1242" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">or past its listing — not permitted</text></svg>