<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1650" width="900" height="1650" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">314.27(C) La caja del ventilador</title><desc id="d">Sección de techo con una caja clasificada para ventilador sobre un refuerzo entre viguetas, un ventilador de paletas debajo de ella, el marcado de la caja ampliado, y tres bandas de peso que muestran la regla de la caja para cada peso de ventilador.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1650" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">314.27(C) La caja del ventilador</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sección de techo: caja listada, peso marcado</text><line x1="30" y1="1592" x2="870" y2="1592" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1630" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 314.27(C); luminaires 314.27(A)</text><rect x="90" y="250" width="200" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="610" y="250" width="200" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="190" y="420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">vigueta</text><text x="710" y="420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">vigueta</text><line x1="40" y1="380" x2="860" y2="380" stroke="#264387" stroke-width="6"/><text x="40" y="235" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">techo</text><rect x="330" y="300" width="240" height="26" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="285" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">refuerzo listado</text><rect x="350" y="380" width="200" height="140" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="5"/><text x="450" y="410" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CAJA DE</text><text x="450" y="444" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">VENTILADOR</text><text x="450" y="478" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">listado</text><text x="450" y="512" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">marcado</text><line x1="450" y1="520" x2="450" y2="575" stroke="#1f2937" stroke-width="6"/><rect x="400" y="575" width="100" height="44" rx="10" fill="#264387" stroke="#264387" stroke-width="3"/><path d="M400,619 L120,672 L400,672 Z" stroke="#264387" stroke-width="4" fill="#eef2f9"/><path d="M500,619 L780,672 L500,672 Z" stroke="#264387" stroke-width="4" fill="#eef2f9"/><text x="450" y="724" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">ventilador de paletas</text><rect x="40" y="770" width="620" height="165" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="65" y="825" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">EL MARCADO, AMPLIADO</text><text x="65" y="872" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">LISTADO PARA EL VENTILADOR</text><text x="65" y="919" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">PESO MÁXIMO SOBRE LA CAJA</text><text x="40" y="1010" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">LO QUE EXIGE EL PESO</text><rect x="40" y="1040" width="820" height="92" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="65" y="1098" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">Hasta 35 lb: caja listada para ventilador</text><rect x="40" y="1152" width="820" height="92" rx="12" fill="#fdf3e0" stroke="#1a2f61" stroke-width="3"/><text x="65" y="1210" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">35-70 lb: caja marcada para el peso</text><rect x="40" y="1264" width="820" height="92" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="65" y="1322" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">Más de 70 lb: independiente de la caja</text><text x="40" y="1420" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">Una caja de luminaria falla con el peso</text><text x="40" y="1470" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Los ventiladores no son luminarias (314.27(A)).</text></svg>