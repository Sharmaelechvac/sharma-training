<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">344 Cubierta de RMC: la fila decide</title><desc id="d">Dos secciones de zanja: en terreno abierto el RMC necesita solo 6 pulgadas de cubierta junto al PVC con 18 pulgadas; bajo la entrada de vehículos de una vivienda de una o dos familias ambos métodos necesitan 18 pulgadas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">344 Cubierta de RMC: la fila decide</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en sección: cubierta a escala, 1 in = 11</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Tabla 300.5, 344.30</text><text x="55" y="222" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">TERRENO ABIERTO — fila general de la Tabla 300.5</text><rect x="40" y="300" width="820" height="300" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="2"/><line x1="40" y1="300" x2="860" y2="300" stroke="#1f2937" stroke-width="5"/><text x="55" y="285" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">NIVEL</text><circle cx="250" cy="388" r="22" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="290" y="400" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">RMC</text><line x1="170" y1="300" x2="170" y2="366" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="16" y="344.2" font-size="32" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">6 in de cubierta</text><text x="16" y="344.2" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">6 in de cubierta</text><circle cx="250" cy="470" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="250" y="483" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="620" cy="520" r="22" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="660" y="532" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">PVC</text><line x1="540" y1="300" x2="540" y2="498" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(528,399.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">18 in cubierta</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">18 in cubierta</text></g><c