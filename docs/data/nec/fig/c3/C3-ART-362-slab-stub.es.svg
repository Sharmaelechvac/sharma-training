rvas de 90 = 180 de los 360 permitidos</text><text x="60" y="1089" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  Soportes cada 3 ft (362.30)</text><text x="60" y="1131" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4  Foto con cinta métrica hasta dos paredes</text></svg>