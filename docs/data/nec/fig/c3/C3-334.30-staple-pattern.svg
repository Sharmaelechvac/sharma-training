<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">334.30 Staple pattern</title><desc id="d">A vertical NM run on a stud bay with staples dimensioned: within 12 inches of the box and at intervals not over 4 feet 6 inches, plus the rule that flat cable is stapled flat, never on edge.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">334.30 Staple pattern</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vertical stud run to a box — distances are the rule</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 334.30, 314.17(C)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="150" y="210" width="60" height="1080" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="690" y="210" width="60" height="1080" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="180" y="1340" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">stud</text><text x="720" y="1340" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">stud</text><rect x="415" y="210" width="70" height="990" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><line x1="450" y1="210" x2="450" y2="1200" stroke="#264387" stroke-width="4" stroke-dasharray="4 10"/><text x="520" y="262" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">NM run</text><rect x="370" y="1200" width="160" height="120" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="1272" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">BOX</text><rect x="398" y="1076" width="104" height="28" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="330" y="1100" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">staple</text><rect x="398" y="646" width="104" height="28" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><text x="330" y="670" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">staple</text><text x="560" y="420" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">run continues</text><text x="560" y="462" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">staples repeat</text><line x1="620" y1="1090" x2="620" y2="1200" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="634" y="1157.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 12 in</text><text x="634" y="1157.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">≤ 12 in</text><line x1="620" y1="660" x2="620" y2="1090" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="634" y="887.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 4 ft 6 in</text><text x="634" y="887.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">≤ 4 ft 6 in</text><line x1="502" y1="660" x2="566" y2="580" stroke="#1a2f61" stroke-width="3"/><circle cx="502" cy="660" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="566" y="580" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">staple snug,</text><text x="566" y="619" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">sheath not crushed</text><rect x="40" y="1390" width="820" height="112" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><rect x="70" y="1428" width="92" height="34" rx="6" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="180" y="1458" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">flat cable stapled flat ✓</text><rect x="648" y="1414" width="34" height="62" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="700" y="1436" font-size="32" font-weight="900" fill="#c0392b" text-anchor="start">on edge</text><text x="700" y="1478" font-size="32" font-weight="900" fill="#c0392b" text-anchor="start">✗ 334.30</text></svg>