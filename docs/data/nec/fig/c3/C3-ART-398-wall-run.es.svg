<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Cableado abierto: separación</title><desc id="d">Elevación de cableado abierto sobre aisladores en una pared de granero. Dos conductores corren sobre perillas por encima de una línea discontinua a 7 ft sobre el piso; debajo de esa línea un tramo viaja dentro de una caja de madera para protección física. Un inset de detalle muestra la separación mínima de conductores de 2 1/2 pulgadas en una perilla y espaciadores a 4 1/2 ft máximo en los vanos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Cableado abierto: separación</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tramo en pared de granero — la zona</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 398.10, 398.15(C), 398.30</text><rect x="40" y="210" width="820" height="880" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="30" y1="1090" x2="870" y2="1090" stroke="#1f2937" stroke-width="6"/><text x="450" y="1140" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">PISO</text><line x1="90" y1="400" x2="520" y2="400" stroke="#264387" stroke-width="5"/><line x1="90" y1="470" x2="520" y2="470" stroke="#264387" stroke-width="5"/><circle cx="140" cy="400" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="140" cy="470" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="300" cy="400" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="300" cy="470" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="460" cy="400" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="460" cy="470" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="90" y="360" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">CONDUCTORES EN PERILLAS</text><rect x="560" y="230" width="290" height="300" rx="8" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="705" y="278" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">EN CADA PERILLA</text><line x1="620" y1="330" x2="620" y2="470" stroke="#264387" stroke-width="5"/><line x1="760" y1="330" x2="760" y2="470" stroke="#264387" stroke-width="5"/><circle cx="620" cy="400" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><circle cx="760" cy="400" r="17" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><line x1="620" y1="505" x2="760" y2="505" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="690.0" y="493" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"></text><text x="690.0" y="493" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle"></text><text x="690" y="492" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">2½ in min de separación</text><text x="690" y="492" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2½ in min de separación</text><line x1="60" y1="830" x2="840" y2="830" stroke="#c0392b" stroke-width="4" stroke-dasharray="14 10"/><text x="795" y="812" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">7 ft de línea</text><text x="795" y="812" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">7 ft de línea</text><line x1="845" y1="830" x2="845" y2="1090" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="859" y="972.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"></text><text x="859" y="972.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start"></text><text x="60" y="884" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">ZONA DE DAÑO debajo de esta línea</text><rect x="90" y="940" width="380" height="84" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><line x1="90" y1="968" x2="470" y2="968" stroke="#264387" stroke-width="4"/><line x1="90" y1="996" x2="470" y2="996" stroke="#264387" stroke-width="4"/><text x="490" y="975" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">ENCAJONADO</text><text x="490" y="1019" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">398.15(C)</text><text x="60" y="1230" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Separadores en los vanos: sujetados con abrazadera cada 4½ ft como máximo,</text><text x="60" y="1278" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">manteniendo el espacio de 2½ in (398.30).</text><text x="60" y="1340" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Soportes para vanos de 8 AWG y mayores:</text><text x="60" y="1388" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">15 ft de separación como máximo (398.30(B)).</text></svg>