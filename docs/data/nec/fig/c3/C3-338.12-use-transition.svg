<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">338.12 USE stops at the wall</title><desc id="d">Two panels: USE cable emerging from the ground at an outdoor enclosure and transitioning to an interior wiring method (passes), versus USE run through the attic (fails).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">338.12 USE stops at the wall</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Scale case: USE lateral rising at a house wall</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 338.12, 300.5(D)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="185" width="840" height="470" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/><text x="55" y="240" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="start">PASSES — transition at the entry</text><line x1="55" y1="540" x2="845" y2="540" stroke="#1f2937" stroke-width="5"/><text x="55" y="525" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">GRADE</text><rect x="560" y="270" width="46" height="270" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="583" y="262" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle"></text><path d="M70,605 L470,605 L470,480" stroke="#264387" stroke-width="8" fill="none"/><text x="120" y="592" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">USE underground</text><rect x="430" y="375" width="90" height="105" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="475" y="512" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">METER</text><text x="430" y="350" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">outdoor enclosure</text><circle cx="520" cy="572" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="520" y="585" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="520" y1="415" x2="700" y2="415" stroke="#F0A846" stroke-width="8"/><rect x="700" y="360" width="110" height="110" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="755" y="427" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><text x="755" y="338" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">interior method</text><circle cx="583" cy="415" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="583" y="428" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="30" y="685" width="840" height="450" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="55" y="740" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">FAILS — USE inside the building</text><line x1="120" y1="1080" x2="120" y2="865" stroke="#264387" stroke-width="5"/><line x1="120" y1="865" x2="450" y2="778" stroke="#264387" stroke-width="5"/><line x1="450" y1="778" x2="780" y2="865" stroke="#264387" stroke-width="5"/><line x1="780" y1="865" x2="780" y2="1080" stroke="#264387" stroke-width="5"/><line x1="120" y1="1080" x2="780" y2="1080" stroke="#264387" stroke-width="5"/><text x="450" y="1118" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">ATTIC</text><rect x="60" y="950" width="60" height="90" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="3"/><path d="M120,995 L200,995 L200,845 L700,845 L700,950" stroke="#c0392b" stroke-width="7" fill="none" stroke-dasharray="10 8"/><rect x="660" y="950" width="90" height="100" rx="8" fill="#eef2f9" stroke="#c0392b" stroke-width="4"/><text x="705" y="1012" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">PANEL</text><line x1="300" y1="800" x2="560" y2="925" stroke="#c0392b" stroke-width="9"/><line x1="300" y1="925" x2="560" y2="800" stroke="#c0392b" stroke-width="9"/><circle cx="615" cy="985" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="615" y="998" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="215" y="990" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">USE across the attic</text><text x="55" y="1200" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">ON THE DRAWING</text><circle cx="75" cy="1248" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="75" y="1261" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="115" y="1260" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">USE emerges only at an outdoor enclosure,</text><text x="115" y="1296" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">protected per 300.5(D)</text><circle cx="75" cy="1352" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="75" y="1365" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="115" y="1364" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Inside, an interior wiring method takes over</text><circle cx="75" cy="1427" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="75" y="1440" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="115" y="1439" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">USE is never interior wiring — 338.12(B)(1)</text></svg>