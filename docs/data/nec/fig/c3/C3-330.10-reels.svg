<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="900" height="1350" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">330.10 MC: read the jacket print</title><desc id="d">Three MC cable assemblies with their jacket legends: standard interlocked armor for dry locations, a jacketed assembly listed for wet locations, and a tray-rated assembly, each with its location tag, over a red panel of uses not permitted on a generic reel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1350" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">330.10 MC: read the jacket print</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Three assemblies, three permissions</text><line x1="30" y1="1292" x2="870" y2="1292" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1330" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 330.10, 330.12</text><text x="870" y="1330" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><circle cx="170" cy="350" r="100" fill="#ffffff" stroke="#264387" stroke-width="14"/><circle cx="170" cy="350" r="52" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="170" cy="350" r="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="170" y="512" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">INTERLOCKED</text><text x="170" y="556" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">no jacket</text><rect x="47.0" y="616" width="246" height="48" rx="24" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="170.0" y="650" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">DRY LOCATIONS</text><circle cx="450" cy="350" r="100" fill="#ffffff" stroke="#F0A846" stroke-width="20"/><circle cx="450" cy="350" r="52" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="450" cy="350" r="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="512" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">JACKETED</text><text x="450" y="556" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">impervious jacket</text><rect x="335.5" y="616" width="229" height="48" rx="24" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="450.0" y="650" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">WET — LISTED</text><circle cx="730" cy="350" r="100" fill="#ffffff" stroke="#264387" stroke-width="6"/><circle cx="730" cy="350" r="52" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="730" cy="350" r="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="730" y="512" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">TRAY RATED</text><text x="730" y="556" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">tray print</text><rect x="632.0" y="616" width="196" height="48" rx="24" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="730.0" y="650" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">CABLE TRAY</text><rect x="40" y="740" width="820" height="335" rx="16" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="70" y="806" font-size="38" font-weight="900" fill="#c0392b" text-anchor="start">NOT ON A GENERIC REEL</text><text x="70" y="868" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">• Subject to physical damage</text><text x="70" y="920" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">• Direct burial, unless identified for it</text><text x="70" y="972" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">• In concrete, unless identified for it</text><text x="70" y="1024" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">• Wet location on plain interlocked armor</text></svg>