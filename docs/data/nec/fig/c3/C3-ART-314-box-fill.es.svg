<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">314.16 Cuéntelo antes de llenarla</title><desc id="d">Corte de una caja cuadrada de 4 pulgadas con un receptáculo y dos cables NM, con marcadores numerados para el conteo de llenado de la caja y una tira de conteo que muestra 18.0 pulgadas cúbicas cargadas contra una caja de 30.3 pulgadas cúbicas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">314.16 Cuéntelo antes de llenarla</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Caja de 4 in × 2-1/8 in: 30.3 cu in</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 314.16, Tablas 314.16(A) y (B)</text><line x1="250" y1="208" x2="650" y2="208" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="196" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">4 in</text><text x="450.0" y="196" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4 in</text><rect x="250" y="230" width="400" height="400" rx="0" fill="#ffffff" stroke="#264387" stroke-width="6"/><line x1="650" y1="230" x2="704" y2="230" stroke="#1a2f61" stroke-width="2"/><line x1="650" y1="630" x2="704" y2="630" stroke="#1a2f61" stroke-width="2"/><line x1="692" y1="230" x2="692" y2="630" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="706" y="441.9" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">4 in</text><text x="706" y="441.9" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">4 in</text><rect x="308" y="222" width="44" height="16" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="548" y="222" width="44" height="16" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="315" y="238" width="30" height="55" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="2"/><rect x="555" y="238" width="30" height="55" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="2"/><line x1="330" y1="293" x2="412" y2="432" stroke="#1f2937" stroke-width="4"/><line x1="570" y1="293" x2="488" y2="432" stroke="#1f2937" stroke-width="4"/><path d="M345,293 L450,598 L555,293" stroke="#2e7d32" stroke-width="3" fill="none"/><circle cx="450" cy="598" r="8" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="385" y="410" width="130" height="12" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="385" y="568" width="130" height="12" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="395" y="422" width="110" height="146" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="415" y="440" width="70" height="45" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="415" y="503" width="70" height="45" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="272" cy="320" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="272" y="332" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="655" cy="430" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="655" y="442" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="592" cy="195" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="592" y="207" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="622" cy="622" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="622" y="634" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="30" y="730" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EL CONTEO — 12 AWG A 2.25 CU IN CADA UNO</text><circle cx="52" cy="800" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="812" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="90" y="812" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Conductores — 1× cada uno · 4 aquí = 9.00</text><circle cx="52" cy="864" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="876" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="90" y="876" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Yugo de dispositivo — cuenta 2× = 4.50</text><circle cx="52" cy="928" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="940" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="90" y="940" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Abrazaderas internas — 1× total = 2.25</text><circle cx="52" cy="992" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="1004" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="90" y="1004" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Puestas a tierra — 1× total (hasta cuatro) = 2.25</text><rect x="30" y="1090" width="840" height="120" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1142" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">8 espacios asignados × 2.25 = 18.0 cu in</text><text x="450" y="1190" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="middle">La caja contiene 30.3 — PASA con espacio</text><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Cuando el conteo supera el volumen, la caja</text><text x="30" y="1319" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">crece — el cálculo no.</text></svg>