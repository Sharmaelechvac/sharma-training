><circle cx="524" cy="760" r="18" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="524" y="768" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><line x1="250" y1="330" x2="250" y2="760" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(238,545.0) rotate(-90)"><text x="0" y="0" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">18 in min - 10 ft max</text><text x="0" y="0" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">18 in min - 10 ft max</text></g><line x1="540" y1="330" x2="540" y2="360" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="554" y="357.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">12 in</text><text x="554" y="357.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">12 in</text><text x="40" y="1215" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">1 Fitting each end, accessible; end sealed</text><text x="40" y="1261" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">2 Cables fastened within 12 in of the end</text><text x="40" y="1307" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">3 Sheath continuous, 1/4 in into the panel</text></svg>