<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">310.16 Which column? 60, 75 or 90 °C</title><desc id="d">The 12 AWG copper row of Table 310.16 with 20, 25 and 30 amps in the 60, 75 and 90 degree columns, and the four gates that decide which number you may use.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">310.16 Which column? 60, 75 or 90 °C</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">12 AWG copper, the most common branch wire</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 310.16, 110.14(C), 334.80, 240.4(D)</text><rect x="40" y="190" width="260" height="70" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="170" y="240" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">60 °C</text><rect x="40" y="268" width="260" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="170" y="345" font-size="60" font-weight="900" fill="#1a2f61" text-anchor="middle">20 A</text><rect x="320" y="190" width="260" height="70" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="240" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">75 °C</text><rect x="320" y="268" width="260" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="345" font-size="60" font-weight="900" fill="#1a2f61" text-anchor="middle">25 A</text><rect x="600" y="190" width="260" height="70" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="730" y="240" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">90 °C</text><rect x="600" y="268" width="260" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="730" y="345" font-size="60" font-weight="900" fill="#1a2f61" text-anchor="middle">30 A</text><text x="40" y="430" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Table 310.16, 12 AWG Cu (TW · THW/XHHW · THHN)</text><rect x="40" y="470" width="820" height="190" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="92" cy="522" r="30" fill="#264387" stroke="#264387" stroke-width="0"/><text x="92" y="535" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><text x="140" y="534" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">Insulation: THHN = 90 °C</text><text x="140" y="586" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Start derating from 30 A. That is</text><text x="140" y="628" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">all the 90 °C column is for.</text><line x1="450" y1="660" x2="450" y2="690" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="700" width="820" height="190" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="92" cy="752" r="30" fill="#264387" stroke="#264387" stroke-width="0"/><text x="92" y="765" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><text x="140" y="764" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">Terminals: 110.14(C)</text><text x="140" y="816" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">100 A or less / 14–1 AWG: 60 °C</text><text x="140" y="858" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">unless marked 75 °C. Over 100 A: 75 °C</text><line x1="450" y1="890" x2="450" y2="920" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="930" width="820" height="190" rx="16" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="92" cy="982" r="30" fill="#264387" stroke="#264387" stroke-width="0"/><text x="92" y="995" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><text x="140" y="994" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">Wiring method</text><text x="140" y="1046" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">NM cable (Romex): 60 °C result</text><text x="140" y="1088" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">(334.80), even with 90 °C wire</text><line x1="450" y1="1120" x2="450" y2="1150" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="1160" width="820" height="190" rx="16" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><circle cx="92" cy="1212" r="30" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="92" y="1225" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">4</text><text x="140" y="1224" font-size="38" font-weight="900" fill="#c0392b" text-anchor="start">Breaker cap: 240.4(D)</text><text x="140" y="1276" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">12 AWG Cu: 20 A max breaker,</text><text x="140" y="1318" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">whatever the column says</text><rect x="40" y="1400" width="820" height="150" rx="16" fill="#264387" stroke="#264387" stroke-width="0"/><text x="64" y="1454" font-size="36" font-weight="900" fill="#F0A846" text-anchor="start">12 THHN Cu on 75 °C lugs:</text><text x="64" y="1508" font-size="38" font-weight="900" fill="#ffffff" text-anchor="start">ampacity 25 A · breaker 20 A max</text></svg>