<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">354 NUCC: it lives underground</title><desc id="d">Trench section of a NUCC factory assembly buried with Table 300.5 cover, the concrete-encased aboveground option, and the exposed and inside-building prohibitions of Article 354.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">354 NUCC: it lives underground</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Conduit and conductors, one listed system</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 354.10, 354.12, 354.20, 354.24, Table 300.5</text><rect x="40" y="300" width="820" height="560" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="2"/><line x1="40" y1="300" x2="860" y2="300" stroke="#1a2f61" stroke-width="6"/><text x="48" y="282" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">GRADE</text><rect x="706" y="168" width="154" height="132" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><text x="783" y="245" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">BLDG</text><text x="690" y="246" font-size="32" font-weight="800" fill="#c0392b" text-anchor="end">no run inside —</text><text x="690" y="284" font-size="32" font-weight="800" fill="#c0392b" text-anchor="end">terminate only</text><line x1="706" y1="282" x2="652" y2="306" stroke="#c0392b" stroke-width="5"/><rect x="120" y="620" width="640" height="64" rx="30" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="440" y="664" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">NUCC ASSEMBLY</text><text x="440" y="730" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">conductors installed at the factory</text><line x1="84" y1="300" x2="84" y2="620" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(72,460.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">cover per Table 300.5</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">cover per Table 300.5</text></g><rect x="120" y="800" width="300" height="110" rx="0" fill="#eef2f9" stroke="#5b6478" stroke-width="3"/><rect x="140" y="838" width="260" height="36" rx="16" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="436" y="842" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Aboveground only if</text><text x="436" y="884" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">in 2 in. of concrete</text><rect x="40" y="990" width="820" height="170" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="1046" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">NOT PERMITTED (354.12)</text><text x="64" y="1096" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Exposed locations · inside buildings.</text><text x="64" y="1140" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Conductors extend in only to terminate.</text><rect x="40" y="1205" width="563" height="51" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="321.5" y="1242" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">Trade sizes 1/2 to 4 — 354.20</text><rect x="40" y="1275" width="841" height="51" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="460.5" y="1312" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">Bends: Table 354.24(A) radius · ≤ 360° total</text><text x="40" y="1390" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Kinked past its radius? It is damaged goods.</text></svg>