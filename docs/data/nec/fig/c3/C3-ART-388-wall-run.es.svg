<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Canalización no metálica de superficie</title><desc id="d">Elevación de una canalización no metálica de superficie de dos compartimentos en una pared de oficina. El compartimento superior lleva energía y el inferior lleva datos en el mismo sistema combinado listado. Una caja de dispositivo baja por debajo del tramo, y la canalización pasa ininterrumpida a través de una partición seca con acceso en ambos lados. Una franja roja advierte contra tramos a la altura de carritos donde amenaza daño físico severo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Canalización no metálica de superficie</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Modernización en pared terminada</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 388.10, 388.12, 388.56, 388.70</text><rect x="40" y="210" width="820" height="800" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="772" y="210" width="88" height="800" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><rect x="80" y="430" width="765" height="92" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><line x1="80" y1="476" x2="845" y2="476" stroke="#F0A846" stroke-width="4"/><text x="110" y="466" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">POTENCIA</text><text x="110" y="512" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">DATOS</text><text x="85" y="400" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">SISTEMA LISTADO, DOS COMPARTIMENTOS</text><text x="752" y="580" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">sin interrupción a través</text><text x="752" y="624" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="end">tabique seco —</text><text x="752" y="668" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="end">acceso por ambos lados</text><rect x="280" y="522" width="26" height="90" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="238" y="612" width="110" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="293" cy="656" r="10" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="293" cy="692" r="10" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="293" y="782" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">CAJA DE DISPOSITIVO</text><line x1="30" y1="1010" x2="870" y2="1010" stroke="#1f2937" stroke-width="6"/><rect x="60" y="1068" width="370" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="245.0" y="1106" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Solo lugares secos</text><rect x="60" y="1140" width="561" height="52" rx="26" fill="#264387" stroke="#264387" stroke-width="0"/><text x="340.5" y="1178" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">300 V max entre conductores</text><rect x="60" y="1224" width="780" height="64" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1266" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">NO a la altura del carrito — se destruye</text></svg>