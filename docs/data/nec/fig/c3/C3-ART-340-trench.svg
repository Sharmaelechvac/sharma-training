<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Art. 340 UF: cover is Table 300.5</title><desc id="d">Trench section: UF cable direct-buried with 24 inches of cover in open ground, rising in a protective sleeve at the house wall to a disconnect; a note separates the narrow 12 inch GFCI residential branch-circuit case.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Art. 340 UF: cover is Table 300.5</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Direct burial in open ground</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Art. 340 · Table 300.5</text><rect x="0" y="320" width="900" height="560" rx="0" fill="url(#earth)" stroke="none" stroke-width="0"/><line x1="30" y1="320" x2="870" y2="320" stroke="#1a2f61" stroke-width="6"/><text x="40" y="300" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">FINISHED GRADE</text><rect x="700" y="170" width="170" height="710" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="785" y="215" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">HOUSE</text><rect x="140" y="262" width="18" height="58" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="149" cy="240" r="26" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="190" y="250" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">YARD LIGHT</text><path d="M149,320 L149,690 L745,690 L745,430" stroke="#264387" stroke-width="7" fill="none"/><line x1="728" y1="690" x2="728" y2="430" stroke="#F0A846" stroke-width="5"/><line x1="762" y1="690" x2="762" y2="430" stroke="#F0A846" stroke-width="5"/><text x="745" y="745" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">UF</text><rect x="700" y="330" width="90" height="100" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="745" y="388" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">DISC</text><line x1="90" y1="320" x2="90" y2="690" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="104" y="517.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">24 in cover</text><text x="104" y="517.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">24 in cover</text><circle cx="420" cy="690" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="420" y="702" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="745" cy="600" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="745" y="612" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="330" y="640" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">direct-buried UF</text><text x="690" y="480" font-size="32" font-weight="600" fill="#1f2937" text-anchor="end">sleeved riser:</text><text x="690" y="519" font-size="32" font-weight="600" fill="#1f2937" text-anchor="end">protect from damage</text><rect x="40" y="950" width="820" height="150" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="70" y="1010" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">12 in is ONE column only: 120 V, 20 A or less,</text><text x="70" y="1051" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">GFCI-protected residential branch circuit.</text><rect x="40" y="1140" width="820" height="130" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="70" y="1198" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">UF is never service-entrance cable — and never</text><text x="70" y="1239" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">embedded in poured concrete.</text><text x="40" y="1350" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1 UF at full Table 300.5 cover</text><text x="40" y="1390" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2 Riser protected where it emerges</text></svg>