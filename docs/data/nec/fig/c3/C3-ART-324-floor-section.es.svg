<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">324 FCC: bajo losetas de alfombra</title><desc id="d">Corte de una instalación Tipo FCC bajo alfombra: loseta no mayor de 1 m, blindaje superior, cable plano de tres conductores, blindaje inferior y base sobre una losa de concreto, alimentando un pedestal de piso.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">324 FCC: bajo losetas de alfombra</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Corte de piso — blindajes arriba y abajo</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 324.10, 324.18, 324.41, 324.60</text><rect x="434" y="196" width="96" height="74" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="482" cy="233" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><rect x="470" y="270" width="24" height="66" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="418" y="245" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">pedestal de piso</text><rect x="90" y="336" width="440" height="44" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="104" y="370" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">LOSETA DE ALFOMBRA</text><line x1="90" y1="322" x2="530" y2="322" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450" y="310" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 1 m (39.37 in) · adhesivo removible</text><text x="450" y="310" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 1 m (39.37 in) · adhesivo removible</text><rect x="90" y="392" width="440" height="26" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="870" y="416" font-size="32" font-weight="700" fill="#1f2937" text-anchor="end">blindaje superior</text><rect x="90" y="430" width="440" height="34" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="2"/><text x="104" y="457" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">CABLE PLANO: fase, neutro, EGC</text><rect x="90" y="476" width="440" height="26" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="870" y="497" font-size="32" font-weight="700" fill="#1f2937" text-anchor="end">blindaje inferior</text><line x1="90" y1="516" x2="530" y2="516" stroke="#5b6478" stroke-width="4" stroke-dasharray="10 6"/><text x="870" y="548" font-size="32" font-weight="700" fill="#1f2937" text-anchor="end">cinta de base</text><rect x="90" y="530" width="440" height="90" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="104" y="586" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">LOSA DE CONCRETO</text><text x="60" y="716" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Blindajes metálicos a tierra (324.60)</text><text x="60" y="762" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Máximo dos tramos se cruzan (324.18)</text><text x="60" y="808" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Solo ramal: 20 A general / 30 A indiv.</text><text x="60" y="854" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Voltaje: ≤300 V entre, ≤150 V a tierra</text><text x="60" y="900" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Prohibido en viviendas (324.12)</text><text x="60" y="946" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Escuelas / hospitales: solo admin.</text><text x="60" y="992" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Conductores planos 12 AWG Cu en 20 A</text><rect x="60" y="1050" width="780" height="150" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="84" y="1106" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">NO ES TIPO FC</text><text x="84" y="1154" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">FC (Art. 322) va en canaleta de superficie.</text><text x="84" y="1194" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">FCC va bajo alfombra. Nunca intercambie.</text><text x="60" y="1270" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Levante la loseta para acceder.</text><text x="60" y="1320" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Verifique el listado en sistemas viejos.</text></svg>