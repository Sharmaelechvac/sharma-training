<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">378 Canaleta no metálica</title><desc id="d">Sección transversal de una canaleta no metálica de 4 por 4 pulgadas con la zona de llenado del 20 por ciento sombreada, más el espaciamiento de soportes, la regla de reducción de capacidad y los lugares permitidos y prohibidos del Artículo 378.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">378 Canaleta no metálica</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sección, llenado, soportes y reducción</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 378.10, 378.12, 378.22, 378.30, 378.56</text><rect x="60" y="230" width="300" height="300" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="6"/><rect x="60" y="230" width="300" height="34" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="210" y="258" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">CUBIERTA</text><rect x="72" y="470" width="276" height="48" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><circle cx="110" cy="494" r="15" fill="#264387" stroke="#1a2f61" stroke-width="2"/><circle cx="165" cy="494" r="15" fill="#264387" stroke="#1a2f61" stroke-width="2"/><circle cx="220" cy="494" r="15" fill="#264387" stroke="#1a2f61" stroke-width="2"/><circle cx="275" cy="494" r="15" fill="#264387" stroke="#1a2f61" stroke-width="2"/><circle cx="322" cy="494" r="15" fill="#264387" stroke="#1a2f61" stroke-width="2"/><line x1="60" y1="470" x2="360" y2="470" stroke="#F0A846" stroke-width="4" stroke-dasharray="8 6"/><text x="400" y="300" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">4 in × 4 in canaleta:</text><text x="400" y="348" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Área interior de 16 in²</text><text x="400" y="416" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Conductores ≤ 20%</text><text x="400" y="464" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">= 3.2 in² de conductor (378.22)</text><text x="400" y="532" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Empalmes y deriv. ≤ 75% en</text><text x="400" y="578" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">esa sección (378.56)</text><rect x="60" y="660" width="780" height="54" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><line x1="60" y1="714" x2="60" y2="748" stroke="#1a2f61" stroke-width="5"/><line x1="320" y1="714" x2="320" y2="748" stroke="#1a2f61" stroke-width="5"/><line x1="580" y1="714" x2="580" y2="748" stroke="#1a2f61" stroke-width="5"/><line x1="840" y1="714" x2="840" y2="748" stroke="#1a2f61" stroke-width="5"/><line x1="60" y1="800" x2="320" y2="800" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="190.0" y="788" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">soportes ≤ 3 ft</text><text x="190.0" y="788" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">soportes ≤ 3 ft</text><text x="450" y="700" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">tramo horizontal</text><text x="60" y="856" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Nunca más de 10 ft entre soportes (378.30)</text><text x="60" y="900" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Tramos verticales: soportes cada 4 ft como máximo</text><rect x="60" y="950" width="780" height="226" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="84" y="1006" font-size="38" font-weight="900" fill="#c0392b" text-anchor="start">REDUCCIÓN — SIN PASE</text><text x="84" y="1058" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">310.15(C)(1) aplican los factores de ajuste</text><text x="84" y="1102" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">a los conductores en esta canaleta.</text><text x="84" y="1146" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Alivio de 30 conductores del metal: solo 376.22(B).</text><text x="60" y="1246" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="start">PERMITIDO (378.10)</text><text x="60" y="1296" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">✓ Trabajo expuesto</text><text x="60" y="1340" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">✓ Mojado, si está listado</text><text x="60" y="1384" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">✓ Corrosivo identificado</text><text x="480" y="1246" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">NO PERMITIDO</text><text x="480" y="1296" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">✗ Sujeto a daño</text><text x="480" y="1340" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">✗ Lugares peligrosos</text><text x="480" y="1384" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">✗ Sol si no está listado</text></svg>