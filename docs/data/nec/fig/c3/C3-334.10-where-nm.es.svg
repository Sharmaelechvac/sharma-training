<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1620" width="900" height="1620" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">334.10 Dónde puede ir el NM</title><desc id="d">Tres paneles que muestran dónde puede usarse el cable NM: viviendas y sus garajes separados, otros edificios Tipo III IV y V con NM oculto detrás de una barrera de acabado de 15 minutos, y edificios Tipo I o II donde NM solo se permite dentro de una canalización.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1620" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">334.10 Dónde puede ir el NM</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dos filtros: normalmente seco, y un edificio en la lista</text><line x1="30" y1="1562" x2="870" y2="1562" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 334.10</text><text x="870" y="1600" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo de Sharma</text><text x="30" y="205" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">VIVIENDAS — EL TERRITORIO DEL HOGAR</text><path d="M70,320 L260,225 L450,320" stroke="#264387" stroke-width="6" fill="none"/><rect x="70" y="320" width="380" height="180" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="110" y="360" width="70" height="60" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="230" y="410" width="60" height="90" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><path d="M100,480 L100,345 L410,345" stroke="#F0A846" stroke-width="6" fill="none"/><path d="M540,350 L685,280 L830,350" stroke="#264387" stroke-width="6" fill="none"/><rect x="540" y="350" width="290" height="150" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="575" y="390" width="220" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><line x1="575" y1="427" x2="795" y2="427" stroke="#c9d2e3" stroke-width="3"/><line x1="575" y1="463" x2="795" y2="463" stroke="#c9d2e3" stroke-width="3"/><line x1="30" y1="500" x2="870" y2="500" stroke="#1f2937" stroke-width="4"/><circle cx="488" cy="262" r="24" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><path d="M476.0,262 L484.4,271.12 L501.2,251.92" stroke="#ffffff" stroke-width="5" fill="none"/><text x="30" y="560" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">Viviendas, garajes separados, almacenamiento:</text><text x="30" y="601" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">NM OK en áreas secas</text><text x="30" y="690" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">OTROS TIPO III / IV / V — SOLO OCULTO</text><rect x="66" y="730" width="26" height="190" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><rect x="110" y="730" width="36" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="400" y="730" width="36" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="520" y="730" width="16" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><line x1="300" y1="745" x2="300" y2="905" stroke="#F0A846" stroke-width="7"/><text x="575" y="810" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">NM oculto en</text><text x="575" y="849" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">de la pared</text><rect x="30" y="950" width="24" height="24" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="68" y="974" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">= barrera de acabado de 15-min (capa dorada)</text><text x="30" y="1032" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">Multifamiliar III/IV/V: NM OK (seco).</text><text x="30" y="1073" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">Otros edificios III/IV/V: solo oculto.</text><text x="30" y="1150" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">TIPO I / II — SOLO CANALIZACIÓN</text><rect x="90" y="1190" width="300" height="180" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="120" y="1215" width="50" height="40" rx="0" fill="#ffffff" stroke="#264387" stroke-width="2"/><rect x="120" y="1275" width="50" height="40" rx="0" fill="#ffffff" stroke="#264387" stroke-width="2"/><rect x="200" y="1215" width="50" height="40" rx="0" fill="#ffffff" stroke="#264387" stroke-width="2"/><rect x="200" y="1275" width="50" height="40" rx="0" fill="#ffffff" stroke="#264387" stroke-width="2"/><rect x="280" y="1215" width="50" height="40" rx="0" fill="#ffffff" stroke="#264387" stroke-width="2"/><rect x="280" y="1275" width="50" height="40" rx="0" fill="#ffffff" stroke="#264387" stroke-width="2"/><line x1="90" y1="1280" x2="390" y2="1280" stroke="#F0A846" stroke-width="5" stroke-dasharray="12 8"/><path d="M215,1255 L265,1305 M265,1255 L215,1305" stroke="#c0392b" stroke-width="6" fill="none"/><rect x="90" y="1318" width="300" height="24" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="90" y1="1330" x2="390" y2="1330" stroke="#F0A846" stroke-width="5"/><text x="450" y="1245" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">NM EXPUESTO — NO</text><text x="450" y="1340" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">EN CANALIZACIÓN — OK</text><text x="30" y="1440" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Edificios de gran altura y no combustibles:</text><text x="30" y="1481" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">la canalización es el método, el NM va adentro.</text></svg>