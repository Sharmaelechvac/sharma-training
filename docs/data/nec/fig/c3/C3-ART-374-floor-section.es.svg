<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">374 Canalización metálica celular de piso</title><desc id="d">Sección a través de una plataforma de piso de acero celular: las celdas de acero forman las canalizaciones, un ducto colector las alimenta, una salida usa un accesorio del sistema, y una ruta verde marca la unión y la continuidad del sistema metálico.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1340" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">374 Canalización metálica celular de piso</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sección a través de una plataforma de acero celular</text><line x1="30" y1="1282" x2="870" y2="1282" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1320" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículo 374</text><text x="870" y="1320" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo de Sharma</text><rect x="700" y="270" width="100" height="300" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="750" y="256" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">ducto colector</text><rect x="60" y="320" width="780" height="200" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="95" y="365" width="170" height="100" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="305" y="365" width="170" height="100" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="515" y="365" width="170" height="100" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><line x1="320" y1="415" x2="500" y2="415" stroke="#1a2f61" stroke-width="4" stroke-dasharray="14 10"/><rect x="355" y="278" width="70" height="42" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="378" y1="290" x2="378" y2="308" stroke="#1a2f61" stroke-width="4"/><line x1="402" y1="290" x2="402" y2="308" stroke="#1a2f61" stroke-width="4"/><line x1="80" y1="560" x2="820" y2="560" stroke="#2e7d32" stroke-width="5"/><circle cx="180" cy="560" r="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><circle cx="390" cy="560" r="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><circle cx="600" cy="560" r="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="450" y="616" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">ruta de unión + continuidad</text><circle cx="180" cy="415" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="180" y="427" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><circle cx="750" cy="420" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="750" y="432" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><circle cx="462" cy="299" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="462" y="311" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><circle cx="600" cy="560" r="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="600" y="572" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">4</text><text x="60" y="700" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">CÓMO FUNCIONA</text><circle cx="85" cy="750" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="761" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">1</text><text x="130" y="762" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Celdas de la losa de acero celular</text><circle cx="85" cy="812" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="823" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">2</text><text x="130" y="824" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">El ducto colector alimenta las celdas</text><circle cx="85" cy="874" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="885" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><text x="130" y="886" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Accesorio de salida del sistema</text><circle cx="85" cy="936" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="85" y="947" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">4</text><text x="130" y="948" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Unión y continuidad del metal</text><text x="60" y="1035" font-size="33" font-weight="700" fill="#5b6478" text-anchor="start">El metal debe permanecer continuo y unido.</text></svg>