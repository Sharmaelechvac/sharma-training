<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">CCA: misma cuenta, otra columna</title><desc id="d">Diagrama de flujo para cálculos de CCA: carga, material, columna o fuente de resistencia, tamaño, luego verificaciones; la ruta de CCA está resaltada y la rama de caída de voltaje está marcada indicando que el Capítulo 9 Tabla 8 no tiene fila de CCA.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">CCA: misma cuenta, otra columna</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un flujo para cinco cálculos — CCA en dorado</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Tabla 310.16, Cap. 9 Tabla 8, 314.16(B)</text><rect x="40" y="200" width="820" height="118" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="78" y="198" width="47" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="101.5" y="236" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="150" y="252" font-size="36" font-weight="bold" fill="#1a2f61" text-anchor="start">CARGA</text><text x="150" y="296" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">La cuenta del Art. 220 — igual en cada metal</text><line x1="450" y1="318" x2="450" y2="372" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="372" width="820" height="118" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><rect x="78" y="370" width="47" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="101.5" y="408" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="150" y="424" font-size="36" font-weight="bold" fill="#1a2f61" text-anchor="start">MATERIAL</text><text x="150" y="468" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Cu · Al · CCA — CCA sigue al aluminio</text><line x1="450" y1="490" x2="450" y2="544" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="544" width="820" height="118" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="78" y="542" width="47" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="101.5" y="580" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="150" y="596" font-size="36" font-weight="bold" fill="#1a2f61" text-anchor="start">COLUMNA / FUENTE</text><text x="150" y="640" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Ampacidad: Tabla 310.16 columna de aluminio</text><line x1="450" y1="662" x2="450" y2="716" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="716" width="820" height="118" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="78" y="714" width="47" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="101.5" y="752" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="150" y="768" font-size="36" font-weight="bold" fill="#1a2f61" text-anchor="start">TAMAÑO</text><text x="150" y="812" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Elija el AWG — luego los límites de 240.4(D)</text><line x1="450" y1="834" x2="450" y2="888" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="888" width="820" height="118" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="78" y="886" width="47" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="101.5" y="924" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="150" y="940" font-size="36" font-weight="bold" fill="#1a2f61" text-anchor="start">VERIFICACIONES</text><text x="150" y="984" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Llenado por tamaño · terminales por marcado</text><rect x="40" y="1060" width="820" height="130" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="1114" font-size="36" font-weight="bold" fill="#c0392b" text-anchor="start">CAÍDA DE VOLTAJE — la brecha</text><text x="70" y="1162" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">La Tabla 8 no tiene CCA — datos del fabricante</text><rect x="40" y="1220" width="820" height="110" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="1289" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">S-10: columna de aluminio, una medida mayor</text><text x="450" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Sin verificar — confirme en la versión impresa</text></svg>