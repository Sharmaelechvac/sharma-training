<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">310.3: Mínimo del conductor</title><desc id="d">Tres carretes de conductor rotulados cobre, aluminio y aluminio recubierto de cobre con sus tamaños mínimos para circuitos ramales: cobre de 14 AWG, aluminio de 12 AWG y CCA de 12 AWG, y una advertencia de que el CCA de 14 AWG no existe para los circuitos ramales de 2020.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1250" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">310.3: Mínimo del conductor</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Tamaños mínimos por material</text><line x1="30" y1="1192" x2="870" y2="1192" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1230" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 310.3</text><text x="870" y="1230" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo de Sharma</text><circle cx="185" cy="420" r="105" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="185" cy="420" r="55" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="185" cy="420" r="17" fill="#264387" stroke="#1a2f61" stroke-width="0"/><text x="185" y="578" font-size="38" font-weight="800" fill="#264387" text-anchor="middle">COBRE</text><text x="185" y="628" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">mín. 14 AWG</text><circle cx="450" cy="420" r="105" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="450" cy="420" r="55" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="450" cy="420" r="17" fill="#264387" stroke="#1a2f61" stroke-width="0"/><text x="450" y="578" font-size="38" font-weight="800" fill="#264387" text-anchor="middle">ALUMINIO</text><text x="450" y="628" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">mín. 12 AWG</text><circle cx="715" cy="420" r="105" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="715" cy="420" r="55" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="715" cy="420" r="17" fill="#264387" stroke="#1a2f61" stroke-width="0"/><text x="715" y="578" font-size="38" font-weight="800" fill="#264387" text-anchor="middle">CCA</text><text x="715" y="628" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">mín. 12 AWG</text><rect x="30" y="690" width="840" height="120" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="742" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">14 AWG CCA</text><text x="450" y="786" font-size="32" font-weight="600" fill="#c0392b" text-anchor="middle">no existe tal cable de circuito ramal en trabajo de 2020</text><rect x="30" y="850" width="840" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="920" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">8 AWG y mayores en canalizaciones: TRENZADO</text><text x="450" y="1030" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Una línea de takeoff de 14 AWG significa cobre (S-10)</text></svg>