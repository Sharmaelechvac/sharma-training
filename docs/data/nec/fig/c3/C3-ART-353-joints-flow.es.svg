<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Conduit HDPE: las juntas hacen el tramo</title><desc id="d">Ducto de HDPE enrollado que alimenta un tramo subterráneo largo con un acople listado, luego tres verificaciones en campo: pruebe que está abierto, conozca al propietario, luego jale.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Conduit HDPE: las juntas hacen el tramo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El tramo es tan bueno como sus uniones</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículo 353 · 353.48</text><circle cx="170" cy="355" r="95" fill="#fdf3e0" stroke="#264387" stroke-width="5"/><circle cx="170" cy="355" r="68" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="170" cy="355" r="41" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><rect x="300" y="320" width="500" height="70" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="545" y="310" width="42" height="90" rx="0" fill="#F0A846" stroke="#264387" stroke-width="3"/><circle cx="566" cy="272" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="566" y="283" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="566" y="482" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">1 — acople listado o unión por fusión</text><line x1="800" y1="355" x2="852" y2="355" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><text x="826" y="300" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">al equipo</text><line x1="60" y1="432" x2="852" y2="432" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 8"/><text x="170" y="512" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">ducto enrollado</text><rect x="25" y="560" width="280" height="190" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="165" y="623" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1 · COMPRUEBE</text><text x="49" y="690" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">mandril pasado</text><text x="49" y="726" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">el agujero pasa</text><rect x="310" y="560" width="280" height="190" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="623" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">2 · ¿DE QUIÉN?</text><text x="334" y="690" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">empresa o sitio,</text><text x="334" y="726" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">¿o el suyo?</text><rect x="595" y="560" width="280" height="190" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="735" y="623" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3 · LUEGO JALE</text><text x="619" y="690" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">línea adentro,</text><text x="619" y="726" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">luego el cable</text><rect x="40" y="830" width="400" height="170" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="64" y="886" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="start">✓ JUNTAS QUE CUENTAN</text><text x="64" y="938" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">fusión o listado</text><text x="64" y="974" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">acoples (353.48)</text><rect x="460" y="830" width="400" height="170" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="484" y="886" font-size="33" font-weight="800" fill="#c0392b" text-anchor="start">✗ NO ES UNA JUNTA</text><text x="484" y="938" font-size="31" font-weight="600" fill="#1f2937" text-anchor="start">cemento solvente —</text><text x="484" y="975" font-size="31" font-weight="600" fill="#1f2937" text-anchor="start">eso es pensar en PVC</text><text x="450" y="1090" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Casi todo el HDPE es ducto de la empresa</text></svg>