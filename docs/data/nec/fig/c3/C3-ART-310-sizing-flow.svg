 marker-end="url(#ah)"/><rect x="60" y="840" width="780" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="125" cy="899" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="125" y="911" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="175" y="895" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">GATE 4 — 240.4(D) CAP</text><text x="175" y="938" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Copper: 14→15 A · 12→20 A · 10→30 A</text><rect x="60" y="1070" width="780" height="150" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="90" y="1122" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">WORKED BOTH WAYS</text><text x="90" y="1170" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">12 AWG THHN: 30 A table → 20 A breaker</text><text x="90" y="1216" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">200 A house service: 2/0 Cu at 83%</text></svg>