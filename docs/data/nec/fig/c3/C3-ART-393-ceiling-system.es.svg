<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">393 Sistema de energía de techo listado</title><desc id="d">Un sistema de energía de techo de baja tensión listado: la unidad de energía propia del sistema en la estructura del techo alimenta equipos soportados en el techo con los conectores propios del sistema, en contraste con el cableado ordinario colocado sobre la rejilla, que no es este artículo y permanece bajo 300.11 y 300.22.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">393 Sistema de energía de techo listado</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un sistema listado — no una canalización tipo rejilla</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Artículo 393; 300.11, 300.22</text><rect x="50" y="200" width="800" height="430" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="80" y="248" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="start">SISTEMA 393 LISTADO</text><line x1="80" y1="330" x2="820" y2="330" stroke="#1a2f61" stroke-width="5"/><line x1="130" y1="330" x2="130" y2="354" stroke="#1a2f61" stroke-width="4"/><line x1="230" y1="330" x2="230" y2="354" stroke="#1a2f61" stroke-width="4"/><line x1="330" y1="330" x2="330" y2="354" stroke="#1a2f61" stroke-width="4"/><line x1="430" y1="330" x2="430" y2="354" stroke="#1a2f61" stroke-width="4"/><line x1="530" y1="330" x2="530" y2="354" stroke="#1a2f61" stroke-width="4"/><line x1="630" y1="330" x2="630" y2="354" stroke="#1a2f61" stroke-width="4"/><line x1="730" y1="330" x2="730" y2="354" stroke="#1a2f61" stroke-width="4"/><rect x="260" y="272" width="380" height="60" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="314" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">UNIDAD DE POTENCIA</text><line x1="450" y1="330" x2="230" y2="470" stroke="#264387" stroke-width="3"/><line x1="450" y1="330" x2="660" y2="470" stroke="#264387" stroke-width="3"/><circle cx="450" cy="330" r="8" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="140" y="470" width="200" height="54" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="240" y="508" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">ARTEFACTO</text><rect x="560" y="470" width="200" height="54" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="660" y="508" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">ARTEFACTO</text><text x="80" y="592" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Sus propios componentes, conexiones, cargas.</text><rect x="50" y="680" width="800" height="400" rx="16" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="80" y="742" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">NO ESTE ARTÍCULO</text><line x1="80" y1="812" x2="820" y2="812" stroke="#1a2f61" stroke-width="5"/><line x1="130" y1="812" x2="130" y2="836" stroke="#1a2f61" stroke-width="4"/><line x1="230" y1="812" x2="230" y2="836" stroke="#1a2f61" stroke-width="4"/><line x1="330" y1="812" x2="330" y2="836" stroke="#1a2f61" stroke-width="4"/><line x1="430" y1="812" x2="430" y2="836" stroke="#1a2f61" stroke-width="4"/><line x1="530" y1="812" x2="530" y2="836" stroke="#1a2f61" stroke-width="4"/><line x1="630" y1="812" x2="630" y2="836" stroke="#1a2f61" stroke-width="4"/><line x1="730" y1="812" x2="730" y2="836" stroke="#1a2f61" stroke-width="4"/><path d="M110,792 Q300,862 480,798 T800,800" stroke="#c0392b" stroke-width="4" fill="none"/><line x1="398" y1="762" x2="502" y2="856" stroke="#c0392b" stroke-width="6"/><line x1="502" y1="762" x2="398" y2="856" stroke="#c0392b" stroke-width="6"/><text x="80" y="928" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">El cableado ordinario sobre la rejilla permanece</text><text x="80" y="976" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">según 300.11 y 300.22.</text><text x="60" y="1150" font-size="33" font-weight="700" fill="#5b6478" text-anchor="start">La rejilla es estructura para el listado</text><text x="60" y="1198" font-size="33" font-weight="700" fill="#5b6478" text-anchor="start">solo sistema — nunca una canalización.</text></svg>