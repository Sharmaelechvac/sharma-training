<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">324 FCC: wiring under carpet squares</title><desc id="d">Section through a Type FCC under-carpet installation: carpet square no larger than 1 m, top shield, three-conductor flat cable, bottom shield and bedding on a concrete slab, feeding a floor pedestal.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">324 FCC: wiring under carpet squares</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Floor section — shields above and below</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 324.10, 324.18, 324.41, 324.60</text><rect x="552" y="196" width="96" height="74" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="600" cy="233" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><rect x="588" y="270" width="24" height="66" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="536" y="245" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">floor pedestal</text><rect x="90" y="336" width="570" height="44" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="104" y="370" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">CARPET SQUARE</text><line x1="90" y1="322" x2="660" y2="322" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="375.0" y="310" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 1 m (39.37 in) · release adhesive</text><text x="375.0" y="310" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 1 m (39.37 in) · release adhesive</text><rect x="90" y="392" width="570" height="26" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="676" y="416" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">top shield</text><rect x="90" y="430" width="570" height="34" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="2"/><text x="104" y="457" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">FLAT CABLE: hot, neutral, EGC</text><rect x="90" y="476" width="570" height="26" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="2"/><text x="676" y="500" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">bottom shield</text><line x1="90" y1="516" x2="660" y2="516" stroke="#5b6478" stroke-width="4" stroke-dasharray="10 6"/><text x="676" y="524" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">bedding tape</text><rect x="90" y="530" width="570" height="90" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="104" y="586" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">CONCRETE SLAB</text><text x="60" y="716" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Metal shields grounded (324.60)</text><text x="60" y="762" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Not more than two runs cross (324.18)</text><text x="60" y="808" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Branch only: 20 A general / 30 A indiv.</text><text x="60" y="854" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Voltage: ≤300 V across, ≤150 V to ground</text><text x="60" y="900" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Barred in residences (324.12)</text><text x="60" y="946" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Schools / hospitals: admin areas only</text><text x="60" y="992" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">• Flat 12 AWG Cu conductors on a 20 A run</text><rect x="60" y="1050" width="780" height="150" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="84" y="1106" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">NOT TYPE FC</text><text x="84" y="1154" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">FC (Art. 322) lives in a surface metal raceway.</text><text x="84" y="1194" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">FCC lives under carpet. Never interchangeable.</text><text x="60" y="1270" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Lift a square to reach it — that is the design.</text><text x="60" y="1320" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Identify the listing before touching an old system.</text></svg>