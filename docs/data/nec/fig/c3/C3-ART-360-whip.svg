<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">FMT: the 6 ft whip</title><desc id="d">Elevation of a flexible metallic tubing whip above an accessible ceiling. A junction box feeds a horizontal FMT run dimensioned 6 ft maximum, bending down to a lay-in luminaire. Callouts give the 12 1/2 inch minimum bend radius for 1/2 inch FMT flexed in service, the 1/2 to 3/4 trade sizes, and the prohibited uses in a red strip.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">FMT: the 6 ft whip</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Junction box to luminaire, accessible ceiling</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 360.10, 360.12, 360.20 · Table 360.24(A)</text><rect x="110" y="330" width="150" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="185" y="470" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">J-BOX</text><path d="M260,385 L600,385 Q690,385 690,475 L690,520" stroke="#264387" stroke-width="9" fill="none"/><path d="M260,385 L600,385 Q690,385 690,475 L690,520" stroke="#F0A846" stroke-width="3" fill="none"/><line x1="260" y1="330" x2="260" y2="312" stroke="#1a2f61" stroke-width="2"/><line x1="690" y1="330" x2="690" y2="312" stroke="#1a2f61" stroke-width="2"/><line x1="260" y1="300" x2="690" y2="300" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="475.0" y="288" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">whole run ≤ 6 ft</text><text x="475.0" y="288" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">whole run ≤ 6 ft</text><line x1="40" y1="560" x2="860" y2="560" stroke="#1f2937" stroke-width="6"/><text x="120" y="610" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">ACCESSIBLE CEILING</text><rect x="560" y="560" width="260" height="54" rx="0" fill="#fdf3e0" stroke="#1a2f61" stroke-width="4"/><line x1="620" y1="614" x2="598" y2="668" stroke="#F0A846" stroke-width="4"/><line x1="690" y1="614" x2="668" y2="668" stroke="#F0A846" stroke-width="4"/><line x1="760" y1="614" x2="738" y2="668" stroke="#F0A846" stroke-width="4"/><text x="690" y="716" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LUMINAIRE</text><line x1="648" y1="400" x2="470" y2="790" stroke="#1a2f61" stroke-width="3"/><circle cx="648" cy="400" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="470" y="750" width="432.8" height="96" rx="10" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="484" y="792" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Bend radius ≥ 12½ in</text><text x="484" y="831" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">(½ in FMT, flexing use)</text><rect x="60" y="894" width="446" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="283.0" y="932" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Trade sizes ½ – ¾ only</text><rect x="60" y="966" width="637" height="52" rx="26" fill="#264387" stroke="#264387" stroke-width="0"/><text x="378.5" y="1004" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">Branch circuits · dry · ≤ 1000 V</text><text x="60" y="1094" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">FMT is not FMC — different article, different limits.</text><rect x="60" y="1150" width="780" height="64" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1192" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">NEVER: wet · buried · concrete · hoistway</text></svg>