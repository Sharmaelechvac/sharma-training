ze="32" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 12 in</text><text x="366" y="834.2" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">≤ 12 in</text><line x1="420" y1="553" x2="420" y2="796" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="434" y="685.7" font-size="32" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">≤ 4 ft 6 in</text><text x="434" y="685.7" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">≤ 4 ft 6 in</text><circle cx="255" cy="790" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="255" y="801" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="255" cy="547" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="255" y="558" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="665" cy="232" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="665" y="243" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="40" y="1150" font-size="34" font-weight="800" fill="#264387" text-anchor="start">READ THE RUN</text><text x="40" y="1202" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  Staple within 12 in of every box</text><text x="40" y="1248" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  Support at least every 4 ft 6 in</text><text x="40" y="1294" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  Bored holes protect the cable (300.4)</text><text x="40" y="1340" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4  NM ampacity: the 60 °C column (334.80)</text></svg>