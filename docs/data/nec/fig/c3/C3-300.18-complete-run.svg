e x1="40" y1="600" x2="860" y2="600" stroke="#c9d2e3" stroke-width="3"/><circle cx="58" cy="662" r="24" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="58" y="676" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">✕</text><text x="95" y="675" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">TOO SOON — wire in a half-built run</text><line x1="90" y1="775" x2="360" y2="775" stroke="#264387" stroke-width="7"/><line x1="470" y1="775" x2="700" y2="775" stroke="#264387" stroke-width="7"/><rect x="700" y="723" width="105" height="104" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><path d="M90,775 L360,775 Q415,808 470,775 L700,775" stroke="#F0A846" stroke-width="5" fill="none"/><line x1="388" y1="745" x2="442" y2="800" stroke="#c0392b" stroke-width="6"/><line x1="442" y1="745" x2="388" y2="800" stroke="#c0392b" stroke-width="6"/><text x="40" y="890" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">finishing around pulled wire skins insulation</text><text x="40" y="935" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">and the damage hides inside the finished run</text></svg>