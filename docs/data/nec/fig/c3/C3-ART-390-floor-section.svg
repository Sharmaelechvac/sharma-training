><rect x="695" y="420" width="120" height="230" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="755" y="700" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">JUNCTION BOX</text><text x="755" y="742" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">flush + sealed</text><rect x="300" y="470" width="26" height="100" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="272" y="396" width="82" height="26" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="313" y="356" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">FLOOR OUTLET</text><circle cx="520" cy="610" r="30" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><line x1="502" y1="592" x2="538" y2="628" stroke="#c0392b" stroke-width="5"/><line x1="538" y1="592" x2="502" y2="628" stroke="#c0392b" stroke-width="5"/><text x="450" y="806" font-size="34" font-weight="700" fill="#c0392b" text-anchor="middle">No splices in the duct — box only</text><rect x="103.0" y="876" width="694" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="914" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Fill ≤ 40% of duct interior (390.6)</text><text x="60" y="1002" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Runs laid straight, box center to box center.</text><text x="60" y="1054" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Markers at each end locate the last insert.</text><text x="60" y="1106" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Dead conductors come OUT of the raceway (390.8).</text></svg>