<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">314.16(B) Los cinco conteos</title><desc id="d">Tarjeta de conteo de cinco filas para llenado de caja: conductores, abrazaderas, accesorios de soporte, dispositivos y puestas a tierra, cada uno con su multiplicador de conteo; la fila de puestas a tierra está resaltada como el conteo que cambió en 2020.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">314.16(B) Los cinco conteos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El conteo del llenado de la caja, regla por regla</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 314.16(B)(1)–(5)</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo de Sharma</text><rect x="40" y="200" width="820" height="180" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><circle cx="98" cy="262" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="98" y="275" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="150" y="275" font-size="38" font-weight="bold" fill="#1a2f61" text-anchor="start">Conductores</text><text x="150" y="322" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Empalmado o terminado ×1 · de paso ×1</text><text x="150" y="358" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Bucle largo ×2 · pigtail ×0</text><rect x="40" y="396" width="820" height="180" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><circle cx="98" cy="458" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="98" y="471" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="150" y="471" font-size="38" font-weight="bold" fill="#1a2f61" text-anchor="start">Abrazaderas</text><text x="150" y="518" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Todas las abrazaderas internas juntas ×1</text><text x="150" y="554" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Conector fuera de la caja ×0</text><rect x="40" y="592" width="820" height="180" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><circle cx="98" cy="654" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="98" y="667" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="150" y="667" font-size="38" font-weight="bold" fill="#1a2f61" text-anchor="start">Accesorios de soporte</text><text x="150" y="714" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Cada tipo cuenta ×1 — studs una vez,</text><text x="150" y="750" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">hickeys una vez; ambos presentes = 2</text><rect x="40" y="788" width="820" height="180" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><circle cx="98" cy="850" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="98" y="863" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="150" y="863" font-size="38" font-weight="bold" fill="#1a2f61" text-anchor="start">Dispositivos</text><text x="150" y="910" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Cada yugo o correa ×2</text><text x="150" y="946" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Dispositivo ancho: ×2 por cada módulo</text><rect x="40" y="984" width="820" height="180" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><circle cx="98" cy="1046" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="98" y="1059" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="150" y="1059" font-size="38" font-weight="bold" fill="#1a2f61" text-anchor="start">Puestas a tierra — el cambio de 2020</text><text x="150" y="1106" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Los primeros cuatro juntos ×1</text><text x="150" y="1142" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Cada extra: + 1/4 de asignación</text><rect x="40" y="1196" width="820" height="104" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="1242" font-size="32" font-weight="600" fill="#1a2f61" text-anchor="middle">Cada asignación se valora al tamaño de</text><text x="450" y="1282" font-size="32" font-weight="600" fill="#1a2f61" text-anchor="middle">el conductor más grande al que sirve</text></svg>