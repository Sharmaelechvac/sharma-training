<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">384: when strut is the raceway</title><desc id="d">Left: strut channel with a listed cover and conductors inside, a 384 raceway. Right: plain strut carrying conduit on top, support work only.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1250" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">384: when strut is the raceway</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Same steel, two different jobs</text><line x1="30" y1="1192" x2="870" y2="1192" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1230" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 384</text><text x="870" y="1230" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="200" width="400" height="520" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="240" y="262" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">384 RACEWAY</text><rect x="118" y="380" width="224" height="28" rx="0" fill="#F0A846" stroke="#264387" stroke-width="3"/><path d="M 130 408 L 130 570 L 310 570 L 310 408" stroke="#264387" stroke-width="6" fill="#eef2f9"/><circle cx="172" cy="505" r="17" fill="#F0A846" stroke="#264387" stroke-width="3"/><circle cx="220" cy="505" r="17" fill="#264387" stroke="#264387" stroke-width="3"/><circle cx="268" cy="505" r="17" fill="#F0A846" stroke="#264387" stroke-width="3"/><text x="240" y="640" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">listed cover + fittings</text><text x="240" y="682" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">conductors inside</text><rect x="460" y="200" width="400" height="520" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="660" y="262" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SUPPORT STRUT</text><line x1="575" y1="320" x2="575" y2="470" stroke="#264387" stroke-width="4"/><line x1="745" y1="320" x2="745" y2="470" stroke="#264387" stroke-width="4"/><rect x="510" y="420" width="300" height="36" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="510" y1="438" x2="810" y2="438" stroke="#c9d2e3" stroke-width="3"/><rect x="510" y="470" width="300" height="42" rx="0" fill="#c9d2e3" stroke="#264387" stroke-width="4"/><text x="660" y="640" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">conduit rides on top</text><text x="660" y="682" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">no conductors inside</text><text x="60" y="830" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Left: the channel IS the wiring method</text><text x="60" y="878" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Right: the channel only holds the raceway</text><rect x="40" y="950" width="820" height="84" rx="12" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="1004" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">If wire runs inside it, Article 384 owns it</text></svg>