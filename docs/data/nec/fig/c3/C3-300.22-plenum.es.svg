<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" width="900" height="1450" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">300.22 Espacios de manejo de aire</title><desc id="d">Plano de techo de un espacio de pleno de aire de retorno que muestra un tramo de EMT marcado como permitido bajo 300.22(C), un tramo de cable NM tachado como no permitido, y un ducto fabricado donde solo pueden entrar los métodos de 300.22(B).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1450" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">300.22 Espacios de manejo de aire</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta: el espacio del techo es un pleno</text><line x1="30" y1="1392" x2="870" y2="1392" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1430" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 300.22(A), (B), (C)</text><rect x="40" y="210" width="820" height="560" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="5"/><text x="65" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PLENO DE AIRE DE RETORNO</text><text x="65" y="306" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">El espacio del techo mueve el aire del edificio</text><rect x="545" y="340" width="315" height="105" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="702" y="385" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">DUCTO FABRICADO</text><text x="702" y="425" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">300.22(B) solo la lista</text><path d="M90,700 L90,570 L620,570 L620,645" stroke="#264387" stroke-width="8" fill="none"/><rect x="60" y="690" width="60" height="60" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><rect x="590" y="635" width="60" height="60" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><circle cx="700" cy="570" r="28" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="700" y="582" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="115" y="552" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">EMT — permitido, 300.22(C)(1)</text><text x="115" y="552" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">EMT — permitido, 300.22(C)(1)</text><path d="M150,725 L430,725 L430,650" stroke="#c0392b" stroke-width="6" fill="none" stroke-dasharray="14 10"/><line x1="408" y1="606" x2="452" y2="650" stroke="#c0392b" stroke-width="7"/><line x1="452" y1="606" x2="408" y2="650" stroke="#c0392b" stroke-width="7"/><text x="150" y="690" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">Cable NM — NO permitido</text><text x="150" y="690" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">Cable NM — NO permitido</text><text x="40" y="850" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">LOS TRES ESPACIOS</text><text x="40" y="905" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">(A) Conducto de polvo / vapor</text><text x="40" y="949" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Sin cableado de ningún tipo en el interior.</text><text x="40" y="1025" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">(B) Conducto de aire fabricado</text><text x="40" y="1069" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">MI, MC con funda impermeable, EMT, FMT, IMC, RMC.</text><text x="40" y="1145" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">(C) Espacio de techo pleno</text><text x="40" y="1189" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Canalizaciones metálicas, AC, MC sin chaqueta.</text><text x="40" y="1233" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">El cable NM no está en la lista.</text><rect x="40" y="1262" width="820" height="104" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1306" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Equipo en un ducto fabricado solo si actúa</text><text x="450" y="1350" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">sobre, o detecta, el aire contenido.</text></svg>