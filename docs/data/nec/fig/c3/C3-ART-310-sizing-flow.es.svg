<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Dimensionamiento: cuatro compuertas</title><desc id="d">Diagrama de flujo de las cuatro compuertas para dimensionar un conductor: la carga, la Tabla 310.16 con la columna que permiten las terminaciones, corrección y ajuste en 310.15, y el límite de interruptor automático de 240.4(D).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Dimensionamiento: cuatro compuertas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Cuatro compuertas, en orden, cada vez</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 310.12, 310.15, Tabla 310.16, 240.4(D)</text><rect x="60" y="210" width="780" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="125" cy="269" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="125" y="281" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="175" y="265" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">COMPUERTA 1 — LA CARGA</text><text x="175" y="308" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">La carga real, calculada en el Artículo 220</text><line x1="450" y1="328" x2="450" y2="378" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="420" width="780" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="125" cy="479" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="125" y="491" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="175" y="475" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">COMPUERTA 2 — TABLA 310.16</text><text x="175" y="518" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">La columna sale de 110.14(C)</text><line x1="450" y1="538" x2="450" y2="588" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="630" width="780" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="125" cy="689" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="125" y="701" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="175" y="685" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">COMPUERTA 3 — 310.15</text><text x="175" y="728" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Corrija por calor · ajuste por conteo</text><line x1="450" y1="748" x2="450" y2="798" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="840" width="780" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="125" cy="899" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="125" y="911" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="175" y="895" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">COMPUERTA 4 — LÍMITE 240.4(D)</text><text x="175" y="938" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Cobre: 14→15 A · 12→20 A · 10→30 A</text><rect x="60" y="1070" width="780" height="150" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="90" y="1122" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">CALCULADO DE AMBAS MANERAS</text><text x="90" y="1170" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">12 AWG THHN: tabla 30 A → límite 20 A</text><text x="90" y="1216" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Acometida de vivienda de 200 A: 2/0 Cu al 83%</text></svg>