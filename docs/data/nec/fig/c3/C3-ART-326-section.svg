<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Art. 326 Type IGS: below grade only</title><desc id="d">Cross-section of Type IGS cable: solid aluminum rods laid parallel inside dry kraft paper insulation and pressurized SF6 gas, all within a loose-fit nonmetallic conduit; rated 0 through 600 volts, below grade only.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Art. 326 Type IGS: below grade only</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Gas-spacer cable — an engineered buried system</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 326</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><circle cx="280" cy="470" r="185" fill="#fdf3e0" stroke="#264387" stroke-width="6"/><circle cx="280" cy="470" r="140" fill="#ffffff" stroke="#F0A846" stroke-width="4"/><circle cx="218" cy="430" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="342" cy="430" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="280" cy="532" r="40" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="280" y="235" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">CROSS-SECTION</text><line x1="410" y1="340" x2="495" y2="300" stroke="#1a2f61" stroke-width="3"/><circle cx="410" cy="340" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="495" y="260" width="344.8" height="96" rx="10" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="509" y="302" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Loose-fit conduit,</text><text x="509" y="341" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">nonmetallic jacket</text><line x1="380" y1="530" x2="495" y2="470" stroke="#1a2f61" stroke-width="3"/><circle cx="380" cy="530" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="495" y="430" width="292.0" height="96" rx="10" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="509" y="472" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Dry kraft paper</text><text x="509" y="511" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">insulation</text><line x1="218" y1="430" x2="495" y2="610" stroke="#1a2f61" stroke-width="3"/><circle cx="218" cy="430" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="495" y="570" width="380.0" height="96" rx="10" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="509" y="612" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Solid aluminum rods,</text><text x="509" y="651" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">laid parallel</text><line x1="310" y1="600" x2="495" y2="740" stroke="#1a2f61" stroke-width="3"/><circle cx="310" cy="600" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="495" y="700" width="397.6" height="96" rx="10" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="509" y="742" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Pressurized SF6 gas —</text><text x="509" y="781" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">part of insulation</text><rect x="60" y="722" width="290" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="205.0" y="762" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">RATED 0–600 V</text><rect x="40" y="850" width="400" height="300" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="70" y="915" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">BELOW GRADE ✓</text><text x="70" y="975" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Services</text><text x="70" y="1016" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Feeders</text><text x="70" y="1057" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Branch circuits</text><text x="70" y="1098" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Direct burial OK</text><rect x="470" y="850" width="400" height="300" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="500" y="915" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NEVER ✗</text><text x="500" y="975" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Interior wiring</text><text x="500" y="1016" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Above ground</text><text x="500" y="1057" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Exposed on a</text><text x="500" y="1098" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">building</text><text x="40" y="1240" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">On a drawing? It is an engineered system —</text><text x="40" y="1281" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">escalate. Nothing on the truck substitutes.</text></svg>