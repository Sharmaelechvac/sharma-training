<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1190" width="900" height="1190" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">310.12 La regla del 83%</title><desc id="d">Diagrama unifilar de una casa: empresa de servicios a medidor-principal a tablero principal, el alimentador entre ellos rotulado como carga total con la regla del 83 por ciento y 2/0 de cobre o 4/0 de aluminio para 200 A; un segundo alimentador a un subtablero de garaje rotulado como carga parcial, tamaño completo, sin 83 por ciento.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1190" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">310.12 La regla del 83%</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Caso a escala: acometida de vivienda de 200 A</text><line x1="30" y1="1132" x2="870" y2="1132" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1170" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 310.12, Tabla 310.12</text><rect x="40" y="330" width="150" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="115" y="404" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">EMPRESA</text><line x1="190" y1="390" x2="255" y2="390" stroke="#264387" stroke-width="5"/><rect x="255" y="330" width="200" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="355" y="404" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">MEDIDOR</text><rect x="455" y="370" width="180" height="40" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><line x1="455" y1="390" x2="635" y2="390" stroke="#264387" stroke-width="5"/><text x="545" y="300" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="middle">CARGA TOTAL - SE APLICA EL 83%</text><text x="545" y="482" font-size="33" font-weight="800" fill="#1f2937" text-anchor="middle">200 A: 2/0 Cu o 4/0 Al</text><circle cx="545" cy="540" r="24" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="545" y="553" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text><rect x="635" y="330" width="200" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="735" y="404" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">TABLERO</text><line x1="735" y1="450" x2="735" y2="700" stroke="#1f2937" stroke-width="5"/><line x1="716" y1="603" x2="754" y2="641" stroke="#c0392b" stroke-width="6"/><line x1="754" y1="603" x2="716" y2="641" stroke="#c0392b" stroke-width="6"/><text x="708" y="612" font-size="33" font-weight="900" fill="#c0392b" text-anchor="end">CARGA PARCIAL</text><text x="708" y="656" font-size="33" font-weight="900" fill="#c0392b" text-anchor="end">TAMAÑO COMPLETO - SIN 83%</text><rect x="620" y="700" width="230" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="735" y="754" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">GARAJE</text><text x="735" y="798" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">SUBTABLERO</text><rect x="40" y="890" width="820" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="64" y="942" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">83% requiere 100-400 A, monofásico,</text><text x="64" y="986" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">y toda la carga de la vivienda.</text></svg>