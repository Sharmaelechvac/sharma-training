<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">314.16(C) Sin marcado, sin empalme</title><desc id="d">Comparación de dos cuerpos de conduit: uno marcado de forma duradera con su capacidad en pulgadas cúbicas que contiene un empalme, aprobado; un cuerpo sin marcar que contiene un empalme, tachado; abajo, el conteo de llenado trabajado para un empalme de dos conductores de 12 AWG.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">314.16(C) Sin marcado, sin empalme</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El mismo cuerpo de conduit — dos veredictos</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 314.16(C) · Tabla 314.16(B)</text><rect x="40" y="210" width="380" height="470" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><rect x="80" y="260" width="300" height="110" rx="14" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="280" y="370" width="100" height="90" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="105" cy="315" r="8" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="355" cy="315" r="8" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="170" cy="315" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="230" cy="315" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><line x1="100" y1="315" x2="150" y2="315" stroke="#1f2937" stroke-width="4"/><line x1="250" y1="315" x2="330" y2="315" stroke="#1f2937" stroke-width="4"/><rect x="125" y="482" width="210" height="54" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="230" y="518" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">CU IN MARCADO</text><circle cx="230" cy="592" r="30" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="230" y="604" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="230" y="658" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">Empalme OK</text><rect x="480" y="210" width="380" height="470" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><rect x="520" y="260" width="300" height="110" rx="14" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="720" y="370" width="100" height="90" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="545" cy="315" r="8" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="795" cy="315" r="8" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="610" cy="315" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="670" cy="315" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><line x1="540" y1="315" x2="590" y2="315" stroke="#1f2937" stroke-width="4"/><line x1="690" y1="315" x2="770" y2="315" stroke="#1f2937" stroke-width="4"/><text x="670" y="518" font-size="30" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">SIN MARCADO</text><text x="670" y="518" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">SIN MARCADO</text><line x1="520" y1="240" x2="820" y2="620" stroke="#c0392b" stroke-width="8"/><line x1="820" y1="240" x2="520" y2="620" stroke="#c0392b" stroke-width="8"/><text x="670" y="658" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Solo jalado</text><rect x="40" y="740" width="820" height="340" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="70" y="805" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EL CONTEO — un empalme cuenta como</text><text x="70" y="868" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Empalme de dos conductores de 12 AWG:</text><text x="70" y="911" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">2 × 2.25 = 4.50 cu in</text><text x="70" y="954" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Tierras cuentan una vez: + 2.25 cu in</text><text x="70" y="997" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Cargo total:  6.75 cu in</text><text x="70" y="1045" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">La capacidad marcada debe indicar 6.75 o más.</text><text x="40" y="1170" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Los conductores que pasan recto están limitados</text><text x="40" y="1211" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">según el Cap. 9 para el tamaño de la caja —</text><text x="40" y="1252" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">el volumen marcado rige solo empalmes y</text><text x="40" y="1293" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">derivaciones y dispositivos.</text></svg>