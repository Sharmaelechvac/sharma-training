<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">334.80 Comience a 90 °C, termine a 60 °C</title><desc id="d">Diagrama de flujo para NM de 12 AWG y 14 AWG: inicie la reducción de capacidad desde la columna de 90 grados, limite la ampacidad final al valor de 60 grados, luego aplique el límite de interruptor automático de 240.4(D).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">334.80 Comience a 90 °C, termine a 60 °C</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ampacidad del NM — regla de dos pasos</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 334.80 · Tabla 310.16 · 240.4(D)</text><rect x="25" y="206" width="199" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="124.5" y="244" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">12 AWG NM</text><rect x="25" y="300" width="196" height="120" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="123" y="350" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">Desde 90 °C</text><text x="123" y="398" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">30 A</text><line x1="225" y1="360" x2="239" y2="360" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="243" y="300" width="196" height="120" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="341" y="350" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">Reduzca</text><text x="341" y="398" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">desde 90 °C</text><line x1="443" y1="360" x2="457" y2="360" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="461" y="300" width="196" height="120" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="559" y="350" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">60 °C tope</text><text x="559" y="398" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">20 A</text><line x1="661" y1="360" x2="675" y2="360" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="679" y="300" width="196" height="120" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="777" y="350" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">Interruptor</text><text x="777" y="398" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">20 A</text><rect x="25" y="526" width="199" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="124.5" y="564" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">14 AWG NM</text><rect x="25" y="620" width="196" height="120" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="123" y="670" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">Desde 90 °C</text><text x="123" y="718" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">25 A</text><line x1="225" y1="680" x2="239" y2="680" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="243" y="620" width="196" height="120" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="341" y="670" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">Reduzca</text><text x="341" y="718" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">desde 90 °C</text><line x1="443" y1="680" x2="457" y2="680" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="461" y="620" width="196" height="120" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="559" y="670" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">60 °C tope</text><text x="559" y="718" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">15 A</text><line x1="661" y1="680" x2="675" y2="680" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="679" y="620" width="196" height="120" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="777" y="670" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">Interruptor</text><text x="777" y="718" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">15 A</text><rect x="25" y="890" width="850" height="160" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="55" y="952" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">La ampacidad final nunca pasa del</text><text x="55" y="993" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">el valor de 60 °C, sin importar el</text><text x="55" y="1034" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">90 °C según el cálculo en papel.</text><rect x="25" y="1085" width="850" height="160" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="55" y="1147" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">Comenzar en 90 °C está permitido — es lo que</text><text x="55" y="1188" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">hace que un tramo agrupado o caliente sobreviva</text><text x="55" y="1229" font-size="34" font-weight="700" fill="#2e7d32" text-anchor="start">el cálculo de reducción de ampacidad.</text></svg>