<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="900" height="1350" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">358.26: Cuente cada curva</title><desc id="d">Un tramo de EMT dibujado con seis curvas numeradas: un stub-up de 90 grados, un offset de 30 más 30 grados, y una silla de 22.5 más 45 más 22.5 grados sobre un ducto, con una barra de conteo que muestra 240 de los 360 grados permitidos entre puntos de jalado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1350" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">358.26: Cuente cada curva</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Un tramo de EMT, de jalado a jalado</text><line x1="30" y1="1292" x2="870" y2="1292" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1330" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 358.24 · 358.26 · Ch. 9 Tabla 2</text><rect x="30" y="335" width="100" height="130" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="80" y="395" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">CAJA</text><text x="80" y="435" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">A</text><rect x="770" y="200" width="100" height="130" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="820" y="260" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">CAJA</text><text x="820" y="300" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">B</text><rect x="655" y="278" width="90" height="74" rx="0" fill="url(#hatch)" stroke="#264387" stroke-width="3"/><text x="700" y="392" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">DUCTO</text><path d="M130 400 H280 Q315 400 315 365 L315 300 Q315 265 350 265 H440 L495 320 L550 265 H620 L668 218 H712 L760 265 H770" stroke="#264387" stroke-width="6" fill="none"/><circle cx="315" cy="382" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="315" y="393" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="452" cy="276" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="452" y="287" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="538" cy="276" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="538" y="287" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="630" cy="250" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="630" y="261" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><circle cx="690" cy="196" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="690" y="207" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">5</text><circle cx="748" cy="238" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="748" y="249" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">6</text><text x="30" y="560" font-size="36" font-weight="800" fill="#264387" text-anchor="start">LAS CURVAS</text><text x="60" y="625" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1  Salida vertical — 90°</text><text x="60" y="664" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2  Desviación adentro — 30°</text><text x="60" y="703" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3  Desviación afuera — 30°</text><text x="480" y="625" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">4  Silla — 22.5°</text><text x="480" y="664" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">5  Silla — 45°</text><text x="480" y="703" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">6  Silla — 22.5°</text><text x="30" y="800" font-size="34" font-weight="800" fill="#264387" text-anchor="start">TOTAL ACUMULADO</text><rect x="30" y="820" width="840" height="56" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="30" y="820" width="560" height="56" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="310" y="860" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">240°</text><text x="735" y="860" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">de 360° máximo</text><text x="30" y="930" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Quedan 120° — luego agregue un punto de jalado</text><rect x="30" y="980" width="840" height="110" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1032" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Cinco 90s = 450° — sobre el límite</text><text x="450" y="1076" 