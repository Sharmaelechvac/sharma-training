 stroke-width="0"/><text x="430" y="672" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">staple ≤ 12 in of box</text><line x1="660" y1="660" x2="706" y2="560" stroke="#1a2f61" stroke-width="3"/><line x1="150" y1="900" x2="172" y2="900" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="161.0" y="888" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">1-1/4 in min</text><text x="161.0" y="888" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1-1/4 in min</text><text x="480" y="912" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">measured edge of hole to edge of stud</text><text x="480" y="954" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">too close? add a 1/16 in steel plate</text><rect x="40" y="990" width="820" height="110" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="64" y="1036" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Article 334 Part II applies:</text><text x="64" y="1082" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">routing · protection · support</text><rect x="40" y="1130" width="820" height="110" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="64" y="1176" font-size="36" font-weight="900" fill="#c0392b" text-anchor="start">334.80 NM ampacity cap — does NOT apply</text><line x1="64" y1="1162" x2="505" y2="1162" stroke="#c0392b" stroke-width="4"/><text x="64" y="1222" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">338.10(B)(4) names it as the exclusion</text><rect x="40" y="1270" width="820" height="110" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="64" y="1316" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">60 °C rating only where SE says so:</text><text x="64" y="1362" font-size="33" font-weight="700" fill="#1