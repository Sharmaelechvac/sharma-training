<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">366: a gutter serves the gear</title><desc id="d">An auxiliary gutter spanning a row of meters and disconnects, conduits entering from below, conductors turning inside the gutter, with a warning that it is not a raceway run.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">366: a gutter serves the gear</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Extra room at the equipment — not a run</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 366 · 312.6</text><rect x="80" y="230" width="740" height="130" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="5"/><text x="450" y="312" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">AUXILIARY GUTTER</text><path d="M 190 352 L 190 268" stroke="#F0A846" stroke-width="6" fill="none"/><circle cx="190" cy="262" r="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><path d="M 648 352 L 648 268" stroke="#F0A846" stroke-width="6" fill="none"/><circle cx="648" cy="262" r="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><path d="M 710 352 L 710 268" stroke="#F0A846" stroke-width="6" fill="none"/><circle cx="710" cy="262" r="8" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><rect x="168" y="360" width="44" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="428" y="360" width="44" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="688" y="360" width="44" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><rect x="80" y="470" width="220" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="190" y="745" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">METER</text><rect x="340" y="470" width="220" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="745" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><rect x="600" y="470" width="220" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="710" y="745" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><circle cx="190" cy="570" r="44" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="190" y="582" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">kWh</text><rect x="415" y="545" width="70" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="450" y1="560" x2="450" y2="610" stroke="#c0392b" stroke-width="6"/><line x1="652" y1="545" x2="652" y2="700" stroke="#c9d2e3" stroke-width="3"/><line x1="748" y1="545" x2="748" y2="700" stroke="#c9d2e3" stroke-width="3"/><rect x="80" y="850" width="740" height="130" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="906" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Not a raceway run across the building</text><text x="450" y="954" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">It supplements the gear it hangs on</text><text x="450" y="1064" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Size it for the conductors and their bending</text></svg>