<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">300.25 Keep the tower to itself</title><desc id="d">Building section of a rated stair tower: its own lighting circuit runs inside in green, while a foreign branch circuit is stopped at the tower wall and re-routed around the enclosure.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">300.25 Keep the tower to itself</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Only wiring that serves the tower goes in</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 300.25 · NFPA 101 7.1.3.2.1(10)(b)</text><rect x="60" y="230" width="780" height="850" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><line x1="60" y1="660" x2="380" y2="660" stroke="#c9d2e3" stroke-width="4"/><line x1="580" y1="660" x2="840" y2="660" stroke="#c9d2e3" stroke-width="4"/><text x="90" y="290" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">floor 2</text><text x="90" y="720" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">floor 1</text><rect x="380" y="230" width="200" height="850" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="6"/><text x="480" y="200" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">EXIT ENCLOSURE</text><path d="M 396 1040 L 452 1040 L 452 968 L 508 968 L 508 896 L 564 896" stroke="#264387" stroke-width="4" fill="none"/><path d="M 396 640 L 452 640 L 452 568 L 508 568 L 508 496 L 564 496" stroke="#264387" stroke-width="4" fill="none"/><line x1="480" y1="1040" x2="480" y2="300" stroke="#2e7d32" stroke-width="6"/><circle cx="480" cy="360" r="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><circle cx="480" cy="560" r="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><circle cx="480" cy="780" r="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><circle cx="480" cy="980" r="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="596" y="420" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">tower lights</text><text x="596" y="462" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">+ exit signs ✓</text><rect x="90" y="940" width="150" height="100" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="165" y="978" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">PANEL</text><text x="165" y="1014" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">other floors</text><line x1="240" y1="990" x2="372" y2="990" stroke="#c0392b" stroke-width="5" stroke-dasharray="14 10"/><text x="185" y="878" font-size="30" font-weight="900" fill="#c0392b" text-anchor="start">straight</text><text x="185" y="916" font-size="30" font-weight="900" fill="#c0392b" text-anchor="start">through?</text><path d="M 356 956 L 396 996 M 396 956 L 356 996" stroke="#c0392b" stroke-width="7" fill="none"/><path d="M 165 940 L 165 300 L 165 160 L 760 160 L 760 940" stroke="#264387" stroke-width="5" fill="none"/><rect x="680" y="940" width="160" height="100" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="760" y="982" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">WATER</text><text x="760" y="1022" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">HEATER</text><line x1="40" y1="1080" x2="860" y2="1080" stroke="#1a2f61" stroke-width="6"/><text x="60" y="1140" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">Navy run = the long way around the tower</text><text x="40" y="1204" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1  Green: wiring that serves the tower itself</text><text x="40" y="1250" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">2  Navy: foreign circuit re-routed around</text><text x="40" y="1296" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">3  Red ✗: no through runs, no foreign loads</text><rect x="40" y="1330" width="820" height="84" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1384" font-size="33" font-weight="900" fill="#c0392b" text-anchor="middle">In conduit does not save it — still foreign</text></svg>