tart">THE MARKING, ENLARGED</text><text x="65" y="872" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">LISTED FOR FAN SUPPORT</text><text x="65" y="919" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">MAX WEIGHT ON THE BOX</text><text x="40" y="1010" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">WHAT THE WEIGHT DEMANDS</text><rect x="40" y="1040" width="820" height="92" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="65" y="1098" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">Up to 35 lb: listed fan-support box</text><rect x="40" y="1152" width="820" height="92" rx="12" fill="#fdf3e0" stroke="#1a2f61" stroke-width="3"/><text x="65" y="1210" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">35-70 lb: box marked for the weight</text><rect x="40" y="1264" width="820" height="92" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="65" y="1322" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">Over 70 lb: independent of the box</text><text x="40" y="1420" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">A plain lighting box fails at any fan weight.</text><text x="40" y="1470" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Fans are not luminaires (314.27(A)).</text></svg>