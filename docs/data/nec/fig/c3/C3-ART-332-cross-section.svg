<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">332 Type MI: what's inside</title><desc id="d">Cutaway of Type MI cable showing a copper or alloy steel sheath, compressed magnesium oxide insulation and solid conductors, plus a listed sealing fitting at the termination, with bend, support and voltage facts.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">332 Type MI: what's inside</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Cutaway and termination — no plastic anywhere</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 332.10, 332.24, 332.30, 332.40</text><text x="40" y="216" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">THE CABLE — a metal tube full of mineral powder</text><rect x="60" y="262" width="500" height="128" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="76" y="278" width="468" height="96" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><rect x="92" y="296" width="436" height="24" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="92" y="334" width="436" height="24" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="560" y="262" width="26" height="128" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="600" y="316" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">sheath</text><text x="600" y="356" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">cut back</text><circle cx="180" cy="262" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="180" y="274" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="300" cy="340" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="300" y="352" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><circle cx="470" cy="308" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="470" y="320" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="40" y="452" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1  Sheath: copper or alloy steel, continuous</text><text x="40" y="496" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">2  Insulation: magnesium oxide, compressed</text><text x="40" y="540" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">3  Conductors: solid copper</text><text x="40" y="640" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">THE TERMINATION — where MI jobs fail</text><rect x="60" y="716" width="300" height="96" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="76" y="730" width="268" height="68" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><rect x="92" y="744" width="236" height="16" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="92" y="770" width="236" height="16" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="360" y="696" width="170" height="136" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="445" y="756" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">SEALING</text><text x="445" y="796" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">POT</text><circle cx="445" cy="696" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="445" y="708" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><line x1="530" y1="744" x2="690" y2="744" stroke="#264387" stroke-width="10"/><line x1="530" y1="786" x2="690" y2="786" stroke="#264387" stroke-width="10"/><rect x="690" y="690" width="160" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="770" y="776" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">BOX</text><text x="40" y="896" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">4  Listed sealing fitting — seal goes on the moment</text><text x="40" y="940" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">    the sheath is stripped (332.40).</text><rect x="40" y="986" width="820" height="84" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1040" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">End left open = damp mineral = failed circuit</text><rect x="40" y="1100" width="260" height="196" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="170" y="1146" font-size="34" font-weight="900" fill="#264387" text-anchor="middle">BENDS</text><text x="170" y="1192" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">Inside radius</text><text x="170" y="1230" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">≥ 5× OD</text><text x="170" y="1268" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">10× over 3/4</text><rect x="320" y="1100" width="260" height="196" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="1146" font-size="34" font-weight="900" fill="#264387" text-anchor="middle">SUPPORTS</text><text x="450" y="1192" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">Max spacing</text><text x="450" y="1230" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">6 ft</text><text x="450" y="1268" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">332.30</text><rect x="600" y="1100" width="260" height="196" rx="14" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="730" y="1146" font-size="34" font-weight="900" fill="#264387" text-anchor="middle">RATING</text><text x="730" y="1192" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">Circuits up to</text><text x="730" y="1230" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">600 V</text><text x="730" y="1268" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">332.10</text></svg>