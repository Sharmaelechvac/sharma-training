" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="228" cy="306" r="18" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="228" y="314" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><line x1="210" y1="396" x2="210" y2="742" stroke="#1a2f61" stroke-width="2"/><line x1="320" y1="396" x2="320" y2="742" stroke="#1a2f61" stroke-width="2"/><line x1="210" y1="730" x2="320" y2="730" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="265.0" y="718" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">within 3 ft of box</text><text x="265.0" y="718" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">within 3 ft of box</text><line x1="320" y1="396" x2="320" y2="832" stroke="#1a2f61" stroke-width="2"/><line x1="620" y1="396" x2="620" y2="832" stroke="#1a2f61" stroke-width="2"/><line x1="320" y1="820" x2="620" y2="820" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="470.0" y="808" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">10 ft max between straps</text><text x="470.0" y="808" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">10 ft max between straps</text><text x="40" y="925" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">1 Compression coupling: listed, tight</text><text x="40" y="971" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">2 Strap within 3 ft, then every 10 ft</text><text x="40" y="1017" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">3 90 deg bend - EMT is never threaded</text><text x="40" y="1063" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">4 Connector: tube is the ground path</text><rect x="40" y="1130" width="820" height="84" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="64" y="1185" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">Wet location: fittings per 314.15</text></svg>