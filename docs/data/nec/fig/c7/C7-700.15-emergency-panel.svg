RE ALARM</text><text x="512" y="689" font-size="44" font-weight="800" fill="#2e7d32" text-anchor="end">✓</text><rect x="95" y="756" width="54" height="50" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="122" y="792" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">9</text><text x="170" y="792" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">SPARE — EMPTY</text><text x="512" y="792" font-size="36" font-weight="800" fill="#5b6478" text-anchor="end">—</text><text x="95" y="962" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Every load is a life-safety load</text><rect x="580" y="210" width="260" height="470" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="605" y="264" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NEVER ON</text><text x="605" y="308" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">THIS PANEL</text><text x="605" y="388" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">✗</text><text x="645" y="388" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Receptacles</text><text x="605" y="454" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">✗</text><text x="645" y="454" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Office lights</text><text x="605" y="520" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">✗</text><text x="645" y="520" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Coffee maker</text><text x="605" y="586" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">✗</text><text x="645" y="586" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Comfort HVAC</text><line x1="710" y1="680" x2="710" y2="716" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="580" y="724" width="260" height="286" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x=