<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Fire-Resistive Cable Systems</title><desc id="d">Elevation of a circuit-integrity feeder run installed as one listed system: listed cable in the raceway named by the system, supports at the listed spacing, a listed splice kit, feeding a life safety panel, with a warning that one field substitution voids the rating.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Fire-Resistive Cable Systems</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The rating lives in the whole listed system (FHIT)</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 728; 700.10(D)</text><rect x="40" y="205" width="820" height="26" rx="0" fill="#c9d2e3" stroke="#264387" stroke-width="4"/><text x="48" y="196" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">CEILING</text><line x1="180" y1="231" x2="180" y2="398" stroke="#264387" stroke-width="4"/><rect x="164" y="392" width="32" height="66" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><line x1="380" y1="231" x2="380" y2="398" stroke="#264387" stroke-width="4"/><rect x="364" y="392" width="32" height="66" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><line x1="580" y1="231" x2="580" y2="398" stroke="#264387" stroke-width="4"/><rect x="564" y="392" width="32" height="66" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><line x1="80" y1="400" x2="700" y2="400" stroke="#264387" stroke-width="5"/><line x1="80" y1="450" x2="700" y2="450" stroke="#264387" stroke-width="5"/><line x1="88" y1="425" x2="692" y2="425" stroke="#F0A846" stroke-width="4" stroke-dasharray="14 10"/><line x1="650" y1="400" x2="650" y2="660" stroke="#264387" stroke-width="5"/><line x1="700" y1="400" x2="700" y2="660" stroke="#264387" stroke-width="5"/><line x1="675" y1="408" x2="675" y2="652" stroke="#F0A846" stroke-width="4" stroke-dasharray="14 10"/><rect x="438" y="384" width="96" height="82" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="585" y="660" width="180" height="180" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="675" y="735" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LIFE SAFETY</text><text x="675" y="782" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><rect x="120" y="524" width="275" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="257.5" y="562" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2-HOUR RATING</text><text x="120" y="610" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">UL 2196 system (FHIT)</text><circle cx="150" cy="425" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="150" y="437" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="300" cy="492" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="300" y="504" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><line x1="300" y1="465" x2="300" y2="452" stroke="#1a2f61" stroke-width="3"/><circle cx="380" cy="300" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="380" y="312" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="486" cy="330" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="486" y="342" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><line x1="486" y1="357" x2="486" y2="382" stroke="#1a2f61" stroke-width="3"/><text x="60" y="950" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">WHAT THE LISTING FIXES</text><text x="60" y="1005" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  Listed circuit-integrity cable</text><text x="60" y="1051" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  Raceway named in the system</text><text x="60" y="1097" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  Supports at the listed spacing</text><text x="60" y="1143" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4  Listed splice kit — no substitutes</text><rect x="40" y="1230" width="820" height="190" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1295" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">ONE SWAPPED PART = NO RATING</text><text x="450" y="1350" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">An unlisted coupling, wrong supports or a</text><text x="450" y="1394" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">standard splice kit voids the 2-hour rating.</text></svg>