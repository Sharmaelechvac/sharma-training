font-weight="600" fill="#5b6478" text-anchor="middle">En el extremo opuesto</text><rect x="460" y="200" width="400" height="700" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="490" y="258" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">EL CÁLCULO</text><text x="490" y="320" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Barras: 200 A</text><text x="490" y="366" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">120% × 200 A = 240 A</text><text x="490" y="412" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">240 A − principal de 200 A</text><text x="490" y="458" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">= 40 A de margen</text><text x="490" y="504" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">40 A ÷ 125% = 32 A</text><text x="490" y="550" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">salida máx. del inversor</text><text x="490" y="596" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Interruptor: 40 A</text><text x="490" y="642" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">en el extremo lejano</text><text x="490" y="730" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">No lo reubique</text><text x="490" y="770" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">este interruptor.</text><rect x="40" y="950" width="820" height="200" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="70" y="1010" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">LADO DE SUMINISTRO — 705.11</text><text x="70" y="1062" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Derivación antes de la desconexión principal.</text><text x="70" y="1106" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Sin cálculo de barras; rigen reglas de acometida.</text></svg>