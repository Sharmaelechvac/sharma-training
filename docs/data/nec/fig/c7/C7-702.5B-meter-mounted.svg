<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Meter-mounted transfer switch</title><desc id="d">Elevation of a meter stack: utility conductors enter a utility meter, below it a gold band marked listed meter-mounted transfer switch, then the meter enclosure and house panel. A generator connects at the switch. The switch is manual unless rated for automatic duty. Bottom rows show Article 702 permits the device while Articles 700 and 701 do not.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1600" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Meter-mounted transfer switch</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">702.5(B) — optional standby systems only</text><line x1="30" y1="1542" x2="870" y2="1542" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1580" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.5(B), 702.4(B)(2)</text><line x1="350" y1="150" x2="350" y2="250" stroke="#1f2937" stroke-width="5"/><line x1="490" y1="150" x2="490" y2="250" stroke="#1f2937" stroke-width="5"/><text x="110" y="200" font-size="32" font-weight="900" fill="#5b6478" text-anchor="start">UTILITY</text><rect x="280" y="250" width="280" height="270" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="5"/><circle cx="420" cy="350" r="62" fill="#ffffff" stroke="#1a2f61" stroke-width="5"/><text x="420" y="366" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">M</text><text x="420" y="478" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">UTILITY METER</text><rect x="200" y="520" width="440" height="130" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="420" y="572" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">TRANSFER SWITCH</text><text x="420" y="614" font-size="30" font-weight="800" fill="#1f2937" text-anchor="middle">LISTED · METER-MOUNTED</text><rect x="260" y="650" width="320" height="120" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="420" y="700" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">METER ENCLOSURE</text><text x="420" y="738" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">service equipment</text><line x1="420" y1="770" x2="420" y2="850" stroke="#1f2937" stroke-width="5"/><rect x="290" y="850" width="260" height="120" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="420" y="922" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">HOUSE PANEL</text><rect x="680" y="520" width="200" height="130" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="780" y="600" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">GENERATOR</text><line x1="640" y1="585" x2="680" y2="585" stroke="#1f2937" stroke-width="5"/><rect x="40" y="1010" width="820" height="100" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1052" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">MANUAL TRANSFER</text><text x="450" y="1092" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">unless rated per 702.4(B)(2) for automatic duty</text><rect x="40" y="1150" width="820" height="92" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="70" y="1210" font-size="32" font-weight="900" fill="#1f2937" text-anchor="start">✓ 702 OPTIONAL STANDBY — PERMITTED</text><rect x="40" y="1274" width="820" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="1334" font-size="32" font-weight="900" fill="#1f2937" text-anchor="start">✗ 700 EMERGENCY — NOT PERMITTED</text><rect x="40" y="1398" width="820" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="1458" font-size="32" font-weight="900" fill="#1f2937" text-anchor="start">✗ 701 LEGALLY REQUIRED — NOT PERMITTED</text></svg>