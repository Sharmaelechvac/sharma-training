<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">702.4(B)(2): the two duties</title><desc id="d">Comparison of the two duties under 702.4(B)(2) on a worked example. Full load: calculated load 24 kW, source 24 kW, nothing shed. Load management: connected loads 24 kW, the management system caps the connected load at 16 kW by shedding the second air conditioner and range, and a 20 kW source carries it.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">702.4(B)(2): the two duties</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Automatic transfer — sized to the calculated load.</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.4(B)(2), 220.87, Article 220</text><rect x="50" y="200" width="385" height="850" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="50" y="200" width="385" height="84" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="50" y="240" width="385" height="44" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="242" y="258" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">FULL LOAD</text><text x="78" y="346" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Calculated load</text><rect x="78" y="360" width="319" height="54" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="385" y="400" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="end">24 kW</text><text x="78" y="486" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Source</text><rect x="78" y="500" width="319" height="54" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="385" y="540" font-size="32" font-weight="900" fill="#ffffff" text-anchor="end">24 kW</text><text x="78" y="660" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">The switch connects</text><text x="78" y="704" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">everything — so the</text><text x="78" y="748" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">source carries</text><text x="78" y="792" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">everything.</text><text x="78" y="836" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="78" y="880" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Nothing is shed.</text><text x="78" y="924" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Nothing is managed.</text><rect x="465" y="200" width="385" height="850" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="465" y="200" width="385" height="84" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="465" y="240" width="385" height="44" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="657" y="258" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">LOAD MANAGEMENT</text><text x="493" y="346" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Connected loads</text><rect x="493" y="360" width="319" height="54" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="800" y="400" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="end">24 kW</text><text x="493" y="486" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Cap set by system</text><rect x="493" y="500" width="212" height="54" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="693" y="540" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="end">16 kW</text><text x="493" y="626" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Source</text><rect x="493" y="640" width="266" height="54" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="747" y="680" font-size="32" font-weight="900" fill="#ffffff" text-anchor="end">20 kW</text><text x="493" y="800" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Equipment sheds the</text><text x="493" y="844" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2nd AC and the range.</text><text x="493" y="888" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="493" y="932" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">The source carries</text><text x="493" y="976" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">the cap — not the</text><text x="493" y="1020" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">wish list.</text><rect x="50" y="1130" width="800" height="110" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="1178" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">Existing installation? Recorded maximum demand</text><text x="450" y="1222" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">is an approved route to the load — 220.87</text></svg>