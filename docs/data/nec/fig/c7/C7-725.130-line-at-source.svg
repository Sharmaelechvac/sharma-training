<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">725.130: The line is at the source</title><desc id="d">Two-part diagram. Top: a 120 volt panel feed runs in a Chapter 3 raceway to a listed Class 2 source; on the load side of the source a CL2 cable runs without raceway to a thermostat and controls. A gold dashed line at the source marks where the wiring methods change. Bottom: the cable tier ladder — plenum CL2P/CL3P over riser CL2R/CL3R over general CL2/CL3/PLTC over limited-use CL2X/CL3X — with substitution running downhill only.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">725.130: The line is at the source</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Full methods up to it; cable methods after it.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 725.130, 725.121, 725.154</text><rect x="50" y="250" width="180" height="200" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="140" y="330" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">PANEL</text><text x="140" y="375" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">120 V FEED</text><line x1="230" y1="320" x2="370" y2="320" stroke="#1f2937" stroke-width="8"/><line x1="230" y1="380" x2="370" y2="380" stroke="#1f2937" stroke-width="8"/><rect x="370" y="240" width="220" height="220" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="480" y="310" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">LISTED</text><text x="480" y="352" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CLASS 2</text><text x="480" y="394" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">SOURCE</text><text x="480" y="436" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">725.121</text><line x1="480" y1="200" x2="480" y2="540" stroke="#F0A846" stroke-width="5" stroke-dasharray="14 10"/><text x="480" y="580" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">THE LINE IS AT THE SOURCE</text><path d="M 590 350 C 660 300, 700 400, 770 350" stroke="#F0A846" stroke-width="6" fill="none"/><circle cx="795" cy="350" r="55" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="795" y="340" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">STAT</text><text x="795" y="378" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">+ CTRL</text><text x="270" y="655" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">SUPPLY SIDE</text><text x="270" y="697" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">CHAPTER 3 — IN RACEWAY</text><text x="700" y="655" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">LOAD SIDE</text><text x="700" y="697" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">725.130 METHODS</text><text x="50" y="795" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">CABLE TIERS — HIGHEST AT TOP:</text><text x="50" y="840" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Higher tier replaces lower — never the reverse.</text><rect x="120" y="875" width="560" height="92" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="150" y="935" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PLENUM</text><text x="650" y="935" font-size="36" font-weight="800" fill="#1f2937" text-anchor="end">CL2P / CL3P</text><rect x="120" y="993" width="560" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="150" y="1053" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">RISER</text><text x="650" y="1053" font-size="36" font-weight="800" fill="#1f2937" text-anchor="end">CL2R / CL3R</text><rect x="120" y="1111" width="560" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="150" y="1171" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">GENERAL</text><text x="650" y="1171" font-size="36" font-weight="800" fill="#1f2937" text-anchor="end">CL2 / CL3 / PLTC</text><rect x="120" y="1229" width="560" height="92" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="4"/><text x="150" y="1289" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">LIMITED USE</text><text x="650" y="1289" font-size="36" font-weight="800" fill="#1f2937" text-anchor="end">CL2X / CL3X</text><line x1="745" y1="885" x2="745" y2="1320" stroke="#2e7d32" stroke-width="6" marker-end="url(#ah)"/><text x="795" y="1110" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="end">OK</text><line x1="830" y1="1320" x2="830" y2="885" stroke="#c0392b" stroke-width="6" marker-end="url(#ah)"/><line x1="800" y1="1070" x2="860" y2="1130" stroke="#c0392b" stroke-width="8"/><line x1="860" y1="1070" x2="800" y2="1130" stroke="#c0392b" stroke-width="8"/><text x="880" y="1395" font-size="34" font-weight="800" fill="#c0392b" text-anchor="end">NEVER UP</text></svg>