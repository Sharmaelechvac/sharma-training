<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">700.32 — selective coordination</title><desc id="d">One-line diagram of an emergency distribution system: source, emergency main, feeder device and branch device in series feeding one egress lighting branch with a fault at the load. The main and feeder devices are marked STAYS CLOSED, the branch device is marked OPENS. Below, a coordinated versus not coordinated comparison.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">700.32 — selective coordination</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A branch fault opens one device only</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 700.32</text><text x="870" y="1440" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="196" width="400" height="84" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="260" y="232" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">EMERGENCY SOURCE</text><text x="260" y="268" font-size="30" font-weight="800" fill="#F0A846" text-anchor="middle">generator · ATS</text><line x1="260" y1="280" x2="260" y2="330" stroke="#1f2937" stroke-width="5"/><rect x="60" y="330" width="400" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="260" y="374" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">EMERGENCY MAIN</text><text x="260" y="412" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">supply-side device</text><line x1="260" y1="434" x2="260" y2="500" stroke="#1f2937" stroke-width="5"/><rect x="60" y="500" width="400" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="260" y="544" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">FEEDER DEVICE</text><text x="260" y="582" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">supply-side device</text><line x1="260" y1="604" x2="260" y2="670" stroke="#1f2937" stroke-width="5"/><rect x="60" y="670" width="400" height="104" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="260" y="714" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">BRANCH DEVICE</text><text x="260" y="752" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">protects this branch</text><line x1="260" y1="774" x2="260" y2="840" stroke="#1f2937" stroke-width="5"/><rect x="60" y="840" width="400" height="104" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="260" y="884" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">EGRESS LIGHTING</text><text x="260" y="922" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">one branch circuit</text><path d="M428,856 l-26,34 h20 l-16,30" stroke="#c0392b" stroke-width="6" fill="none"/><text x="492" y="900" font-size="32" font-weight="900" fill="#c0392b" text-anchor="start">FAULT</text><rect x="500" y="362" width="243" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="621.5" y="398" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">STAYS CLOSED</text><rect x="500" y="532" width="243" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="621.5" y="568" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">STAYS CLOSED</text><rect x="500" y="702" width="117" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="558.5" y="738" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OPENS</text><line x1="460" y1="382" x2="492" y2="382" stroke="#c9d2e3" stroke-width="3"/><line x1="460" y1="552" x2="492" y2="552" stroke="#c9d2e3" stroke-width="3"/><line x1="460" y1="722" x2="492" y2="722" stroke="#c9d2e3" stroke-width="3"/><rect x="30" y="1030" width="405" height="300" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="232" y="1088" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="middle">✓ COORDINATED</text><text x="232" y="1148" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">Only the branch</text><text x="232" y="1188" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">device opens.</text><text x="232" y="1228" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">Feeder and main</text><text x="232" y="1268" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">stay closed — the rest</text><text x="232" y="1308" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">of the system stays live.</text><rect x="465" y="1030" width="405" height="300" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="667" y="1088" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">✗ NOT COORDINATED</text><text x="667" y="1148" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">The feeder or main</text><text x="667" y="1188" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">opens for a branch</text><text x="667" y="1228" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">fault — the whole</text><text x="667" y="1268" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">emergency system</text><text x="667" y="1308" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">goes dark.</text></svg>