<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Manual transfer: the load list</title><desc id="d">A standby panel load list: refrigerator 200 VA, well pump 1,800 VA, lights 900 VA, microwave 1,500 VA and TV plus network 300 VA are checked on the list for a 4,700 VA selected total; the range and dryer are crossed off the list; a 6,500 W portable source covers the list.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Manual transfer: the load list</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The source carries the list, all at once</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.4(B)(1), 702.4(B)(2)</text><rect x="70" y="205" width="500" height="650" rx="12" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="95" y="262" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="start">INTENDED LOADS — THE LIST</text><circle cx="125" cy="318" r="21" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="125" y="329" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">✓</text><text x="165" y="330" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Refrigerator — 200 VA</text><circle cx="125" cy="390" r="21" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="125" y="401" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">✓</text><text x="165" y="402" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Well pump — 1,800 VA</text><circle cx="125" cy="462" r="21" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="125" y="473" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">✓</text><text x="165" y="474" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Lights — 900 VA</text><circle cx="125" cy="534" r="21" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="125" y="545" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">✓</text><text x="165" y="546" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Microwave — 1,500 VA</text><circle cx="125" cy="606" r="21" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="125" y="617" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">✓</text><text x="165" y="618" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">TV + network — 300 VA</text><circle cx="125" cy="678" r="21" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="125" y="689" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">✗</text><text x="165" y="690" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Range — NOT ON LIST</text><circle cx="125" cy="750" r="21" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="125" y="761" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">✗</text><text x="165" y="762" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Dryer — NOT ON LIST</text><rect x="600" y="205" width="260" height="185" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="730" y="258" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">SELECTED</text><text x="730" y="322" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">4,700 VA</text><text x="730" y="362" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">all at once</text><rect x="600" y="425" width="260" height="185" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="730" y="478" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">SOURCE</text><text x="730" y="542" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">6,500 W</text><text x="730" y="582" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">portable unit</text><rect x="600" y="645" width="260" height="210" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="730" y="700" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">List goes in</text><text x="730" y="737" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">the job record</text><text x="730" y="774" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">— owner and</text><text x="730" y="811" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">next tech both</text><text x="730" y="848" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">read the deal</text><rect x="60" y="920" width="780" height="72" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="968" font-size="33" font-weight="900" fill="#c0392b" text-anchor="middle">NOT ON THE LIST = NOT PROMISED</text></svg>