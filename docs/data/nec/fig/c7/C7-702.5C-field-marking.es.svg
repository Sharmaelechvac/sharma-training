<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Marque la capacidad en el exterior</title><desc id="d">Elevación de un gabinete de interruptor de transferencia con una etiqueta dorada de marcado en campo en la cara exterior que dice Capacidad de Cortocircuito 22,000 A, una vista ampliada del marcado, y una franja de advertencia: no dentro de la puerta, y no es la capacidad en amperios.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Marque la capacidad en el exterior</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Equipo de transferencia no residencial — 702.5(C)</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.5(C)</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="80" y="230" width="360" height="640" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="105" y="255" width="310" height="590" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><rect x="140" y="330" width="240" height="170" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="260" y="380" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">SCCR</text><text x="260" y="420" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">CAPACIDAD</text><text x="260" y="476" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">22,000 A</text><text x="248" y="586" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">INT. TRANSFER.</text><text x="248" y="628" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">200 A</text><rect x="394" y="540" width="16" height="90" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="380" y1="415" x2="540" y2="415" stroke="#1a2f61" stroke-width="3"/><circle cx="380" cy="415" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="540" y="280" width="300" height="340" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="540" y="280" width="300" height="60" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="690" y="320" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">MARCADO CAMPO</text><text x="565" y="396" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Cortocircuito</text><text x="565" y="432" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">SCCR: 22,000 A</text><text x="565" y="524" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Duradero, en el</text><text x="565" y="560" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">cara exterior</text><rect x="80" y="960" width="760" height="150" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="460" y="1024" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">✗ No dentro de la puerta</text><text x="460" y="1076" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">✗ No la capacidad en amperios — el SCCR</text></svg>