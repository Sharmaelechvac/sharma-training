<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Nunca interconectado</title><desc id="d">Red y generador alimentando un interruptor de transferencia listado antes del tablero, con verificaciones de posición del interruptor y la falla de retroalimentación que la regla evita.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Nunca interconectado</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">702.5(D): las fuentes nunca pueden unirse</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.5(D)</text><text x="870" y="1460" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="40" y="220" width="260" height="110" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="170" y="268" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">RED PÚBLICA</text><text x="170" y="312" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">ACOMETIDA</text><rect x="40" y="500" width="260" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="170" y="548" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERADOR</text><text x="170" y="592" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">FUENTE DE RESERVA</text><rect x="380" y="310" width="220" height="160" rx="0" fill="#1a2f61" stroke="#F0A846" stroke-width="5"/><text x="490" y="368" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">TRANSFER.</text><text x="490" y="412" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">INT.</text><text x="490" y="446" font-size="30" font-weight="700" fill="#F0A846" text-anchor="middle">LISTADO</text><rect x="680" y="310" width="180" height="160" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="770" y="378" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="770" y="422" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><line x1="300" y1="275" x2="380" y2="350" stroke="#1f2937" stroke-width="4"/><line x1="300" y1="555" x2="380" y2="430" stroke="#1f2937" stroke-width="4"/><line x1="600" y1="390" x2="680" y2="390" stroke="#1f2937" stroke-width="4"/><rect x="297.0" y="621" width="386" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="490.0" y="657" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">UNA FUENTE A LA VEZ</text><text x="40" y="745" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">CADA POSICIÓN DEL INT.:</text><rect x="40" y="781" width="171" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="125.5" y="817" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">NORMAL ✓</text><rect x="325" y="781" width="243" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="446.5" y="817" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">A MITAD ✓</text><rect x="610" y="781" width="225" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="722.5" y="817" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">GENERADOR ✓</text><text x="40" y="883" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">LAS FUENTES AÚN NO PUEDEN UNIRSE</text><rect x="40" y="920" width="820" height="370" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="70" y="980" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">EL FALLO QUE ESTO EVITA</text><text x="70" y="1050" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Sin transferencia: la energía del generador</text><text x="70" y="1098" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">de vuelta por la acometida y el transformador,</text><text x="70" y="1146" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">y energiza una línea de la red a miles</text><text x="70" y="1194" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">de voltios — una línea que la cuadrilla cree muerta.</text><text x="70" y="1252" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">ESO ES RETROALIMENTACIÓN. MATA LINIEROS.</text></svg>