<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1320" width="900" height="1320" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Power inlets at 100 A and up</title><desc id="d">Wall elevation with a listed 100 A power inlet beside an interlocked disconnect, the interlock link drawn between them, and a portable generator cordset staged below.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1320" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Power inlets at 100 A and up</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Listed gear, interlocked disconnect.</text><line x1="30" y1="1262" x2="870" y2="1262" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1300" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.12(C)</text><text x="870" y="1300" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="200" width="780" height="540" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="90" y="252" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">BUILDING WALL — OUTSIDE</text><line x1="410" y1="305" x2="490" y2="305" stroke="#F0A846" stroke-width="6" stroke-dasharray="12 8"/><text x="450" y="290" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERLOCK</text><rect x="110" y="330" width="300" height="250" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="260" y="392" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">POWER INLET</text><text x="260" y="452" font-size="44" font-weight="800" fill="#1a2f61" text-anchor="middle">100 A</text><rect x="192.5" y="486" width="135" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="260.0" y="522" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">LISTED</text><rect x="490" y="330" width="300" height="250" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="640" y="392" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><text x="640" y="452" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERLOCKED</text><rect x="500.0" y="623" width="280" height="48" rx="24" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="640.0" y="657" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">ONE SAFE WAY IN</text><path d="M260,580 C260,700 220,770 220,850" stroke="#1f2937" stroke-width="5" fill="none"/><rect x="80" y="850" width="400" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="280" y="905" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">PORTABLE GENERATOR</text><text x="280" y="948" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">CORDSET CAPPED</text><text x="450" y="1040" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">The inlet itself may serve as the disconnect</text><text x="450" y="1082" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">where it is rated for that duty.</text><text x="450" y="1150" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">Below 100 A? 702.12(A) and (B) govern instead.</text></svg>