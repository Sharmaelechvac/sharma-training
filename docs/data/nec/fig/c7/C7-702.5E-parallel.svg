<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">702.5(E) Running in parallel?</title><desc id="d">Decision flow: a standby source with transfer equipment; if it never runs in parallel, Article 702 alone applies; if it runs alongside the utility, Article 705 applies too.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">702.5(E) Running in parallel?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">One question: alongside, or instead of?</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.5(E), Article 705</text><rect x="160" y="205" width="580" height="115" rx="10" fill="#264387" stroke="#264387" stroke-width="4"/><text x="450" y="255" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">STANDBY SOURCE</text><text x="450" y="295" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">with transfer equipment</text><line x1="450" y1="320" x2="450" y2="375" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="105" y="380" width="690" height="135" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="440" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">WILL IT OPERATE IN PARALLEL</text><text x="450" y="482" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">WITH THE UTILITY?</text><line x1="450" y1="515" x2="450" y2="610" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="525" y="543" width="61" height="48" rx="24" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="555.5" y="577" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">NO</text><rect x="60" y="615" width="780" height="165" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="90" y="672" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">702 ONLY — THE TRANSFER RULES</text><text x="90" y="716" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">the source replaces the utility</text><text x="90" y="758" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">and is never connected with it</text><line x1="450" y1="780" x2="450" y2="850" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="525" y="790" width="78" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="564.0" y="824" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">YES</text><rect x="60" y="855" width="780" height="185" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="90" y="912" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">702 + 705 — BOTH ARTICLES APPLY</text><text x="90" y="956" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Article 705 interconnection rules join</text><text x="90" y="998" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">the transfer rules on the job</text><text x="450" y="1130" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Ask it on every generator quote.</text></svg>