<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Iguale la capacidad de falla</title><desc id="d">Diagrama unifilar: acometida marcada con 22,000 A de corriente de falla disponible alimentando un interruptor de transferencia de 200 A cuya capacidad de cortocircuito debe igualarla o superarla, con una entrada de generador y un tablero de reserva; un interruptor de 10,000 A se rechaza y uno de 22,000 A se acepta.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Iguale la capacidad de falla</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Unifilar de acometida de 200 A — NEC 702.4(A)</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.4(A), 110.24</text><text x="870" y="1500" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="190" y="200" width="340" height="92" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="360" y="258" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">ACOMETIDA RED</text><line x1="360" y1="292" x2="360" y2="350" stroke="#1f2937" stroke-width="4"/><rect x="140" y="350" width="440" height="170" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="360" y="400" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">ACOMETIDA · 200 A</text><text x="360" y="452" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">CORRIENTE DE FALLA</text><text x="360" y="502" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">22,000 A</text><line x1="360" y1="520" x2="360" y2="580" stroke="#1f2937" stroke-width="4"/><rect x="120" y="580" width="480" height="210" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="120" y="580" width="480" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="360" y="622" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">INT. TRANSFER. · 200 A</text><text x="360" y="706" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Capacidad en amperios: 200 A ✓</text><text x="360" y="762" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">SCCR: debe ser ≥ 22,000 A</text><rect x="640" y="600" width="228" height="120" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="754" y="652" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERADOR</text><text x="754" y="694" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">fuente de reserva</text><line x1="600" y1="660" x2="640" y2="660" stroke="#1f2937" stroke-width="4"/><line x1="360" y1="790" x2="360" y2="880" stroke="#1f2937" stroke-width="4"/><rect x="160" y="880" width="400" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="360" y="930" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO RESERVA</text><text x="360" y="972" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">lado de carga</text><rect x="60" y="1080" width="380" height="170" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="250" y="1150" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">✗ SCCR 10,000 A</text><text x="250" y="1204" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">RECHACE — bajo la AFC</text><rect x="460" y="1080" width="380" height="170" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="650" y="1150" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">✓ SCCR 22,000 A</text><text x="650" y="1204" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">ACEPTE — iguala la AFC</text><text x="450" y="1336" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Los amperios llevan la carga. El SCCR sobrevive a la falla.</text></svg>