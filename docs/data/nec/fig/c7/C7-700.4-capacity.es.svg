<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">700.4 Capacidad de emergencia</title><desc id="d">Diagrama unifilar: red y generador alimentando equipo de transferencia y un tablero de emergencia, sobre una lista de verificación de capacidad de cuatro pasos y un ejemplo resuelto con un total de 7.8 kVA.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">700.4 Capacidad de emergencia</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Toda carga de emergencia, funcionando a la vez</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 700.4, Article 220</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="35" y="210" width="280" height="96" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="175" y="252" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">RED PÚBLICA</text><text x="175" y="288" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">fuente normal</text><rect x="585" y="210" width="280" height="96" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="725" y="252" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERADOR</text><text x="725" y="288" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">fuente emergencia</text><line x1="175" y1="306" x2="175" y2="385" stroke="#1f2937" stroke-width="4"/><line x1="725" y1="306" x2="725" y2="385" stroke="#1f2937" stroke-width="4"/><line x1="175" y1="385" x2="725" y2="385" stroke="#1f2937" stroke-width="4"/><line x1="450" y1="385" x2="450" y2="425" stroke="#1f2937" stroke-width="4"/><rect x="270" y="425" width="360" height="92" rx="10" fill="#264387" stroke="#264387" stroke-width="4"/><text x="450" y="468" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">TRANSFER.</text><text x="450" y="503" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">EQUIPO</text><line x1="450" y1="517" x2="450" y2="552" stroke="#1f2937" stroke-width="4"/><rect x="285" y="552" width="330" height="96" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="594" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO EMERG.</text><text x="450" y="630" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">cargas de emergencia</text><text x="40" y="724" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">LA VERIFICACIÓN DE CAPACIDAD</text><rect x="40" y="750" width="820" height="118" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="105" cy="809" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="105" y="821" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="165" y="802" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">Enumere toda carga de emergencia</text><text x="165" y="844" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">letreros, luces de evacuación, alarma</text><rect x="40" y="898" width="820" height="118" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="105" cy="957" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="105" y="969" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="165" y="950" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">Sume las cargas que funcionan juntas</text><text x="165" y="992" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Artículo 220 o método aprobado por la AHJ</text><rect x="40" y="1046" width="820" height="118" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="105" cy="1105" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="105" y="1117" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="165" y="1098" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">Verifique la idoneidad ante la falla</text><text x="165" y="1140" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">equipo clasificado para la corriente de falla</text><rect x="40" y="1194" width="820" height="118" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="105" cy="1253" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="105" y="1265" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="165" y="1246" font-size="34" font-weight="800" fill="#1f2937" text-anchor="start">Sin atajos para elegir cargas</text><text x="165" y="1288" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">ese atajo pertenece al 702</text><rect x="90" y="1352" width="720" height="86" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1407" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">Ejemplo: 6.4 + 0.5 + 0.9 = 7.8 kVA</text></svg>