<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">705.20: one disconnect per source</title><desc id="d">One-line diagram: a PV inverter and a battery inverter, each with its own disconnect switch shown open, feeding one panelboard. Markers flag the disconnects, the both-sides-energized warning, and the locked or tool-open cover.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">705.20: one disconnect per source</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Every source separates from the others</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 705.20, 705.10</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="200" width="350" height="110" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="235" y="248" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">PV INVERTER</text><text x="235" y="290" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">source 1</text><line x1="235" y1="310" x2="235" y2="380" stroke="#1f2937" stroke-width="5"/><rect x="120" y="380" width="230" height="150" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="180" cy="470" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="290" cy="470" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="180" y1="470" x2="273" y2="408" stroke="#1a2f61" stroke-width="6"/><line x1="235" y1="530" x2="235" y2="690" stroke="#1f2937" stroke-width="5"/><rect x="133" y="536" width="204" height="42" rx="0" fill="#ffffff" stroke="none" stroke-width="3"/><text x="235" y="562" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><rect x="185.5" y="594" width="99" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="235.0" y="630" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OPEN</text><rect x="490" y="200" width="350" height="110" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="665" y="248" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">BATTERY INVERTER</text><text x="665" y="290" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">source 2</text><line x1="665" y1="310" x2="665" y2="380" stroke="#1f2937" stroke-width="5"/><rect x="550" y="380" width="230" height="150" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="610" cy="470" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="720" cy="470" r="8" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="610" y1="470" x2="703" y2="408" stroke="#1a2f61" stroke-width="6"/><line x1="665" y1="530" x2="665" y2="690" stroke="#1f2937" stroke-width="5"/><rect x="563" y="536" width="204" height="42" rx="0" fill="#ffffff" stroke="none" stroke-width="3"/><text x="665" y="562" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><rect x="615.5" y="594" width="99" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="665.0" y="630" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OPEN</text><circle cx="120" cy="380" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="120" y="391" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="792" cy="380" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="792" y="391" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><rect x="170" y="690" width="560" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="752" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">PANELBOARD</text><text x="450" y="800" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">utility + both sources land here</text><rect x="200" y="880" width="500" height="66" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="450" y="924" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">BOTH SIDES MAY BE ENERGIZED</text><circle cx="745" cy="913" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="745" y="924" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><rect x="60" y="990" width="780" height="72" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1038" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">OPEN ≠ DEAD — a source can backfeed</text><text x="70" y="1140" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">1  Disconnect for each source (705.20)</text><text x="70" y="1186" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">2  Handle plainly shows OPEN or CLOSED</text><text x="70" y="1232" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">3  Warning where both sides can be live</text><text x="70" y="1278" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">4  Cover locked or tool-open (2020 rule)</text></svg>