<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Fibra en la ruta: lea la chaqueta</title><desc id="d">Dos secciones de canalización: fibra no conductiva que comparte una canalización con conductores de potencia, y fibra conductiva blindada en su propia canalización separada de la potencia.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Fibra en la ruta: lea la chaqueta</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Lea primero la chaqueta: conductivo o no</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 770.133(A), (B); 770.179</text><rect x="50" y="201" width="368" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="234.0" y="237" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">NO CONDUCTIVO — OFN</text><circle cx="240" cy="500" r="155" fill="#eef2f9" stroke="#264387" stroke-width="6"/><circle cx="180" cy="525" r="34" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="300" cy="525" r="34" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="240" cy="600" r="34" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="240" cy="418" r="32" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="240" y="730" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CANALIZ. COMPARTIDA</text><text x="240" y="782" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">COMPARTIR: PERMITIDO</text><rect x="480" y="201" width="314" height="50" rx="25" fill="#fbe9e7" stroke="#fbe9e7" stroke-width="0"/><text x="637.0" y="237" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">CONDUCTIVO — OFC</text><circle cx="565" cy="500" r="98" fill="#eef2f9" stroke="#264387" stroke-width="6"/><circle cx="540" cy="480" r="30" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="595" cy="480" r="30" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="565" cy="545" r="30" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="775" cy="500" r="92" fill="#fdf3e0" stroke="#c0392b" stroke-width="5" stroke-dasharray="12 8"/><circle cx="775" cy="500" r="34" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="665" y="730" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DOS CANALIZACIONES</text><text x="665" y="782" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">SEPARADO O BARRERA</text><rect x="50" y="860" width="800" height="170" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="918" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">EN CAJAS Y TABLEROS</text><text x="450" y="968" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">La fibra no conductiva queda fuera de gabinetes con</text><text x="450" y="1010" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">terminales de potencia — salvo asociación funcional</text><text x="450" y="1120" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">El listado del cable para el espacio aplica (770.179).</text><text x="450" y="1175" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">La fibra abandonada se retira, no se deja en bandeja.</text></svg>