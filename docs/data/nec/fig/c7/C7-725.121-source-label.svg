<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The source is the circuit's papers</title><desc id="d">Close-up of a listed Class 2 power supply label, the four sources 725.121 recognizes with green checks, and an unmarked wall adapter crossed out as not a Class 2 source.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The source is the circuit's papers</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The class begins at the source (725.121)</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 725.121</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><circle cx="120" cy="250" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="120" y="262" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><rect x="190" y="200" width="520" height="250" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="450" y="266" font-size="44" font-weight="800" fill="#264387" text-anchor="middle">LISTED</text><text x="450" y="322" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">CLASS 2 POWER SUPPLY</text><text x="450" y="372" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Marked as the Class 2 source</text><text x="450" y="416" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Listing mark on the equipment</text><text x="40" y="540" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Sources 725.121 recognizes</text><circle cx="70" cy="599" r="20" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="610" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="110" y="610" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Listed Class 2 or Class 3 transformer</text><circle cx="70" cy="674" r="20" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="685" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="110" y="685" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Listed Class 2 or Class 3 power supply</text><circle cx="70" cy="749" r="20" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="760" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="110" y="760" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Other listed equipment marked as source</text><circle cx="70" cy="824" r="20" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="835" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="110" y="835" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Dry-cell battery supplies it names</text><rect x="40" y="930" width="820" height="215" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="990" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">✗ NOT A CLASS 2 SOURCE</text><text x="70" y="1040" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Unmarked wall-wart or random transformer.</text><text x="70" y="1080" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">No listing, no marking:</text><text x="70" y="1120" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">the run is not Class 2.</text><text x="450" y="1210" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Photograph the label for the job record.</text></svg>