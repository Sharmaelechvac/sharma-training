<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1660" width="900" height="1660" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The portable generator hookup</title><desc id="d">House elevation with a portable generator outdoors connected by a cord to a wall inlet, with panels comparing the 15 kW disconnect relief against the over-15 kW disconnect rule.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1660" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The portable generator hookup</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">15 kW is the line for disconnect relief</text><line x1="30" y1="1602" x2="870" y2="1602" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1640" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.11, 445.18, 702.12</text><rect x="50" y="270" width="500" height="410" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><path d="M30,270 L300,180 L570,270" stroke="#1a2f61" stroke-width="6" fill="none"/><text x="300" y="340" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">HOUSE</text><rect x="120" y="400" width="110" height="110" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><line x1="120" y1="455" x2="230" y2="455" stroke="#c0392b" stroke-width="3"/><line x1="175" y1="400" x2="175" y2="510" stroke="#c0392b" stroke-width="3"/><text x="175" y="552" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">WINDOW</text><rect x="400" y="440" width="90" height="240" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="445" y="716" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">DOOR</text><rect x="520" y="470" width="56" height="84" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="500" cy="448" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="500" y="460" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="620" y="520" width="230" height="130" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="735" y="576" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">GENERATOR</text><text x="735" y="620" font-size="30" font-weight="700" fill="#F0A846" text-anchor="middle">12 kW</text><circle cx="640" cy="492" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="640" y="504" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><path d="M620,600 C580,640 600,510 576,512" stroke="#1f2937" stroke-width="4" fill="none"/><line x1="30" y1="680" x2="870" y2="680" stroke="#1a2f61" stroke-width="5"/><circle cx="74" cy="756" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="74" y="768" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="114" y="766" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Power inlet on the outside wall</text><circle cx="74" cy="826" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="74" y="838" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="114" y="836" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Generator outdoors, clear of openings</text><rect x="50" y="890" width="800" height="180" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="78" y="948" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">15 kW OR LESS + FLANGED INLET</text><text x="78" y="1002" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">No additional disconnect required for</text><text x="78" y="1046" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">the generator conductors — 702.11(B).</text><rect x="50" y="1106" width="800" height="226" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="78" y="1164" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">OVER 15 kW OR PERMANENT</text><text x="78" y="1216" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Readily accessible disconnect per 445.18,</text><text x="78" y="1260" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">within sight of the building:</text><line x1="90" y1="1308" x2="810" y2="1308" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="1296" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">within sight: visible, not more than 50 ft</text><text x="450.0" y="1296" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">within sight: visible, not more than 50 ft</text><rect x="50" y="1370" width="800" height="178" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="78" y="1426" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">NOT A CONNECTION METHOD</text><text x="78" y="1480" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Cord through a window to a dryer receptacle</text><text x="78" y="1524" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">is backfeeding, not a hookup.</text></svg>