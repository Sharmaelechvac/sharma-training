"388" font-size="40" font-weight="800" fill="#264387" text-anchor="middle">PACI</text><text x="710" y="428" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">PLFA listado</text><text x="710" y="462" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">fuente de energía</text><circle cx="410" cy="470" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="410" y="482" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="560" cy="310" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="560" y="322" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="470" cy="820" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="470" y="832" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="60" y="770" width="380" height="100" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="250" y="814" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">SOLO ALIMENTA</text><text x="250" y="852" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">NADA MÁS</text><rect x="500" y="770" width="370" height="100" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="685" y="814" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">NUNCA POR UN</text><text x="685" y="852" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">DISPOSITIVO GFCI/AFCI</text><text x="60" y="945" font-size="34" font-weight="800" fill="#264387" text-anchor="start">EL PAQUETE — 760.121(B)</text><text x="60" y="1000" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">1  Interruptor rojo — CIRCUITO DE ALARMA</text><text x="60" y="1046" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">2  Ubicación de la desconexión identificada en la FACU</text><text x="60" y="1092" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">3  Dedicado — este circuito no alimenta nada más</text><text x="60" y="1150" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">Acceso limitado a personal calificado</text><text x="60" y="1196" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">Sin dispositivo GFCI o AFCI en la ruta de suministro</text><text x="450" y="1300" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle" font-style="italic">Una mirada dice: no toque este interruptor.</text></svg>