<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Los tres niveles de reserva</title><desc id="d">Tres niveles apilados: emergencia Artículo 700 arriba, legalmente requerido Artículo 701 en el centro, opcional Artículo 702 abajo, con cargas de ejemplo y la regla clave de cada nivel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Los tres niveles de reserva</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Quién requiere el sistema elige el artículo</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Articles 700, 701, 702 · 700.12</text><rect x="30" y="190" width="840" height="330" rx="14" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="78" cy="248" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="78" y="260" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="122" y="262" font-size="40" font-weight="800" fill="#ffffff" text-anchor="start">EMERGENCIA — ARTÍCULO 700</text><line x1="122" y1="286" x2="838" y2="286" stroke="#1a2f61" stroke-width="3"/><text x="122" y="342" font-size="34" font-weight="600" fill="#ffffff" text-anchor="start">Requerido por ley o agencia gubernamental</text><text x="122" y="396" font-size="34" font-weight="600" fill="#ffffff" text-anchor="start">Iluminación de evacuación · letreros · alarma</text><text x="122" y="450" font-size="34" font-weight="600" fill="#ffffff" text-anchor="start">Energía de vuelta en 10 segundos (700.12)</text><text x="122" y="504" font-size="34" font-weight="600" fill="#ffffff" text-anchor="start">Cableado totalmente separado (700.10)</text><rect x="30" y="560" width="840" height="330" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="78" cy="618" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="78" y="630" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="122" y="632" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">LEGALM. REQUERIDO — ART. 701</text><line x1="122" y1="656" x2="838" y2="656" stroke="#264387" stroke-width="3"/><text x="122" y="712" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Requerido por ley, código o la AHJ</text><text x="122" y="766" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Humo · ventilación · aguas residuales</text><text x="122" y="820" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Cargas de apoyo a bomberos y rescate</text><text x="122" y="874" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Supera al 701 en una fuente compartida</text><rect x="30" y="930" width="840" height="330" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><circle cx="78" cy="988" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="78" y="1000" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="122" y="1002" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">OPCIONAL — ARTÍCULO 702</text><line x1="122" y1="1026" x2="838" y2="1026" stroke="#F0A846" stroke-width="3"/><text x="122" y="1082" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Nadie lo requiere — elección del dueño</text><text x="122" y="1136" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Refrigerador · bomba de pozo · algunas luces</text><text x="122" y="1190" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Confort y producto, no seguridad de vida</text><text x="122" y="1244" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Sin tiempo fijo de arranque en el artículo</text></svg>