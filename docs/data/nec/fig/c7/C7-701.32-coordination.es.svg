<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Solo se abre el dispositivo en la falla</title><desc id="d">Diagrama unifilar: fuente de reserva, interruptor de alimentador de 200 A que permanece cerrado, interruptor derivado de 20 A que se abre ante una falla, y las cargas de reserva aún alimentadas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Solo se abre el dispositivo en la falla</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sistemas de reserva legalmente requeridos (701.32)</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 701.32; 700.32</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="255" y="195" width="390" height="88" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="252" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">FUENTE DE RESERVA</text><line x1="450" y1="283" x2="450" y2="355" stroke="#1f2937" stroke-width="5"/><rect x="310" y="355" width="280" height="82" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="408" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">ALIMENT. 200 A</text><text x="615" y="408" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">QUEDA CERRADO</text><line x1="450" y1="437" x2="450" y2="510" stroke="#1f2937" stroke-width="5"/><rect x="310" y="510" width="280" height="82" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="563" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">DERIVADO 20 A</text><text x="615" y="563" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">SE ABRE</text><line x1="450" y1="592" x2="450" y2="700" stroke="#1f2937" stroke-width="5"/><path d="M415,640 L450,672 L432,690 L470,726" stroke="#c0392b" stroke-width="6" fill="none"/><text x="500" y="690" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">FALLA</text><line x1="450" y1="700" x2="450" y2="760" stroke="#1f2937" stroke-width="5"/><line x1="212" y1="760" x2="692" y2="760" stroke="#1f2937" stroke-width="5"/><line x1="212" y1="760" x2="212" y2="800" stroke="#1f2937" stroke-width="5"/><line x1="452" y1="760" x2="452" y2="800" stroke="#1f2937" stroke-width="5"/><line x1="692" y1="760" x2="692" y2="800" stroke="#1f2937" stroke-width="5"/><rect x="100" y="800" width="225" height="88" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="212" y="856" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">LUCES EVAC.</text><rect x="340" y="800" width="225" height="88" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="452" y="856" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">CTRL HUMO</text><rect x="580" y="800" width="225" height="88" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="692" y="856" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL ALARMA</text><rect x="60" y="990" width="780" height="168" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1050" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">La coordinación la selecciona un PE con licencia</text><text x="450" y="1094" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">u otra persona calificada — documentado,</text><text x="450" y="1138" font-size="33" font-weight="700" fill="#1a2f61" text-anchor="middle">y disponibles para inspectores y propietarios.</text><text x="450" y="1245" font-size="33" font-weight="600" fill="#5b6478" text-anchor="middle">Par en serie, sin cargas en paralelo: no se requiere.</text></svg>