<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">760.135: el cable sigue el espacio</title><desc id="d">Tres espacios del edificio con los tipos de cable PLFA que cada uno permite — pleno: solo FPLP; ducto montante: FPLP o FPLR; espacio general: FPLP, FPLR o FPL — junto a una escalera de sustitución que muestra que FPLP reemplaza a FPLR o FPL, FPLR reemplaza a FPL, y la sustitución nunca va hacia arriba.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">760.135: el cable sigue el espacio</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El listado, no el color, decide</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 760.135, Table 760.154</text><rect x="40" y="205" width="480" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="65" y="263" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">ESPACIO PLENO</text><text x="65" y="305" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">pleno del techo (300.22(C))</text><rect x="65" y="313" width="95" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="112.5" y="347" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FPLP</text><rect x="40" y="395" width="480" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="65" y="453" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">DUCTO MONTANTE</text><text x="65" y="495" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">tramo vertical, piso a piso</text><rect x="65" y="503" width="212" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="171.0" y="537" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FPLP · FPLR</text><rect x="40" y="585" width="480" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="65" y="643" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">ESPACIO GENERAL</text><text x="65" y="685" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">ubicaciones ordinarias</text><rect x="65" y="693" width="313" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="221.5" y="727" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FPLP · FPLR · FPL</text><text x="700" y="240" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">SUSTITUCIÓN</text><rect x="615" y="280" width="170" height="84" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="700" y="336" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">FPLP</text><line x1="700" y1="364" x2="700" y2="430" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="800" y="408" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">reemplaza</text><rect x="615" y="430" width="170" height="84" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="700" y="486" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">FPLR</text><line x1="700" y1="514" x2="700" y2="580" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="800" y="558" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">reemplaza</text><rect x="615" y="580" width="170" height="84" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="700" y="636" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">FPL</text><text x="700" y="770" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">nunca hacia arriba</text><rect x="60" y="830" width="780" height="72" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="878" font-size="33" font-weight="900" fill="#c0392b" text-anchor="middle">EL ROJO ES UN COLOR, NO UNA CAPACIDAD</text><text x="70" y="980" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">El sufijo CI = integridad de circuito (FPLR-CI)</text><text x="70" y="1026" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Montante metálico + cortafuegos: FPL bien</text><text x="70" y="1072" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Lea la leyenda de la chaqueta, luego la tabla</text></svg>