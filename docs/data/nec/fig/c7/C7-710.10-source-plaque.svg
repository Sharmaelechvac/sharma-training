<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Stand-Alone Source Plaque</title><desc id="d">Plan of an off-grid property: a house with the plaque at its disconnect, a garage holding the PV inverter and battery disconnects, a PV array, and a detached shed with the generator disconnect, plus a close-up of the plaque itself.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Stand-Alone Source Plaque</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Every source and its disconnect, on one plaque</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 710.10; 705.10</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="240" width="390" height="300" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="84" y="292" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">HOUSE</text><rect x="450" y="290" width="230" height="250" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="474" y="342" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">GARAGE</text><rect x="80" y="620" width="300" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="155" y1="620" x2="155" y2="740" stroke="#c9d2e3" stroke-width="3"/><line x1="230" y1="620" x2="230" y2="740" stroke="#c9d2e3" stroke-width="3"/><line x1="305" y1="620" x2="305" y2="740" stroke="#c9d2e3" stroke-width="3"/><line x1="80" y1="680" x2="380" y2="680" stroke="#c9d2e3" stroke-width="3"/><text x="230" y="700" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PV ARRAY</text><rect x="620" y="620" width="210" height="120" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="725" y="668" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SHED</text><text x="725" y="712" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">GENERATOR</text><circle cx="450" cy="300" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="450" y="312" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="500" cy="470" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="500" y="482" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="610" cy="470" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="610" y="482" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="634" cy="634" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="634" y="646" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="60" y="850" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">WHAT THE PLAQUE MUST ANSWER</text><text x="60" y="905" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  Plaque at the house disconnect</text><text x="60" y="951" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  PV inverter disconnect — garage</text><text x="60" y="997" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  Battery disconnect — garage</text><text x="60" y="1043" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4  Generator disconnect — shed</text><rect x="60" y="1120" width="780" height="260" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="1185" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">CAUTION: MULTIPLE SOURCES OF POWER</text><text x="450" y="1250" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">PV + BATTERY: GARAGE WEST WALL</text><text x="450" y="1294" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">GENERATOR: SHED, AT THE PANEL</text><text x="450" y="1338" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">MAIN DISCONNECT: HOUSE EAST WALL</text></svg>