<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Protection From Both Ends</title><desc id="d">One-line of a panelboard fed by the utility service and by a PV inverter: overcurrent protection at the source output sized at 125 percent of the 32 A nameplate output, the panel marked for multiple sources, and a warning that a breaker marked line and load is not suitable for backfeed.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Protection From Both Ends</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">One panel fed from two sources</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 705.28, 705.30</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="230" width="260" height="115" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="180" y="282" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">UTILITY</text><text x="180" y="326" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">SERVICE</text><line x1="310" y1="287" x2="700" y2="287" stroke="#264387" stroke-width="5"/><line x1="700" y1="287" x2="700" y2="400" stroke="#264387" stroke-width="5"/><rect x="676" y="268" width="48" height="38" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="545" y="400" width="320" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="705" y="478" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PANELBOARD</text><text x="705" y="524" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">MULTIPLE SOURCES</text><rect x="50" y="690" width="260" height="115" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="180" y="742" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PV INVERTER</text><text x="180" y="786" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">32 A OUTPUT</text><line x1="310" y1="747" x2="700" y2="747" stroke="#264387" stroke-width="5"/><line x1="700" y1="747" x2="700" y2="590" stroke="#264387" stroke-width="5"/><rect x="676" y="640" width="48" height="38" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><circle cx="700" cy="700" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="700" y="712" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="512" cy="495" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="512" y="507" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="480" cy="287" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="480" y="299" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="60" y="920" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">THE THREE CHECKS</text><text x="60" y="975" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  Source OCPD: 125% × 32 A = 40 A</text><text x="60" y="1021" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  Panel marked: multiple sources</text><text x="60" y="1067" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  Protection from ALL sources (A)</text><rect x="40" y="1160" width="820" height="170" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1225" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">BREAKER MARKED LINE / LOAD?</text><text x="450" y="1280" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">Not suitable for backfeed — 705.30(D).</text></svg>