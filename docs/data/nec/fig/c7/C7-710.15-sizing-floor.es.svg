<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1160" width="900" height="1160" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">710.15: Dimensione para la carga mayor</title><desc id="d">Gráfico de barras de la prueba de dimensionamiento de 710.15: la carga calculada del Artículo 220 es 12,000 VA y la fuente autónoma puede ser menor; las fuentes combinadas de 7,500 VA pasan porque superan el mínimo, que es la carga individual mayor, una bomba de pozo de 3,000 VA; las fuentes dimensionadas solo para la carga de iluminación de 1,500 VA fallan porque la iluminación no cuenta y queda por debajo del mínimo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1160" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">710.15: Dimensione para la carga mayor</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Caso: casa fuera de la red, una bomba de pozo.</text><line x1="30" y1="1102" x2="870" y2="1102" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1140" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 710.15</text><text x="870" y="1140" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><line x1="234" y1="258" x2="234" y2="336" stroke="#F0A846" stroke-width="4" stroke-dasharray="10 8"/><line x1="234" y1="445" x2="234" y2="523" stroke="#F0A846" stroke-width="4" stroke-dasharray="10 8"/><line x1="234" y1="632" x2="234" y2="710" stroke="#F0A846" stroke-width="4" stroke-dasharray="10 8"/><line x1="234" y1="819" x2="234" y2="897" stroke="#F0A846" stroke-width="4" stroke-dasharray="10 8"/><text x="234" y="200" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">EL MÍNIMO</text><text x="60" y="245" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">CARGA CALCULADA DEL ARTÍCULO 220</text><rect x="60" y="265" width="696" height="64" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="840" y="307" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">12,000 VA</text><text x="60" y="372" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">El suministro puede ser menor que esto.</text><text x="60" y="432" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">FUENTES COMBINADAS</text><rect x="60" y="452" width="435" height="64" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="511" y="494" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">7,500 VA</text><text x="60" y="559" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Inversor de 4,500 VA + generador de 3,000 VA.</text><text x="60" y="619" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">BOMBA DE POZO — LA CARGA INDIVIDUAL MAYOR</text><rect x="60" y="639" width="174" height="64" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="250" y="681" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">3,000 VA</text><text x="60" y="746" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Este es el mínimo que las fuentes deben superar.</text><text x="60" y="806" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">SOLO CARGA DE ILUMINACIÓN</text><rect x="60" y="826" width="87" height="64" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="163" y="868" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">1,500 VA</text><text x="60" y="933" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">La iluminación nunca cuenta como la única carga.</text><text x="60" y="1010" font-size="33" font-weight="700" fill="#2e7d32" text-anchor="start">✓ 7,500 VA superan el mínimo de 3,000 VA</text><text x="60" y="1062" font-size="33" font-weight="700" fill="#c0392b" text-anchor="start">✗ 1,500 VA solo para iluminación no cumple</text></svg>