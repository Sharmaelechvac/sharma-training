<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">701.12 Dos relojes por cumplir</title><desc id="d">Dos pruebas para una fuente de reserva legalmente requerida: una línea de tiempo de 60 segundos desde que falla la energía normal hasta que la energía está disponible, y una curva de voltaje de batería que debe mantenerse sobre el mínimo del 87.5 por ciento durante todo el deber de 1.5 horas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">701.12 Dos relojes por cumplir</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Disponibilidad en 60 s - autonomía por 90 min</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 701.12</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="60" y="200" width="780" height="320" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="90" y="262" font-size="34" font-weight="900" fill="#264387" text-anchor="start">EL RELOJ DE 60 SEGUNDOS</text><text x="120" y="322" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">FALLA LA NORMAL</text><text x="600" y="322" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">ENERGÍA DISPONIBLE</text><line x1="120" y1="350" x2="120" y2="432" stroke="#1a2f61" stroke-width="2"/><line x1="780" y1="350" x2="780" y2="432" stroke="#1a2f61" stroke-width="2"/><line x1="120" y1="420" x2="780" y2="420" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="408" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">60 s máx.</text><text x="450.0" y="408" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">60 s máx.</text><circle cx="600" cy="420" r="12" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="60" y="580" width="780" height="430" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="90" y="642" font-size="34" font-weight="900" fill="#264387" text-anchor="start">EL DEBER DE BATERÍA DE 90 MINUTOS</text><text x="120" y="762" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">100%</text><text x="780" y="812" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="end">SIGUE POR ENCIMA</text><path d="M120,790 C 300,800 500,815 780,830" stroke="#264387" stroke-width="4" fill="none"/><line x1="120" y1="880" x2="780" y2="880" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 8"/><text x="120" y="862" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">MÍNIMO DEL 87-1/2%</text><line x1="120" y1="940" x2="780" y2="940" stroke="#1f2937" stroke-width="3"/><line x1="120" y1="988" x2="780" y2="988" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="976" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">Mínimo de 1-1/2 h a la carga</text><text x="450.0" y="976" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Mínimo de 1-1/2 h a la carga</text><rect x="60" y="1080" width="780" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1150" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PASA UNO, FALLA EL OTRO = FALLA</text></svg>