<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">700.8: SPD on every emergency board</title><desc id="d">Comparison panel: on the left an emergency panelboard with a listed surge protective device mounted beside it and short, straight leads, marked protected; on the right the same board with the device at the end of a long coiled lead, which adds impedance and leaves the board unprotected in practice.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">700.8: SPD on every emergency board</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A listed SPD, in or on the board it protects.</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 700.8, 700.3</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="210" width="390" height="830" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="235" y="268" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="middle">RIGHT</text><text x="190" y="335" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">EMERGENCY</text><text x="190" y="377" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PANELBOARD</text><rect x="85" y="400" width="210" height="500" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><rect x="110" y="445" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="110" y="533" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="110" y="621" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="110" y="709" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="110" y="797" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="312" y="430" width="105" height="120" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="364" y="505" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">SPD</text><line x1="295" y1="465" x2="312" y2="465" stroke="#1f2937" stroke-width="5"/><line x1="295" y1="515" x2="312" y2="515" stroke="#1f2937" stroke-width="5"/><text x="235" y="962" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">SHORT, STRAIGHT</text><text x="235" y="1004" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">STATUS CHECKED</text><rect x="470" y="210" width="390" height="830" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="665" y="268" font-size="40" font-weight="800" fill="#c0392b" text-anchor="middle">WRONG</text><text x="620" y="335" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">EMERGENCY</text><text x="620" y="377" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PANELBOARD</text><rect x="515" y="400" width="210" height="500" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><rect x="540" y="445" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="540" y="533" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="540" y="621" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="540" y="709" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="540" y="797" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="742" y="770" width="105" height="120" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="794" y="845" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">SPD</text><path d="M 725 700 L 740 682 L 755 718 L 770 682 L 785 718 L 794 700 L 794 770" stroke="#c0392b" stroke-width="5" fill="none"/><text x="665" y="962" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">LONG COILED LEAD</text><text x="665" y="1004" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">= ADDED IMPEDANCE</text><rect x="40" y="1100" width="820" height="160" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="65" y="1162" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">A dead SPD protects nothing — check its</text><text x="65" y="1212" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">status light on the 700.3 rounds.</text></svg>