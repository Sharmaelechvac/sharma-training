<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Energía almacenada: la batería sigue viva</title><desc id="d">Unifilar vertical: gabinete de baterías marcado aún energizado, luego una desconexión del SAE fácilmente accesible, un inversor y el tablero, con los límites de voltaje de cc en vivienda debajo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Energía almacenada: la batería sigue viva</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Unifilar de un SAE de vivienda y su desconexión.</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 706, 706.20(B)</text><rect x="150" y="210" width="600" height="170" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="278" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">GABINETE DE BATERÍAS</text><text x="450" y="330" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">SIGUE CON ENERGÍA AL APAGAR TODO</text><line x1="450" y1="380" x2="450" y2="450" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="200" y="450" width="500" height="120" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="5"/><text x="450" y="505" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">DESCONEX. DEL SAE</text><text x="450" y="548" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">FÁCILMENTE ACCESIBLE</text><line x1="450" y1="570" x2="450" y2="640" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="200" y="640" width="500" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="695" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">INVERSOR</text><text x="450" y="738" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">MANDA LA PLACA</text><line x1="450" y1="760" x2="450" y2="830" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><rect x="200" y="830" width="500" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="885" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="450" y="928" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">CABLEADO DEL PREDIO</text><rect x="227.0" y="1024" width="446" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="1062" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CC EN VIVI