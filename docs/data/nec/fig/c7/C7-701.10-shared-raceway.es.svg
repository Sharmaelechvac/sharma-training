<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">701 puede compartir — 700 no</title><desc id="d">Dos secciones de canalización: una canalización de reserva legalmente requerida (701) que mezcla conductores generales y de reserva con una píldora de compartido-bien, junto a un diseño de emergencia (700) donde los conductores de emergencia y generales quedan en canalizaciones separadas y nunca se mezclan.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">701 puede compartir — 700 no</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Secciones de canalización — 701.10 vs. 700.10</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 701.10, 700.10</text><text x="870" y="1440" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="60" y="210" width="380" height="620" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="60" y="210" width="380" height="70" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="250" y="256" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">701 · RESERVA</text><circle cx="250" cy="480" r="130" fill="#eef2f9" stroke="#264387" stroke-width="6"/><circle cx="205" cy="435" r="28" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="205" y="446" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">G</text><circle cx="295" cy="435" r="28" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="295" y="446" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">S</text><circle cx="205" cy="525" r="28" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="205" y="536" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">S</text><circle cx="295" cy="525" r="28" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="295" y="536" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">G</text><circle cx="250" cy="480" r="28" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="250" y="491" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">G</text><rect x="95" y="668" width="310" height="54" rx="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="250" y="706" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">COMPARTIDO — BIEN ✓</text><text x="250" y="776" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">G = cableado general</text><text x="250" y="818" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">S = cableado de reserva</text><rect x="460" y="210" width="380" height="620" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="460" y="210" width="380" height="70" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="650" y="256" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">700 · EMERGENCIA</text><circle cx="565" cy="470" r="78" fill="#eef2f9" stroke="#264387" stroke-width="6"/><circle cx="540" cy="448" r="24" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="540" y="458" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">E</text><circle cx="590" cy="448" r="24" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="590" y="458" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">E</text><circle cx="565" cy="498" r="24" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="565" y="508" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">E</text><circle cx="735" cy="470" r="78" fill="#eef2f9" stroke="#264387" stroke-width="6"/><circle cx="710" cy="448" r="24" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="710" y="458" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">G</text><circle cx="760" cy="448" r="24" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="760" y="458" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">G</text><circle cx="735" cy="498" r="24" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="735" y="508" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">G</text><rect x="490" y="596" width="320" height="64" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="650" y="638" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">NUNCA MEZCLADOS</text><text x="650" y="776" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">E = cableado emerg.</text><text x="650" y="818" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">independiente siempre</text><rect x="60" y="900" width="780" height="170" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="972" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">El método de cableado sigue</text><text x="450" y="1020" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">la clasificación — defínala primero.</text><text x="450" y="1160" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Las excepciones del 700 son pocas (equipo de transferencia).</text></svg>