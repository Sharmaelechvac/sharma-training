<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">La suma del 100 por ciento</title><desc id="d">Gráfico de barras apiladas: con una fuente de 20 A la suma 200 A más 25 A iguala la capacidad de barras de 225 A y pasa; con una fuente de 32 A la suma 200 A más 40 A llega a 240 A, supera la línea de capacidad de barras, y falla este método.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La suma del 100 por ciento</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Bus de 225 A, principal de 200 A — ejemplo</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 705.12(B)(3)(1)</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><text x="60" y="252" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">FUENTE DE 20 A:  200 + 25 = 225 A</text><text x="740" y="262" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">+25 A</text><text x="740" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">+25 A</text><rect x="60" y="276" width="640" height="96" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="76" y="338" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">PRINC. 200 A</text><rect x="700" y="276" width="80" height="96" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="794" y="338" font-size="44" font-weight="800" fill="#2e7d32" text-anchor="start">✓</text><text x="60" y="492" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">FUENTE DE 32 A:  200 + 40 = 240 A</text><rect x="60" y="516" width="640" height="96" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="76" y="578" font-size="36" font-weight="800" fill="#ffffff" text-anchor="start">PRINC. 200 A</text><rect x="700" y="516" width="128" height="96" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="712" y="578" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">+40 A</text><text x="842" y="578" font-size="44" font-weight="800" fill="#c0392b" text-anchor="start">✗</text><line x1="780" y1="210" x2="780" y2="690" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><text x="872" y="726" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">CAPACIDAD DE BARRAS 225 A — NO LA EXCEDA</text><text x="872" y="726" font-size="36" font-weight="800" fill="#c0392b" text-anchor="end">CAPACIDAD DE BARRAS 225 A — NO LA EXCEDA</text><rect x="30" y="800" width="840" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="866" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">LA SUMA CABE → INTERRUPTOR EN TODO EL BUS</text><rect x="30" y="940" width="840" height="110" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="1006" font-size="33" font-weight="800" fill="#ffffff" text-anchor="middle">NO CABE → 120% · REDUZCA · SUMINISTRO</text><text x="30" y="1120" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La fuente cuenta al 125% de su salida.</text></svg>