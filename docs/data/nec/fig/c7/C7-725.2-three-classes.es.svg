<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Tres clases, una línea divisoria</title><desc id="d">Tres paneles apilados que comparan circuitos Clase 1, Clase 2 y Clase 3: contra qué está limitado cada uno, el riesgo que queda, y el techo de 600 voltios en los circuitos Clase 1 de control remoto y señalización.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Tres clases, una línea divisoria</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Una familia, tres acuerdos de seguridad (725.2)</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 725.2 · Article 725</text><rect x="40" y="200" width="820" height="290" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="40" y="200" width="820" height="70" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="70" y="248" font-size="38" font-weight="800" fill="#ffffff" text-anchor="start">CLASE 1 — SIN LÍMITE DE POTENCIA</text><text x="70" y="330" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Circuitos de control remoto + señalización</text><text x="70" y="374" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Puede funcionar hasta 600 V</text><text x="70" y="418" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Cableado como circuitos de potencia</text><rect x="40" y="530" width="820" height="290" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="40" y="530" width="820" height="70" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="578" font-size="38" font-weight="800" fill="#ffffff" text-anchor="start">CLASE 2 — LIMITADA EN TODO</text><text x="70" y="660" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Seguro contra choque</text><text x="70" y="704" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Seguro contra inicio de fuego</text><text x="70" y="748" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Termostato, timbre, controles</text><rect x="40" y="860" width="820" height="290" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="40" y="860" width="820" height="70" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="908" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">CLASE 3 — LIMITADA VS. SOLO FUEGO</text><text x="70" y="990" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Inicio de fuego: limitado</text><text x="70" y="1034" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Queda riesgo de choque</text><text x="70" y="1078" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Se requiere protección adicional</text></svg>