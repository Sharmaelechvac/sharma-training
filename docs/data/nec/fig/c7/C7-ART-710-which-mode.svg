<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1270" width="900" height="1270" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">710: Stand-alone or tied in?</title><desc id="d">Decision flow: if there is no utility service, the system is island mode and Article 710 owns it, with solar, battery and generator sources combined into one stand-alone panel. If a utility service exists, Article 702, 705 or 706 owns the system instead.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1270" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">710: Stand-alone or tied in?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Decide the mode first — the mode picks the article.</text><line x1="30" y1="1212" x2="870" y2="1212" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1250" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 710, 710.10, 710.15</text><rect x="130" y="205" width="640" height="90" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="262" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">IS THERE A UTILITY SERVICE?</text><line x1="240" y1="295" x2="240" y2="360" stroke="#1f2937" stroke-width="4"/><line x1="660" y1="295" x2="660" y2="360" stroke="#1f2937" stroke-width="4"/><text x="222" y="340" font-size="36" font-weight="800" fill="#c0392b" text-anchor="end">NO</text><text x="678" y="340" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">YES</text><rect x="40" y="365" width="390" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="235" y="415" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">ISLAND MODE</text><text x="235" y="458" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">ARTICLE 710</text><rect x="470" y="365" width="390" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="665" y="415" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">TIED TO UTILITY</text><text x="665" y="458" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">702 / 705 / 706</text><text x="40" y="545" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">SOURCES COMBINE:</text><rect x="40" y="565" width="390" height="62" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="60" y="607" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">PV array</text><rect x="40" y="640" width="390" height="62" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="60" y="682" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">Battery inverter</text><rect x="40" y="715" width="390" height="62" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="60" y="757" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">Generator</text><line x1="235" y1="792" x2="235" y2="822" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="828" width="390" height="100" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="235" y="872" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">STAND-ALONE PANEL</text><text x="235" y="910" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">NO UTILITY FEED</text><text x="470" y="545" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">WITH A UTILITY:</text><rect x="470" y="565" width="390" height="92" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="490" y="605" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">BACKUP ONLY</text><text x="490" y="641" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Article 702 owns it</text><rect x="470" y="672" width="390" height="92" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="490" y="712" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">RUNS IN PARALLEL</text><text x="490" y="748" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Article 705 owns it</text><rect x="470" y="779" width="390" height="92" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="490" y="819" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">STORAGE SYSTEM</text><text x="490" y="855" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Article 706 owns it</text><rect x="50" y="985" width="820" height="215" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="75" y="1045" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">•  No utility, ever: Article 710 owns the job.</text><text x="75" y="1089" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">•  Utility present: 702, 705 or 706 own it.</text><text x="75" y="1133" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">•  A dc microgrid is Article 712, not 710.</text><text x="75" y="1177" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">•  710.10 plaque: every source + disconnect.</text></svg>