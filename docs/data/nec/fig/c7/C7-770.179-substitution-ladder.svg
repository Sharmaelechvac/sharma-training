<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Fiber Types: The Ladder</title><desc id="d">Decoder for optical fiber type letters plus the substitution ladder: plenum OFNP/OFCP over riser OFNR/OFCR over general-purpose OFNG/OFCG/OFN/OFC, with substitution allowed downward only and a conductive type never replacing a nonconductive one.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Fiber Types: The Ladder</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Higher replaces lower — never the reverse</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 770.179, Table 770.154(E)</text><rect x="30" y="185" width="264" height="160" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="162" y="248" font-size="44" font-weight="800" fill="#264387" text-anchor="middle">OF</text><text x="162" y="296" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">optical fiber</text><rect x="318" y="185" width="264" height="160" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="248" font-size="44" font-weight="800" fill="#264387" text-anchor="middle">N or C</text><text x="450" y="296" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">N = no metal</text><text x="450" y="334" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">C = has metal</text><rect x="606" y="185" width="264" height="160" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="738" y="248" font-size="44" font-weight="800" fill="#264387" text-anchor="middle">P R G</text><text x="738" y="296" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">plenum · riser</text><text x="738" y="334" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">general use</text><rect x="210" y="395" width="560" height="150" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="490" y="447" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">PLENUM</text><text x="490" y="493" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">OFNP · OFCP</text><text x="490" y="531" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">ducts and air spaces</text><rect x="210" y="575" width="560" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="490" y="627" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">RISER</text><text x="490" y="673" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">OFNR · OFCR</text><text x="490" y="711" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">shafts, floor to floor</text><rect x="210" y="755" width="560" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="490" y="807" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERAL</text><text x="490" y="853" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">OFNG · OFCG · OFN · OFC</text><text x="490" y="891" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">everywhere else</text><line x1="70" y1="470" x2="70" y2="830" stroke="#2e7d32" stroke-width="5" marker-end="url(#ah)"/><text x="125" y="660" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">MAY GO</text><text x="125" y="700" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">DOWN</text><line x1="850" y1="830" x2="850" y2="470" stroke="#c0392b" stroke-width="5" marker-end="url(#ah)"/><text x="838" y="660" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">NEVER</text><text x="838" y="700" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">UP</text><line x1="818" y1="448" x2="882" y2="512" stroke="#c0392b" stroke-width="5"/><line x1="818" y1="512" x2="882" y2="448" stroke="#c0392b" stroke-width="5"/><rect x="30" y="955" width="840" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1012" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">N may replace C — same grade or lower</text><text x="450" y="1054" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Example: OFNR stands in for OFCR.</text><rect x="30" y="1095" width="840" height="120" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1150" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">C NEVER REPLACES N</text><text x="450" y="1192" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">where a nonconductive type is specified</text><text x="450" y="1290" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle" font-style="italic">Read the letters before the pull.</text></svg>