<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">700.5 Equipo de transferencia</title><desc id="d">Diagrama unifilar: las alimentaciones de red y generador entran a un interruptor de transferencia automática dibujado con un enclavamiento para que las dos fuentes nunca puedan cerrarse juntas; el interruptor alimenta un tablero de emergencia solo para cargas 700. Una franja roja enumera lo que no se permite en un trabajo 700 (interruptores de transferencia montados en el medidor y reacondicionados), y cuatro verificaciones numeradas cierran el dibujo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">700.5 Equipo de transferencia</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dos fuentes, un interruptor — nunca juntas.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 700.5, 700.5(E); compare 702.5(C)</text><rect x="80" y="200" width="340" height="110" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="250" y="252" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">RED PÚBLICA</text><text x="250" y="292" font-size="30" font-weight="700" fill="#F0A846" text-anchor="middle">fuente normal</text><rect x="480" y="200" width="340" height="110" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="650" y="252" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">GENERADOR</text><text x="650" y="292" font-size="30" font-weight="700" fill="#F0A846" text-anchor="middle">fuente emergencia</text><line x1="250" y1="310" x2="250" y2="400" stroke="#1f2937" stroke-width="5"/><line x1="250" y1="400" x2="380" y2="400" stroke="#1f2937" stroke-width="5"/><line x1="380" y1="400" x2="380" y2="470" stroke="#1f2937" stroke-width="5"/><line x1="650" y1="310" x2="650" y2="400" stroke="#1f2937" stroke-width="5"/><line x1="650" y1="400" x2="520" y2="400" stroke="#1f2937" stroke-width="5"/><line x1="520" y1="400" x2="520" y2="470" stroke="#1f2937" stroke-width="5"/><rect x="110" y="470" width="680" height="290" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="530" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">TRANSFER. AUTOMÁTICA</text><circle cx="370" cy="566" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="370" cy="622" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><path d="M370,566 A30,30 0 0 1 370,622" stroke="#1a2f61" stroke-width="5" fill="none"/><circle cx="530" cy="566" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="530" cy="622" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><path d="M530,566 A30,30 0 0 1 530,622" stroke="#1a2f61" stroke-width="5" fill="none"/><line x1="377" y1="594" x2="523" y2="594" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 8"/><text x="575" y="606" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">enclavamiento</text><text x="450" y="690" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">de operación eléctrica</text><text x="450" y="730" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">retenido mecánicamente</text><line x1="450" y1="760" x2="450" y2="850" stroke="#1f2937" stroke-width="5"/><rect x="220" y="850" width="460" height="120" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="908" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">TABLERO EMERG.</text><text x="450" y="948" font-size="30" font-weight="700" fill="#F0A846" text-anchor="middle">Solo cargas 700</text><rect x="60" y="1015" width="780" height="118" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1062" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">NO EN UN TRABAJO 700</text><text x="450" y="1106" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">X  int. en el medidor    X  int. reacondicionado</text><text x="60" y="1206" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">LAS CUATRO VERIFICACIONES</text><circle cx="88" cy="1250" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="88" y="1262" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="140" y="1262" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Listado + marcado para uso de emergencia</text><circle cx="88" cy="1312" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="88" y="1324" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="140" y="1324" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Las fuentes nunca pueden conectarse entre sí</text><circle cx="88" cy="1374" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="88" y="1386" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="140" y="1386" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Solo cargas de emergencia en el equipo</text><circle cx="88" cy="1436" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="88" y="1448" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="140" y="1448" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">SCCR marcado en campo afuera — 700.5(E)</text></svg>