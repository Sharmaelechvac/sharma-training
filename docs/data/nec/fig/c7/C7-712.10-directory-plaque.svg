<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">712.10 Directory: dc microgrid sources</title><desc id="d">A permanent directory plaque at the service equipment listing a dc microgrid's PV array, battery system, fuel cell and ac-dc converter, each with the location of its disconnect.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">712.10 Directory: dc microgrid sources</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">At the service and at every source.</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 712.10, 712.10(B)</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="80" y="220" width="740" height="560" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="80" y="220" width="740" height="84" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="276" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">DIRECTORY — ALL POWER SOURCES</text><circle cx="130" cy="360" r="14" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="165" y="372" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">PV ARRAY</text><text x="165" y="414" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Disconnect: roof combiner</text><circle cx="130" cy="468" r="14" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="165" y="480" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">BATTERY SYSTEM</text><text x="165" y="522" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Disconnect: battery room</text><circle cx="130" cy="576" r="14" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="165" y="588" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">FUEL CELL</text><text x="165" y="630" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Disconnect: at the unit</text><circle cx="130" cy="684" r="14" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="165" y="696" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">AC-DC CONVERTER</text><text x="165" y="738" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Disconnect: at the service</text><rect x="80" y="836" width="580" height="62" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="370" y="878" font-size="31" font-weight="900" fill="#1a2f61" text-anchor="middle">AT THE SERVICE EQUIPMENT</text><rect x="80" y="918" width="580" height="62" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="370" y="960" font-size="31" font-weight="900" fill="#1a2f61" text-anchor="middle">AT EACH SOURCE LOCATION</text><text x="80" y="1080" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Every source named.</text><text x="80" y="1123" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">Every disconnect located.</text><text x="80" y="1210" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">A source left off the plaque is a source</text><text x="80" y="1250" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">the next person cannot make safe.</text></svg>