<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">700.3 — tests and maintenance</title><desc id="d">Flow chart of the 700.3 cycle: installation complete, acceptance test conducted or witnessed by the AHJ, periodic testing on an AHJ-approved schedule, testing under load, and a written record, with battery maintenance noted and a repeat loop.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">700.3 — tests and maintenance</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The cycle that keeps an emergency system proven</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 700.3</text><text x="870" y="1420" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="170" y="200" width="660" height="108" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="228" cy="254" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="228" y="266" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="282" y="250" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="start">INSTALLATION COMPLETE</text><text x="282" y="290" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">system wired and ready</text><line x1="500" y1="308" x2="500" y2="352" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="170" y="352" width="660" height="108" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="228" cy="406" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="228" y="418" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="282" y="402" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="start">ACCEPTANCE TEST — 700.3(A)</text><text x="282" y="442" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">AHJ conducts or witnesses</text><line x1="500" y1="460" x2="500" y2="504" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="170" y="504" width="660" height="108" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="228" cy="558" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="228" y="570" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="282" y="554" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="start">PERIODIC TESTING — 700.3(B)</text><text x="282" y="594" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">on a schedule the AHJ approves</text><line x1="500" y1="612" x2="500" y2="656" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="170" y="656" width="660" height="108" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="228" cy="710" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="228" y="722" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="282" y="706" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="start">TEST UNDER LOAD — 700.3(E)</text><text x="282" y="746" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">at maximum anticipated load</text><line x1="500" y1="764" x2="500" y2="808" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="170" y="808" width="660" height="108" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="228" cy="862" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="228" y="874" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">5</text><text x="282" y="858" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="start">WRITTEN RECORD — 700.3(D)</text><text x="282" y="898" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">tests and maintenance logged</text><path d="M170,862 H100 V558" stroke="#264387" stroke-width="3" fill="none" stroke-dasharray="10 8"/><path d="M100,558 l34,-9 v18 z" stroke="#264387" stroke-width="0" fill="#264387"/><rect x="36.0" y="678" width="128" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="100.0" y="712" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">REPEAT</text><rect x="170" y="1010" width="660" height="96" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="500" y="1052" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">BATTERY SYSTEMS — 700.3(C)</text><text x="500" y="1090" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">periodic maintenance required</text><rect x="170" y="1160" width="660" height="96" rx="12" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="500" y="1196" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">NO RECORD =</text><text x="500" y="1238" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">UNPROVEN SYSTEM</text></svg>