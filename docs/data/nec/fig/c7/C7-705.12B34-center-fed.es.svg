ight="48" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="315" y="585" width="270" height="100" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="650" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">PRINC. 200 A</text><rect x="272" y="985" width="356" height="62" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="450" y="1028" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">FUENTE 40 A</text><text x="668" y="1005" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">FUENTE EN</text><text x="640.0" y="1047" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">ESTE EXTREMO</text><rect x="60" y="1160" width="780" height="140" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1222" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Fuente 125% × 32 A + principal 200 A = 240 A</text><text x="450" y="1270" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">= 120% de las barras de 200 A</text><text x="450" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Haga el cálculo en el extremo que use — y regístrelo.</text></svg>