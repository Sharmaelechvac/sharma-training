<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">725.136: familias separadas</title><desc id="d">Arriba: una caja de dispositivo dividida por una barrera, conductores de potencia de 120 V en un lado y un cable de termostato Clase 2 en el otro. Abajo: un tramo abierto con cables de potencia y Clase 2 acotados a 2 pulgadas de separación.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">725.136: familias separadas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Barrera en la caja. Dos pulgadas en el tramo abierto.</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 725.136, 725.136(I)</text><text x="40" y="215" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">EN UNA CAJA O GABINETE</text><rect x="70" y="250" width="430" height="400" rx="8" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="268" y="250" width="34" height="400" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="285" y="690" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">BARRERA</text><path d="M115,650 L115,420 L190,420" stroke="#1f2937" stroke-width="5" fill="none"/><path d="M160,650 L160,460 L225,460" stroke="#1f2937" stroke-width="5" fill="none"/><rect x="190" y="380" width="70" height="80" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="155" y="320" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">120 V</text><text x="155" y="362" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">POTENCIA</text><path d="M445,650 L445,430" stroke="#F0A846" stroke-width="6" fill="none"/><path d="M408,650 L408,470" stroke="#F0A846" stroke-width="6" fill="none"/><circle cx="425" cy="400" r="26" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="425" y="412" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">T</text><text x="425" y="320" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">CLASE 2</text><text x="425" y="362" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">TERMOSTATO</text><circle cx="545" cy="300" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="545" y="311" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="580" y="292" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">La barrera hace el</text><text x="580" y="331" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">separar aquí</text><circle cx="545" cy="420" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="545" y="431" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="580" y="412" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Sin barrera,</text><text x="580" y="451" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">sin caja compartida</text><circle cx="545" cy="540" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="545" y="551" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="580" y="532" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Entrada del equipo:</text><text x="580" y="571" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">sus reglas estrictas</text><text x="40" y="790" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">TRAMO ABIERTO — OTRAS APLICACIONES</text><line x1="70" y1="900" x2="660" y2="900" stroke="#1f2937" stroke-width="6"/><text x="70" y="872" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">CABLE DE POTENCIA</text><line x1="70" y1="1060" x2="660" y2="1060" stroke="#F0A846" stroke-width="7"/><text x="70" y="1115" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">CABLE CLASE 2</text><line x1="740" y1="900" x2="740" y2="1060" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="754" y="992.6" font-size="36" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">2 in mín.</text><text x="754" y="992.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">2 in mín.</text><text x="70" y="1230" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">O un lado en canalización o cable listado,</text><text x="70" y="1270" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">o una barrera permanente entre los tramos.</text><rect x="70" y="1300" width="760" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1338" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">2 in de aire dentro de una caja NO es</text><text x="450" y="1377" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">un permiso — use una barrera</text></svg>