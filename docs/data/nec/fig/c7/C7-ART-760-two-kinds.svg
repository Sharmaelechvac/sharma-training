<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">One panel, two circuit kinds</title><desc id="d">Fire alarm control panel with initiating circuits on one side and notification circuits on the other, over comparison panels for non-power-limited and power-limited fire alarm circuits and the sources that decide each kind.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">One panel, two circuit kinds</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The kind comes from the power source</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 760 · 760.41 · 760.121</text><rect x="200" y="200" width="500" height="120" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="252" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">FIRE ALARM</text><text x="450" y="296" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">CONTROL PANEL</text><line x1="450" y1="320" x2="450" y2="380" stroke="#264387" stroke-width="4"/><line x1="240" y1="380" x2="660" y2="380" stroke="#264387" stroke-width="4"/><line x1="240" y1="380" x2="240" y2="420" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><line x1="660" y1="380" x2="660" y2="420" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="420" width="400" height="250" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="240" y="472" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">INITIATING</text><text x="240" y="524" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Smoke + heat detectors</text><text x="240" y="566" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Pull stations</text><text x="240" y="608" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Waterflow switches</text><text x="240" y="650" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Supervisory signals</text><rect x="460" y="420" width="400" height="250" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="660" y="472" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">NOTIFICATION</text><text x="660" y="524" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Horns + strobes</text><text x="660" y="566" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Speakers</text><text x="660" y="608" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Door release</text><text x="660" y="650" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Elevator control</text><text x="40" y="748" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Two kinds of circuit</text><rect x="40" y="790" width="400" height="320" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="240" y="852" font-size="40" font-weight="800" fill="#264387" text-anchor="middle">NPLFA</text><text x="240" y="902" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Non-power-limited</text><text x="240" y="946" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Source per 760.41</text><text x="240" y="990" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Up to 600 V</text><text x="240" y="1034" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Power-wiring rules</text><rect x="460" y="790" width="400" height="320" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="660" y="852" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">PLFA</text><text x="660" y="902" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Power-limited</text><text x="660" y="946" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Listed PLFA source</text><text x="660" y="990" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">per 760.121</text><text x="660" y="1034" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Power-limited rules</text><rect x="40" y="1160" width="820" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1206" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">The branch circuit feeding the panel</text><text x="450" y="1248" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">feeds the fire alarm only.</text></svg>