<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1660" width="900" height="1660" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">705.12: load-side connection</title><desc id="d">Panelboard elevation for a load-side source connection: 200 A main at the top, load breakers in the middle, a 40 A solar breaker at the opposite end of the 200 A bus with a hold-down, and a multiple-sources warning label. Callouts show the 120 percent math: 200 A plus 40 A equals the 240 A cap.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1660" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">705.12: load-side connection</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">200 A bus, 200 A main — the 120% worked example.</text><line x1="30" y1="1602" x2="870" y2="1602" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1640" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 705.12, 705.12(A), 705.12(B)(3), 705.13</text><rect x="270" y="190" width="360" height="960" rx="8" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="270" y="190" width="360" height="130" rx="8" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="270" y="260" width="360" height="60" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="248" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">MAIN BREAKER</text><text x="450" y="292" font-size="34" font-weight="900" fill="#F0A846" text-anchor="middle">200 A</text><line x1="420" y1="320" x2="420" y2="1090" stroke="#1a2f61" stroke-width="6"/><line x1="480" y1="320" x2="480" y2="1090" stroke="#1a2f61" stroke-width="6"/><rect x="330" y="380" width="90" height="56" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="480" y="480" width="90" height="56" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="330" y="580" width="90" height="56" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="480" y="680" width="90" height="56" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="310" y="950" width="280" height="100" rx="6" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><circle cx="332" cy="968" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><circle cx="568" cy="968" r="7" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="450" y="1000" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">SOLAR BREAKER</text><text x="450" y="1038" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">40 A</text><rect x="290" y="1085" width="320" height="48" rx="0" fill="#fdf3e0" stroke="#c0392b" stroke-width="3"/><text x="450" y="1120" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">MULTIPLE SOURCES</text><rect x="665" y="330" width="215" height="250" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="690" y="385" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">120% of bus</text><text x="690" y="427" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">= 240 A cap</text><text x="690" y="469" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start"></text><text x="690" y="511" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">200 + 40</text><text x="690" y="553" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">= 240 A</text><rect x="690" y="608" width="196" height="48" rx="24" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="788.0" y="642" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">AT THE CAP</text><line x1="630" y1="420" x2="665" y2="420" stroke="#1a2f61" stroke-width="3"/><circle cx="292" cy="955" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="292" y="967" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><circle cx="607" cy="962" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="607" y="974" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="655" cy="1109" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="655" y="1121" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><circle cx="655" cy="330" r="23" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="655" y="342" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="60" y="1262" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">READ THE PANEL</text><circle cx="88" cy="1306" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="88" y="1318" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="140" y="1318" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Dedicated breaker for the source — (A)</text><circle cx="88" cy="1368" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="88" y="1380" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="140" y="1380" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">120% rule: sources at opposite ends</text><circle cx="88" cy="1430" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="88" y="1442" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="140" y="1442" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Hold-down on the backfed breaker</text><circle cx="88" cy="1492" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="88" y="1504" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="140" y="1504" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Multi-source warning label on the gear</text></svg>