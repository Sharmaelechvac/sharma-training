<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Un ajuste del controlador hace el cálculo</title><desc id="d">Unifilar vertical: un inversor FV con salida de placa de 40 A alimenta un sistema de control de potencia listado ajustado a 32 A; el ajuste representa la corriente de salida, así que el 125 por ciento de 32 A más el principal de 200 A igualan 240 A, exactamente el 120 por ciento del bus de 200 A.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Un ajuste del controlador hace el cálculo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Ejemplo resuelto: casa de Kissimmee, 200 A</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 705.13 · 705.12(B)(3)(2)</text><rect x="110" y="190" width="680" height="170" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="248" font-size="40" font-weight="800" fill="#1f2937" text-anchor="middle">INVERSOR FV</text><text x="450" y="306" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Salida de placa: 40 A</text><line x1="450" y1="360" x2="450" y2="424" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><text x="478" y="404" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">40 A</text><text x="478" y="404" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">40 A</text><rect x="110" y="424" width="680" height="270" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="482" font-size="40" font-weight="800" fill="#1f2937" text-anchor="middle">CONTROL DE POTENCIA</text><text x="450" y="540" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Equipo listado</text><text x="450" y="592" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Ajuste del controlador: 32 A</text><text x="450" y="644" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">El ajuste representa la corriente de salida</text><line x1="450" y1="694" x2="450" y2="758" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><text x="478" y="738" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">cuenta como 32 A</text><text x="478" y="738" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">cuenta como 32 A</text><rect x="110" y="758" width="680" height="170" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="816" font-size="40" font-weight="800" fill="#1f2937" text-anchor="middle">TABLERO</text><text x="450" y="874" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Bus de 200 A · Principal de 200 A</text><rect x="60" y="960" width="780" height="208" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="1020" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">125% × 32 A = 40 A</text><text x="450" y="1078" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">200 A + 40 A = 240 A</text><text x="450" y="1136" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="middle">= 120% del bus — PASA</text><rect x="60" y="1200" width="780" height="96" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="1262" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">AJUSTES: SOLO PERSONAL CALIFICADO</text><rect x="60" y="1320" width="780" height="96" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1382" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">SUBIR EL AJUSTE = CÁLCULO NULO</text></svg>