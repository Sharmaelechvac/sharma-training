<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1580" width="900" height="1580" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 770: the fiber ladder</title><desc id="d">Substitution ladder for optical fiber cables: OFNP/OFCP plenum at top, OFNR/OFCR riser, OFNG/OFCG general purpose, OFN/OFC general purpose at the bottom, with a green down arrow marked OK and a red up arrow marked never. Below, a panel contrasting nonconductive fiber (may share raceway or tray with power, enclosure only if functionally associated) with conductive fiber (no shared raceway or tray with power).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1580" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 770: the fiber ladder</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Higher-listed cable substitutes downward. Never up.</text><line x1="30" y1="1522" x2="870" y2="1522" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1560" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 770.48, 770.133, 770.154, 770.179</text><rect x="50" y="205" width="550" height="118" rx="10" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="78" y="259" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">OFNP · OFCP</text><text x="78" y="301" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">Plenums and air spaces</text><rect x="50" y="345" width="550" height="118" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="78" y="399" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">OFNR · OFCR</text><text x="78" y="441" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">Risers, floor to floor</text><rect x="50" y="485" width="550" height="118" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="78" y="539" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">OFNG · OFCG</text><text x="78" y="581" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">General purpose</text><rect x="50" y="625" width="550" height="118" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="78" y="679" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">OFN · OFC</text><text x="78" y="721" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">General purpose</text><line x1="700" y1="235" x2="700" y2="720" stroke="#2e7d32" stroke-width="6" marker-end="url(#ah)"/><text x="700" y="782" font-size="32" font-weight="900" fill="#2e7d32" text-anchor="middle">DOWN</text><text x="700" y="824" font-size="32" font-weight="900" fill="#2e7d32" text-anchor="middle">OK</text><line x1="820" y1="720" x2="820" y2="235" stroke="#c0392b" stroke-width="6" marker-end="url(#ah)"/><text x="820" y="782" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">UP</text><text x="820" y="824" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">NEVER</text><line x1="50" y1="880" x2="850" y2="880" stroke="#c9d2e3" stroke-width="3"/><text x="50" y="940" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">Sharing space with power — 770.133</text><rect x="50" y="975" width="405" height="375" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="78" y="1032" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="start">NONCONDUCTIVE (N)</text><text x="78" y="1092" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">May share raceway or</text><text x="78" y="1132" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">tray with light, power</text><text x="78" y="1172" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">and Class 1 circuits</text><text x="78" y="1212" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="78" y="1252" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Enclosure with power</text><text x="78" y="1292" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">terminations: only if</text><text x="78" y="1332" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">functionally associated</text><rect x="475" y="975" width="405" height="375" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="503" y="1032" font-size="34" font-weight="900" fill="#c0392b" text-anchor="start">CONDUCTIVE (C)</text><text x="503" y="1092" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">No shared raceway or</text><text x="503" y="1132" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">tray with light, power</text><text x="503" y="1172" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">or Class 1 circuits</text><text x="503" y="1212" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="503" y="1252" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Its metal member can</text><text x="503" y="1292" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">carry a fault — treat</text><text x="503" y="1332" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">it like a conductor</text><rect x="50" y="1390" width="830" height="95" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="1430" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">Unlisted outside fiber: max 50 ft inside</text><text x="450" y="1472" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">the building, ending in an enclosure (770.48)</text></svg>