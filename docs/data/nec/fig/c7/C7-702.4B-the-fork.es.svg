<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">702.4(B): la bifurcación de tamaño</title><desc id="d">Diagrama de flujo de la bifurcación de dimensionamiento de 702.4(B). Transferencia manual: el usuario elige las cargas, así que la fuente lleva todas las cargas prev. a la vez. La transferencia automática se divide en carga plena (la fuente lleva la carga calculada completa) o gestión de carga (la fuente lleva la carga máxima que el el sistema conectará). Una franja roja indica que no hay una tercera rama.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">702.4(B): la bifurcación de tamaño</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El equipo de transferencia define la regla de tamaño.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.4(B), 702.4(B)(1), 702.4(B)(2)</text><rect x="230" y="195" width="440" height="105" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="248" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">FUENTE DE RESERVA</text><text x="450" y="288" font-size="30" font-weight="700" fill="#F0A846" text-anchor="middle">¿cuánto debe llevar?</text><line x1="450" y1="300" x2="450" y2="345" stroke="#1f2937" stroke-width="4"/><line x1="235" y1="345" x2="665" y2="345" stroke="#1f2937" stroke-width="4"/><line x1="235" y1="345" x2="235" y2="400" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><line x1="665" y1="345" x2="665" y2="400" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="400" width="390" height="105" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="235" y="452" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">TRANSFER. MANUAL</text><text x="235" y="490" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">(B)(1) — el usuario elige</text><line x1="235" y1="505" x2="235" y2="560" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="560" width="390" height="250" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="235" y="622" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">La fuente lleva:</text><text x="235" y="668" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">todas las cargas prev.</text><text x="235" y="712" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">a la vez</text><text x="235" y="762" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">el usuario es el</text><text x="235" y="800" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">gestión de carga</text><rect x="470" y="400" width="390" height="105" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="665" y="452" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">TRANSFER. AUTOMÁTICA</text><text x="665" y="490" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">(B)(2) — nadie elige</text><line x1="665" y1="505" x2="665" y2="560" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="470" y="560" width="390" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="665" y="614" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">CARGA PLENA</text><text x="665" y="658" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">fuente = plena</text><text x="665" y="696" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">carga calculada</text><text x="665" y="748" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">— o —</text><rect x="470" y="775" width="390" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="665" y="829" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">GESTIÓN DE CARGA</text><text x="665" y="873" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">fuente = carga máxima que</text><text x="665" y="911" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">el sistema conectará</text><rect x="60" y="1010" width="780" height="150" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1068" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">SIN TERCERA RAMA</text><text x="450" y="1114" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Automático + carga parcial + sin gestión de carga</text><text x="450" y="1152" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">es la combinación que 702.4(B) prohíbe</text><text x="450" y="1240" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">Decida la rama en papel, antes de dimensionar.</text><text x="450" y="1290" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">El Artículo 220 determina la carga calculada.</text></svg>