<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">702.4(B): the sizing fork</title><desc id="d">Flow diagram of the 702.4(B) sizing fork. Manual transfer: the user chooses the loads, so the source carries all loads intended at one time. Automatic transfer splits into full load (source carries the full calculated load) or load management (source carries the maximum load the system will connect). A red strip states there is no third branch.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">702.4(B): the sizing fork</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The transfer equipment picks the sizing rule.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.4(B), 702.4(B)(1), 702.4(B)(2)</text><rect x="230" y="195" width="440" height="105" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="248" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">STANDBY SOURCE</text><text x="450" y="288" font-size="30" font-weight="700" fill="#F0A846" text-anchor="middle">how much must it carry?</text><line x1="450" y1="300" x2="450" y2="345" stroke="#1f2937" stroke-width="4"/><line x1="235" y1="345" x2="665" y2="345" stroke="#1f2937" stroke-width="4"/><line x1="235" y1="345" x2="235" y2="400" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><line x1="665" y1="345" x2="665" y2="400" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="400" width="390" height="105" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="235" y="452" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">MANUAL TRANSFER</text><text x="235" y="490" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">(B)(1) — the user chooses</text><line x1="235" y1="505" x2="235" y2="560" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="560" width="390" height="250" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="235" y="622" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">Source carries:</text><text x="235" y="668" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">all loads intended</text><text x="235" y="712" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">at one time</text><text x="235" y="762" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">the user is the</text><text x="235" y="800" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">load management</text><rect x="470" y="400" width="390" height="105" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="665" y="452" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">AUTOMATIC TRANSFER</text><text x="665" y="490" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">(B)(2) — nobody chooses</text><line x1="665" y1="505" x2="665" y2="560" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="470" y="560" width="390" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="665" y="614" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">FULL LOAD</text><text x="665" y="658" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">source = full</text><text x="665" y="696" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">calculated load</text><text x="665" y="748" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">— or —</text><rect x="470" y="775" width="390" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="665" y="829" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">LOAD MANAGEMENT</text><text x="665" y="873" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">source = max load the</text><text x="665" y="911" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">system will connect</text><rect x="60" y="1010" width="780" height="150" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1068" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">NO THIRD BRANCH</text><text x="450" y="1114" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Automatic + partial load + no load mgmt</text><text x="450" y="1152" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">is the combination 702.4(B) forbids</text><text x="450" y="1240" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">Decide the branch on paper, before sizing.</text><text x="450" y="1290" font-size="33" font-weight="700" fill="#5b6478" text-anchor="middle">Article 220 figures the calculated load.</text></svg>