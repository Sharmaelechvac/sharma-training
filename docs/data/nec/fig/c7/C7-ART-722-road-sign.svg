<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1320" width="900" height="1320" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 722: Not in This Book</title><desc id="d">Road-sign style figure: a red 722 sign marked NEC 2023 only, with arrows back to the three NEC 2020 articles that hold the cable rules: 725 for Class 2 and Class 3, 760 for fire alarm cables, 770 for optical fiber.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1320" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 722: Not in This Book</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">A 2023 number — translate it back to 2020</text><line x1="30" y1="1262" x2="870" y2="1262" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1300" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020: Articles 725, 760, 770</text><rect x="250" y="210" width="400" height="190" rx="18" fill="#fbe9e7" stroke="#c0392b" stroke-width="6"/><text x="450" y="292" font-size="72" font-weight="800" fill="#c0392b" text-anchor="middle">722</text><text x="450" y="352" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NEC 2023 ONLY</text><line x1="450" y1="400" x2="450" y2="452" stroke="#1f2937" stroke-width="6"/><line x1="450" y1="452" x2="162" y2="556" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><line x1="450" y1="452" x2="450" y2="556" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><line x1="450" y1="452" x2="738" y2="556" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="560" width="264" height="190" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="162" y="638" font-size="44" font-weight="800" fill="#264387" text-anchor="middle">725</text><text x="162" y="686" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Class 2 and</text><text x="162" y="726" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Class 3 cables</text><rect x="318" y="560" width="264" height="190" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="638" font-size="44" font-weight="800" fill="#264387" text-anchor="middle">760</text><text x="450" y="686" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Fire alarm</text><text x="450" y="726" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">cables (PLFA)</text><rect x="606" y="560" width="264" height="190" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="738" y="638" font-size="44" font-weight="800" fill="#264387" text-anchor="middle">770</text><text x="738" y="686" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Optical fiber</text><text x="738" y="726" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">cables</text><rect x="30" y="790" width="840" height="66" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="834" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">All three live in the 2020 book</text><rect x="30" y="910" width="840" height="150" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="972" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Permits through Dec 30, 2026: NEC 2020.</text><text x="450" y="1018" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">722 arrives Dec 31, 2026 — FBC 9th Ed.</text><text x="450" y="1150" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle" font-style="italic">See a 722 citation? Flag it to the lead.</text></svg>