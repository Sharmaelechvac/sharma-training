<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">¿Es un trabajo COPS?</title><desc id="d">Diagrama de decisión: el Artículo 708 aplica solo cuando una AHJ o autoridad gubernamental ha designado la instalación como área de operaciones críticas; la rama del sí enumera los deberes añadidos, la del no devuelve el diseño a los Artículos 700, 701 o 702.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">¿Es un trabajo COPS?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Empieza con una designación, no con el equipo</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 708 · 708.4 · 708.22(C)</text><rect x="60" y="200" width="780" height="170" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="252" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Tiene una AHJ o autoridad gubernamental</text><text x="450" y="296" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">designado esta instalación, o un área</text><text x="450" y="340" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">en ella, como área de operaciones críticas?</text><line x1="450" y1="370" x2="450" y2="420" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="420" width="820" height="320" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="40" y="740" width="820" height="320" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="478" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="start">SÍ — APLICA EL ARTÍCULO 708</text><text x="70" y="536" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Evaluación de riesgos, documentada (708.4)</text><text x="70" y="578" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Plan de seguridad física (708.5)</text><text x="70" y="620" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Fuente alterna: 72 h a carga plena</text><text x="70" y="662" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Pruebas + mantenimiento documentados</text><text x="70" y="798" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">NO — NO ES UN TRABAJO COPS</text><text x="70" y="856" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Diseño según el Artículo 700, 701 o 702</text><text x="70" y="898" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Un generador grande por sí solo no</text><text x="70" y="940" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  hacen que un trabajo sea del 708</text><text x="70" y="982" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• La designación es decisión de la autoridad</text><rect x="40" y="1110" width="820" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1158" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Obtenga la designación por escrito</text><text x="450" y="1200" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">antes de cotizar el trabajo.</text></svg>