<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">A Controller Setting Does the Math</title><desc id="d">Vertical one-line: a PV inverter with a 40 A nameplate output feeds a listed power control system set to 32 A; the setting stands in for the output current, so 125 percent of 32 A plus the 200 A main equals 240 A, exactly 120 percent of the 200 A bus.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">A Controller Setting Does the Math</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked example: the Kissimmee house, 200 A panel</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 705.13 · 705.12(B)(3)(2)</text><rect x="110" y="190" width="680" height="170" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="248" font-size="40" font-weight="800" fill="#1f2937" text-anchor="middle">PV INVERTER</text><text x="450" y="306" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Nameplate output 40 A</text><line x1="450" y1="360" x2="450" y2="424" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><text x="478" y="404" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">40 A</text><text x="478" y="404" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">40 A</text><rect x="110" y="424" width="680" height="270" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="482" font-size="40" font-weight="800" fill="#1f2937" text-anchor="middle">POWER CONTROL SYSTEM</text><text x="450" y="540" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Listed equipment</text><text x="450" y="592" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Controller setting: 32 A</text><text x="450" y="644" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Setting stands in for output current</text><line x1="450" y1="694" x2="450" y2="758" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><text x="478" y="738" font-size="34" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">counts as 32 A</text><text x="478" y="738" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">counts as 32 A</text><rect x="110" y="758" width="680" height="170" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="816" font-size="40" font-weight="800" fill="#1f2937" text-anchor="middle">PANELBOARD</text><text x="450" y="874" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Bus 200 A · Main breaker 200 A</text><rect x="60" y="960" width="780" height="208" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="1020" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">125% × 32 A = 40 A</text><text x="450" y="1078" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">200 A + 40 A = 240 A</text><text x="450" y="1136" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="middle">= 120% of the bus — PASSES</text><rect x="60" y="1200" width="780" height="96" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="1262" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">SETTINGS: QUALIFIED PERSONNEL ONLY</text><rect x="60" y="1320" width="780" height="96" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1382" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">SETTING RAISED LATER = MATH VOID</text></svg>