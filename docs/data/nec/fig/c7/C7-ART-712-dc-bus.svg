<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">712: a dc microgrid on one bus</title><desc id="d">Block diagram of a dc microgrid: a PV array and a battery, each through a converter, feeding one common dc bus; the bus feeds LED lighting, servers and other dc loads, and ties to the ac system through a dc-ac inverter. A directory plaque is shown at the service.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">712: a dc microgrid on one bus</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Dc sources, dc loads, one common bus</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 712, 712.10</text><rect x="70" y="210" width="320" height="100" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="230" y="272" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">PV ARRAY (dc)</text><line x1="230" y1="310" x2="230" y2="360" stroke="#1f2937" stroke-width="5"/><rect x="100" y="360" width="260" height="66" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="230" y="404" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">CONVERTER</text><line x1="230" y1="426" x2="230" y2="520" stroke="#1f2937" stroke-width="5"/><rect x="510" y="210" width="320" height="100" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="670" y="272" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">BATTERY (dc)</text><line x1="670" y1="310" x2="670" y2="360" stroke="#1f2937" stroke-width="5"/><rect x="540" y="360" width="260" height="66" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="670" y="404" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">CONVERTER</text><line x1="670" y1="426" x2="670" y2="520" stroke="#1f2937" stroke-width="5"/><rect x="110" y="520" width="680" height="28" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="450" y="505" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">DC BUS</text><circle cx="110" cy="534" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="110" y="545" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><line x1="200" y1="548" x2="200" y2="640" stroke="#1f2937" stroke-width="5"/><rect x="80" y="640" width="240" height="96" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="200" y="700" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">LED LIGHTING</text><line x1="450" y1="548" x2="450" y2="640" stroke="#1f2937" stroke-width="5"/><rect x="330" y="640" width="240" height="96" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="700" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">SERVERS · IT</text><line x1="700" y1="548" x2="700" y2="640" stroke="#1f2937" stroke-width="5"/><rect x="580" y="640" width="240" height="96" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="700" y="700" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">DC LOADS</text><rect x="70" y="830" width="320" height="110" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="230" y="878" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">DIRECTORY</text><text x="230" y="920" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">every source named</text><circle cx="70" cy="830" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="70" y="841" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><line x1="790" y1="534" x2="855" y2="534" stroke="#1f2937" stroke-width="5"/><line x1="855" y1="534" x2="855" y2="885" stroke="#1f2937" stroke-width="5"/><line x1="855" y1="885" x2="840" y2="885" stroke="#1f2937" stroke-width="5"/><rect x="520" y="830" width="320" height="110" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="680" y="878" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">DC-AC INVERTER</text><text x="680" y="920" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">ac tie, if any</text><circle cx="840" cy="830" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="840" y="841" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><rect x="60" y="1010" width="780" height="72" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1058" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">NOT 710, NOT 705 — Article 712 owns it</text><text x="70" y="1160" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">1  One dc bus ties sources and loads</text><text x="70" y="1206" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">2  Directory: service + sources (712.10)</text><text x="70" y="1252" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">3  Ac loads fed through dc-ac inverters</text></svg>