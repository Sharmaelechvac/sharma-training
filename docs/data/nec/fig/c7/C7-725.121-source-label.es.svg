<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">La fuente es el documento del circuito</title><desc id="d">Acercamiento de la etiqueta de una fuente de energía Clase 2 listada, las cuatro fuentes que 725.121 reconoce con marcas verdes, y un adaptador de pared sin marcar tachado por no ser una fuente Clase 2.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La fuente es el documento del circuito</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La clase empieza en la fuente (725.121)</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 725.121</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><circle cx="120" cy="250" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="120" y="262" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><rect x="190" y="200" width="520" height="250" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="450" y="266" font-size="44" font-weight="800" fill="#264387" text-anchor="middle">LISTADO</text><text x="450" y="322" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">FUENTE CLASE 2</text><text x="450" y="372" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Marcado como la fuente Clase 2</text><text x="450" y="416" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Marca de listado en el equipo</text><text x="40" y="540" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Fuentes que 725.121 reconoce</text><circle cx="70" cy="599" r="20" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="610" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="110" y="610" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Transformador Clase 2 o Clase 3 listado</text><circle cx="70" cy="674" r="20" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="685" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="110" y="685" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Fuente de energía Clase 2 o Clase 3 listada</text><circle cx="70" cy="749" r="20" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="760" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="110" y="760" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Otro equipo listado marcado como fuente</text><circle cx="70" cy="824" r="20" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="70" y="835" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text><text x="110" y="835" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Las fuentes de batería seca que nombra</text><rect x="40" y="930" width="820" height="215" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="990" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">✗ NO ES UNA FUENTE CLASE 2</text><text x="70" y="1040" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Adaptador sin marcar o transformador cualquiera.</text><text x="70" y="1080" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Sin listado, sin marcado:</text><text x="70" y="1120" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">el tramo no es Clase 2.</text><text x="450" y="1210" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Fotografíe la etiqueta para el registro.</text></svg>