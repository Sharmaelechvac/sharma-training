<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Artículo 725: la fuente hace la clase</title><desc id="d">Tres cajas de fuente de energía rotuladas Clase 1, Clase 2 y Clase 3, todas alimentando el mismo termostato. La caja Clase 2 está resaltada en dorado. Texto debajo: la clase viene de la fuente de energía, nunca del cable.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Artículo 725: la fuente hace la clase</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El mismo termostato. Tres clases posibles.</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 725.2, Article 725</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="35" y="230" width="270" height="250" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="170" y="292" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">CLASE 1</text><text x="170" y="348" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Sin límite</text><text x="170" y="392" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Hasta 600 V</text><text x="170" y="436" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Como potencia</text><line x1="170" y1="480" x2="450" y2="640" stroke="#1f2937" stroke-width="4"/><rect x="315" y="230" width="270" height="250" rx="12" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="450" y="292" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">CLASE 2</text><text x="450" y="348" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Por la fuente</text><text x="450" y="392" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Seguro vs. ambos</text><text x="450" y="436" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">Mayoría: controles</text><line x1="450" y1="480" x2="450" y2="640" stroke="#1f2937" stroke-width="4"/><rect x="595" y="230" width="270" height="250" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="730" y="292" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">CLASE 3</text><text x="730" y="348" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Limitado vs. fuego</text><text x="730" y="392" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Más que Clase 2</text><text x="730" y="436" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Contra choque</text><line x1="730" y1="480" x2="450" y2="640" stroke="#1f2937" stroke-width="4"/><rect x="330" y="640" width="240" height="150" rx="12" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="450" cy="700" r="34" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="712" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">T</text><text x="450" y="762" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">TERMOSTATO</text><rect x="90" y="880" width="720" height="100" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="922" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">LA FUENTE HACE LA CLASE</text><text x="450" y="1062" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Cambie la fuente y puede cambiar</text><text x="450" y="1103" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">la clase — y cada regla con ella.</text><text x="450" y="1180" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">El marcado de la chaqueta del cable nunca decide.</text></svg>