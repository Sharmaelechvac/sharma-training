<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">702: dos puertas, nunca ambas abiertas</title><desc id="d">Diagrama unifilar: la red y un generador exterior alimentan un interruptor de transferencia listado sobre un tablero de vivienda. El interruptor puede conectar solo una fuente a la vez, así que el generador nunca puede retroalimentar la red.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">702: dos puertas, nunca ambas abiertas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Reserva opcional: red y generador, un tablero.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.4, 702.5, 702.7</text><rect x="60" y="240" width="330" height="150" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="225" y="302" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">RED PÚBLICA</text><text x="225" y="350" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">fuente normal</text><rect x="510" y="240" width="330" height="150" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="675" y="302" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">GENERADOR</text><text x="675" y="350" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">conjunto exterior</text><line x1="225" y1="390" x2="225" y2="500" stroke="#1f2937" stroke-width="5"/><line x1="225" y1="500" x2="380" y2="500" stroke="#1f2937" stroke-width="5"/><line x1="380" y1="500" x2="380" y2="560" stroke="#1f2937" stroke-width="5"/><line x1="675" y1="390" x2="675" y2="500" stroke="#1f2937" stroke-width="5"/><line x1="675" y1="500" x2="520" y2="500" stroke="#1f2937" stroke-width="5"/><line x1="520" y1="500" x2="520" y2="560" stroke="#1f2937" stroke-width="5"/><rect x="280" y="560" width="340" height="210" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="450" y="616" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">INT. TRANSFER.</text><text x="450" y="658" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">(listado)</text><rect x="330" y="690" width="90" height="56" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="375" y="728" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">ENC.</text><rect x="480" y="690" width="90" height="56" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="525" y="728" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">APAG.</text><line x1="450" y1="770" x2="450" y2="880" stroke="#1f2937" stroke-width="5"/><rect x="280" y="880" width="340" height="170" rx="10" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="450" y="946" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">TABLERO CASA</text><text x="450" y="996" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">las cargas del 702</text><rect x="90" y="1120" width="720" height="96" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="450" y="1158" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">NUNCA AMBAS FUENTES A LA VEZ</text><text x="450" y="1280" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Letrero en la acometida: una fuente de reserva</text><text x="450" y="1320" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">está en el predio (702.7).</text></svg>