<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The three standby tiers</title><desc id="d">Three stacked bands comparing the standby tiers: Article 700 emergency at 10 seconds, Article 701 legally required standby at 60 seconds, and Article 702 optional standby with no set time, with example loads for each.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The three standby tiers</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Who requires it sets the rules</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Articles 700, 701, 702</text><rect x="60" y="205" width="780" height="170" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="100" y="277" font-size="48" font-weight="900" fill="#1a2f61" text-anchor="start">700</text><text x="215" y="277" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">EMERGENCY</text><text x="100" y="337" font-size="31" font-weight="700" fill="#5b6478" text-anchor="start">egress lighting · exit signs · fire alarm</text><rect x="608" y="243" width="207" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="711.5" y="279" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">10 SECONDS</text><rect x="60" y="415" width="780" height="170" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="100" y="487" font-size="48" font-weight="900" fill="#1a2f61" text-anchor="start">701</text><text x="215" y="487" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">LEGALLY REQUIRED</text><text x="100" y="547" font-size="31" font-weight="700" fill="#5b6478" text-anchor="start">sewage · smoke removal · ventilation</text><rect x="608" y="453" width="207" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="711.5" y="489" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">60 SECONDS</text><rect x="60" y="625" width="780" height="170" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="100" y="697" font-size="48" font-weight="900" fill="#1a2f61" text-anchor="start">702</text><text x="215" y="697" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="start">OPTIONAL</text><text x="100" y="757" font-size="31" font-weight="700" fill="#5b6478" text-anchor="start">fridge · well pump · comfort loads</text><rect x="590" y="663" width="225" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="702.5" y="699" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">NO SET TIME</text><circle cx="60" cy="415" r="27" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="60" y="426" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><rect x="60" y="870" width="780" height="76" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="920" font-size="33" font-weight="900" fill="#ffffff" text-anchor="middle">HIGHER TIER WINS ON A SHARED SOURCE</text><text x="70" y="1030" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">1  Middle tier: required, not emergency</text><text x="70" y="1076" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">The paperwork decides: who required it?</text><text x="70" y="1122" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">No requirement = optional standby (702)</text></svg>