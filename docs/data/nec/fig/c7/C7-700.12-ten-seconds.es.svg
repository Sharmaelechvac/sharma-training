<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Energía en 10 segundos</title><desc id="d">Línea de tiempo que muestra la energía de emergencia debida en 10 segundos, una curva de voltaje de batería que se mantiene sobre el mínimo del 87-1/2 por ciento por 1-1/2 horas, y el deber de combustible de 2 horas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Energía en 10 segundos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Luego debe durar todo el evento</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 700.12</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><text x="50" y="252" font-size="36" font-weight="800" fill="#264387" text-anchor="start">EL RELOJ</text><rect x="90" y="300" width="250" height="56" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><rect x="340" y="300" width="470" height="56" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="215" y="340" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">≤ 10 s</text><text x="575" y="340" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">DEMASIADO TARDE</text><text x="90" y="402" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">0 s</text><text x="340" y="402" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">10 s</text><text x="50" y="512" font-size="36" font-weight="800" fill="#264387" text-anchor="start">EL DEBER DE LA BATERÍA</text><text x="90" y="566" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Cadena nominal de 24 V, carga plena</text><path d="M90,640 L790,676" stroke="#264387" stroke-width="5" fill="none"/><text x="90" y="622" font-size="32" font-weight="700" fill="#264387" text-anchor="start">voltaje de la batería</text><line x1="90" y1="724" x2="810" y2="724" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 8"/><text x="90" y="712" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">Mínimo del 87-1/2% — 21 V en una cadena de 24 V</text><line x1="90" y1="806" x2="790" y2="806" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="440.0" y="794" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">1-1/2 horas a carga plena</text><text x="440.0" y="794" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1-1/2 horas a carga plena</text><text x="50" y="932" font-size="36" font-weight="800" fill="#264387" text-anchor="start">EL DEBER DEL COMBUSTIBLE</text><rect x="90" y="972" width="180" height="160" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="55" y="1032" width="250" height="100" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="180" y="1096" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">COMBUSTIBLE</text><text x="310" y="1028" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Suministro de combustible en sitio</text><text x="310" y="1074" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">≥ 2 horas a demanda plena</text><text x="310" y="1120" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Presente cuando el generador está</text><rect x="50" y="1200" width="800" height="150" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="78" y="1262" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Un incendio, inundación o acto de vandalismo</text><text x="78" y="1308" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">no debe cortar ambos suministros a la vez.</text></svg>