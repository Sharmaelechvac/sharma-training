<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">La derivación del lado de suministro</title><desc id="d">Diagrama unifilar: la red y el medidor alimentan una derivación dorada del lado de suministro; la ruta principal sigue a la desconexión de acometida y al tablero de 200 A, mientras la derivación alimenta una desconexión FV de 50 A, un inversor de 40 A y un arreglo de 9.6 kW.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">La derivación del lado de suministro</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Antes de la desconexión de acometida</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 705.11 · contrast 705.12</text><rect x="50" y="190" width="400" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="250.0" y="246" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">RED PÚBLICA</text><line x1="250" y1="320" x2="250" y2="384" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="50" y="384" width="400" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="250.0" y="440" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">MEDIDOR</text><rect x="30" y="530" width="840" height="160" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="14 8"/><line x1="250" y1="514" x2="250" y2="560" stroke="#1a2f61" stroke-width="5"/><circle cx="250" cy="575" r="17" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><text x="276" y="548" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">DERIVACIÓN</text><text x="450" y="674" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">ANTES DEL PRINC. — DERIVACIÓN</text><text x="450" y="674" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">ANTES DEL PRINC. — DERIVACIÓN</text><line x1="250" y1="592" x2="250" y2="700" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="50" y="700" width="400" height="130" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="250.0" y="756" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DESCONEX. ACOMETIDA</text><line x1="250" y1="830" x2="250" y2="894" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="50" y="894" width="400" height="150" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="250.0" y="950" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">TABLERO 200 A</text><text x="250.0" y="1000" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Reglas de barras de 705.12</text><line x1="267" y1="575" x2="585" y2="575" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="585" y="508" width="285" height="134" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="727.5" y="564" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">DESCONEX. FV</text><text x="727.5" y="614" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Con fusible de 50 A</text><line x1="727" y1="642" x2="727" y2="706" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="585" y="706" width="285" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="727.5" y="762" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">INVERSOR</text><text x="727.5" y="812" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Salida: 40 A</text><line x1="727" y1="836" x2="727" y2="894" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="585" y="894" width="285" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="727.5" y="950" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">ARREGLO FV</text><text x="727.5" y="1000" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">9.6 kW</text><rect x="30" y="1120" width="840" height="100" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="1184" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">ANTES DEL PRINC. = ACOMETIDA</text><rect x="30" y="1250" width="840" height="100" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1312" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">MARQUE AMBAS DESCONEXIONES</text></svg>