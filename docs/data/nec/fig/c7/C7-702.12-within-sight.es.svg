<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Cuando el edificio no necesita desconex.</title><desc id="d">Plano de una vivienda y un generador exterior cuya propia desconexión está a la vista del edificio, acotada visible y a no más de 50 ft, más un caso de entrada portátil de 15 kW o menos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Cuando el edificio no necesita desconex.</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta: la desconexión del generador decide.</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.12, 445.18, 225.36</text><text x="495" y="222" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">A LA VISTA</text><line x1="430" y1="245" x2="545" y2="245" stroke="#264387" stroke-width="4" stroke-dasharray="12 8"/><rect x="70" y="230" width="360" height="300" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="110" y="292" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">CASA</text><rect x="110" y="400" width="170" height="80" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="195" y="452" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">TABLERO</text><text x="100" y="508" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="start">NO NECESITA DESCONEX. EXTRA</text><rect x="545" y="260" width="330" height="190" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="710" y="322" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERADOR</text><text x="710" y="368" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">DESCONEX. PROPIA</text><text x="710" y="412" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">SEGÚN 445.18</text><line x1="280" y1="545" x2="280" y2="622" stroke="#1a2f61" stroke-width="2"/><line x1="710" y1="545" x2="710" y2="622" stroke="#1a2f61" stroke-width="2"/><line x1="280" y1="610" x2="710" y2="610" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="495.0" y="598" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">VISIBLE + A NO MÁS DE 50 FT</text><text x="495.0" y="598" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">VISIBLE + A NO MÁS DE 50 FT</text><rect x="70" y="700" width="790" height="330" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="100" y="762" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PORTÁTIL, 15 kW O MENOS</text><rect x="110" y="810" width="230" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="225" y="855" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">GENERADOR</text><text x="225" y="894" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">12 kW</text><line x1="340" y1="865" x2="520" y2="865" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="520" y="810" width="240" height="110" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="640" y="855" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">CON BRIDA</text><text x="640" y="894" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">ENTRADA</text><text x="450" y="968" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">NO SE NECESITA DESCONEX. DEL EDIFICIO</text><text x="450" y="1008" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">PARA LOS CONDUCTORES SIN PUESTA A TIERRA</text></svg>