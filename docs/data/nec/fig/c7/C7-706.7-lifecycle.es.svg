<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1360" width="900" height="1360" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">706.7 Puesta en servicio + mantenimiento</title><desc id="d">Ciclo de vida de cuatro pasos para un sistema de almacenamiento de energía: instalar, poner en servicio al instalar, entregar los registros, mantenerlo de por vida.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1360" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">706.7 Puesta en servicio + mantenimiento</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El almacenamiento no es equipo de instalar y olvidar</text><line x1="30" y1="1302" x2="870" y2="1302" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1340" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 706.7</text><text x="870" y="1340" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="60" y="200" width="780" height="140" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="118" cy="270" r="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="118" y="282" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="168" y="258" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">INSTALAR</text><text x="168" y="302" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">sistema listado, personas calificadas</text><line x1="450" y1="340" x2="450" y2="385" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="385" width="780" height="140" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="118" cy="455" r="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="118" y="467" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="168" y="443" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">PUESTA EN SERVICIO AL INSTALAR</text><text x="168" y="487" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">pruébelo, verifíquelo, escríbalo</text><line x1="450" y1="525" x2="450" y2="570" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="570" width="780" height="140" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="118" cy="640" r="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="118" y="652" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="168" y="628" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">ENTREGUE LOS REGISTROS</text><text x="168" y="672" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">registros + instrucciones de mantenimiento</text><line x1="450" y1="710" x2="450" y2="755" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="755" width="780" height="140" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="118" cy="825" r="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="118" y="837" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="168" y="813" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">MANTÉNGALO DE POR VIDA</text><text x="168" y="857" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">conexiones, ventilación, firmware</text><rect x="60" y="945" width="780" height="108" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="990" font-size="31" font-weight="700" fill="#1a2f61" text-anchor="middle">La puesta en servicio no se requiere para</text><text x="450" y="1030" font-size="31" font-weight="700" fill="#1a2f61" text-anchor="middle">viviendas de una y dos familias</text><text x="60" y="1125" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">¿Nadie designado para mantenerlo?</text><text x="60" y="1167" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Tenga esa conversación en la venta, no en la falla.</text></svg>