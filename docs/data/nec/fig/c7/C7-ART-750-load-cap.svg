<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Load Management Caps the Load</title><desc id="d">Bar chart comparing an unmanaged peak of 118 A with the managed maximum of 92 A held by the energy management system at the generator limit, plus the shed order for the range, water heater and air conditioner.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Load Management Caps the Load</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Example: 22 kW generator, 200 A service</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.4(B)(2) · Article 750</text><text x="60" y="216" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">ALL LOADS AT ONCE — UNMANAGED</text><rect x="60" y="236" width="699" height="92" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="743" y="296" font-size="40" font-weight="800" fill="#c0392b" text-anchor="end">118 A</text><text x="60" y="396" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">WITH LOAD MANAGEMENT — CAPPED</text><rect x="60" y="416" width="545" height="92" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="589" y="476" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="end">92 A</text><line x1="605" y1="200" x2="605" y2="548" stroke="#c0392b" stroke-width="4" stroke-dasharray="12 8"/><text x="605" y="584" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">GENERATOR LIMIT — 92 A</text><text x="605" y="584" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">GENERATOR LIMIT — 92 A</text><text x="30" y="668" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">SHED ORDER WHEN THE LOAD CLIMBS</text><rect x="30" y="700" width="840" height="92" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="84" cy="746" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="84" y="758" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="134" y="760" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">RANGE</text><rect x="30" y="818" width="840" height="92" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="84" cy="864" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="84" y="876" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="134" y="878" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">WATER HEATER</text><rect x="30" y="936" width="840" height="92" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="84" cy="982" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="84" y="994" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="134" y="996" font-size="38" font-weight="700" fill="#1f2937" text-anchor="start">5-TON AIR CONDITIONER</text><rect x="30" y="1080" width="840" height="120" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="1128" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">THE EMS MANAGES LOADS.</text><text x="450" y="1180" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">BREAKERS STILL PROTECT.</text></svg>