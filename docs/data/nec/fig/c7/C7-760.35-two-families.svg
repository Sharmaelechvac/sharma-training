<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">760.35 — which parts govern?</title><desc id="d">Decision chart: a fire alarm circuit is sorted by whether its power source is power-limited. A non-power-limited circuit (NPLFA) is governed by Parts I and II of Article 760; a power-limited circuit (PLFA) is governed by Parts I and III. Part I general rules apply to both.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">760.35 — which parts govern?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sort the circuit by its power source first</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 760.35, 760.41, 760.121</text><rect x="220" y="200" width="460" height="104" rx="12" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="264" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">FIRE ALARM CIRCUIT</text><line x1="450" y1="304" x2="450" y2="336" stroke="#1a2f61" stroke-width="5"/><path d="M450,336 L648,452 L450,568 L252,452 Z" stroke="#264387" stroke-width="4" fill="#fdf3e0"/><text x="450" y="442" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">POWER-LIMITED</text><text x="450" y="482" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">SOURCE?</text><path d="M252,452 H140 V640" stroke="#1a2f61" stroke-width="4" fill="none"/><path d="M648,452 H760 V640" stroke="#1a2f61" stroke-width="4" fill="none"/><rect x="120" y="388" width="61" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="150.5" y="422" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">NO</text><rect x="716" y="388" width="78" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="755.0" y="422" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">YES</text><rect x="40" y="640" width="400" height="190" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="240" y="706" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="middle">NPLFA</text><text x="240" y="756" font-size="34" font-weight="900" fill="#1f2937" text-anchor="middle">PART I + PART II</text><text x="240" y="800" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">source rule: 760.41</text><rect x="460" y="640" width="400" height="190" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="660" y="706" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="middle">PLFA</text><text x="660" y="756" font-size="34" font-weight="900" fill="#1f2937" text-anchor="middle">PART I + PART III</text><text x="660" y="800" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">source rule: 760.121</text><rect x="40" y="890" width="820" height="96" rx="10" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="950" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">PART I — GENERAL RULES APPLY TO BOTH</text><rect x="40" y="1030" width="820" height="110" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1078" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">READING THE WRONG PART IS THE</text><text x="450" y="1120" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">CLASSIC ARTICLE 760 ERROR</text></svg>