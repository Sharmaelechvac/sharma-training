<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Battery Circuit Sizing</title><desc id="d">One-line of an energy storage circuit: battery bank through a DC-listed fuse to the ESS inverter, then through a 50 A breaker (40 A nameplate times 125 percent) to the panelboard, with a warning that an AC-only breaker on the DC side is not protection.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Battery Circuit Sizing</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Currents from the nameplate; dc devices listed for dc</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 706.30, 706.31</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="250" y="205" width="400" height="100" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="268" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">BATTERY BANK (DC)</text><line x1="450" y1="305" x2="450" y2="385" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="300" y="385" width="300" height="90" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="442" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DC-LISTED FUSE</text><line x1="450" y1="475" x2="450" y2="555" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="250" y="555" width="400" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="605" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">ESS INVERTER</text><text x="450" y="645" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">NAMEPLATE: 40 A AC OUT</text><line x1="450" y1="665" x2="450" y2="745" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="300" y="745" width="300" height="90" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="802" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">AC BREAKER 50 A</text><line x1="450" y1="835" x2="450" y2="915" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="250" y="915" width="400" height="100" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="978" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PANELBOARD</text><circle cx="648" cy="430" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="648" y="442" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="690" cy="610" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="690" y="622" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="648" cy="790" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="648" y="802" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="648" cy="875" r="27" fill="#F0A846" stroke="#ffffff" stroke-width="4"/><text x="648" y="887" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="60" y="1115" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">HOW THE NUMBERS ARE SET</text><text x="60" y="1170" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  DC device: listed for dc duty</text><text x="60" y="1216" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  Currents come from the nameplate</text><text x="60" y="1262" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  OCPD at 125%: 40 A × 1.25 = 50 A</text><text x="60" y="1308" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4  Conductors sized to the OCPD</text><rect x="40" y="1330" width="820" height="130" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1390" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">AC-ONLY BREAKER ON DC = NO PROTECTION</text><text x="450" y="1436" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">It cannot clear a dc arc — 706.31(C).</text></svg>