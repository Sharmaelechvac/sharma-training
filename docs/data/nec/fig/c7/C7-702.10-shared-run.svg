<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">702 May Share the Run</title><desc id="d">House standby installation: a generator outside feeding a shared gutter and a 200 A panel where normal and standby circuits occupy the same enclosures, with a marker noting the panel directory identifies the standby circuits, and a warning that the same run on a 700 system is a violation.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">702 May Share the Run</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">House standby install — NEC 702.10</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 702.10</text><text x="870" y="1460" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="300" width="250" height="150" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="185" y="364" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERATOR</text><text x="185" y="408" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">standby source</text><line x1="380" y1="240" x2="380" y2="1000" stroke="#264387" stroke-width="6"/><text x="392" y="232" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">HOUSE</text><line x1="310" y1="375" x2="560" y2="375" stroke="#1f2937" stroke-width="4" stroke-dasharray="10 8"/><rect x="560" y="290" width="280" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="700" y="346" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">SHARED GUTTER</text><text x="700" y="390" font-size="30" font-weight="700" fill="#2e7d32" text-anchor="middle">normal + standby ✓</text><line x1="700" y1="410" x2="700" y2="470" stroke="#1f2937" stroke-width="4"/><rect x="520" y="470" width="320" height="560" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="520" y="470" width="320" height="66" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="680" y="514" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">PANEL · 200 A</text><text x="545" y="592" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">NORMAL CIRCUITS</text><text x="545" y="644" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Lights</text><text x="545" y="694" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Receptacles</text><rect x="530" y="730" width="300" height="240" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="680" y="778" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">STANDBY CIRCUITS</text><text x="565" y="830" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Refrigerator</text><text x="565" y="880" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Well pump</text><text x="565" y="930" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Kitchen lights</text><circle cx="548" cy="350" r="21" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="548" y="361" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="60" y="580" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">One trench out,</text><text x="60" y="619" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">one gutter in —</text><text x="60" y="658" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">702.10 permits it.</text><text x="60" y="1120" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">1 — Directory marks the standby circuits</text><rect x="60" y="1190" width="780" height="170" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1260" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Same run, Article 700 system:</text><text x="450" y="1312" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">a violation — 700 stays independent</text></svg>