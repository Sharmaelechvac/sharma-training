ESTADO VERIFICADO</text><rect x="470" y="210" width="390" height="830" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="665" y="268" font-size="40" font-weight="800" fill="#c0392b" text-anchor="middle">INCORRECTO</text><text x="620" y="335" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">EMERGENCIA</text><text x="620" y="377" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><rect x="515" y="400" width="210" height="500" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><rect x="540" y="445" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="540" y="533" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="540" y="621" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="540" y="709" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="540" y="797" width="160" height="56" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/><rect x="742" y="770" width="105" height="120" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="794" y="845" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">DPS</text><path d="M 725 700 L 740 682 L 755 718 L 770 682 L 785 718 L 794 700 L 794 770" stroke="#c0392b" stroke-width="5" fill="none"/><text x="665" y="962" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">CABLE ENROLLADO</text><text x="665" y="1004" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">= IMPEDANCIA AÑADIDA</text><rect x="40" y="1100" width="820" height="160" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="65" y="1162" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Un DPS muerto no protege nada — revise su</text><text x="65" y="1212" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">la luz de estado en las rondas del 7