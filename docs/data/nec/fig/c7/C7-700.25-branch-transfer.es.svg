<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">700.25 Transferencia de circuito derivado</title><desc id="d">Diagrama unifilar: un circuito derivado normal y un circuito derivado de emergencia alimentan un interruptor de transferencia listado de iluminación de emergencia de circuito derivado, cuyo lado de carga alimenta las luminarias de evacuación de un pasillo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">700.25 Transferencia de circuito derivado</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La transferencia ocurre en el circuito de iluminación.</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 700.25</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Libro de Campo Sharma</text><rect x="50" y="260" width="330" height="140" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="215" y="318" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">NORMAL</text><text x="215" y="364" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">circuito derivado</text><rect x="50" y="520" width="330" height="140" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="215" y="578" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">EMERGENCIA</text><text x="215" y="624" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">circuito derivado</text><line x1="380" y1="330" x2="430" y2="330" stroke="#1f2937" stroke-width="5"/><line x1="430" y1="330" x2="430" y2="420" stroke="#1f2937" stroke-width="5"/><line x1="380" y1="590" x2="430" y2="590" stroke="#1f2937" stroke-width="5"/><line x1="430" y1="590" x2="430" y2="500" stroke="#1f2937" stroke-width="5"/><rect x="430" y="420" width="210" height="160" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="535" y="478" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">LISTADO</text><text x="535" y="522" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">BCELTS</text><text x="535" y="562" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">UL 1008</text><line x1="640" y1="500" x2="688" y2="500" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><circle cx="715" cy="470" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="758" cy="470" r="19" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="736" y="545" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">LUCES EVAC.</text><text x="736" y="588" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">un pasillo</text><rect x="50" y="730" width="800" height="110" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="772" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="middle">SOLO CARGAS DE ILUMINACIÓN EMERG.</text><text x="450" y="812" font-size="33" font-weight="900" fill="#1a2f61" text-anchor="middle">Circuitos derivados de 20 A máx.</text><rect x="50" y="880" width="800" height="130" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="932" font-size="33" font-weight="900" fill="#c0392b" text-anchor="middle">Un ALCR (700.26) fuerza las luces.</text><text x="450" y="972" font-size="33" font-weight="900" fill="#c0392b" text-anchor="middle">NO es equipo de transferencia.</text><text x="50" y="1110" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Cuando el circuito normal falla, el interruptor</text><text x="50" y="1150" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">mueve la carga al circuito de emergencia.</text></svg>