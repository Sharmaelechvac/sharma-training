<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Is it a COPS job?</title><desc id="d">Decision diagram: Article 708 applies only when an AHJ or governmental authority has designated the facility a critical operations area; the yes branch lists the added duties, the no branch sends the design back to Articles 700, 701 or 702.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Is it a COPS job?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">It starts with a designation, not equipment</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 708 · 708.4 · 708.22(C)</text><rect x="60" y="200" width="780" height="170" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="252" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Has an AHJ or governmental authority</text><text x="450" y="296" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">designated this facility, or an area</text><text x="450" y="340" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">in it, as a critical operations area?</text><line x1="450" y1="370" x2="450" y2="420" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="420" width="820" height="320" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="40" y="740" width="820" height="320" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="478" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="start">YES — ARTICLE 708 APPLIES</text><text x="70" y="536" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Risk assessment, documented (708.4)</text><text x="70" y="578" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Physical security plan (708.5)</text><text x="70" y="620" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Alternate source: 72 hr at full load</text><text x="70" y="662" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Documented testing + maintenance</text><text x="70" y="798" font-size="38" font-weight="800" fill="#c0392b" text-anchor="start">NO — NOT A COPS JOB</text><text x="70" y="856" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Design under Article 700, 701 or 702</text><text x="70" y="898" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• A big generator alone does not</text><text x="70" y="940" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  make a job a 708 job</text><text x="70" y="982" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• The designation is the authority's call</text><rect x="40" y="1110" width="820" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1158" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Get the designation in writing</text><text x="450" y="1200" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">before you bid the job.</text></svg>