<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Load-side math: the 120% rule</title><desc id="d">Panelboard sketch with the utility main at the top of a 200 amp busbar and a 40 amp solar breaker at the opposite end, beside the 120 percent rule arithmetic for the same panel and a supply-side tap note.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Load-side math: the 120% rule</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked example on a 200 A panel</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 705.11 · 705.12(B)(3)</text><rect x="40" y="200" width="380" height="700" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="230" y="250" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">UTILITY</text><line x1="230" y1="262" x2="230" y2="300" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="110" y="300" width="240" height="70" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="230" y="345" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">MAIN 200 A</text><line x1="230" y1="370" x2="230" y2="770" stroke="#264387" stroke-width="6"/><line x1="230" y1="453" x2="250" y2="453" stroke="#264387" stroke-width="3"/><rect x="250" y="430" width="120" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="310" y="462" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">LIGHTS</text><line x1="230" y1="533" x2="250" y2="533" stroke="#264387" stroke-width="3"/><rect x="250" y="510" width="120" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="310" y="542" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">HVAC</text><line x1="230" y1="613" x2="250" y2="613" stroke="#264387" stroke-width="3"/><rect x="250" y="590" width="120" height="46" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="310" y="622" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">RANGE</text><rect x="110" y="770" width="240" height="90" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="230" y="808" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PV BREAKER</text><text x="230" y="844" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">40 A</text><text x="230" y="884" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">At the opposite end</text><rect x="460" y="200" width="400" height="700" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="490" y="258" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">THE MATH</text><text x="490" y="320" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Busbar rating: 200 A</text><text x="490" y="366" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">120% × 200 A = 240 A</text><text x="490" y="412" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">240 A − 200 A main</text><text x="490" y="458" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">= 40 A of room</text><text x="490" y="504" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">40 A ÷ 125% = 32 A</text><text x="490" y="550" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">max inverter output</text><text x="490" y="596" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Breaker: 40 A</text><text x="490" y="642" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">at the far end</text><text x="490" y="730" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">Do not relocate</text><text x="490" y="770" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">this breaker.</text><rect x="40" y="950" width="820" height="200" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="70" y="1010" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">SUPPLY SIDE — 705.11</text><text x="70" y="1062" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Tap ahead of the main disconnect.</text><text x="70" y="1106" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">No busbar math; service rules apply.</text></svg>