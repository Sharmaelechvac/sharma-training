 stroke-width="3" stroke-dasharray="12 8"/><text x="590" y="420" font-size="32" font-weight="800" fill="#5b6478" text-anchor="middle">TABLERO</text><text x="590" y="460" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">INTERIOR</text><rect x="725" y="610" width="130" height="150" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="790" y="672" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">ENTRADA</text><text x="790" y="712" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CAJA</text><rect x="715" y="470" width="150" height="90" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="790" y="528" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">LETRERO 2</text><circle cx="790" cy="405" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="790" y="418" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><line x1="790" y1="560" x2="790" y2="610" stroke="#1f2937" stroke-width="4"/><line x1="40" y1="935" x2="860" y2="935" stroke="#1f2937" stroke-width="5"/><rect x="680" y="795" width="200" height="140" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="780" y="855" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">PORTÁTIL</text><text x="780" y="895" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">GENERADOR</text><line x1="790" y1="760" x2="790" y2="795" stroke="#1f2937" stroke-width="5"/><text x="700" y="990" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">EXTERIOR</text><text x="60" y="1080" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1  LETRERO DE ACOMETIDA — tipo + ubicación</text><text x="60" y="1126" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">     fuente de reserva en el sitio.</text><text x="60" y="1172" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">2  LETRERO DE ENTRADA — solo neutro unido, o</text><text x="60" y="1218" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">     solo neutro flotante.</text><rect x="60" y="1270" width="780" height="10" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="60" y="1330" font-size="33" font-weight="600" fill="#5b6478" text-anchor="start">Verifique la unión del neutro del generador</text><text x="60" y="1372" font-size="33" font-weight="600" fill="#5b6478" text-anchor="start">usted rotula el letrero de entrada.</text></svg>