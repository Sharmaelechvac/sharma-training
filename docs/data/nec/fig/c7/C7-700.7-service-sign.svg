<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" width="900" height="1440" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The sign at the service</title><desc id="d">Elevation of service equipment with the required sign beside it stating the emergency source type and location, with OK and fail examples.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1440" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The sign at the service</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Type of source + where it is — 700.7</text><line x1="30" y1="1382" x2="870" y2="1382" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 700.7; compare 702.7</text><rect x="50" y="230" width="330" height="380" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="215" y="292" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">SERVICE</text><text x="215" y="338" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">EQUIPMENT</text><circle cx="215" cy="448" r="52" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="215" y="460" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">kWh</text><text x="215" y="572" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">MAIN DISCONNECT</text><rect x="450" y="230" width="400" height="380" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="5"/><text x="472" y="298" font-size="32" font-weight="800" fill="#264387" text-anchor="start">EMERGENCY SOURCE</text><circle cx="494" cy="366" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="494" y="378" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="534" y="356" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">TYPE</text><text x="534" y="398" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">GENERATOR</text><circle cx="494" cy="476" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="494" y="488" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="534" y="466" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">LOCATION</text><text x="534" y="508" font-size="36" font-weight="800" fill="#1f2937" text-anchor="start">REAR PAD</text><text x="478" y="578" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Permanent and legible</text><circle cx="74" cy="692" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="74" y="704" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="114" y="702" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Type of on-site emergency source</text><circle cx="74" cy="762" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="74" y="774" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="114" y="772" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Where that source is located</text><rect x="50" y="830" width="800" height="190" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="78" y="892" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">OK — THE SIGN DOES ITS JOB</text><text x="78" y="946" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Permanent, legible, at the service.</text><text x="78" y="990" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">A stranger can walk straight to it.</text><rect x="50" y="1060" width="800" height="190" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="78" y="1122" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">FAIL — WRITTEN UP</text><text x="78" y="1176" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">“GENERATOR” with no location.</text><text x="78" y="1220" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Paper label, faded or peeling.</text></svg>