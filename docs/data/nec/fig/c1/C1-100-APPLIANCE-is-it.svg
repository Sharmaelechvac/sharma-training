<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Is it an appliance?</title><desc id="d">Decision chart: utilization equipment built as a unit that does a household job is an appliance; a luminaire, a motor alone, or a receptacle outlet is not.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Is it an appliance?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Article 100: utilization equipment built as a unit</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100, Article 422</text><rect x="170" y="196" width="560" height="110" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="248" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">UTILIZATION EQUIPMENT</text><text x="450" y="290" font-size="34" font-weight="700" fill="#F0A846" text-anchor="middle">built as one unit</text><line x1="450" y1="306" x2="450" y2="356" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="120" y="360" width="660" height="120" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="414" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">Does a household-type job?</text><text x="450" y="458" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">cook - wash - dry - heat - cool</text><line x1="450" y1="480" x2="450" y2="520" stroke="#1a2f61" stroke-width="4"/><line x1="240" y1="520" x2="660" y2="520" stroke="#1a2f61" stroke-width="4"/><line x1="240" y1="520" x2="240" y2="566" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="660" y1="520" x2="660" y2="566" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="570" width="400" height="400" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="240" y="622" font-size="38" font-weight="900" fill="#2e7d32" text-anchor="middle">YES - APPLIANCE</text><text x="70" y="682" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Dishwasher</text><text x="70" y="726" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Range, cooktop</text><text x="70" y="770" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Dryer</text><text x="70" y="814" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Disposal</text><text x="70" y="858" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Built-in microwave</text><text x="70" y="902" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Water heater</text><rect x="460" y="570" width="400" height="400" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="660" y="622" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">NOT BY ITSELF</text><text x="490" y="682" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">A luminaire alone</text><text x="490" y="726" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">A motor alone</text><text x="490" y="770" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Receptacle outlet</text><text x="490" y="850" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">Each one has</text><text x="490" y="890" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">its own article</text><rect x="40" y="1010" width="820" height="130" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="1066" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">Appliance? Article 422 switches on</text><text x="450" y="1112" font-size="34" font-weight="700" fill="#F0A846" text-anchor="middle">sizing - protection - GFCI list</text></svg>