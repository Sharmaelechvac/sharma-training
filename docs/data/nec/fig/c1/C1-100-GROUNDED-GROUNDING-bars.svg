<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Grounded vs grounding — the bars</title><desc id="d">Service panel with neutral bar and ground bar joined by the main bonding jumper, GEC running to ground rods, and a subpanel below with the bars kept separate and a red X over a bonding screw.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Grounded vs grounding — the bars</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">White works daily; green/bare only on a fault</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Art. 100, 250.24</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="196" width="780" height="520" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="252" font-size="38" font-weight="900" fill="#264387" text-anchor="middle">SERVICE PANEL</text><rect x="170" y="300" width="56" height="300" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="110" y1="330" x2="170" y2="330" stroke="#1f2937" stroke-width="5"/><line x1="110" y1="240" x2="110" y2="330" stroke="#1f2937" stroke-width="5"/><line x1="110" y1="392" x2="170" y2="392" stroke="#1f2937" stroke-width="5"/><line x1="110" y1="240" x2="110" y2="392" stroke="#1f2937" stroke-width="5"/><line x1="110" y1="454" x2="170" y2="454" stroke="#1f2937" stroke-width="5"/><line x1="110" y1="240" x2="110" y2="454" stroke="#1f2937" stroke-width="5"/><line x1="110" y1="516" x2="170" y2="516" stroke="#1f2937" stroke-width="5"/><line x1="110" y1="240" x2="110" y2="516" stroke="#1f2937" stroke-width="5"/><text x="110" y="232" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start"></text><text x="198" y="648" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">NEUTRAL BAR</text><rect x="674" y="300" width="56" height="300" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="730" y1="330" x2="790" y2="330" stroke="#2e7d32" stroke-width="5"/><line x1="790" y1="240" x2="790" y2="330" stroke="#2e7d32" stroke-width="5"/><line x1="730" y1="392" x2="790" y2="392" stroke="#2e7d32" stroke-width="5"/><line x1="790" y1="240" x2="790" y2="392" stroke="#2e7d32" stroke-width="5"/><line x1="730" y1="454" x2="790" y2="454" stroke="#2e7d32" stroke-width="5"/><line x1="790" y1="240" x2="790" y2="454" stroke="#2e7d32" stroke-width="5"/><line x1="730" y1="516" x2="790" y2="516" stroke="#2e7d32" stroke-width="5"/><line x1="790" y1="240" x2="790" y2="516" stroke="#2e7d32" stroke-width="5"/><text x="702" y="648" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">GROUND BAR</text><rect x="226" y="420" width="448" height="44" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="450" y="452" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">MAIN BONDING JUMPER</text><line x1="702" y1="600" x2="702" y2="716" stroke="#1f2937" stroke-width="5"/><line x1="702" y1="716" x2="702" y2="760" stroke="#1f2937" stroke-width="5"/><path d="M672,760 L732,760 L702,806 z" stroke="#1f2937" stroke-width="4" fill="#1f2937"/><text x="716" y="800" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">GEC to rods</text><rect x="60" y="856" width="780" height="340" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><text x="450" y="912" font-size="38" font-weight="900" fill="#264387" text-anchor="middle">SUBPANEL — downstream</text><rect x="240" y="950" width="48" height="150" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><rect x="612" y="950" width="48" height="150" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="264" y="1136" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">neutral bar</text><text x="264" y="1174" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">isolated</text><text x="636" y="1136" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">ground bar</text><text x="636" y="1174" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">EGCs only</text><line x1="386" y1="990" x2="514" y2="1060" stroke="#c0392b" stroke-width="8"/><line x1="514" y1="990" x2="386" y2="1060" stroke="#c0392b" stroke-width="8"/><text x="450" y="970" font-size="32" font-weight="900" fill="#c0392b" text-anchor="middle">NO BOND HERE</text><circle cx="52" cy="1240" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="1251" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="86" y="1252" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">GROUNDED conductor: white, carries load current</text><circle cx="52" cy="1286" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="1297" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="86" y="1298" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">GROUNDING conductors: green / bare, fault only</text><circle cx="52" cy="1332" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="1343" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="86" y="1344" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Bonded together once — at the service only</text><circle cx="52" cy="1378" r="19" fill="#c0392b" stroke="#1a2f61" stroke-width="2"/><text x="52" y="1389" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">4</text><text x="86" y="1390" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">Downstream: bars separate, no bonding screw</text></svg>