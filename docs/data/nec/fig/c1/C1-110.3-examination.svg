<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.3 — The examination gate</title><desc id="d">Flow diagram: equipment reaches a gate where the seven 110.3(A) considerations are checked, then exits to install per instructions if it passes, or do not install if it fails any one.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.3 — The examination gate</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Seven things weighed before gear goes in</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.3(A)</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="200" y="200" width="500" height="95" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="260" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">EQUIPMENT — ANY JOB</text><line x1="450" y1="295" x2="450" y2="340" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="140" y="345" width="620" height="85" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="450" y="400" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">EXAMINED UNDER 110.3(A)</text><circle cx="70" cy="498" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="510" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="115" y="510" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Suitability for the location</text><circle cx="70" cy="574" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="586" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="115" y="586" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Mechanical strength</text><circle cx="70" cy="650" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="662" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="115" y="662" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Wire-bending space</text><circle cx="70" cy="726" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="738" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="115" y="738" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Electrical insulation</text><circle cx="70" cy="802" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="814" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">5</text><text x="115" y="814" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Heating effects</text><circle cx="70" cy="878" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="890" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">6</text><text x="115" y="890" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Arcing effects</text><circle cx="70" cy="954" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="966" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">7</text><text x="115" y="966" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Type, size, voltage, current</text><rect x="40" y="1090" width="820" height="130" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1145" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">PASSES</text><text x="450" y="1195" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Install and use per its instructions — 110.3(B)</text><rect x="40" y="1255" width="820" height="130" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1310" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">FAILS ANY ONE</text><text x="450" y="1360" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Do not install it there</text></svg>