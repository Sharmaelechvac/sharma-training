<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Conductor area, drawn to scale</title><desc id="d">Four conductor cross-sections drawn to scale by circular-mil area: 12 AWG, 8 AWG, 4 AWG and 4/0 AWG, showing how fast the metal area grows as the AWG number falls.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1200" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Conductor area, drawn to scale</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Circles sized by circular-mil area (Ch. 9, Table 8)</text><line x1="30" y1="1142" x2="870" y2="1142" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1180" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.6; Chapter 9, Table 8</text><circle cx="74" cy="470" r="33.939534469406034" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="74" cy="470" r="6.109116204493086" fill="#F0A846" stroke="#264387" stroke-width="2"/><circle cx="190" cy="470" r="53.966322831929176" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="190" cy="470" r="9.713938109747252" fill="#F0A846" stroke="#264387" stroke-width="2"/><circle cx="358" cy="470" r="85.8075521151839" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="358" cy="470" r="15.4453593807331" fill="#F0A846" stroke="#264387" stroke-width="2"/><circle cx="665" cy="470" r="193.2" fill="#eef2f9" stroke="#264387" stroke-width="4"/><circle cx="665" cy="470" r="34.775999999999996" fill="#F0A846" stroke="#264387" stroke-width="2"/><text x="20" y="715" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">12 AWG</text><text x="20" y="759" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">6,530 cmil</text><text x="190" y="805" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">8 AWG</text><text x="190" y="849" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">16,510 cmil</text><text x="358" y="715" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4 AWG</text><text x="358" y="759" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">41,740 cmil</text><text x="665" y="715" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4/0 AWG</text><text x="665" y="759" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">211,600 cmil</text><rect x="60" y="895" width="780" height="74" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="943" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Area roughly doubles every 3 AWG sizes</text><text x="450" y="1013" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Above 4/0, sizes are kcmil: 500 kcmil = 500,000 cmil</text><rect x="60" y="1040" width="780" height="74" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1088" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Size is not ampacity — check the tables</text></svg>