<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">El alimentador es la capa del medio</title><desc id="d">Diagrama unifilar: el equipo de acometida arriba, una banda dorada del alimentador que baja a un subtablero con los dispositivos finales de sobrecorriente y tres circuitos ramales que salen del subtablero hacia las salidas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">El alimentador: capa del medio</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Acometida, alimentador, circuitos ramales</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100 — Feeder; 215</text><rect x="228" y="210" width="444" height="115" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="262" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">EQUIPO DE ACOMETIDA</text><text x="450" y="305" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">el tablero principal</text><line x1="450" y1="325" x2="450" y2="375" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="385" width="680" height="315" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><line x1="190" y1="385" x2="190" y2="700" stroke="#264387" stroke-width="5"/><line x1="710" y1="385" x2="710" y2="700" stroke="#264387" stroke-width="5"/><text x="450" y="478" font-size="44" font-weight="800" fill="#1a2f61" text-anchor="middle">ALIMENTADOR</text><text x="450" y="540" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">desde el equipo de acometida</text><text x="450" y="586" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">hasta los dispositivos finales</text><text x="450" y="632" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">de sobrecorriente del ramal</text><line x1="450" y1="700" x2="450" y2="750" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="250" y="760" width="400" height="115" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="812" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">SUBTABLERO</text><text x="450" y="855" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">aquí van los OCPD finales</text><line x1="450" y1="875" x2="450" y2="920" stroke="#1a2f61" stroke-width="4"/><line x1="166" y1="920" x2="734" y2="920" stroke="#1a2f61" stroke-width="4"/><line x1="166" y1="920" x2="166" y2="955" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="450" y1="920" x2="450" y2="955" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="734" y1="920" x2="734" y2="955" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="965" width="254" height="155" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="167" y="1025" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">RAMAL</text><text x="167" y="1067" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">CIRCUITO</text><text x="167" y="1107" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">a las salidas</text><rect x="323" y="965" width="254" height="155" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="1025" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">RAMAL</text><text x="450" y="1067" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">CIRCUITO</text><text x="450" y="1107" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">a las salidas</text><rect x="606" y="965" width="254" height="155" rx="8" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="733" y="1025" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">RAMAL</text><text x="733" y="1067" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">CIRCUITO</text><text x="733" y="1107" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">a las salidas</text><text x="450" y="1200" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Los circuitos ramales terminan en las salidas.</text></svg>