<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Bonding: the fault path home</title><desc id="d">A metal box and raceway bonded back to the panel: a fault to the box flows home on the gold bonding path and trips the breaker, while the ground rod path to earth below is a separate job that does not clear faults.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Bonding: the fault path home</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Bonding brings the fault home on metal</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100; 250.8, 250.90</text><rect x="60" y="250" width="210" height="300" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="165" y="330" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">PANEL</text><rect x="95" y="370" width="140" height="90" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="165" y="428" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">20 A</text><text x="165" y="510" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">breaker</text><line x1="270" y1="330" x2="620" y2="330" stroke="#1f2937" stroke-width="6"/><line x1="270" y1="380" x2="620" y2="380" stroke="#1f2937" stroke-width="6"/><text x="445" y="306" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">metal raceway</text><rect x="620" y="250" width="220" height="300" rx="6" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="730" y="300" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">METAL BOX</text><path d="M690,350 L726,350 L700,394 L742,394 L712,442" stroke="#c0392b" stroke-width="7" fill="none"/><text x="730" y="492" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">fault: hot wire</text><text x="730" y="524" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">hits the box</text><line x1="616" y1="355" x2="286" y2="355" stroke="#F0A846" stroke-width="10" marker-end="url(#ah)"/><text x="450" y="616" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">BONDING PATH</text><text x="450" y="662" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">fault current flows home on metal</text><text x="450" y="706" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">breaker trips — the fault clears fast</text><rect x="60" y="750" width="780" height="150" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="812" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Broken by paint or a loose locknut:</text><text x="450" y="860" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">the box stays live — nothing trips.</text><rect x="60" y="950" width="780" height="330" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><line x1="165" y1="550" x2="165" y2="1070" stroke="#1a2f61" stroke-width="4" stroke-dasharray="10 8"/><text x="196" y="1016" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">GEC</text><rect x="60" y="1140" width="780" height="140" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="2"/><line x1="165" y1="1070" x2="165" y2="1200" stroke="#1f2937" stroke-width="7"/><line x1="120" y1="1200" x2="210" y2="1200" stroke="#1f2937" stroke-width="7"/><line x1="132" y1="1232" x2="198" y2="1232" stroke="#1f2937" stroke-width="7"/><line x1="145" y1="1262" x2="185" y2="1262" stroke="#1f2937" stroke-width="7"/><text x="520" y="1042" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">GROUNDING ELECTRODE</text><text x="520" y="1092" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">a different job — earth alone</text><text x="520" y="1218" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">will not trip a breaker</text></svg>