<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Prove it before you energize it</title><desc id="d">Flow chart of the three wiring-integrity checks before energizing: short circuits, ground faults, and stray ground connections, ending in energize if all clear or stop and fix if any hit.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Prove it before you energize it</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">110.7 — the completed wiring must be clean</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.7; 110.12(B)</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="70" y="200" width="760" height="120" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="252" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TEST 1 — SHORT CIRCUITS</text><text x="450" y="298" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Continuity check, conductor to conductor</text><line x1="450" y1="320" x2="450" y2="356" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="360" width="760" height="120" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="412" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TEST 2 — GROUND FAULTS</text><text x="450" y="458" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Insulation check, conductor to ground</text><line x1="450" y1="480" x2="450" y2="516" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="520" width="760" height="120" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="572" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TEST 3 — STRAY GROUNDS</text><text x="450" y="618" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Ground only where the Code permits</text><line x1="450" y1="640" x2="450" y2="676" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="690" width="365" height="110" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="252" y="736" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">ALL CLEAR</text><text x="252" y="778" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Energize it</text><rect x="465" y="690" width="365" height="110" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="647" y="736" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">ANY HIT</text><text x="647" y="778" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Stop, find it, fix it</text><rect x="70" y="850" width="760" height="210" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="906" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">NOT THIS SECTION</text><text x="450" y="956" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Damaged or contaminated internal</text><text x="450" y="1002" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">parts are equipment integrity —</text><text x="450" y="1048" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">that rule lives at 110.12(B).</text></svg>