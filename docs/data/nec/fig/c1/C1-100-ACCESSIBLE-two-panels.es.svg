<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Accesible frente a fácilmente accesible</title><desc id="d">Panel izquierdo: un tablero con paso libre, marcado como fácilmente accesible con una marca verde. Panel derecho: el mismo tablero detrás de estantes con almacenamiento y una escalera apoyada al frente, marcado como no fácilmente accesible. Una banda inferior muestra una caja de conexiones enterrada detrás del panel de yeso como no accesible.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Accesible vs. fácil acceso</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El mismo tablero: el paso decide</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Art. 100, 314.29</text><text x="870" y="1280" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="200" width="405" height="660" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5"/><text x="232" y="262" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="middle">ACCESO</text><text x="232" y="306" font-size="36" font-weight="900" fill="#2e7d32" text-anchor="middle">FÁCIL</text><circle cx="232" cy="356" r="24" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="232" y="368" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text><rect x="157" y="420" width="150" height="240" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="232" y="552" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">PNL</text><rect x="97" y="700" width="270" height="90" rx="0" fill="#F0A846" fill-opacity="0.4" stroke="#F0A846" stroke-width="3" stroke-dasharray="12 8"/><text x="232" y="756" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">paso libre</text><text x="232" y="838" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">solo llave — sin escalera</text><rect x="465" y="200" width="405" height="660" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="5"/><text x="667" y="262" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">SIN FÁCIL</text><text x="667" y="306" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">ACCESO</text><circle cx="667" cy="356" r="24" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="667" y="368" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">✗</text><rect x="592" y="420" width="150" height="240" rx="6" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="667" y="552" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">PNL</text><rect x="556" y="668" width="144" height="76" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="628" y="716" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">CAJAS</text><rect x="708" y="668" width="148" height="76" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="782" y="716" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">ALMACÉN</text><line x1="488" y1="800" x2="554" y2="480" stroke="#1f2937" stroke-width="6"/><line x1="532" y1="800" x2="598" y2="480" stroke="#1f2937" stroke-width="6"/><line x1="496" y1="748" x2="540" y2="748" stroke="#1f2937" stroke-width="5"/><line x1="509" y1="682" x2="553" y2="682" stroke="#1f2937" stroke-width="5"/><line x1="522" y1="616" x2="566" y2="616" stroke="#1f2937" stroke-width="5"/><line x1="535" y1="550" x2="579" y2="550" stroke="#1f2937" stroke-width="5"/><text x="667" y="838" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">escalera + obstáculos</text><rect x="30" y="920" width="840" height="110" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="966" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">Caja enterrada tras el panel de yeso</text><text x="450" y="1010" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">= NO ACCESIBLE (314.29)</text></svg>