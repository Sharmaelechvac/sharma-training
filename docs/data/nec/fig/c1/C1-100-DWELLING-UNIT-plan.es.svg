<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Unidad de vivienda: 4 funciones</title><desc id="d">Vista en planta de una unidad de vivienda con sala, dormitorios, cocina y baño tras una sola puerta principal, y un panel de casa de piscina que no es unidad de vivienda.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Unidad de vivienda: 4 funciones</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Una unidad, una puerta — las cuatro adentro</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100 — Dwelling Unit</text><rect x="76" y="226" width="748" height="558" rx="0" fill="#F0A846" fill-opacity="0.3" stroke="#F0A846" stroke-width="4" stroke-dasharray="14 8"/><rect x="60" y="210" width="780" height="590" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="6"/><line x1="470" y1="210" x2="470" y2="800" stroke="#1f2937" stroke-width="5"/><line x1="60" y1="505" x2="840" y2="505" stroke="#1f2937" stroke-width="5"/><text x="265.0" y="329.5" font-size="38" font-weight="900" fill="#264387" text-anchor="middle">SALA</text><text x="265.0" y="379.5" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">sala</text><circle cx="118" cy="268" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="118" y="281" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="655.0" y="329.5" font-size="38" font-weight="900" fill="#264387" text-anchor="middle">COCINA</text><text x="655.0" y="379.5" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">cocina</text><circle cx="528" cy="268" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="528" y="281" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="265.0" y="624.5" font-size="38" font-weight="900" fill="#264387" text-anchor="middle">DORMITORIO</text><text x="265.0" y="674.5" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">dormir</text><circle cx="118" cy="563" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="118" y="576" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="655.0" y="624.5" font-size="38" font-weight="900" fill="#264387" text-anchor="middle">BAÑO</text><text x="655.0" y="674.5" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">saneamiento</text><circle cx="528" cy="563" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="528" y="576" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><rect x="648" y="792" width="104" height="16" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><line x1="652" y1="800" x2="652" y2="704" stroke="#1a2f61" stroke-width="6"/><path d="M752,800 A100,100 0 0 0 652,700" stroke="#1a2f61" stroke-width="3" fill="none" stroke-dasharray="8 6"/><text x="700" y="852" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PUERTA PRINCIPAL</text><circle cx="52" cy="893" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="904" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="86" y="905" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Sala — un espacio habitable real</text><circle cx="52" cy="939" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="950" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="86" y="951" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Dormir — dormitorios permanentes</text><circle cx="52" cy="985" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="996" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="86" y="997" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Cocina — permanente, no una hornilla</text><circle cx="52" cy="1031" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="52" y="1042" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">4</text><text x="86" y="1043" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Saneamiento — un baño completo</text><rect x="60" y="1120" width="780" height="210" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1178" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">NO ES UNIDAD DE VIVIENDA</text><text x="450" y="1236" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Casa de piscina: camas y un bar húmedo.</text><text x="450" y="1280" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Sin cocina permanente, sin baño —</text><text x="450" y="1324" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">no aplican las reglas de vivienda.</text></svg>