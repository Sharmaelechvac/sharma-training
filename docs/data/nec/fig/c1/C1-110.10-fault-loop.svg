<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.10 — The fault must clear</title><desc id="d">One-line of a fault loop from utility through service to a faulted load, with the bonding return path, then two verdict panels: ratings that match the 22,000 amp available fault current clear the fault, a 10 kA panel does not.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.10 — The fault must clear</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Scenario: 400 A service — utility letter says 22,000 A</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.10, 110.9</text><text x="870" y="1500" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="210" width="180" height="95" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="130" y="270" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">UTILITY</text><rect x="330" y="210" width="240" height="95" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="270" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">SERVICE</text><rect x="660" y="210" width="200" height="95" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="760" y="270" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">LOAD</text><line x1="220" y1="257" x2="330" y2="257" stroke="#1f2937" stroke-width="5"/><line x1="570" y1="257" x2="660" y2="257" stroke="#1f2937" stroke-width="5"/><circle cx="760" cy="340" r="30" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="760" y="352" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">✕</text><text x="712" y="352" font-size="34" font-weight="800" fill="#c0392b" text-anchor="end">FAULT</text><line x1="760" y1="420" x2="450" y2="420" stroke="#2e7d32" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="470" font-size="33" font-weight="700" fill="#2e7d32" text-anchor="middle">Bonding / EGC return path — low impedance</text><rect x="122.0" y="519" width="656" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="557" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Available fault current: 22,000 A</text><rect x="40" y="620" width="820" height="235" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="70" y="680" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">TEAM MATCHES THE SYSTEM</text><text x="70" y="735" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Breaker interrupting rating: 22 kA</text><text x="70" y="779" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Panelboard SCCR: 22 kA</text><text x="70" y="823" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Low-impedance loop → fault clears as a trip</text><rect x="40" y="895" width="820" height="235" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="70" y="955" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">ONE WEAK PART FAILS IT</text><text x="70" y="1010" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Panelboard SCCR: 10 kA</text><text x="70" y="1054" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Under the 22,000 A the utility can deliver</text><text x="70" y="1098" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">It can rupture instead of clearing</text><rect x="40" y="1170" width="820" height="95" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="450" y="1230" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">110.24: mark the available fault current + date</text></svg>