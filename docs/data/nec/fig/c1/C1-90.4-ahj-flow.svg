<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">90.4 — Who decides on the job?</title><desc id="d">Flow chart: a question on the job splits three ways. A clear rule goes to the printed NEC, two readings go to asking the AHJ before rough-in, and an alternative method goes to the AHJ for written special permission. A red panel states that a handbook, app or study guide decides nothing.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">90.4 — Who decides on the job?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The AHJ enforces; everyone else advises</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 90.4</text><text x="870" y="1160" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="205" width="780" height="92" rx="12" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="262" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">A QUESTION COMES UP ON THE JOB</text><rect x="70" y="360" width="760" height="118" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="412" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">THE RULE IS CLEAR</text><text x="450" y="458" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Build to the printed NEC</text><line x1="450" y1="478" x2="450" y2="534" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="540" width="760" height="118" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="592" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">TWO READINGS ARE POSSIBLE</text><text x="450" y="638" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Ask the AHJ before rough-in</text><line x1="450" y1="658" x2="450" y2="714" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="720" width="760" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="772" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">THE CODE ALLOWS AN ALTERNATIVE</text><text x="450" y="818" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">AHJ special permission — written consent</text><text x="450" y="928" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Write down who said what, and when.</text><rect x="70" y="970" width="760" height="130" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1028" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">A HANDBOOK, APP OR STUDY GUIDE</text><text x="450" y="1076" font-size="36" font-weight="900" fill="#c0392b" text-anchor="middle">DECIDES NOTHING</text></svg>