<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Where a branch circuit lives</title><desc id="d">One-line diagram: utility service and feeder feed a panelboard; the branch circuit is the gold zone from the final breaker out to the receptacle, lighting outlet and hard-wired equipment.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Where a branch circuit lives</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">It starts at the final breaker, not at the meter</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100, Article 210</text><rect x="170" y="196" width="560" height="84" rx="10" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="251.0" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">UTILITY SERVICE</text><text x="878" y="248" font-size="32" font-weight="700" fill="#5b6478" text-anchor="end">service</text><text x="878" y="288" font-size="32" font-weight="700" fill="#5b6478" text-anchor="end">conductors</text><line x1="450" y1="280" x2="450" y2="330" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="170" y="334" width="560" height="84" rx="10" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="389.0" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">SERVICE DISCONNECT</text><line x1="450" y1="418" x2="450" y2="468" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="170" y="472" width="560" height="84" rx="10" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="527.0" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">PANELBOARD</text><text x="878" y="524" font-size="32" font-weight="700" fill="#5b6478" text-anchor="end">feeder</text><text x="878" y="564" font-size="32" font-weight="700" fill="#5b6478" text-anchor="end">(Art. 215)</text><line x1="450" y1="556" x2="450" y2="606" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="170" y="610" width="560" height="84" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450.0" y="665.0" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">FINAL OVERCURRENT DEVICE</text><text x="450" y="736" font-size="34" font-weight="800" fill="#F0A846" text-anchor="middle">the breaker for this circuit</text><rect x="90" y="770" width="720" height="560" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="5" stroke-dasharray="16 10"/><text x="120" y="828" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="start">BRANCH CIRCUIT</text><line x1="450" y1="694" x2="450" y2="782" stroke="#1a2f61" stroke-width="4"/><line x1="450" y1="848" x2="450" y2="876" stroke="#1a2f61" stroke-width="4"/><line x1="200" y1="880" x2="700" y2="880" stroke="#1a2f61" stroke-width="4"/><line x1="200" y1="880" x2="200" y2="950" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="95" y="954" width="210" height="120" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="200" y="1006" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">RECEPTACLE</text><text x="200" y="1048" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">outlet</text><line x1="450" y1="880" x2="450" y2="950" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="345" y="954" width="210" height="120" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="450" y="1006" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">LIGHTING</text><text x="450" y="1048" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">outlet</text><line x1="700" y1="880" x2="700" y2="950" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="595" y="954" width="210" height="120" rx="10" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="700" y="1006" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">EQUIPMENT</text><text x="700" y="1048" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">hard-wired</text><text x="450" y="1160" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">Everything past the final breaker</text><text x="450" y="1206" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">is the branch circuit (Art. 210)</text><text x="450" y="1270" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">Upstream of it: feeder or service.</text></svg>