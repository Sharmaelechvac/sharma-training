<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1360" width="900" height="1360" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Enclosure types: match the exposure</title><desc id="d">Three enclosures compared: a Type 1 indoor enclosure, a Type 3R outdoor rainproof disconnect, and a Type 4X corrosion-resistant enclosure for washdown and coastal work.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1360" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Enclosure types: match the exposure</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The marked type is the rating — not the paint</text><line x1="30" y1="1302" x2="870" y2="1302" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1340" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.28, Table 110.28</text><rect x="30" y="210" width="266" height="470" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="4"/><text x="163" y="262" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TYPE 1</text><rect x="88" y="300" width="150" height="210" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="97" y="330" width="132" height="60" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="2"/><text x="163" y="368" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">TYPE 1</text><text x="163" y="580" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Indoor</text><text x="163" y="626" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Falling dirt</text><rect x="317" y="210" width="266" height="470" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="4"/><text x="450" y="262" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TYPE 3R</text><rect x="375" y="300" width="150" height="210" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="384" y="330" width="132" height="60" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="2"/><text x="450" y="368" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">TYPE 3R</text><text x="450" y="580" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Outdoor</text><text x="450" y="626" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Rain + sleet</text><rect x="604" y="210" width="266" height="470" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="4"/><text x="737" y="262" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TYPE 4X</text><rect x="662" y="300" width="150" height="210" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="671" y="330" width="132" height="60" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="2"/><text x="737" y="368" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">TYPE 4X</text><text x="737" y="580" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Coastal</text><text x="737" y="626" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Washdown duty</text><text x="737" y="666" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">+ corrosion</text><circle cx="115" cy="284" r="4" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="150" cy="284" r="4" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="185" cy="284" r="4" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="220" cy="284" r="4" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><line x1="397" y1="274" x2="387" y2="294" stroke="#264387" stroke-width="3"/><line x1="432" y1="274" x2="422" y2="294" stroke="#264387" stroke-width="3"/><line x1="467" y1="274" x2="457" y2="294" stroke="#264387" stroke-width="3"/><line x1="502" y1="274" x2="492" y2="294" stroke="#264387" stroke-width="3"/><line x1="532" y1="274" x2="522" y2="294" stroke="#264387" stroke-width="3"/><line x1="684" y1="274" x2="668" y2="294" stroke="#264387" stroke-width="3"/><line x1="719" y1="274" x2="703" y2="294" stroke="#264387" stroke-width="3"/><line x1="754" y1="274" x2="738" y2="294" stroke="#264387" stroke-width="3"/><line x1="789" y1="274" x2="773" y2="294" stroke="#264387" stroke-width="3"/><line x1="819" y1="274" x2="803" y2="294" stroke="#264387" stroke-width="3"/><rect x="40" y="740" width="819" height="74" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="788" font-size="33" font-weight="800" fill="#1a2f61" text-anchor="middle">Type 4 is watertight — corrosion resistance is 4X</text><rect x="40" y="846" width="819" height="74" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="894" font-size="33" font-weight="800" fill="#c0392b" text-anchor="middle">Indoor type outdoors = replacement, 