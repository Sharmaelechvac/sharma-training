 rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="210" y="722" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">TRANSFORMER</text><line x1="350" y1="710" x2="510" y2="710" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="510" y="640" width="280" height="140" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="650" y="722" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OWN PANEL</text><rect x="275.0" y="804" width="350" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="840" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">OWN BONDING JUMPER</text><text x="450" y="905" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">No direct connection to another system</text><circle cx="52" cy="968" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="52" y="980" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="88" y="980" font-size="38" font-weight="800" fill="#264387" text-anchor="start">RACEWAY</text><circle cx="450" cy="1120" r="92" fill="#eef2f9" stroke="#264387" stroke-width="6"/><circle cx="415" cy="1090" r="27" fill="#264387" stroke="#264387" stroke-width="0"/><circle cx="482" cy="1090" r="27" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="450" cy="1152" r="27" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="450" y="1262" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Conduit and tubing — a cable is not a raceway</text></svg>