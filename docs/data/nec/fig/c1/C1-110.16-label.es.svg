<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.16 — Avise, luego etiquete</title><desc id="d">Puerta de tablero de distribución con advertencia de arco eléctrico y la etiqueta permanente de acometida de cuatro datos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.16 — Avise, luego etiquete</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Etiqueta (B): acometida de 1200 A o más</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.16(A), (B); 110.21(B)</text><rect x="50" y="210" width="340" height="750" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="220" y1="210" x2="220" y2="960" stroke="#c9d2e3" stroke-width="3"/><rect x="68" y="250" width="304" height="215" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="5"/><text x="220" y="312" font-size="40" font-weight="800" fill="#c0392b" text-anchor="middle">ADVERTENCIA</text><text x="220" y="362" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">ARCO ELÉCTR.</text><text x="220" y="406" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">PELIGRO</text><text x="220" y="448" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Póngase el EPP</text><rect x="68" y="505" width="304" height="390" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="220" y="550" font-size="30" font-weight="800" fill="#264387" text-anchor="middle">ETIQUETA 110.16(B)</text><circle cx="100" cy="612" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="100" y="622" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="128" y="622" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Voltaje</text><line x1="128" y1="637" x2="345" y2="637" stroke="#c9d2e3" stroke-width="2"/><circle cx="100" cy="682" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="100" y="692" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="128" y="692" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Corriente falla</text><line x1="128" y1="707" x2="345" y2="707" stroke="#c9d2e3" stroke-width="2"/><circle cx="100" cy="752" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="100" y="762" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="128" y="762" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Tiempo despeje</text><line x1="128" y1="777" x2="345" y2="777" stroke="#c9d2e3" stroke-width="2"/><circle cx="100" cy="822" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="100" y="832" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="128" y="832" font-size="30" font-weight="700" fill="#1f2937" text-anchor="start">Fecha aplicada</text><line x1="128" y1="847" x2="345" y2="847" stroke="#c9d2e3" stroke-width="2"/><text x="430" y="262" font-size="34" font-weight="800" fill="#264387" text-anchor="start">RECUERDE</text><rect x="430" y="290" width="410" height="118" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="635" y="338" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">El aviso avisa —</text><text x="635" y="382" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">El EPP sí protege</text><text x="430" y="472" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Etiqueta cumple 110.21(B),</text><text x="430" y="510" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">o una de arco eléctrico</text><text x="430" y="548" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">según práctica industrial.</text><text x="430" y="640" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">El aviso (A) va en equipos</text><text x="430" y="678" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">que se trabajen energizados.</text><text x="60" y="1052" font-size="34" font-weight="800" fill="#264387" text-anchor="start">ETIQUETA (B) — CUATRO DATOS</text><circle cx="77" cy="1102" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="77" y="1112" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="112" y="1112" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Voltaje nominal del sistema</text><circle cx="77" cy="1158" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="77" y="1168" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="112" y="1168" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Corriente de falla disponible en</text><text x="112" y="1210" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">los dispositivos de la acometida</text><circle cx="77" cy="1256" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="77" y="1266" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="112" y="1266" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Tiempo de despeje a esa corriente</text><circle cx="77" cy="1312" r="17" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="77" y="1322" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="112" y="1322" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Fecha en que se puso la etiqueta</text></svg>