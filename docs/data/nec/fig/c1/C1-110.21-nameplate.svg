<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.21 Markings on the gear</title><desc id="d">Panel door with a rating plate showing maker name and ratings, a printed danger hazard label, and a reconditioned tag with rebuilder name and date; the original listing mark and a marker scrawl are crossed out.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.21 Markings on the gear</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">If it can't be read, it can't be approved</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.21, 110.21(A)(2)</text><rect x="60" y="210" width="480" height="640" rx="6" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><rect x="100" y="250" width="400" height="210" rx="6" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="300" y="302" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">MAKER NAME</text><text x="300" y="356" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">240 V · 400 A</text><text x="300" y="408" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">22 kAIC</text><circle cx="528" cy="355" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="528" y="368" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><rect x="100" y="510" width="400" height="140" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="300" y="568" font-size="44" font-weight="900" fill="#c0392b" text-anchor="middle">DANGER</text><text x="300" y="618" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">printed hazard label</text><circle cx="528" cy="580" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="528" y="593" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><rect x="100" y="690" width="400" height="120" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="300" y="738" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">RECONDITIONED</text><text x="300" y="782" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Rebuilder name · date</text><circle cx="528" cy="750" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="528" y="763" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><rect x="610" y="250" width="230" height="90" rx="6" fill="#ffffff" stroke="#5b6478" stroke-width="3"/><text x="725" y="307" font-size="36" font-weight="900" fill="#5b6478" text-anchor="middle">LISTED</text><line x1="610" y1="250" x2="840" y2="340" stroke="#c0392b" stroke-width="6"/><line x1="840" y1="250" x2="610" y2="340" stroke="#c0392b" stroke-width="6"/><text x="725" y="392" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">original listing mark</text><text x="725" y="434" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">removed or voided</text><rect x="610" y="500" width="230" height="150" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 7"/><path d="M635,575 q20,-28 40,0 q20,28 40,0 q20,-28 40,0 q20,28 40,0" stroke="#c0392b" stroke-width="4" fill="none"/><text x="725" y="545" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">marker scrawl</text><text x="725" y="700" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">not a marking</text><circle cx="52" cy="933" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="946" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="92" y="945" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Maker name + ratings stay readable</text><circle cx="52" cy="981" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="994" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="92" y="993" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Hazard mark: printed label, signal words</text><circle cx="52" cy="1029" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="1042" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="92" y="1041" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Rebuilt gear: rebuilder + date marked</text><rect x="40" y="1100" width="820" height="84" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1154" 