<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Connected vs maximum demand</title><desc id="d">Bar chart comparing an 18,000 VA connected load with its 8,250 VA maximum demand, giving a demand factor of about 0.46, plus clean and distorted current waveforms.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1340" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Connected vs maximum demand</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The Table 220.42 worked example (Ch. 2, verified)</text><line x1="30" y1="1282" x2="870" y2="1282" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1320" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100; Table 220.42</text><rect x="90" y="270" width="170" height="330" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="175" y="252" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">18,000 VA</text><text x="175" y="648" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">CONNECTED</text><text x="175" y="692" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">LOAD</text><rect x="330" y="449" width="170" height="151" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="415" y="431" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">8,250 VA</text><text x="415" y="648" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">MAXIMUM</text><text x="415" y="692" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">DEMAND</text><line x1="60" y1="600" x2="560" y2="600" stroke="#1f2937" stroke-width="4"/><text x="585" y="300" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">Demand factor</text><text x="585" y="348" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">8,250 ÷ 18,000</text><text x="585" y="396" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">≈ 0.46</text><text x="585" y="452" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Never over 1.0</text><rect x="60" y="760" width="780" height="300" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><path d="M90,865 L94,855 L98,846 L102,837 L106,829 L111,821 L115,815 L119,810 L123,806 L127,804 L131,803 L135,804 L140,806 L144,810 L148,815 L152,821 L156,829 L160,837 L164,846 L168,855 L172,865 L177,875 L181,884 L185,893 L189,901 L193,909 L197,915 L201,920 L206,924 L210,926 L214,927 L218,926 L222,924 L226,920 L230,915 L234,909 L238,901 L243,893 L247,884 L251,875 L255,865 L259,855 L263,846 L267,837 L272,829 L276,821 L280,815 L284,810 L288,806 L292,804 L296,803 L300,804 L304,806 L309,810 L313,815 L317,821 L321,829 L325,837 L329,846 L333,855 L338,865 L342,875 L346,884 L350,893 L354,901 L358,909 L362,915 L366,920 L370,924 L375,926 L379,927 L383,926 L387,924 L391,920 L395,915 L399,909 L404,901 L408,893 L412,884 L416,875 L420,865" stroke="#264387" stroke-width="4" fill="none"/><text x="90" y="990" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Voltage: clean sine</text><path d="M480,865 L484,845 L488,830 L492,822 L496,821 L501,825 L505,829 L509,831 L513,832 L517,831 L521,830 L525,831 L530,832 L534,831 L538,829 L542,825 L546,821 L550,822 L554,830 L558,845 L562,865 L567,885 L571,900 L575,908 L579,909 L583,905 L587,901 L591,899 L596,898 L600,899 L604,900 L608,899 L612,898 L616,899 L620,901 L624,905 L628,909 L633,908 L637,900 L641,885 L645,865 L649,845 L653,830 L657,822 L662,821 L666,825 L670,829 L674,831 L678,832 L682,831 L686,830 L690,831 L694,832 L699,831 L703,829 L707,825 L711,821 L715,822 L719,830 L723,845 L728,865 L732,885 L736,900 L740,908 L744,909 L748,905 L752,901 L756,899 L760,898 L765,899 L769,900 L773,899 L777,898 L781,899 L785,901 L789,905 L794,909 L798,908 L802,900 L806,885 L810,865" stroke="#c0392b" stroke-width="4" fill="none"/><text x="480" y="990" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">Nonlinear current</text><text x="60" y="1130" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">Harmonics add on a shared neutral —</text><text x="60" y="1178" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">it may count as current-carrying.</text></svg>