<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Three conductors, three jobs</title><desc id="d">A house service panel with neutral and ground bars joined by a gold main bonding jumper, a green equipment grounding conductor running to a metal-frame load, and a grounding electrode conductor running down to a ground rod.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Three conductors, three jobs</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Article 100 — the grounding family map</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Art. 100; Tables 250.66, 250.122</text><rect x="90" y="250" width="320" height="430" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="250" y="305" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">SERVICE PANEL</text><rect x="120" y="340" width="260" height="54" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="250" y="378" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">NEUTRAL BAR</text><rect x="120" y="470" width="260" height="54" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="250" y="508" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="middle">GROUND BAR</text><rect x="228" y="394" width="44" height="76" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><circle cx="250" cy="432" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="250" y="444" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="570" y="300" width="280" height="150" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="710" y="362" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">METAL-FRAME</text><text x="710" y="406" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">LOAD</text><path d="M380,497 L520,497 L520,420 L570,420" stroke="#2e7d32" stroke-width="6" fill="none"/><circle cx="520" cy="497" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="520" y="509" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><path d="M180,394 L180,760 L240,760" stroke="#264387" stroke-width="6" fill="none"/><line x1="240" y1="760" x2="240" y2="900" stroke="#264387" stroke-width="6"/><path d="M205,900 L275,900 L240,945 Z" stroke="#264387" stroke-width="4" fill="#264387"/><text x="300" y="800" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">GROUND ROD</text><circle cx="180" cy="700" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="180" y="712" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="70" y="1080" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1  EGC — fault path back to the source</text><text x="70" y="1132" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">2  GEC — ties the system to earth</text><text x="70" y="1184" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">3  MBJ — the bond, at the service only</text><rect x="60" y="1268" width="780" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1326" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">No bond at subpanels — neutral stays separate</text></svg>