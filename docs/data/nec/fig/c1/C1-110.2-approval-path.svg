<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The road to approved</title><desc id="d">Approval flow: equipment must be listed and labeled by a qualified testing laboratory and identified for its specific use before the AHJ accepts it as approved; gear with no listing, or listed gear used in a panel or place it is not identified for, has no path to approval and must not be installed.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The road to approved</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">110.2 — approved means acceptable to the AHJ</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.2, Article 100</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="190" width="720" height="110" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="252" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Equipment or conductors arrive</text><line x1="450" y1="300" x2="450" y2="342" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="342" width="720" height="150" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="404" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Listed and labeled by a qualified</text><text x="450" y="452" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">testing laboratory?</text><line x1="450" y1="492" x2="450" y2="534" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="534" width="720" height="150" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="596" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Identified for this specific use —</text><text x="450" y="644" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">this panel, this location?</text><line x1="450" y1="684" x2="450" y2="726" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="726" width="720" height="150" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="788" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">AHJ accepts it: APPROVED</text><text x="450" y="836" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">Install it</text><rect x="30" y="960" width="840" height="300" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="60" y="1028" font-size="40" font-weight="800" fill="#c0392b" text-anchor="start">NO PATH TO APPROVAL</text><text x="60" y="1086" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">No listing mark, or a breaker forced</text><text x="60" y="1132" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">into a panel it is not identified for:</text><text x="60" y="1178" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">do not install it. Cheap, available, or</text><text x="60" y="1224" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">already on the truck changes nothing.</text><text x="450" y="1350" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Check approvals at order and delivery time —</text><text x="450" y="1396" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">not at trim-out.</text></svg>