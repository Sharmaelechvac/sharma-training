<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1340" width="900" height="1340" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Permiso especial</title><desc id="d">Diagrama de flujo: donde el Código permite una alternativa, el AHJ da su consentimiento por escrito antes del trabajo y se archiva con el permiso; los vistos buenos verbales no cuentan.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1340" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Permiso especial</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Consentimiento escrito del AHJ — Art. 100</text><line x1="30" y1="1282" x2="870" y2="1282" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1320" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Art. 100 · 90.4</text><text x="870" y="1320" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="200" width="720" height="110" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="248" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">El Código permite alternativas</text><text x="450" y="292" font-size="33" font-weight="600" fill="#ffffff" text-anchor="middle">cuando se otorga permiso especial</text><line x1="450" y1="310" x2="450" y2="362" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="372" width="720" height="110" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="420" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">El AHJ consiente por ESCRITO</text><text x="450" y="464" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">antes de hacer el trabajo</text><line x1="450" y1="482" x2="450" y2="534" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="544" width="720" height="110" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="592" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">Archívelo con el permiso</text><text x="450" y="636" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">el siguiente inspector ve lo mismo</text><rect x="90" y="720" width="720" height="330" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="782" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">NO ES PERMISO ESPECIAL</text><text x="450" y="850" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">un «sí» verbal, de quien sea</text><text x="450" y="900" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">la palabra del constructor</text><text x="450" y="950" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">la petición del propietario</text><text x="450" y="1000" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">«siempre lo hemos hecho así»</text><text x="450" y="1130" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Escrito. Del AHJ. Antes del trabajo.</text><text x="450" y="1190" font-size="33" font-weight="600" fill="#5b6478" text-anchor="middle">Menos que eso es discutir, no un permiso.</text></svg>