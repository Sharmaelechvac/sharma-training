<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Formal interpretations</title><desc id="d">Flow chart: a question on one job goes to the AHJ; a genuine dispute about the text goes to NFPA for a formal interpretation.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Formal interpretations</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Which question are you asking?</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 90.6 · 90.4</text><text x="870" y="1160" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="120" y="195" width="660" height="92" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><text x="450" y="256" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">WHAT DOES THE RULE MEAN?</text><line x1="300" y1="287" x2="240" y2="350" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><line x1="600" y1="287" x2="660" y2="350" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="360" width="400" height="330" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="240" y="420" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="middle">ON THIS JOB</text><text x="240" y="486" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Ask the AHJ</text><text x="240" y="532" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">The AHJ interprets</text><text x="240" y="578" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">the rule for this job</text><text x="240" y="624" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">(90.4)</text><text x="240" y="662" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">That reading governs</text><rect x="460" y="360" width="400" height="330" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="660" y="420" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">THE TEXT ITSELF</text><text x="660" y="486" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">A genuine dispute</text><text x="660" y="532" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">about the wording goes</text><text x="660" y="578" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">to NFPA: formal</text><text x="660" y="624" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">interpretation (90.6)</text><text x="660" y="662" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Official — and slow</text><rect x="40" y="740" width="820" height="150" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="800" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">NOT AN OFFICIAL INTERPRETATION</text><text x="450" y="856" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">magazine article · forum post · video</text><text x="450" y="960" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">One job's question goes to its AHJ.</text><text x="450" y="1010" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">A dispute about the text goes to NFPA.</text></svg>