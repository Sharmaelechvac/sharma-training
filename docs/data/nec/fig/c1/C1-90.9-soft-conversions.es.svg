<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1580" width="900" height="1580" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Pares impresos: conversión suave</title><desc id="d">Gráfico de barras que compara los valores métricos que imprime el Código para cuatro dimensiones de espacio de trabajo con sus conversiones exactas: 3 ft se imprime como 900 mm frente a 914 mm exactos, 3 ft 6 in como 1.0 m frente a 1.07 m, 4 ft como 1.2 m frente a 1.22 m, y 6-1/2 ft como 2.0 m frente a 1.98 m.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1580" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Pares impresos: conversión suave</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">90.9 — construya al valor impreso en la regla</text><line x1="30" y1="1522" x2="870" y2="1522" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1560" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 90.9, Table 110.26(A)(1)</text><rect x="60" y="185" width="36" height="36" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="110" y="216" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">El Código imprime</text><rect x="470" y="185" width="36" height="36" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="520" y="216" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Conversión exacta</text><text x="50" y="342" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">3 ft</text><rect x="270" y="300" width="216" height="46" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="502" y="336" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">900 mm</text><rect x="270" y="358" width="219" height="46" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="505" y="394" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">914 mm</text><text x="50" y="557" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">3 ft 6 in</text><rect x="270" y="515" width="240" height="46" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="526" y="551" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">1.0 m</text><rect x="270" y="573" width="256" height="46" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="542" y="609" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1.07 m</text><text x="50" y="772" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">4 ft</text><rect x="270" y="730" width="288" height="46" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="574" y="766" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">1.2 m</text><rect x="270" y="788" width="292" height="46" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="578" y="824" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1.22 m</text><text x="50" y="987" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">6½ ft</text><rect x="270" y="945" width="480" height="46" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="766" y="981" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">2.0 m</text><rect x="270" y="1003" width="475" height="46" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="761" y="1039" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1.98 m</text><rect x="30" y="1170" width="840" height="200" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1242" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">1 in es exactamente 25.4 mm. El Código redondea</text><text x="450" y="1290" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">cada lado del par a un número redondo.</text><text x="450" y="1338" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">Ningún valor impreso es un error.</text></svg>