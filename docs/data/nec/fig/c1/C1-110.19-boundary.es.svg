<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Alumbrado y fuerza ferroviaria</title><desc id="d">Diagrama de decisión: si un circuito se conectara a un sistema con cables de trole y retorno por tierra, la conexión está prohibida; la única excepción es dentro de cocheras, casas de máquinas y estaciones de pasajeros y de carga operadas en conexión con ferrocarriles eléctricos; en los demás casos aplican las reglas normales de cableado del local.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Alumbrado y fuerza ferroviaria</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">110.19 — una línea firme, una excepción</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.19, 90.2</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="200" width="720" height="130" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="258" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">¿El circuito se conecta a un sistema con</text><text x="450" y="306" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">cables de trole y retorno por tierra?</text><line x1="450" y1="330" x2="450" y2="400" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="410" width="840" height="210" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="60" y="478" font-size="40" font-weight="800" fill="#c0392b" text-anchor="start">SÍ — NO CONECTE</text><text x="60" y="536" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Alumbrado y fuerza quedan fuera de</text><text x="60" y="582" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">ese sistema. Deténgase y escale.</text><line x1="450" y1="620" x2="450" y2="690" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="700" width="840" height="250" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="60" y="768" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">LA ÚNICA EXCEPCIÓN</text><text x="60" y="826" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Dentro de los edificios del ferrocarril:</text><text x="60" y="872" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">cocheras, casas de máquinas y</text><text x="60" y="918" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">estaciones de pasajeros y carga.</text><rect x="30" y="1010" width="840" height="250" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="60" y="1078" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="start">NO — CABLEADO NORMAL DEL LOCAL</text><text x="60" y="1136" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Aplica el resto del Artículo 110.</text><text x="60" y="1182" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">La energía ferroviaria queda fuera</text><text x="60" y="1228" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">del alcance del Código (90.2).</text></svg>