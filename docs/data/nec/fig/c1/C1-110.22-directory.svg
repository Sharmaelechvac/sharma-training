<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.22 — mark what it shuts off</title><desc id="d">Two panel directory cards: one legible card naming real loads, and one failed card repeating lights and receptacles with a spare label on a live circuit.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.22 — mark what it shuts off</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Legible and durable, every time</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.22 · 408.4(A)</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="200" width="405" height="560" rx="0" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/><rect x="30" y="200" width="405" height="64" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="50" y="242" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">DIRECTORY THAT WORKS</text><text x="55" y="330" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1  CONDENSER</text><text x="55" y="385" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3  AIR HANDLER 2</text><text x="55" y="440" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">5  WATER HEATER</text><text x="55" y="495" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">7  KITCHEN REC</text><text x="55" y="550" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">9  DRYER</text><text x="55" y="605" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">11  WASHER</text><text x="55" y="660" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">13  GARAGE REC</text><text x="55" y="728" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">✓ IDENTIFIES</text><rect x="465" y="200" width="405" height="560" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><rect x="465" y="200" width="405" height="64" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="485" y="242" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">GETS WRITTEN UP</text><text x="490" y="330" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">1  LIGHTS</text><text x="490" y="385" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">3  RECEPTACLES</text><text x="490" y="440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">5  LIGHTS</text><text x="490" y="495" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">7  SPARE — LIVE!</text><text x="490" y="550" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">9  RECEPTACLES</text><text x="490" y="605" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">11  ?????</text><path d="M490 668 q 30 -10 60 0 q 30 10 60 0 q 30 -10 60 0" stroke="#1f2937" stroke-width="3" fill="none"/><text x="490" y="728" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">✗ SAYS NOTHING</text><rect x="30" y="800" width="840" height="180" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="50" y="854" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">MULTI-TENANT — ADD THE SOURCE</text><text x="50" y="908" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">FED FROM: MDP-1, ELEC RM</text><text x="50" y="952" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">So nobody opens the wrong gear</text><text x="30" y="1062" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Good labels name the actual load</text><text x="30" y="1110" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Update the card the day a circuit changes</text><text x="30" y="1172" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">The one exception: purpose evident from location</text></svg>