<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Torque: la etiqueta manda</title><desc id="d">Destornillador de torque en un terminal de breaker junto a la etiqueta del equipo, con valores de respaldo del Anexo I.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Torque: la etiqueta manda</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">110.14(D) — apriete al valor indicado</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.14(D)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="190" width="400" height="560" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="50" y="234" font-size="34" font-weight="800" fill="#264387" text-anchor="start">EN EL TERMINAL</text><rect x="70" y="260" width="320" height="330" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="230" y="266" width="40" height="52" rx="8" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><line x1="250" y1="318" x2="250" y2="352" stroke="#1f2937" stroke-width="5"/><path d="M 292 292 A 44 44 0 0 1 308 338" stroke="#F0A846" stroke-width="4" fill="none"/><path d="M308 338 l-16 1 l9 13 z" stroke="#F0A846" stroke-width="0" fill="#F0A846"/><rect x="180" y="380" width="140" height="170" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="250" cy="366" r="15" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><rect x="224" y="512" width="52" height="30" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="250" y1="542" x2="250" y2="590" stroke="#1a2f61" stroke-width="6"/><text x="250" y="640" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Torque en el terminal</text><text x="250" y="684" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Valor de la etiqueta</text><circle cx="356" cy="520" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="356" y="531" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="128" cy="292" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="128" y="303" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="470" y="190" width="400" height="560" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="490" y="234" font-size="34" font-weight="800" fill="#264387" text-anchor="start">EN LA ETIQUETA</text><rect x="490" y="260" width="360" height="290" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="490" y="260" width="360" height="54" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="506" y="297" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">ETIQUETA DEL EQUIPO</text><text x="506" y="368" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">PRINCIPAL — ETIQUETA</text><text x="506" y="414" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">BREAKERS — ETIQUETA</text><text x="506" y="460" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">NEUTRO — ETIQUETA</text><text x="506" y="506" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">TIERRA — ETIQUETA</text><text x="490" y="622" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">MANDA LA ETIQUETA</text><text x="490" y="664" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">No el tacto. No la costumbre.</text><circle cx="836" cy="226" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="836" y="237" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="30" y="790" width="840" height="320" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="50" y="838" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">¿SIN VALOR? — RESPALDO DEL ANEXO I</text><text x="50" y="880" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Valores UL 486A-486B — tornillos ranurados</text><text x="50" y="918" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">menores que No. 10, ranura de 1.2 mm o más</text><text x="50" y="972" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Ranura menor de 5/32 in — 7 / 9 lb-in</text><text x="50" y="1020" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Ranura de 1/4 in — 10 / 12 lb-in</text><text x="50" y="1068" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Ranura mayor de 9/32 in — 15 / 20 lb-in</text><circle cx="52" cy="1170" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="1181" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="85" y="1181" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Terminal apretado al valor de la etiqueta</text><circle cx="52" cy="1222" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="1233" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="85" y="1233" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Herramienta de torque — medio aprobado</text><circle cx="52" cy="1274" r="19" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="1285" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="85" y="1285" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">La etiqueta manda — léala primero</text><text x="30" y="1350" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">Col. A: prueba de ciclos · Col. B: demás casos</text></svg>