ine x1="350" y1="540" x2="550" y2="540" stroke="#2e7d32" stroke-width="4"/><text x="450" y="606" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">PERMITIDO —</text><text x="450" y="646" font-size="30" font-weight="900" fill="#2e7d32" text-anchor="middle">NO EXIGIDO</text><text x="450" y="730" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">90.5(B)</text><rect x="430" y="770" width="40" height="90" rx="0" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><rect x="606" y="210" width="264" height="560" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="606" y="210" width="264" height="84" rx="14" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="606" y="252" width="264" height="42" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="738" y="266" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">EXPLICATIVO</text><text x="738" y="420" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">Nota</text><text x="738" y="472" font-size="34" font-weight="800" fill="#1f2937" text-anchor="middle">informativa</text><line x1="638" y1="540" x2="838" y2="540" stroke="#264387" stroke-width="4"/><text x="738" y="606" font-size="30" font-weight="900" fill="#264387" text-anchor="middle">SOLO EXPLICA</text><text x="738" y="646" font-size="30" font-weight="900" fill="#264387" text-anchor="middle">NO EXIGIDO</text><text x="738" y="730" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">90.5(C)</text><rect x="718" y="770" width="40" height="90" rx="0" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><rect x="30" y="920" width="840" height="96" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="982" font-size="36" font-weight="900" fill="#1a2f61" text-anchor="middle">Una nota nunca crea un requisito</text></svg>