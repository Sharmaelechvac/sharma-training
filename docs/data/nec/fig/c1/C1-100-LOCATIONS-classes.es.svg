<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">¿Seco, húmedo o mojado?</title><desc id="d">Tres paneles apilados: un lugar seco (interior terminado), un lugar húmedo (porche con techo, parcialmente protegido) y un lugar mojado (exterior abierto, losa y tramos enterrados), cada uno con su prueba en palabras simples y sus sitios típicos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">¿Seco, húmedo o mojado?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La clase del lugar elige el equipo</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100 — Locations</text><rect x="40" y="200" width="820" height="360" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><rect x="40" y="200" width="16" height="360" rx="6" fill="#2e7d32" stroke="#2e7d32" stroke-width="3"/><rect x="70" y="228" width="102" height="50" rx="25" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/><text x="120.5" y="264" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">SECO</text><text x="240" y="262" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Lugar seco</text><text x="80" y="350" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Normalmente no húmedo ni mojado.</text><text x="80" y="398" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Húmedo solo en obra: sigue seco.</text><text x="80" y="505" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Dormitorios, salas, oficinas</text><rect x="40" y="600" width="820" height="360" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><rect x="40" y="600" width="16" height="360" rx="6" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><rect x="60" y="628" width="158" height="50" rx="25" fill="#fdf3e0" stroke="#fdf3e0" stroke-width="0"/><text x="137" y="664" font-size="32" font-weight="800" fill="#F0A846" text-anchor="middle">HÚMEDO</text><text x="240" y="662" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Lugar húmedo</text><text x="80" y="750" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Parcialmente protegido del clima,</text><text x="80" y="798" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">o sujeto a humedad moderada.</text><text x="80" y="905" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Porches con techo, sótanos, graneros</text><rect x="40" y="1000" width="820" height="360" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><rect x="40" y="1000" width="16" height="360" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="3"/><rect x="56" y="1028" width="148" height="50" rx="25" fill="#fbe9e7" stroke="#fbe9e7" stroke-width="0"/><text x="128" y="1064" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">MOJADO</text><text x="240" y="1062" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">Lugar mojado</text><text x="80" y="1150" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">El agua puede tocar el equipo directamente:</text><text x="80" y="1198" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">por definición, bajo tierra o en concreto</text><text x="80" y="1246" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">o mampostería en contacto con la tierra.</text><text x="80" y="1305" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Paredes exteriores, losas, tubo enterrado</text></svg>