<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.17 — Persona y pieza idóneas</title><desc id="d">Flujo de decisión: primero la puerta de la persona calificada, luego la revisión de la pieza de repuesto.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.17 — Persona y pieza idóneas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Nuevo en NEC 2023 — no está en NEC 2020</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2023 110.17 — no NEC 2020 section</text><rect x="70" y="205" width="760" height="108" rx="14" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="247" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">¿QUIÉN HACE EL TRABAJO?</text><text x="450" y="295" font-size="34" font-weight="700" fill="#F0A846" text-anchor="middle">Solo personas calificadas</text><line x1="450" y1="313" x2="450" y2="347" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="347" width="760" height="108" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="389" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">Capacitadas para la tarea y sus riesgos</text><text x="450" y="437" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">Los años solos no bastan</text><line x1="450" y1="455" x2="450" y2="489" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="489" width="760" height="108" rx="14" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="531" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">LA PIEZA DE REPUESTO</text><text x="450" y="579" font-size="34" font-weight="700" fill="#F0A846" text-anchor="middle">¿Identificada para este equipo?</text><line x1="450" y1="597" x2="450" y2="631" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="631" width="760" height="100" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="693" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">IDENTIFICADA — instale según instrucciones</text><line x1="450" y1="731" x2="450" y2="765" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="765" width="760" height="108" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="807" font-size="36" font-weight="800" fill="#1f2937" text-anchor="middle">¿NO IDENTIFICADA?</text><text x="450" y="855" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">OEM · diseño de ingeniero · aprobado por AHJ</text><line x1="450" y1="873" x2="450" y2="907" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="70" y="907" width="760" height="108" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="949" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">¿NINGUNA DE ESAS?</text><text x="450" y="997" font-size="34" font-weight="700" fill="#c0392b" text-anchor="middle">No instale la pieza</text></svg>