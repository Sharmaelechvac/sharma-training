 y="806" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">20 A</text><text x="450" y="862" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">breaker cap:</text><text x="450" y="896" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">15 A</text><rect x="600" y="210" width="260" height="720" rx="12" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="730" cy="330" r="72" fill="#F0A846" stroke="#1a2f61" stroke-width="5"/><circle cx="730" cy="330" r="48" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="730" y="462" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">CCA</text><text x="730" y="516" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">ONE SIZE UP</text><text x="730" y="596" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">reads the</text><text x="730" y="640" font-size="36" font-weight="900" fill="#1f2937" text-anchor="middle">ALUMINUM</text><text x="730" y="684" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">column</text><text x="730" y="756" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">12 AWG, 75 °C:</text><text x="730" y="806" font-size="44" font-weight="900" fill="#1a2f61" text-anchor="middle">20 A</text><text x="730" y="862" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">breaker cap:</text><text x="730" y="896" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">15 A</text><rect x="40" y="990" width="820" height="120" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="1044" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">Same AWG size is not the same ampacity.</text><text x="450" y="1088" font-size="32" font-weight="700" fill="#F0A846" text-anchor="middle">CCA: Sharma goes one AWG size up (S-10).</text></svg>