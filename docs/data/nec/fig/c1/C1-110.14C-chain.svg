<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">The weakest lug sets the size</title><desc id="d">A conductor run drawn as three links: a 75 degree breaker lug, a 90 degree THHN conductor, and a 60 degree equipment lug, with the whole run sized at 60 degrees, plus the two 110.14(C) defaults and the role of the 90 degree column.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">The weakest lug sets the size</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Terminations cap the conductor's column</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.14(C), Table 310.16</text><rect x="30" y="230" width="250" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="155" y="285" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">BREAKER LUG</text><text x="155" y="340" font-size="44" font-weight="800" fill="#F0A846" text-anchor="middle">75 °C</text><rect x="320" y="230" width="280" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="460" y="285" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CONDUCTOR</text><text x="460" y="340" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">THHN 90 °C</text><rect x="640" y="230" width="230" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="755" y="285" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">EQUIP LUG</text><text x="755" y="340" font-size="44" font-weight="800" fill="#F0A846" text-anchor="middle">60 °C</text><line x1="280" y1="295" x2="320" y2="295" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><line x1="600" y1="295" x2="640" y2="295" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="90" y="410" width="720" height="95" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="455" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">WHOLE RUN SIZED AT 60 °C</text><text x="450" y="492" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">the lowest termination rating governs</text><text x="48" y="575" font-size="34" font-weight="800" fill="#5b6478" text-anchor="start">THE TWO DEFAULTS — 110.14(C)</text><rect x="48" y="600" width="804" height="140" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="72" y="660" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Circuits of 100 A or less</text><text x="72" y="712" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">or conductors 14 through 1 AWG</text><rect x="609" y="631" width="243" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="730.5" y="667" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">60 °C COLUMN</text><rect x="48" y="770" width="804" height="140" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="72" y="830" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Circuits over 100 A</text><text x="72" y="882" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">or conductors larger than 1 AWG</text><rect x="609" y="801" width="243" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="730.5" y="837" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">75 °C COLUMN</text><rect x="48" y="960" width="804" height="170" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="72" y="1020" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">THE 90 °C COLUMN STILL WORKS</text><text x="72" y="1072" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Starting point for temperature correction</text><text x="72" y="1118" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">and adjustment under 310.15</text></svg>