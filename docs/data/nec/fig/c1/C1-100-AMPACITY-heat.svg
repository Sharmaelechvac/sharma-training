<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Ampacity: heat sets the limit</title><desc id="d">Cross-section of a conductor with heat arrows escaping through the insulation, and the four things that set ampacity: insulation and terminations, ambient heat, bundled conductors, and the metal.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Ampacity: heat sets the limit</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The insulation, not the copper, sets the ceiling</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100, Table 310.16, 310.15</text><circle cx="450" cy="470" r="185" fill="#eef2f9" stroke="#264387" stroke-width="6"/><circle cx="450" cy="470" r="108" fill="#F0A846" stroke="#1a2f61" stroke-width="5"/><text x="450" y="484" font-size="40" font-weight="900" fill="#1a2f61" text-anchor="middle">WIRE</text><line x1="302" y1="322" x2="218" y2="238" stroke="#c0392b" stroke-width="6" marker-end="url(#ah)"/><line x1="598" y1="322" x2="682" y2="238" stroke="#c0392b" stroke-width="6" marker-end="url(#ah)"/><line x1="302" y1="618" x2="218" y2="702" stroke="#c0392b" stroke-width="6" marker-end="url(#ah)"/><line x1="598" y1="618" x2="682" y2="702" stroke="#c0392b" stroke-width="6" marker-end="url(#ah)"/><text x="450" y="718" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">heat must escape through the insulation</text><rect x="40" y="770" width="820" height="118" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="822" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">1 - INSULATION + TERMINATIONS</text><text x="70" y="866" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Terminals set the column: 60 / 75 / 90 °C</text><rect x="40" y="906" width="820" height="118" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="958" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">2 - AMBIENT HEAT</text><text x="70" y="1002" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Hot attic? Correct the value down</text><rect x="40" y="1042" width="820" height="118" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="1094" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">3 - CONDUCTORS BUNDLED</text><text x="70" y="1138" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">More than 3 carrying? Adjust down</text><rect x="40" y="1178" width="820" height="118" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="1230" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="start">4 - THE METAL</text><text x="70" y="1274" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Copper column - or aluminum for Al/CCA</text></svg>