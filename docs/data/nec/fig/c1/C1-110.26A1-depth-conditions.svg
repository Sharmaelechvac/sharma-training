eight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">3-1/2 ft</text><text x="370.0" y="670" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3-1/2 ft</text><rect x="580" y="650" width="38" height="180" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="4"/><text x="60" y="888" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Across: grounded concrete wall</text><text x="60" y="1000" font-size="36" font-weight="800" fill="#264387" text-anchor="start">CONDITION 3</text><rect x="60" y="1030" width="100" height="180" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="110" y="1132" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">GEAR</text><line x1="160" y1="1030" x2="160" y2="1074" stroke="#1a2f61" stroke-width="2"/><line x1="640" y1="1030" x2="640" y2="1074" stroke="#1a2f61" stroke-width="2"/><line x1="160" y1="1062" x2="640" y2="1062" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="400.0" y="1050" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">4 ft</text><text x="400.0" y="1050" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4 ft</text><rect x="640" y="1030" width="100" height="180" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="690" y="1132" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">GEAR</text><text x="60" y="1268" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Across: exposed live parts</text><rect x="60" y="1400" width="780" height="92" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1458" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">At 0-150 V to ground: 3 ft in all three</text></svg>