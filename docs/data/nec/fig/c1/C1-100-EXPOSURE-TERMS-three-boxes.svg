<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Three words, three promises</title><desc id="d">Comparison of weatherproof, watertight and dusttight enclosures and what each term actually promises.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Three words, three promises</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Enclosure exposure terms — Article 100</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100; types per 110.28</text><circle cx="52" cy="247" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="257" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="90" y="258" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">WEATHERPROOF</text><rect x="70" y="290" width="160" height="160" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><line x1="84" y1="258" x2="72" y2="282" stroke="#5b6478" stroke-width="3"/><line x1="112" y1="258" x2="100" y2="282" stroke="#5b6478" stroke-width="3"/><line x1="140" y1="258" x2="128" y2="282" stroke="#5b6478" stroke-width="3"/><line x1="168" y1="258" x2="156" y2="282" stroke="#5b6478" stroke-width="3"/><line x1="196" y1="258" x2="184" y2="282" stroke="#5b6478" stroke-width="3"/><text x="150" y="378" font-size="44" font-weight="800" fill="#2e7d32" text-anchor="middle">✓</text><text x="150" y="422" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">WORKS</text><text x="280" y="328" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Weather does not stop it working</text><text x="280" y="374" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Rain may reach the equipment</text><text x="280" y="420" font-size="33" font-weight="600" fill="#c0392b" text-anchor="start">Does NOT promise water stays out</text><line x1="30" y1="512" x2="870" y2="512" stroke="#c9d2e3" stroke-width="2"/><circle cx="52" cy="577" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="587" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="90" y="588" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">WATERTIGHT</text><rect x="70" y="620" width="160" height="160" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><line x1="84" y1="588" x2="72" y2="612" stroke="#5b6478" stroke-width="3"/><line x1="112" y1="588" x2="100" y2="612" stroke="#5b6478" stroke-width="3"/><line x1="140" y1="588" x2="128" y2="612" stroke="#5b6478" stroke-width="3"/><line x1="168" y1="588" x2="156" y2="612" stroke="#5b6478" stroke-width="3"/><line x1="196" y1="588" x2="184" y2="612" stroke="#5b6478" stroke-width="3"/><rect x="82" y="632" width="136" height="136" rx="0" fill="none" stroke="#F0A846" stroke-width="4"/><text x="150" y="715" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">SEALED</text><text x="280" y="658" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Moisture does not enter</text><text x="280" y="704" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">under the test conditions</text><text x="280" y="750" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">The seal itself is the point</text><line x1="30" y1="842" x2="870" y2="842" stroke="#c9d2e3" stroke-width="2"/><circle cx="52" cy="907" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="52" y="917" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="90" y="918" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">DUSTTIGHT</text><rect x="70" y="950" width="160" height="160" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="44" cy="970" r="5" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="40" cy="1020" r="5" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="48" cy="1070" r="5" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="250" cy="980" r="5" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><circle cx="256" cy="1040" r="5" fill="#5b6478" stroke="#5b6478" stroke-width="0"/><text x="150" y="1045" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">SEALED</text><text x="280" y="988" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Dust does not enter</text><text x="280" y="1034" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">under