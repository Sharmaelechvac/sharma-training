rcle cx="258" cy="273" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="258" y="285" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="478" cy="282" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="478" y="294" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="262" cy="702" r="21" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="262" y="714" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="190" cy="200" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="190" y="212" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="60" y="990" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1 Interruptor: abre a una sobrecorriente fija</text><text x="60" y="1038" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2 Valor de interrupción: su propia etiqueta</text><text x="60" y="1086" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3 SCCR: la etiqueta de todo el conjunto</text><text x="60" y="1134" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">4 Gabinete: marco y tapa, puerta con bisagra</text><text x="60" y="1182" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Caja de corte: puerta unida a la propia caja</text><rect x="60" y="1236" width="780" height="74" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1284" font-size="33" font-weight="800" fill="#c0392b" text-anchor="middle">Que entre no significa que pertenezca ahí</text></svg>