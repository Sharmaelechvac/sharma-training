<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1660" width="900" height="1660" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.27 Protección de partes vivas</title><desc id="d">Un tablero abierto con la barra expuesta marcado como falla, y luego los cuatro medios de protección de 110.27(A): envolvente, cuarto o bóveda, divisiones o pantallas, y elevación a 8 pies u 8 pies y medio.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1660" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.27 Protección de partes vivas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Proteja partes vivas de 50 V o más</text><line x1="30" y1="1602" x2="870" y2="1602" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1640" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.27(A), 110.27(B)</text><rect x="60" y="200" width="780" height="300" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="256" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">FALLA: SIN TAPA, BARRA EXPUESTA</text><rect x="330" y="296" width="240" height="170" rx="4" fill="#264387" stroke="#1a2f61" stroke-width="4"/><line x1="360" y1="340" x2="540" y2="340" stroke="#F0A846" stroke-width="8"/><line x1="360" y1="380" x2="540" y2="380" stroke="#F0A846" stroke-width="8"/><line x1="360" y1="420" x2="540" y2="420" stroke="#F0A846" stroke-width="8"/><line x1="330" y1="296" x2="218" y2="350" stroke="#1a2f61" stroke-width="6"/><line x1="218" y1="350" x2="218" y2="466" stroke="#1a2f61" stroke-width="6"/><line x1="218" y1="466" x2="330" y2="466" stroke="#1a2f61" stroke-width="6"/><line x1="392" y1="318" x2="508" y2="444" stroke="#c0392b" stroke-width="9"/><line x1="508" y1="318" x2="392" y2="444" stroke="#c0392b" stroke-width="9"/><rect x="60" y="560" width="780" height="170" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="626" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">1 · ENVOLVENTE APROBADA</text><text x="90" y="676" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Tapas y frentes muertos en su sitio</text><rect x="60" y="756" width="780" height="170" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="90" y="822" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">2 · CUARTO O BÓVEDA</text><text x="90" y="872" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Solo entra personal calificado</text><rect x="60" y="952" width="780" height="170" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="1018" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">3 · DIVISIONES O PANTALLAS</text><text x="90" y="1068" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Permanente y resistente</text><rect x="60" y="1148" width="780" height="280" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="90" y="1214" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="start">4 · ELEVACIÓN</text><text x="90" y="1264" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Partes vivas altas, fuera de alcance</text><text x="90" y="1324" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">50–300 V → 8 ft min</text><text x="90" y="1370" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">301–600 V → 8½ ft min</text><line x1="600" y1="1244" x2="840" y2="1244" stroke="#F0A846" stroke-width="7"/><line x1="600" y1="1400" x2="840" y2="1400" stroke="#1f2937" stroke-width="5"/><text x="600" y="1356" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">piso</text><line x1="812" y1="1244" x2="812" y2="1400" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="798" y="1334.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">8 ft min</text><text x="798" y="1334.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">8 ft min</text><rect x="60" y="1464" width="780" height="104" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1530" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="middle">✓ Reponga cada tapa el mismo día</text></svg>