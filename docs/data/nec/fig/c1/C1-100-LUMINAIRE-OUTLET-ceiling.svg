<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Luminaire vs lighting outlet</title><desc id="d">Ceiling box labeled lighting outlet with the luminaire below it broken into source, distribution, housing and connection parts.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Luminaire vs lighting outlet</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The point vs the complete unit</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Art. 100 (Luminaire, Lighting Outlet)</text><line x1="60" y1="300" x2="840" y2="300" stroke="#1a2f61" stroke-width="6"/><line x1="90" y1="300" x2="90" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="165" y1="300" x2="165" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="240" y1="300" x2="240" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="315" y1="300" x2="315" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="390" y1="300" x2="390" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="465" y1="300" x2="465" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="540" y1="300" x2="540" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="615" y1="300" x2="615" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="690" y1="300" x2="690" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="765" y1="300" x2="765" y2="262" stroke="#1a2f61" stroke-width="4"/><line x1="840" y1="300" x2="840" y2="262" stroke="#1a2f61" stroke-width="4"/><rect x="370" y="205" width="160" height="95" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="262" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">BOX</text><line x1="528" y1="232" x2="542" y2="220" stroke="#1a2f61" stroke-width="3"/><text x="548" y="192" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">LIGHTING OUTLET</text><text x="548" y="233" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">box + circuit point</text><line x1="450" y1="300" x2="450" y2="380" stroke="#1f2937" stroke-width="6"/><rect x="330" y="380" width="240" height="60" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><path d="M330,440 A120,72 0 0 0 570,440" stroke="#264387" stroke-width="3" fill="#fdf3e0"/><circle cx="450" cy="468" r="14" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="375" cy="498" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="375" y="509" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="592" cy="428" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="592" y="439" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="300" cy="392" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="300" y="403" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="522" cy="332" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="522" y="343" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="70" y="640" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">LUMINAIRE = ALL FOUR TOGETHER</text><text x="70" y="712" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1  Source — lamp or LED</text><text x="70" y="770" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">2  Distributes the light — lens, reflector</text><text x="70" y="828" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">3  Positions &amp; protects — the housing</text><text x="70" y="886" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">4  Connects it to the supply</text><rect x="60" y="985" width="780" height="140" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1045" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Rough-in counts OUTLETS</text><text x="450" y="1095" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Trim counts LUMINAIRES</text></svg>