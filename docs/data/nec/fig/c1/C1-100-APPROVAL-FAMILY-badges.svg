<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Four words, one chain of trust</title><desc id="d">Four stacked badges showing the chain: the lab tests the product, the product is listed in the lab directory, the lab label rides on the product, and the AHJ approves it for the job, with identified explained below.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Four words, one chain of trust</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Article 100 — approved, identified, labeled, listed</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="210" width="780" height="130" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="130" cy="275" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="130" y="287" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="190" y="270" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">THE LAB TESTS IT</text><text x="190" y="316" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Samples checked by a testing lab</text><line x1="450" y1="340" x2="450" y2="368" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="372" width="780" height="130" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><circle cx="130" cy="437" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="130" y="449" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="190" y="432" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">LISTED</text><text x="190" y="478" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">In the lab's published list</text><line x1="450" y1="502" x2="450" y2="530" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="534" width="780" height="130" rx="14" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><circle cx="130" cy="599" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="130" y="611" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="190" y="594" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">LABELED</text><text x="190" y="640" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">The lab's mark rides on the product</text><line x1="450" y1="664" x2="450" y2="692" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="696" width="780" height="130" rx="14" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="130" cy="761" r="30" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="130" y="773" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="190" y="756" font-size="40" font-weight="800" fill="#ffffff" text-anchor="start">APPROVED</text><text x="190" y="802" font-size="32" font-weight="600" fill="#ffffff" text-anchor="start">Acceptable to the AHJ, for this job</text><rect x="60" y="868" width="780" height="130" rx="14" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="924" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">IDENTIFIED — fit for THIS use</text><text x="450" y="970" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Recognized as suitable for the specific job</text><rect x="60" y="1040" width="780" height="130" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1096" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">WELL MADE IS NOT ENOUGH</text><text x="450" y="1142" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Unlisted, where listing is required = violation</text></svg>