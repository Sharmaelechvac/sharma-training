<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" width="900" height="1260" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Tres áreas, tres tratamientos</title><desc id="d">Plano de casa con garaje, cocina y lavandería marcados: la cocina es una definición formal del Artículo 100; el garaje y la lavandería son términos de uso cuyas reglas están en el Artículo 210.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1260" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Tres áreas, tres tratamientos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Solo la cocina tiene definición del Art. 100</text><line x1="30" y1="1202" x2="870" y2="1202" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1240" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100; 210.8, 210.11, 210.52</text><rect x="60" y="210" width="780" height="590" rx="0" fill="#ffffff" stroke="#1f2937" stroke-width="5"/><rect x="60" y="210" width="290" height="590" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="3"/><rect x="350" y="210" width="270" height="280" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="3"/><rect x="620" y="210" width="220" height="280" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="3"/><text x="595" y="660" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">SALA FAMILIAR</text><text x="205" y="262" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">GARAJE</text><rect x="105" y="330" width="200" height="330" rx="28" fill="#ffffff" stroke="#264387" stroke-width="4"/><rect x="130" y="420" width="150" height="110" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="485" y="262" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">COCINA</text><rect x="385" y="320" width="90" height="60" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="430" y="415" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">FREGADERO</text><circle cx="545" cy="340" r="17" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="585" cy="340" r="17" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="545" cy="390" r="17" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="585" cy="390" r="17" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="565" y="452" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">ESTUFA</text><text x="730" y="262" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">LAVANDERÍA</text><rect x="660" y="300" width="70" height="90" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="695" cy="345" r="24" fill="#ffffff" stroke="#264387" stroke-width="3"/><rect x="745" y="300" width="70" height="90" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="780" cy="345" r="24" fill="#ffffff" stroke="#264387" stroke-width="3"/><circle cx="368" cy="238" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="368" y="250" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="92" cy="238" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="92" y="250" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="645" cy="458" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="645" y="470" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="60" y="880" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1 Cocina — definida: fregadero + cocina fija</text><text x="60" y="926" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2 Garaje — término de uso · 210.8(A)(2), 210.52(G)</text><text x="60" y="972" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3 Lavandería — término de uso · 210.11(C)(2)</text><text x="60" y="1038" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">Defina el uso antes del rough-in —</text><text x="60" y="1084" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">el nombre decide los circuitos y el GFCI.</text></svg>