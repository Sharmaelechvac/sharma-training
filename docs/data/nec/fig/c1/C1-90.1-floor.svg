roke="#F0A846" stroke-width="0"/><text x="450" y="982" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">THE SAFETY FLOOR — CODE MINIMUM</text><text x="450" y="190" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">ONE PURPOSE: SAFEGUARD PEOPLE + PROPERTY</text><rect x="40" y="1030" width="820" height="130" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1088" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">BELOW THE FLOOR = A VIOLATION</text><text x="450" y="1136" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">even when the shortcut "works"</text></svg>