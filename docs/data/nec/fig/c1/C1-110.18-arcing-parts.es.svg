<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Partes que arquean: contenga el arco</title><desc id="d">Panel comparativo: a la izquierda un interruptor con envolvente y su tapa puesta, el arco contenido dentro de la envolvente, marcado OK; a la derecha un contactor abierto sin tapa, con chispas junto a latas de pintura y cartón apilados, marcado como infracción.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Partes que arquean: conténgalo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">110.18: con envolvente, o separado y aislado</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.18</text><text x="870" y="1460" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="200" width="405" height="700" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="232" y="262" font-size="38" font-weight="800" fill="#2e7d32" text-anchor="middle">CERRADO</text><rect x="132" y="320" width="200" height="260" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><line x1="152" y1="340" x2="152" y2="560" stroke="#264387" stroke-width="3"/><circle cx="232" cy="450" r="16" fill="#F0A846" stroke="#264387" stroke-width="3"/><path d="M210,450 L228,420 L240,442 L258,412" stroke="#c0392b" stroke-width="4" fill="none"/><text x="232" y="640" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Tapa puesta.</text><text x="232" y="686" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">El arco muere</text><text x="232" y="732" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">contra el metal.</text><text x="232" y="820" font-size="40" font-weight="800" fill="#2e7d32" text-anchor="middle">✓ OK</text><rect x="465" y="200" width="405" height="700" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="667" y="262" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">ABIERTO</text><rect x="540" y="320" width="160" height="200" rx="0" fill="#ffffff" stroke="#264387" stroke-width="5"/><path d="M575,420 L600,385 L615,412 L640,378" stroke="#c0392b" stroke-width="4" fill="none"/><path d="M585,470 L608,440 L622,462 L645,435" stroke="#c0392b" stroke-width="4" fill="none"/><circle cx="620" cy="420" r="10" fill="#F0A846" stroke="#c0392b" stroke-width="3"/><rect x="702" y="420" width="146" height="100" rx="0" fill="#fdf3e0" stroke="#1f2937" stroke-width="3"/><text x="775" y="482" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">PINTURA</text><rect x="715" y="540" width="125" height="90" rx="0" fill="#eef2f9" stroke="#1f2937" stroke-width="3"/><text x="777" y="598" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle">CAJAS</text><text x="667" y="700" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Sin tapa, combustible</text><text x="667" y="746" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">apilado al lado.</text><text x="667" y="820" font-size="40" font-weight="800" fill="#c0392b" text-anchor="middle">✗ INFRACCIÓN</text><rect x="30" y="960" width="840" height="190" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="1030" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">Ninguna distancia en pulgadas aquí.</text><text x="450" y="1078" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">La regla es una condición, no una medida:</text><text x="450" y="1124" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">cerrado, o separado y aislado.</text><text x="450" y="1250" font-size="34" font-weight="600" fill="#5b6478" text-anchor="middle">Contactos, contactores y escobillas de</text><text x="450" y="1296" font-size="34" font-weight="600" fill="#5b6478" text-anchor="middle">motor arquean en uso normal. Es normal.</text></svg>