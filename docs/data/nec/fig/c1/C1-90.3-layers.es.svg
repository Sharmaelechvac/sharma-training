<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1360" width="900" height="1360" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">El libro en capas</title><desc id="d">Bloques apilados: los Capítulos 5, 6 y 7 como capas que añaden o modifican una base de los Capítulos 1 a 4; el Capítulo 8 como una caja separada e independiente; las tablas del Capítulo 9; y los anexos marcados solo como informativos, no requisitos.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1360" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">El libro en capas</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Cómo se apilan los capítulos</text><line x1="30" y1="1302" x2="870" y2="1302" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1340" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 90.3</text><text x="870" y="1340" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="28" y="198" width="354" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="205.0" y="234" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">AÑADEN O CAMBIAN</text><rect x="48" y="260" width="504" height="140" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="72" y="322" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CAPÍTULO 7</text><text x="72" y="372" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Condiciones especiales</text><rect x="48" y="420" width="504" height="140" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="72" y="482" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CAPÍTULO 6</text><text x="72" y="532" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Equipo especial</text><rect x="48" y="580" width="504" height="140" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="72" y="642" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">CAPÍTULO 5</text><text x="72" y="692" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Ocupaciones especiales</text><rect x="48" y="740" width="504" height="200" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="72" y="822" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">CAPÍTULOS 1–4</text><text x="72" y="872" font-size="32" font-weight="600" fill="#ffffff" text-anchor="start">Reglas generales</text><text x="72" y="918" font-size="32" font-weight="600" fill="#ffffff" text-anchor="start">aplican en general</text><rect x="592" y="260" width="272" height="380" rx="8" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="728" y="330" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">CAPÍTULO 8</text><text x="728" y="378" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">Comunicaciones</text><rect x="598" y="416" width="260" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="728" y="452" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">INDEPENDIENTE</text><text x="728" y="520" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Los Cap. 1–4 aplican</text><text x="728" y="562" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">solo por</text><text x="728" y="604" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">referencia</text><rect x="592" y="680" width="272" height="260" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="728" y="750" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">CAPÍTULO 9</text><text x="728" y="800" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Tablas</text><text x="728" y="848" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">citadas por los</text><text x="728" y="890" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">demás capítulos</text><rect x="48" y="990" width="816" height="140" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="72" y="1052" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">ANEXOS — NO SON REQUISITOS</text><text x="72" y="1102" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Solo explicaciones y ejemplos</text><text x="450" y="1205" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Lea una regla especial junto con</text><text x="450" y="1250" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">la regla general que modifica.</text></svg>