<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Adapte el equipo al entorno</title><desc id="d">Tres lugares con el tipo de envolvente que cada uno necesita y una instalación incorrecta: un cuarto interior seco con Tipo 1, una pared exterior costera con Tipo 3R o 4X, un cuarto de equipos de piscina con Tipo 4X y una caja interior Tipo 1 oxidándose en el cuarto de la piscina.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">El equipo según el entorno</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">110.11: identificado para el entorno de uso</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.11, 110.28</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="190" width="840" height="270" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><rect x="60" y="230" width="150" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="82" y1="230" x2="82" y2="420" stroke="#264387" stroke-width="3"/><text x="135" y="402" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">TIPO 1</text><rect x="240" y="234" width="63" height="50" rx="25" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="271.5" y="270" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">OK</text><text x="240" y="330" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Cuarto interior seco</text><text x="240" y="376" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Envolvente Tipo 1 de uso general</text><text x="240" y="422" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">aquí basta.</text><rect x="30" y="490" width="840" height="270" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><rect x="60" y="530" width="150" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="82" y1="530" x2="82" y2="720" stroke="#264387" stroke-width="3"/><text x="135" y="702" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3R / 4X</text><rect x="240" y="534" width="63" height="50" rx="25" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="271.5" y="570" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">OK</text><text x="240" y="630" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Exterior costero, aire salino</text><text x="240" y="676" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Tipo 3R mínimo; Tipo 4X donde</text><text x="240" y="722" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">haya agua de manguera y sal.</text><rect x="30" y="790" width="840" height="270" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><rect x="60" y="830" width="150" height="190" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><line x1="82" y1="830" x2="82" y2="1020" stroke="#264387" stroke-width="3"/><text x="135" y="1002" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">TIPO 4X</text><rect x="240" y="834" width="63" height="50" rx="25" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="271.5" y="870" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">OK</text><text x="240" y="930" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Equipos de piscina, cloro</text><text x="240" y="976" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">adentro: Tipo 4X — hermético</text><text x="240" y="1022" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">y resistente a la corrosión.</text><rect x="30" y="1090" width="840" height="300" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><rect x="60" y="1130" width="150" height="220" rx="0" fill="#fbe9e7" stroke="#264387" stroke-width="4"/><line x1="82" y1="1130" x2="82" y2="1350" stroke="#264387" stroke-width="3"/><text x="135" y="1332" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">TIPO 1</text><rect x="215" y="1134" width="230" height="50" rx="25" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="330" y="1170" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">INCORRECTO</text><text x="240" y="1230" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Caja Tipo 1 interior en la piscina:</text><text x="240" y="1276" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">la sal y el cloro se comen juntas y</text><text x="240" y="1322" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">bornes. Falla pronto y caliente.</text><text x="450" y="1470" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">El tipo marcado manda, no la pintura.</text></svg>