<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 90: map of the Code</title><desc id="d">Stacked map of the NEC: Chapters 1 to 4 apply generally, Chapters 5, 6 and 7 supplement or modify them, Chapter 8 stands apart, Chapter 9 holds tables and the annexes are explanatory only.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 90: map of the Code</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">How the nine chapters stack up</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 90 (90.1–90.5)</text><rect x="60" y="200" width="780" height="210" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="282" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle">CHAPTERS 1–4</text><text x="450" y="336" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">General rules — they apply everywhere</text><text x="450" y="380" font-size="32" font-weight="700" fill="#F0A846" text-anchor="middle">Wiring, protection, methods, equipment</text><line x1="450" y1="424" x2="450" y2="472" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="512" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Chapters 5, 6, 7 add to these — or change them</text><rect x="60" y="540" width="780" height="190" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="618" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="middle">CHAPTERS 5 · 6 · 7</text><text x="450" y="672" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Special places · special equipment</text><text x="450" y="712" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">special conditions</text><rect x="60" y="770" width="780" height="180" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="846" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="middle">CHAPTER 8</text><text x="450" y="900" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Communications — stands apart on its own</text><rect x="60" y="990" width="780" height="180" rx="10" fill="#ffffff" stroke="#c9d2e3" stroke-width="4"/><text x="450" y="1066" font-size="42" font-weight="900" fill="#1a2f61" text-anchor="middle">CHAPTER 9 + ANNEXES</text><text x="450" y="1120" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Tables you look up · annexes explain,</text><text x="450" y="1160" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">they do not require</text><rect x="60" y="1220" width="780" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1272" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">“Shall” = you must.</text><text x="450" y="1314" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">“Shall be permitted” = you may.</text><text x="450" y="1356" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">A note explains — it cannot fail you.</text></svg>