<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Dos dispositivos, dos disparos</title><desc id="d">Una barra GFCI marcada en 4 y 6 miliamperios junto a una barra GFPE marcada en cientos de amperios, con la advertencia de que el GFPE no es protección de personas.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Dos dispositivos, dos disparos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Personas: miliamperios. Equipos: amperios.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100 — GFCI and GFPE</text><rect x="30" y="205" width="840" height="330" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="60" y="272" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">GFCI — PROTEGE PERSONAS</text><rect x="80" y="392" width="296" height="52" rx="0" fill="#c9d2e3" stroke="#c9d2e3" stroke-width="0"/><rect x="524" y="392" width="296" height="52" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><line x1="80" y1="418" x2="820" y2="418" stroke="#1f2937" stroke-width="3"/><line x1="80" y1="392" x2="80" y2="444" stroke="#1f2937" stroke-width="3"/><text x="80" y="372" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">0</text><line x1="376" y1="392" x2="376" y2="444" stroke="#1f2937" stroke-width="3"/><text x="376" y="372" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">4 mA</text><line x1="524" y1="392" x2="524" y2="444" stroke="#1f2937" stroke-width="3"/><text x="524" y="372" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">6 mA</text><line x1="820" y1="392" x2="820" y2="444" stroke="#1f2937" stroke-width="3"/><text x="820" y="372" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">10 mA</text><text x="228" y="492" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">no debe disparar</text><text x="672" y="492" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">debe disparar</text><rect x="30" y="575" width="840" height="330" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="60" y="642" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">GFPE — PROTEGE EQUIPOS</text><rect x="228" y="762" width="592" height="52" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><line x1="80" y1="788" x2="820" y2="788" stroke="#1f2937" stroke-width="3"/><line x1="80" y1="762" x2="80" y2="814" stroke="#1f2937" stroke-width="3"/><text x="80" y="742" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">0</text><line x1="228" y1="762" x2="228" y2="814" stroke="#1f2937" stroke-width="3"/><text x="228" y="742" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">100 A</text><line x1="524" y1="762" x2="524" y2="814" stroke="#1f2937" stroke-width="3"/><text x="524" y="742" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">300 A</text><line x1="820" y1="762" x2="820" y2="814" stroke="#1f2937" stroke-width="3"/><text x="820" y="742" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">500 A</text><text x="450" y="862" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">dispara en cientos de amperios</text><rect x="30" y="945" width="840" height="130" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1005" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">El GFPE NO protege a una persona</text><text x="450" y="1052" font-size="32" font-weight="600" fill="#c0392b" text-anchor="middle">Proteger personas es tarea del GFCI</text><text x="30" y="1160" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Mismas palabras — «falla a tierra» —</text><text x="30" y="1206" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">dos dispositivos distintos. Pregunte cuál es.</text></svg>