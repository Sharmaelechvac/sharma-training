<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.20 Equipo reacondicionado</title><desc id="d">Flujo de decisión para equipo usado: ¿fue reconstruido o solo recibió servicio?, ¿quién lo reconstruyó? y ¿su artículo permite el reacondicionamiento?, terminando en aceptación documentada o en una caja roja de no instalarlo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1250" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.20 Equipo reacondicionado</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Nuevo en 2023; en 2020, solo la marca</text><line x1="30" y1="1192" x2="870" y2="1192" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1230" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.21(A)(2); 110.20 added in NEC 2023</text><rect x="90" y="200" width="720" height="105" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="265" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">EQUIPO USADO PARA EL TRABAJO</text><line x1="450" y1="305" x2="450" y2="340" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="345" width="720" height="125" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="397" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">1 — ¿RECONSTRUIDO O SERVICIO?</text><text x="450" y="442" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Cambiar piezas = servicio, no reconstrucción</text><line x1="450" y1="470" x2="450" y2="505" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="510" width="720" height="125" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="562" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">2 — ¿QUIÉN LO RECONSTRUYÓ?</text><text x="450" y="607" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Nombre + fecha marcados en el equipo</text><line x1="450" y1="635" x2="450" y2="670" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="675" width="720" height="125" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="727" font-size="38" font-weight="900" fill="#1a2f61" text-anchor="middle">3 — ¿PUEDE REACONDICIONARSE?</text><text x="450" y="772" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Su artículo decide: algunos no pueden</text><line x1="450" y1="800" x2="450" y2="840" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="845" width="720" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="908" font-size="34" font-weight="900" fill="#2e7d32" text-anchor="middle">DOCUMENTADO → LA AHJ LO ACEPTA</text><rect x="90" y="975" width="720" height="100" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1038" font-size="34" font-weight="900" fill="#c0392b" text-anchor="middle">SIN NOMBRE NI FECHA → NO LO INSTALE</text></svg>