<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.24 — Marque la corriente</title><desc id="d">Desconexión de acometida con una placa de marcado en campo que muestra la corriente de falla disponible de 22 kA y la fecha del cálculo, una flecha a la carpeta de obra con el cálculo documentado y un flujo que muestra que un cambio de transformador de la compañía eléctrica obliga a recalcular según 110.24(B).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.24 — Marque la corriente</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">El número, la fecha, el papeleo</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.24, 110.9</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="210" width="360" height="430" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="240" y="268" font-size="36" font-weight="900" fill="#264387" text-anchor="middle">ACOMETIDA</text><text x="240" y="312" font-size="36" font-weight="900" fill="#264387" text-anchor="middle">DESCONEXIÓN</text><rect x="368" y="380" width="40" height="150" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><rect x="82" y="356" width="262" height="268" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="213" y="396" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">MÁX. DISPONIBLE</text><text x="213" y="430" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">CORRIENTE</text><text x="213" y="464" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">DE FALLA</text><text x="213" y="524" font-size="48" font-weight="900" fill="#1a2f61" text-anchor="middle">22 kA</text><text x="213" y="572" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FECHA CÁLC.:</text><text x="213" y="610" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">NOV 2026</text><text x="246" y="690" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">marcado en campo — 110.24(A)</text><line x1="430" y1="420" x2="520" y2="420" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="540" y="330" width="300" height="220" rx="8" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><rect x="540" y="306" width="130" height="34" rx="8" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><rect x="566" y="380" width="248" height="130" rx="0" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><text x="586" y="424" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">Cálculo</text><text x="586" y="464" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">documentado +</text><text x="586" y="504" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">disponible</text><text x="690" y="596" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">carpeta de obra</text><text x="60" y="800" font-size="36" font-weight="900" fill="#264387" text-anchor="start">CUANDO EL NÚMERO CAMBIA — 110.24(B)</text><rect x="60" y="836" width="780" height="92" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="896" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">La eléctrica cambia el transformador</text><line x1="450" y1="928" x2="450" y2="958" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="958" width="780" height="92" rx="10" fill="#fdf3e0" stroke="#1a2f61" stroke-width="4"/><text x="450" y="1018" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Sube la corriente de falla</text><line x1="450" y1="1050" x2="450" y2="1080" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="1080" width="780" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1140" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Recalcule, remarque y revise valores</text><line x1="450" y1="1172" x2="450" y2="1202" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/></svg>