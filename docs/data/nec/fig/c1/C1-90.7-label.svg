<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Read the label first</title><desc id="d">Panel label plate with callouts for the listing mark, the ratings on the label, and the manufacturer instructions.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Read the label first</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Equipment examined for safety — 90.7</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 90.7 · 110.3(B)</text><text x="870" y="1500" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="195" y="205" width="510" height="620" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="258" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">PANELBOARD</text><rect x="245" y="295" width="410" height="430" rx="8" fill="#ffffff" stroke="#1a2f61" stroke-width="4"/><text x="450" y="350" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">EQUIPMENT LABEL</text><line x1="265" y1="374" x2="635" y2="374" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="440" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">LISTING MARK</text><text x="450" y="490" font-size="33" font-weight="600" fill="#5b6478" text-anchor="middle">of a qualified</text><text x="450" y="534" font-size="33" font-weight="600" fill="#5b6478" text-anchor="middle">testing laboratory</text><line x1="265" y1="566" x2="635" y2="566" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="624" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">RATINGS ON LABEL</text><line x1="265" y1="652" x2="635" y2="652" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="706" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">INSTRUCTIONS IN BOX</text><circle cx="735" cy="440" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="735" y="452" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="735" cy="624" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="735" y="636" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="735" cy="706" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="735" y="718" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="60" y="905" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1 Listing mark — tested by a qualified lab</text><text x="60" y="953" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2 Ratings — the label sets the limits</text><text x="60" y="1001" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3 Instructions — part of the listing</text><rect x="40" y="1050" width="820" height="96" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1116" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">Mark + label present → ready for approval</text><rect x="40" y="1170" width="820" height="96" rx="14" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1236" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">No mark, no paperwork → raise it first</text><text x="450" y="1340" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">Check the gear when it arrives,</text><text x="450" y="1390" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">not after it is wired.</text></svg>