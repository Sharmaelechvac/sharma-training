<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.36-110.41 — Ingeniería</title><desc id="d">Flujo sin valores para la página no verificada: tres tarjetas, 110.36 conductores, 110.40 temperatura de terminación, 110.41 inspecciones y pruebas antes de energizar, que llevan a una puerta donde decide el ingeniero, con una franja roja de no verificado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.36-110.41 — Ingeniería</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Más de 1000 voltios — solo orientación en este libro</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.36, 110.40, 110.41</text><rect x="40" y="195" width="820" height="80" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="248" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">SIN VERIFICAR — REVISE EN IMPRESO</text><rect x="40" y="315" width="820" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="373" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">110.36 — CONDUCTORES DEL CIRCUITO</text><text x="70" y="420" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Elegidos de los documentos de diseño</text><rect x="40" y="465" width="820" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="523" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">110.40 — TEMPERATURA DE TERMINACIÓN</text><text x="70" y="570" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Límites fijados por los documentos de diseño</text><rect x="40" y="615" width="820" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="673" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">110.41 — ANTES DE ENERGIZAR</text><text x="70" y="720" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Inspecciones y pruebas, documentadas</text><line x1="450" y1="765" x2="450" y2="805" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="140" y="810" width="620" height="125" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="450" y="865" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">EL INGENIERO DECIDE</text><text x="450" y="912" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">El criterio de campo se detiene aquí</text><rect x="40" y="975" width="820" height="120" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="1030" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">ENERGIZAR</text><text x="450" y="1078" font-size="32" font-weight="700" fill="#F0A846" text-anchor="middle">Solo tras documentar las pruebas de 110.41</text><rect x="40" y="1130" width="820" height="95" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1190" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Sharma eleva las preguntas de diseño</text></svg>