<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Lockable means it stays lockable</title><desc id="d">Two disconnects with permanent lock-off provisions, one with the padlock on and one with it removed, over a panel showing an improvised wire wrap that does not count.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Lockable means it stays lockable</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">110.25 — the provision is part of the installation</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.25</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="30" y="200" width="405" height="500" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="232" y="258" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">LOCK APPLIED</text><rect x="147" y="300" width="170" height="250" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="171" y="326" width="122" height="62" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="232.0" y="368" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">OFF</text><line x1="232.0" y1="418" x2="232.0" y2="496" stroke="#1a2f61" stroke-width="10"/><circle cx="232.0" cy="418" r="13" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><path d="M206.0,470 v-14 a26,26 0 0 1 52,0 v14" stroke="#1a2f61" stroke-width="7" fill="none"/><rect x="192.0" y="470" width="80.0" height="62.0" rx="10" fill="#F0A846" stroke="#1a2f61" stroke-width="4"/><circle cx="232" cy="494.0" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="232" y1="498.0" x2="232" y2="514.0" stroke="#1a2f61" stroke-width="7"/><path d="M68,640 l11,12 l22,-26" stroke="#2e7d32" stroke-width="6" fill="none"/><text x="112" y="652" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Provision installed</text><rect x="465" y="200" width="405" height="500" rx="12" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="667" y="258" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">LOCK REMOVED</text><rect x="582" y="300" width="170" height="250" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="606" y="326" width="122" height="62" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="667.0" y="368" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">OFF</text><line x1="667.0" y1="418" x2="667.0" y2="496" stroke="#1a2f61" stroke-width="10"/><circle cx="667.0" cy="418" r="13" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="640" y="446" width="56" height="30" rx="6" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="668" cy="461" r="8" fill="#ffffff" stroke="#1a2f61" stroke-width="3"/><rect x="628" y="500" width="80" height="62" rx="10" fill="#ffffff" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 8"/><text x="668" y="542" font-size="36" font-weight="800" fill="#5b6478" text-anchor="middle">?</text><path d="M503,630 l11,12 l22,-26" stroke="#2e7d32" stroke-width="6" fill="none"/><text x="547" y="642" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Provision stays</text><text x="547" y="682" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">in place</text><rect x="30" y="740" width="840" height="330" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="798" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">NOT A LOCKABLE DISCONNECT</text><rect x="70" y="830" width="130" height="200" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="94" y="856" width="82" height="62" rx="6" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="135.0" y="898" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">OFF</text><line x1="135.0" y1="948" x2="135.0" y2="1026" stroke="#1a2f61" stroke-width="10"/><circle cx="135.0" cy="948" r="13" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><path d="M125,958 q35,-14 70,0 q-35,14 -70,0" stroke="#c0392b" stroke-width="5" fill="none"/><path d="M125,976 q35,-14 70,0 q-35,14 -70,0" stroke="#c0392b" stroke-width="5" fill="none"/><path d="M125,994 q35,-14 70,0 q-35,14 -70,0" stroke="#c0392b" stroke-width="5" fill="none"/><rect x="228" y="892" width="84" height="42" rx="4" fill="#fdf3e0" stroke="#c0392b" stroke-width="3"/><text x="270" y="924" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">TAPE</text><line x1="338" y1="854" x2="366" y2="882" stroke="#c0392b" stroke-width="6"/><line x1="338" y1="882" x2="366" y2="854" stroke="#c0392b" stroke-width="6"/><text x="385" y="876" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Wire, tape or a zip tie</text><text x="385" y="920" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">around the handle is</text><text x="385" y="964" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">improvised. Nothing</text><text x="385" y="1008" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">stays in place, and</text><text x="385" y="1052" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">nothing holds it open.</text></svg>