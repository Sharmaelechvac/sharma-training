<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Tres interruptores, 3 usos</title><desc id="d">Tres paneles apilados: un interruptor de uso general con valor nominal en amperios, un seccionador sin capacidad de interrupción y un interruptor de circuito de motor con valor nominal en caballos de fuerza.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Tres interruptores, 3 usos</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Misma palanca — revise su capacidad de corte</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100 — Switch definitions</text><rect x="30" y="200" width="840" height="290" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="60" y="272" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">INTERRUPTOR DE USO GENERAL</text><text x="60" y="322" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Controla alumbrado y cargas de aparatos</text><circle cx="812" cy="258" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="812" y="269" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="620" y="330" width="26" height="90" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><circle cx="633" cy="360" r="10" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><circle cx="300" cy="400" r="34" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><line x1="268.8" y1="382.0" x2="248" y2="370" stroke="#F0A846" stroke-width="4"/><line x1="300.0" y1="365.2" x2="300" y2="342" stroke="#F0A846" stroke-width="4"/><line x1="331.2" y1="382.0" x2="352" y2="370" stroke="#F0A846" stroke-width="4"/><text x="300" y="478" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">lámpara</text><rect x="549" y="438" width="296" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="697.0" y="472" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">EN AMPERIOS</text><rect x="30" y="530" width="840" height="290" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="60" y="602" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">SECCIONADOR</text><text x="60" y="652" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Aísla un circuito de su fuente</text><circle cx="812" cy="588" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="812" y="599" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><line x1="250" y1="775" x2="250" y2="705" stroke="#1f2937" stroke-width="5"/><line x1="250" y1="705" x2="390" y2="655" stroke="#c0392b" stroke-width="6"/><circle cx="250" cy="705" r="12" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="450" y="700" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">se abre solo si la carga</text><text x="450" y="746" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">se cortó en otro punto</text><rect x="448" y="763" width="397" height="48" rx="24" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="646.5" y="797" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">SIN PODER DE CORTE</text><rect x="30" y="860" width="840" height="290" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="60" y="932" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">INTERRUPTOR DE MOTOR</text><text x="60" y="982" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Hecho para el motor que sirve</text><circle cx="812" cy="918" r="22" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="812" y="929" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><circle cx="330" cy="1050" r="48" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="330" y="1064" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">M</text><text x="330" y="1128" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">motor</text><rect x="498" y="1068" width="347" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="671.5" y="1102" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">NOMINAL EN HP</text><text x="30" y="1230" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Uso general: nominal en amperios</text><text x="30" y="1276" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Seccionador: solo aísla, sin nominal</text><text x="30" y="1322" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  De motor: nominal en caballos (HP)</text></svg>