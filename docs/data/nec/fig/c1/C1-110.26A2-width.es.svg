<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Ancho del espacio de trabajo</title><desc id="d">Vista frontal que compara un tablero de 16 in dentro de un ancho de trabajo de 30 in con un tablero de distribución de 48 in cuyo ancho fija su propio espacio de trabajo.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Ancho del espacio de trabajo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista frontal — dos casos, sin escala</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.26(A)(2)</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><line x1="30" y1="290" x2="870" y2="290" stroke="#1f2937" stroke-width="5"/><rect x="98" y="290" width="164" height="400" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="180" y="500" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">TABLERO</text><text x="180" y="548" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">16 in</text><rect x="60" y="690" width="350" height="80" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="10 6"/><line x1="60" y1="770" x2="60" y2="850" stroke="#1a2f61" stroke-width="2"/><line x1="410" y1="770" x2="410" y2="850" stroke="#1a2f61" stroke-width="2"/><line x1="60" y1="838" x2="410" y2="838" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="235.0" y="826" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">30 in min</text><text x="235.0" y="826" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">30 in min</text><text x="235" y="925" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">tablero de 16 in</text><text x="235" y="970" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">manda el mínimo de 30 in</text><rect x="490" y="290" width="360" height="400" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="670" y="500" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">TABLERO DE DIST.</text><text x="670" y="548" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">48 in</text><rect x="490" y="690" width="360" height="80" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="10 6"/><line x1="490" y1="770" x2="490" y2="850" stroke="#1a2f61" stroke-width="2"/><line x1="850" y1="770" x2="850" y2="850" stroke="#1a2f61" stroke-width="2"/><line x1="490" y1="838" x2="850" y2="838" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="670.0" y="826" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">48 in — ancho del equipo</text><text x="670.0" y="826" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">48 in — ancho del equipo</text><text x="670" y="925" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">tablero de 48 in</text><text x="670" y="970" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">manda su propio ancho</text><text x="30" y="1085" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">Puertas y paneles en el espacio</text><text x="30" y="1133" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="start">abrir al menos 90° — 110.26(A)(2)</text><text x="30" y="1205" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">El ancho debe quedar libre — no es almacén.</text></svg>