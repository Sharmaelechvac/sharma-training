<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">110.3(B) — La etiqueta es ley</title><desc id="d">Etiqueta ampliada de la puerta de un tablero con cuatro líneas de instrucción numeradas: tabla de torque del terminal principal, marca de terminal CU-AL, terminaciones de 75 grados e instrucciones de montaje, con una leyenda y una banda de advertencia.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">110.3(B) — La etiqueta es ley</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Etiqueta de puerta de tablero, ampliada</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 110.3(B)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="200" width="780" height="700" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="120" y="260" width="660" height="560" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="335" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">INSTRUCCIONES DEL TABLERO</text><line x1="160" y1="365" x2="740" y2="365" stroke="#c9d2e3" stroke-width="3"/><circle cx="205" cy="448" r="22" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="205" y="460" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="255" y="460" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">TORQUE PRINCIPAL — TABLA A</text><circle cx="205" cy="543" r="22" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="205" y="555" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="255" y="555" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">TERMINALES: CU-AL</text><circle cx="205" cy="638" r="22" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="205" y="650" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="255" y="650" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">TERMINACIONES: 75 °C</text><circle cx="205" cy="733" r="22" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="205" y="745" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="255" y="745" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">MONTE COMO SE INDICA</text><circle cx="70" cy="978" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="990" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="115" y="990" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Torque: manda el valor impreso — 110.14(D)</text><circle cx="70" cy="1054" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="1066" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="115" y="1066" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Metal del conductor: CU-AL, o solo CU</text><circle cx="70" cy="1130" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="1142" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="115" y="1142" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Temperatura: la columna terminal — 110.14(C)</text><circle cx="70" cy="1206" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="70" y="1218" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="115" y="1218" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Montaje: como indica la hoja</text><rect x="40" y="1330" width="820" height="95" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1390" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Instrucciones ignoradas = listado nulo</text></svg>