<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 100 — One dictionary</title><desc id="d">An open book labeled Article 100 showing its three parts: general definitions, over 1000 volts, and hazardous locations.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 100 — One dictionary</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">2020 edition: three parts, A–Z in each</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 100</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="230" width="780" height="670" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="5"/><line x1="450" y1="230" x2="450" y2="900" stroke="#1a2f61" stroke-width="4"/><line x1="90" y1="230" x2="90" y2="900" stroke="#c9d2e3" stroke-width="2"/><line x1="810" y1="230" x2="810" y2="900" stroke="#c9d2e3" stroke-width="2"/><text x="105" y="300" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PART I</text><text x="105" y="347" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">General</text><text x="105" y="425" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Accessible</text><line x1="105" y1="442" x2="400" y2="442" stroke="#c9d2e3" stroke-width="2"/><text x="105" y="483" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Listed</text><line x1="105" y1="500" x2="400" y2="500" stroke="#c9d2e3" stroke-width="2"/><text x="105" y="541" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Outlet</text><line x1="105" y1="558" x2="400" y2="558" stroke="#c9d2e3" stroke-width="2"/><text x="105" y="599" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Luminaire</text><line x1="105" y1="616" x2="400" y2="616" stroke="#c9d2e3" stroke-width="2"/><text x="105" y="657" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Service</text><line x1="105" y1="674" x2="400" y2="674" stroke="#c9d2e3" stroke-width="2"/><text x="480" y="305" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PART II</text><text x="480" y="352" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Over 1000 volts</text><text x="480" y="470" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">PART III</text><text x="480" y="527" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Hazardous</text><text x="480" y="574" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">(classified)</text><text x="480" y="680" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Terms sit A–Z in</text><text x="480" y="732" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">each part — not in</text><text x="480" y="784" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">numbered sections</text><text x="450" y="990" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Defined once — same meaning everywhere</text><text x="450" y="1030" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">Everyday meaning does not control</text><rect x="60" y="1090" width="780" height="130" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1148" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">When a word is defined,</text><text x="450" y="1198" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">Article 100 wins the argument.</text></svg>