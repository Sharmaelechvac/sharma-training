<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">685 — Tres puertas, luego el alivio</title><desc id="d">Diagrama de flujo: tres condiciones de calificación de 685.1 (se requiere apagado ordenado, solo personas calificadas con nombres en registro permanente, protecciones que acepta la AHJ) llevan a un sistema eléctrico integrado, después del cual aplican las concesiones de 685.10, 685.12 y 685.14.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">685 — Tres puertas, luego el alivio</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Las tres condiciones deben cumplirse a la vez</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 685.1, 685.10, 685.12, 685.14</text><rect x="70" y="210" width="760" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="266" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">1  SE REQUIERE APAGADO ORDENADO</text><text x="450" y="310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">La pérdida súbita de energía es el peligro</text><rect x="409.5" y="348" width="81" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="384" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Y</text><rect x="70" y="400" width="760" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="456" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">2  SOLO PERSONAS CALIFICADAS</text><text x="450" y="500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Nombres en registro permanente</text><rect x="409.5" y="538" width="81" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="574" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Y</text><rect x="70" y="590" width="760" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="646" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">3  PROTECCIONES ACEPTADAS POR AHJ</text><text x="450" y="690" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Establecidas y mantenidas</text><line x1="450" y1="740" x2="450" y2="802" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="70" y="810" width="760" height="104" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="450" y="872" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="middle">SISTEMA INTEGRADO — ARTÍCULO 685</text><text x="450" y="976" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">Lo que el artículo permite entonces</text><rect x="90" y="1020" width="720" height="112" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1072" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">685.10 — OCPD ubicados por seguridad</text><text x="450" y="1114" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Dispositivos críticos fuera de alcance</text><rect x="90" y="1160" width="720" height="112" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1212" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">685.12 — DC de dos hilos sin tierra</text><text x="450" y="1254" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Permitido donde el sistema califica</text><rect x="90" y="1300" width="720" height="112" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1352" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">685.14 — Controles de 150 V o menos</text><text x="450" y="1394" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Pueden ir sin tierra por continuidad</text></svg>