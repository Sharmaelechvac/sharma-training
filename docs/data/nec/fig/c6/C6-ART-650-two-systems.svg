<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">650 — Two systems in one organ</title><desc id="d">One-line diagram of a pipe organ installation: a 120 volt branch circuit feeds a transformer-type rectifier limited to 30 volts dc, protected at not more than 6 amperes, supplying console signal circuits of 28 AWG minimum and chest magnet circuits of 26 AWG minimum with a 14 AWG main common return. The blower motor sits on its own Article 430 motor circuit.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">650 — Two systems in one organ</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Action circuits are DC, 30 V max — the blower is not</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 650.4, 650.6, 650.8</text><rect x="110" y="210" width="680" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="264" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">120 V BRANCH CIRCUIT</text><text x="450" y="310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">line-voltage side — Sharma rough-in</text><line x1="450" y1="320" x2="450" y2="368" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="372" width="680" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="426" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">RECTIFIER (650.4)</text><text x="450" y="472" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">transformer type — DC out 30 V max</text><line x1="450" y1="490" x2="450" y2="538" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="542" width="680" height="104" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="596" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">FUSE — NOT OVER 6 A (650.8)</text><line x1="450" y1="646" x2="450" y2="694" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="698" width="680" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="752" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">CONSOLE + KEYBOARDS</text><text x="450" y="798" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">signal circuits: 28 AWG minimum</text><line x1="450" y1="816" x2="450" y2="864" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="868" width="680" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="922" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">CHEST MAGNETS (VALVES)</text><text x="450" y="968" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">supply 26 AWG min — return 14 AWG min</text><rect x="110" y="1030" width="680" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="1082" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">RECTIFIER BONDED TO THE EGC (650.5)</text><text x="450" y="1124" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">the case is grounded — the output is not</text><rect x="110" y="1180" width="680" height="118" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1234" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">BLOWER MOTOR — ARTICLE 430</text><text x="450" y="1280" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">a motor circuit, not the action system</text></svg>