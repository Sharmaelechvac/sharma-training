2="985" stroke="#264387" stroke-width="10"/><rect x="182" y="950" width="170" height="90" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="267" y="1007" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">INVERSOR</text><rect x="418" y="868" width="24" height="24" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="2"/><text x="415" y="858" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="end">CANAL. METÁLICA</text><text x="415" y="900" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="end">690.31(D)</text><circle cx="520" cy="640" r="18" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="520" y="651" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="578" cy="750" r="18" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="578" y="761" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="472" cy="880" r="18" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="472" y="891" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="565" y="820" width="320" height="170" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="725" y="868" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">NO PASA</text><text x="725" y="912" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">THHN al sol</text><text x="725" y="952" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">CC en PVC adentro</text><text x="40" y="1258" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">EN EL PLANO</text><text x="40" y="1304" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1 Recorridos con cable FV listado, en el techo</text><text x="40" y="1348" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2 Penetración — la CC entra al edificio</text><text x="40" y="1392" font-size="32" font-weight="600" fill="#1