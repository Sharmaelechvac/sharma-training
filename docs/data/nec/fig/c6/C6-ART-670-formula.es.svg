<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">670.4(A): la placa hace el cálculo</title><desc id="d">Gráfico de barras de la fórmula de ampacidad de alimentación de 670.4(A): calor por resistencia al 125 por ciento, el motor mayor al 125 por ciento y todas las demás cargas al 100 por ciento, que suman una alimentación mínima de 62 A para el ejemplo práctico.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1240" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">670.4(A): la placa hace el cálculo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Gráfico de barras — el ejemplo práctico, en amperios</text><line x1="30" y1="1182" x2="870" y2="1182" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1220" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 670.3(A) · 670.4(A)</text><rect x="90" y="185" width="720" height="150" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="242" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PLACA DE LA MÁQUINA — 670.3(A)</text><text x="450" y="292" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">FLC · SCCR · motor mayor</text><text x="60" y="420" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">CALOR POR RESISTENCIA — 16 A × 125%</text><rect x="60" y="438" width="260" height="58" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="338" y="478" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">20 A</text><text x="60" y="590" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">MOTOR MAYOR — 24 A × 125%</text><rect x="60" y="608" width="390" height="58" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="468" y="648" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">30 A</text><text x="60" y="760" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">OTRAS CARGAS — 12 A × 100%</text><rect x="60" y="778" width="156" height="58" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="234" y="818" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">12 A</text><rect x="190" y="940" width="520" height="84" rx="42" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="995" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">ALIMENTACIÓN ≥ 62 A</text><text x="450" y="1090" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">Dimensionado desde la placa — nunca un cálculo 430</text></svg>