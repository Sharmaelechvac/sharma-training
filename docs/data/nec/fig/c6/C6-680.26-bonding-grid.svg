<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680.26 — Equipotential bonding</title><desc id="d">Plan view of a pool: a bare 8 AWG bonding ring around the shell ties the water, ladder and pump to one potential, while the green equipment grounding conductor runs separately from the pump back to the panel.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680.26 — Equipotential bonding</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plan view — one potential at the pool</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.26</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="450" y="240" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">BONDING RING — BARE 8 AWG</text><rect x="140" y="260" width="620" height="620" rx="0" fill="none" stroke="#F0A846" stroke-width="6"/><rect x="200" y="320" width="500" height="500" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="450" y="480" font-size="36" font-weight="700" fill="#1a2f61" text-anchor="middle">WATER</text><rect x="303.0" y="544" width="294" height="52" rx="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="582" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">0 V DIFFERENCE</text><text x="450" y="655" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">water = deck = ladder = pump</text><rect x="668" y="520" width="32" height="20" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="668" y="600" width="32" height="20" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><line x1="684" y1="540" x2="684" y2="600" stroke="#264387" stroke-width="4"/><line x1="700" y1="570" x2="760" y2="570" stroke="#F0A846" stroke-width="5"/><circle cx="800" cy="570" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="800" y="583" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="680" y1="880" x2="680" y2="950" stroke="#F0A846" stroke-width="5"/><rect x="600" y="950" width="160" height="80" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><text x="680" y="1005" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">PUMP</text><circle cx="795" cy="990" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="795" y="1003" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="120" y="950" width="160" height="80" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="200" y="1005" font-size="36" font-weight="700" fill="#1f2937" text-anchor="middle">PANEL</text><line x1="280" y1="990" x2="600" y2="990" stroke="#2e7d32" stroke-width="5"/><text x="440" y="1080" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="middle">GREEN EGC — FAULT PATH HOME</text><circle cx="330" cy="990" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="330" y="1003" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="60" y="1150" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1  Ladder and rails — bonded to the grid</text><text x="60" y="1195" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2  Pump — bonded, and on the green EGC</text><text x="60" y="1240" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3  Panel — EGC goes home; grid stays</text><text x="60" y="1290" font-size="32" font-weight="700" fill="#c0392b" text-anchor="start">Bonding grid: no run to the panel required</text></svg>