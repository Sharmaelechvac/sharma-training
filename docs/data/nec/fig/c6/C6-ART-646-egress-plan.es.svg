<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">646.19 — Una salida en cada extremo</title><desc id="d">Vista en planta de un centro de datos modular: una fila de equipos de más de 6 ft de ancho en el centro, espacio de trabajo al frente según 110.26 y una puerta en cada extremo del módulo, cada una de al menos 24 in de ancho con herraje antipánico listado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">646.19 — Una salida en cada extremo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vista en planta: equipo de más de 6 ft de ancho</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 646.18, 646.19</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="90" y="240" width="720" height="520" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="6"/><text x="450" y="292" font-size="34" font-weight="700" fill="#5b6478" text-anchor="middle">CENTRO DE DATOS MODULAR</text><rect x="200" y="560" width="500" height="90" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="618" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">ESPACIO DE TRABAJO — 110.26</text><rect x="200" y="400" width="500" height="150" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="468" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">PDU / EQUIPOS DE TI</text><text x="450" y="516" font-size="32" font-weight="600" fill="#F0A846" text-anchor="middle">cableado de fábrica, listado</text><line x1="200" y1="368" x2="700" y2="368" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="450.0" y="356" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">equipo de más de 6 ft de ancho</text><text x="450.0" y="356" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">equipo de más de 6 ft de ancho</text><rect x="78" y="452" width="24" height="96" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><rect x="798" y="452" width="24" height="96" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><line x1="52" y1="452" x2="52" y2="548" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(40,500.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">24 in min</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">24 in min</text></g><line x1="848" y1="452" x2="848" y2="548" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(836,500.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">24 in min</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">24 in min</text></g><line x1="450" y1="880" x2="450" y2="764" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="922" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">alimentador a terminales marcados</text><circle cx="140" cy="500" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="140" y="512" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="760" cy="500" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="760" y="512" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="90" y="1030" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Puerta en cada extremo: 24 in x 6-1/2 ft mín.</text><text x="90" y="1071" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">    Herraje antipánico o contra incendios listado</text><text x="90" y="1112" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">    Las puertas abren en dirección de salida</text><text x="90" y="1153" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">    Una sola puerta solo si se cumple 646.19(A) o (B)</text></svg>