<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Dimensione por ciclo de trabajo</title><desc id="d">Flujo de cuatro pasos para dimensionar un circuito de soldadora: lea la corriente primaria nominal y el ciclo de trabajo de la placa, tome el multiplicador de la Tabla 630.11(A), dimensione los conductores a la corriente multiplicada y limite el interruptor al 200 por ciento de la corriente primaria nominal. Abajo, un gráfico de barras de los multiplicadores de la Tabla 630.11(A) para soldadoras de arco sin motor-generador.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Dimensione por ciclo de trabajo</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Caso: soldadora de 50 A, ciclo de trabajo del 60%</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 630.11, Table 630.11(A), 630.12</text><rect x="90" y="200" width="720" height="168" rx="12" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="252" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">1 — LEA LA PLACA DE DATOS</text><text x="450" y="302" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">Corriente primaria nominal: 50 A</text><text x="450" y="348" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">Ciclo de trabajo: 60%</text><line x1="450" y1="368" x2="450" y2="410" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="410" width="720" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="460" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">2 — FACTOR DE LA TABLA 630.11(A)</text><text x="450" y="506" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">Sin motor-generador al 60%: 0.78</text><line x1="450" y1="528" x2="450" y2="564" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="564" width="720" height="118" rx="12" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="450" y="614" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">3 — DIMENSIONE LOS CONDUCTORES</text><text x="450" y="660" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">50 A x 0.78 = 39 A ampacidad mínima</text><line x1="450" y1="682" x2="450" y2="718" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="90" y="718" width="720" height="118" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="768" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle">4 — LÍMITE DEL INTERRUPTOR, 630.12</text><text x="450" y="814" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">200% de 50 A = 100 A máximo</text><text x="30" y="1006" font-size="36" font-weight="800" fill="#264387" text-anchor="start">Tabla 630.11(A) — factores sin motor-generador</text><text x="30" y="1090" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">100%</text><rect x="160" y="1050" width="470" height="48" rx="6" fill="#264387" stroke="#264387" stroke-width="0"/><text x="648" y="1090" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">1.00</text><text x="30" y="1156" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">80%</text><rect x="160" y="1116" width="418" height="48" rx="6" fill="#264387" stroke="#264387" stroke-width="0"/><text x="596" y="1156" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">0.89</text><text x="30" y="1222" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">60%</text><rect x="160" y="1182" width="366" height="48" rx="6" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="544" y="1222" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">0.78</text><text x="636" y="1222" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">caso práctico</text><text x="30" y="1288" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">40%</text><rect x="160" y="1248" width="296" height="48" rx="6" fill="#264387" stroke="#264387" stroke-width="0"/><text x="474" y="1288" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">0.63</text><text x="30" y="1354" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">20%</text><rect x="160" y="1314" width="211" height="48" rx="6" fill="#264387" stroke="#264387" stroke-width="0"/><text x="389" y="1354" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">0.45</text></svg>