<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">650 — Dos sistemas en un órgano</title><desc id="d">Diagrama unifilar de una instalación de órgano de tubos: un circuito ramal de 120 V alimenta un rectificador tipo transformador limitado a 30 V dc, protegido a no más de 6 A, que suministra circuitos de señal de consola de 28 AWG mínimo y circuitos de imanes del cofre de 26 AWG mínimo con un retorno común principal de 14 AWG. El motor del soplador va en su propio circuito de motor del Artículo 430.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">650 — Dos sistemas en un órgano</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">La acción es DC, 30 V máx. — el soplador no</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 650.4, 650.6, 650.8</text><rect x="110" y="210" width="680" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="264" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">CIRCUITO RAMAL DE 120 V</text><text x="450" y="310" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">lado de voltaje de línea — Sharma</text><line x1="450" y1="320" x2="450" y2="368" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="372" width="680" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="426" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">RECTIFICADOR (650.4)</text><text x="450" y="472" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">tipo transformador — salida DC 30 V máx.</text><line x1="450" y1="490" x2="450" y2="538" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="542" width="680" height="104" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="596" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">FUSIBLE — NO MÁS DE 6 A (650.8)</text><line x1="450" y1="646" x2="450" y2="694" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="698" width="680" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="752" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">CONSOLA + TECLADOS</text><text x="450" y="798" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">circuitos de señal: 28 AWG mínimo</text><line x1="450" y1="816" x2="450" y2="864" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="110" y="868" width="680" height="118" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="922" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">IMANES DEL COFRE (VÁLVULAS)</text><text x="450" y="968" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">alim. 26 AWG mín. — retorno 14 AWG mín.</text><rect x="110" y="1030" width="680" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="1082" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">RECTIFICADOR UNIDO AL EGC (650.5)</text><text x="450" y="1124" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">la caja está a tierra — la salida no</text><rect x="110" y="1180" width="680" height="118" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="450" y="1234" font-size="38" font-weight="800" fill="#c0392b" text-anchor="middle">MOTOR DEL SOPLADOR — ART. 430</text><text x="450" y="1280" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">un circuito de motor, no el sistema de acción</text></svg>