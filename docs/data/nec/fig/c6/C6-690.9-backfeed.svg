<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">690.9: backfeed decides the fuse</title><desc id="d">Three parallel PV strings at a combiner: the two healthy strings backfeed a faulted third string, with the current arithmetic and the two-condition test for omitting overcurrent devices.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">690.9: backfeed decides the fuse</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Three parallel strings — one faulted</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 690.9, 690.8(A)</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="200" width="240" height="90" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="160" y="256" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">STRING 1</text><line x1="160" y1="290" x2="160" y2="420" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="108" y="330" width="104" height="44" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="160" y="362" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FUSE</text><rect x="330" y="200" width="240" height="90" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="256" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">STRING 2</text><line x1="450" y1="290" x2="450" y2="420" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="398" y="330" width="104" height="44" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="362" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FUSE</text><rect x="620" y="200" width="240" height="90" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="740" y="256" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">STRING 3</text><line x1="740" y1="290" x2="740" y2="420" stroke="#c0392b" stroke-width="4" marker-start="url(#ahs)"/><rect x="688" y="330" width="104" height="44" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="740" y="362" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">FUSE</text><text x="740" y="182" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">FAULTED</text><line x1="40" y1="420" x2="860" y2="420" stroke="#1a2f61" stroke-width="5"/><text x="450" y="470" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">COMBINER</text><rect x="40" y="520" width="820" height="210" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="70" y="582" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">One string max: 9.8 A × 125% = 12.25 A</text><text x="70" y="623" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Two healthy strings backfeed ≈ 24.5 A</text><text x="70" y="664" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Fuse rating ≥ 125% of 690.8(A) current</text><text x="40" y="810" font-size="34" font-weight="800" fill="#5b6478" text-anchor="start">NO DEVICE NEEDED — ONLY IF BOTH HOLD</text><rect x="40" y="840" width="820" height="190" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="70" y="902" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">1  Conductors sized for all available current</text><text x="70" y="941" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">2  No external source backfeeds past ampacity</text><rect x="40" y="1090" width="820" height="110" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1160" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Either one fails → provide the device</text></svg>