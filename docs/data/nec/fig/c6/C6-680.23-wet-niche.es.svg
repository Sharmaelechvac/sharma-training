ht="80" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><circle cx="688" cy="220" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="688" y="231" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><rect x="716" y="140" width="140" height="90" rx="0" fill="#eef2f9" stroke="#1a2f61" stroke-width="4"/><text x="786" y="197" font-size="34" font-weight="900" fill="#1a2f61" text-anchor="middle">XFMR</text><circle cx="716" cy="140" r="23" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="716" y="151" font-size="32" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><circle cx="68" cy="1139" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="68" y="1149" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">1</text><text x="104" y="1150" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Luminaria de nicho húmedo, listada</text><circle cx="68" cy="1185" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="68" y="1195" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">2</text><text x="104" y="1196" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Caja de empalmes de plataforma</text><circle cx="68" cy="1231" r="20" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="68" y="1241" font-size="30" font-weight="900" fill="#1a2f61" text-anchor="middle">3</text><text x="104" y="1242" font-size="33" font-weight="700" fill="#1f2937" text-anchor="start">Transformador — listado para piscina</text><text x="60" y="1330" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">En o bajo el límite de contacto 680.2, un sistema</text><text x="60" y="1376" font-size="32" font-weight="700" fill="#1f2937" text-anchor="start">listado de baja tensión sigue la ruta sin GFCI.</text></svg>