<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" width="900" height="1460" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680.42 — no solo la Parte IV</title><desc id="d">Planta esquemática de un spa en lanai: bañera, base de equipo, desconexión y receptáculo, con marcadores numerados para las reglas de receptáculos, unión y desconexión que acompañan según 680.42. No se muestran distancias porque la página no está verificada.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1460" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680.42 — no solo la Parte IV</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Planta esquemática — sin distancias; solo reglas</text><line x1="30" y1="1402" x2="870" y2="1402" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1440" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.42 — SIN VERIFICAR</text><rect x="30" y="178" width="840" height="66" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="222" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">PÁGINA SIN VERIFICAR — REVISE EL IMPRESO</text><rect x="60" y="300" width="780" height="620" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="84" y="374" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">LANAI</text><rect x="60" y="300" width="780" height="26" rx="0" fill="#264387" stroke="#264387" stroke-width="0"/><rect x="620" y="326" width="54" height="40" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="647" y="358" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">R</text><circle cx="700" cy="346" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="700" y="358" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="250" y="440" width="320" height="230" rx="20" fill="#ffffff" stroke="#264387" stroke-width="5"/><rect x="272" y="462" width="276" height="186" rx="14" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="410" y="545" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">SPA /</text><text x="410" y="590" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">JACUZZI</text><rect x="600" y="470" width="240" height="130" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="720" y="522" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">BOMBA +</text><text x="720" y="562" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">CALENTADOR</text><circle cx="720" cy="640" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="720" y="652" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><path d="M640,585 C600,610 600,600 574,585" stroke="#F0A846" stroke-width="5" fill="none" stroke-dasharray="12 8"/><rect x="70" y="700" width="250" height="96" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><text x="195" y="742" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">DESCONEXIÓN</text><text x="195" y="778" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">Parte I</text><circle cx="356" cy="748" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="356" y="760" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><line x1="325" y1="732" x2="395" y2="674" stroke="#5b6478" stroke-width="3" stroke-dasharray="8 8"/><text x="150" y="880" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">a la vista del equipo</text><text x="60" y="1010" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">LO QUE LO ACOMPAÑA (680.42)</text><text x="60" y="1070" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Receptáculos — según 680.22(A)</text><text x="60" y="1118" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Unión — según 680.26</text><text x="60" y="1166" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  Desconexión — Parte I</text><text x="60" y="1240" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">El listado cubre solo la bañera.</text><text x="60" y="1290" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Base, unión, desconexión, receptáculos:</text><text x="60" y="1340" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">trabajo de campo bajo este artículo.</text></svg>