<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">625.43 — Medio de desconexión</title><desc id="d">Comparison of a 48 A wall charger, which needs no separate disconnect under 625.43, with a 100 A fast charger, which needs a lockable, readily accessible disconnect.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1250" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">625.43 — Medio de desconexión</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Decide la capacidad de la placa</text><line x1="30" y1="1192" x2="870" y2="1192" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1230" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 625.43; 110.25</text><text x="870" y="1230" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="190" width="390" height="730" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><rect x="470" y="190" width="390" height="730" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><text x="235" y="230" font-size="34" font-weight="800" fill="#264387" text-anchor="middle">CARGADOR DE PARED</text><text x="235" y="272" font-size="34" font-weight="800" fill="#264387" text-anchor="middle">48 A</text><rect x="110" y="300" width="250" height="300" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="235" y="430" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">EVSE</text><text x="235" y="490" font-size="40" font-weight="800" fill="#F0A846" text-anchor="middle">48 A</text><text x="235" y="700" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Circuito de 60 A,</text><text x="235" y="742" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">sigue siendo equipo de 48 A</text><rect x="50" y="790" width="370" height="110" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="235" y="834" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">BAJO AMBOS LÍMITES</text><text x="235" y="876" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">NO REQUERIDO</text><text x="665" y="230" font-size="34" font-weight="800" fill="#264387" text-anchor="middle">CARGADOR RÁPIDO</text><text x="665" y="272" font-size="34" font-weight="800" fill="#264387" text-anchor="middle">100 A</text><rect x="500" y="300" width="170" height="300" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="585" y="430" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">EVSE</text><text x="585" y="490" font-size="38" font-weight="800" fill="#F0A846" text-anchor="midd