<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">690.7 — Voc rises in the cold</title><desc id="d">Bar chart of the Table 690.7(A) voltage correction factors for the Florida temperature rows, from 1.02 at 24 to 20 degrees C up to 1.12 at minus 1 to minus 5 degrees C, over a worked example where a 12-module string corrected by 1.10 exceeds the 600 V dwelling cap and a 10-module string passes.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">690.7 — Voc rises in the cold</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Table 690.7(A) — Florida rows</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 690.7, Table 690.7(A)</text><text x="300" y="218" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">nameplate Voc (x1.00)</text><line x1="300" y1="238" x2="300" y2="792" stroke="#5b6478" stroke-width="3" stroke-dasharray="8 6"/><text x="285" y="288" font-size="34" font-weight="600" fill="#1f2937" text-anchor="end">24 to 20 °C</text><rect x="300" y="250" width="52" height="54" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="368" y="288" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">x1.02 (+2%)</text><text x="285" y="380" font-size="34" font-weight="600" fill="#1f2937" text-anchor="end">19 to 15 °C</text><rect x="300" y="342" width="104" height="54" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="420" y="380" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">x1.04 (+4%)</text><text x="285" y="472" font-size="34" font-weight="600" fill="#1f2937" text-anchor="end">14 to 10 °C</text><rect x="300" y="434" width="156" height="54" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="472" y="472" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">x1.06 (+6%)</text><text x="285" y="564" font-size="34" font-weight="600" fill="#1f2937" text-anchor="end">9 to 5 °C</text><rect x="300" y="526" width="208" height="54" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="524" y="564" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">x1.08 (+8%)</text><text x="285" y="656" font-size="34" font-weight="600" fill="#1f2937" text-anchor="end">4 to 0 °C</text><rect x="300" y="618" width="260" height="54" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="576" y="656" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">x1.10 (+10%)</text><text x="285" y="748" font-size="34" font-weight="600" fill="#1f2937" text-anchor="end">-1 to -5 °C</text><rect x="300" y="710" width="312" height="54" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="0"/><text x="628" y="748" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">x1.12 (+12%)</text><text x="300" y="822" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">bar = rise over nameplate Voc</text><rect x="40" y="850" width="820" height="330" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="70" y="905" font-size="36" font-weight="800" fill="#264387" text-anchor="start">WORKED EXAMPLE — ORLANDO DWELLING</text><text x="70" y="955" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">12 modules x 49.8 V Voc = 597.6 V</text><text x="70" y="1001" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Design low 4 °C: factor 1.10</text><text x="70" y="1047" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">597.6 x 1.10 = 657.4 V — OVER 600 V</text><text x="70" y="1093" font-size="34" font-weight="700" fill="#c0392b" text-anchor="start">11 modules: 602.6 V — still over</text><text x="70" y="1139" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="start">10 modules: 547.8 V — OK</text><rect x="40" y="1215" width="820" height="80" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1265" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">SIZE THE STRING FOR THE COLDEST DAWN</text></svg>