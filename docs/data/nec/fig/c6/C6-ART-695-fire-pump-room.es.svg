<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">695 — La bomba debe funcionar</title><desc id="d">Unifilar de una instalación de bomba contra incendios: fuente confiable, desconectador dedicado rotulado DESCONECTADOR DE BOMBA CONTRA INCENDIOS, controlador listado y motor de la bomba, con la regla de rotor bloqueado de 695.4 y la nota de la bomba jockey.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">695 — La bomba debe funcionar</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Unifilar — sala de bomba contra incendios</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 695 (695.3, 695.4)</text><rect x="40" y="250" width="820" height="104" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="70" y="315" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">FUENTE — CONFIABILIDAD PRIMERO (695.3)</text><line x1="450" y1="354" x2="450" y2="386" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="386" width="820" height="104" rx="8" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="70" y="434" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">DESCONECTADOR</text><text x="70" y="472" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">contra apagado accidental</text><rect x="450" y="416" width="395" height="48" rx="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="648" y="450" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">BOMBA CONTRA INCENDIOS</text><line x1="450" y1="490" x2="450" y2="522" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="522" width="820" height="104" rx="8" fill="#eef2f9" stroke="#1a2f61" stroke-width="3"/><text x="70" y="587" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="start">CONTROLADOR — BOMBA CONTRA INCENDIOS</text><line x1="450" y1="626" x2="450" y2="658" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="40" y="658" width="820" height="104" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="70" y="723" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start">MOTOR DE LA BOMBA — HASTA DESTRUIRSE</text><rect x="40" y="830" width="820" height="118" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="882" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">EL OCPD SOPORTA ROTOR BLOQUEADO</text><text x="450" y="926" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">INDEFINIDAMENTE — 695.4</text><rect x="40" y="990" width="820" height="128" rx="10" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="450" y="1042" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">BOMBA JOCKEY — FUERA DE 695 COMO BOMBA</text><text x="450" y="1086" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Su corriente sí cuenta en la fuente 695.3</text><rect x="40" y="1160" width="820" height="118" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1212" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">NUNCA REDISEÑE EN EL CAMPO</text><text x="450" y="1256" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">INGENIERO RESPONSABLE + NFPA 20</text><text x="450" y="1370" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Las bombas de rociadores en viviendas de una y dos</text><text x="450" y="1416" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">familias quedan fuera del Artículo 695</text></svg>