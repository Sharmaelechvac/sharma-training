<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">669 — Low voltage, huge current</title><desc id="d">Diagram of an electroplating line: a DC rectifier feeding a copper busbar run to a plating tank, with callouts for the 125 percent branch circuit rule, the 1000 amp per square inch busbar cap, a DC-side disconnect per supply, and a comparison of conductor rules at 60 volts DC or less versus over 60 volts DC.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">669 — Low voltage, huge current</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plating line: DC supply, busbar, tank (schematic)</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 669.1, 669.5, 669.6, 669.8(A); 366.23</text><rect x="50" y="210" width="250" height="170" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="175" y="285" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">DC SUPPLY</text><text x="175" y="335" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">rectifier</text><rect x="300" y="262" width="320" height="46" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="460" y="245" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">BUSBAR</text><rect x="620" y="210" width="230" height="170" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><path d="M620 262 H850" stroke="#264387" stroke-width="4" fill="none"/><text x="735" y="245" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">PLATING TANK</text><text x="735" y="345" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">parts on racks</text><circle cx="74" cy="440" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="74" y="452" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="114" y="452" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Branch circuit: 125% of load (669.5)</text><circle cx="74" cy="505" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="74" y="517" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="114" y="517" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Busbar cap: 1000 A per sq in (366.23)</text><rect x="50" y="580" width="390" height="540" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="245" y="640" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">60 V DC OR LESS</text><text x="75" y="705" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Insulated conductors:</text><text x="75" y="749" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  no insulated supports</text><text x="75" y="793" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  needed if protected</text><text x="75" y="837" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Bare Cu or Al allowed</text><text x="75" y="881" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  on insulators</text><text x="75" y="925" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">(669.6(A))</text><rect x="460" y="580" width="390" height="540" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="655" y="640" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">OVER 60 V DC</text><text x="485" y="705" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Insulated conductors:</text><text x="485" y="749" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  insulated supports</text><text x="485" y="793" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  required</text><text x="485" y="837" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Bare conductors:</text><text x="485" y="881" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  guard against contact</text><text x="485" y="925" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">  up to termination</text><text x="485" y="969" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">(669.6(B))</text><rect x="50" y="1180" width="800" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="1235" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">TWO SUPPLIES? A DISCONNECT ON THE</text><text x="450" y="1285" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DC SIDE OF EACH ONE — 669.8(A)</text><text x="450" y="1380" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">Low volts is where the burn hazard lives:</text><text x="450" y="1430" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">hundreds of amps through one loose joint.</text></svg>