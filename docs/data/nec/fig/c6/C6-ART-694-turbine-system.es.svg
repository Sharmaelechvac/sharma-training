<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">694 — La turbina es parte del sistema</title><desc id="d">Elevación de un sistema eólico pequeño: turbina y góndola sobre una torre, circuito de salida que baja por la torre hasta un medio de desconexión en la base que abre todos los conductores sin puesta a tierra, luego inversor y controlador que alimentan el tablero del predio, con la puesta a tierra de la torre indicada.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">694 — La turbina es parte del sistema</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Eólica pequeña: cada turbina de 100 kW o menos</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 694.1, 694.12, 694.20</text><circle cx="380" cy="300" r="96" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="380" y1="300" x2="380" y2="190" stroke="#264387" stroke-width="6"/><line x1="380" y1="300" x2="285" y2="375" stroke="#264387" stroke-width="6"/><line x1="380" y1="300" x2="475" y2="375" stroke="#264387" stroke-width="6"/><circle cx="380" cy="300" r="18" fill="#264387" stroke="#264387" stroke-width="0"/><text x="506" y="250" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">TURBINA + GÓNDOLA</text><text x="506" y="294" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">parte del sistema</text><text x="506" y="334" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">según 694.2</text><line x1="338" y1="380" x2="358" y2="900" stroke="#1a2f61" stroke-width="6"/><line x1="422" y1="380" x2="402" y2="900" stroke="#1a2f61" stroke-width="6"/><line x1="347" y1="560" x2="413" y2="560" stroke="#1a2f61" stroke-width="4"/><line x1="352" y1="740" x2="408" y2="740" stroke="#1a2f61" stroke-width="4"/><text x="90" y="640" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">TORRE</text><line x1="380" y1="396" x2="380" y2="900" stroke="#F0A846" stroke-width="7"/><text x="430" y="660" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">circuito de salida de la turbina</text><rect x="60" y="900" width="480" height="96" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="300" y="942" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DESCONECTADOR (694.20)</text><text x="300" y="980" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">fácilmente accesible</text><line x1="540" y1="948" x2="720" y2="948" stroke="#2e7d32" stroke-width="5"/><line x1="720" y1="948" x2="720" y2="993" stroke="#2e7d32" stroke-width="5"/><line x1="685" y1="993" x2="755" y2="993" stroke="#2e7d32" stroke-width="5"/><line x1="698" y1="1005" x2="742" y2="1005" stroke="#2e7d32" stroke-width="5"/><line x1="710" y1="1017" x2="730" y2="1017" stroke="#2e7d32" stroke-width="5"/><text x="720" y="1065" font-size="30" font-weight="700" fill="#2e7d32" text-anchor="middle">torre + equipo</text><text x="720" y="1101" font-size="30" font-weight="700" fill="#2e7d32" text-anchor="middle">puesta a tierra</text><line x1="380" y1="996" x2="380" y2="1044" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="1048" width="480" height="92" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="300" y="1106" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">INVERSOR + CONTROLADOR</text><line x1="380" y1="1140" x2="380" y2="1188" stroke="#1a2f61" stroke-width="5" marker-end="url(#ah)"/><rect x="60" y="1192" width="480" height="92" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="300" y="1250" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">TABLERO DEL PREDIO</text><text x="110" y="1318" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Abre todos los conductores sin puesta a tierra.</text><rect x="110" y="1352" width="680" height="62" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1394" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Dimensione los conductores al 125% (694.12)</text></svg>