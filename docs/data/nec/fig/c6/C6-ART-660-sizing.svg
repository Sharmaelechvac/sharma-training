<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">660 — The greater number wins</title><desc id="d">Bar chart for X-ray sizing: a 100 A momentary rating counts at 50 percent (50 A), a 20 A long-time rating counts at 100 percent (20 A); conductors, overcurrent protection and the disconnect are sized to the greater number, 50 A.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">660 — The greater number wins</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Worked case: momentary 100 A, long-time 20 A.</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 660.2, 660.5, 660.6</text><text x="40" y="282" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">Momentary rating — the headline number</text><rect x="120" y="300" width="700" height="88" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="802" y="358" font-size="38" font-weight="800" fill="#ffffff" text-anchor="end">100 A</text><text x="40" y="462" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">50% of momentary — 660.6(A) counts it at half</text><rect x="120" y="480" width="350" height="88" rx="8" fill="#F0A846" stroke="#F0A846" stroke-width="3"/><text x="488" y="538" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">50 A</text><text x="40" y="642" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">100% of long-time — it counts in full</text><rect x="120" y="660" width="140" height="88" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="278" y="718" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">20 A</text><text x="40" y="822" font-size="36" font-weight="700" fill="#1f2937" text-anchor="start">SIZE TO THE GREATER NUMBER</text><rect x="120" y="840" width="350" height="88" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="488" y="898" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">50 A</text><text x="470" y="898" font-size="38" font-weight="800" fill="#1f2937" text-anchor="middle"></text><rect x="40" y="990" width="820" height="125" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1042" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Both ratings run the same test — take the greater.</text><text x="450" y="1090" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Disconnect capacity: 660.5. Branch circuit: 660.6(A).</text><text x="40" y="1195" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Momentary = an interval of 5 seconds or less</text><text x="40" y="1243" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Long-time = an interval of 5 minutes or longer</text><text x="40" y="1291" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Feeder for 2+ units: two largest at 100%, rest at 20%</text></svg>