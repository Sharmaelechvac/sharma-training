<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">690.47 — Un solo sistema de tierra</title><desc id="d">Esquema de puesta a tierra FV: el conductor de tierra del equipo del arreglo regresa a la acometida y llega al sistema de electrodos de tierra del edificio (electrodo en concreto y dos varillas, 8 ft en el suelo, a 6 ft mín. entre sí), mientras una varilla auxiliar en una estructura al suelo solo se une a su marco.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">690.47 — Un solo sistema de tierra</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Unido en la acometida — corte esquemático</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 690.47, 250.50, 250.54</text><rect x="60" y="175" width="780" height="92" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><line x1="88" y1="198" x2="116" y2="244" stroke="#c0392b" stroke-width="5"/><line x1="116" y1="198" x2="88" y2="244" stroke="#c0392b" stroke-width="5"/><text x="470" y="215" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">VARILLA SOLA — SIN RETORNO DEL EGC</text><text x="470" y="256" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">es adorno — no es un sistema de tierra</text><rect x="110" y="300" width="680" height="92" rx="10" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="359" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">ARREGLO FV — ESTRUCTURA UNIDA</text><line x1="450" y1="392" x2="450" y2="450" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><text x="465" y="430" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="start">EGC CON EL CIRCUITO</text><rect x="110" y="455" width="680" height="92" rx="10" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="514" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">ACOMETIDA — EL EGC LLEGA AQUÍ</text><line x1="450" y1="547" x2="450" y2="600" stroke="#1a2f61" stroke-width="4" marker-end="url(#ah)"/><rect x="60" y="605" width="780" height="120" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="662" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">ELECTRODOS DE TIERRA DEL EDIFICIO</text><text x="450" y="705" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">todos los electrodos presentes, unidos</text><rect x="0" y="1092" width="900" height="308" rx="0" fill="url(#earth)" st