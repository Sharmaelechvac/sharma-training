<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680.24(A) — Caja de empalmes</title><desc id="d">Vista en sección del borde de una piscina: una caja de empalmes listada para piscina sobre un elevador, a 4 ft mínimo de la pared interior, su fondo 8 in sobre el nivel máximo del agua y 4 in sobre la plataforma, rigiendo la altura mayor.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680.24(A) — Caja de empalmes</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sección — plataforma 2 in sobre el nivel del agua</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.24(A), 680.2</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="560" width="390" height="470" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><line x1="40" y1="560" x2="430" y2="560" stroke="#264387" stroke-width="5"/><text x="60" y="640" font-size="36" font-weight="800" fill="#5b6478" text-anchor="start">PISCINA</text><text x="60" y="530" font-size="32" font-weight="800" fill="#5b6478" text-anchor="start">NIVEL MÁX. DEL AGUA</text><line x1="430" y1="300" x2="430" y2="1030" stroke="#264387" stroke-width="6"/><text x="415" y="268" font-size="32" font-weight="800" fill="#5b6478" text-anchor="end">PARED INTERIOR</text><rect x="430" y="520" width="430" height="26" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="4"/><rect x="430" y="546" width="430" height="484" rx="0" fill="url(#earth)" stroke="#c9d2e3" stroke-width="2"/><text x="848" y="745" font-size="32" font-weight="800" fill="#5b6478" text-anchor="end">PLATAFORMA</text><line x1="600" y1="440" x2="800" y2="440" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 8"/><rect x="685" y="400" width="30" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="620" y="320" width="160" height="80" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="700" y="352" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">PISCINA</text><text x="700" y="388" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">J-BOX</text><path d="M655,400 L655,700 L470,700" stroke="#264387" stroke-width="4" fill="none"/><line x1="838" y1="400" x2="838" y2="560" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="824" y="492.6" font-size="36" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">8 in min</text><text x="824" y="492.6" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="end">8 in min</text><line x1="800" y1="440" x2="800" y2="520" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="786" y="491.2" font-size="32" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"></text><text x="786" y="491.2" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end"></text><text x="786" y="428" font-size="32" font-weight="800" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">4 in min</text><text x="786" y="428" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="end">4 in min</text><line x1="430" y1="1040" x2="430" y2="1162" stroke="#1a2f61" stroke-width="2"/><line x1="620" y1="1040" x2="620" y2="1162" stroke="#1a2f61" stroke-width="2"/><line x1="430" y1="1150" x2="620" y2="1150" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="525.0" y="1138" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">4 ft mín. desde la pared interior</text><text x="525.0" y="1138" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4 ft mín. desde la pared interior</text><text x="60" y="1230" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Listada, rotulada e identificada como caja</text><text x="60" y="1274" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">de empalmes de piscina. La altura mayor</text><text x="60" y="1318" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">— plataforma o agua — es la que rige.</text><rect x="60" y="1336" width="780" height="90" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1374" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Caja a ras de plataforma: solo en o bajo</text><text x="450" y="1414" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">el límite de contacto de baja tensión (680.2)</text></svg>