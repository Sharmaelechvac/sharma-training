<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">692 — Fuel cell one-line</title><desc id="d">One-line diagram of a fuel cell system: fuel supply with a manual shut-off valve feeds a listed fuel cell; its output circuit runs through a disconnect that opens all current-carrying conductors to the service, where a plaque lists every power source. The output feeder is sized to the greater of the nameplate rated current or the unit overcurrent device rating.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">692 — Fuel cell one-line</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">It makes power while fuel flows — stop the fuel.</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 692.6, 692.8(B), 692.13</text><rect x="120" y="195" width="660" height="105" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="236" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">FUEL SUPPLY</text><text x="450" y="282" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">manual shut-off valve</text><line x1="450" y1="300" x2="450" y2="345" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="120" y="350" width="660" height="130" rx="12" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="404" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">FUEL CELL — LISTED (692.6)</text><text x="450" y="450" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">nameplate rated current 42 A</text><line x1="450" y1="480" x2="450" y2="525" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><text x="470" y="512" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">output circuit</text><rect x="120" y="530" width="660" height="150" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="571" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">DISCONNECT (692.13)</text><text x="450" y="617" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">opens all current-carrying</text><text x="450" y="663" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">conductors of the source</text><line x1="450" y1="680" x2="450" y2="725" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="120" y="730" width="660" height="150" rx="12" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="771" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">SERVICE / PANEL</text><text x="450" y="817" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">plaque or directory lists</text><text x="450" y="863" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">every power source on site</text><rect x="40" y="945" width="820" height="120" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="997" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Still live while fuel flows</text><text x="450" y="1045" font-size="33" font-weight="600" fill="#c0392b" text-anchor="middle">Open the disconnect AND shut the fuel.</text><rect x="40" y="1105" width="820" height="120" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1157" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Output feeder: the GREATER number governs</text><text x="450" y="1205" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">nameplate current vs the unit OCPD — 692.8(B)</text><text x="40" y="1300" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Worked case: 42 A nameplate, 50 A device → 50 A</text></svg>