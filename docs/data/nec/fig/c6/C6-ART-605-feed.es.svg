weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">receptáculo a 12 in máx.</text><text x="254.0" y="678" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">receptáculo a 12 in máx.</text><line x1="330" y1="660" x2="330" y2="802" stroke="#1a2f61" stroke-width="2"/><line x1="875" y1="660" x2="875" y2="802" stroke="#1a2f61" stroke-width="2"/><line x1="330" y1="790" x2="875" y2="790" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="602.5" y="778" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">grupo armado: 30 ft máx.</text><text x="602.5" y="778" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">grupo armado: 30 ft máx.</text><text x="90" y="920" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">1  Circuito dedicado — solo paneles</text><text x="90" y="976" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">2  Interconexiones: solo conectores listados</text><text x="90" y="1032" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Cordón de suministro: 2 ft máx., uso extra rudo,</text><text x="90" y="1076" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">12 AWG mín., tierra de equipo aislada</text><text x="90" y="1132" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">13 receptáculos máx. (15 A, 125 V)</text><text x="90" y="1188" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Sin circuitos multialambre en el grupo</text></svg>