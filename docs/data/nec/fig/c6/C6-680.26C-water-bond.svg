<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Bond the pool water itself</title><desc id="d">Section through a pool and skimmer. A listed water-bond fitting in the skimmer holds a corrosion-resistant plate 3 inches by 3 inches, giving 9 square inches of contact with the water, tied back to the equipotential bonding system with 8 AWG solid copper. A bonded ladder or fitting already in the water also satisfies the rule.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Bond the pool water itself</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">680.26(C) — the 9 sq in contact rule</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.26(B), 680.26(C)</text><rect x="60" y="250" width="780" height="16" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><rect x="60" y="266" width="780" height="470" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="110" y="330" font-size="34" font-weight="800" fill="#264387" text-anchor="start">POOL WATER</text><line x1="150" y1="250" x2="150" y2="560" stroke="#264387" stroke-width="6"/><line x1="215" y1="250" x2="215" y2="560" stroke="#264387" stroke-width="6"/><line x1="150" y1="560" x2="215" y2="560" stroke="#264387" stroke-width="6"/><circle cx="182" cy="640" r="26" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="182" y="652" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">OK</text><text x="110" y="712" font-size="30" font-weight="600" fill="#5b6478" text-anchor="start">bonded ladder</text><rect x="600" y="190" width="240" height="300" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="720" y="232" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">SKIMMER</text><rect x="665" y="330" width="110" height="110" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><line x1="665" y1="440" x2="665" y2="490" stroke="#1a2f61" stroke-width="2"/><line x1="775" y1="440" x2="775" y2="490" stroke="#1a2f61" stroke-width="2"/><line x1="665" y1="478" x2="775" y2="478" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="720.0" y="466" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">3 in</text><text x="720.0" y="466" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">3 in</text><line x1="812" y1="330" x2="812" y2="440" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="826" y="396.2" font-size="32" font-weight="800" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">3 in</text><text x="826" y="396.2" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="start">3 in</text><text x="720" y="545" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">plate = 9 sq in</text><circle cx="628" cy="300" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="628" y="312" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="628" cy="470" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="628" y="482" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><path d="M720,545 L720,790" stroke="#F0A846" stroke-width="8" fill="none"/><rect x="60" y="790" width="780" height="56" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="828" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Bonding system — 8 AWG solid Cu</text><circle cx="720" cy="668" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="720" y="680" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="60" y="900" width="380" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="84" y="952" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">Bonded part in water</text><text x="84" y="998" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">ladder, niche, fitting:</text><text x="84" y="1038" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">the contact bonds it</text><rect x="460" y="900" width="380" height="150" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="484" y="952" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">Nothing bonded in it</text><text x="484" y="998" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">add the listed fitting,</text><text x="484" y="1038" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">9 sq in in the water</text><text x="60" y="1120" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1 Listed water-bond fitting, in skimmer</text><text x="60" y="1164" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2 Plate drawn large — actual 3 in x 3 in</text><text x="60" y="1208" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3 Bonding conductor back to the grid</text></svg>