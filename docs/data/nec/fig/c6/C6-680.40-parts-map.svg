<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680.40 — Which parts apply</title><desc id="d">Map diagram: a spa or hot tub always takes Part I and Part IV of Article 680; an outdoor spa also takes the Part II rules referenced by 680.42 - receptacle distances, GFCI protection and equipotential bonding. A listed factory package does not waive the field wiring rules.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680.40 — Which parts apply</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Parts I + IV always; outdoors adds Part II.</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.40, 680.42</text><text x="870" y="1400" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="250" y="195" width="400" height="105" rx="12" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="245" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">SPA OR HOT TUB</text><text x="450" y="285" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">the vessel + its equipment</text><line x1="350" y1="300" x2="250" y2="385" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)"/><line x1="550" y1="300" x2="650" y2="385" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="390" width="820" height="215" rx="12" fill="#eef2f9" stroke="#264387" stroke-width="3"/><circle cx="86" cy="445" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="86" y="457" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="130" y="458" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">ALWAYS APPLIES</text><text x="86" y="530" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">Part I — general rules, all of Article 680</text><text x="86" y="578" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">Part IV — written for spas and hot tubs</text><rect x="40" y="640" width="820" height="265" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><circle cx="86" cy="695" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="86" y="707" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="130" y="708" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="start">OUTDOOR ADDS — THROUGH 680.42</text><text x="86" y="780" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">Part II walks in the door:</text><text x="86" y="828" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">• receptacle distances   • GFCI protection</text><text x="86" y="876" font-size="36" font-weight="600" fill="#1f2937" text-anchor="start">• equipotential bonding (680.26)</text><rect x="40" y="945" width="820" height="120" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="995" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Listed factory package ≠ field rules waived</text><text x="450" y="1043" font-size="32" font-weight="600" fill="#c0392b" text-anchor="middle">The listing covers the tub — not the site wiring.</text><text x="40" y="1140" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  Part I rides with every installation</text><text x="40" y="1188" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  Indoors, the Part II door stays closed</text><text x="40" y="1236" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  Classification first: which water, which parts</text></svg>