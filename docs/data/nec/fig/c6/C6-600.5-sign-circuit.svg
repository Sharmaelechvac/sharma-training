<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1560" width="900" height="1560" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Sign circuit: 20 A, signs only</title><desc id="d">Storefront elevation with a sign band over two pedestrian entrances. Each entrance has a receptacle outlet on a 20 ampere circuit, and the sign itself is fed from the panel by a dedicated 20 ampere breaker labeled SIGN that serves no other load. Storefront display lighting on the sign circuit is a fail.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1560" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Sign circuit: 20 A, signs only</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">600.5 — storefront with two entrances</text><line x1="30" y1="1502" x2="870" y2="1502" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1540" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 600.5, 600.5(A)</text><text x="870" y="1540" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="210" width="780" height="500" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="200" y="245" width="500" height="95" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="308" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">STORE SIGN</text><rect x="140" y="440" width="170" height="270" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="225" y1="440" x2="225" y2="710" stroke="#264387" stroke-width="3"/><rect x="195" y="372" width="60" height="44" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="225" cy="348" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="225" y="360" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="590" y="440" width="170" height="270" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="675" y1="440" x2="675" y2="710" stroke="#264387" stroke-width="3"/><rect x="645" y="372" width="60" height="44" rx="0" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><circle cx="675" cy="348" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="675" y="360" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><path d="M450,340 L450,760" stroke="#1a2f61" stroke-width="3" fill="none" stroke-dasharray="10 8"/><text x="450" y="395" font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">ENTRANCE</text><text x="450" y="395" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">ENTRANCE</text><text x="450" y="430" font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">OUTLET AT EACH DOOR</text><text x="450" y="430" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">OUTLET AT EACH DOOR</text><rect x="320" y="760" width="260" height="190" rx="8" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="812" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">PANEL</text><rect x="345" y="835" width="210" height="52" rx="6" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="872" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">SIGN — 20 A</text><text x="450" y="922" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">signs only</text><circle cx="610" cy="800" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="610" y="812" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="60" y="1010" width="780" height="118" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="90" y="1060" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">FAIL — display lights on the sign circuit</text><text x="90" y="1104" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Other loads get their own circuit.</text><text x="60" y="1190" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1 Entrance outlet — one per entrance</text><text x="60" y="1234" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2 Dedicated breaker — 20 A minimum</text><text x="60" y="1278" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3 Figured at 1,200 VA in the load calc</text></svg>