<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680.44 — Protección GFCI del spa</title><desc id="d">Diagrama de cómo encajan las páginas de protección del spa: una caja de protección GFCI de 680.44 sobre un spa, con reglas exteriores en 680.42 e interiores en 680.43, y una banda roja que marca la página como no verificada.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1300" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680.44 — Protección GFCI del spa</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Cómo encajan las páginas de protección</text><line x1="30" y1="1242" x2="870" y2="1242" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1280" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.44 — SIN VERIFICAR</text><rect x="30" y="185" width="840" height="60" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="228" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">PÁGINA SIN VERIFICAR — REVISE EL IMPRESO</text><rect x="165" y="300" width="570" height="85" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="450" y="355" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PROTECCIÓN GFCI — 680.44</text><line x1="450" y1="385" x2="450" y2="445" stroke="#264387" stroke-width="4" marker-end="url(#ah)"/><rect x="275" y="445" width="350" height="195" rx="24" fill="#eef2f9" stroke="#264387" stroke-width="5"/><rect x="305" y="475" width="290" height="85" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="530" font-size="36" font-weight="700" fill="#1a2f61" text-anchor="middle">SPA / JACUZZI</text><text x="450" y="612" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">bañista en el agua</text><rect x="55" y="720" width="345" height="85" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="227" y="775" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">EXTERIOR — 680.42</text><rect x="500" y="720" width="345" height="85" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="672" y="775" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">INTERIOR — 680.43</text><line x1="227" y1="720" x2="350" y2="640" stroke="#264387" stroke-width="3" marker-end="url(#ah)"/><line x1="672" y1="720" x2="550" y2="640" stroke="#264387" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="640" x2="450" y2="880" stroke="#264387" stroke-width="3" marker-end="url(#ah)"/><rect x="200" y="880" width="500" height="85" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="935" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">CABLEADO + UNIÓN</text><text x="450" y="1045" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">Confirme el punto de protección antes</text><text x="450" y="1090" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">de llenar la bañera — pruebe al final.</text></svg>