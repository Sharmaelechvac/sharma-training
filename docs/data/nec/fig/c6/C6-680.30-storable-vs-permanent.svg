<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1480" width="900" height="1480" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680.30 — Which pool is it?</title><desc id="d">Comparison of a storable pool (Parts I and III, no 680.26 bonding, 42 inch maximum water depth) with a permanently installed above-ground pool (Parts I and II, bonding required).</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1480" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680.30 — Which pool is it?</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">The 680.2 definition picks the rules</text><line x1="30" y1="1422" x2="870" y2="1422" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1460" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.30, 680.2</text><text x="870" y="1460" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="50" y="210" width="390" height="560" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="245" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">STORABLE POOL</text><rect x="120" y="430" width="280" height="190" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><path d="M120,486 q40,-22 80,0 q40,22 80,0 q40,-22 60,0" stroke="#264387" stroke-width="3" fill="none"/><line x1="84" y1="430" x2="84" y2="620" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><g transform="translate(72,525.0) rotate(-90)"><text x="0" y="0" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">42 in max water</text><text x="0" y="0" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">42 in max water</text></g><text x="245" y="690" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Inflatable or molded</text><text x="245" y="730" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">polymer walls</text><rect x="115.0" y="766" width="260" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="245.0" y="802" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PARTS I + III</text><text x="245" y="862" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">680.26 bonding:</text><text x="245" y="902" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">NOT REQUIRED</text><rect x="460" y="210" width="390" height="560" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="655" y="262" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PERMANENT POOL</text><rect x="530" y="400" width="280" height="220" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><path d="M530,456 q40,-22 80,0 q40,22 80,0 q40,-22 60,0" stroke="#264387" stroke-width="3" fill="none"/><line x1="500" y1="620" x2="840" y2="620" stroke="#264387" stroke-width="5"/><text x="655" y="690" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">Steel wall, stays up</text><text x="655" y="730" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">all year on a slab</text><rect x="533.5" y="766" width="243" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="655.0" y="802" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">PARTS I + II</text><text x="655" y="862" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">680.26 bonding:</text><text x="655" y="902" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">REQUIRED</text><rect x="50" y="990" width="800" height="118" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1042" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">ABOVE-GROUND IS NOT THE TEST</text><text x="450" y="1086" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">THE DEFINITION IS</text></svg>