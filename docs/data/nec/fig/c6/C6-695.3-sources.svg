<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">695.3 — Fire pump power sources</title><desc id="d">One-line diagram: the fire pump tap lands ahead of the normal service disconnect, a fire-protected on-site generator feeds transfer equipment located in the fire pump room, and a sizing box lists what the source must carry indefinitely.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1700" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">695.3 — Fire pump power sources</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Reliable source, sized for locked rotor — not full load</text><line x1="30" y1="1642" x2="870" y2="1642" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1680" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 695.3, 695.4</text><text x="870" y="1680" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><text x="60" y="225" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="start">UTILITY</text><line x1="60" y1="258" x2="840" y2="258" stroke="#1f2937" stroke-width="5"/><rect x="474.0" y="184" width="332" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="640.0" y="220" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">TAP AHEAD OF MAIN</text><circle cx="640" cy="258" r="9" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><line x1="200" y1="258" x2="200" y2="330" stroke="#1f2937" stroke-width="4"/><rect x="40" y="330" width="320" height="100" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="200" y="372" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">NORMAL SERVICE</text><text x="200" y="414" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><line x1="200" y1="430" x2="200" y2="500" stroke="#1f2937" stroke-width="4"/><rect x="40" y="500" width="320" height="84" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="200" y="554" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">NORMAL LOADS</text><line x1="640" y1="258" x2="640" y2="330" stroke="#1f2937" stroke-width="4"/><rect x="480" y="330" width="320" height="100" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="640" y="372" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">FIRE PUMP</text><text x="640" y="414" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">DISCONNECT</text><line x1="640" y1="430" x2="640" y2="500" stroke="#1f2937" stroke-width="4"/><rect x="480" y="500" width="320" height="84" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="640" y="554" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">CONTROLLER</text><line x1="640" y1="584" x2="640" y2="650" stroke="#1f2937" stroke-width="4"/><rect x="480" y="650" width="320" height="84" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="640" y="704" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">FIRE PUMP MOTOR</text><text x="640" y="792" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">PROTECTED FROM FIRE DAMAGE</text><rect x="480" y="816" width="320" height="100" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="640" y="858" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">ON-SITE</text><text x="640" y="900" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">GENERATOR</text><line x1="640" y1="916" x2="640" y2="976" stroke="#1f2937" stroke-width="4"/><rect x="430" y="976" width="420" height="150" rx="0" fill="#ffffff" stroke="#264387" stroke-width="3"/><text x="640" y="1024" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">TRANSFER EQUIPMENT</text><text x="640" y="1070" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">IN THE FIRE PUMP ROOM</text><text x="640" y="1112" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="middle">695.3(F)</text><path d="M850,1051 L872,1051 L872,542 L806,542" stroke="#1f2937" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/><rect x="60" y="1180" width="780" height="250" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1236" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">THE SOURCE MUST CARRY, INDEFINITELY:</text><text x="450" y="1298" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Fire pump motor locked-rotor current</text><text x="450" y="1352" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">+ jockey pump locked-rotor current</text><text x="450" y="1406" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">+ 100% of the accessory equipment load</text><rect x="60" y="1470" width="780" height="84" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1524" font-size="30" font-weight="800" fill="#c0392b" text-anchor="middle">PHASE CONVERTERS NOT PERMITTED — 695.3(I)</text></svg>