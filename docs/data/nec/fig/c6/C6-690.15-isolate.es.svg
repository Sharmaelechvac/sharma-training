<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Aíslelo de toda fuente</title><desc id="d">Unifilar de un sistema FV híbrido: desconectador de CC del arreglo, inversor, desconectador de CA y tablero de la red en cadena vertical, con una batería y su desconectador alimentando el inversor por el lado.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1380" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Aíslelo de toda fuente</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">690.15 — desconectadores del equipo en el inversor</text><line x1="30" y1="1322" x2="870" y2="1322" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1360" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 690.15, 690.13, 110.25</text><rect x="280" y="190" width="340" height="110" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="240" font-size="40" font-weight="800" fill="#1a2f61" text-anchor="middle">ARREGLO FV</text><text x="450" y="282" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">VIVO CON LUZ SOLAR</text><line x1="450" y1="300" x2="450" y2="360" stroke="#1f2937" stroke-width="4"/><rect x="300" y="360" width="300" height="100" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="425" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">DESCON. DE CC</text><line x1="450" y1="460" x2="450" y2="520" stroke="#1f2937" stroke-width="4"/><rect x="280" y="520" width="340" height="130" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="600" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">INVERSOR</text><line x1="450" y1="650" x2="450" y2="710" stroke="#1f2937" stroke-width="4"/><rect x="300" y="710" width="300" height="100" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="775" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">DESCON. DE CA</text><line x1="450" y1="810" x2="450" y2="870" stroke="#1f2937" stroke-width="4"/><rect x="280" y="870" width="340" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="940" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">RED ELÉCTRICA</text><rect x="680" y="520" width="190" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="775" y="578" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">BATERÍA</text><text x="775" y="622" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">(híbrido)</text><line x1="620" y1="585" x2="680" y2="585" stroke="#1f2937" stroke-width="4"/><circle cx="650" cy="585" r="9" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="775" y="695" font-size="30" font-weight="800" fill="#5b6478" text-anchor="middle">DESCON. BAT.</text><text x="450" y="1035" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">Desconectadores en el equipo —</text><text x="450" y="1078" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">a la vista y a 10 ft máx. (2020)</text><rect x="30" y="1120" width="840" height="120" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1172" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">✗ Solo CA cortada — CC del arreglo aún viva</text><text x="450" y="1216" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">Abra toda fuente antes de quitar la tapa.</text></svg>