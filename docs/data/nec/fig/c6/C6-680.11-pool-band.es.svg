oke="#c0392b" stroke-width="6"/><rect x="60" y="900" width="250" height="84" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><text x="185" y="936" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">JARDÍN</text><text x="185" y="972" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">LUZ</text><circle cx="700" cy="570" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="700" y="582" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="215" cy="800" r="26" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="215" y="812" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="90" y="1080" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Conducto PVC al equipo de piscina: permitido,</text><text x="90" y="1121" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">    cobertura según Tabla 300.5 (18 in aquí)</text><text x="90" y="1162" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Cable enterrado directo en la franja:</text><text x="90" y="1203" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">    no es método de 680.11 — rodee la franja</text></svg>