<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 691 starts at 5 MW</title><desc id="d">A scale bar from a 10 kW house array through a 500 kW commercial roof to the 5 MW threshold where Article 691 takes over, with a comparison of Article 690 building PV against Article 691 utility-scale stations: engineered design, fencing, controlled access and qualified persons only.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1420" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 691 starts at 5 MW</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Large-scale PV electric supply stations</text><line x1="30" y1="1362" x2="870" y2="1362" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 691, Article 690</text><rect x="60" y="300" width="340" height="60" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="400" y="300" width="440" height="60" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><line x1="400" y1="270" x2="400" y2="400" stroke="#F0A846" stroke-width="8"/><rect x="305.5" y="216" width="189" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="400.0" y="252" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">5 MW LINE</text><text x="120" y="262" font-size="30" font-weight="700" fill="#5b6478" text-anchor="start">10 kW house</text><text x="690" y="262" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">50 MW plant</text><text x="230" y="342" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">ARTICLE 690</text><text x="620" y="342" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">ARTICLE 691</text><text x="230" y="420" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">building PV</text><text x="620" y="420" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">utility-scale stations</text><rect x="40" y="500" width="400" height="400" rx="10" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="240" y="565" font-size="38" font-weight="800" fill="#264387" text-anchor="middle">ARTICLE 690</text><text x="70" y="640" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Rooftop and roof PV</text><text x="70" y="692" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Prescriptive rules</text><text x="70" y="744" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Below 5 MW total</text><text x="70" y="796" font-size="30" font-weight="600" fill="#1f2937" text-anchor="start">Homes, shops, roofs</text><rect x="460" y="500" width="400" height="400" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="660" y="565" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">ARTICLE 691</text><text x="490" y="640" font-size="30" font-weight="600" fill="#ffffff" text-anchor="start">Utility-scale plants</text><text x="490" y="692" font-size="30" font-weight="600" fill="#ffffff" text-anchor="start">Engineered design</text><text x="490" y="744" font-size="30" font-weight="600" fill="#ffffff" text-anchor="start">Fenced + controlled</text><text x="490" y="796" font-size="30" font-weight="600" fill="#ffffff" text-anchor="start">Qualified crew only</text><rect x="40" y="950" width="820" height="120" rx="10" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1002" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Sharma does not build 691 plants —</text><text x="450" y="1048" font-size="34" font-weight="700" fill="#1a2f61" text-anchor="middle">recognize one, stop the 690 habits</text></svg>