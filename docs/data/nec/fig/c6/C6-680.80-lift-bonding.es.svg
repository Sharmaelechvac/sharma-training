<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680 Parte VIII — El elevador de piscina</title><desc id="d">Vista en planta de una esquina de piscina común con un elevador eléctrico al borde de la plataforma. Un lazo dorado de unión conecta el elevador, una escalera y una baranda con cobre sólido 8 AWG, y las notas cubren listado, protección GFCI para personas y la zona de unión de partes metálicas fijas de 5 ft.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680 Parte VIII — El elevador de piscina</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Planta: elevador al borde, unido (esquema)</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680 Part VIII; 680.26(B)(5), (B)(7)</text><rect x="50" y="200" width="560" height="620" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><text x="330" y="500" font-size="40" font-weight="800" fill="#264387" text-anchor="middle">AGUA DE LA PISCINA</text><rect x="610" y="200" width="240" height="620" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3" stroke-dasharray="12 8"/><text x="738" y="245" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PLATAFORMA</text><rect x="620" y="420" width="200" height="120" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="715" y="470" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">ELEVADOR</text><text x="715" y="515" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">al borde</text><rect x="64" y="700" width="182" height="60" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="155" y="742" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">ESCALERA</text><rect x="650" y="700" width="170" height="50" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="735" y="735" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">BARANDA</text><path d="M715 540 V700" stroke="#F0A846" stroke-width="6" fill="none"/><path d="M155 760 V860 H735 V750" stroke="#F0A846" stroke-width="6" fill="none"/><text x="450" y="905" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">UNIÓN: COBRE SÓLIDO 8 AWG</text><text x="450" y="950" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">un sistema equipotencial (680.26)</text><line x1="610" y1="1010" x2="850" y2="1010" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="730.0" y="998" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">5 ft</text><text x="730.0" y="998" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">5 ft</text><text x="450" y="1075" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">las partes metálicas fijas de esta zona se unen</text><circle cx="70" cy="1180" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="70" y="1192" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><text x="110" y="1192" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Listado, rotulado, identificado para piscina</text><circle cx="70" cy="1250" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="70" y="1262" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="110" y="1262" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Cableado en sitio, sobre límite BT: GFCI</text><circle cx="70" cy="1320" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="70" y="1332" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="110" y="1332" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">La unión se conecta — no es una corrida</text><text x="110" y="1382" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">de vuelta al panel</text></svg>