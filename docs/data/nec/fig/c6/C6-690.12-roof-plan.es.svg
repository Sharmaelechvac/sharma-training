0" stroke="#F0A846" stroke-width="3"/><text x="120" y="955" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">FUERA del límite:</text><text x="120" y="997" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">≤ 30 V en 30 segundos</text><rect x="90" y="1035" width="720" height="140" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="120" y="1080" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">DENTRO del límite — elija una vía:</text><text x="120" y="1122" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">PVHCS (UL 3741)  •  ≤ 80 V in 30 s</text><text x="120" y="1164" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">Sin partes expuestas — 8 ft libres</text><text x="90" y="1252" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1  Tramo de conductor fuera del arreglo</text><text x="90" y="1300" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2  Punto de entrada al edificio</text></svg>