<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680.41 — The 5 ft shutoff</title><desc id="d">Plan view of an amenity spa: the labeled emergency shutoff for the recirculation and jet system sits on the wall in sight of the tub, dimensioned at least 5 ft from the inside wall, so a person in the water cannot reach it.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680.41 — The 5 ft shutoff</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Plan view: amenity-center spa.</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.41</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="40" y="240" width="820" height="360" rx="0" fill="#eef2f9" stroke="#c9d2e3" stroke-width="3"/><rect x="90" y="280" width="380" height="290" rx="10" fill="#264387" stroke="#264387" stroke-width="3"/><text x="280" y="415" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">SPA</text><text x="280" y="465" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">inside wall →</text><rect x="836" y="240" width="24" height="360" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="0"/><text x="848" y="640" font-size="30" font-weight="600" fill="#5b6478" text-anchor="middle">wall</text><rect x="570" y="268" width="200" height="92" rx="10" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="670" y="308" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">EMERGENCY</text><text x="670" y="348" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">SHUTOFF</text><rect x="625" y="390" width="90" height="115" rx="8" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="670" y="460" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">OFF</text><line x1="300" y1="500" x2="625" y2="450" stroke="#5b6478" stroke-width="3" stroke-dasharray="10 8"/><text x="400" y="505" font-size="32" font-weight="700" text-anchor="start" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">within sight</text><text x="400" y="505" font-size="32" font-weight="700" fill="#5b6478" text-anchor="start">within sight</text><line x1="470" y1="690" x2="625" y2="690" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="547.5" y="678" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">5 ft min</text><text x="547.5" y="678" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">5 ft min</text><rect x="40" y="770" width="820" height="125" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="822" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">Inside 5 ft = fail</text><text x="450" y="870" font-size="33" font-weight="600" fill="#c0392b" text-anchor="middle">The person in the water must not reach it.</text><text x="40" y="975" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">1  Readily accessible — no locked gate, no climb</text><text x="40" y="1023" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">2  Controls the recirculation and jet system</text><text x="40" y="1071" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">3  One-family dwelling spas: 680.41 does not apply</text></svg>