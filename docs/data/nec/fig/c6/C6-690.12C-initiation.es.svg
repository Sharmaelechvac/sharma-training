<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">El apagado rápido empieza afuera</title><desc id="d">Elevación de pared exterior de una vivienda con el medidor y un interruptor de inicio del apagado rápido a su lado, con placa roja reflectiva. El interruptor puede ser el desconectador de acometida, el del sistema FV u otro listado, y debe mostrar ON u OFF de un vistazo. Un dispositivo dentro del garaje no cumple la regla de vivienda.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">El apagado rápido empieza afuera</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Vivienda unifamiliar — dispositivo afuera</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 690.12(C), 690.56(C)</text><rect x="60" y="270" width="580" height="660" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="5"/><path d="M40,270 L350,182 L660,270" stroke="#1a2f61" stroke-width="6" fill="none"/><text x="350" y="322" font-size="32" font-weight="700" fill="#5b6478" text-anchor="middle">PARED EXTERIOR</text><circle cx="180" cy="480" r="62" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="180" cy="480" r="34" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="180" y="492" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">kWh</text><text x="180" y="590" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="middle">MEDIDOR</text><rect x="315" y="390" width="260" height="170" rx="10" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="445" y="445" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">INTERR. RSD</text><text x="445" y="495" font-size="34" font-weight="800" fill="#F0A846" text-anchor="middle">ON / OFF</text><text x="445" y="538" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">bien visible</text><rect x="285" y="605" width="320" height="118" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0"/><text x="445" y="655" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">APAGADO RÁPIDO</text><text x="445" y="700" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">INTERRUPTOR FV</text><circle cx="268" cy="418" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="268" y="430" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><circle cx="603" cy="418" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="603" y="430" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><circle cx="633" cy="632" r="24" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="633" y="644" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="680" y="390" width="190" height="170" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="775" y="455" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">VISIBLE</text><text x="775" y="500" font-size="30" font-weight="700" fill="#2e7d32" text-anchor="middle">DESDE LA</text><text x="775" y="538" font-size="30" font-weight="700" fill="#2e7d32" text-anchor="middle">ENTRADA</text><rect x="60" y="985" width="810" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="90" y="1033" font-size="36" font-weight="800" fill="#2e7d32" text-anchor="start">BIEN — junto al medidor, fuera de la casa</text><text x="90" y="1077" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">Los bomberos lo hallan sin entrar.</text><rect x="60" y="1115" width="810" height="110" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="90" y="1163" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">MAL — interruptor dentro del garaje</text><text x="90" y="1207" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">En vivienda, el dispositivo va afuera.</text><text x="60" y="1285" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1 Medidor — sirve el desconect. de acometida</text><text x="60" y="1329" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2 Interruptor de inicio — ON / OFF visible</text><text x="60" y="1373" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3 Rótulo — reflectivo, a 3 ft máx.</text></svg>