<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">695.4: el medio que se bloquea cerrado</title><desc id="d">Elevación de un desconectador de bomba contra incendios: placa BOMBA CONTRA INCENDIOS con letras de 1 in mín., un candado que lo bloquea en posición cerrada, sin GFPE, y un dispositivo de sobrecorriente que soporta la corriente de rotor bloqueado indefinidamente.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1400" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">695.4: el medio que se bloquea cerrado</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elevación — medio de desconexión de la bomba</text><line x1="30" y1="1342" x2="870" y2="1342" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1380" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 695.4 · 695.3</text><text x="870" y="1380" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="290" y="290" width="320" height="400" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><rect x="300" y="330" width="300" height="130" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="450" y="388" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">BOMBA CONTRA</text><text x="450" y="433" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">INCENDIOS</text><line x1="450" y1="500" x2="450" y2="610" stroke="#ffffff" stroke-width="8"/><circle cx="450" cy="500" r="14" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="662" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">LISTADO BOMBA</text><rect x="640" y="330" width="180" height="150" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="730" y="448" font-size="95" font-weight="800" fill="#264387" text-anchor="middle">F</text><line x1="652" y1="522" x2="808" y2="522" stroke="#1a2f61" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="730.0" y="510" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">letras ≥ 1 in</text><text x="730.0" y="510" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">letras ≥ 1 in</text><path d="M425 745 v-22 a25 25 0 0 1 50 0 v22" stroke="#1f2937" stroke-width="5" fill="none"/><rect x="416" y="745" width="68" height="56" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="510" y="785" font-size="33" font-weight="800" fill="#1f2937" text-anchor="start">BLOQUEADO CERRADO</text><rect x="90" y="860" width="720" height="80" rx="0" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450" y="912" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">BLOQUEABLE EN POSICIÓN CERRADA</text><rect x="90" y="985" width="720" height="95" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="450" y="1045" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="middle">Bloqueado ON y para LRC = correcto</text><rect x="90" y="1125" width="720" height="80" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1177" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">SIN GFPE en el circuito de la bomba</text><text x="450" y="1272" font-size="30" font-weight="700" fill="#5b6478" text-anchor="middle">OCPD: rotor bloqueado, indefinidamente</text></svg>