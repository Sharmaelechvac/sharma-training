<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">680.21(D) — The motor swap rule</title><desc id="d">Decision flow for a pool pump motor service call: if the motor is replaced, the outlet must have the GFCI protection 680.21(C) requires; if it does not, add the protection before leaving. A red strip notes the 2023 change extending the trigger to repaired motors, and a scope pill states the 680.21(C) limits of 150 volts to ground and 60 amps.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">680.21(D) — The motor swap rule</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Service-call decision flow (2020 rule)</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 680.21(C), 680.21(D)</text><rect x="200" y="190" width="500" height="110" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="450" y="258" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">SERVICE CALL: POOL PUMP</text><line x1="450" y1="300" x2="450" y2="350" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><rect x="150" y="350" width="600" height="120" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="400" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">MOTOR REPLACED?</text><text x="450" y="445" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">2020 trigger: replacement</text><line x1="450" y1="470" x2="450" y2="520" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><text x="470" y="505" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">YES</text><rect x="100" y="520" width="700" height="130" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="450" y="575" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">GFCI AT THE OUTLET PER</text><text x="450" y="622" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">680.21(C)?</text><line x1="250" y1="650" x2="250" y2="720" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><text x="270" y="700" font-size="32" font-weight="800" fill="#c0392b" text-anchor="start">NO</text><line x1="650" y1="650" x2="650" y2="720" stroke="#1f2937" stroke-width="4" marker-end="url(#ah)"/><text x="670" y="700" font-size="32" font-weight="800" fill="#2e7d32" text-anchor="start">YES</text><rect x="60" y="720" width="380" height="150" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="250" y="780" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">ADD GFCI BEFORE</text><text x="250" y="828" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">YOU LEAVE</text><rect x="460" y="720" width="380" height="150" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/><text x="650" y="780" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">PROTECTED —</text><text x="650" y="828" font-size="34" font-weight="800" fill="#2e7d32" text-anchor="middle">DONE</text><rect x="140.5" y="926" width="619" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="450.0" y="962" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">SCOPE: 150 V TO GROUND · 60 A MAX</text><rect x="50" y="1040" width="800" height="130" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="450" y="1095" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">2023 CHANGE: REPAIRED MOTORS</text><text x="450" y="1143" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">TRIGGER IT TOO — SEE EDITION NOTE</text><text x="450" y="1250" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">No grandfathering: the swap is the trigger.</text></svg>