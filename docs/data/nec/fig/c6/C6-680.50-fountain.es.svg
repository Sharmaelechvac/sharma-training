nchor="middle">EQUIPO</text><text x="755" y="444" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">GFCI</text><text x="755" y="490" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">LISTADO</text><line x1="610" y1="430" x2="650" y2="430" stroke="#264387" stroke-width="5"/><text x="40" y="800" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">CÓMO LEERLO</text><text x="40" y="860" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Bomba sumergible: grado piscina, con GFCI</text><text x="40" y="908" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Luminaria: equipo de fuente listado</text><text x="40" y="956" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  Escalones de entrada: aplican reglas Parte II</text><rect x="40" y="1030" width="820" height="300" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="60" y="1092" font-size="36" font-weight="800" fill="#c0392b" text-anchor="start">SOLO NEC 2023 — RETIRO 680.50(B)</text><rect x="60" y="1140" width="110" height="110" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="115" y="1206" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">PARED</text><rect x="690" y="1140" width="160" height="110" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><text x="770" y="1188" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">EQUIPO</text><text x="770" y="1232" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">SOBRE BT</text><line x1="170" y1="1210" x2="690" y2="1210" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="430.0" y="1198" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">5 ft mín.</text><text x="430.0" y="1198" font-size="36" font-weight="800" fill="#c0392b" text-anchor="middle">5 ft mín.</text>