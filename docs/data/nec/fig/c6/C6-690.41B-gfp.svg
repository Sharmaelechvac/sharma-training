<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">690.41(B) — PV ground-fault protection</title><desc id="d">One-line diagram of a PV array feeding an inverter whose listed ground-fault protection detects, interrupts, and indicates a ground fault shown as a red leakage path to ground.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1180" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">690.41(B) — PV ground-fault protection</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">One-line, DC side — detect, interrupt, indicate</text><line x1="30" y1="1122" x2="870" y2="1122" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1160" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 690.41(B); 690.11</text><text x="870" y="1160" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="240" width="240" height="220" rx="0" fill="#264387" stroke="#264387" stroke-width="3"/><text x="180" y="330" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">PV ARRAY</text><text x="180" y="385" font-size="32" font-weight="700" fill="#F0A846" text-anchor="middle">DC circuits</text><line x1="300" y1="320" x2="545" y2="320" stroke="#264387" stroke-width="5"/><line x1="300" y1="380" x2="545" y2="380" stroke="#264387" stroke-width="5"/><path d="M420,320 L420,700" stroke="#c0392b" stroke-width="4" fill="none" stroke-dasharray="10 8"/><text x="445" y="566" font-size="34" font-weight="800" fill="#c0392b" text-anchor="start">GROUND FAULT</text><text x="445" y="610" font-size="32" font-weight="600" fill="#c0392b" text-anchor="start">current leaks to ground</text><line x1="382" y1="700" x2="458" y2="700" stroke="#c0392b" stroke-width="5"/><line x1="394" y1="722" x2="446" y2="722" stroke="#c0392b" stroke-width="5"/><line x1="406" y1="742" x2="434" y2="742" stroke="#c0392b" stroke-width="5"/><rect x="545" y="240" width="330" height="280" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="710" y="300" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">INVERTER</text><rect x="570" y="325" width="280" height="165" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="710" y="364" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">LISTED PV GFP</text><text x="710" y="402" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">DETECT</text><text x="710" y="436" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">INTERRUPT</text><text x="710" y="470" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">INDICATE</text><text x="180" y="560" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start"></text><rect x="60" y="820" width="800" height="130" rx="0" fill="#ffffff" stroke="#c9d2e3" stroke-width="3"/><text x="450" y="876" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">690.11 arc-fault protection answers a different</text><text x="450" y="920" font-size="33" font-weight="700" fill="#1f2937" text-anchor="middle">failure — a series arc, not a ground fault</text></svg>