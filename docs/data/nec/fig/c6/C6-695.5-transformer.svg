<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1620" width="900" height="1620" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">695.5 — Fire pump transformer</title><desc id="d">One-line diagram of a fire pump transformer with its primary protection, no secondary OCPD, controller and motors.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1620" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">695.5 — Fire pump transformer</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Sized for locked rotor — not for 450.3</text><line x1="30" y1="1562" x2="870" y2="1562" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1600" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 695.5(B), 695.5(C)</text><text x="870" y="1600" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="275" y="200" width="350" height="90" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="258" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle">UTILITY SUPPLY</text><line x1="450" y1="290" x2="450" y2="345" stroke="#1f2937" stroke-width="4"/><rect x="130" y="345" width="640" height="150" rx="0" fill="#fdf3e0" stroke="#264387" stroke-width="3"/><text x="450" y="398" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">PRIMARY OCPD</text><text x="450" y="440" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Carries the locked-rotor sum</text><text x="450" y="478" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">indefinitely — it must not trip</text><line x1="450" y1="495" x2="450" y2="555" stroke="#1f2937" stroke-width="4"/><rect x="200" y="555" width="500" height="160" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="612" font-size="38" font-weight="800" fill="#1a2f61" text-anchor="middle">TRANSFORMER</text><text x="450" y="658" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">≥ 125% motor loads</text><text x="450" y="700" font-size="34" font-weight="600" fill="#1f2937" text-anchor="middle">+ 100% accessory</text><line x1="450" y1="715" x2="450" y2="780" stroke="#1f2937" stroke-width="4"/><rect x="250" y="780" width="400" height="100" rx="0" fill="#ffffff" stroke="#c0392b" stroke-width="3" stroke-dasharray="12 8"/><line x1="250" y1="780" x2="650" y2="880" stroke="#c0392b" stroke-width="4"/><line x1="650" y1="780" x2="250" y2="880" stroke="#c0392b" stroke-width="4"/><text x="450" y="822" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">SECONDARY OCPD</text><text x="450" y="862" font-size="32" font-weight="700" fill="#c0392b" text-anchor="middle">NOT PERMITTED</text><line x1="450" y1="880" x2="450" y2="945" stroke="#1f2937" stroke-width="4"/><rect x="225" y="945" width="450" height="100" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="3"/><text x="450" y="1005" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">FIRE PUMP CONTROLLER</text><path d="M450,1045 V1080 M275,1080 H625 M275,1080 V1110 M625,1080 V1110" stroke="#1f2937" stroke-width="4" fill="none"/><rect x="130" y="1110" width="290" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="275" y="1160" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">FIRE PUMP</text><text x="275" y="1200" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">MOTOR</text><rect x="480" y="1110" width="290" height="110" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="625" y="1160" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">JOCKEY PUMP</text><text x="625" y="1200" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">MOTOR</text><rect x="90" y="1280" width="720" height="150" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1332" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">OTHER BUILDING LOADS — NOT HERE</text><text x="450" y="1376" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">Only a 695.5(C) feeder-source</text><text x="450" y="1416" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">transformer may also supply them</text></svg>