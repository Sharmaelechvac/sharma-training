<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" width="900" height="1520" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">Article 668 — Electrolytic cells</title><desc id="d">Schematic of an electrolytic cell line inside its hatched working zone: four cells on a busbar, a DC supply that runs ungrounded, and an overhead crane whose contact parts are insulated from ground.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1520" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">Article 668 — Electrolytic cells</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Schematic cell line — the rules reverse</text><line x1="30" y1="1462" x2="870" y2="1462" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1500" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 Article 668 (668.3, 668.11, 668.32)</text><rect x="50" y="250" width="800" height="590" rx="0" fill="url(#hatch)" stroke="#F0A846" stroke-width="4"/><text x="70" y="302" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="start">CELL LINE WORKING ZONE</text><circle cx="845" cy="250" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="845" y="262" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="50" y1="360" x2="850" y2="360" stroke="#1f2937" stroke-width="6"/><rect x="300" y="330" width="120" height="30" rx="0" fill="#1f2937" stroke="#1f2937" stroke-width="0"/><line x1="360" y1="360" x2="360" y2="420" stroke="#1f2937" stroke-width="5"/><rect x="318" y="420" width="84" height="54" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="4"/><text x="440" y="452" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">INSULATED</text><text x="440" y="494" font-size="30" font-weight="800" fill="#c0392b" text-anchor="start">FROM GROUND</text><circle cx="402" cy="420" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="402" y="432" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="70" y="572" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="start">BUSBAR — CELL LINE CONDUCTORS</text><line x1="70" y1="590" x2="640" y2="590" stroke="#1a2f61" stroke-width="8"/><circle cx="300" cy="590" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="300" y="602" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><rect x="70" y="620" width="130" height="170" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="135" y="720" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">CELL 1</text><rect x="210" y="620" width="130" height="170" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="275" y="720" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">CELL 2</text><rect x="350" y="620" width="130" height="170" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="415" y="720" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">CELL 3</text><rect x="490" y="620" width="130" height="170" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><text x="555" y="720" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">CELL 4</text><rect x="640" y="640" width="200" height="200" rx="0" fill="#1a2f61" stroke="#1a2f61" stroke-width="4"/><text x="740" y="716" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">DC SUPPLY</text><text x="740" y="762" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">NO GROUND</text><text x="740" y="806" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">(668.11)</text><circle cx="640" cy="640" r="24" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="640" y="652" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><text x="70" y="900" font-size="32" font-weight="700" fill="#1a2f61" text-anchor="start">DISCONNECT = REMOVABLE BUSBAR LINK (668.13)</text><rect x="50" y="950" width="800" height="96" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="1012" font-size="32" font-weight="800" fill="#c0392b" text-anchor="middle">DO NOT GROUND IT LIKE ORDINARY WORK</text><text x="40" y="1130" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">HOW TO READ IT</text><text x="40" y="1190" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  The zone: special rules live inside it</text><text x="40" y="1238" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Crane parts touching cells stay ungrounded</text><text x="40" y="1286" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  DC process supply runs ungrounded on purpose</text><text x="40" y="1334" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">4  A pulled busbar link is the disconnect</text></svg>