<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" width="900" height="1120" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">625.54 — EV receptacle GFCI</title><desc id="d">A Siemens panel with a 2-pole GFCI breaker feeding a 14-50 receptacle labeled EV charging, GFCI protected, with a warning that the EVSE internal protection does not substitute.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1120" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">625.54 — EV receptacle GFCI</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Protection at the breaker, label at the receptacle</text><line x1="30" y1="1062" x2="870" y2="1062" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1100" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 625.54</text><text x="870" y="1100" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="60" y="220" width="300" height="420" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="4"/><text x="210" y="282" font-size="36" font-weight="800" fill="#264387" text-anchor="middle">PANEL</text><rect x="90" y="320" width="240" height="130" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="210" y="372" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">2-POLE GFCI</text><text x="210" y="416" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">BREAKER · 50 A</text><text x="210" y="520" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">240 V circuit</text><text x="210" y="566" font-size="32" font-weight="600" fill="#5b6478" text-anchor="middle">to the garage</text><line x1="360" y1="385" x2="520" y2="385" stroke="#264387" stroke-width="5" marker-end="url(#ah)"/><rect x="520" y="300" width="220" height="180" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><circle cx="630" cy="375" r="52" fill="#ffffff" stroke="#264387" stroke-width="4"/><line x1="606" y1="350" x2="606" y2="385" stroke="#264387" stroke-width="6"/><line x1="654" y1="350" x2="654" y2="385" stroke="#264387" stroke-width="6"/><line x1="618" y1="408" x2="642" y2="408" stroke="#264387" stroke-width="6"/><text x="630" y="540" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">14-50 RECEPTACLE</text><rect x="480" y="590" width="300" height="110" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="630" y="638" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">EV CHARGING</text><text x="630" y="682" font-size="30" font-weight="800" fill="#2e7d32" text-anchor="middle">GFCI PROTECTED</text><rect x="60" y="760" width="780" height="190" rx="0" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/><text x="450" y="822" font-size="34" font-weight="800" fill="#c0392b" text-anchor="middle">✗  “THE CHARGER PROTECTS ITSELF”</text><text x="450" y="872" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">The EVSE's internal system does not</text><text x="450" y="916" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">replace the 625.54 protection</text></svg>