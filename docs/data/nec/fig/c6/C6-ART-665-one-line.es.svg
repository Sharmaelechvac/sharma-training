<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1640" width="900" height="1640" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">665 — Calor por inducción y dieléctrico</title><desc id="d">Diagrama unifilar de un equipo de calentamiento por inducción: tablero, desconectador a la vista con bloqueo, dispositivo convertidor, circuito de salida que puede estar aislado de tierra con no más de 50 V a tierra en partes accesibles y el aplicador de calentamiento, con los bastidores del equipo unidos según el Artículo 250, Partes II y V.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1640" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">665 — Calor por inducción y dieléctrico</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Unifilar: alimentación al aplicador (esquema)</text><line x1="30" y1="1582" x2="870" y2="1582" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1620" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 665.1, 665.5, 665.10, 665.12, 665.26</text><rect x="40" y="230" width="195" height="130" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="137" cy="295" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="137" y="307" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><rect x="255" y="230" width="195" height="130" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="352" cy="295" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="352" y="307" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><rect x="470" y="230" width="195" height="130" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="567" cy="295" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="567" y="307" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">3</text><rect x="685" y="230" width="195" height="130" rx="0" fill="#264387" stroke="#1a2f61" stroke-width="4"/><circle cx="782" cy="295" r="30" fill="#F0A846" stroke="#1a2f61" stroke-width="3"/><text x="782" y="307" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><line x1="235" y1="295" x2="255" y2="295" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><line x1="450" y1="295" x2="470" y2="295" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><line x1="665" y1="295" x2="685" y2="295" stroke="#1f2937" stroke-width="5" marker-end="url(#ah)"/><line x1="137" y1="360" x2="137" y2="395" stroke="#F0A846" stroke-width="6"/><line x1="352" y1="360" x2="352" y2="395" stroke="#F0A846" stroke-width="6"/><line x1="567" y1="360" x2="567" y2="395" stroke="#F0A846" stroke-width="6"/><line x1="782" y1="360" x2="782" y2="395" stroke="#F0A846" stroke-width="6"/><line x1="137" y1="395" x2="782" y2="395" stroke="#F0A846" stroke-width="6"/><text x="450" y="448" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Unión de bastidores: Artículo 250,</text><text x="450" y="494" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">Partes II y V (665.26)</text><text x="60" y="560" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">1  Tablero — la fuente de alimentación</text><text x="60" y="606" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">2  Desconectador — a la vista, con bloqueo (665.12)</text><text x="60" y="652" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">3  Dispositivo convertidor</text><text x="60" y="698" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">4  Aplicador — la bobina de trabajo</text><rect x="430" y="760" width="450" height="220" rx="0" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="655" y="812" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">CIRCUITO DE SALIDA (665.5)</text><text x="655" y="860" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">puede estar aislado de tierra</text><text x="655" y="904" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">sin 50 V+ a tierra</text><text x="655" y="948" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle">en partes accesibles</text><circle cx="785" cy="1090" r="55" fill="#ffffff" stroke="#264387" stroke-width="5"/><circle cx="785" cy="1090" r="30" fill="#fdf3e0" stroke="#F0A846" stroke-width="4"/><text x="715" y="1105" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="end">bobina de trabajo</text><text x="715" y="1147" font-size="30" font-weight="700" fill="#1a2f61" text-anchor="end">+ pieza calentada</text><line x1="785" y1="980" x2="785" y2="1035" stroke="#1f2937" stroke-width="4"/><rect x="50" y="1230" width="800" height="170" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="450" y="1285" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">CONTROLES (665.7)</text><text x="450" y="1335" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">puntos enclavados: un punto energizado</text><text x="450" y="1382" font-size="32" font-weight="600" fill="#1f2937" text-anchor="middle">interruptores de pedal protegidos</text><text x="450" y="1470" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">Alimentador: grupo mayor según placa</text><text x="450" y="1518" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">+ reserva del resto (665.10)</text></svg>