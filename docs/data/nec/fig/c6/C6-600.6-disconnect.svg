<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" role="img" aria-labelledby="t d" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Inter, Arial, sans-serif"><title id="t">600.6 — Disconnect at the sign</title><desc id="d">Elevation of a pole sign: the sign circuit leaves the tenant panel, and an externally operable disconnect sits at the point where the circuit enters the sign structure, opening all ungrounded conductors. A remote disconnect must be lockable and marked at the sign.</desc><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a2f61"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#1a2f61"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#eef2f9"/><line x1="0" y1="0" x2="0" y2="18" stroke="#264387" stroke-width="4"/></pattern><pattern id="hatchred" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="18" stroke="#c0392b" stroke-width="3"/></pattern><pattern id="earth" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fdf3e0"/><circle cx="6" cy="6" r="2.5" fill="#5b6478"/><circle cx="18" cy="16" r="2" fill="#5b6478"/></pattern></defs><rect x="0" y="0" width="900" height="1500" fill="#ffffff"/><rect x="0" y="0" width="900" height="96" fill="#264387"/><rect x="0" y="96" width="900" height="8" fill="#F0A846"/><text x="30" y="62" font-size="44" font-weight="800" fill="#ffffff" text-anchor="start">600.6 — Disconnect at the sign</text><text x="30" y="150" font-size="34" font-weight="600" fill="#5b6478" text-anchor="start">Elevation: disconnect where the circuit enters.</text><line x1="30" y1="1442" x2="870" y2="1442" stroke="#c9d2e3" stroke-width="2"/><text x="30" y="1480" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">NEC 2020 600.6</text><text x="870" y="1480" font-size="32" font-weight="800" fill="#264387" text-anchor="end">Sharma Field Book</text><rect x="180" y="210" width="540" height="190" rx="10" fill="#264387" stroke="#264387" stroke-width="3"/><text x="450" y="300" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">SIGN</text><text x="450" y="352" font-size="32" font-weight="600" fill="#ffffff" text-anchor="middle">outline lighting</text><rect x="435" y="400" width="50" height="470" rx="0" fill="#eef2f9" stroke="#264387" stroke-width="3"/><rect x="455" y="430" width="230" height="130" rx="8" fill="#264387" stroke="#264387" stroke-width="3"/><text x="570" y="508" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DISCONNECT</text><circle cx="455" cy="430" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="455" y="442" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">1</text><line x1="280" y1="860" x2="560" y2="860" stroke="#1f2937" stroke-width="4"/><line x1="560" y1="860" x2="560" y2="560" stroke="#1f2937" stroke-width="4"/><line x1="560" y1="430" x2="560" y2="400" stroke="#1f2937" stroke-width="4"/><rect x="60" y="800" width="220" height="120" rx="8" fill="#eef2f9" stroke="#264387" stroke-width="3"/><text x="170" y="855" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">TENANT</text><text x="170" y="900" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">PANEL</text><line x1="30" y1="920" x2="870" y2="920" stroke="#1f2937" stroke-width="5"/><text x="630" y="700" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">circuit enters</text><text x="630" y="748" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">the sign here</text><rect x="40" y="990" width="820" height="165" rx="12" fill="#fdf3e0" stroke="#F0A846" stroke-width="3"/><text x="450" y="1045" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">Not within sight of the sign?</text><text x="450" y="1093" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">It must be capable of being locked open —</text><text x="450" y="1141" font-size="33" font-weight="600" fill="#1f2937" text-anchor="middle">and a remote disconnect is marked at the sign.</text><circle cx="66" cy="1235" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="66" y="1247" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">2</text><text x="110" y="1248" font-size="33" font-weight="600" fill="#1f2937" text-anchor="start">Opens all ungrounded conductors at once</text><text x="40" y="1310" font-size="33" font-weight="700" fill="#c0392b" text-anchor="start">The panel breaker alone is not the 600.6 disconnect.</text></svg>