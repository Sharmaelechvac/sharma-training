text x="675.0" y="818" font-size="36" font-weight="800" fill="#1a2f61" text-anchor="middle">6 ft zone</text><rect x="60" y="891" width="476" height="50" rx="25" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="298.0" y="927" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">INDIVIDUAL BRANCH CIRCUIT</text><text x="560" y="925" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">— the tub alone</text><text x="60" y="1025" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Rest of the room: Chapters 1–4 (680.72)</text><text x="60" y="1070" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Receptacles 30 A or less within 6 ft: GFCI</text><text x="60" y="1115" font-size="32" font-weight="600" fill="#1f2937" text-anchor="start">• Access without damaging the finish</text></svg>