r="middle">2</text><path d="M755,370 L755,400" stroke="#1a2f61" stroke-width="4" fill="none"/><path d="M755,480 L755,880 L700,880" stroke="#1a2f61" stroke-width="4" fill="none" stroke-dasharray="10 8"/><rect x="560" y="850" width="150" height="120" rx="0" fill="#ffffff" stroke="#264387" stroke-width="4"/><text x="635" y="900" font-size="32" font-weight="800" fill="#1a2f61" text-anchor="middle">TABLERO</text><text x="622" y="954" font-size="30" font-weight="800" fill="#1a2f61" text-anchor="middle">LETRERO 20A</text><circle cx="520" cy="910" r="26" fill="#F0A846" stroke="#F0A846" stroke-width="0"/><text x="520" y="922" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="middle">4</text><text x="60" y="1080" font-size="34" font-weight="800" fill="#1a2f61" text-anchor="start">EN TODO TRABAJO DE LETREROS</text><text x="60" y="1145" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">1  Letrero y tubo listados</text><text x="60" y="1195" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">2  Desconectador en el letrero</text><text x="60" y="1245" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">3  Salida en la entrada — 600.5(A)</text><text x="60" y="1295" font-size="34" font-weight="600" fill="#1f2937" text-anchor="start">4  Circuito dedicado de 20A</text><text x="60" y="1400" font-size="32" font-weight="600" fill="#5b6478" text-anchor="start">Cotice también el circuito + desconectador.</text></svg>